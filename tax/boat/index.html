<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="brandmark">⚓</div><div><h1>海关港城：一票货与一艘船</h1><small>关税 × 船舶吨税 · 港口运营模拟</small></div></div>
  <div class="resources">
    <button class="pill" style="cursor:pointer;color:var(--navy);font-weight:800" onclick="openManual()">📘 港城业务手册</button>
    <div class="pill">第<b id="rDay">1</b>日</div><div class="pill">客户资金<b id="rCash">¥0</b></div>
    <div class="pill">时效<b id="rSpeed">100</b></div><div class="pill">信用<b id="rCredit">80</b></div><div class="pill">证据<b id="rEvidence">70</b></div>
  </div>
</header>
<div class="main">
<aside class="panel sidebar"><h3>港城业务部门</h3><div id="chapterList"></div></aside>
<main class="panel scene" id="scene"></main>
<aside class="panel rightbar"><h3>当前业务流程</h3><div class="flow" id="flow"></div><h3 style="margin-top:18px">运营日志</h3><div class="log" id="log"></div></aside>
</div></div>
<div class="modalwrap" id="modal"><div class="modal" id="modalBody"></div></div><div class="toast" id="toast"></div>
<script>
const fmt=n=>'¥'+Math.round(n).toLocaleString('zh-CN');
const chapters=[
 {t:'港城总览',s:'双部门运营地图'},
 {t:'监管分流站',s:'货物、物品与电商'},
 {t:'原产地调度台',s:'税率入口与贸易措施'},
 {t:'申报时间塔',s:'税率时点与期限'},
 {t:'完税价格车间',s:'CIF与海关估价'},
 {t:'监管仓库',s:'修理、加工、租赁与减免税'},
 {t:'渠道项目室',s:'出口、电商、退运与稽核'},
 {t:'国际船务部',s:'吨税执照全周期'},
 {t:'港城复盘室',s:'覆盖度与重玩'}
];
const state={chapter:0,unlocked:1,day:1,cash:2600000,speed:100,credit:80,evidence:70,energy:10,logs:[],coverage:new Set(),
 channelRoutes:{},channelPayers:{},itemRates:{},channelDone:false,
 originChoice:'',rateChoice:'',originDone:false,measureChoice:'',rateSpecials:{},
 timeScenario:0,timeAnswers:{},timeDone:false,
 fees:{},valuationDone:false,estimateChoice:'',estimateDone:false,
 warehouseCases:{},warehouseDone:false,activeCase:'repair',
 projectTab:'ecom',projects:{},projectsDone:false,
 shipDocs:{},shipRate:'',shipTonnage:'',shipLicense:'',shipEvents:{},fleetCalc:{},shipExempt:{},guarantees:{},shipDone:false,
 finalDone:false,mistakes:0};
const flowSets={
0:[['接收业务','选择货运或船务部门'],['经营项目','每个决策影响资源'],['完成封账','在复盘室检查覆盖']],
1:[['识别对象','货物、物品、电商或税基外'],['确定主体','收货人、发货人、携带人或代收主体'],['进入渠道','错误分流会造成滞港']],
2:[['恢复生产链','判断最后实质性改变'],['选择基础税率','最惠国、协定、特惠或普通'],['叠加措施','暂定、配额与贸易救济']],
3:[['摆放事件','进境、申报、指运地与补税手续'],['锁定税率日','不同监管状态采用不同日期'],['检查期限','14日、15日及滞纳后果']],
4:[['拆分费用','进入、不进入或待核定'],['还原CIF','成交价加法定调整'],['估价替代','相同、类似、倒扣、计算、合理']],
5:[['建立监管状态','货物放行后仍持续跟踪'],['触发状态改变','复运、留购、转让或移用'],['重建完税价格','使用特殊估价口径']],
6:[['渠道项目','出口、电商、退运与海南'],['税款封账','免税、退税、补征或追征'],['风险处置','担保、强制与复议']],
7:[['检查船舶','船籍、净吨位与证明'],['选择执照','30日、90日或1年'],['处理靠港事件','免税、延期、续证或副本']],
8:[['七系统回放','查看本局覆盖'],['缺口提示','定位尚未体验的分支'],['重开港城','更换业务路线']]
};
function period(){return `D${state.day}`}
function log(t){state.logs.push({d:period(),t});renderLog()}
function cover(x){state.coverage.add(x)}
function affect({cash=0,speed=0,credit=0,evidence=0,mistake=false}={}){state.cash+=cash;state.speed=Math.max(0,Math.min(100,state.speed+speed));state.credit=Math.max(0,Math.min(100,state.credit+credit));state.evidence=Math.max(0,Math.min(100,state.evidence+evidence));if(mistake)state.mistakes++}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function modal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function unlock(i){state.unlocked=Math.max(state.unlocked,i)}
function nextDay(n=1){state.day+=n}
function updateUI(){document.getElementById('rDay').textContent=state.day;document.getElementById('rCash').textContent=fmt(state.cash);document.getElementById('rSpeed').textContent=state.speed;document.getElementById('rCredit').textContent=state.credit;document.getElementById('rEvidence').textContent=state.evidence;renderChapters();renderFlow();renderLog()}

const shipExemptCases={empty:{n:'境外取得所有权后初次进口到港的空载船舶',ans:'免税'},barge:{n:'非机动驳船',ans:'按同净吨位税率50%计征'},fishing:{n:'捕捞养殖渔船',ans:'免税'},within24:{n:'执照期满后24小时内不上下客货',ans:'免税'}};
const guaranteeCases=['人民币','可兑换货币','票据债券存单','金融机构保函','海关认可的财产权利','客户口头承诺'];
function setFleet(k,v){state.fleetCalc[k]=v;renderScene();renderFlow()}
function setShipExempt(k,v){state.shipExempt[k]=v;renderScene();renderFlow()}
function toggleGuarantee(x){state.guarantees[x]=!state.guarantees[x];renderScene();renderFlow()}
function renderShip(el){const net=shipNet();el.innerHTML=`<div class="scenehead"><div><div class="kicker">系统七 · 国际船务与吨税执照</div><h2>一艘船的税务任务从入港当日持续到离港</h2><p>本船自境外港口驶入。检查证件、确定税率和净吨位，再选择与靠港计划匹配的执照。</p></div><div class="objective"><b>船期计划</b>未来70日内预计靠港3次<br><b>缴税期限</b>海关填发缴款凭证后15日内</div></div>
<div class="shipyard"><div class="shipmodel">🚢</div><div class="dockoffice"><h3>“远洋星”船舶档案</h3><div class="docrow"><span>船舶国籍证书</span><input type="checkbox" ${state.shipDocs.national?'checked':''} onchange="state.shipDocs.national=this.checked;renderFlow()"></div><div class="docrow"><span>船舶吨位证明</span><input type="checkbox" ${state.shipDocs.tonnage?'checked':''} onchange="state.shipDocs.tonnage=this.checked;renderFlow()"></div><div class="docrow"><span>船籍国与我国有船舶税费最惠国互惠条款</span><input type="checkbox" ${state.shipDocs.treaty?'checked':''} onchange="state.shipDocs.treaty=this.checked;renderFlow()"></div>
<h4>税率入口</h4><div class="choicegrid">${['优惠税率','普通税率','中国籍船舶不征吨税'].map(x=>`<div class="choice ${state.shipRate===x?'selected':''}" onclick="state.shipRate='${x}';renderScene();renderFlow()">${x}</div>`).join('')}</div><h4>净吨位资料</h4><select onchange="state.shipTonnage=this.value;renderScene();renderFlow()" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:10px"><option>选择净吨位或折算方式</option>${['登记净吨位6800','拖船：1200kW×0.67','无证明游艇：1800kW×0.05'].map(x=>`<option ${state.shipTonnage===x?'selected':''}>${x}</option>`).join('')}</select><p>当前计税净吨位：<b>${net||'待确定'}</b></p><h4>执照期限</h4><div class="licensegrid">${['30日','90日','1年'].map(x=>`<div class="license ${state.shipLicense===x?'selected':''}" onclick="state.shipLicense='${x}';renderScene();renderFlow()"><b>${x}</b><small>${x==='90日'?'匹配70日多次靠港计划':x==='30日'?'可能需要频繁续证':'资金占用较高'}</small></div>`).join('')}</div></div></div>
<h3>船队吨位折算</h3><div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))">${Object.entries(fleetCases).map(([k,v])=>`<div class="card"><h4>${v.n}</h4><div class="choicegrid">${v.opts.map(x=>`<div class="choice ${state.fleetCalc[k]===x?'selected':''}" onclick="setFleet('${k}','${x}')">${x}</div>`).join('')}</div></div>`).join('')}</div>
<h3>免税与半税船舶</h3><div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))">${Object.entries(shipExemptCases).map(([k,v])=>`<div class="card"><h4>${v.n}</h4><div class="choicegrid">${['免税','按同净吨位税率50%计征','照章全额征税'].map(x=>`<div class="choice ${state.shipExempt[k]===x?'selected':''}" onclick="setShipExempt('${k}','${x}')">${x}</div>`).join('')}</div></div>`).join('')}</div>
<h3>到港前先行申报担保</h3><div class="coverage">${guaranteeCases.map(x=>`<span class="badge ${state.guarantees[x]?'hit':''}" style="cursor:pointer" onclick="toggleGuarantee('${x}')">${state.guarantees[x]?'✓':'○'} ${x}</span>`).join('')}</div>
<h3>执照期内靠港事件</h3><div class="eventstrip">${Object.entries(shipEvents).map(([k,v])=>`<div class="shipevent ${state.shipEvents[k]?'done':''}" onclick="openShipEvent('${k}')"><b>${v.n}</b><small>${v.d}</small></div>`).join('')}</div><div class="notice">拖船按发动机功率×0.67折算净吨位；无净吨位证明的游艇按功率×0.05折算。拖船和非机动驳船按同净吨位船舶税率的50%计征，但非机动船舶本身免税。</div><div class="actions"><button class="btn" onclick="finishShip()">完成船舶离港封账</button><button class="btn secondary" onclick="goChapter(0)">返回港城</button></div>`}
function openShipEvent(k){const e=shipEvents[k];modal(`<div class="modalhead"><div><div class="kicker">吨税执照事件</div><h2>${e.n}</h2><p>${e.d}</p></div><button class="close" onclick="closeModal()">×</button></div><div class="choicegrid" style="margin-top:14px">${['直接免税','按实际天数延长执照','不属于执照延期事由','原执照继续有效','从期满次日起申领新执照并续税','向原海关申请副本且不补税'].map(x=>`<div class="choice ${state.shipEvents[k]===x?'selected':''}" onclick="answerShipEvent('${k}','${x}');closeModal()">${x}</div>`).join('')}</div>`)}
function finishShip(){if(!state.shipDocs.national||!state.shipDocs.tonnage||!state.shipDocs.treaty||!state.shipRate||!state.shipTonnage||!state.shipLicense){toast('请完成证件、税率、净吨位和执照选择');return}let m=0;if(state.shipRate!=='优惠税率')m++;if(state.shipTonnage!=='登记净吨位6800')m++;if(state.shipLicense!=='90日')m++;for(const [k,v] of Object.entries(shipEvents)){if(state.shipEvents[k]!==v.ans)m++}for(const [k,v] of Object.entries(fleetCases)){if(state.fleetCalc[k]!==v.ans)m++}for(const [k,v] of Object.entries(shipExemptCases)){if(state.shipExempt[k]!==v.ans)m++}for(const x of guaranteeCases){const should=x!=='客户口头承诺';if(!!state.guarantees[x]!==should)m++}affect({cash:-m*18000,credit:-m*2,speed:-m*2,mistake:m>0});state.shipDone=true;cover('境外来船与优惠普通税率');cover('净吨位、拖船与游艇折算');cover('吨税担保形式');cover('30日、90日和1年执照');cover('吨税免税与50%计征');cover('空载初次进口、渔船及24小时免税');cover('执照延期、续证、继续有效与副本');cover('吨税入港日义务和15日缴税');log(`远洋星完成离港封账：纠正 ${m} 项船务处理。`);unlock(8);nextDay(3);state.chapter=8;renderScene();updateUI()}
const allCoverage=['货物、物品与跨境电商分流','关税纳税人和代收代缴','合理自用与一般贸易转换','无形资产税基边界','进境物品归类与13/20/50综合税率','完全获得与最后实质性改变','最惠国、协定、特惠和普通税率','暂定税率适用','贸易救济孰高规则','最惠国低于协定、普通税率、配额与出口暂定比较','一般、先行申报与转关税率日','状态改变办理纳税手续日','违法追征税率日','出口转关、集中申报、撤单重报、两步申报与变卖税率日','14日申报与15日缴税','延期缴税与0.5‰滞纳金','进口完税价格CIF边界','佣金、协助、特许权与进口后费用','运保费核定','卖方后续收益、境内复制与融资利息边界','海关五级估价顺序','相同类似货物最低价与45日','倒扣、计算方法顺序调换','合理方法禁止事项','境外修理与加工复运','租赁进口与留购','暂时进境6个月复运','减免税监管折旧补税','软件介质单独计价','出口完税价格与四种计征方式','跨境电商5000/26000与70%','跨境电商30日退货恢复额度','海南一线二线与30%加工增值','法定免税、原状退运与无代价抵偿','暂不缴税、边民互市与边境小额贸易','退税、补征、追征与复议前置','境外来船与优惠普通税率','净吨位、拖船与游艇折算','吨税担保形式','30日、90日和1年执照','吨税免税与50%计征','空载初次进口、渔船及24小时免税','执照延期、续证、继续有效与副本','吨税入港日义务和15日缴税'];
function renderSummary(el){const pct=Math.round(state.coverage.size/allCoverage.length*100);el.innerHTML=`<div class="scenehead"><div><div class="kicker">港城复盘 · 本局业务档案</div><h2>你不是回答了一套题，而是运营了一条海关供应链</h2><p>复盘只回放本局实际做过的业务，并标出尚未亲手操作的考点。</p></div><div class="objective"><b>覆盖度</b>${state.coverage.size}/${allCoverage.length}（${pct}%）<br><b>偏差次数</b>${state.mistakes}<br><b>期末资金</b>${fmt(state.cash)}</div></div>
<div class="summarygrid"><div class="summarycard"><h4>关税业务链</h4><p>监管分流 → 原产地与税率 → 税率日期 → 完税价格 → 特殊监管 → 渠道与征管。</p><div class="coverage">${allCoverage.slice(0,allCoverage.indexOf('境外来船与优惠普通税率')).map(x=>`<span class="badge ${state.coverage.has(x)?'hit':'miss'}">${state.coverage.has(x)?'✓':'○'} ${x}</span>`).join('')}</div></div><div class="summarycard"><h4>船舶吨税业务链</h4><p>境外来船 → 船籍税率 → 净吨位 → 执照期限 → 靠港事件 → 离港或续证。</p><div class="coverage">${allCoverage.slice(allCoverage.indexOf('境外来船与优惠普通税率')).map(x=>`<span class="badge ${state.coverage.has(x)?'hit':'miss'}">${state.coverage.has(x)?'✓':'○'} ${x}</span>`).join('')}</div></div><div class="summarycard"><h4>经营结果</h4><div class="flowrow"><div class="dot">¥</div><div><b>客户资金 ${fmt(state.cash)}</b><small>错误归类、错用税率和逾期都会侵蚀资金</small></div></div><div class="flowrow"><div class="dot">⏱</div><div><b>通关时效 ${state.speed}</b><small>流程重做和资料补正会延误放行</small></div></div><div class="flowrow"><div class="dot">★</div><div><b>海关信用 ${state.credit}</b><small>影响后续查验和担保压力</small></div></div></div><div class="summarycard"><h4>仍可通过重玩强化</h4><p>${pct===100?'本局已完成全部核心操作覆盖。可以更换判断顺序，观察资源结果差异。':'尚有未点亮考点。返回对应部门补做项目，或重开港城更换处理路线。'}</p><div class="actions"><button class="btn" onclick="restartGame()">重开港城</button><button class="btn secondary" onclick="goChapter(0)">返回总览</button></div></div></div>`}
function openManual(){modal(`<div class="modalhead"><div><div class="kicker">港城业务手册 · 按业务动作检索</div><h2>低频规则不做孤立刷题，但在需要时可以立即查到</h2><p>手册内容按本游戏的实际操作顺序编排。</p></div><button class="close" onclick="closeModal()">×</button></div>
<div class="summarygrid" style="margin-top:14px"><div class="summarycard"><h4>监管入口与税率</h4><p>进境物品先按列名归类，未列名按主要功能用途，再归其他物品。综合税率为13%、20%、50%。原产地完全获得或以最后实质性改变确定；条约协定有特别规则时优先。普通税率货物不得使用暂定税率。税率调整权限分属全国人大常委会、国务院及国务院关税税则委员会。</p></div><div class="summarycard"><h4>税率时点补充</h4><p>一般货物和物品按完成申报日；先行申报、转关、集中申报、撤单重报、两步申报、海关变卖均有专门时点。保税内销、减免税转让移用、暂时进出境不复运和租赁留购按办理纳税手续日。</p></div><div class="summarycard"><h4>进口估价补充</h4><p>运费无法确定按同期正常运输成本核定；保险无法确定或未发生时按货价加运费的3‰。自身动力进境的运输工具不另计运费；邮运以邮费合并确定运保费。倒扣法没有45日内销售时可延至申报日前后90日。合理方法不得使用国产货售价、较高备选价、出口地市场价、第三国售价、最低限价或虚构价格。</p></div><div class="summarycard"><h4>特殊货物补充</h4><p>租赁申请一次性缴税时可在海关估价金额与租金总额之间选择。易货、寄售、捐赠和赠送等无成交价格货物经磋商后按估价顺序。减免税补税月份不足1个月但超过15日按1个月，不超过15日不计；移作他用每日不足或超过8小时均按1日。</p></div><div class="summarycard"><h4>征免与征管补充</h4><p>运输工具途中必需燃料物料和饮食用品、外国政府或国际组织无偿赠送物资等法定免税。展览、文体、新闻、科研医疗、货样、调试工具和包装等非商业货物一般在6个月内复运可暂不缴税。海关确认溢征后，纳税人在确认书后3个月办理；自行发现多缴可在缴税后3年内申请。走私追征不受期限限制。</p></div><div class="summarycard"><h4>强制、担保与救济</h4><p>税款优先于无担保债权；先发生欠税时优先于后设抵押质权。税款与罚没款不足同时支付时先缴税。存在转移藏匿风险且不提供担保时，海关可冻结或查封扣押相当税额财产。对归类、原产地、计价、税率和税额等征税事项有异议，先复议后诉讼。</p></div><div class="summarycard"><h4>吨税补充</h4><p>自境外港口进入境内港口的中国籍船舶同样进入吨税范围。应纳吨税不超过50元、空载初次进口船、捕捞养殖渔船、军警船和外交船等免税。避难、隔离、修理、改造、终止运营或拆解且不上下客货时免税；执照期内避难、隔离、修理、改造或被军警征用按实际天数延长，补充供给不延长。</p></div><div class="summarycard"><h4>吨税证件与后续</h4><p>义务发生于船舶进入港口当日；执照期满未离港，从次日起申领新执照。到港前先行申报先提供担保。申领时提交船籍和吨位证明，入境时领取或交验，出境时核验。执照期内净吨位、税率或船籍变化，原执照继续有效；执照遗失向原海关申请副本且不补税。</p></div></div>`)}
function restartGame(){location.reload()}
log('港城开始营业：先处理6票混合货物。');renderScene();updateUI();
</script>
