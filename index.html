<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrystalShrimp</title>
<style>
:root {
  --bg: #0e0e14;
  --bg-2: #16161f;
  --card: #1c1c28;
  --border: #2a2a3a;
  --text: #e8e8ef;
  --text-dim: #9a9aae;
  --accent: #e85d75;
  --accent-2: #ffa45c;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); min-height: 100vh; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  line-height: 1.6;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
header { text-align: center; margin-bottom: 40px; }
header h1 {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 1px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
header p {
  margin-top: 8px;
  color: var(--text-dim);
  font-size: 14px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  width: 100%;
  max-width: 920px;
}
.card {
  display: block;
  text-decoration: none;
  color: inherit;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 26px 24px;
  transition: transform 0.2s, border-color 0.2s, background 0.2s;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  opacity: 0.7;
}
.card:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
  background: var(--bg-2);
}
.card .tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--accent-2);
  margin-bottom: 10px;
}
.card h2 {
  font-size: 19px;
  font-weight: 600;
  margin-bottom: 6px;
}
.card .desc {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.55;
}
footer {
  margin-top: 50px;
  font-size: 12px;
  color: var(--text-dim);
  opacity: 0.7;
}
</style>
</head>
<body>

<header>
  <h1>CrystalShrimp</h1>
  <p>个人站点入口 · 选择一个页面进入</p>
</header>

<nav class="grid">
  <a class="card" href="cpa.html">
    <span class="tag">Study</span>
    <h2>CPA 会计 · 狂击版</h2>
    <p class="desc">注册会计师会计科目练习页面。</p>
  </a>
  <a class="card" href="music/music_1/">
    <span class="tag">Music · DE</span>
    <h2>Schmutzige Seele</h2>
    <p class="desc">德语歌词发音练习 · 单词发音卡片 + 整句朗读 + 背景音乐。</p>
  </a>
  <a class="card" href="music/music_2/">
    <span class="tag">Music · DE</span>
    <h2>Nachtserenade</h2>
    <p class="desc">德语歌词发音练习 · 单词发音卡片 + 整句朗读 + 背景音乐。</p>
  </a>
</nav>

<footer>CrystalShrimp.github.io</footer>

</body>
</html>
