交所得税=（210-10+20-20）×25%=50（万元），确认递延所得税费用=25-20=5（万元），甲公司2×25年确认的所得税费用=应交所得税+递延所得税费用=50+5=55（万元）。或：甲公司2×25年的所得税费用=（210-10+20）×25%=55（万元）。"}]},{"type":"多项选择题","questions":[{"num":1,"text":"下列各项中，能够产生可抵扣暂时性差异的有（ ）。","options":[{"letter":"A","text":"超标的业务招待费"},{"letter":"B","text":"账面价值小于其计税基础的负债"},{"letter":"C","text":"超过本期税法扣除限额可以结转以后年度税前扣除的业务宣传费"},{"letter":"D","text":"按税法规定可以结转以后年度的未弥补亏损"}],"answer":"CD","explanation":"选项A，不产生暂时性差异；选项B，负债账面价值小于计税基础，产生应纳税暂时性差异；选项C和D，虽然没有形成资产的账面价值，但未来计算应纳税所得额时可以纳税调减，产生可抵扣暂时性差异。"},{"num":2,"text":"不考虑其他因素，企业发生的下列各项交易或事项中，应确认递延所得税资产的有（A.某项使用寿命不确定的外购无形资产，减值测试结果显示未发生减值，税法规定按该项无形资产的取得成本采用直线法在10年内摊销的金额税前抵扣B.因违反法律法规被处以罚款，税法规定计算应纳税所得额时不得税前抵扣C．发生广告费支出全部计人当期销售费用，其中超出当期销售收入15% 的部分，按税法规定可结转至以后年度税前抵扣D.持有的作为交易性金融资产的股票，期末股票价格低于购买成本发生的损失，税法规定按初始取得成本作为计税基础","options":[],"answer":"CD","explanation":"选项A，确认递延所得税负债；选项B，不确认递延所得税；选项C和D，确认递延所得税资产。"},{"num":3,"text":"下列关于企业递延所得税负债会计处理的表述中，正确的有（ ）。","options":[{"letter":"A","text":"非同一控制下吸收合并免税合并下，商誉初始确认时形成的应纳税暂时性差异应确认相应的递延所得税负债"},{"letter":"B","text":"与损益相关的应纳税暂时性差异确认的递延所得税负债应计人所得税费用"},{"letter":"C","text":"应纳税暂时性差异转回期间超过一年的，相应的递延所得税负债应以现值计量"},{"letter":"D","text":"递延所得税负债以相关应纳税暂时性差异转回期间适用的企业所得税税率计量"}],"answer":"BD","explanation":"选项A，非同一控制下吸收合并免税合并下，商誉初始确认时形成的应纳税暂时性差异不应确认递延所得税负债；选项C，无论应纳税暂时性差异何时转回，递延所得税负债都不要求折现。"},{"num":4,"text":"甲公司适用所得税税率为25%，其2×25年发生的交易或事项中，会计与税法处理存在差异的事项如下：（1）当期购入指定为以公允价值计量且其变动计入其他综合收益的股票投资，期末公允价值大于取得成本200万元；（2）收到与资产相关的政府补助600万元（采用总额法核算），税法规定将其计人当期应纳税所得额，相关资产至年末尚未开始计提折旧。甲公司2×25年度利润总额为3000万元，假定递延所得税资产、负债年初余额为零，未来期间能够取得足够的应纳税所得额用以利用可抵扣暂时性差异。下列甲公司2×25年所得税的处理中，正确的有（ ）。","options":[{"letter":"A","text":"所得税费用为800万元"},{"letter":"B","text":"应交所得税为900万元"},{"letter":"C","text":"递延所得税负债为50万元"},{"letter":"D","text":"与资产相关的政府补助确认的递延收益不应确认递延所得税资产"}],"answer":"BC","explanation":"2×25年年末指定为以公允价值计量且其变动计入其他综合收益的金融资产的账面价值大于计税基础（取得成本）200万元，形成应纳税暂时性差异，应确认递延所得税负债的金额 $= 2 0 0 \\times 2 5 \\% = 5 0$ （万元），对应其他综合收益，不影响所得税费用，选项C正确；与资产相关的政府补助，按税法规定在取得的当年全部计人应纳税所得额，其计税基础为0,递延收益的账面价值为600万元，应确认递延所得税资产的金额 $= 6 0 0 \\times 2 5 \\% = 1 5 0$ （万元），选项D错误；甲公司2×25年应交所得税=（3000+600）×25%=900（万元），选项B正确；所得税费用的金额=900-150=750（万元），选项A错误。"}]},{"type":"计算分析题","questions":[{"num":1,"text":"2×25年1月1日，承租人甲公司与出租人乙公司签订了为期5年的办公楼租赁合同。每年的租赁付款额为50万元，在每年年末支付。甲公司无法确定租赁内含利率，其增量借款年利率为5%。甲公司已支付与该租赁相关的初始直接费用6万元。甲公司取得的使用权资产从取得当月开始采用直线法按5年计提折旧。假设利息费用不符合资本化条件。假定按照适用税法规定，该交易属于税法上的经营租赁，甲公司支付的初始直接费用于实际发生时一次性税前扣除，每期支付的租金允许在支付当期进行税前抵扣，甲公司适用的所得税税率为25%。假设甲公司未来期间能够取得足够的应纳税所得额用以抵扣可抵扣暂时性差异。已知：（P/A，5%，5）=4.3295。 不考虑所得税以外的其他相关税费及其他因素。 要求： （1）计算租赁期开始日租赁负债的账面价值和计税基础、未确认融资费用入账金额、使用权资产账面价值和计税基础、应确认的递延所得税资产和递延所得税负债，并编制租赁期开始日相关会计分录。 （2）计算2×25年甲公司应确认的利息费用并编制会计分录。 （3）计算2×25年甲公司使用权资产计提的折旧额并编制会计分录。 （4）编制2×25年12月31日甲公司支付租金的会计分录。 （5）编制2×25年12月31日与递延所得税资产和递延所得税负债有关的会计分录。（计算结果保留两位小数）","options":[],"answer":null,"explanation":null},{"num":2,"text":"甲公司适用的所得税税率为25%。2×25年1月1日就某栋建筑物与出租人乙公司签订了为期5年的租赁协议，并拥有1年的续租选择权，租入后供管理部门使用。有关资料如下： （1）初始租赁期内的不含税租金为每年202万元，续租期间为每年222万元，所有款项应于每年年初支付。 （2）为获得该项租赁，甲公司发生的初始直接费用为60万元，其中，44万元为向该栋建筑物前任租户支付的款项，16万元为向促成此租赁交易的房地产中介支付的佣金。 （3）作为对甲公司的激励，乙公司同意补偿甲公司16万元的佣金。从第2年开始，如果每年1月1日甲公司能按时支付租金，则乙公司每年给予减少租金2万元的奖励，甲公司合理确定每年均能按时支付租金。 （4）在租赁期开始日，甲公司评估后认为，不能合理确定将行使续租选择权，因此，将租赁期确定为5年。 （5）甲公司无法确定租赁内含利率，其增量借款利率为每年6%。 甲公司取得的使用权资产从取得当月开始采用直线法按5年计提折旧。假设利息费用不符合资本化条件。 假定按照适用税法规定，该租赁为融资租赁，融资租人的资产以租赁合同约定的付款总额和承租人在签订租赁合同过程中发生的相关费用作为计税基础，折旧方法及折旧年限等与会计规定一致。 已知：（P/A，6%，4）=3.4651。 不考虑所得税以外的其他相关税费及其他因素。 要求： （1）计算租赁期开始日租赁负债的账面价值和计税基础、未确认融资费用入账金额、使用权资产账面价值和计税基础、应确认的递延所得税资产和递延所得税负债，并编制租赁期开始日相关会计分录。 （2）计算2×25年甲公司应确认的利息费用并编制会计分录。 （3）计算2×25年甲公司使用权资产计提的折旧额并编制会计分录。 （4）编制2×25年12月31日与递延所得税资产和递延所得税负债有关的会计分录。 （5）编制2×26年1月1日甲公司支付租金的会计分录。 （6）计算2×26年甲公司应确认的利息费用并编制会计分录。（计算结果保留两位小数）","options":[],"answer":null,"explanation":null},{"num":3,"text":"甲公司为境内上市公司，适用的企业所得税税率为25%，2×25年度，甲公司发生的有关交易或事项如下： （1）2×25年1月1日，以银行存款3000万元从二级市场购入乙公司当日发行的2年期公司债券，该债券票面价值为3000万元，票面年利率为4%（等于实际年利率），每年12月31日付息，到期还本；以银行存款1200万元购人丙公司（非上市公司）10%股权，对丙公司不具有控制、共同控制和重大影响；以银行存款500万元从二级市场购入一组股票组合。 甲公司对金融资产在组合层次上确定业务模式并进行分类：对于持有的1000万元乙公司债券的管理是以收取合同现金流量为目标的业务模式，对于持有的2000万元乙公司债券，其业务模式为收取合同现金流量并满足流动性需求，即甲公司对该部分债券以收取合同现金流量进行日常管理，但当甲公司资金发生紧缺时，将出售该债券，以保证经营所需的流动资金；对持有的丙公司股权进行指定，除了持有该股份分得的现金股利外，该投资的任何价值变动以及处置均不影响净利润；对于股票组合，以公允价值进行管理，并与投资人员的业绩挂钩。 2×25年12月31日，1000万元乙公司债券的公允价值为1050万元；2000万元乙公司债券的公允价值为2150万元；对丙公司股权投资的公允价值为1300万元；股票组合的公允价值为450万元。 （2）2×25年6月20日，甲公司购人一台研发设备并投人使用，设备价款为480万元。该设备预计使用5年，预计净残值为零，采用年限平均法计提折旧，折旧计人管理费用。其他相关资料： 第一，2×25年初，甲公司递延所得税资产和递延所得税负债无余额。 第二，企业购入设备价值在500万元以下的，允许一次性计入当期成本费用在计算应纳税所得额时扣除。 第三，甲公司预计未来年度有足够的应纳税所得额用以抵扣可抵扣暂时性差异。甲公司按照净利润的10%提取盈余公积。 要求： （1）根据资料（1），说明甲公司购入的各项金融资产在初始确认时应当如何分类，并说明理由。 （2）根据资料（1）和（2），计算甲公司2×25年应确认的递延所得税资产、递延所得税负债，并编制与递延所得税相关的会计分录。","options":[],"answer":null,"explanation":null}]}]},{"chTitle":"第二十章 非货币性资产交换","header":"## 第二十章 非货币性资产交换\n\n考情速览\n\n<table><tr><td colspan=\"2\"></td></tr><tr><td>复习难度 ★★</td><td>常考题型 近5年考试平均分值</td></tr><tr><td>客观题</td><td>2.5分左右</td></tr><tr><td colspan=\"2\">学习指南 本章考题以客观题为主，有的主观题也涉及本章内容，属于不太重要章节。</td></tr></table>\n\n## 教材主要变化\n\n无变化。\n\n## 考点框架\n\n<table><tr><td rowspan=1 colspan=3>非货币性资产交换</td></tr><tr><td rowspan=2 colspan=1>非货币性资产交换的概念</td><td rowspan=1 colspan=1>非货币性资产交换的相关概念</td><td rowspan=1 colspan=1>●0０易</td></tr><tr><td rowspan=1 colspan=1>非货币性资产交换不涉及的交易和事项</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=3 colspan=1>非货币性资产交换的确认和计量</td><td rowspan=1 colspan=1>非货币性资产交换的确认原则</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=1 colspan=1>非货币性资产交换的计量原则</td><td rowspan=1 colspan=1>●中</td></tr><tr><td rowspan=1 colspan=1>商业实质的判断</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=2 colspan=1>非货币性资产交换的会计处理</td><td rowspan=1 colspan=1>涉及单项非货币性资产交换的会计处理</td><td rowspan=1 colspan=1>难</td></tr><tr><td rowspan=1 colspan=1>涉及多项非货币性资产交换的会计处理</td><td rowspan=1 colspan=1>难</td></tr></table>\n\n# 考点剖析\n\n本章与固定资产、无形资产、长期股权投资、金融资产等相关资产的初始计量紧密相连，前述章节内容是学习本章的基础。可先复习前述章节，再开启本章的学习。","sections":[{"title":"第一节非货币性资产交换的概念","content":"恭喜您解锁新章节！使用微信或\"会计云课堂\"App 扫码，过关更高效！\n\n\n\n\n\n## 一、非货币性资产交换的相关概念\n\n考点难度●○○易\n\n<table><tr><td rowspan=1 colspan=1>项目</td><td rowspan=1 colspan=1>概念</td><td rowspan=1 colspan=1>内容及注意事项</td></tr><tr><td rowspan=1 colspan=1>货币性资产</td><td rowspan=1 colspan=1>是指企业持有的货币资金和收取固定或可确定金额的货币资金的权利</td><td rowspan=1 colspan=1>现金、银行存款、应收账款、应收票据、债权投资等</td></tr><tr><td rowspan=1 colspan=1>非货币性资产</td><td rowspan=1 colspan=1>是指货币性资产以外的资产</td><td rowspan=1 colspan=1>预付账款、存货、固定资产、在建工程、生产性生物资产、无形资产、投资性房地产、其他权益工具投资、长期股权投资等</td></tr><tr><td rowspan=1 colspan=1>非货币性资产交换</td><td rowspan=1 colspan=1>是指企业主要以固定资产、无形资产、投资性房地产和长期股权投资等非货币性资产进行的交换，该交换不涉及或只涉及少量的货币性资产（即补价）</td><td rowspan=1 colspan=1>认定涉及少量货币性资产的交换为非货币性资产交换，通常以补价占整个资产交换金额的比例是否低于25%作为参考。若补价整个资产交换金额&lt;25%，则属于非货币性资产交换；若补价整个资产交换金额≥25%，不视为非货币性资产交换，适用《企业会计准则第14号—收人》等相关准则的规定</td></tr></table>\n\n## 提示\n\n（1）补价是换入资产与换出资产公允价值之间的差额，不含增值税的差额。\n\n（2）整个资产交换金额即在整个非货币性资产交换中最大的公允价值。如，甲公司用一台设备换入乙公司一项专利权，设备公允价值为100万元，增值税为13万元，专利权公允价值为90万元，增值税为5.4万元，甲公司收到补价17.6万元。\n\n判断该交换是否属于非货币性资产交换：补价中公允价值之间的差额为10万元，10÷100×100%=10%，小于25%，属于非货币性资产交换。\n\n（3）通常情况下，交易双方对于某项交易是否为非货币性资产交换的判断是一致的。需要注意的是，对非货币性资产交换进行判断，企业应从自身的角度，根据交易的实质判断相关交易是否属于准则定义的非货币性资产交换，不应基于交易双方的情况进行判断。例如，投资方以一项固定资产出资取得对被投资方的权益性投资，对于投资方来说，换出资产为固定资产，换入资产为长期股权投资，属于非货币性资产交换；对于被投资方来说，虽取得了实物资产，但属于接受权益性投资，不属于非货币性资产交换。\n\n【例题1·多选题】下列各项资产中，属于货币性资产的有（ ）。A.银行存款\nB.预付款项\nC.以公允价值计量且其变动计人当期损益的金融资产\nD.应收票据\n\n解析货币性资产指企业持有的货币资金或将以固定或可确定的金额收取的资产。选项B和C，属于非货币性资产。\n\n## 二、非货币性资产交换不涉及的交易和事项5年热点丨4次\n\n考点难度●○○易\n\n<table><tr><td rowspan=1 colspan=1>交易和事项</td><td rowspan=1 colspan=1>适用准则</td></tr><tr><td rowspan=1 colspan=1>换出资产为存货的非货币性资产交换</td><td rowspan=1 colspan=1>《企业会计准则第14号—收人》</td></tr><tr><td rowspan=1 colspan=1>非货币性资产交换中涉及的企业合并</td><td rowspan=1 colspan=1>《企业会计准则第2·号—长期股权投资》《企业会计准则第20号——企业合并》和《企业会计准则第33号—合并财务报表》点拨  非货币性资产交换中，取得对联营企业或合营企业的投资，适用《企业会计准则第7号—非货币性资产交换》</td></tr><tr><td rowspan=1 colspan=1>非货币性资产交换中涉及的金融资产</td><td rowspan=1 colspan=1>金融资产的确认、终止确认和计量适用《企业会计准则第22号—金融工具确认和计量》和《企业会计准则第23号—金融资产转移》</td></tr><tr><td rowspan=1 colspan=1>非货币性资产交换中涉及使用权资产或应收融资租赁款</td><td rowspan=1 colspan=1>相关资产的确认、终止确认和计量适用《企业会计准则第21号—租赁》</td></tr><tr><td rowspan=1 colspan=1>非货币性资产交换构成权益性交易</td><td rowspan=1 colspan=1>非货币性资产交换的一方直接或间接对另一方持股且以股东身份进行交易的，或者非货币性资产交换的双方均受同一方或相同的多方最终控制，且该非货币性资产交换的交易实质是交换的一方向另一方进行了权益性分配或交换的一方接受了另一方权益性投人，应当适用权益性交易的有关会计处理规定，不确认构成权益性交易部分的相关损益</td></tr></table>\n\n例（真）题-答案」1.AD\n\n提示 下列事项不属于非货币性资产交换，不适用非货币性资产交换准则：\n\n①企业从政府无偿取得非货币性资产；\n\n②企业将非流动资产或处置组分配给所有者；\n\n③企业以非货币性资产向职工发放非货币性福利；\n\n④企业以发行股票形式取得非货币性资产；\n\n③企业用于交换的资产目前尚未列报于资产负债表上、或不存在或尚不属于本企业。\n\n【例题2·单选题】对于甲公司而言，下列各项交易中，应当认定为非货币性资产交换进行会计处理的是（ ）。A.甲公司以一批产成品交换乙公司一台汽车B.甲公司以所持丙公司20% 股权（具有重大影响）交换乙公司一批原材料C．甲公司以应收丁公司的2200万元银行承兑汇票交换乙公司一栋办公用房D.甲公司以一项专利权交换乙公司一项非专利技术，并以银行存款收取补价，所收取补价占换出专利权公允价值的30%\n\n（解析）选项A，企业以存货换取其他企业固定资产、无形资产等，换出存货的企业适用《企业会计准则第14号——收入》的规定进行会计处理；选项C，银行承兑汇票属于货币性资产；选项D，用于交换的资产均属于非货币性资产，但收到的补价占换出资产公允价值比例超过 25%。"},{"title":"第二节 非货币性资产交换的确认和计量","content":"## 一、非货币性资产交换的确认原则\n\n考点难度●〇○ 易\n\n企业应当分别按照下列原则对非货币性资产交换中的换人资产进行确认，对换出资产终止确认。\n\n（一）确认原则\n\n<table><tr><td rowspan=1 colspan=1>项目</td><td rowspan=1 colspan=1>确认时点</td></tr><tr><td rowspan=1 colspan=1>换人资产</td><td rowspan=1 colspan=1>换人资产符合资产定义并满足资产确认条件时予以确认</td></tr><tr><td rowspan=1 colspan=1>换出资产</td><td rowspan=1 colspan=1>换出资产满足资产终止确认条件时终止确认</td></tr></table>\n\n例（真）题-答案」 2.B\n\n## （二）换入资产的确认时点与换出资产的终止确认时点存在不一致的会计处理\n\n<table><tr><td rowspan=1 colspan=1>交易事项</td><td rowspan=1 colspan=1>资产负债表日会计处理原则</td></tr><tr><td rowspan=1 colspan=1>换人资产满足资产确认条件，换出资产尚未满足终止确认条件</td><td rowspan=1 colspan=1>在确认换人资产的同时将交付换出资产的义务确认为一项负债（如其他应付款等）</td></tr><tr><td rowspan=1 colspan=1>换人资产尚未满足资产确认条件，换出资产满足终止确认条件</td><td rowspan=1 colspan=1>在终止确认换出资产的同时将取得换人资产的权利确认为一项资产（如其他应收款等）</td></tr></table>\n\n企业可以按照重要性原则，在换人资产满足确认条件和换出资产满足终止确认条件敦晚的时点进行会计处理。\n\n【真题3·多选题】2×24年10月15日，甲公司与乙公司签订不可撤销的协议约定，甲公司以公允价值1000万元、账面价值800万元的自用设备和现金250万元作为对价，换取乙公司持有的公允价值为1250万元的专利技术。2×24年11月20日，乙公司将其持有的专利技术转让至甲公司并办理完成专利变更登记手续。2×24年12月14日，甲公司以银行转账方式向乙公司支付250万元。2×25年1月22日，甲公司向乙公司交付了设备。该交换具有商业实质。不考虑相关税费及其他因素，下列各项关于甲公司会计处理的表述中，正确的有\n\n（ ）。（2024年回忆版）\n\nA．2×24年10月15日确认其他应付款1250万元\n\nB.2×24年12月14日确认应收账款250万元\n\nC.2×24年11月20日确认无形资产1250万元\n\nD.2×25年1月22日确认资产处置收益200万元\n\n解析 甲公司相关会计分录如下：\n\n2×24年11月20日\n\n借：无形资产 1250\n\n贷：其他应付款 1250\n\n2×24年12月14日\n\n借：其他应付款 250\n\n贷：银行存款\n\n2×25年1月22日\n\n借：其他应付款 1000\n\n贷：固定资产清理 贷：固定资产清理 800\n\n资产处置损益\n\n综上所述，选项A和B错误，选项C和D正确。\n\n解题攻略换入资产满足资产确认条件，换出资产尚未满足终止确认条件的，在确认换入资产的同时将交付换出资产的义务确认为一项负债，如其他应付款。\n\n## 二、非货币性资产交换的计量原则\n\n\n\n## （一）以公允价值为基础计量\n\n非货币性资产交换同时满足下列两个条件的，应当以公允价值和应支付的相关税费作为换入资产的成本，公允价值与换出资产账面价值的差额计入当期损益：\n\n（1）该项交换具有商业实质；\n\n（2）换人资产或换出资产的公允价值能够可靠地计量。\n\n换人资产和换出资产公允价值均能够可靠计量的，应当以换出资产公允价值作为确定换入资产成本的基础。如果有确凿证据表明换人资产的公允价值更加可靠的，应当以换人资产公允价值为基础确定换人资产的成本。\n\n## 点拨\n\n在考虑了补价因素的调整后，正常交易中换入资产的公允价值和换出资产的公允价值通常是一致的。\n\n## 提示\n\n对于非货币性资产交换中换入资产和换出资产的公允价值均能够可靠计量的情形，企业在判断是否有确凿证据表明换入资产的公允价值更加可靠时，应当考虑确定公允价值所使用的输入值层次，企业可以参考以下情况：第一层次输入值为公允价值提供了最可靠的证据，第二层次直接或间接可观察的输入值比第三层次不可观察输入值为公允价值提供更确凿的证据。对于换入资产和换出资产的公允价值所使用的输入值层次相同的企业，应当以换出资产的公允价值为基础计量。\n\n## （二）以账面价值为基础计量\n\n不具有商业实质或交换涉及资产的公允价值均不能可靠计量的非货币性资产交换，应当按照换出资产的账面价值和应支付的相关税费，作为换人资产的成本，无论是否支付补价，均不确认损益；收到或支付的补价作为确定换人资产成本的调整因素。\n\n## 三、商业实质的判断\n\n## （一）判断条件\n\n满足下列条件之一的非货币性资产交换具有商业实质：\n\n（1）换人资产的未来现金流量在风险、时间分布或金额方面与换出资产显著不同;\n\n（2）使用换人资产所产生的预计未来现金流量现值与继续使用换出资产所产生的预计未来现金流量现值不同，且其差额与换人资产和换出资产的公允价值相比是重大的。\n\n提示 企业应当遵循实质重于形式的原则，判断非货币性资产交换是否具有商业实质。\n\n## （二）交换涉及的资产类别与商业实质的关系\n\n企业在判断非货币性资产交换是否具有商业实质时，还可以从资产是否属于同一类别进行分析，因为不同类别非货币性资产因其产生经济利益的方式不同，一般来说其产生的未来现金流量风险、时间分布或金额也不相同，因而不同类别非货币性资产之间的交换是否具有商业实质，通常较易判断。\n\n## 点拨 不同类别非货币性资产交换一般具有商业实质。\n\n同类非货币性资产交换是否具有商业实质，通常较难判断，需要根据上述两项判断条件综合判断。企业应当重点关注的是换入资产和换出资产为同类资产的情况，同类资产产生的未来现金流量既可能相同，也可能显著不同，其之间的交换因而可能具有商业实质，也可能不具有商业实质。\n\n比如，甲企业将自已拥有的一幢建筑物，与乙企业拥有的在同一地点的另一幢建筑物相交换，两幢建筑物的建造时间、建造成本等均相同，属于同一类别的非货币性资产之间的交换。在该交换交易下，两幢建筑物未来现金流量的风险、时间分布和金额可能相同，也可能不同。如果其中一幢建筑物可以立即出售，企业管理层也打算将其立即出售，而另一幢建筑物难以出售或只能在一段较长的时间内出售，则可以表明两项资产未来现金流量的风险、时间分布或金额显著不同，因而这两项资产的交换具有商业实质。\n\n【真题4·多选题】不考虑其他因素，下列各项关于企业非货币性资产交换的交易中，具有商业实质的有（ ）。（2022年）A．甲公司将其用于出租的公寓楼与乙公司的一栋办公楼进行交换B.甲公司将其拥有的专利权作价投人丙公司，取得丙公司25%的股权C.甲公司将其拥有的一辆运输货物的卡车与丁公司的两辆小轿车进行交换D.甲公司将其用于出租的公寓楼与戊公司用于出租的公寓楼进行交换，两栋楼的租金总额相同，但租户的财务及信用状况存在明显差异\n\n（解析）商业实质应从换入资产和换出资产的未来现金流量风险、时间分布、金额等方面综合判断，而不能只看金额本身。选项D，虽然两栋楼的租金总额相同，但租户的财务及信用状况存在明显差异，即风险不同，因此具有商业实质。\n\n（解题攻略）不同类别的非货币性资产之间的交换一般具有商业实质。"},{"title":"第三节 非货币性资产交换的会计处理","content":"恭喜您解锁新章节！使用微信或\"会计云课堂\"App 扫码，过关更高效！\n\n\n\n\n\n## 一、涉及单项非货币性资产交换的会计处理5年热点丨3次\n\n考点难度●●●难\n\n<table><tr><td>项目</td><td>以公允价值为基础计量</td><td>以账面价值为基础计量</td></tr><tr><td>换人资产 人账价值</td><td>（1）若给出换人资产公允价值更加可靠的 换入资产成本=换人资产公允价值+支付 的应计入换人资产成本的相关税费 提示 ①此情形换入资产成本与补价无关 ②换出资产为存货的非货币性资产交 换，以换入资产的公允价值为基础确定 换入资产入账价值及换出存货应确认的 收入 （2）若未给出换人资产公允价值更加可 靠的 ①不涉及补价 换人资产成本=换出资产公允价值+换出 资产增值税销项税额－换人资产可抵扣的 增值税进项税额+支付的应计人换人资产 成本的相关税费 ②涉及补价的情况 A.支付补价方 换人资产成本=换出资产公允价值+换出 资产增值税销项税额－换人资产可抵扣的 增值税进项税额+支付的应计人换人资产 成本的相关税费+支付补价的公允价值 B.收到补价方 换人资产成本=换出资产公允价值+换出 资产增值税销项税额－换人资产可抵扣的 增值税进项税额+支付的应计人换人资产</td><td>（1）不涉及补价的情况 换入资产成本=换出资产账面价值+换 出资产增值税销项税额-换人资产可抵 扣的增值税进项税额+支付的相关税费 （2）涉及补价的情况 ①支付补价方 换人资产成本=换出资产账面价值+换 出资产增值税销项税额-换人资产可抵 扣的增值税进项税额+支付的相关税 费+支付补价的账面价值 点拨 因以账面价值为基础计量不 确认损益，所以用支付补价的账面价 值。如补价为货币性资产应收账款， 账面价值为10万元，公允价值为9万 元，此处用10万元 ②收到补价方 换人资产成本=换出资产账面价值+换 出资产增值税销项税额－换人资产可抵 扣的增值税进项税额+支付的相关税 费－收到补价的公允价值</td></tr></table>\n\n<table><tr><td rowspan=1 colspan=1>项目</td><td rowspan=1 colspan=2>以公允价值为基础计量</td><td rowspan=1 colspan=1>以账面价值为基础计量</td></tr><tr><td rowspan=1 colspan=1>公允价值与账面价值差额的影响</td><td rowspan=1 colspan=1>以换出资产公允价值为基础确定换人资产成本：将换出资产的公允价值与其账面价值之间的差额计入当期损益等</td><td rowspan=1 colspan=1>以换人资产公允价值为基础确定换人资产成本：将换人资产的公允价值减去支付补价（或加上收到补价）的公允价值金额，与换出资产账面价值之间的差额计入当期损益等</td><td rowspan=1 colspan=1>不确认损益</td></tr><tr><td rowspan=1 colspan=1>相关税费的处理</td><td rowspan=1 colspan=2>（1）与换出资产有关的相关税费和出售资产相关税费的会计处理相同，如换出固定资产支付的清理费用计人资产处置损益，换出应税消费品应交的消费税计人税金及附加等（2）与换人资产有关的相关税费和购人资产相关税费的会计处理相同，如换入资产的运杂费和保险费计人换人资产的成本等</td><td rowspan=1 colspan=1>计人换人资产成本</td></tr></table>\n\n## 点拨\n\n实务中，企业在进行非货币性资产交换时，相关换入资产或换出资产的公允价值通常会在合同中约定；对于合同中没有约定的，应当按照合同开始日（合同生效日）的公允价值确定。\n\n## 提示\n\n以公允价值为基础计量的非货币性资产交换，换出资产公允价值与账面价值的差额应当分不同情况处理：\n\n（1）换出资产为固定资产、无形资产的，资产公允价值与其账面价值的差额，计入资产处置损益。\n\n（2）换出资产为以公允价值计量且其变动计入其他综合收益的金融资产（权益工具投资）的，资产公允价值与其账面价值的差额，计入留存收益，并将其持有期间形成的\"其他综合收益\"转入留存收益。\n\n（3）换出资产为长期股权投资的，资产公允价值与其账面价值的差额，计入投资收益，并将持有期间形成的\"其他综合收益\"转入投资收益或留存收益，持有期间形成的\"资本公积\"转入投资收益。\n\n（4）换出资产为投资性房地产的，以换出资产公允价值或换入资产公允价值为基础确认其他业务收入，按换出资产账面价值结转其他业务成本，涉及其他综合收益和公允价值变动损益的也应一并转入其他业务成本。\n\n（5）换入资产与换出资产涉及相关税费的，按照相关税收规定计算确定。\n\n【真题5·单选题】当交易具有商业实质且换出资产和换人资产的公允价值均能够可靠\n计量时，不考虑其他因素，下列关于企业发生的非货币性资产交换的会计处理中，正确的是\n（ ）。（2025年回忆版）A．以持有的厂房换人一栋办公楼，将办公楼的公允价值与厂房的账面价值之间的差额计人当期损益B．以持有的一批存货换人一台设备，以存货的公允价值作为换人设备的成本C.以持有的投资性房地产换人一条生产线，以换出投资性房地产的公允价值确认其他业务收人D.以持有的交易性金融资产换人控股股东持有的构成业务的另一子公司股权并取得控制权，以交易性金融资产的公允价值确认长期股权投资的成本\n\n（解析）选项A，以厂房换入办公楼，应将厂房的公允价值与其账面价值之间的差额计入当期损益；选项B，换出存货，适用收入准则，以换入设备的公允价值作为其成本；选项D，构成同一控制下企业合并，应在合并日以取得被合并方所有者权益在最终控制方合并财务报表中的账面价值的份额为基础确定长期股权投资的初始投资成本。\n\n【真题6·多选题】2×20年，甲公司发生的有关交易或事项如下：（1）甲公司与丙公司\n签订的资产交换协议约定，甲公司以其拥有50年使用权的一宗土地换取丙公司持有的乙公司\n40% 的股权（重大影响)；（2）丙公司以发行自身普通股换取甲公司一条生产线。假定上述资\n产交换具有商业实质，换出资产与换人资产的公允价值均能可靠计量。不考虑相关税费及其他\n因素，下列各项与上述交易或事项相关会计处理的表述中，正确的有（ ）。（2021年）A．甲公司换出土地公允价值与其账面价值的差额应确认为资产处置损益B.丙公司以发行自身普通股换取甲公司一条生产线应按非货币性资产交换准则进行会计处理C．甲公司以土地换取的对乙公司40%股权应按非货币性资产交换准则进行会计处理D．丙公司应按照换出股权的公允价值计量换人土地的成本\n\n解析）甲公司以其拥有50年使用权的一宗土地换取丙公司持有的乙公司40%股权（重大影响），属于非货币性资产交换，适用非货币性资产交换准则进行会计处理，选项C正确；甲公司换出土地的公允价值与账面价值的差额，确认资产处置损益，选项A正确；丙公司应当按照换出乙公司40%股权的公允价值计量换入土地的成本，选项D正确；丙公司以发行自身普通股换取甲公司生产线，不适用非货币性资产交换准则，选项B不正确。\n\n【例题7·多选题】甲公司为房地产开发企业，乙公司为制造企业。2×25年5月10日，\n甲公司与乙公司签订的资产交换协议约定，甲公司以其建造完成的一栋商品房交换乙公司的一\n栋办公楼。交换日，商品房的账面价值为5000万元，公允价值为8800万元；办公楼的账面价\n值为5800万元，公允价值为8700万元，乙公司另支付100万元补价。上述交易具有商业实质，\n交换的资产已办理相关产权过户手续。不考虑相关税费及其他因素，下列各项会计处理的表述\n中，正确的有（ ）。A．甲公司换出的商品房应按换人办公楼的公允价值加上收到的补价确认收入B.乙公司换人的商品房应按办公楼的公允价值加上支付的补价计量\n\n例（真）题-答案 」 5.C 6.ACD\n\nC.甲公司换人的办公楼应按其公允价值初始计量D．甲公司收到的补价应确认为其他收益计人当期损益\n\n解析 甲公司为房地产开发企业，换出商品房适用收入准则，换入的办公楼作为非现金对价，以公允价值初始计量，确认收入的金额为非现金对价的公允价值与收到的补价之和，选项A和C正确，选项D不正确；乙公司换入商品房的入账价值为换出资产的公允价值加上支付的补价，选项B正确。\n\n【例题8·单选题】经与乙公司协商，甲公司以一台设备换人乙公司的一项专利技术，交\n换日，甲公司换出设备的账面价值为560万元，公允价值为700万元（等于计税价格），甲公\n司将设备运抵乙公司并向乙公司开具了增值税专用发票，当日双方办妥了专利技术所有权转让\n手续。经评估确认，该项专利技术的公允价值为900万元（免增值税），甲公司另以银行存款\n支付乙公司109万元，甲、乙公司均为增值税一般纳税人，适用的增值税税率均为13%。不\n考虑其他因素，甲公司换入专利技术的入账价值是（）万元。A. 669 B.900 C.809 D. 791\n\n解析 专利技术入账价值为其公允价值900万元，或入账价值=换出设备公允价值+增值税销项税额－可抵扣的增值税进项税额+支付的补价=700+700×13%+109=900（万元）。\n\n【例题9·单选题】甲公司为增值税一般纳税人，2×25年1月25日以其拥有的一项非专\n利技术与乙公司生产的一批商品交换。交换日，甲公司换出非专利技术的成本为80万元，累\n计摊销为15万元，未计提减值准备，公允价值无法可靠计量，假定该非专利技术免征增值税。\n换人商品的账面成本为72万元，未计提跌价准备，公允价值为100万元，增值税税额为13万\n元，甲公司将其作为存货核算；甲公司另收到乙公司支付的14万元现金。假定该非货币性资\n产交换具有商业实质。不考虑其他因素，甲公司对该交易应确认的收益是（）万元。A.0 B.22 C. 65 D. 62\n\n解析 该非货币性资产交换具有商业实质，且换出资产的公允价值不能可靠取得，所以以换入资产的公允价值为基础确定换出资产的损益，甲公司对该交易应确认的收益=（100+13+14）-（80-15）=62（万元）。\n\n甲公司会计分录如下：\n\n借：库存商品 100\n应交税费一应交增值税（进项税额） 13\n累计摊销 15\n银行存款 14\n贷：无形资产 80\n资产处置损益 62\n\n解题攻略影响当期损益的金额是换出资产的公允价值与账面价值的差额，若题目没有给出换出资产的公允价值，则应按换入资产的公允价值为基础计算换出资产的公允价值。\n\n## 二、涉及多项非货币性资产交换的会计处理5年热点丨2次\n\n考点难度●难\n\n<table><tr><td>项目</td><td>以公允价值为基础计量的 非货币性资产交换</td><td>以账面价值为基础计量的 非货币性资产交换</td></tr><tr><td>各项换人 资产的 初始计量 金额</td><td>按照换人的金融资产以外的各项换人资 产公允价值相对比例，将换出资产公允 价值总额（涉及补价的，加上支付补价 的公允价值或减去收到补价的公允价值） 扣除金融资产公允价值后分摊至各项换 人资产的金额，加上应支付的相关税费， 作为各项换人资产的成本进行初始计量。 有确凿证据表明换人资产的公允价值更 加可靠的，以各项换人资产的公允价值 和应支付的相关税费作为各项换人资产 的初始计量金额 对于同时换出的多项资产，将各项换出</td><td>按照各项换人资产的公允价值的相对比 例，将换出资产的账面价值总额（涉及 补价的，加上支付补价的账面价值或减 去收到补价的公允价值）分摊至各项换 人资产，加上应支付的相关税费，作为 各项换人资产的初始计量金额。换人资 产的公允价值不能够可靠计量的，可以 按照各项换人资产的原账面价值的相对 比例或其他合理的比例对换出资产的账 面价值总额进行分摊</td></tr><tr><td>当期损益</td><td>资产的公允价值与其账面价值之间的差 额，在各项换出资产终止确认时计入当 期损益。有确凿证据表明换人资产的公 允价值更加可靠的，按照金融资产以外 各项换出资产的公允价值的相对比例， 将换人资产的公允价值总额（涉及补价 的，减去支付补价的公允价值或加上收 到补价的公允价值）扣除换出金融资产 公允价值后分摊至各项换出资产，分摊 至各项换出资产的金额与各项换出资产 账面价值之间的差额，在各项换出资产 终止确认时计入当期损益</td><td>不确认损益</td></tr></table>\n\n【例题10·单选题】2×24年3月2日，甲公司以账面价值为350万元的厂房和150万元\n的专利权，换人乙公司账面价值为300万元的在建房屋和100万元的长期股权投资（重大影\n响），不涉及补价。上述资产的公允价值均无法获得。不考虑相关税费及其他因素，甲公司换\n人在建房屋的人账价值为（）万元。A.280 B.300 C. 350 D. 375\n\n解析甲公司换入在建房屋的入账价值=（350+150.）×300/（300+100）=375（万元）。"}],"quizGroups":[{"type":"单项选择题","questions":[{"num":1,"text":"甲公司发生的下列各项交易或事项中，应按照非货币性资产交换准则进行会计处理的是（ ）。","options":[{"letter":"A","text":"甲公司将非流动资产或处置组分配给所有者"},{"letter":"B","text":"甲公司以非货币性资产向职工发放非货币性福利"},{"letter":"C","text":"甲公司以无形资产换取乙公司的存货，收取的补价占换出无形资产公允价值的30%"},{"letter":"D","text":"甲公司以固定资产换取丙公司持有的丁公司30%股份，对丁公司具有重大影响"}],"answer":"D","explanation":"选项A和B，不属于非货币性资产交换，不适用非货币性资产交换准则；选项C,收取的补价占换出资产公允价值的比例为30%，大于25%，该交易不属于非货币性资产交换交易，不适用非货币性资产交换准则。"},{"num":2,"text":"2×25年，甲公司发生的有关交易或事项如下：（1）发行权益性证券取得乙公司商品，收到乙公司开具的增值税专用发票注明的商品价款及增值税共计1130万元；（2）以持有的公允价值为1500万元的对子公司（丙公司）投资换取公允价值为2500万元的丁公司25%股权并支付补价1000万元；（3）以分期收款结算方式销售大型设备，款项分3年收回；（4）收到从供货商处采购的商品（价税合计339万元）同时冲减预付账款。上述交易均发生于非关联方之间。不考虑其他因素，甲公司2×25年发生的上述交易或事项中，属于非货币性资产交换的是（ ）。","options":[{"letter":"A","text":"发行权益性证券取得商品"},{"letter":"B","text":"以丙公司股权换取丁公司股权并支付现金补价"},{"letter":"C","text":"分期收款结算方式销售大型设备"},{"letter":"D","text":"收到采购商品同时冲减预付账款"}],"answer":"D","explanation":"选项A，属于权益性交易，不属于非货币性资产交换；选项B，股权换股权，补价比例 $| = 1 0 0 0 / 2 5 0 0 \\times 1 0 0 \\% { = } 4 0 \\% > 2 5 \\%$ ，不属于非货币性资产交换；选项C，分期收款销售设备，甲公司未取得非货币性资产，不属于非货币性资产交换；选项D，预付账款和采购的商品均属于非货币性资产，该交易属于非货币性资产交换。"},{"num":3,"text":"甲公司和乙公司均为增值税一般纳税人，销售动产适用的增值税税率为13%。2×25年3月，甲公司以其持有的10000 股丙公司股票（作为交易性金融资产核算，免征增值税）交换乙公司生产的一台办公设备，并将换人的办公设备作为固定资产核算。甲公司所持有丙公司股票的账面价值为180万元（成本170万元，公允价值变动收益10万元），在交换日的公允价值为200万元。乙公司的办公设备在交换日的账面价值为170万元，公允价值和计税价格均为200万元。甲公司另向乙公司支付价款26万元。假定该项资产交换具有商业实质。不考虑其他因素，甲公司换人办公设备的人账价值是（）万元。","options":[{"letter":"A","text":"200"},{"letter":"B","text":"180"},{"letter":"C","text":"226"},{"letter":"D","text":"190"}],"answer":"A","explanation":"因不涉及为取得换人资产支付的相关税费，甲公司换人办公设备的人账价值为其公允价值200万元。或办公设备的人账价值=换出资产的公允价值+支付补价的公允价值-换入资产可抵扣的增值税进项税额=200+26-200×13%=200（万元）。"},{"num":4,"text":"甲公司为增值税一般纳税人，经与乙公司协商，甲公司以一批产品换人乙公司的一项专利技术，交换日，甲公司换出产品的账面价值为160万元，公允价值为190万元，增值税税额为24.7万元，甲公司将产品运抵乙公司并向乙公司开具了增值税专用发票，当日双方办妥了专利技术所有权转让手续。经评估确认，该专利技术的公允价值为200万元，增值税税额为12万元，乙公司另以银行存款支付甲公司2.7万元，假定该交易具有商业实质。不考虑其他因素，甲公司换人专利技术的人账价值是（）万元。","options":[{"letter":"A","text":"200"},{"letter":"B","text":"190"},{"letter":"C","text":"212"},{"letter":"D","text":"202.7"}],"answer":"A","explanation":"换出资产为存货，应执行收人准则，换入资产初始成本应按换人资产的公允价值为基础确定，即换人专利技术的人账价值为其公允价值200万元。"},{"num":5,"text":"甲公司以A设备换人乙公司专利权。交换日，A设备账面原价为136万元，已计提折旧18万元，已计提减值准备16万元，公允价值无法合理确定；专利权公允价值为144万元。甲公司另向乙公司支付补价4万元，该项交换具有商业实质。假定不考虑税费等因素，该项交换对甲公司当期损益的影响金额是（）万元。","options":[{"letter":"A","text":"46"},{"letter":"B","text":"36"},{"letter":"C","text":"38"},{"letter":"D","text":"42"}],"answer":"C","explanation":"甲公司换入资产的公允价值减去支付补价的公允价值=144-4=140（万元），换出资产账面价值=136-18-16=102（万元），该项交换对甲公司当期损益的影响金额=140-102=38（万元）。"},{"num":6,"text":"甲公司以一项权益法核算的长期股权投资与丙公司的一项交易性金融资产、一台设备和一项专利权进行交换。长期股权投资公允价值为380万元；交易性金融资产、设备和专利权的公允价值分别为200万元、120万元和80万元。甲公司另支付给丙公司20万元补价，该交换具有商业实质。不考虑增值税及其他因素的影响，则甲公司换人专利权的人账价值是（）万元。","options":[{"letter":"A","text":"72"},{"letter":"B","text":"120"},{"letter":"C","text":"80"},{"letter":"D","text":"108"}],"answer":"C","explanation":"甲公司换入专利权的人账价值=（换出资产公允价值总额380+支付补价20-换人金融资产公允价值200）×80/（120+80）=80（万元）。"}]},{"type":"多项选择题","questions":[{"num":1,"text":"下列各项甲公司发生的交易或事项中，不适用非货币性资产交换准则进行会计处理的有（ ）。","options":[{"letter":"A","text":"甲公司以持有的5年期债券投资换取丙公司的专有技术"},{"letter":"B","text":"甲公司以生产用设备向股东分配利润"},{"letter":"C","text":"甲公司以专利权作价对其合营企业进行增资，增资后仍为合营企业"},{"letter":"D","text":"甲公司以出租的厂房换取乙公司所持联营企业的投资"}],"answer":"AB","explanation":"选项A，甲公司换出持有的5年期债券投资属于货币性资产，不作为非货币性资产交换处理；选项B，甲公司将生产用设备分配给股东，不作为非货币性资产交换处理。"},{"num":2,"text":"非货币性资产交换具有商业实质且换出资产的公允价值能够可靠计量的，关于换出资产公允价值与其账面价值的差额，下列会计处理方法中，正确的有（ ）。","options":[{"letter":"A","text":"换出资产为对联营企业长期股权投资的，其公允价值和账面价值的差额，计人投资收益"},{"letter":"B","text":"换出资产为无形资产的，其公允价值和账面价值的差额，计入资产处置损益"},{"letter":"C","text":"换出资产为固定资产的，其公允价值和账面价值的差额，计入资产处置损益"},{"letter":"D","text":"换出资产为投资性房地产的，其公允价值与账面价值的差额计入投资收益"}],"answer":"ABC","explanation":"换出资产为投资性房地产的，按换出资产公允价值确认其他业务收人，按换出资产账面价值结转其他业务成本，涉及其他综合收益和公允价值变动损益的也应转入其他业务成本，选项D错误。"},{"num":3,"text":"以公允价值为基础计量并且涉及补价的非货币性资产交换，换出方在确定计人当期损益的金额时，应当考虑的因素有（ ）。","options":[{"letter":"A","text":"支付补价的公允价值"},{"letter":"B","text":"换人资产的账面价值"},{"letter":"C","text":"换出资产的账面价值"},{"letter":"D","text":"收到补价的公允价值"}],"answer":"ACD","explanation":"以公允价值为基础计量的非货币性资产交换，应将换出资产的公允价值与其账面价值之间的差额计人当期损益。若无法确定换出资产公允价值，将换人资产的公允价值减去支付补价（或加上收到补价）的公允价值金额，与换出资产账面价值之间的差额计人当期损益，选项A、C和D正确。"},{"num":4,"text":"下列关于非货币性资产交换相关表述中，正确的有（ ）。","options":[{"letter":"A","text":"不具有商业实质的非货币性资产交换，以换出资产的账面价值为基础确定换人资产的人账价值"},{"letter":"B","text":"换人资产与换出资产的公允价值均能可靠计量且交换具有商业实质的，以换出资产的公允价值为基础确定换人资产的人账价值"},{"letter":"C","text":"换入资产与换出资产的公允价值均不能可靠计量的，以换出资产的账面价值为基础确定换入资产的人账价值"},{"letter":"D","text":"换人资产与换出资产的公允价值均不能可靠计量的，以换人资产的账面价值为基础确定换入资产的人账价值"}],"answer":"ABC","explanation":"换入资产与换出资产的公允价值均不能可靠计量的，以换出资产的账面价值为基础确定换人资产的人账价值，选项D错误。"},{"num":5,"text":"甲公司和乙公司均为增值税一般纳税人，适用的增值税税率均为13%。2×25年1月30日，甲公司与乙公司签订的资产交换合同约定，甲公司以生产经营中使用的一台货车交换乙公司生产的一批电脑。当日，用于交换的货车的公允价值为60万元，用于交换的电脑的公允价值为62万元，甲公司另外通过银行转账向乙公司支付2.26万元（含换出资产销项税额与换人资产进项税额的差额0.26万元）。合同签订日即交换日，甲公司货车的账面价值为56万元，乙公司电脑的账面价值为58万元。甲公司和乙公司分别将换入的电脑和货车作为固定资产使用和管理。甲公司和乙公司开具的增值税专用发票注明的计税价格均与换出资产的公允价值相同。不考虑其他因素，下列各项关于甲公司和乙公司会计处理的表述中，正确的有（）。","options":[{"letter":"A","text":"甲公司确认资产处置收益4万元"},{"letter":"B","text":"乙公司确认主营业务收入62万元"},{"letter":"C","text":"甲公司换人电脑确认固定资产62万元"},{"letter":"D","text":"乙公司换人货车确认固定资产59.74万元"}],"answer":"ABC","explanation":"甲公司换入电脑确认固定资产=60+（2.26-0.26）=62（万元），选项C正确；甲公司确认资产处置收益=60-56=4（万元），选项A正确；乙公司确认主营业务收人=60+（2.26-0.26）=62（万元），选项B正确；乙公司换人货车确认固定资产的人账价值为换人货车的公允价值60万元，选项D错误。"}]}]},{"chTitle":"第二十一章 债务重组","header":"## 第二十一章 债务重组\n\n## 考情速览\n\n<table><tr><td rowspan=\"3\">复习难度 ★☆</td><td rowspan=\"3\">常考题型</td><td></td></tr><tr><td>近5年考试平均分值</td></tr><tr><td>客观题+主观题 3分左右</td></tr></table>\n\n## 教材主要变化\n\n修改“债权人受让金融资产”相关表述。\n\n## 考点框架\n\n<table><tr><td rowspan=1 colspan=3>债务重组</td></tr><tr><td rowspan=2 colspan=1>债务重组的定义和方式</td><td rowspan=1 colspan=1>债务重组的定义</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=1 colspan=1>债务重组的方式</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=3 colspan=1>债务重组的会计处理</td><td rowspan=1 colspan=1>债权和债务的终止确认</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=1 colspan=1>债权人的会计处理</td><td rowspan=1 colspan=1>难</td></tr><tr><td rowspan=1 colspan=1>债务人的会计处理</td><td rowspan=1 colspan=1>难</td></tr><tr><td rowspan=1 colspan=2>债务重组的相关披露</td><td rowspan=1 colspan=1>●00易</td></tr></table>\n\n## 考点剖析\n\n本章属于近年按新准则编写的全新章节，重点在于债权人及债务人对债务重组业务的会计处理，学习本章内容时，摒弃固有思维框架，以“空杯”状态接收全新内容。","sections":[{"title":"第一节 债务重组的定义和方式","content":"## 一、债务重组的定义\n\n考点难度●〇○易\n\n债务重组，是指在不改变交易对手方的情况下，经债权人和债务人协定或法院裁定，就清偿债务的时间、金额或方式等重新达成协议的交易。\n\n## （一）关于交易对手方\n\n债务重组是在不改变交易对手方的情况下进行的交易。如，资产管理公司从债权人处购得债权，再与债务人进行债务重组，企业应当首先考虑债权和债务是否发生终止确认，适用《企业会计准则第22号- -金融工具确认和计量》和《企业会计准则第23号一金融资产转移》等准则，再就债务重组交易适用《企业会计准则第12号—债务重组》。\n\n无论何种原因导致债务人未按原定条件偿还债务，也无论债权人是否作出让步，只要债权人和债务人就债务条款重新达成了协议，就符合债务重组的定义。\n\n## （二）关于债权和债务的范围\n\n债务重组涉及的债权和债务，是指《企业会计准则第22号一金融工具确认和计量》规范的债权和债务，不包括合同资产、合同负债、预计负债，但包括租赁应收款和租赁应付款。\n\n## （三）关于债务重组的范围\n\n经法院裁定进行债务重整并按持续经营进行会计核算的，适用本章。债务人在破产清算期间进行的债务重组不属于本章规范的范围，应当按照企业破产清算有关会计处理规定处理。\n\n（1）债务重组中涉及的债权、重组债权、债务、重组债务和其他金融工具的确认、计量和列报，适用《企业会计准则第22号— 一金融工具确认和计量》和《企业会计准则第37号金融工具列报》;\n\n（2）通过债务重组形成企业合并的，适用《企业会计准则第20号——企业合并》；\n\n（3）债权人或债务人中的一方直接或间接对另一方持股且以股东身份进行债务重组的，或者债权人与债务人在债务重组前后均受同一方或相同的多方最终控制，且该债务重组的交易实质是债权人或债务人进行了权益性分配或接受了权益性投人的，适用权益性交易的有关会计处理规定。\n\n## 点拨\n\n权益性交易，是指企业与所有者之间或所有者与所有者之间发生的交易。权益性交易不确认损益。\n\n债务重组构成权益性交易的，应当适用权益性交易的有关会计处理规定，即债权人和债务人不确认构成权益性交易的债务重组相关损益。例如，甲公司是乙公司股东，为了弥补乙公司临时性经营现金流短缺，甲公司向乙公司提供1000万元无息借款，并约定于6个月后收回。借款期满时，尽管乙公司具有充足的现金流，甲公司仍然决定免除乙公司800万元本金还款义务，仅收回200万元借款。在此项交易中，如果甲公司不以股东身份而是以市场交易者身份参与交易，在乙公司具有足够偿债能力的情况下不可能会免除其部分本金。因此，甲公司和乙公司应当将该交易作为权益性交易，不确认债务重组相关损益。债务重组中不属于权益性交易的部分仍然应当确认债务重组相关损益。例如，假设前例中债务人乙公司确实出现财务困难，其他债权人（不含甲公司）对其债务普遍进行了减半的豁免，那么甲公司作为股东比其他债权人多豁免300万元债务的交易应当作为权益性交易，与其他债权人同等减半豁免500万元债务的交易应当确认债务重组相关损益。\n\n## 提示\n\n债权人对债务人豁免部分不属于权益性交易的，适用《债务重组》准则，确认债务重组损益。\n\n【例题1·单选题】甲公司是乙公司的股东。2×25年7月31日，甲公司应收乙公司账款  \n4000万元，采用摊余成本进行后续计量。为解决乙公司的资金周转困难，甲公司、乙公司的  \n其他债权人共同决定对乙公司的债务进行重组，并于2×25年8月1日与乙公司签订了债务重  \n组合同。根据债务重组合同的约定，甲公司免除80%应收乙公司账款的还款义务，乙公司其  \n他债权人免除40%应收乙公司账款的还款义务，豁免的债务在合同签订当日解除，对于其余  \n未豁免的债务，乙公司应于2×25年8月底前偿还。2×25年8月23日，甲公司收到乙公司  \n支付的账款800万元。不考虑其他因素，甲公司2×25年度因上述交易或事项应当确认的损失  \n金额是（ ）万元。A.零 B.800C. 3200 D.1600\n\n（解析）甲公司应将其豁免乙公司的1600万元（4000×40%）确认为损失，即甲公司2×25年度因上述交易或事项应当确认的损失金额为1600万元。\n\n【例题2·多选题】2×25年度，甲公司发生的有关交易或事项如下：（1）3月20日，为  \n帮助子公司（乙公司）解决临时性经营现金流短缺，甲公司向乙公司提供本金2600万元、期  \n限8个月的无息贷款。11月20日，该贷款到期，考虑到乙公司现金流依然短缺，甲公司决定  \n收回600万元,其余债务予以豁免。（2）甲公司持有联营企业（丙公司）30%股权。4月15日，  \n丙公司进行债务重组。5月10日，经债权人会议决议，所有债权人放弃其所持债权的30%；当  \n日，甲公司持有丙公司应收账款的账面余额为650万元，已计提坏账准备150万元。不考虑相  \n关税费及其他因素，下列各项关于上述交易或事项在个别财务报表会计处理的表述中，正确的  \n有（）。A.丙公司获得的债务豁免应计人当期投资收益B.甲公司豁免丙公司的债务发生的损失应计人当期投资收益C.乙公司获得的债务豁免应作为接受甲公司的资本性投人D.甲公司豁免乙公司的债务应确认为对乙公司的投资\n\n解析 甲公司和乙公司的债务重组应当作为权益性交易，甲公司予以豁免的债务不确认债务重组相关损益，乙公司应作为接受甲公司的资本性投入进行会计处理，甲公司豁免乙公司的债务应确认为对乙公司的投资，选项C和D正确；甲公司和丙公司其他债权人豁免的比例相同，不属于权益性交易，甲公司应确认债务重组损失并计入投资收益，丙公司应确认债务重组收益并计入投资收益，选项A和B正确。\n\n【例题3·多选题】甲公司下列事项中，不应按债务重组准则进行会计处理的有（ ）。  \nA．甲公司向乙公司销售商品履约完毕且确认应收款项后，因合同标的市场价格大幅波动等原因调减合同对价  \nB.甲公司向丙公司销售商品履约完毕且确认应收款项后，双方因履约活动之外的原因调整合同对价，且相关合同对价减让符合债务重组定义  \nC．甲公司以不同于原合同条款的方式代其全资子公司向债权人丁公司偿债  \nD.债务人戊公司将债务转为权益工具，导致债权人甲公司取得戊公司控制权\n\n（解析选项A，合同对价减让与公司转让商品等具体履约活动相关（例如因附有销售退回条款、履约瑕疵、合同标的市场价格大幅波动等原因调减合同对价），或合同对价减让符合行业惯例或公司以往的习惯做法，应进一步结合合同具体约定将其作为销售合同变更或可变对价重新估计进行会计处理，不应按债务重组准则进行会计处理；选项B，双方因履约活动之外的原因调整合同对价，且相关合同对价减让符合债务重组定义，则应按债务重组准则进行会计处理；选项C，是在改变交易对手方的情况下进行的交易，不应按债务重组准则处理；选项D，债务人以股权投资清偿债务或者将债务转为权益工具，可能对应导致债权人取得被投资单位或债务人控制权，在债权人的个别财务报表层面和合并财务报表层面，债权人取得长期股权投资或者资产和负债的确认与计量应按企业合并准则处理。\n\n## 二、债务重组的方式\n\n债务重组一般包括下列方式，或下列一种以上方式的组合。\n\n(一）债务人以资产清偿债务（略)\n\n（二）债务人将债务转为权益工具\n\n实务中，有些债务重组名义上采用“债转股”的方式，但同时附加相关条款，如约定债务人在未来某个时点有义务以某一金额回购股权，或债权人持有的股份享有强制分红权等。对于债务人，这些“股权”可能并不是根据《企业会计准则第37号—金融工具列报》分类为权益工具的金融工具（形式上是股权但按准则规定属于债权以及复合金融工具），从而不属于债务人将债务转为权益工具的债务重组方式。债权人和债务人还可能协议以一项同时包含金融负债成分和权益工具成分的复合金融工具替换原债权债务，这类交易也不属于债务人将债务转为权益工具的债务重组方式。\n\n## （三）修改其他条款\n\n除上述（一）和（二）以外，采用调整债务本金、改变债务利息、变更还款期限等方式修改债权和债务的其他条款，形成重组债权和重组债务。\n\n(四）组合方式（略)"},{"title":"第二节 债务重组的会计处理","content":"恭喜您解锁新章节！使用微信或“会计云课堂”App 扫码，过关更高效！\n\n## 一、债权和债务的终止确认\n\n考点难度●○○易\n\n债务重组中涉及的债权和债务的终止确认，债权人在收取债权现金流量的合同权利终止时终止确认债权，债务人在债务的现时义务解除时终止确认债务。\n\n## 点拨\n\n对于在报告期间已经开始协商、但在报告期资产负债表日后完成的债务重组，不属于资产负债表日后调整事项。\n\n## 问答 债务人能否在债务重组合同签署时确认债务重组损益？\n\n答：债务的终止确认，应当遵循《企业会计准则第22号—金融工具确认和计量》（财会〔2017」7号）有关金融负债终止确认的规定。债务人在债务的现时义务解除时终止确认债务。\n\n由于债权人与债务人之间进行的债务重组涉及债权和债务的认定，以及清偿方式和期限等的协商，通常需要经历较长时间，例如破产重整中进行的债务重组。因此，债务人只有在符合上述终止确认条件时才能终止确认相关债务，并确认债务重组相关损益。在签署债务重组合同的时点，如果债务的现时义务尚未解除，债务人不能确认债务重组相关损益。\n\n## （一）以资产清偿债务或将债务转为权益工具\n\n对于以资产清偿债务或者将债务转为权益工具方式进行的债务重组，由于债权人在拥有或控制相关资产时，通常其收取债权现金流量的合同权利也同时终止，债权人一般可以终止确认该债权。同样地，由于债务人通过交付资产或权益工具解除了其清偿债务的现时义务，债务人一般可以终止确认该债务。\n\n## 点拨\n\n（1）对于终止确认的债权，债权人应当结转已计提的减值准备中对应债权终止确认部分的金额；\n\n（2）对于终止确认的作为“其他债权投资”核算的债权，之前计入其他综合收益的累计利得或损失应当从其他综合收益中转出，记入“投资收益”科目。\n\n## （二）修改其他条款\n\n对于债权人，债务重组通过调整债务本金、改变债务利息、变更还款期限等修改合同条款方式进行的，合同修改前后的交易对手方没有发生改变，合同涉及的本金、利息等现金流量很难在本息之间及债务重组前后作出明确分割，即很难单独识别合同的特定可辨认现金流量。因此通常情况下，应当整体考虑是否对全部债权的合同条款作出了实质性修改。如果作出实质性修改，或者债权人与债务人之间签订协议，以获取实质上不同的新金融资产方式替换债权，应当终止确认原债权，并按照修改后的条款或新协议确认新金融资产。\n\n对于债务人，如果对债务或部分债务的合同条款作出“实质性修改”形成重组债务，或者债权人与债务人之间签订协议，以承担“实质上不同”的重组债务方式替换原债务，债务人应当终止确认原债务，同时按照修改后的条款确认一项新金融负债。其中，如果重组债务未来现金流量（包括支付和收取的某些费用）现值与原债务的剩余期间现金流量现值之间的差异超过10%，则意味着新的合同条款进行了“实质性修改”或者重组债务是“实质上不同”的，有关现值的计算均采用原债务的实际利率。\n\n## （三）组合方式\n\n对于债权人，与上述“修改其他条款”部分的分析类似，通常情况下应当整体考虑是否终止确认全部债权。由于组合方式涉及多种债务重组方式，一般可以认为对全部债权的合同条款作出了实质性修改，从而终止确认全部债权，并按照修改后的条款确认新金融资产。\n\n对于债务人，组合中以资产清偿债务或者将债务转为权益工具方式进行的债务重组，如果债务人清偿该部分债务的现时义务已经解除，应当终止确认该部分债务。组合中以修改其他条款方式进行的债务重组，需要根据具体情况，判断对应的部分债务是否满足终止确认条件。\n\n## 二、债权人的会计处理\n\n## （一）以资产清偿债务或将债务转为权益工具5年热点丨3次\n\n债务重组采用以资产清偿债务或者将债务转为权益工具方式进行的，债权人应当将受让的相关资产在符合其定义和确认条件时予以确认。\n\n## 1.债权人受让金融资产\n\n金融资产初始确认时应当以其公允价值计量，金融资产确认金额与债权终止确认日账面价值之间的差额，记人“投资收益”科目。\n\n但是，收取的金融资产的公允价值与交易价格（即放弃债权的公允价值）存在差异的，企业应当按照《企业会计准则第22号—金融工具确认和计量》的规定，区别下列情况进行处理：\n\n（1）在初始确认时，金融资产或金融负债的公允价值依据相同资产或负债在活跃市场上的报价或者以仅使用可观察市场数据的估值技术确定的，企业应当将该公允价值与交易价格之间的差额确认为一项利得或损失。\n\n（2）在初始确认时，金融资产或金融负债的公允价值以其他方式确定的，企业应当将该公允价值与交易价格之间的差额递延。初始确认后，企业应当根据某一因素在相应会计期间的变动程度将该递延差额确认为相应会计期间的利得或损失。该因素应当仅限于市场参与者对该金融工具定价时将予考虑的因素，包括时间等。\n\n①如取得的股权投资为交易性金融资产\n\n借：交易性金融资产（交易性金融资产的公允价值）\n\n投资收益（交易费用）\n\n坏账准备\n\n贷：应收账款等\n\n银行存款（支付的交易费用）\n\n投资收益（差额）\n\n②如取得的股权投资为其他权益工具投资\n\n借：其他权益工具投资（其他权益工具投资的公允价值+交易费用）\n\n坏账准备\n\n贷：应收账款等\n\n银行存款（支付的交易费用）\n\n投资收益（差额）\n\n\n\n## 提示\n\na.将债务转为权益工具方式进行债务重组导致债权人将债权转为对联营企业或合营企业的权益性投资的，债权人应当按照以资产清偿债务方式的会计处理相关规定计量其初始投资成本。放弃债权的公允价值与账面价值之间的差额，应当计入当期损益。\n\n## 点拨\n\n债务重组取得的股权投资能够对被投资单位施加重大影响或实施共同控制，执行《债务重组》准则。\n\n会计分录为：\n\n借：长期股权投资（放弃债权公允价值+直接相关税费）\n\n坏账准备\n\n贷：应收账款等\n\n银行存款（支付的直接相关税费）\n\n投资收益（放弃债权公允价值与账面价值的差额）\n\n债务重组取得的联营企业或合营企业的长期股权投资的后续计量，执行《长期股权投资》准则。\n\nb.如取得的股权投资为对子公司投资（同一控制）。\n\n借：长期股权投资（取得被合并方所有者权益在最终控制方合并财务报表中的账面价值份额+最终控制方收购被合并方时形成的商誉）\n\n坏账准备\n\n贷：应收账款等\n\n资本公积一资本溢价或股本溢价（差额，可能在借方，资本公积不足冲减的，依次冲减盈余公积和利润分配一未分配利润）\n\nc.如取得的股权投资为对子公司投资（非同一控制）。\n\n借：长期股权投资（放弃债权的公允价值）\n\n坏账准备\n\n贷：应收账款等\n\n投资收益（放弃债权公允价值与账面价值的差额）\n\n\n\n## 点拨\n\n债务重组取得的股权投资能够对被投资单位实施控制，执行《长期股权投资》《企业合并》准则。\n\n## 2.债权人受让非金融资产\n\n受让非金融资产成本=放弃债权的公允价值+直接相关税费\n\n放弃债权的公允价值与账面价值之间的差额，应当计人当期损益（投资收益）。\n\n## 点拨\n\n债权人受让非金融资产，执行《债务重组》准则；受让非金融资产成本可比照购买相关资产成本确定，将“购买价款”替换为“放弃债权的公允价值”即可。\n\n债权人初始确认受让的金融资产以外的资产时，应当按照下列原则以成本计量：\n\n（1）存货的成本，包括放弃债权的公允价值，以及使该资产达到当前位置和状态所发生的可直接归属于该资产的税金、运输费、装卸费、保险费等其他成本。\n\n（2）对联营企业或合营企业投资的成本，包括放弃债权的公允价值，以及可直接归属于该资产的税金等其他成本。\n\n（3）投资性房地产的成本，包括放弃债权的公允价值，以及可直接归属于该资产的税金等其他成本。\n\n（4）固定资产的成本，包括放弃债权的公允价值，以及使该资产达到预定可使用状态前所\n\n发生的可直接归属于该资产的税金、运输费、装卸费、安装费、专业人员服务费等其他成本。  \n确定固定资产成本时，应当考虑预计弃置费用因素。\n\n（5）生物资产的成本，包括放弃债权的公允价值，以及可直接归属于该资产的税金、运输费、保险费等其他成本。\n\n（6）无形资产的成本，包括放弃债权的公允价值，以及可直接归属于使该资产达到预定用途所发生的税金等其他成本。\n\n会计分录为：\n\n借：库存商品等（放弃债权公允价值－增值税进项税额+直接相关税费）\n\n应交税费一应交增值税（进项税额）\n\n坏账准备\n\n贷：应收账款等\n\n银行存款（支付的直接相关税费）\n\n投资收益（放弃债权公允价值与账面价值的差额）\n\n债权人和债务人以资产清偿债务方式进行债务重组的，或者采用将债务转为权益工具方式且导致债权人转为对联营企业或合营企业的权益性投资的，债权人初始确认受让的非金融资产应当以成本计量。在理解放弃债权公允价值与受让资产公允价值之间的关系时，如果债权人与债务人之间的债务重组是在公平交易的市场环境中达成的交易，放弃债权的公允价值通常与受让资产的公允价值相等，且通常不高于放弃债权的账面余额。\n\n## 3.债权人受让多项资产\n\n债权人受让多项非金融资产，或者包括金融资产、非金融资产在内的多项资产的，应当按照《企业会计准则第22号——金融工具确认和计量》的规定确认和计量受让的金融资产；按照受让的金融资产以外的各项资产在债务重组合同生效日的公允价值比例，对放弃债权在合同生效日的公允价值扣除受让金融资产当日公允价值后的净额进行分配，并以此为基础分别确定各项资产的成本。放弃债权的公允价值与账面价值之间的差额，记人“投资收益”科目。\n\n## 4.债权人受让处置组\n\n债务人以处置组清偿债务的，债权人应当分别按照《企业会计准则第22号一金融工具确认和计量》和其他相关准则的规定，对处置组中的金融资产和负债进行初始计量，然后按照金融资产以外的各项资产在债务重组合同生效日的公允价值比例，对放弃债权在合同生效日的公允价值以及承担的处置组中负债的确认金额之和，扣除受让金融资产当日公允价值后的净额进行分配，并以此为基础分别确定各项资产的成本。放弃债权的公允价值与账面价值之间的差额，记人“投资收益”科目。\n\n【例题4】甲公司应收乙公司账款余额为1100万元，已计提坏账准备200万元，债务重组合同生效日公允价值为1000万元。乙公司以处置组抵偿债务并于合同生效日转让处置组，处置组中资产、负债及其公允价值在合同生效日的信息如下表所示：\n\n单位：万元\n\n<table><tr><td rowspan=1 colspan=1>资产、负债</td><td rowspan=1 colspan=1>其他债权投资</td><td rowspan=1 colspan=1>固定资产</td><td rowspan=1 colspan=1>无形资产</td><td rowspan=1 colspan=1>短期借款</td></tr><tr><td rowspan=1 colspan=1>公允价值</td><td rowspan=1 colspan=1>200</td><td rowspan=1 colspan=2>600                   400</td><td rowspan=1 colspan=1>100</td></tr></table>\n\n分析其他债权投资合同生效日的确认金额为200万元，短期借款合同生效日的确认金额为100万元。固定资产入账金额=（1000+100-200）×600/（600+400）=540（万元），无形资产入账金额=（1000+100-200）×400/（600+400）=360（万元）。\n\n【真题5·多选题】甲公司作为债权人，于2×23年5月10日与债务人乙公司达成协议，  \n同意乙公司以其持有的丙上市公司股票、一台二手的进口光刻机以及若干芯片产品抵偿全部债  \n务，协议签订当日即完成相关资产的交付手续。当日，甲公司放弃债权的账面价值为1000万元，  \n公允价值为1070万元；乙公司持有的丙上市公司股票公允价值为500万元，甲公司将其作为  \n交易性金融资产核算；二手光刻机在乙公司的账面价值为300万元，公允价值为400万元，甲  \n公司将收到的光刻机作为固定资产核算，发生的运输和保险费用为1万元；芯片产品在乙公司  \n的账面价值为180万元，公允价值为200万元，甲公司将芯片产品作为存货核算。下列各项有  \n关甲公司会计处理的表述中，正确的有（）。（2023年）A．确认交易性金融资产500万元 B.确认投资收益100万元C.确认固定资产401万元 D.确认存货190万元\n\n解析）甲公司取得交易性金融资产应按照取得当日的公允价值核算，确认交易性金融资产500万元，选项A正确；甲公司应确认投资收益的金额=1070-1000=70（万元），选项B不正确；甲公司确认固定资产的金额=（1070-500）×400/（400+200）+1=381（万元），选项C不正确；甲公司确认存货的金额=（1070-500）×200/（400+200）=190（万元），选项D正确。\n\n解题攻略债务重组受让的非金融资产入账价值是按照放弃债权的公允价值为基础确定的，不是以非金融资产本身的公允价值为基础确定。\n\n【例题6·多选题】甲公司应收乙公司1000万元，已计提坏账准备50万元。2×25年3  \n月1日，甲乙双方签订的债务重组协议约定：（1）乙公司以账面价值480万元的库存商品抵  \n偿债务500万元；（2）乙公司向甲公司增发股票200万股，用于抵偿债务500万元；（3）前述  \n（1）、（2）两项偿债事项互为条件，若其中任何一项没有完成，则甲公司保留向乙公司收取  \n1000万元现金的权利。2×25年3月1日，甲公司债权的公允价值为940万元；乙公司股票  \n的公允价值为2.5元／股。2×25年3月15日，甲公司将收到的商品作为存货管理。2×25年  \n5月1日，乙公司办理完成股权增发手续，甲公司将其指定为以公允价值计量且其变动计人其  \n他综合收益的金融资产，当日乙公司股票的公允价值为2.4元／股。不考虑其他因素，下列各  \n项关于甲公司债务重组相关会计处理的表述中，正确的有（ ）。A．2×25年5月1日，确认其他权益工具投资480万元B.2×25年3月15日，确认存货440万元C.2×25年3月15日，确认投资收益-35万元D.2×25年5月1日，确认投资收益-30万元\n\n解析2×25年3月15日，甲公司收到商品的入账价值 $= 9 4 0 - 2 . 5 \\times 2 0 0 { = } 4 4 0 ( \\pi \\pi )$ ，选项B正确；2×25年3月15日甲公司不确认投资收益，选项C错误；2×25年5月1日甲公司应确认的其他权益工具投资的金额=200×2.4=480（万元），选项A正确；2×25\n\n年5月1日甲公司应确认投资损失金额=（1000-440-50）-2.4×200=30（万元），选项  \nD正确。甲公司相关账务处理如下：2×25年3月15日借：库存商品 440贷：应收账款 4402×25年5月1日借：其他权益工具投资 480（2.4× 200）坏账准备 50投资收益 30贷：应收账款 560（1000-440）\n\n解题攻略债权人同时受让金融资产和非金融资产的，应按合同生效日放弃债权的公允价值扣除当日金融资产的公允价值后的净额为基础确定非金融资产的入账价值总额，但取得的金融资产应按取得日的公允价值入账。\n\n## 5.债权人将受让的资产或处置组划分为持有待售类别\n\n债务人以资产或处置组清偿债务，且债权人在取得日未将受让的相关资产或处置组作为非流动资产和非流动负债核算，而是将其划分为持有待售类别的，债权人应当在初始计量时，比较假定其不划分为持有待售类别情况下的初始计量金额和公允价值减去出售费用后的净额，以两者孰低计量。\n\n## 提示\n\n若公允价值减去出售费用后的净额小于假定不划分为持有待售类别情况下的初始计量金额，其差额记入“资产减值损失”科目。\n\n【例题7·多选题】甲公司销售商品产生应收乙公司货款1000万元，因乙公司资金周转困  \n难，已逾期1年以上尚未支付。2×25年6月5日，双方经协商达成以下协议：乙公司以一台  \n机器设备抵偿上述债务。该日应收债权的公允价值为900万元，已提坏账准备120万元，双方  \n办理完成资产转让手续，甲公司将取得的设备划分为持有待售类别，该日设备的公允价值减去  \n出售费用后的净额为860万元。不考虑增值税等因素的影响，对于该债务重组业务甲公司下列  \n会计处理中正确的有（A．持有待售资产人账价值为860万元 B．固定资产人账价值为900万元C.应计人资产减值损失的金额为40万元D.应计入投资收益的金额为20万元\n\n解析债权人债务重组取得资产划分为持有待售类别的，债权人应当在初始计量时，比较假定其不划分为持有待售类别情况下的初始计量金额和公允价值减去出售费用后的净额，以两者孰低计量。在不划分为持有待售类别情况下的初始计量金额为放弃债权的公允价值900万元，公允价值减去出售费用后的净额为860万元，二者差额40万元计入资产减值损失，持有待售资产入账价值为860万元。\n\n## 例（真）题-答案」6.ABD\n\n甲公司会计处理如下：  \n借：持有待售资产一固定资产 860坏账准备 120资产减值损失 40贷：应收账款 1000投资收益 20  \n选项A、C和D正确。\n\n## （二）修改其他条款\n\n债务重组采用修改其他条款方式进行的，如果修改其他条款导致全部债权终止确认，债权人应当按照修改后的条款以公允价值初始计量新的金融资产，新金融资产的确认金额与债权终止确认日账面价值之间的差额，记人“投资收益”科目。\n\n如果修改其他条款未导致债权终止确认，债权人应当根据其分类，继续以摊余成本、以公允价值计量且其变动计入其他综合收益，或者以公允价值计量且其变动计人当期损益进行后续计量。\n\n## （三）组合方式\n\n债务重组采用组合方式进行的，一般可以认为对全部债权的合同条款作出了实质性修改，债权人应当按照修改后的条款，以公允价值初始计量新的金融资产和受让的新金融资产，按照受让的金融资产以外的各项资产在债务重组合同生效日的公允价值比例，对放弃债权在合同生效日的公允价值扣除受让金融资产和重组债权当日公允价值后的净额进行分配，并以此为基础分别确定各项资产的成本。放弃债权的公允价值与账面价值之间的差额，记人“投资收益”科目。\n\n## 三、债务人的会计处理\n\n考点难度●●难\n\n## （一）债务人以资产清偿债务 5年热点丨4次\n\n债务重组采用以资产清偿债务方式进行的，债务人应当将所清偿债务账面价值与转让资产账面价值之间的差额计人当期损益。\n\n## 1.债务人以金融资产清偿债务\n\n债务人以单项或多项金融资产清偿债务的，债务的账面价值与偿债金融资产账面价值的差额，记人“投资收益”科目。偿债金融资产已计提减值准备的，应结转已计提的减值准备。对于分类为以公允价值计量且其变动计人其他综合收益的债务工具投资清偿债务的，之前计入其他综合收益的累计利得或损失应当从其他综合收益中转出，记人“投资收益”科目。对于以指定为以公允价值计量且其变动计人其他综合收益的非交易性权益工具投资清偿债务的，之前计人其他综合收益的累计利得或损失应当从其他综合收益中转出，记入“盈余公积”“利润分配一未分配利润”科目。\n\n金融资产按终止确认（出售）的方式处理。\n\n## 例（真）题-答案」 7.ACD\n\n会计分录为：\n\n借：应付账款等（债务的账面价值）\n\n贷：其他债权投资等（偿债金融资产账面价值）\n\n投资收益（差额）\n\n将持有期间产生的“其他综合收益”转人“投资收益”或“留存收益”。\n\n2.债务人以非金融资产清偿债务\n\n债务人以单项或多项长期股权投资清偿债务的，债务的账面价值与偿债长期股权投资账面价值的差额，记人“投资收益”科目。\n\n债务人以单项或多项其他非金融资产（如固定资产、投资性房地产、生物资产、无形资产、日常活动产出的商品或服务等）清偿债务，或者以包括金融资产和非金融资产在内的多项资产清偿债务的，不需要区分资产处置损益和债务重组损益，也不需要区分不同资产的处置损益，而应将所清偿债务账面价值与转让资产账面价值之间的差额，记人“其他收益一债务重组收益”科目。偿债资产已计提减值准备的，应结转已计提的减值准备。\n\n## 点拨\n\n（1）仅涉及金融工具、长期股权投资抵偿债务，抵债金融工具、长期股权投资账面价值与应付债务账面价值的差额记入“投资收益”科目，其他情况（包括同时涉及金融工具和非金融资产）下，差额记入“其他收益一债务重组收益”科目；\n\n（2）同时涉及金融资产和非金融资产抵债，差额计入其他收益；原其他债权投资持有期间确认的其他综合收益也转入其他收益。\n\n债务人以日常活动产出的商品或服务清偿债务的，应当将所清偿债务账面价值与存货等相关资产账面价值之间的差额，记入“其他收益一债务重组收益”科目。\n\n\n\n## 点拨\n\n债务重组不属于企业的日常活动，因此以存货进行债务重组不适用收入准则，不应作为存货的销售处理。\n\n会计分录为：\n\n借：应付账款等\n\n贷：库存商品、固定资产清理等（转让资产的账面价值）\n\n其他收益一债务重组收益（差额）\n\n债务人以包含非金融资产的处置组（处置组中的资产均为长期股权投资的除外）清偿债务的，应当将所清偿债务和处置组中负债的账面价值之和，与处置组中资产的账面价值之间的差额，记人“其他收益一债务重组收益”科目。处置组所属的资产组或资产组组合按照《企业会计准则第8号一资产减值》分摊了企业合并中取得的商誉的，该处置组应当包含分摊至处置组的商誉。处置组中的资产已计提减值准备的，应结转已计提的减值准备。\n\n【真题8·单选题】2×24年8月20日，甲公司以库存商品和土地使用权偿还向乙公司购买材料的应付账款5500万元，并完成相应商品交付和土地使用权产权过户登记手续。当日，甲公司用于偿债的库存商品账面价值为1800万元，公允价值为2400万元，土地使用权的账面价值为1200万元，公允价值为2600万元。不考虑相关税费及其他因素，下列各项关于甲公司以资产偿还应付账款会计处理的表述中，正确的是（ ）。（2024年回忆版）\n\nA．确认投资收益500万元 B.确认资产处置收益1400万元C．确认其他收益2500万元 D.确认营业收人2400万元\n\n解析债务人以非金融资产（长期股权投资除外）偿还债务，结转债务账面价值与非金融资产账面价值之间的差额计入其他收益。甲公司计入其他收益的金额=5500-（1800+1200）=2500（万元）。\n\n解题攻略）以金融资产和长期股权投资抵偿债务，抵债资产账面价值与应付债务账面价值的差额计入投资收益，以其他非金融资产或其他非金融资产和金融资产组合的形式抵偿债务，抵债资产账面价值与应付债务账面价值的差额计入其他收益。\n\n（二）债务人将债务转为权益工具 5年热点|2次·\n\n债务重组采用将债务转为权益工具方式进行的，债务人初始确认权益工具时，应当按照权益工具的公允价值计量，权益工具的公允价值不能可靠计量的，应当按照所清偿债务的公允价值计量。所清偿债务账面价值与权益工具确认金额之间的差额，记人“投资收益”科目。债务人因发行权益工具而支付的相关税费等，应当依次冲减资本公积（资本溢价或股本溢价）、盈余公积、未分配利润。\n\n会计分录为：\n\n借：应付账款等\n\n贷：股本（实收资本）\n\n资本公积一股本溢价（资本溢价）\n\n投资收益（差额）\n\n## 点拨\n\n“股本（实收资本）”与“资本公积一股本溢价（资本溢价）”之和反映权益工具确认金额。\n\n【真题9·单选题】2×23年2月10日，甲公司向乙公司销售商品应收乙公司价款500万  \n元。2×23年12月1日，乙公司出现严重财务困难，甲公司估计相关应收账款只能收回60%，  \n2×23年12月31日，甲公司和乙公司签订债务重组协议，乙公司将以其生产的一批库存商品  \n抵偿债务200万元，商品的公允价值和账面价值均为200万元，甲公司剩余300万元债权将转  \n为对乙公司的股权投资，持股比例10%，不能对乙公司施加重大影响。2×23年12月31日，  \n甲公司对乙公司债权的公允价值为300万元，乙公司10%股权的公允价值为150万元。2×24  \n年1月15日双方完成了上述商品的交付和股权变更登记手续，相关资产的公允价值与2×23  \n年12月31日的金额相等。当日，甲公司和乙公司2×23年度财务报告尚未批准对外报出，不  \n考虑相关税费及其他因素，下列关于甲公司和乙公司会计处理的表述中，正确的是（）。  \n（2025年回忆版）A．2×23年12月31日，甲公司无须计提坏账准备B.2×23年12月31日，甲公司确认投资收益50万元C.2×24年1月15日，乙公司确认其他收益150万元D.2×24年1月15日，乙公司确认资本公积300万元\n\n## 例（真）题-答案」 8.C\n\n（解析）2×23年12月31日，甲公司应计提坏账准备的金额=500×（1-60%）=200（万元），选项A错误；2×23年12月31日，甲公司不应确认债务重组损益，选项B错误；2×24年1月15日，乙公司应确认的其他收益=500-200-150=150（万元），选项C正确，选项D错误。\n\n【真题10·单选题】下列各项有关企业债务重组会计处理的表述中，正确的是（ ）。（2022年）\n\nA.债务人以自产产品清偿负债的，应根据收入准则确认收人\n\nB.以修改合同条款进行债务重组的，债权人应当按照修改后的条款以公允价值计量新的金融资产\n\nC.债权人同时受让交易性金融资产和固定资产，相关资产应基于各项资产公允价值占放弃债权公允价值的比例进行分配的金额计量\n\nD.采用债务转为权益工具方式进行债务重组的，债务人在对权益工具进行初始计量时，应当采用权益工具的公允价值，权益工具公允价值不能可靠计量的，则采用清偿债务的公允价值\n\n（解析）债务人以自产产品清偿负债的，应将存货的账面价值与清偿债务的账面价值的差额计入当期损益，不确认收入，选项A不正确；以修改合同条款进行债务重组的，如果修改其他条款导致全部债权终止确认，债权人应当按照修改后的条款以公允价值计量新的金融资产，如果修改其他条款未导致债权终止确认，债权人应当根据其分类，继续以摊余成本、以公允价值计量且其变动计入其他综合收益，或者以公允价值计量且其变动计入当期损益进行后续计量，选项B不正确；债权人同时受让交易性金融资产和固定资产，应当按债务重组日公允价值计量交易性金融资产，按照放弃债权在合同生效日的公允价值扣除受让交易性金融资产当日公允价值后的净额计量固定资产，选项C不正确。\n\n(解题攻略债务重组不属于企业的日常活动，因此以存货清偿债务的债务重组不适用收入准则，不应作为存货的销售处理。\n\n小结 以资产清偿债务方式进行的债务重组账务处理计入损益科目区分。\n\n<table><tr><td rowspan=1 colspan=2>债务重组方式</td><td rowspan=1 colspan=1>债权人</td><td rowspan=1 colspan=1>债务人</td></tr><tr><td rowspan=2 colspan=1>以资产清偿债务</td><td rowspan=1 colspan=1>金融资产和长期股权投资</td><td rowspan=1 colspan=1>投资收益</td><td rowspan=1 colspan=1>投资收益</td></tr><tr><td rowspan=1 colspan=1>其他非金融资产或多项资产（金融资产与其他非金融资产组合）</td><td rowspan=1 colspan=1>投资收益</td><td rowspan=1 colspan=1>其他收益</td></tr></table>\n\n（三）修改其他条款 5年热点丨2次\n\n债务重组采用修改其他条款方式进行的，如果修改其他条款导致债务终止确认，债务人应当按照公允价值计量重组债务，终止确认的债务账面价值与重组债务确认金额之间的差额，记人“投资收益”科目。\n\n如果修改其他条款未导致债务终止确认，或者仅导致部分债务终止确认，对于未终止确认的部分债务，债务人应当继续按原分类进行后续计量。对于以摊余成本计量的债务，债务人应当根据重新议定合同的现金流量变化情况，重新计算该重组债务的账面价值，并将相关利得或损失记人“投资收益”科目。重新计算的该重组债务的账面价值，应当根据将重新议定或修改的合同现金流量按债务的原实际利率或按《企业会计准则第24号—套期会计》规定的重新计算的实际利率（如适用）折现的现值确定。对于修改或重新议定合同所产生的成本或费用，债务人应当调整修改后的重组债务的账面价值，并在修改后重组债务的剩余期限内摊销。\n\n## 点拨\n\n确定原债务的剩余期间现金流量有“完全单项适用观”“完全整体适用观”等不同观点，按教材例题，采用的是“完全单项适用观”，即计算确定原债务的剩余期间现金流量现值时，只考虑剩余债务本身，不含豁免部分。\n\n【例题11】A公司为上市公司，2×22年1月1日，A公司取得B银行贷款1000-万元，约定贷款期限为4年（即2×25年12月31日到期），年利率7%，按年付息，原实际年利率为7%。A公司已按时支付所有利息。2×25年12月31日，A公司出现严重资金周转问题，多项债务违约，信用风险增加，无法偿还贷款本金，B银行同意与A公司就该项贷款重新达成协议。\n\n情形1：B银行免除A公司50万元债务本金，并将尚未偿还的债务本金950万元展期至2×26年12月31日，年利率为8%，假定市场年利率为6%。剩余债务的公允价值为967.92万元。\n\n重组债务未来现金流量现值=950×（1+8%）/（1+7%）=958.88（万元）。\n\n原债务的剩余期间现金流量现值为950万元。\n\n现金流变化=（958.88-950）÷950×100%=0.93%<10%，不属于实质性修改。\n\nA公司会计处理如下：\n\n<table><tr><td>借：长期借款一本金</td><td>1000</td></tr><tr><td>贷：长期借款一本金</td><td>950</td></tr><tr><td>一利息调整</td><td>8.88</td></tr><tr><td>投资收益</td><td>41.12</td></tr></table>\n\n情形2：B银行免除A公司50万元债务本金，并将尚未偿还的债务本金950万元展期至2×26年12月31日，年利率为18%，假定市场年利率为6%。剩余债务的公允价值为1057.55万元。\n\n重组债务未来现金流量现值=950×（1+18%）/（1+7%）=1047.66（万元）。\n\n原债务的剩余期间现金流量现值为950万元。\n\n现金流变化=（1047.66-950）÷950×100%=10.28%>10%，属于实质性修改。\n\nA公司会计处理如下：\n\n借：长期借款一本金\n\n投资收益\n\n贷：短期借款一本金 1057.55\n\n---\n\n【真题12·单选题】2×24年2月5日，甲公司因无力偿还到期的乙银行借款本金5000万元，双方签订债务重组协议，约定甲公司以账面价值为2000万元的无形资产和账面价值为2200万元的交易性金融资产，偿还乙银行借款4000万元，剩余借款1000万元延期2年后偿还，甲公司于每年继续按原借款年利率3.5%（与实际年利率相同）支付利息。当日，甲公司与乙银行办理完成资产过户手续，相应无形资产的公允价值为2100万元。2×24年7月20日，甲公司资金状况进一步恶化，与乙银行签订债务重组补充协议，约定甲公司仅需在2×26年2月5日偿还剩余借款本金1000万元，不再每年支付利息，2×24年7月20日，甲公司新增借款的市场年利率为8%。除货币时间价值外，不考虑相关税费及其他因素，下列各项关于甲公司债务重组会计处理的表述中，正确的是（ ）。（2025年回忆版）\n\nA.在2×24年7月20日将按年利率8%计算的剩余银行借款现值与原账面价值之间的差额计人投资收益  \nB.将无形资产公允价值与其账面价值的差额计人其他收益  \nC.将交易性金融资产账面价值与2000万元银行借款之间的差额计人投资收益  \nD.2×24年7月20日后对剩余银行借款现值按年利率3.5%计提利息\n\n（解析）债务重组采用以资产清偿债务（同时包含金融资产和非金融资产）、修改其他条款等组合方式进行的，所清偿债务的账面价值与转让资产的账面价值以及重组债务的确认金额之和的差额，记入“其他收益—债务重组收益”科目，选项B和C错误；2×24年7月20日重组债务未来现金流量现值=1000/（1+3.5%）1.55=948.07（万元），现金流变化=（1000-948.07）/1000×100%=5.19%<10%，不构成实质性修改，不应终止确认该部分负债，应当继续按照3.5%的年利率计提利息，选项A错误，选项D正确。\n\n【例题13·多选题】2×25年，甲公司发生的有关交易或事项如下：（1）向乙公司转让账面价值为120万元的应收账款，抵偿对乙公司的115万元借款，应收账款的公允价值与账面价值相同；（2）向丙公司转让账面价值为300万元的债权投资和账面价值为200万元的固定资产，抵偿对丙公司的550万元借款，债权投资和固定资产的公允价值分别为310万元和180万元；（3）与丁公司达成债务重组协议约定，丁公司豁免甲公司的债务100万元；（4）向戊公司发行100万股股票，以清偿对戊公司的500万元债务，股票每股面值为1元、公允价值为4.8元。本题各公司之间不存在关联关系，不考虑其他因素，下列各项关于甲公司会计处理的表述中，正确的有（ ）。\n\nA.对与戊公司之间的债务重组确认20万元投资收益和380万元资本公积.B.对与乙公司之间的债务重组确认5万元投资损失  \nC.对与丁公司之间的债务重组确认100万元其他收益  \nD.对与丙公司之间的债务重组确认50万元其他收益  \n解析）甲公司相关会计处理如下：  \n事项（1），与乙公司进行债务重组。  \n借：其他应付款等投资收益贷：应收账款\n\n例（真）题-答案」 12.D\n\n事项（2），与丙公司进行债务重组。\n\n借：其他应付款等\n\n贷：债权投资\n\n其他收益\n\n事项（3），甲公司与丁公司进行债务重组，属于修改其他条款的方式，由于甲公司与丁公司不存在关联方关系，故应将原债务与重组债务之间的差额计入投资收益。\n\n事项（4），与戊公司进行债务重组。\n\n借：应付账款等\n\n贷：股本\n\n资本公积一股本溢价 380\n\n投资收益 20\n\n## （四）组合方式\n\n债务重组采用以资产清偿债务、将债务转为权益工具、修改其他条款等组合方式进行的，对于权益工具，债务人应当在初始确认时按照权益工具的公允价值计量，权益工具的公允价值不能可靠计量的，应当按照所清偿债务的公允价值计量。对于修改其他条款形成的重组债务，债务人应当参照上文“（三）修改其他条款”部分的内容，确认和计量重组债务。所清偿债务的账面价值与转让资产的账面价值以及权益工具和重组债务的确认金额之和的差额，记人“其他收益一债务重组收益”或“投资收益”（仅涉及金融工具、长期股权投资时）科目。\n\n值得注意的是，对于企业因破产重整而进行的债务重组交易，由于涉及破产重整的债务重组协议执行过程及结果存在重大不确定性，因此，企业通常应在破产重整协议履行完毕后确认债务重组收益，除非有确凿证据表明上述重大不确定性已经消除。"},{"title":"第三节 债务重组的相关披露 考点难度●○○易","content":"债务重组中涉及的债权、重组债权、债务、重组债务和其他金融工具的披露，应当按照《企业会计准则第37号一—金融工具列报》的规定处理。此外，债权人和债务人还应当在附注中披露与债务重组有关的额外信息。"}],"quizGroups":[{"type":"单项选择题","questions":[{"num":1,"text":"甲公司是乙公司的股东。2×25年6月30日，甲公司应收乙公司账款1000万元，以摊余成本进行后续计量。为解决乙公司的资金周转困难，甲公司、乙公司的其他债权人共同决定对乙公司的债务进行重组，并于2×25年7月15日与乙公司签订了债务重组合同。根据债务重组合同的约定，甲公司免除70%应收乙公司账款的还款义务，乙公司其他债权人免除40%应收乙公司账款的还款义务，豁免的债务在合同签订当日解除，对于其余未豁免的债务，乙公司应于2×25年8月底前偿还。2×25年8月20日，甲公司收到乙公司支付的账款300万元。不考虑其他因素，乙公司2×25年度因上述交易或事项应当确认的资本公积是（ ）万元。","options":[{"letter":"A","text":"700"},{"letter":"B","text":"400"},{"letter":"C","text":"300"},{"letter":"D","text":"1000"}],"answer":"C","explanation":"乙公司应确认资本公积的金额=1000×（70%-40%）=300（万元）。"},{"num":2,"text":"2×25年8月12日，甲公司与乙公司签订了债务重组协议，协议约定甲公司以其生产的产品和一项债券投资抵偿所欠乙公司货款113万元；当日，乙公司以摊余成本计量该债权且已对其计提坏账准备5万元，该债权的公允价值为110万元，用于抵债的产品市价为66万元，用于抵债的债券投资公允价值为40万元。2×25年8月20日，抵债资产交接完毕，双方解除债权债务关系；当日，用于抵债的债券投资公允价值为42万元，用于抵债的产品市价和该项债权的账面价值及其公允价值均不变，乙公司将取得的产品和债券投资分别作为存货和交易性金融资产核算。不考虑相关税费及其他因素，乙公司2×25年取得产品应确认的存货成本是（）万元。","options":[{"letter":"A","text":"68"},{"letter":"B","text":"66"},{"letter":"C","text":"70"},{"letter":"D","text":"65"}],"answer":"C","explanation":"乙公司2×25年取得产品应确认的存货成本=110-40=70（万元）。"},{"num":3,"text":"2×25年1月1日，甲公司与乙公司进行债务重组，合同签订日甲公司应收乙公司账款账面余额为1000万元，已提坏账准备80万元，其公允价值为950万元，乙公司以持有A公司20%股权抵偿上述账款。2×25年1月15日，甲公司和乙公司办理完成股权转让手续，该项股权投资的公允价值为1000万元，甲公司为取得该项股权投资支付直接相关费用6万元，取得该项股权投资后，甲公司对A公司能够施加重大影响。假定不考虑其他因素，甲公司债务重组取得长期股权投资的初始投资成本是（）万元。","options":[{"letter":"A","text":"1000"},{"letter":"B","text":"1006"},{"letter":"C","text":"956"},{"letter":"D","text":"950"}],"answer":"C","explanation":"债权人通过债务重组取得对联营企业投资的初始投资成本，包括放弃债权的公允价值和可直接归属于该资产的税金等其他成本。甲公司债务重组取得长期股权投资的初始投资成本=950+6=956（万元）。"},{"num":4,"text":"甲公司销售商品产生应收乙公司货款600万元，因乙公司资金周转困难，已逾期1年以上尚未支付，甲公司就该债权计提了120万元坏账准备。2×25年10月20日，双方经协商达成以下协议：乙公司以其生产的100件丙产品和一项应收银行承兑汇票偿还所欠甲公司货款，当日甲公司该债权公允价值为500万元。乙公司用以偿债的丙产品单件成本为2万元，市场价格（计税价格）为3万元（不含增值税），银行承兑汇票票面金额为160万元（与公允价值相等）。10月25日，甲公司收到乙公司的100件丙产品及银行承兑汇票，乙公司向甲公司开具了增值税专用发票，双方债权债务结清。甲、乙公司均为增值税一般纳税人，销售商品适用增值税税率均为13%。不考虑其他因素，下列各项关于甲公司该项交易会计处理的表述中，错误的是（ ）。","options":[{"letter":"A","text":"确认当期损益20万元"},{"letter":"B","text":"确认增值税进项税额39万元"},{"letter":"C","text":"确认丙产品人账价值300万元"},{"letter":"D","text":"确认应收票据人账价值160万元"}],"answer":"C","explanation":"甲公司会计处理如下：\n借：应收票据 160库存商品 301（500-160-39）应交税费一应交增值税（进项税额） 39（100×3×13%）坏账准备 120贷：应收账款 600投资收益 20[500-（600-120）]"},{"num":5,"text":"甲公司与乙公司均为增值税一般纳税人。甲公司销售给乙公司一批商品，价款为300万元，增值税税额为39万元，款项尚未收到。甲公司与乙公司协商进行债务重组，乙公司用一批材料和一台设备（固定资产）抵偿全部价款。该原材料的账面余额为110万元，已计提存货跌价准备20万元，公允价值为100万元，增值税税额为13万元；设备原价为200万元，已计提折旧80万元，未计提减值准备，公允价值为130万元，增值税税额为16.9万元。不考虑其他因素，乙公司应计人营业利润的金额是（）万元。","options":[{"letter":"A","text":"129"},{"letter":"B","text":"99.1"},{"letter":"C","text":"109"},{"letter":"D","text":"79.1"}],"answer":"B","explanation":"应付债务账面价值是339万元（300+39），抵债资产账面价值=（110-20）+（200-80）=210（万元），增值税销项税额=13+16.9=29.9（万元），乙公司应计入营业利润的金额=339-210-29.9=99.1（万元）。"},{"num":6,"text":"甲公司为上市公司，拟进行破产重整。2×25年2月，当地法院批准了甲公司的重整计划，对于超过10万元以上部分（共计2亿元）的普通债权按照 20%的比例以现金进行清偿，并在重整计划获法院裁定批准之日起4年内分4期清偿完毕，每年为一期，每期偿还1/4。破产重整方案中还规定，只有在甲公司履行重整计划规定的偿债义务后，债权人才根据重整计划豁免其剩余债务，否则管理人或债权人有权要求终止重整计划，债权人在重整计划中所作的债权调整承诺也随之失效。甲公司下列会计处理中正确的是（ ）。","options":[{"letter":"A","text":"甲公司2×25年不应确认债务重组收益"},{"letter":"B","text":"甲公司2×25年应确认债务重组收益4000万元"},{"letter":"C","text":"甲公司2×25年应确认债务重组收益16000万元"},{"letter":"D","text":"甲公司2×25年应确认资本公积4000万元"}],"answer":"A","explanation":"根据甲公司的破产重整方案，“只有在甲公司履行重整计划规定的偿债义务后，债权人才根据重整计划豁免其剩余债务，否则管理人或债权人有权要求终止重整计划，债权人在重整计划中所作的债权调整承诺也随之失效”。这说明，债权人所作出的债务豁免承诺只有在甲公司按照重整计划的规定履行完所有偿债义务之后才生效，在此之前，甲公司不应该确认债务重组收益。"}]},{"type":"多项选择题","questions":[{"num":1,"text":"甲公司下列各项债权债务中，当发生债务重组时不适用债务重组准则进行会计处理的有（ ）。","options":[{"letter":"A","text":"预收乙公司销售货款100万元"},{"letter":"B","text":"向丙公司应收融资租赁款2000万元"},{"letter":"C","text":"因向戊公司提供建筑施工服务确认的合同资产800万元"},{"letter":"D","text":"因向丁公司销售商品提供相关质量保证确认的预计负债200万元"}],"answer":"ACD","explanation":"债务重组涉及的债权和债务，是指《企业会计准则第22号—一金融工具确认和计量》规范的债权和债务，不包括合同资产（选项C）、合同负债（选项A）、预计负债（选项D），但包括租赁应收款（选项B）和租赁应付款。"},{"num":2,"text":"下列各项关于企业债务重组会计处理的表述中，错误的有（ ）。","options":[{"letter":"A","text":"适用债务重组准则的债务包括合同负债"},{"letter":"B","text":"债权人在债务重组中受让的对联营企业投资的成本按照放弃债权的公允价值以及可直接归属于该投资的其他成本确定"},{"letter":"C","text":"母公司以股东身份对子公司进行债务豁免，母公司确认债务重组损失"},{"letter":"D","text":"债权人在债务重组中受让非金融资产，放弃债权的公允价值与账面价值之间的差额计人利润表“其他收益”项目"}],"answer":"ACD","explanation":"债务重组涉及的债权和债务，是指《企业会计准则第22号——金融工具确认和计量》规范的债权和债务，不包括合同资产、合同负债、预计负债，但包括租赁应收款和租赁应付款，选项A错误；母公司以股东身份对子公司进行债务豁免，以股东身份进行债务重组，构成权益性交易，母公司应确认对子公司的投资，不确认债务重组损失，选项C错误；债权人放弃债权的公允价值与账面价值之间的差额计人投资收益，选项D错误。"},{"num":3,"text":"2×25年11月30日，甲公司应收乙公司账款账面余额为260万元，已提坏账准备13万元，其公允价值为250万元，甲公司与乙公司协商进行债务重组，乙公司以增发80万股普通股偿还债务，假设普通股每股面值为1元，合同签订日乙公司股票收盘价为3元／股。2×25年12月30日，双方办理完成相关手续，甲公司发生直接相关税费2万元，乙公司股票当日收盘价为3.1元／股，甲公司取得乙公司普通股后能够对乙公司施加重大影响。不考虑其他因素，2×25年12月30日甲公司和乙公司下列会计处理中正确的有（ ）。","options":[{"letter":"A","text":"甲公司长期股权投资初始投资成本为249万元"},{"letter":"B","text":"该项业务影响甲公司2×25年当期损益金额为3万元"},{"letter":"C","text":"该项业务影响乙公司2×25年当期损益金额为20万元"},{"letter":"D","text":"该项业务影响乙公司2×25年当期损益金额为12万元"}],"answer":"BD","explanation":"以债务重组方式取得对联营企业投资的，长期股权投资的初始投资成本=放弃债权\n的公允价值250+直接相关税费2=252（万元），选项A错误；甲公司因该项债务重组计人当期损益的金额=250-（260-13）=3（万元），选项B正确；乙公司因该项债务重组影响当期损益的金额 $= 2 6 0 - 3 . 1 \\times 8 0 { = } 1 2$ （万元），选项C错误，选项D正确。"},{"num":4,"text":"M公司与N公司均为增值税一般纳税人，购买及销售商品、设备适用的增值税税率均为13%。M公司销售给N公司一批商品，价款为1000万元，增值税税额为130万元，款项尚未收到，因N公司发生资金困难，已无力偿还M公司的全部货款。2×25年10月5日双方签订债务重组合同，M公司同意N公司分别用一项债权投资、一批材料和一项设备（固定资产）予以抵偿。M公司对该笔应收账款已计提坏账准备200万元，其公允价值为1000万元。合同签订日，债权投资公允价值为300万元，原材料的成本为150万元，已计提存货跌价准备10万元，公允价值为100万元；设备原价400万元，已计提折旧100万元，未计提减值准备，公允价值为400万元。2×25年10月25日，M公司收到上述资产，双方解除债权债务关系，该日债权投资的公允价值为305万元。不考虑其他因素，M公司下列会计处理中正确的有（ ）。","options":[{"letter":"A","text":"债权投资人账价值为305万元"},{"letter":"B","text":"原材料入账价值为127万元"},{"letter":"C","text":"固定资产人账价值为508万元"},{"letter":"D","text":"计入当期损益的金额为70万元"}],"answer":"ABC","explanation":"债权投资按取得时的公允价值305万元人账，选项A正确；原材料和固定资产人账价值总额=放弃债权的公允价值1000-合同生效日债权投资公允价值300-增值税进项税额$[ \\left( 1 0 0 + 4 0 0 \\right) \\times 1 3 \\% ] = 6 3 5$ （万元），按原材料和固定资产合同生效日的公允价值比例分配，原材料人账价值 $= 6 3 5 \\times 1 0 0 / 5 0 0 { = } 1 2 7$ （万元），固定资产人账价值 $= 6 3 5 \\times 4 0 0 / 5 0 0 { = } 5 0 8$ （万元），选项B和C正确；计入当期损益的金额=放弃债权公允价值1000-账面价值（1130-200）+债权投资重组日公允价值与合同生效日公允价值的差额（305-300）=75（万元），选项D错误。\nM公司会计分录如下：\n借：原材料\n固定资产\n债权投资\n坏账准备\n贷：应收账款\n投资收益"},{"num":5,"text":"甲公司应付乙公司购货款600万元于2×25年6月20日到期，当日甲公司与乙公司签订债务重组协议，甲公司以其生产的100件A产品抵偿该债务，甲公司将抵债产品运抵乙公司并开具增值税专用发票后，原600万元债务结清，甲公司A产品的市场价格（计税价格）为每件5万元（不含增值税），成本为每件4万元，未计提存货跌价准备，2×25年6月20日该债权公允价值为525万元，乙公司已就该债权计提了100万元坏账准备。2×25年6月30日，甲公司将A产品运抵乙公司并开具增值税专用发票。甲、乙公司均为增值税一般纳税人，销售商品适用的增值税税率均为13%。不考虑其他因素，下列关于该交易或事项的会计处理表述中，正确的有（ ）。","options":[{"letter":"A","text":"甲公司应计人其他收益的金额为135万元"},{"letter":"B","text":"甲公司应确认主营业务收人500万元"},{"letter":"C","text":"乙公司取得A产品的人账价值为460万元"},{"letter":"D","text":"乙公司应计人投资收益的金额为25万元"}],"answer":"ACD","explanation":"甲公司应计人其他收益的金额 $= 6 0 0 - 1 0 0 \\times 4 - 1 0 0 \\times 5 \\times 1 3 \\% = 1 3 5$ （万元），选项A正确；债务重组为非日常活动，甲公司不确认主营业务收入，选项B错误；乙公司取得A产品的入账价值 $= 5 2 5 - 1 0 0 \\times 5 \\times 1 3 \\% = 4 6 0$ （万元），选项C正确；乙公司计入投资收益的金额=525-（600-100）=25（万元），选项D正确。"},{"num":6,"text":"甲、乙公司均为增值税一般纳税人，2×25年3月甲公司销售一批商品给乙公司，开出的增值税专用发票上注明的销售价款为1000万元，增值税税额为130万元，货款尚未收到。2×25年6月20日甲公司与乙公司协商进行债务重组，甲公司同意乙公司将其拥有的一项固定资产（厂房）用于抵偿债务，甲公司已为该项应收账款计提了100万元的坏账准备，当日其公允价值为1000万元。2×25年6月30日，乙公司将固定资产交付给甲公司，双方办理完成产权转移手续，解除债权债务关系，乙公司固定资产账面原值为1200万元，已计提累计折旧300万元，未计提减值准备，公允价值为800万元（等于计税价格），增值税税额为72万元。假设不考虑其他因素影响。下列甲公司和乙公司有关债务重组的会计处理中正确的有（ ）。","options":[{"letter":"A","text":"乙公司计人其他收益的金额为158万元"},{"letter":"B","text":"乙公司不确认资产处置损益"},{"letter":"C","text":"甲公司计人当期损益的金额为-30万元"},{"letter":"D","text":"甲公司取得厂房人账价值为800万元"}],"answer":"ABC","explanation":"乙公司应计入其他收益的金额=（1000+130）－（1200-300）-72=158（万元），选项A正确；乙公司不确认固定资产公允价值与账面价值的差额，即不确认资产处置损益，选项B正确；甲公司计入当期损益的金额=1000-（1130-100）=-30（万元），选项C正确；甲公司取得厂房人账价值=放弃债权公允价值1000-增值税进项税额72=928（万元），选项D错误。"},{"num":7,"text":"下列关于债务重组中债务人会计处理的表述中，错误的有（ ）。","options":[{"letter":"A","text":"以固定资产清偿债务方式进行债务重组的，债务人应当在固定资产和所清偿债务符合终止确认条件时予以终止确认，所清偿债务账面价值与转让固定资产账面价值之间的差额计人当期损益"},{"letter":"B","text":"以无形资产清偿债务方式进行债务重组的，债务人应当在无形资产和所清偿债务符合终止确认条件时予以终止确认，所清偿债务公允价值与转让无形资产公允价值之间的差额计入当期损益"},{"letter":"C","text":"将债务转为权益工具方式进行债务重组的，债务人应当在所清偿债务符合终止确认条件时予以终止确认。债务人初始确认权益工具时应当按照权益工具的公允价值计量，权益工具的公允价值不能可靠计量的，应当按照所清偿债务的公允价值计量。所清偿债务账面价值与权益工具确认金额之间的差额计人资本公积"},{"letter":"D","text":"采用修改其他条款方式进行债务重组的，债务人应当按照《企业会计准则第22号-金融工具确认和计量》和《企业会计准则第37号—金融工具列报》的规定，确认和计量重组债务"}],"answer":"BC","explanation":"所清偿债务账面价值与转让无形资产账面价值之间的差额计人当期损益，选项B错误；所清偿债务账面价值与权益工具确认金额之间的差额，应当计人当期损益，选项C错误。"}]},{"type":"计算分析题","questions":[]}]},{"chTitle":"第二十二章 外币折算","header":"## 第二十二章 外币折算\n\n考情速览\n\n<table><tr><td colspan=\"3\"></td></tr><tr><td>复习难度</td><td>常考题型</td><td>近5年考试平均分值</td></tr><tr><td>★★</td><td>客观题+主观题</td><td>3分左右</td></tr><tr><td>学习指南 属于比较重要章节。</td><td>本章考题以客观题为主，主观题可与借款费用、金融工具等内容结合，</td><td></td></tr></table>\n\n## 教材主要变化\n\n无变化。\n\n## 考点框架\n\n<table><tr><td rowspan=1 colspan=3>外币折算</td></tr><tr><td rowspan=3 colspan=1>记账本位币的确定</td><td rowspan=1 colspan=1>记账本位币的确定</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=1 colspan=1>境外经营记账本位币的确定</td><td rowspan=1 colspan=1>●0o易</td></tr><tr><td rowspan=1 colspan=1>记账本位币变更的会计处理</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=3 colspan=1>外币交易的会计处理</td><td rowspan=1 colspan=1>汇率</td><td rowspan=1 colspan=1>●0o易</td></tr><tr><td rowspan=1 colspan=1>外币交易的记账方法</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=1 colspan=1>外币交易的会计处理</td><td rowspan=1 colspan=1>中</td></tr><tr><td rowspan=2 colspan=1>外币财务报表折算</td><td rowspan=1 colspan=1>境外经营财务报表的折算</td><td rowspan=1 colspan=1>●中</td></tr><tr><td rowspan=1 colspan=1>境外经营的处置</td><td rowspan=1 colspan=1>●0o易</td></tr></table>\n\n\n\n## 考点剖析\n\n本章一般以客观题的形式进行考核，也可以与金融工具等章节结合考查主观题，在学习本章时，重中之重是要选择正确的汇率、区分外币交易和外币财务报表折算。您可以学习一遍知识点后，闭卷做题练习，如有疑惑，找到学习的盲点和误区，再逐一击破。","sections":[{"title":"第一节 记账本位币的确定","content":"## 一、记账本位币的确定\n\n考点难度●〇○ 易\n\n记账本位币，是指企业经营所处的主要经济环境中的货币。\n\n企业通常应选择人民币作为记账本位币。业务收支以人民币以外的货币为主的企业，可以按规定选定其中一种货币作为记账本位币。但是编报的财务会计报告应当折算为人民币。\n\n企业选定记账本位币，应当考虑下列因素：\n\n（1）该货币主要影响商品和劳务的销售价格，通常以该货币进行商品和劳务的计价和结算；\n\n（2）该货币主要影响商品和劳务所需人工、材料和其他费用，通常以该货币进行上述费用的计价和结算；\n\n（3）融资活动获得的资金以及保存从经营活动中收取款项时所使用的货币。在有些情况下，企业根据收支情况难以确定记账本位币，需要在收支基础上结合融资活动获得的资金或保存从经营活动中收取款项时所使用的货币进行综合分析后作出判断。\n\n企业记账本位币一经确定，不得随意变更，除非与确定企业记账本位币相关的经营所处的主要经济环境发生重大变化。\n\n## 点拨\n\n一般情况下，综合考虑（1）和（2）两项因素即可确定企业的记账本位币，在综合考虑（1）和（2）两项因素仍不能确定的情况下，第（3）项因素对企业记账本位币的确定起重要作用。\n\n## 二、境外经营记账本位币的确定\n\n考点难度●○易\n\n## （一）境外经营的含义\n\n境外经营，是指企业在境外的子公司、合营企业、联营企业、分支机构。当企业在境内的子公司、合营企业、联营企业或者分支机构采用不同于企业的记账本位币时，也视同境外经营。\n\n## （二）境外经营记账本位币的确定\n\n企业选定境外经营的记账本位币时，还应当考虑下列因素：\n\n（1）境外经营对其所从事的活动是否拥有很强的自主性；\n\n（2）境外经营活动中与企业的交易是否在境外经营活动中占有较大比重；\n\n（3）境外经营活动产生的现金流量是否直接影响企业的现金流量、是否可以随时汇回；\n\n（4）境外经营活动产生的现金流量是否足以偿还其现有债务和可预期的债务。\n\n## 三、记账本位币变更的会计处理\n\n考点难度●○○ 易\n\n企业因经营所处的主要经济环境发生重大变化，确需变更记账本位币的，应当采用变更当日的即期汇率将所有项目折算为变更后的记账本位币。由于采用同一即期汇率进行折算，因此不会产生汇兑差额。\n\n【真题1·单选题】2×24年6月30日，甲公司因经营所处的主要经济环境发生重大变化，记账本位币由港元变更为人民币，当日即期汇率为1港元=0.91元人民币，2×24年12月31日的即期汇率为1港元=0.94元人民币。2×24年度的平均汇率为1港元=0.93元人民币。不考虑其他因素，下列各项关于甲公司2×24年记账本位币变更会计处理的表述中正确的是（）。（2025年回忆版）\n\nA.现金流量表项目采用2×24年度的平均汇率折算\n\nB.权益性项目采用2×24年12月31日的即期汇率折算\n\nC.利润表项目采用2×24年6月30日的即期汇率折算\n\nD.非货币性项目采用交易发生日的历史汇率折算\n\n解析企业因经营所处的主要经济环境发生重大变化，确需变更记账本位币的，应当采用变更当日的即期汇率将所有项目折算为变更后的记账本位币，折算后的金额作为新的记账本位币的历史成本，选项C正确。\n\n## 例（真）题-答案」1.C"},{"title":"第二节外币交易的会计处理","content":"## 一、汇率\n\n考点难度●〇○易\n\n汇率是两种货币相兑换的比率。\n\n## （一）即期汇率的选择\n\n即期汇率，通常是指中国人民银行公布的当日人民币外汇牌价的中间价。企业通常应当采用即期汇率进行折算。汇率变动不大的，也可以采用即期汇率的近似汇率进行折算。但是企业发生的外币兑换业务或涉及外币兑换的交易事项，应当按照交易实际采用的汇率（即银行买人价或卖出价）折算。\n\n<table><tr><td rowspan=1 colspan=1>外币</td><td rowspan=1 colspan=2>人民币</td></tr><tr><td rowspan=2 colspan=1>100美元</td><td rowspan=1 colspan=1>买入价</td><td rowspan=1 colspan=1>卖出价</td></tr><tr><td rowspan=1 colspan=1>700元人民币</td><td rowspan=1 colspan=1>710元人民币</td></tr></table>\n\n\n\n## 点拨\n\n（1）买入价、卖出价是站在银行角度买入外币、卖出外币的价格；\n\n（2）外币存款无论增加还是减少均采用交易发生日的即期汇率折算。\n\n【例题2】甲股份有限公司以人民币为记账本位币，对外币交易采用交易日的即期汇率折算。2×25年10月10日，因外币支付需要，从银行购人10000欧元，银行当日的欧元卖出价为1欧元=7.20元人民币，中间价为1欧元=7.15元人民币，买人价为1欧元=7.1元人民币。\n\n甲公司有关会计分录如下：\n\n借：银行存款一欧元\n\n71500（10000 ×7.15）\n\n财务费用一汇兑差额\n\n500\n\n贷：银行存款一人民币\n\n72000（10000×7.20）\n\n## （二）即期汇率的近似汇率\n\n即期汇率的近似汇率，是指按照系统合理的方法确定的、与交易发生日即期汇率近似的汇率，通常是指当期平均汇率或加权平均汇率等。\n\n## 二、外币交易的记账方法\n\n外币交易的记账方法包含外币统账制和外币分账制两种类型。外币统账制是指企业在发生外币交易时，即折算为记账本位币入账。外币分账制是指企业在日常核算时分别币种记账，资产负债表日，分别货币性项目和非货币性项目进行调整，产生的汇兑差额计人当期损益。\n\n## 三、外币交易的会计处理 5年热点丨4次\n\n考点难度●●○中\n\n外币是企业记账本位币以外的货币。\n\n外币交易是指企业发生以外币计价或者结算的交易，包括买人或者卖出以外币计价的商品或劳务、借人或者借出外币资金和其他以外币计价或者结算的交易。\n\n## （一）初始确认\n\n外币交易应当在初始确认时，采用交易发生日的即期汇率将外币金额折算为记账本位币金额；也可以采用按照系统合理的方法确定的、与交易发生日即期汇率近似的汇率折算。\n\n企业收到投资者以外币投人的资本，应当采用交易发生日即期汇率折算，不得采用合同约定汇率和即期汇率的近似汇率折算，外币投人资本与相应的货币性项目的记账本位币金额之间不产生外币资本折算差额。\n\n借：银行存款（交易发生日即期汇率）\n\n贷：实收资本等（交易发生日即期汇率）\n\n## （二）期末调整或结算\n\n## 1.货币性项目\n\n货币性项目，是指企业持有的货币和将以固定或可确定金额的货币收取的资产或者偿付的负债。货币性资产包括库存现金、银行存款、应收账款、其他应收款、长期应收款、债权投资、其他债权投资等，货币性负债包括短期借款、应付账款、其他应付款、长期借款、应付债券、长期应付款等。\n\n## （1）期末调整\n\n期末，将所有外币货币性项目的外币余额，按照期末即期汇率折算为记账本位币金额，并与原记账本位币金额相比较，其差额记人\"财务费用一汇兑差额\"等科目。\n\n\n\n## 点拨 期末调整汇兑差额的计算思路：\n\n①外币账户的期末外币余额=期初外币余额+本期增加的外币发生额－本期减少的外币发生额；\n\n)调整后的记账本位币余额=期末外币余额× 期末即期汇率；\n\n③汇兑差额=调整后记账本位币余额－调整前记账本位币余额。\n\n## （2）结算\n\n结算外币货币性项目时，将其外币结算金额按照当日即期汇率折算为记账本位币金额，并与原记账本位币金额相比较，其差额记人\"财务费用一汇兑差额\"等科目。\n\n## 提示\n\n①结算符合资本化条件的外币\"长期借款一应计利息\"等产生的汇兑差额记入\"在建工程\"等科目；\n\n②与外币专门借款有关的汇兑差额，满足资本化条件的，应当予以资本化，计入在建工程、研发支出等。\n\n【例题3·多选题】甲公司以人民币为记账本位币，2×25年发生的有关外币交易或事项\n如下：（1）收到外币美元资本投人，合同约定的折算汇率与投入美元资本当日的即期汇率不同；\n（2）支付应付美元货款，支付当日的即期汇率与应付美元货款的账面汇率不同；（3）年末折算\n汇率与交易发生时的账面汇率不同。不考虑应予资本化的金额及其他因素，下列各项关于甲公\n司2×25年上述外币交易或事项会计处理的表述中，正确的有（ ）。A．偿还美元货款减少的银行存款按偿还当日的即期汇率折算为人民币记账B.收到外币美元资本投人时按合同约定的折算汇率折算的人民币记账C.外币美元资本于年末按年末汇率折算的人民币金额调整其账面价值D.各外币货币性项目按年末汇率折算的人民币金额与其账面人民币金额的差额计人当期损益\n\n（解析企业收到投资者以外币投入的资本，应当采用交易发生日即期汇率折算，不得采用合同约定汇率和即期汇率的近似汇率折算，期末也无须对投资者投入的外币资本进行折算，选项B和C不正确。\n\n【例题4·单选题】甲公司以人民币为记账本位币，外币业务采用业务发生时的即期汇\n率进行折算，按月计算汇兑损益。5月20日对外销售产品发生应收账款500万欧元，当日的即\n期汇率为1欧元=7.30元人民币。5月31日的即期汇率为1欧元=7.28元人民币；6月1日的\n即期汇率为1欧元=7.32元人民币；6月30日的即期汇率为1欧元=7.35元人民币。7月10\n日收到该应收账款，当日即期汇率为1欧元=7.34元人民币。该应收账款6月份应当确认的汇\n兑收益是（ ）万元人民币。A.-10 B.15 C. 25 D.35\n\n解析）该应收账款6月份应当确认的汇兑收益=500×（7.35-7.28）=35（万元人民币）。\n\n【例题5·单选题】甲公司以人民币为记账本位币，发生外币交易时采用交易日的即期汇\n率折算。甲公司12月20日进口一批原材料并验收人库，货款尚未支付；原材料成本为80万\n美元，当日即期汇率为1美元=6.8元人民币。12月31日，美元户银行存款余额为1000万美\n元，按年末汇率调整前的人民币账面余额为7020万元，当日即期汇率为1美元=6.5元人民币。\n上述交易或事项对甲公司12月份营业利润的影响金额是（）万元人民币。A.-220 B．-496 C.-520 D.-544\n\n解析上述交易或事项中，外币应付账款和银行存款产生的汇兑差额会影响营业利润，所以对甲公司12月份营业利润的影响金额 $= \\left( 8 0 \\times 6 . 8 - 8 0 \\times 6 . 5 \\right) + \\left( 1 0 0 0 \\times 6 . 5 - 7 0 2 0 \\right) =$ -496（万元人民币）。\n\n例（真）题-答案」 3.AD 4.D 5.B\n\n## 2.非货币性项目\n\n非货币性项目，是指货币性项目以外的项目，例如：预付账款、预收账款、合同负债、存货、长期股权投资、交易性金融资产（股票、基金）、固定资产、无形资产等。\n\n（1）以历史成本计量的外币非货币性项目，仍采用交易发生日的即期汇率折算，不改变其原记账本位币金额（即不产生汇兑差额）。\n\n【例题6·多选题】甲公司以人民币为记账本位币。2×25年6月10日，甲公司收到境外客户乙公司预付货款2000万美元；向境外客户丙公司销售4000万美元商品，商品控制权已转移，货款尚未收到；当日即期汇率为1美元=6.6元人民币。2×25年6月30日即期汇率为1美元=6.7元人民币。2×25年7月20日，甲公司向乙公司销售2000万美元商品，商品控制权已转移，当日即期汇率为1美元=6.665元人民币。2×25年7月28日，甲公司收到丙公司支付的货款4000万美元，当日即期汇率为1美元=6.62元人民币。甲公司每月编制财务报表。不考虑其他因素，下列各项关于甲公司外币交易折算会计处理的表述中，正确的有（ ）。\n\nA．2×25年7月28日，将收到的丙公司货款4000万美元按1美元=6.62元人民币汇率折算的人民币金额与应收账款按1美元=6.7元人民币汇率折算的人民币金额之差确认为财务费用\n\nB，2×25年6月30日，将预收乙公司的货款2000万美元按1美元=6.6元人民币汇率折算的人民币金额与按1美元=6.7元人民币汇率折算的人民币金额之差确认为财务费用\n\nC.2×25年7月20日，将预收乙公司的货款2000万美元按1美元=6.665元人民币汇率折算的人民币金额确认营业收入\n\nD.2×25年6月10日，将对丙公司的销售额4000万美元按1美元=6.6元人民币汇率折算的人民币金额确认营业收人\n\n解析外币合同负债属于以历史成本计量的非货币性项目，资产负债表日不进行折算，选项B错误；2×25年7月20日，将预收乙公司的货款2000万美元按1美元=6.6元人民币汇率折算的人民币金额确认营业收入，选项C错误。\n\n甲公司相关会计处理如下：\n\n2×25年6月10日\n\n借：银行存款\n\n13200（2000× 6.6）\n\n贷：合同负债\n\n13200\n\n借：应收账款\n\n26400（4000 ×6.6）\n\n贷：主营业务收入\n\n26400\n\n2×25年6月30日\n\n借：应收账款\n\n400[4000×（6.7-6.6）]\n\n贷：财务费用\n\n400\n\n2×25年7月20日\n\n借：合同负债\n\n贷：主营业务收入\n\n13200\n13200\n\n2×25年7月28日\n\n借：银行存款\n\n财务费用\n\n26480（4000×6.62）\n\n320\n\n贷：应收账款\n\n26800（26400+400）\n\n解题攻略外币合同负债是以历史成本计量的非货币性项目，资产负债表日不调整其记账本位币金额，减少合同负债确认主营业务收入时，应按合同负债发生时的汇率（1美元=6.6元人民币）折算；外币应收账款是货币性项目，资产负债表日应调整其记账本位币金额，结算应收账款时应按调整后的记账本位币金额（26400+400）结转。\n\n（2）以成本与可变现净值孰低进行期末计量的存货，如果其可变现净值以外币进行确定，则应在确定存货的期末价值时，先将存货可变现净值按资产负债表日即期汇率折算为记账本位币金额，再与以记账本位币反映的存货成本比较，从而确定该项存货的期末价值。\n\n【例题7·单选题】甲公司以人民币作为记账本位币，对期末存货按成本与可变现净值敦\n低计量。2×25年12月1日，甲公司进口一批商品，价款为200万美元，当日即期汇率为1\n美元=7.1元人民币。2×25年12月31日，甲公司该批商品中仍有50%尚未出售，可变现\n净值为90万美元，当日即期汇率为1美元=7.2元人民币。不考虑其他因素，2×25年12月\n31日，该批商品期末计量对甲公司利润总额的影响金额是（）万元人民币。A.减少124 B.增加124 C.增加62 D.减少62\n\n解析 期末存货可变现净值 $= 9 0 \\times 7 . 2 { = } 6 4 8$ （万元人民币），期末存货成本 $= 2 0 0 \\times$ $7 . 1 \\times 5 0 \\% { = } 7 1 0$ （万元人民币），期末存货确认资产减值损失 $= 7 1 0 - 6 4 8 = 6 2$ （万元人民币），减少利润总额62万元人民币，选项D正确。\n\n（3）以公允价值计量且其变动计人当期损益的外币非货币性项目，如交易性金融资产（股票、基金等），采用公允价值确定日的即期汇率折算，折算后的记账本位币金额与原记账本位币金额的差额，作为公允价值变动处理。\n\n【例题8·单选题】甲公司的记账本位币为人民币，2×25年12月5日以每股2美元的价\n格购人A公司 10000股股票作为以公允价值计量且其变动计人当期损益的金融资产核算，当\n日即期汇率为1美元=6.80元人民币，款项已经支付。2×25年12月31日，当月购人的A公\n司股票市价变为每股2.2美元，当日即期汇率为1美元=6.90元人民币。假定不考虑相关税费\n的影响，则甲公司期末因该交易性金融资产应计人公允价值变动损益的金额是（ ）元人\n民币。A.13800 B. 15800 C. 13600 D.1000\n\n解析 甲公司期末因该交易性金融资产应计入公允价值变动损益的金额 $= 2 . 2 \\times 1 0 0 0 0 \\times$ $6 . 9 0 { - 2 } \\times 1 0 0 0 0 \\times 6 . 8 0 { = } 1 5 8 0 0$ （元人民币）。\n\n（4）以公允价值计量且其变动计人其他综合收益的金融资产（债务工具）形成的汇兑差额，应当计人当期损益，并且采用实际利率法计算的该外币货币性金融资产的外币利息产生的汇兑差额，应当计人当期损益。以公允价值计量且其变动计人其他综合收益的外币非货币性金融资产（权益工具）产生的汇兑差额，与其公允价值变动均计人其他综合收益（处置时直接转人留存收益），但是该金融资产的外币现金股利形成的汇兑差额，应当计人当期损益。\n\n## 点拨\n\n①外币其他债权投资的汇兑差额=期末外币账户不含公允价值变动的账面余额×期末即期汇率－（上期末人民币户不含公允价值变动的账面余额+本期人民币户利息收入-本期人民币户收到的票面利息）。\n\n②外币其他权益工具投资虽然属于非货币性资产，但因期末要按记账本位币反映的公允价值计量，所以也会产生汇兑差额。\n\n【例题9·单选题】甲公司以人民币作为记账本位币，下列各项关于甲公司期末外币账户的外币账面价值折算为人民币的表述中，正确的是（）。A.外币合同负债按照资产负债表日的即期汇率进行折算B.外币预付账款按照资产负债表日的即期汇率进行折算C．以公允价值计量且其变动计人其他综合收益的外币债券投资汇兑差额计人其他综合收益D.持有的以摊余成本计量的外币债券投资按照资产负债表日的即期汇率进行折算\n\n（解析）选项A和B，属于以历史成本计量的外币非货币性项目，期末不需要折算；选项C，汇兑差额计入财务费用；选项D，属于外币货币性项目，期末采用资产负债表日即期汇率折算。\n\n【例题10·单选题】甲公司以人民币为记账本位币。2×24年3月10日，以每股5美元\n的价格购人乙公司在境外上市交易的股票20万股，发生相关交易费用1万美元，甲公司将其\n指定为以公允价值计量且其变动计入其他综合收益的金融资产，当日即期汇率为1美元=6.6\n元人民币。2×24年12月31日，乙公司股票的市场价格为每股6美元，当日即期汇率为1美\n元=6.9元人民币。2×25年2月5日，甲公司以每股8美元的价格将持有的乙公司股票全部出\n售，当日即期汇率为1美元=6.8元人民币。甲公司按净利润的10%提取盈余公积，不考虑相\n关税费及其他因素，下列各项关于甲公司上述交易或事项会计处理的表述中，正确的是（）。A．2×25年2月5日，确认投资收益260万元人民币B．购入乙公司股票的初始入账金额为660万元人民币C．2×24年12月31日，确认财务费用36万元人民币D.2×24年12月31日，确认其他综合收益161.4万元人民币\n\n（解析2×24年3月10日，甲公司购入乙公司股票，将其指定为其他权益工具投资核算，初始入账金额=（5×20+1）×6.6=666.6（万元人民币），选项B错误；2×24年12月31日，甲公司该其他权益工具投资的公允价值变动及汇兑差额均计入其他综合收益，确认其他综合收益金额=6×20×6.9-666.6=161.4（万元人民币），选项C错误，选项D正确；2×25年2月5日，甲公司出售其他权益工具投资时确认留存收益金额=8×20×6.8-（666.6+161.4）+161.4=421.4（万元人民币），选项A错误。\n\n相关会计分录如下：\n\n2×24年3月10日\n\n借：其他权益工具投资一成本\n\n贷：银行存款\n\n2×24年12月31日\n借：其他权益工具投资一公允价值变动 161.4贷：其他综合收益 161.4\n2×25年2月5日\n借：银行存款 1088（8×20×6.8）贷：其他权益工具投资一成本 666.6一公允价值变动 161.4盈余公积 26利润分配一未分配利润 234\n借：其他综合收益 161.4贷：盈余公积 16.14利润分配一未分配利润 145.26\n【例题11·单选题】下列各项关于外币折算会计处理的表述中，正确的是（）。\nA．期末外币预收账款以当日即期汇率折算并将由此产生的汇兑差额计人当期损益\nB.以公允价值计量且其变动计人其他综合收益的外币货币性金融资产形成的汇兑差额计人其他综合收益\nC．以公允价值计量且其变动计人其他综合收益的外币非交易性权益工具投资形成的汇兑差额计人其他综合收益\nD.收到投资者以外币投人的资本时，外币投入资本与相应的货币性项目均按合同约定汇率折算，不产生外币资本折算差额\n\n解析预收账款属于以历史成本计量的外币非货币性项目，期末不产生汇兑差额，选项A错误；以公允价值计量且其变动计入其他综合收益的外币货币性金融资产形成的汇兑差额计入财务费用，选项B错误；企业收到投资者以外币投入的资本，无论是否有合同约定汇率，均不得采用合同约定汇率和即期汇率的近似汇率折算，而是采用交易发生日即期汇率折算，选项D错误。"},{"title":"第三节 外币财务报表折算","content":"在将企业的境外经营通过合并、权益法核算等纳人企业的财务报表中时，需要将企业境外经营的财务报表折算为以企业记账本位币反映的财务报表，这一过程就是外币财务报表的折算。\n\n例（真）题-答案」 10.D 11.C\n\n## （一）对外币报表的折算\n\n## 1.资产负债表项目\n\n资产负债表中的资产和负债项目，采用资产负债表日的即期汇率折算，所有者权益项目除\"未分配利润\"项目外，其他项目采用发生时的即期汇率折算。\n\n## 点拨\n\n\"未分配利润\"项目无须折算，可以通过计算得到，期末未分配利润=期初未分配利润+本期净利润结转金额－本期提取盈余公积及分配股利减少金额等。\n\n## 2.利润表项目\n\n利润表中的收入和费用项目，采用交易发生日的即期汇率折算，也可以采用按照系统合理的方法确定的、与交易发生日即期汇率近似的汇率折算。\n\n## 3.外币财务报表折算差额\n\n产生的外币财务报表折算差额，在资产负债表中\"所有者权益\"项目下的\"其他综合收益\"项目列示。\n\n比较财务报表的折算比照上述规定处理。\n\n【例题12·多选题】甲公司为我国境内企业，其日常核算以人民币作为记账本位币。甲公\n司在英国和加拿大分别设有子公司，负责当地市场的运营，子公司的记账本位币分别为英镑和\n加元。甲公司在编制合并财务报表时，下列各项关于境外经营财务报表折算所采用汇率的表述\n中，正确的有（ ）。A.英国公司的固定资产采用购入时的历史汇率折算为人民币B.英国公司持有的作为以公允价值计量且其变动计入当期损益的金融资产的股票投资采用期末即期汇率折算为人民币C．加拿大公司的未分配利润采用报告期平均汇率折算为人民币D.加拿大公司的加元收人和成本可以采用报告期平均汇率折算为人民币\n\n解析外币财务报表折算时，对于资产负债表中的资产和负债项目，采用资产负债表日的即期汇率折算，所有者权益项目除\"未分配利润\"项目外，其他项目采用发生时的即期汇率折算，\"未分配利润\"项目无须折算，可以通过计算得到，期末未分配利润=期初未分配利润+本期净利润结转金额－本期提取盈余公积及分配股利减少金额等，选项A和C错误，选项B正确；\n\n利润表中的收入和费用项目，采用交易发生日的即期汇率折算，也可以采用按照系统合理的方法确定的、与交易发生日即期汇率近似的汇率折算（近似汇率通常为平均汇率），选项D正确。\n\n## （二）包含境外经营的合并财务报表编制的特殊处理\n\n1.少数股东应分担的外币财务报表折算差额\n\n在企业境外经营为其子公司的情况下，企业在编制合并财务报表时：\n\n（1）母公司应分担的外币财务报表折算差额，在合并资产负债表和合并所有者权益变动表中 \"其他综合收益\"项目列报；\n\n（2）少数股东应分担的外币财务报表折算差额，应并人\"少数股东权益\"项目列示。\n\n【真题13·单选题】乙公司和丙公司均为甲公司的境外子公司。甲公司的记账本位币和列\n报货币均为人民币，乙公司的记账本位币和列报货币均为美元，丙公司的记账本位币和列报货\n币均为港币。下列各项有关外币折算会计处理的表述中，正确的是（）。（2022年）A．乙公司个别财务报表中，以美元计价的购销、投资和借款交易均应以美元计量和列报B.丙公司个别财务报表中，以港币购人的某香港公司的股票应折算为人民币进行计量和列报C.甲公司个别财务报表中，收到境外投资者的英镑投资款，应将按合同约定汇率与按交易日汇率折算的差额计人当期损益D．甲公司在编制合并财务报表时，应将乙公司和丙公司的财务报表各项目折算为人民币，产生的折算差额计入当期损益\n\n解析由于丙公司记账本位币为港币，因此在丙公司个别财务报表中各项交易应以港币进行计量和列报，选项B不正确；甲公司个别财务报表中，收到境外投资者的英镑投资款，应当按照交易日的即期汇率折算，不产生汇兑差额，选项C不正确；甲公司在编制合并财务报表时，应将乙公司和丙公司的财务报表各项目折算为人民币，产生的折算差额计入所有者权益（其他综合收益和少数股东权益），选项D不正确。\n\n【例题14·多选题】甲公司以人民币为记账本位币，下列各项关于甲公司外币折算会计处理的表述中，错误的有（ ）。A．对非全资境外经营子公司财务报表进行折算产生的外币财务报表折算差额在合并资产负债表所有者权益中单设项目列示B.资产负债表日外币预付账款按即期汇率折算的人民币金额与其账面人民币金额之间的差额计人当期损益C.为购建符合资本化条件的资产而借人的外币专门借款本金及利息产生的汇兑差额在资本化期间内计人所购建资产的成本D.收到投资者投入的外币资本按合同约定汇率折算\n\n（解析)外币财务报表折算差额归属于母公司应分担的部分在合并资产负债表和合并所有者权益变动表中所有者权益项目下\"其他综合收益\"项目列示，属于少数股东应分担的部分应并入\"少数股东权益\"项目列示，选项A错误；预付账款属于以历史成本计量的外币非货币性项目，已在交易发生日按当日即期汇率折算，资产负债表日不应改变其原记账本位币金额，不产生汇兑差额，选项B错误；甲公司收到投资者以外币投入的资本，无论是否有合同约定汇率，均不采用合同约定汇率和即期汇率的近似汇率折算，而是采用交易日即期汇率折算，选项D错误。\n\n【例题15·单选题】下列各项关于年度外币财务报表折算会计处理的表述中，正确的是（ ）。A．外币财务报表折算差额在合并资产负债表的负债中单列项目列示B.资产负债表中未分配利润项目的年末余额按年末资产负债表日的即期汇率折算C．少数股东应分担的外币财务报表折算差额在合并资产负债表少数股东权益项目列示D．利润表中营业收入项目的本年金额按年末资产负债表日的即期汇率折算\n\n解析外币报表折算差额归属于母公司的部分应在合并资产负债表和合并所有者权益变动表中\"其他综合收益\"项目列示，少数股东分担的外币报表折算差额在\"少数股东权益\"项目列示，选项A错误，选项C正确；资产负债表所有者权益项目中除\"未分配利润\"项目外，其他项目采用发生时的即期汇率折算，\"未分配利润\"项目根据期初未分配利润加上本期实现的利润减去已分配的利润计算得出，无须折算，选项B错误；利润表中的收入和费用项目，采用交易发生日的即期汇率或即期汇率的近似汇率折算，选项D错误。\n\n2.实质上构成对境外经营净投资的外币货币性项目产生的汇兑差额在编制合并财务报表时的处理\n\n## 点拨\n\n作为集团整体，集团内部的长期应收款和长期应付款应相互抵销，从合并财务报表角度，长期应收款和长期应付款产生的汇兑差额是由于外币财务报表折算形成的，不应影响合并净利润，所以应将其由\"财务费用\"转入\"其他综合收益\"。\n\n母公司含有实质上构成对子公司（境外经营）净投资的外币货币性项目的情况下，在编制合并财务报表时，应分别以下两种情况编制抵销分录：\n\n（1）实质上构成对子公司净投资的外币货币性项目以母公司或子公司的记账本位币反映，则应在抵销长期应收应付项目的同时，将其产生的汇兑差额转人\"其他综合收益\"项目。即，借记或贷记\"财务费用一汇兑差额\"项目，贷记或借记\"其他综合收益\"项目。\n\n借：其他综合收益\n\n贷：财务费用\n\n或作相反分录。\n\n（2）实质上构成对子公司净投资的外币货币性项目以母、子公司的记账本位币以外的货币反映，则应将母、子公司此项外币货币性项目产生的汇兑差额相互抵销，差额转人\"其他综合收益\"项目。\n\n如果合并财务报表中各子公司之间也存在实质上构成对另一子公司（境外经营）净投资的外币货币性项目，在编制合并财务报表时应比照上述原则编制相应的抵销分录。\n\n【真题16·多选题】甲公司的记账本位币为人民币，其子公司乙公司的记账本位币为港币，下列各项有关外币折算会计处理的表述中，正确的有（）。（2023年）A．甲公司将编制合并财务报表时产生的外币报表折算差额计人损益B．乙公司发生的人民币交易无需进行外币折算\n\n例（真）题-答案」 15.C\n\nC．甲公司以前年度向乙公司提供的实质上构成了对乙公司投资的港币借款，甲公司编制合并财务报表时，在抵销与该笔借款相关的应收应付款的同时，将产生的汇兑差额转人其他综合收益\nD.甲公司编制合并财务报表时，将乙公司财务报表中的资产负债项目采用资产负债表日的即期汇率折算\n\n解析甲公司编制合并财务报表时产生的外币报表折算差额，其中归属于母公司应分担的部分在\"其他综合收益\"项目列示，归属于子公司少数股东应分担的部分应并入\"少数股东权益\"项目列示，选项A不正确；乙公司的记账本位币为港币，其发生的人民币交易应进行外币折算，选项B不正确。\n\n解题攻略会计上的外币是针对记账本位币而言的，乙公司的记账本位币为港币，其发生的人民币交易属于外币交易。\n\n【真题17·单选题】在母公司含有实质上构成对子公司（境外经营）净投资的外币长期应\n收款项目的情况下，不考虑其他因素，下列各项关于母公司合并财务报表有关外币报表折算会\n计处理的表述中，正确的是（ ）。（2021年）A.外币货币性项目以母公司记账本位币反映的，在抵销母子公司长期应收应付项目的同时，应将产生的汇兑差额在财务费用项目列示B.外币货币性项目以母公司或子公司以外的货币反映的，在抵销母子公司长期应收应付项目的同时，应将产生的汇兑差额在财务费用项目列示C．归属于少数股东的外币报表折算差额应在少数股东权益项目列示D.外币货币性项目以子公司记账本位币反映的，在抵销母子公司长期应收应付项目的同时，应将产生的汇兑差额在财务费用项目列示\n\n解析外币货币性项目以母公司或子公司的记账本位币反映，则应在抵销长期应收应付项目的同时，将其产生的汇兑差额转入\"其他综合收益\"项目，选项A和D错误；外币货币性项目以母、子公司的记账本位币以外的货币反映，则应将母、子公司此项外币货币性项目产生的汇兑差额相互抵销，差额转入\"其他综合收益\"项目，选项B错误。\n\n【例题18·多选题】下列各项关于企业外币财务报表折算会计处理的表述中，正确的有（ ）。A.企业采用资产负债表日即期汇率折算境外经营资产负债表中的未分配利润项目B.企业可以采用交易发生日即期汇率的近似汇率折算境外经营利润表中的收人和费用项目C.在企业境外经营为非全资子公司的情况下，企业在编制合并财务报表时，少数股东分担的外币报表折算差额应计人少数股东权益D.企业持有实质上构成对境外经营子公司净投资且与子公司记账本位币币种一致的外币长期应收款，企业合并财务报表中将该长期应收款产生的汇兑差额转人其他综合收益\n\n解析未分配利润项目金额根据期初未分配利润加上本期增加数、减去本期减少数计算确定，无须折算，选项A错误。\n\n## 二、境外经营的处置 5年热点丨2次\n\n企业可能通过出售、清算、返还股本或放弃全部或部分权益等方式处置其在境外经营中的利益。企业在处置境外经营时，应当将资产负债表所有者权益项目中与该境外经营相关的外币财务报表折算差额，转人处置当期损益；如果是部分处置境外经营，应当按处置的比例计算处置部分的外币报表折算差额，转入处置当期损益。\n\n## 点拨\n\n不丧失控制权处置子公司部分股份，应按处置比例将其他综合收益转入少数股东权益。\n\n【真题19·单选题】下列关于企业外币财务报表折算的表述中，正确的是（ ）。（2025年回忆版）A.境外经营纳入企业合并财务报表时先将境外经营的财务报表折算为以企业的记账本位币反映，然后再调整境外经营的会计政策使其与企业的会计政策一致B.境外子公司少数股东应分担的外币财务报表折算差额计人少数股东益C．企业处置境外经营时，将相关外币财务报表折算差额转出计人留存收益D．所有者权益中的未分配利润项目采用资产负债表日的即期汇率折算\n\n解析选项A，境外经营纳入企业合并财务报表时先调整境外经营的会计政策使其与企业的会计政策一致，然后再将境外经营的财务报表折算为以企业记账本位币反映的报表；选项C，企业处置境外经营时，将相关外币财务报表折算差额转出计入当期损益或少数股东权益；选项D，所有者权益中的\"未分配利润\"项目无须折算，可以通过计算得到，期末未分配利润=期初未分配利润+本期净利润结转金额－本期提取盈余公积及分配股利减少金额等。\n\n【例题20·单选题】下列各项关于企业外币财务报表折算会计处理的表述中，正确的是（ ）。A．境外子公司对其联营企业的投资应按报告期的平均汇率折算B.境外子公司财务报表折算产生的外币报表折算差额归属于少数股东的部分，在合并资产负债表的少数股东权益项目列示C.境外子公司的实收资本应按资产负债表日的即期汇率折算D.处置境外子公司时，原已列人合并财务报表所有者权益的外币报表折算差额中与该子公司相关的部分转人资本公积\n\n解析外币财务报表折算时，资产负债表中的资产和负债项目，采用资产负债表日的即期汇率折算，所有者权益项目除\"未分配利润\"项目外，其他项目采用交易发生时的即期汇率折算，选项A和C错误；在企业境外经营为其子公司的情况下，企业在编制合并财务报表时，应按少数股东在境外经营所有者权益中所享有的份额计算少数股东应分担的外币报表折算差额，并入少数股东权益列示于合并资产负债表，选项B正确；处置境外子公司时，原已列入合并财务报表所有者权益的外币报表折算差额中与该子公司相关的部分转入处置当期损益，选项D错误。\n\n例（真）题-答案」 19.B 20.B"}],"quizGroups":[{"type":"单项选择题","questions":[{"num":1,"text":"某外商投资企业以人民币作为记账本位币，收到外商作为实收资本投人的设备一台，协议作价（公允价值）100万美元，当日的即期汇率为1美元=7.10元人民币，投资合同约定汇率为1美元=6.80元人民币。另发生运杂费2万元人民币，进口关税5万元人民币，安装调试费3万元人民币，上述相关税费均以银行存款（人民币户）支付。该设备的人账价值是（）万元人民币。","options":[{"letter":"A","text":"700"},{"letter":"B","text":"720"},{"letter":"C","text":"710"},{"letter":"D","text":"680"}],"answer":"B","explanation":"企业收到投资者以外币投人的资本，无论是否存在合同约定汇率，均应当采用交易发生日的即期汇率折算为记账本位币，该设备的入账价值 $= 1 0 0 \\times 7 . 1 0 + 2 + 5 + 3 = 7 2 0$ （万元人民币）。"},{"num":2,"text":"某外商投资企业银行存款（美元）账户上期期末余额为500万美元，上期末即期汇率为1美元=6.90元人民币，该企业外币交易采用交易发生日即期汇率折算，以人民币作为记账本位币，按月计算汇兑损益。该企业本月10 日将其中100万美元在银行兑换为人民币，银行当日美元买人价为1美元=7.05元人民币，当日即期汇率为1美元=7.10元人民币。该企业本期没有其他涉及美元账户的业务，期末即期汇率为1美元=7.15元人民币。则该企业本期计人财务费用（汇兑损失）的金额共计（）万元人民币。","options":[{"letter":"A","text":"125"},{"letter":"B","text":"5"},{"letter":"C","text":"120"},{"letter":"D","text":"-115"}],"answer":"D","explanation":"该企业本期外币兑换产生的汇兑损失 $= \\left( 7 . 1 0 { - } 7 . 0 5 \\right) \\ \\times 1 0 0 { = } 5$ （万元人民币），银行存款（美元）账户产生的汇兑损失 $= \\left( 5 0 0 \\times 6 . 9 0 - 1 0 0 \\times 7 . 1 0 \\right) - 4 0 0 \\times 7 . 1 5 \\mathrm { = } - 1 2 0$ （万元人民币），该企业本期产生的汇兑损失总额 $= 5 - 1 2 0 = - 1 1 5$ （万元人民币）。"},{"num":3,"text":"甲公司记账本位币为人民币。12月1日，甲公司以每股6港元价格购人H股股票100万股，另支付相关税费1万港元，作为以公允价值计量且其变动计入当期损益的金融资产核算，当日汇率为1港元=0.86元人民币。由于市价变动,月末该H股股票的价格为每股6.5港元，当日汇率为1港元=0.88元人民币，则该以公允价值计量且其变动计人当期损益的金融资产对甲公司12月营业利润的影响金额是（）万元人民币。","options":[{"letter":"A","text":"55.14"},{"letter":"B","text":"56"},{"letter":"C","text":"56.14"},{"letter":"D","text":"-0.86"}],"answer":"A","explanation":"以公允价值计量且其变动计入当期损益的金融资产初始人账成本 ${ \\bf \\delta } = 6 \\times 1 0 0 \\times 0 . 8 6 =$ 516（万元人民币），投资收益借方金额 ${ \\bf \\varepsilon } = 1 \\times { \\bf 0 } . 8 6 = { \\bf 0 } . 8 6$ （万元人民币）；月末确认公允价值变动损益 $= 6 . 5 \\times 1 0 0 \\times 0 . 8 8 – 5 1 6 { = } 5 6$ （万元人民币）；因此，该以公允价值计量且其变动计入当期损益的金融资产对甲公司12月营业利润的影响金额 $= 5 6 - 0 . 8 6 = 5 5 . 1 4$ （万元人民币）。"},{"num":4,"text":"甲公司出于长期战略考虑，2×24年12月31日以1200万美元购买了在美国注册的乙公司发行在外的80%股份，并自当日起能够控制乙公司的财务和经营决策。甲公司以人民币为记账本位币，2×24年12月31日，乙公司可辨认净资产公允价值为1250万美元（与账面价值相等）；2×24年12月31日即期汇率为1美元=6.20元人民币。2×25年度，乙公司按购买日可辨认净资产公允价值为基础计算实现的净利润为200万美元。乙公司的利润表在折算为母公司记账本位币时，按照平均汇率折算。其他相关汇率信息如下：2×25年12月31日即期汇率为1美元=6.10元人民币；2×25年度平均汇率为1美元=6.15元人民币。 甲公司2×25年因外币报表折算而应计人合并财务报表中\"其他综合收益\"项目的金额是（）万元人民币。","options":[{"letter":"A","text":"-108"},{"letter":"B","text":"0"},{"letter":"C","text":"-116"},{"letter":"D","text":"-135"}],"answer":"A","explanation":"2×24年年末乙公司可辨认净资产1250万美元折算为记账本位币时应采用 $2 \\times 2 4$ 年12月31日的即期汇率，2×25年度按购买日可辨认净资产公允价值为基础计算的净利润，按照当期的平均汇率进行折算。外币报表折算差额=（1250+200）×6.10-（1250×$6 . 2 0 \\substack { + 2 0 0 \\times 6 . 1 5 } ) = - 1 3 5$ （万元人民币），甲公司2×25年因外币报表折算而应计入合并财务报表中其他综合收益项目的金额 $= - 1 3 5 \\times 8 0 \\% = - 1 0 8$ （万元人民币）。"},{"num":5,"text":"乙公司为甲公司的境外经营子公司，下列各项关于编制年度合并财务报表时会计处理的表述中，正确的是（ ）。","options":[{"letter":"A","text":"甲公司实质上构成对乙公司净投资的长期应收款项（以乙公司记账本位币反映）所产生的汇兑差额在合并资产负债表\"未分配利润\"项目列示"},{"letter":"B","text":"在合并财务报表中对境外经营子公司产生的外币报表折算差额应归属于母公司的部分在所有者权益中单列\"外币报表折算差额\"项目反映"},{"letter":"C","text":"采用资产负债表日即期汇率将乙公司财务报表折算为以甲公司记账本位币表示的财务报表"},{"letter":"D","text":"如果合并财务报表中各子公司之间也存在实质上构成对另一子公司净投资的外币货币性项目，编制合并财务报表时，比照母公司对子公司的净投资原则处理"}],"answer":"D","explanation":"选项A，甲公司实质上构成对乙公司净投资的长期应收款项（以乙公司的记账本位币反映）所产生的汇兑差额在合并资产负债表中\"其他综合收益\"项目反映；选项B，合并财务报表中对境外经营子公司产生的外币报表折算差额应归属于母公司的部分在\"其他综合收益\"项目反映，并非单列\"外币报表折算差额\"项目反映；选项C，乙公司的财务报表在折算时只有资产负债表中的资产和负债项目是采用资产负债表日的即期汇率折算。"}]},{"type":"多项选择题","questions":[{"num":1,"text":"境外经营记账本位币的确定应当考虑的因素有（ ）。","options":[{"letter":"A","text":"购买商品时计价和结算所使用的币种"},{"letter":"B","text":"境外经营对其所从事的活动是否拥有很强的自主性"},{"letter":"C","text":"融资活动获得的币种"},{"letter":"D","text":"境外经营活动产生的现金流量是否足以偿还其现有债务和可预期的债务"}],"answer":"ABCD","explanation":"企业选定记账本位币时，应当考虑下列因素：①该货币主要影响商品和劳务的销售价格，通常以该货币进行商品和劳务的计价和结算；②该货币主要影响商品和劳务所需人工、材料和其他费用，通常以该货币进行上述费用的计价和结算；③融资活动获得的货币以及保存从经营活动中收取款项所使用的货币。\n企业选定境外经营的记账本位币时,还应当考虑下列因素：①境外经营对其所从事的活动是否拥有很强的自主性；②境外经营活动中与企业的交易是否在境外经营活动中占有较大比重；③境外经营活动产生的现金流量是否直接影响企业的现金流量、是否可以随时汇回；④境外经营活动产生的现金流量是否足以偿还其现有债务和可预期的债务。所以选项A、B、C和D均正确。"},{"num":2,"text":"甲公司2×25年发生以下外币交易或事项：（1）取得外币借款800万美元用于补充外币流动资金，当日即期汇率为1美元=6.84元人民币；（2）自国外进口设备支付预付款500万美元，当日即期汇率为1美元=6.88元人民币；（3）出口销售确认应收账款900万美元，当日即期汇率为1美元=6.93元人民币；（4）收到私募股权基金对甲公司投资100万美元，当日即期汇率为1美元=6.98元人民币。假定甲公司有关外币项目均不存在期初余额，2×25年12月31日美元兑换人民币的即期汇率为1美元=6.99元人民币。不考虑其他因素，下列关于甲公司2×25年12月31日因上述项目产生的汇兑损益会计处理的表述中，正确的有（ ）。","options":[{"letter":"A","text":"应收账款产生汇兑收益应计人当期损益"},{"letter":"B","text":"预付设备款产生的汇兑收益应抵减拟购人资产成本"},{"letter":"C","text":"外币借款产生的汇兑损失应计人当期损益"},{"letter":"D","text":"取得私募股权基金投资所有者权益增加698万元人民币"}],"answer":"ACD","explanation":"选项A，实收资本采用股东出资日的即期汇率折算；选项C，资产负债表中的所有者权益项目除\"未分配利润\"项目外，其他项目采用发生时的即期汇率折算，\"未分配利润\"项目无须折算，可以通过计算得到，期末未分配利润=期初未分配利润+本期净利润结转金额－本期提取盈余公积及分配现金股利减少金额等。"},{"num":3,"text":"甲公司发生的外币交易及相应的会计处理如下：（1）为建造固定资产借人外币一般借款，资本化期间将该外币一般借款的利息和汇兑差额计人在建工程成本；（2）自境外市场购人的存货，期末按外币可变现净值与资产负债表日即期汇率计算的结果确定其可变现净值，并以此为基础计提存货跌价准备；（3）以外币计价的交易性金融资产，期末按外币市价与即期汇率计算的结果确定其公允价值，并以此为基础计算确认公允价值变动损益；（4）收到投资者投入的外币资本，按照合同约定汇率折算实收资本。不考虑其他因素，甲公司对上述外币交易进行的会计处理中正确的有（ ）。","options":[{"letter":"A","text":"以外币计价的交易性金融资产公允价值变动损益的确认"},{"letter":"B","text":"以外币计价的存货跌价准备的计提"},{"letter":"C","text":"投资者投人的外币资本的折算"},{"letter":"D","text":"外币一般借款利息及汇兑损益的处理"}],"answer":null,"explanation":null},{"num":4,"text":"下列各项中，在对境外经营财务报表进行折算时选用的有关汇率，符合会计准则规定的有（ ）。","options":[{"letter":"A","text":"实收资本采用投资合同约定的汇率折算"},{"letter":"B","text":"其他债权投资采用资产负债表日即期汇率折算"},{"letter":"C","text":"未分配利润采用报告期平均汇率折算"},{"letter":"D","text":"营业收人采用当期平均汇率折算"}],"answer":null,"explanation":null},{"num":5,"text":"下列各项关于企业外币交易和外币财务报表折算会计处理的表述中，正确的有（ ）。","options":[{"letter":"A","text":"企业因经营所处的主要经济环境发生重大变化，确需变更记账本位币的，应当采用变更当日的即期汇率将所有项目折算为变更后的记账本位币，折算后的金额作为新的记账本位币的历史成本"},{"letter":"B","text":"处置的境外经营为子公司的，若部分处置未丧失控制权，应将已列人其他综合收益的外币报表折算差额中归属于少数股东的部分，转入当期损益"},{"letter":"C","text":"以公允价值计量且其变动计人其他综合收益的外币非货币性金融资产形成的汇兑差额应当计人其他综合收益"},{"letter":"D","text":"企业为购建或生产符合资本化条件的资产而借入的专门借款为外币借款时，在借款费用资本化期间内，外币借款产生的汇兑差额，应当予以资本化，计人资产成本"}],"answer":"ACD","explanation":"处置的境外经营为子公司的，若部分处置未丧失控制权，应按处置比例将其他综合收益转人少数股东权益，选项B错误。"},{"num":6,"text":"甲公司记账本位币为人民币，2×24年12月31日，甲公司以1000万美元（与公允价值相等）购人乙公司债券，该债券剩余5年到期，面值为1250万美元，票面年利率为4.72%，购人时实际年利率为10%，每年12月31日收取利息，甲公司将该债券分类为以公允价值计量且其变动计人其他综合收益的金融资产。2×24年12月31日至2×25年12月31日，甲公司该债券投资自初始确认后信用风险未显著增加，每年年末按该金融工具未来12个月内预期信用损失的金额计量其损失准备余额分别为50万美元和40万美元。2×25年12月31日该债券投资公允价值为1050万美元（不含利息）。有关汇率如下：（1）2×24年12月31日，1美元=6.4元人民币；（2）2×25年12月31日，1美元=6.6元人民币。甲公司外币交易采用交易发生日即期汇率折算，不考虑其他因素。甲公司下列会计处理表述中，正确的有（ ）。","options":[{"letter":"A","text":"2×25年12月31日应确认信用减值损失264万元人民币"},{"letter":"B","text":"2×25年12月31日该债券投资账面价值为6930万元人民币"},{"letter":"C","text":"2×25年12月31日该债券投资应确认汇兑收益200万元人民币"},{"letter":"D","text":"2×25年12月31日该债券投资应确认\"其他综合收益一其他债权投资公允价值变动\"发生额59.4万元人民币"}],"answer":"BCD","explanation":"2×24年12月31日应确认其他债权投资信用减值准备余额 $= 5 0 \\times 6 . 4 = 3 2 0$ （万元人民币），2×25年12月31日应确认其他债权投资信用减值准备余额 $= 4 0 \\times 6 . 6 { = } 2 6 4$ （万元人民币），2×25年应转回信用减值损失=320-264=56（万元人民币），选项A错误；2×25年12月31日该债券投资账面价值 $= 1 0 5 0 \\times 6 . 6 { = } 6 9 3 0$ （万元人民币），选项B正确；2×25年12月31日该债券投资应确认汇兑收益 $= ( 1 0 0 0 + 1 0 0 0 \\times 1 0 \\% - 1 2 5 0 \\times 4 . 7 2 \\%$ ）×6.6-(1000×$6 . 4 + 1 0 0 0 \\times 1 function activate(ci,si,type){
  document.querySelectorAll('.ch-h').forEach(h=>h.classList.remove('on'));
  document.querySelectorAll('.si').forEach(s=>s.classList.remove('on'));
  const chDivs=document.querySelectorAll('.ch');
  const chDiv=chDivs[ci];if(!chDiv)return;
  const hh=chDiv.querySelector('.ch-h');hh.classList.add('open','on');
  const sl=chDiv.querySelector('.sl');sl.classList.add('show');
  const sis=sl.querySelectorAll('.si');
  const idx=type==='test'?0:(D[ci].quizGroups&&D[ci].quizGroups.length?si+1:si);
  if(sis[idx])sis[idx].classList.add('on');
}

function renderMd(text){
  if(!text)return '';
  const lines=text.split('\n');
  let html='';
  let i=0;
  let inTable=false;
  let tableBuf='';

  function collectTable(startLine){
    // startLine already contains <table>, may also contain </table> on same line
    let buf=startLine;
    if(buf.includes('</table>')) return buf;
    let j=i+1;
    while(j<lines.length){
      buf+=lines[j].trim();
      if(lines[j].includes('</table>')){i=j;return buf;}
      j++;
    }
    i=j;return buf;
  }

  while(i<lines.length){
    const line=lines[i];
    const t=line.trim();

    // --- TABLE block ---
    if(t.startsWith('<table')){
      const tb=collectTable(t);
      html+='<div class="tbl-wrap">'+tb+'</div>';
      i++;continue;
    }

    // --- blank line ---
    if(!t){i++;continue;}

    // --- headings ---
    const hMatch=t.match(/^(#{1,4})\s+(.+)/);
    if(hMatch){
      const lv=hMatch[1].length;
      const title=hMatch[2];
      if(/^提示/.test(title))      html+='<div class="tip"><strong>提示</strong> '+renderInline(title.replace(/^提示\s*/,''))+'</div>';
      else if(/^点拨\s/.test(title)) html+='<div class="tip note"><strong>点拨</strong> '+renderInline(title.replace(/^点拨\s*/,''))+'</div>';
      else if(/^点拨$/.test(title))   html+='<div class="tip note"><strong>点拨</strong></div>';
      else if(/^问答$/.test(title))   html+='<div class="tip" style="background:#fefce8;border-left-color:#eab308"><strong>问答</strong></div>';
      else if(/^考点难度/.test(title))html+='<div class="difficulty">'+esc(title)+'</div>';
      else if(lv===2) html+='<h3 class="sec-h3">'+renderInline(title)+'</h3>';
      else if(lv===3) html+='<h4 class="sec-h4">'+renderInline(title)+'</h4>';
      else html+='<h5>'+renderInline(title)+'</h5>';
      i++;continue;
    }

    // --- example / exam question ---
    const exM=t.match(/【(例题|真题)(\d+)·(单选题|多选题|判断题|计算分析题|综合题)】/);
    if(exM){
      html+='<div class="ex-card"><span class="badge">'+esc(exM[1])+exM[2]+' · '+esc(exM[3])+'</span>';
      const rest=t.slice(t.indexOf('】')+1).trim();
      if(rest) html+='<div class="ex-body">'+splitOpts(renderInline(rest))+'</div>';
      i++;
      while(i<lines.length){
        const nl=lines[i].trim();
        if(!nl){i++;continue;}
        if(nl.match(/^#{1,4}\s/)||nl.match(/【(例题|真题)/)) break;
        if(nl.startsWith('<table')){
          const tb=collectTable(nl);
          html+='<div class="tbl-wrap">'+tb+'</div>';
          i++;continue;
        }
        if(/^解析|^（解析）/i.test(nl)){
          html+='<div class="ex-ans"><strong>解析：</strong>'+renderInline(nl.replace(/^[（(]?解析[）)]?\s*/,''))+'</div>';
        }else if(/^（解题攻略/.test(nl)){
          html+='<div class="ex-ans"><strong>解题攻略：</strong>'+renderInline(nl.replace(/^（解题攻略[）)]?\s*/,''))+'</div>';
        }else{
          html+='<p>'+splitOpts(renderInline(nl))+'</p>';
        }
        i++;
      }
      html+='</div>';
      continue;
    }

    // --- answer line: 例（真）题-答案】 ---
    if(/例（真）题.*答案/.test(t)){
      html+='<div class="ans-line">'+esc(t)+'</div>';
      i++;continue;
    }

    // --- accounting entry lines ---
    if(/^[借贷]：/.test(t)||/^\s+[贷借]：/.test(t)){
      html+='<div class="entry">'+renderInline(t)+'</div>';
      i++;continue;
    }

    // --- numbered list (（1） （2）etc) ---
    if(/^[（(]\d+[）)]/.test(t)){
      html+='<div class="num-item"><span class="num-dot">'+t.match(/^[（(]\d+[）)]/)[0]+'</span>'+renderInline(t.replace(/^[（(]\d+[）)]\s*/,''))+'</div>';
      i++;continue;
    }

    // --- letter numbered (a. b. etc) ---
    if(/^\d+[.．、]\s/.test(t)){
      html+='<p class="indent">'+renderInline(t)+'</p>';
      i++;continue;
    }

    // --- paragraph ---
    html+='<p>'+renderInline(t)+'</p>';
    i++;
  }

  return html;
}

// split A. B. C. D. inline options into separate styled divs
function splitOpts(html){
  if(!html)return html;
  // find last ）or 。 before options start
  const aIdx=html.lastIndexOf('）。');
  const bIdx=html.lastIndexOf('）。');
  const cIdx=html.lastIndexOf('）');
  let cut=-1;
  // find the pattern: ） A.  or ）.A.  or just look for  A. after ）
  const m=html.match(/）[\s。]*A[\.．]/);
  if(m){
    cut=html.indexOf(m[0])+m[0].indexOf('A');
  }else{
    // try without ）
    const m2=html.match(/\sA[\.．]/);
    if(m2) cut=html.indexOf(m2[0])+1;
  }
  if(cut<0) return html;

  const body=html.slice(0,cut).trim();
  const optStr=html.slice(cut);
  const parts=optStr.split(/\s*([A-D])[\.．]\s*/);
  let optHtml='';
  for(let k=1;k<parts.length;k+=2){
    const letter=parts[k];
    const txt=(parts[k+1]||'').trim();
    if(/^[A-D]$/.test(letter)&&txt){
      optHtml+='<div class="opt-item"><span class="opt-letter">'+letter+'.</span><span>'+txt+'</span></div>';
    }
  }
  if(!optHtml) return html;
  return body+'<div class="opt-list">'+optHtml+'</div>';
}

function renderInline(s){
  if(!s)return '';
  s=esc(s);
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  return s;
}

function pick(btn){

  const parts=gid.split('_'),ci=parseInt(parts[0]),gt=parts.slice(1,-1).join('_'),qn=parseInt(parts[parts.length-1]);
  const ch=D[ci],grp=ch.quizGroups.find(g=>g.type===gt);
  if(!grp)return;
  const q=grp.questions.find(x=>x.num===qn);
  if(!q||!q.answer){
    btn.classList.add('sel');
    document.getElementById('qa_'+gid).classList.add('show');
    return;
  }

  const correct=q.answer.replace(/[^A-D]/g,'').split('');
  const multi=correct.length>1;

  btn.classList.add('sel');

  if(!multi){
    // single choice: reveal immediately
    const btns=card.querySelectorAll('.ob');
    btns.forEach(b=>{
      const bl=b.dataset.l;
      if(correct.includes(bl))b.classList.add('ok');
      else if(bl===l&&!correct.includes(bl))b.classList.add('no');
      b.style.pointerEvents='none';
    });
    card.classList.add(correct.includes(l)?'ok':'no');
    document.getElementById('qa_'+gid).classList.add('show');
  }else{
    const sel=card.querySelectorAll('.ob.sel');
    const selL=Array.from(sel).map(s=>s.dataset.l);
    if(selL.length>=correct.length){
      const allOk=correct.every(c=>selL.includes(c))&&selL.every(c=>correct.includes(c));
      const btns=card.querySelectorAll('.ob');
      btns.forEach(b=>{
        const bl=b.dataset.l;
        if(correct.includes(bl))b.classList.add('ok');
        else if(selL.includes(bl))b.classList.add('no');
        b.style.pointerEvents='none';
      });
      card.classList.add(allOk?'ok':'no');
      document.getElementById('qa_'+gid).classList.add('show');
    }
  }
}

function reveal(btn,gid){btn.style.display='none';document.getElementById('oa_'+gid).classList.add('show')}

function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'):''}
function md(t){return t?esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>'):''}
</script>
