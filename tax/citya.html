const state = { tab: 'train', selD: "C6D01", q: '', src: '全部', kind: '全部' };
let prevNavState = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function isD(id) { return /D|Ad/i.test(id) && !/O|X/i.test(id); }
function isO(id) { return /O/i.test(id); }

function ids(arr) {
  if (!arr || !arr.length) return '<span class="pure">— 纯O/X调用</span>';
  if (typeof arr === 'string') arr = [arr];
  return arr.map(id => {
    const cls = isD(id) ? 'd' : isO(id) ? 'o' : 'x';
    return `<span class="id ${cls}" data-id="${esc(id)}">${esc(id)}</span>`;
  }).join(' ');
}

function relationsOf(id) {
  const item = [...D_DATA, ...O_DATA, ...X_DATA].find(x => x.id === id);
  const rels = item && item.relations;
  if (!rels || !rels.length) return '';
  return `<div class="mapping"><b>关联：</b>${ids(rels)}</div>`;
}

function nav(id) {
  const curState = { tab: state.tab, selD: state.selD };
  if (isD(id)) {
    state.tab = 'train';
    if (D_DATA.some(x => x.id === id)) {
      state.selD = id;
      render();
      const btn = document.querySelector(`.side button[data-d="${id}"]`);
      if (btn) btn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  } else if (isO(id)) {
    prevNavState = curState;
    state.tab = 'ops';
    state.q = id;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    prevNavState = curState;
    state.tab = 'rules';
    state.q = id;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function renderPanelContent(d) {
  // 辨别训练只由 c.d 决定归属；D 表头不展示关系网。
  // 题卡“关联”只展示本题真正调用的 O/X，并防御性过滤任何 D 自链/误链。
  const cs = CASES.filter(c => c.d === d.id);
  return `<div class="dhero">
    <h2>${esc(d.id)} ${esc(d.title)}</h2>
    <div>${esc(d.desc)}</div>
    ${d.test ? `<div class="criterion"><b>准入测试：</b>${esc(d.test)}</div>` : ''}
  </div>
  ${cs.length ? cs.map(c => {
    const rels = (c.links || []).filter(id => id !== c.d && !isD(id));
    return `<div class="case" data-case="${esc(c.id)}">
      <h3>${esc(c.id)} · ${esc(c.title)}</h3>
      <div class="qtext">${esc(c.prompt)}</div>
      <div class="choices">
        ${(c.choices || []).map((x, i) => `<button class="choice" data-caseid="${esc(c.id)}" data-i="${i}">${String.fromCharCode(65 + i)}. ${esc(x)}</button>`).join('')}
      </div>
      <div class="feedback hidden" id="fb-${esc(c.id)}"></div>
      ${rels.length ? `<div class="mapping"><b>关联：</b>${ids(rels)}</div>` : ''}
    </div>`;
  }).join('') : '<div class="muted">当前辨别能力维度暂无训练案例。</div>'}`;
}

function selectD(id) {
  state.selD = id;
  const d = D_DATA.find(x => x.id === state.selD) || D_DATA[0];
  document.querySelectorAll('.side button').forEach(b => {
    b.classList.toggle('active', b.dataset.d === d.id);
  });
  const panel = document.querySelector('.panel');
  if (panel) {
    panel.innerHTML = renderPanelContent(d);
    bind();
  } else {
    render();
  }
}

function renderTrain() {
  if (!D_DATA.length) return '<div class="notice">暂无辨别维度数据</div>';
  const d = D_DATA.find(x => x.id === state.selD) || D_DATA[0];
  return `<div class="notice"><b>辨别训练：</b>只训练会让征/不征、计入/排除、退/不退、地点/优惠路线发生跳变的事实开关。关联规则放在具体案例下方；税率数字、期限、名单留在 X/O。</div>
<div class="grid">
  <aside class="side">
    ${D_DATA.map(x => `<button class="${x.id === d.id ? 'active' : ''}" data-d="${esc(x.id)}"><b>${esc(x.id)}</b><br><span class="muted">${esc(x.title)}</span></button>`).join('')}
  </aside>
  <section class="panel">
    ${renderPanelContent(d)}
  </section>
</div>`;
}

function filterData(data) {
  const q = state.q.trim().toLowerCase();
  return data.filter(x => !q || JSON.stringify(x).toLowerCase().includes(q));
}

function renderOps() {
  let data = filterData(O_DATA);
  return `<div class="tools">
  <input id="search" placeholder="搜索算子ID/名称/公式" value="${esc(state.q)}">
  ${prevNavState ? `<button id="btn-back" class="tab" style="padding:8px 14px;font-size:13px;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;">↩ 返回 (${esc(prevNavState.selD || '辨别训练')})</button>` : ''}
</div>
<div class="rulegrid">
  ${data.map(o => `<div class="card rule" id="${esc(o.id)}">
    <h3><span class="id o">${esc(o.id)}</span> ${esc(o.title)}</h3>
    <div class="formula">${esc(o.formula || o.body || '')}</div>
    ${o.note ? `<p class="muted">${esc(o.note)}</p>` : ''}
  </div>`).join('')}
</div>`;
}


function renderXSection(sec) {
  const chips = (sec.chips && sec.chips.length)
    ? `<div class="x-chips">${sec.chips.map(v => `<span class="x-chip">${esc(v)}</span>`).join('')}</div>` : '';
  const items = (sec.items && sec.items.length)
    ? `<ul class="x-items">${sec.items.map(v => `<li>${esc(v)}</li>`).join('')}</ul>` : '';
  const rows = (sec.rows && sec.rows.length)
    ? `<div class="x-rows">${sec.rows.map(r => `<div class="x-row"><div class="x-k">${esc(r.k)}</div><div class="x-v">${esc(r.v)}</div></div>`).join('')}</div>` : '';
  return `<div class="x-section">${sec.label ? `<div class="x-label">${esc(sec.label)}</div>` : ''}${chips}${items}${rows}</div>`;
}

function renderRules() {
  const data = filterData(X_DATA);
  const groupNames = [...new Set(X_DATA.map(x => x.group || '正列举').filter(g => data.some(x => (x.group || '正列举') === g)))];
  return `<div class="x-intro"><b>X = 正列举与低迁移。</b>这里只放名单、税率、阈值、期限、例外和专项口径；全部默认展开，让细节直接进入视野形成印象。事实跳变去 D，计算公式去 O，不在这里重复推理。</div>
<div class="tools">
  <input id="search" placeholder="搜索税目/名单/数字/期限/例外" value="${esc(state.q)}">
  ${prevNavState ? `<button id="btn-back" class="tab" style="padding:8px 14px;font-size:13px;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;">↩ 返回 (${esc(prevNavState.selD || '辨别训练')})</button>` : ''}
</div>
${groupNames.map(g => {
  const xs = data.filter(x => (x.group || '正列举') === g);
  return `<section class="x-group">
    <div class="x-grouphead"><h2>${esc(g)}</h2><span>${xs.length} 个细节单元</span></div>
    <div class="x-rulegrid">${xs.map(x => `<div class="card x-rule" id="${esc(x.id)}">
      <h3><span class="id x">${esc(x.id)}</span> ${esc(x.title)}</h3>
      ${x.body ? `<div class="x-summary">${esc(x.body)}</div>` : ''}
      ${(x.sections || []).map(renderXSection).join('')}
    </div>`).join('')}</div>
  </section>`;
}).join('')}`;
}

function renderAudit() {
  const sources = Array.from(new Set(QUESTIONS.map(x => x.source).filter(Boolean)));
  let data = QUESTIONS.filter(x => (state.src === '全部' || x.source === state.src) && (state.kind === '全部' || (state.kind === 'D' && x.d && x.d.length) || (state.kind === 'OX' && (!x.d || !x.d.length))));
  const q = state.q.trim().toLowerCase();
  if (q) data = data.filter(x => JSON.stringify(x).toLowerCase().includes(q));
  const total = QUESTIONS.length;
  const withD = QUESTIONS.filter(x => x.d && x.d.length).length;

  return `<div class="stats">
  <div class="stat"><b>${total}</b><br><span class="muted">可调用覆盖题目</span></div>
  <div class="stat"><b>${withD}</b><br><span class="muted">确有高价值D</span></div>
  <div class="stat"><b>${total - withD}</b><br><span class="muted">纯O/X，不伪造D</span></div>
</div>
<div class="tools">
  <input id="search" placeholder="搜索QID/题干/ID" value="${esc(state.q)}">
  <select id="src">
    <option>全部</option>
    ${sources.map(s => `<option ${state.src === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}
  </select>
  <select id="kind">
    <option value="全部">全部性质</option>
    <option value="D" ${state.kind === 'D' ? 'selected' : ''}>需要D</option>
    <option value="OX" ${state.kind === 'OX' ? 'selected' : ''}>纯O/X</option>
  </select>
</div>
${data.map(x => `<div class="card qcard">
  <div class="qtop">
    <div><b>${esc(x.qid || x.id || 'Q')} · ${esc(x.topic || x.title || '')}</b> <span class="muted">${esc(x.source || '')} ${x.split ? '/ ' + esc(x.split) : ''}</span></div>
    <span class="pure">${esc(x.kind || '辨别训练')}</span>
  </div>
  <div class="mapping"><b>D</b> ${ids(x.d)} &nbsp; <b>O</b> ${ids(x.o)} &nbsp; <b>X</b> ${ids(x.x)}</div>
  <details><summary>题干与选项</summary><div class="qtext">${esc(x.q || x.stem || '')}</div></details>
  <details><summary>答案与解析</summary><div class="answer">答案：${esc(x.answer || '')}</div><div class="analysis">${esc(x.analysis || '')}</div></details>
</div>`).join('')}`;
}

function render() {
  const side = document.querySelector('.side');
  const scrollTop = side ? side.scrollTop : 0;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  const app = document.getElementById('app');
  app.innerHTML = state.tab === 'train' ? renderTrain() : state.tab === 'ops' ? renderOps() : state.tab === 'rules' ? renderRules() : renderAudit();
  bind();
  const newSide = document.querySelector('.side');
  if (newSide && scrollTop) newSide.scrollTop = scrollTop;
}

function bind() {
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = (e) => {
    e.preventDefault();
    selectD(b.dataset.d);
  });
  document.querySelectorAll('.id[data-id]').forEach(b => b.onclick = e => { e.stopPropagation(); nav(b.dataset.id); });
  const btnBack = document.getElementById('btn-back');
  if (btnBack) {
    btnBack.onclick = (e) => {
      e.preventDefault();
      if (prevNavState) {
        state.tab = prevNavState.tab || 'train';
        if (prevNavState.selD) state.selD = prevNavState.selD;
        state.q = '';
        prevNavState = null;
        render();
      }
    };
  }
  document.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    const c = CASES.find(x => x.id === b.dataset.caseid);
    if (!c) return;
    const fb = document.getElementById('fb-' + c.id);
    const ok = Number(b.dataset.i) === c.ans;
    fb.className = 'feedback ' + (ok ? 'good' : 'bad');
    fb.innerHTML = `<b>${ok ? '路径正确' : '路径错了'}</b>｜${esc(c.why || '')}${c.flip ? `<div class="flip"><b>最小反事实：</b>${esc(c.flip)}</div>` : ''}`;
  });
  const search = document.getElementById('search');
  if (search) search.oninput = e => { state.q = e.target.value; render(); };
  const src = document.getElementById('src');
  if (src) src.onchange = e => { state.src = e.target.value; render(); };
  const kind = document.getElementById('kind');
  if (kind) kind.onchange = e => { state.kind = e.target.value; render(); };
}

document.querySelectorAll('.tab').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; state.q = ''; render(); });
render();
</script>
