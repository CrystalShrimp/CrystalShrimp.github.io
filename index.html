列条件之一的、能够单独区分的组成部分，且该组成部分已经处置或划分为持有待售类别：（1）该组成部分代表一项独立的主要业务或一个单独的主要经营地区；（2）该组成部分是拟对一项独立的主要业务或一个单独的主要经营地区进行处置的一项相关联计划的一部分；（3）该组成部分是专为转售而取得的子公司。\n\n## 点拨 判断终止经营的要点：\n\n①能够单独区分，指经营活动和现金流量能够单独区分。\n\n②具有一定规模。专为转售而取得的子公司也是企业的组成部分，但不要求具有一定规模，只要是单独区分的组成部分且满足时点要求，即构成终止经营。\n\n③时点要求：处置（主要业务终止）或者划分为持有待售类别。\n\n【例题9·多选题】下列项目中，不属于终止经营的有（ ）。\n\nA.甲公司在全国拥有500家规模相同的零售门店，甲公司决定将其位于某市的8家零售门店中的一家门店出售，并于2×25年10月27日与乙公司正式签订了转让协议\n\nB.乙集团拥有一家经营药品批发业务的子公司A公司，药品批发构成乙集团的一项独立的主要业务，且A公司在全国多个城市设立了营业网点，由于经营不善，乙集团决定停止A公司的所有业务，至2×25年10月27日，已处置了A公司所有存货并辞退了所有员工，但仍有一些债权等待收回，部分营业网点门店的租约尚未到期，仍需支付租金费用\n\nC.丙集团正在关闭其主要从事放贷业务的子公司B公司，自2×25年2月1日起，B公司不再贷出新的款项，但仍会继续收回未结贷款的本金和利息，直到原设定的贷款期结束\n\nD.丁公司决定关闭从事工程承包业务的W分部，要求W分部在完成现有承包合同后不再承接新的承包合同\n\n（解析选项A，不代表一项独立的主要业务或一个单独的主要经营地区，不属于终止经营；选项B，主要业务终止，属于终止经营；选项C和D，业务未完结，不属于终止经营。\n\n## 二、终止经营的列报 5年热点丨3次\n\n企业应当在利润表中分别列示持续经营损益和终止经营损益。不符合终止经营定义的持有待售的非流动资产或处置组，其减值损失和转回金额及处置损益应当作为持续经营损益列报。终止经营的减值损失和转回金额等经营损益及处置损益应当作为终止经营损益列报。\n\n## 提示 持有待售的非流动资产或处置组相关损益的列报：\n\n（1）符合终止经营定义的，作为终止经营损益列报；\n\n（2）不符合终止经营定义的，作为持续经营损益列报。\n\n企业在处置终止经营的过程中可能附带产生一些增量费用，如果不进行该项处置就不会产生这些费用，企业应当将这些增量费用作为终止经营损益列报。\n\n拟结束使用而非出售的处置组满足终止经营定义中有关组成部分的条件的，应当自停止使用日起作为终止经营列报。列报的终止经营损益应当包含整个报告期间，而不仅包含认定为终止经营后的报告期间。如果因出售对子公司的投资等原因导致企业丧失对子公司的控制权，且该子公司符合终止经营定义的，应当在合并利润表中列报相关终止经营损益。\n\n从财务报表可比性出发，对于当期列报的终止经营，企业应当在当期财务报表中将原来作为持续经营损益列报的信息重新作为可比会计期间的终止经营损益列报。这意味着对于可比会计期间的利润表，作为终止经营列报的不仅包括在可比会计期间即符合终止经营定义的处置组，还包括在当期首次符合终止经营定义的处置组。由于后者的存在，处置组在可比会计期间销售商品、提供服务的收入和相关成本、费用，以及相关资产按照《企业会计准则第8号一资产减值》的规定确认的资产减值损失等也应当作为终止经营损益列报。\n\n## 点拨\n\n终止经营损益列报的期间是整个报告期间（如2×25年10月20日认定为终止经营，整个报告期间是2×25年1月1日至2×25年12月31日）及可比会计期间（2×24年1月1日至2×24年12月31日）。\n\n企业还应当在附注中披露有关终止经营的相关信息。\n\n终止经营不再满足持有待售类别划分条件的，企业应当在当期财务报表中，将原来作为终止经营损益列报的信息重新作为可比会计期间的持续经营损益列报，并在附注中说明这一事实。\n\n【真题10·单选题】甲公司在中国从事电子产品研发与生产，其设立的全资子公司乙公司在南美洲从事电子产品的销售，乙公司每年销售费用和净利润占甲公司合并财务报表销售费用和净利润的比例均超过50%,2×23年10月10日甲公司经批准与非关联方签订股权转让合同，约定甲公司向该非关联方转让其所持乙公司90%股权，在2×24年7月10日前完成付款交割手续，2×24年7月8日甲公司收到乙公司股权处置款，完成股权变更，甲公司未来将不会在南美洲从事相关业务。不考虑其他因素，下列关于甲公司会计处理的表述中，正确的是（ ）。（2025年回忆版）\n\nA.在2×23年度合并资产负债表中列报为持有待售资产的金额为乙公司资产总额的90%B.在2×23年度合并利润表中将可比期间乙公司的净利润作为终止经营损益重新列报C.在2×24年度合并利润表中将处置乙公司产生的损益作为持续经营损益列报\n\nD.在2×24年度合并利润表的销售费用项目中不包括乙公司2×24年1月1日至7月8日期间的销售费用\n\n解析企业因拟出售对子公司的投资等原因导致其丧失对子公司的控制权，在合并财务报表中将子公司所有资产和负债划分为持有待售类别，选项A错误；从财务报表可比性出发，对于当期列报的终止经营，企业应当在当期财务报表中，将原来作为持续经营损益列报的信息重新作为可比会计期间的终止经营损益列报，选项B正确；2×24年度乙公司满足终止经营定义，处置乙公司产生的损益应作为终止经营损益列报，选项C错误；在2×24年度合并利润表的销售费用项目应包括乙公司2×24年1月1日至7月8日期间的销售费用，选项D错误。\n\n【真题11·多选题】甲公司是一家总部位于中国的跨国集团公司，其设立的全资子公司乙公司负责运营集团在东南亚的所有业务，乙公司在东南亚设有工厂，从事生产和销售，每年营业收入和净利润占甲公司合并财务报表营业收人和净利润的比例均超过30%，2×24年11月8日，甲公司经批准与非关联方签订股权转让合同，约定甲公司向该非关联方转让其所持乙公司100%股权，并在2×25年6月30日前完成付款及交割手续，2×25年5月28日，甲公司收到乙公司股权处置款，并完成股权变更登记手续，甲公司未来将不会在东南亚从事相关业务。不考虑其他因素，下列各项关于甲公司会计处理的表述中，正确的有（）。（2025年回忆版）\n\nA．在2×25年度合并利润表中将处置乙公司产生的损益作为持续经营损益列报B.在2×24年度合并利润表中将可比期间乙公司的净利润作为终止经营损益重新列报C.在2×25年度合并利润表的营业收人项目中不包括乙公司2×25年1月1日至5月28日期间的营业收入\n\nD.在2×24年度合并资产负债表中将乙公司的所有资产合并列报为持有待售资产\n\n解析甲公司拟出售全资子公司乙公司的全部股权，出售后丧失控制权，甲公司应在个别财务报表中将对乙公司投资整体划分为持有待售类别，在合并财务报表中将乙公司所有资产、负债划分为持有待售类别，选项D正确；由于乙公司负责运营集团在东南亚的所有业务，构成甲公司一个单独的主要经营地区，符合终止经营的定义，应当将其作为终止经营列报，列报的终止经营损益应当包含整个报告期间，出于可比性，应将列报的可比期间经营损益也作为终止经营损益列报，选项A错误，选项B正确；在2×25年度合并利润表的营业收入项目中应当包括乙公司2×25年1月1日至5月28日期间的营业收入，选项C错误。\n\n【真题12·多选题】甲公司主要从事焦煤和天然气两类业务，天然气业务由其全资子公司乙公司单独经营。2×24年12月31日，经董事会批准，甲公司与第三方签订股权转让协议约定，甲公司以13500万元的价格向该第三方转让其持有的全部乙公司股权，预计2×25年3月末前完成股权过户登记手续。乙公司2×24年12月31日的资产总额为26000万元、负债总额为12000万元，2×23年12月31日的资产总额为35000万元、负债总额为18000万元；乙公司2×24年度和2×23年度分别实现净利润800万元和1000万元。不考虑相关税费及其\n\n他因素，在甲公司编制2×24年度合并财务报表时，下列各项会计处理的表述中，正确的有  \n（ ）。（2024年回忆版）A．在合并利润表中列报2×23年度终止经营损益1000万元B.在合并资产负债表中2×23年12月31日无须列报持有待售资产C.在合并利润表中列报2×24年度终止经营损益300万元D.在合并资产负债表中列报2×24年12月31日持有待售资产14000万元\n\n（解析）在合并利润表中列报2×23年度终止经营损益即为2×23年度乙公司实现的净利润1000万元，选项A正确；2×24年12月31日甲公司持有的乙公司全部股权符合划分为持有待售资产条件，因此在合并资产负债表中2×23年12月31日无须列报持有待售资产，选项B正确；2×24年合并报表中转让股权应确认的终止经营损失=（26000-12000）-13500=500（万元），乙公司2×24年度实现净利润800万元应在合并报表中确认终止经营收益800万元，因此在合并利润表中列报2×24年度终止经营损益=800-500=300（万元），选项C正确；在合并资产负债表中列报2×24年12月31日持有待售资产金额为乙公司2×24年12月31日的资产总额为26000万元，选项D错误。\n\n【例题13·单选题】2×25年10月1日，甲公司与交易对手方签订股权出售协议，协议  \n约定甲公司出售其全资子公司乙公司80%的股权，当日满足持有待售类别的划分条件。2×26  \n年3月15日，双方办理了股权过户登记手续、董事会改选、支付股权转让款等事项。乙公司  \n的经营地区在华南，是甲公司的一个单独的主要经营地区。处置乙公司股权后，甲公司将退出  \n华南地区。甲公司2×25年度财务报告经批准于2×26年4月15日对外报出。甲公司在编制  \n2×25年度财务报表时，下列各项会计处理的表述中，正确的是（ ）。A．比较合并财务报表中，将乙公司2×24年度的经营损益列报为终止经营损益B.合并财务报表中，终止经营损益为乙公司2×25年10月至12月的经营损益C.个别财务报表中，将持有的乙公司长期股权投资的80%重分类为持有待售资产D.合并财务报表中，不再将乙公司纳入2×25年度合并范围\n\n解析乙公司是甲公司的一个单独的主要经营地区，能够单独区分，且划分为持有待售类别，符合终止经营的定义。从财务报表可比性出发，对于当期列报的终止经营，甲公司应当在当期财务报表中，将原来作为持续经营损益列报的信息重新作为可比会计期间的终止经营损益列报，选项A正确；合并财务报表中列报的终止经营损益应当包含整个报告期间，而不仅包含认定为终止经营后的报告期间，选项B错误；在甲公司个别财务报表中将对乙公司投资整体划分为持有待售类别，而不是仅将拟处置的投资划分为持有待售类别，选项C错误；无论对乙公司的投资是否划分为持有待售类别，甲公司始终应当按照《企业会计准则第33号一合并财务报表》的规定确定合并范围，编制合并财务报表，选项D错误。\n\n（解题攻略甲公司因出售对乙公司的投资等原因导致其丧失对乙公司的控制权，乙公司是一个单独的主要经营地区，能够单独区分，且划分为持有待售类别，符合终止经营的定义，相关损益应作为终止经营损益列报。\n\n【例题14·多选题】下列各项关于终止经营列报的表述中，错误的有（ ）。  \nA.终止经营的相关损益作为持续经营损益列报  \nB.终止经营的处置损益以及调整金额作为终止经营损益列报  \nC.拟结束使用而非出售的处置组满足终止经营定义中有关组成部分条件的，自停止使用日起作为终止经营列报  \nD.对于当期列报的终止经营，在当期财务报表中将处置日前原来作为持续经营损益列报的信息重新作为终止经营损益列报，但不调整可比会计期间利润表\n\n（解析）终止经营的相关损益应当作为终止经营损益列报，选项A错误；从财务报表可比性出发，对于当期列报的终止经营，企业应当在当期财务报表中，将原来作为持续经营损益列报的信息重新作为可比会计期间的终止经营损益列报，调整可比期间利润表，选项D错误。\n\n## 三、特殊事项的列报\n\n考点难度●○○易\n\n1.企业专为转售而取得的持有待售子公司的列报\n\n相对于不符合持有待售类别划分条件的子公司，其资产负债表列示和附注披露都得到适当简化。除非企业是投资性主体并将该子公司按照公允价值计量且其变动计人当期损益，否则仍然应当按照《企业会计准则第33号— 一合并财务报表》的规定，将该子公司纳人合并范围。\n\n（1）合并资产负债表\n\n在合并资产负债表中，企业专为转售而取得的持有待售子公司的全部资产和负债应当分别作为持有待售资产和持有待售负债项目列示。\n\n（2）合并利润表\n\n符合终止经营定义的专为转售而取得的持有待售子公司的净利润与其他终止经营净利润应当合并列示在“终止经营净利润”项目中。\n\n## 2.不再继续划分为持有待售类别的列报\n\n对于非流动资产或处置组，如果其不再继续划分为持有待售类别或非流动资产从持有待售的处置组中移除，在资产负债表中，企业应当将原来分类为持有待售类别的非流动资产或处置组重新作为固定资产、无形资产等列报，并调整其账面价值。在当期利润表中，企业应当将账面价值调整金额作为持续经营损益列报。\n\n持有待售的对联营企业或合营企业的权益性投资不再符合持有待售类别划分条件的，应当自划分为持有待售类别日起采用权益法进行追溯调整；持有待售的对子公司、共同经营的权益性投资不再符合持有待售类别划分条件的，应当自划分为持有待售类别日起追溯调整。上述情况下，划分为持有待售类别期间的财务报表应当作相应调整。\n\n【例题15·多选题】关于特殊事项的列报，下列会计处理中正确的有（ ）。\n\nA.在合并资产负债表中，企业专为转售而取得的持有待售子公司的全部资产和负债应当分别作为持有待售资产和持有待售负债项目列示\n\nB.符合终止经营定义的专为转售而取得的持有待售子公司的净利润列示在“终止经营净利润”项目\n\nC．对于划分为持有待售类别的固定资产，如果其不再继续划分为持有待售类别，在资产负债表中，企业应当将其作为固定资产列报，并调整其账面价值\n\nD.持有待售的对联营企业的权益性投资不再符合持有待售类别划分条件的，应当自停止划分为持有待售类别日起采用权益法核算，并采用未来适用法进行会计处理\n\n解析）持有待售的对联营企业的权益性投资不再符合持有待售类别划分条件的，应当自划分为持有待售类别日起采用权益法进行追溯调整，划分为持有待售类别期间的财务报表应当作相应调整，选项D错误。"}],"quizGroups":[{"type":"单项选择题","questions":[{"num":1,"text":"2×25年11月30日，甲公司与非关联方乙公司签订股权转让协议，约定向乙公司转让其全资子公司丙公司的75%股权，交割时间为2×26年3月16日。协议签订日，甲公司对丙公司长期股权投资的账面价值为4000万元，甲公司合并财务报表中丙公司的资产总额为13200万元，负债总额为6000万元。股权转让后，甲公司能够对丙公司施加重大影响。不考虑减值等其他因素，下列各项关于甲公司2×25年度财务报表相关项目列报金额的表述中，正确的是（ ）。","options":[{"letter":"A","text":"个别财务报表中持有待售资产的金额为3000万元"},{"letter":"B","text":"个别财务报表中长期股权投资的金额为4000万元"},{"letter":"C","text":"合并财务报表中持有待售资产的金额为7200万元"},{"letter":"D","text":"合并财务报表中持有待售负债的金额为6000万元"}],"answer":"D","explanation":"甲公司出售丙公司股权后，丧失对丙公司的控制权。在甲公司个别财务报表中将对丙公司投资整体划分为持有待售类别，即个别财务报表中持有待售资产的金额为4000万元，选项A和B错误。在甲公司合并财务报表中将丙公司所有资产和负债划分为持有待售类别，即合并财务报表中持有待售资产的金额为13200万元，持有待售负债的金额为6000万元，选项C错误，选项D正确。"},{"num":2,"text":"甲公司于2×24年5月支付800万元购人非关联方乙公司80%有表决权股份，控制了乙公司。2×24年末，甲公司持有的乙公司股权未出现减值迹象，没有计提减值准备。2×25年3月，由于公司战略发生变化，甲公司管理层作出决议，将在一年内出售乙公司股权。当月末，甲公司与A公司签订股权转让协议，甲公司将所持有的乙公司80%股权以760万元转让给A公司，股权转让手续将在1年内完成。甲公司于3月末将该股权转人持有待售类别，假设预计出售费用为3万元，则2×25年3月末甲公司个别资产负债表中“持有待售资产”项目列示金额是（ ）万元。","options":[{"letter":"A","text":"757"},{"letter":"B","text":"760"},{"letter":"C","text":"800"},{"letter":"D","text":"797"}],"answer":"A","explanation":"2×24年甲公司取得长期股权投资时，其入账价值为800万元，采用成本法核算，至2×25年转为持有待售类别前的账面价值仍为800万元。转换日，该股权公允价值减去出售费用后的净额=760-3=757（万元），根据“敦低”原则，应计提持有待售资产减值准备43万元（800-757），在资产负债表中“持有待售资产”项目列示的金额为757万元，选项A正确。"},{"num":3,"text":"关于持有待售固定资产，下列表述中错误的是（ ）。","options":[{"letter":"A","text":"企业将固定资产首次划分为持有待售类别前，应当按照相关会计准则规定计量固定资产的账面价值"},{"letter":"B","text":"企业在资产负债表日重新计量持有待售的固定资产时，其账面价值高于公允价值减去出售费用后的净额的，应当将账面价值减记至公允价值减去出售费用后的净额，减记的金额确认为资产减值损失，同时计提持有待售资产减值准备"},{"letter":"C","text":"后续资产负债表日持有待售的固定资产公允价值减去出售费用后的净额增加的，以前减记的金额不得转回"},{"letter":"D","text":"持有待售的固定资产不应计提折旧"}],"answer":"C","explanation":"选项C，后续资产负债表日持有待售的固定资产公允价值减去出售费用后的净额增加的，以前减记的金额应当予以恢复，并在划分为持有待售类别后确认的资产减值损失金额内转回，转回金额计人当期损益。划分为持有待售类别前确认的资产减值损失不得转回。"},{"num":4,"text":"甲公司持有联营企业（乙公司）40%的股权，采用权益法核算。2×25年10月5日，甲公司董事会通过决议拟出售乙公司30%的股权。2×25年11月5日，甲公司与丙公司签订的股权转让协议约定，甲公司应于2×26年2月1日前办理完成转让乙公司30%股权过户登记手续，拟出售的乙公司30%股权于2×25年11月5日符合持有待售类别的划分条件，出售后甲公司持有剩余10%股权，不能够再对乙公司施加重大影响。不考虑其他因素，下列各项关于甲公司2×25年度个别财务报表会计处理的表述中，正确的是（）。","options":[{"letter":"A","text":"将持有的乙公司30%的股权划分为持有待售类别，剩余10%股权按照金融工具相关准则进行分类和计量"},{"letter":"B","text":"将持有的乙公司40%的股权划分为持有待售类别并继续采用权益法进行会计处理"},{"letter":"C","text":"将持有的乙公司30%的股权划分为持有待售类别，剩余10%股权在30%股权出售前继续采用权益法进行会计处理"},{"letter":"D","text":"将持有的乙公司40%的股权划分为持有待售类别并按公允价值减去出售费用后的净额计量"}],"answer":"C","explanation":"将持有的乙公司30%的股权划分为持有待售类别，并停止采用权益法核算，剩余10% 股权在30%股权出售前继续采用权益法进行会计处理，选项C正确。"},{"num":5,"text":"2×25年6月末，甲公司董事会通过一项决议，拟将持有的一项闲置管理用设备对外出售。甲公司6月30日与独立第三方签订出售协议，拟将该设备以1510万元的价格出售给独立第三方，预计出售过程中将发生的出售费用为10万元。该设备为甲公司于2×23年6月购人，原价为2500万元，预计使用年限为10年，预计净残值为零，采用年限平均法计提折旧，至拟出售时已计提折旧500万元，未计提减值准备。至2×25年12月31日，该设备出售尚未完成，但甲公司预计将于2×26年第一季度完成。不考虑其他因素，下列各项关于甲公司因该设备对其财务报表影响的表述中，正确的是（）。","options":[{"letter":"A","text":"甲公司2×25年6月30日持有该设备不应计提减值准备"},{"letter":"B","text":"该设备在2×25年年末资产负债表中“持有待售资产”项目列报金额为1500万元"},{"letter":"C","text":"甲公司2×25年对该设备计提的折旧为250万元"},{"letter":"D","text":"该设备在2×25年年末资产负债表中“固定资产”项目列报金额为1250万元"}],"answer":"B","explanation":"该设备划分为持有待售资产时的原账面价值=2500-500=2000（万元），公允价值减去出售费用后的净额=1510-10=1500（万元），甲公司应计提的减值准备=2000-1500=500（万元），选项A错误；2×25年年末甲公司将该设备在“持有待售资产”项目列报，列报金额为.1500万元，选项B正确，选项D错误；划分为持有待售固定资产后，不再计提折旧，2×25年度该设备计提折旧的金额=2500/10×6/12=125（万元），选项C错误。"},{"num":6,"text":"关于持有待售类别和终止经营的列报，下列表述中错误的是（ ）。","options":[{"letter":"A","text":"划分为持有待售的处置组产生的损益应作为终止经营损益列报"},{"letter":"B","text":"对于当期列报的终止经营，企业应当在当期财务报表中，将原来作为持续经营损益列报的信息重新作为可比会计期间的终止经营损益列报"},{"letter":"C","text":"非流动资产或处置组在资产负债表日次日至财务报告批准报出日之间满足持有待售类别划分条件的，应当作为资产负债表日后非调整事项进行会计处理"},{"letter":"D","text":"终止经营的相关损益应当作为终止经营损益列报，列报的终止经营损益应当包含整个报告期间，而不仅包含认定为终止经营后的报告期间 7关于持有待售类别的计量，下列表述中错误的是（ ）。财务费用和所得税费用属于持有待分配给所有者的非流动资产或处置组发生的分配费用"},{"letter":"B","text":"对于暂时停止使用的非流动资产，企业不应当认为其拟结束使用，也不应当将其划分为持有待售类别"},{"letter":"C","text":"出售费用是企业发生的可以直接归属于出售资产或处置组的增量费用，但不包括财务费用和所得税费用"},{"letter":"D","text":"企业在处置持有待售的境外经营时，应当将与该境外经营相关的外币财务报表折算差额，自其他综合收益转人处置当期损益，部分处置境外经营的，应当按处置的比例计算处置部分的外币财务报表折算差额，转人处置当期损益"}],"answer":"A","explanation":"划分为持有待售类别且符合终止经营定义的处置组产生的损益应作为终止经营损益列报，选项A错误。"}]},{"type":"多项选择题","questions":[{"num":1,"text":"甲企业集团拟出售持有的部分长期股权投资，假设拟出售的股权符合持有待售类别的划分条件。下列会计处理表述中，正确的有（ ）。","options":[{"letter":"A","text":"甲企业集团拥有丁公司30%的股权，拟出售2/3股权，对于未划分为持有待售类别的剩余1/3权益性投资，应当在划分为持有待售的那部分权益性投资出售前继续采用权益法进行会计处理"},{"letter":"B","text":"甲企业集团拥有合营企业50%的股权，拟出售45%的股权，剩余的5%股权对被投资方不具有共同控制或重大影响，对剩余的5%股权在划分为持有待售部分权益性投资出售前应按以公允价值计量且其变动计人当期损益的金融资产核算"},{"letter":"C","text":"甲企业集团拥有乙公司80%的股权,拟出售3/4的股权,出售后将丧失对乙公司的控制权，但对其具有重大影响，在合并财务报表中将乙公司所有资产和负债划分为持有待售类别"},{"letter":"D","text":"甲企业集团拥有丙公司100%的股权，拟出售20% 的股权，出售后仍然拥有对丙公司的控制权，不能将丙公司整体划分为持有待售类别"}],"answer":"ACD","explanation":"【解析〗对于未划分为持有待售类别的剩余（5%部分）权益性投资，应当在划分为持有待售的部分权益性投资（45%部分）出售前继续采用权益法进行会计处理，选项B错误。"},{"num":2,"text":"对于拟结束使用而非出售的非流动资产或处置组，下列表述中正确的有（ ）。","options":[{"letter":"A","text":"对于拟结束使用而非出售的处置组，在停止使用前，不应当划分为持有待售类别，但应当作为终止经营列报"},{"letter":"B","text":"对于拟结束使用而非出售的处置组，在停止使用后，不应当划分为持有待售类别，如果该处置组满足终止经营中有关单独区分的组成部分的条件，应当作为终止经营列报"},{"letter":"C","text":"对于拟结束使用而非出售的非流动资产，在停止使用之前，不应当划分为持有待售类别，也不应当作为终止经营列报"},{"letter":"D","text":"对于拟结束使用而非出售的非流动资产，在停止使用后，不应当划分为持有待售类别，如果该非流动资产满足终止经营中有关单独区分的组成部分的条件，应当作为终止经营列报"}],"answer":"BC","explanation":"对于拟结束使用而非出售的处置组，在停止使用前，不应当划分为持有待售类别，也不应当作为终止经营列报，选项A错误；对于拟结束使用而非出售的处置组，在停止使用后，不应当划分为持有待售类别，如果该处置组满足终止经营中有关单独区分的组成部分的条件，应当作为终止经营列报，选项B正确；对于拟结束使用而非出售的非流动资产，无论在停止使用之前或之后，均不应当划分为持有待售类别，也不应当作为终止经营列报，选项C正确，选项D错误。"},{"num":3,"text":"关于持有待售的处置组的后续计量，下列会计处理表述中正确的有（ ）。","options":[{"letter":"A","text":"企业在资产负债表日重新计量持有待售的处置组时，应当首先按照相关会计准则规定计量处置组中的流动资产、适用其他准则计量规定的非流动资产和负债的账面价值"},{"letter":"B","text":"处置组中持有待售的非流动资产不应计提折旧或摊销"},{"letter":"C","text":"对于持有待售的处置组确认的资产减值损失金额，应当先抵减商誉的账面价值"},{"letter":"D","text":"对于持有待售的处置组确认的资产减值损失后续转回金额，应当根据处置组中的各项资产（包括商誉）账面价值所占比重，按比例增加其账面价值"}],"answer":"ABC","explanation":"对于持有待售的处置组确认的资产减值损失后续转回金额，应当根据处置组中除商誉外适用《企业会计准则第42号— 一持有待售的非流动资产、处置组和终止经营》规定的各项非流动资产账面价值所占比重，按比例增加其账面价值，选项D错误。"},{"num":4,"text":"甲公司拥有一座仓库，原价为480万元，年折旧额为48万元，至2×24年12月31日已计提折旧240万元。2×25年1月31日，甲公司与乙公司签署不动产转让协议，拟在6个月内将该仓库转让，假定该不动产满足划分为持有待售类别的其他条件，且不动产价值未发生减值。甲公司下列会计处理的表述中，正确的有（）。","options":[{"letter":"A","text":"2×25年1月31日，甲公司应当将仓库划分为持有待售类别"},{"letter":"B","text":"甲公司2×25年该仓库应计提折旧48万元"},{"letter":"C","text":"该仓库在划分为持有待售类别前的账面价值为236万元"},{"letter":"D","text":"该仓库划分为持有待售类别后不再计提折旧"}],"answer":"ACD","explanation":"2×25年1月31日，仓库符合划分为持有待售类别的条件，应当将其划分为持有待售类别，选项A正确；2×25年1月份应计提折旧=48÷12=4（万元），划分为持有待售资产后不再计提折旧，选项B错误，选项D正确；2×25年1月31日，该仓库在划分为持有待售类别前的账面价值=480-240-4=236（万元），选项C正确。"},{"num":5,"text":"甲企业集团决定出售其专门从事酒店管理的下属子公司乙公司，酒店管理构成甲企业集团的一项主要业务。乙公司管理一个酒店集团和一个连锁健身中心。为获取最大收益，甲企业集团决定允许将酒店集团和连锁健身中心出售给不同买家，但酒店和健身中心的转让是相互关联的，即两者或者均出售，或者均不出售。甲企业集团于2×25年12月6日与丙公司就转让连锁健身中心正式签订了协议，假设此时连锁健身中心符合了持有待售类别的划分条件，但酒店集团尚不符合持有待售类别的划分条件。下列项目中正确的有（ ）。","options":[{"letter":"A","text":"连锁健身中心与酒店集团均属于终止经营"},{"letter":"B","text":"连锁健身中心属于终止经营"},{"letter":"C","text":"酒店集团属于终止经营"},{"letter":"D","text":"酒店集团不属于终止经营"}],"answer":"BD","explanation":"连锁健身中心是拟对一项独立的主要业务进行处置的一项相关联计划的一部分，属于终止经营，选项B正确；酒店集团尚未处置，也未划分为持有待售类别，不属于终止经营，选项A和C错误，选项D正确。"},{"num":6,"text":"下列项目中，影响利润表终止经营损益的有（ ）。","options":[{"letter":"A","text":"甲公司于2×25年12月6日与A企业签订了一台设备转让协议，预计将于6个月内完成转让"},{"letter":"B","text":"乙公司决定停止药品批发的主要业务，至2×25年12月10日，已处置了所有存货并辞退了所有员工，但仍有一些债权等待收回"},{"letter":"C","text":"丙公司2×25年12月17日将从事工程承包业务的W分部（主要经营地区）出售"},{"letter":"D","text":"丁公司2×25年12月20日购人B公司100%股份，并准备在8个月后转让，且已签订转让协议满足划分为持有待售类别的条件"}],"answer":"BCD","explanation":"选项A，符合持有待售条件但不符合终止经营；选项B，主要业务已终止，构成终止经营；选项C，属于已处置的单独的主要经营地区，构成终止经营；选项D，属于专为转售而取得的子公司，构成终止经营。"}]},{"type":"计算分析题","questions":[]}]},{"chTitle":"第十六章 所有者权益","header":"## 第十六章 所有者权益\n\n考情速览\n\n<table><tr><td rowspan=\"2\">复习难度 ★★</td><td>常考题型</td><td>近5年考试平均分值</td></tr><tr><td>客观题</td><td>2分左右</td></tr><tr><td>学习指南</td><td>本章考题涉及客观题，属于不太重要章节。</td><td></td></tr></table>\n\n## 教材主要变化\n\n（1）修改“实收资本概述”相关表述；\n\n（2）修改“发行方发行复合金融工具发生的交易费用处理”相关表述。\n\n## 考点框架\n\n<table><tr><td rowspan=1 colspan=3>所有者权益</td></tr><tr><td rowspan=2 colspan=1>实收资本</td><td rowspan=1 colspan=1>实收资本概述</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=1 colspan=1>实收资本增减变动的会计处理</td><td rowspan=1 colspan=1>●0易</td></tr><tr><td rowspan=3 colspan=1>其他权益工具</td><td rowspan=1 colspan=1>其他权益工具会计处理的基本原则</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=1 colspan=1>科目设置</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=1 colspan=1>主要账务处理</td><td rowspan=1 colspan=1>中</td></tr><tr><td rowspan=3 colspan=1>资本公积、其他综合收益及留存收益</td><td rowspan=1 colspan=1>资本公积确认与计量</td><td rowspan=1 colspan=1>●0o易</td></tr><tr><td rowspan=1 colspan=1>其他综合收益的确认与计量及会计处理</td><td rowspan=1 colspan=1>●中</td></tr><tr><td rowspan=1 colspan=1>留存收益</td><td rowspan=1 colspan=1>●00易</td></tr></table>\n\n## 考点剖析\n\n本章对所有者权益进行了集中讲解，由于之前章节中对所有者权益有所涉及，大家会对本章内容“倍感亲切”，学习本章内容时可以与其他章节内容关联学习，强化理解记忆。这里提示大家，学习路上忌讳不求甚解，应当穷源竟委，了解原理，才能学透学懂。","sections":[{"title":"第一节实收资本","content":"## 一、实收资本概述\n\n考点难度●○○ 易\n\n股份有限公司，应设置“股本”科目，有限责任公司，应设置“实收资本”科目。\n\n初建有限责任公司时，各投资者按照合同、协议或公司章程投人企业的资本，应按投人资本在注册资本中所占份额记入“实收资本”科目。\n\n股份有限公司通过发行股票的方式来筹集资本，股份有限公司的全部股份，根据公司章程的规定择一采用面额股或者无面额股。面额股股票的发行价格可以按票面金额，也可以超过票面金额，但不得低于票面金额。在采用溢价发行股票的情况下，企业应将相当于股票面值的部分记人“股本”科目，其余部分在扣除发行手续费、佣金等发行费用后记人“资本公积一股本溢价”科目。\n\n公司可以根据公司章程的规定将已发行的面额股全部转换为无面额股或者将无面额股全部转换为面额股。采用无面额股的，应当将发行股份所得股款的1/2以上计入注册资本。\n\n## 二、实收资本增减变动的会计处理\n\n考点难度●〇○ 易\n\n## （一）实收资本增加的会计处理\n\n<table><tr><td colspan=\"2\" rowspan=\"1\">交易或事项</td><td colspan=\"1\" rowspan=\"1\">会计处理</td></tr><tr><td colspan=\"1\" rowspan=\"1\">企业增加资本的一般途径</td><td colspan=\"1\" rowspan=\"1\">将资本公积转为实收资本或股本</td><td colspan=\"1\" rowspan=\"1\">借：资本公积一资本溢价（或股本溢价）贷：实收资本（或股本）</td></tr><tr><td colspan=\"1\" rowspan=\"2\">企业增加资本的一般途径</td><td colspan=\"1\" rowspan=\"1\">将盈余公积转为实收资本或股本</td><td colspan=\"1\" rowspan=\"1\">借：盈余公积贷：实收资本（或股本）</td></tr><tr><td colspan=\"1\" rowspan=\"1\">所有者投入</td><td colspan=\"1\" rowspan=\"1\">借：银行存款等贷：实收资本（或股本）资本公积一资本溢价（或股本溢价）</td></tr><tr><td colspan=\"2\" rowspan=\"1\">股份有限公司发放股票股利</td><td colspan=\"1\" rowspan=\"1\">借：利润分配一转作股本的股利贷：股本点拨  股份有限公司发放股票股利，所有者权益总额不变</td></tr><tr><td colspan=\"2\" rowspan=\"1\">可转换公司债券持有人行使转换权利</td><td colspan=\"1\" rowspan=\"1\">借：应付债券其他权益工具贷：股本资本公积一股本溢价</td></tr><tr><td colspan=\"2\" rowspan=\"1\">企业将重组债务转为资本</td><td colspan=\"1\" rowspan=\"1\">借：应付账款贷：实收资本（或股本）资本公积一资本溢价（或股本溢价）投资收益</td></tr><tr><td colspan=\"2\" rowspan=\"1\">以权益结算的股份支付行权</td><td colspan=\"1\" rowspan=\"1\">借：资本公积一其他资本公积（等待期内累计确认的金额）银行存款（企业收到的价款）贷：实收资本（或股本）资本公积一资本溢价（或股本溢价）</td></tr></table>\n\n## （二）实收资本减少的会计处理\n\n<table><tr><td rowspan=1 colspan=3>交易或事项</td><td rowspan=1 colspan=1>会计处理</td></tr><tr><td rowspan=1 colspan=3>一般企业减资</td><td rowspan=1 colspan=1>借：实收资本贷：银行存款等</td></tr><tr><td rowspan=4 colspan=1>股份有限公司采用回购本公司股票方式减资</td><td rowspan=1 colspan=2>回购本公司股票时</td><td rowspan=1 colspan=1>借：库存股（实际支付的金额）贷：银行存款</td></tr><tr><td rowspan=3 colspan=1>注销库存股时</td><td rowspan=1 colspan=1>回购价格高于回购股票的面值总额时</td><td rowspan=1 colspan=1>借：股本（注销股票的面值总额）资本公积一股本溢价（差额先冲减股本溢价）盈余公积（股本溢价不足冲减的，冲减盈余公积）利润分配一未分配利润（股本溢价和盈余公积仍不足冲减的部分）贷：库存股（注销库存股的账面余额）</td></tr><tr><td rowspan=1 colspan=1>回购价格低于回购股票的面值总额时</td><td rowspan=1 colspan=1>借：股本（注销股票的面值总额）贷：库存股（注销库存股的账面余额）资本公积一股本溢价（差额）</td></tr><tr><td rowspan=1 colspan=2>点拨  “库存股”属于所有者权益，注销库存股时，所有者权益总额不变</td></tr></table>"},{"title":"第二节  其他权益工具","content":"企业发行的除普通股（作为实收资本或股本）以外，按照金融负债和权益工具区分原则分类为权益工具的其他权益工具，按照“其他权益工具”核算原则进行会计处理。\n\n## 一、其他权益工具会计处理的基本原则\n\n考点难度●○○易\n\n## （一）股利或利息\n\n## 1.金融工具分类为权益工具\n\n金融工具中分类为权益工具的（包括名称中含“债”的），发行企业进行利息支出或股利分配均属于企业的利润分配，其回购、注销等均按照权益的变动处理。\n\n## 2.金融工具分类为金融负债\n\n金融工具中分类为金融负债的（包括名称中含“股”的），发行企业进行利息支出或股利分配需依据借款费用的原则处理，其回购、赎回等发生的利得或损失均计人当期损益。\n\n## （二）交易费用\n\n发行企业发行金融工具，发生的交易费用（包括手续费、佣金等），对于分类为债务工具并以摊余成本计量的，应当计人其初始计量金额；发行其他权益工具发生的承销费、发行登记费等交易费用，应借记“资本公积”科目，贷记“银行存款”“存放中央银行款项”等科目。\n\n【真题1·单选题】2×24年3月1日，甲公司发行附带“股利推动机制”的无到期期限  \n的永续债8000万元，并发生承销费100万元。该永续债按5%年利率计息，无固定支付利息  \n期限，未支付的利息进行累积；若甲公司决定派发普通股股利，则应优先支付尚未支付的永续  \n债利息；在甲公司决定清算时，甲公司需按永续债本金与尚未支付的累积利息之和赎回永续债。  \n当日，甲公司资本公积的账面余额为300万元。不考虑税费及其他因素，下列各项关于甲公司  \n承销费会计处理的表述中正确的是（ ）。（2025年回忆版）A.确认财务费用B.减少资本公积C.计入应付债券D.减少其他权益工具\n\n（解析）甲公司发行的永续债无到期期限，仅约定未来赎回时间为发行方清算日，且甲公司可根据相应的议事机制自主决定是否派发普通股股利，因此附带的“股利推动机制”\n\n本身不会导致该永续债被分类为金融负债，说明甲公司没有交付现金和其他金融资产的合同义务，应将该永续债分类为权益工具，因发行永续债而发生的承销费应冲减资本公积，选项B正确。\n\n## 二、科目设置\n\n考点难度●○○ 易\n\n1．应付债券：核算发行方归类为金融负债并以摊余成本计量的金融工具。\n\n2.衍生工具：核算需要拆分且形成衍生金融负债或衍生金融资产的金融工具。\n\n3．交易性金融负债：核算发行方归类为金融负债并以公允价值计量且其变动计人当期损益的金融工具，以及发行的嵌人了非紧密相关的衍生金融资产或衍生金融负债的金融工具，且发行方将其整体指定为以公允价值计量且其变动计入当期损益的金融工具。\n\n4.其他权益工具：核算企业发行的归类为权益工具的各种金融工具（普通股除外）。\n\n## 三、主要账务处理\n\n考点难度●●〇中\n\n## （一）发行方的账务处理\n\n<table><tr><td rowspan=1 colspan=1>情形</td><td rowspan=1 colspan=1>会计处理</td></tr><tr><td rowspan=1 colspan=1>1.发行方发行的金融工具归类为债务工具并以摊余成本计量</td><td rowspan=1 colspan=1>与发行一般公司债券的核算相同</td></tr><tr><td rowspan=1 colspan=1>2.发行方发行的金融工具归类为权益工具</td><td rowspan=1 colspan=1>借：银行存款、存放中央银行款项等贷：其他权益工具一优先股、永续债等在存续期间分派股利：借：利润分配一应付优先股股利、应付永续债利息等贷：应付股利一优先股股利、永续债利息等</td></tr><tr><td rowspan=1 colspan=1>3.发行方发行的金融工具为复合金融工具</td><td rowspan=1 colspan=1>与发行可转换公司债券的核算相同提示  对于分摊至负债成分的交易费用，应当计入该负债成分的初始计量金额（若该负债成分按摊余成本进行后续计量）或计入当期损益（若该负债成分按公允价值进行后续计量且其变动计入当期损益）；对于分摊至权益成分的交易费用，应当从权益（资本公积）中扣减，如资本公积不够冲减的，依次冲减盈余公积和未分配利润</td></tr><tr><td rowspan=1 colspan=1>4.发行的金融工具本身是衍生金融负债或衍生金融资产或者内嵌了衍生金融负债或衍生金融资产</td><td rowspan=1 colspan=1>按照金融工具确认和计量准则中有关衍生工具的规定进行处理</td></tr></table>\n\n例（真）题-答案」1.B\n\n<table><tr><td rowspan=1 colspan=2>情形</td><td rowspan=1 colspan=1>会计处理</td></tr><tr><td rowspan=2 colspan=1>5．权益工具与金融负债重分类</td><td rowspan=1 colspan=1>（1）权益工具重分类为金融负债</td><td rowspan=1 colspan=1>借：其他权益工具一优先股、永续债等（账面价值）贷：应付债券一优先股、永续债等（面值）一优先股、永续债等（利息调整）（重分类日应付债券公允价值与面值的差额）（或借方）资本公积一资本溢价／股本溢价（重分类日应付债券公允价值与权益工具账面价值的差额）（或借方）点拨  如果资本公积不够冲减的，依次冲减盈余公积和未分配利润</td></tr><tr><td rowspan=1 colspan=1>（2）金融负债重分类为权益工具</td><td rowspan=1 colspan=1>借：应付债券一优先股、永续债等（面值）一优先股、永续债等（利息调整）（利息调整余额，或贷方）贷：其他权益工具一优先股、永续债等（应付债券的账面价值）点拨  所有者权益的确认和计量取决于资产和负债的确认和计量，权益工具按重分类时负债的账面价值计量</td></tr><tr><td rowspan=3 colspan=1>6.发行方按合同条款约定赎回所发行的除普通股以外的分类为权益工具的金融工具</td><td rowspan=1 colspan=1>（1）回购</td><td rowspan=1 colspan=1>借：库存股一其他权益工具贷：银行存款</td></tr><tr><td rowspan=1 colspan=1>（2）注销（账面价值）</td><td rowspan=1 colspan=1>借：其他权益工具贷：库存股一其他权益工具资本公积一资本溢价／股本溢价（或借方，不够冲减的，依次冲减盈余公积和未分配利润）</td></tr><tr><td rowspan=1 colspan=2>提示  发行方按合同条款约定赎回所发行的分类为金融负债的金融工具，按该工具赎回日的账面价值，借记“应付债券”等科目，按赎回价格，贷记“银行存款”等科目，按其差额，借记或贷记“财务费用”科目</td></tr><tr><td rowspan=1 colspan=2>7.发行方按合同条款约定将发行的除普通股以外的金融工具转换为普通股</td><td rowspan=1 colspan=1>借：应付债券（账面价值）其他权益工具（账面价值）贷：实收资本/股本（面值）资本公积一资本溢价／股本溢价银行存款（不足1股，以现金支付）</td></tr></table>\n\n【例题2·单选题】下列各项交易或事项产生的差额中，应当直接计人所有者权益的是（ ）。A．企业购人可转换公司债券实际支付的价款与可转换公司债券面值之间的差额B.企业将债务转为权益工具时债务账面价值与权益工具确认金额之间的差额C.企业发行可转换公司债券的发行价格与负债公允价值之间的差额D.企业发行公司债券实际收到的价款与债券面值之间的差额\n\n（解析）企业取得可转换公司债券，通常应作为交易性金融资产核算，按实际支付对价计入交易性金融资产成本，交易费用计入投资收益，无须考虑实际支付价款与债券面值之间的差额，选项A错误；企业将债务转为权益工具时债务账面价值与权益工具确认金额之间的差额计入投资收益，选项B错误；企业发行可转换公司债券的发行价格与负债公允价值之间的差额记入“其他权益工具”科目，选项C正确；企业发行公司债券实际收到价款与债券面值之间的差额记入“应付债券一利息调整”科目，选项D错误。\n\n## （二）投资方的账务处理\n\n如果投资企业因持有发行方发行的金融工具而对发行方施加控制、共同控制或重大影响的，按照《企业会计准则第2号—长期股权投资》和《企业会计准则第20号—企业合并》的规定进行会计处理；投资企业需编制合并财务报表的，按照《企业会计准则第33号——合并财务报表》的规定进行处理。"},{"title":"第三节资本公积、其他综合收益及留存收益","content":"## 一、资本公积确认与计量 5年热点|4次\n\n考点难度●○易\n\n资本公积包括资本（或股本）溢价以及其他资本公积。\n\n资本（或股本）溢价是指企业收到的投资者超过其在企业注册资本（或股本）中所占份额的投资。形成资本（或股本）溢价的原因有溢价发行股票、投资者超额缴人资本等。\n\n## （一）资本溢价或股本溢价的会计处理\n\n1.资本溢价：投资者投入的资本中按其投资比例计算的出资额部分，应记人“实收资本”科目，大于出资额部分记人“资本公积一资本溢价”科目。\n\n2．股本溢价：股份有限公司按股票面值发行股票时，公司取得的发行收人，应全部记人科目，超过股票面值的溢价部分在扣除发行手续费、佣金等发行费用后，记人“资本公积一股本溢价”科目。\n\n点拨 股票发行费用冲减“资本公积一股本溢价”等科目。\n\n## 提示\n\n对接受的捐赠，按照企业会计准则规定符合确认条件的，通常应当确认为当期损益。如果企业接受控股股东（或控股股东的子公司）或非控股股东（或非控股股东的子公司）直接或间接捐赠，经济实质表明属于控股股东或非控股股东对企业的资本性投入，应当直接计入所有者权益（资本公积）。\n\n【例题3·单选题】2×25年5月，甲公司以固定资产和无形资产作为对价，自独立第三  \n方购买了丙公司80%股权。由于作为支付对价的固定资产和无形资产发生增值，甲公司产生  \n大额应交企业所得税的义务。考虑到甲公司的母公司（乙公司）承诺为甲公司承担税费，甲公  \n司没有计提因上述企业合并产生的相关税费。2×25年12月，乙公司按照事先承诺为甲公司  \n支付了因企业合并产生的相关税费。不考虑其他因素，对于上述乙公司为甲公司承担相关税费  \n的事项，甲公司应当进行的会计处理是（ ）。A.无须进行会计处理B.确认费用，同时确认收人C.确认费用，同时确认所有者权益D.不作账务处理，但在财务报表附注中披露\n\n解析甲公司的母公司（乙公司）按其承诺替甲公司支付相关税费，相当于增加对甲公司的净投资，所以甲公司应确认费用的同时相应的确认所有者权益。\n\n## （二）其他资本公积的会计处理\n\n<table><tr><td rowspan=1 colspan=2>情形</td><td rowspan=1 colspan=1>会计处理</td></tr><tr><td rowspan=2 colspan=1>以权益结算的股份支付</td><td rowspan=1 colspan=1>在等待期内的每个资产负债表日，应按确定的金额</td><td rowspan=1 colspan=1>借：管理费用等贷：资本公积一其他资本公积</td></tr><tr><td rowspan=1 colspan=1>行权日</td><td rowspan=1 colspan=1>借：银行存款（按行权价收取的金额）资本公积一其他资本公积（等待期内累计确认的金额）贷：实收资本（或股本）资本公积一资本溢价（或股本溢价）</td></tr><tr><td rowspan=2 colspan=1>采用权益法核算的长期股权投资</td><td rowspan=1 colspan=1>被投资单位除净损益、其他综合收益和利润分配以外的所有者权益的其他变动，投资方按持股比例计算应享有的份额</td><td rowspan=1 colspan=1>借：长期股权投资一其他权益变动贷：资本公积一其他资本公积（或相反分录）</td></tr><tr><td rowspan=1 colspan=1>处置采用权益法核算的长期股权投资时</td><td rowspan=1 colspan=1>借：资本公积一其他资本公积贷：投资收益（或相反分录）</td></tr></table>\n\n点拨 “资本公积一其他资本公积”核算内容：\n\n（1）以权益结算的股份支付；\n\n（2）权益法核算的长期股权投资，被投资单位其他权益变动。\n\n（三）资本公积（资本溢价或股本溢价）转增资本的会计处理\n\n借：资本公积一资本溢价（或股本溢价）\n\n贷：实收资本（或股本）\n\n例（真）题-答案」 3.C\n\n【真题4·多选题】下列各项有关企业资本公积会计处理的表述中，正确的有（ ）。（2023年）A.委托证券公司代理发行股票而支付的手续费、佣金应从资本公积中扣除B.收到投资者超出其所占注册资本份额的投资应计人资本公积C.新加人投资者出资价格高于原有投资者的出资价格，则说明新加人投资者出资价格不公允，超出部分不应计人资本公积D.经股东会决议用资本公积转增股本的，应从资本公积（其他资本公积）转人股本\n\n解析 新加入投资者出资价格高于原有投资者的出资价格，则说明超出部分为资本溢价，应计入资本公积，选项C不正确；经股东会决议用资本公积转增股本的，应从资本公积（股本溢价）转入股本，选项D不正确。\n\n【例题5·多选题】甲公司2×25年发生下列交易或事项：（1）以账面价值为18200万  \n元的土地使用权作为对价，取得同一集团内乙公司100%股权，合并日乙公司净资产在最终  \n控制方合并报表中的账面价值为12000万元；（2）为解决现金困难，控股股东代甲公司缴纳  \n税款4000万元；（3）为补助甲公司当期研发投入，取得与收益相关的政府补助6000万元；  \n（4）控股股东将自身持有的甲公司2%股权赠予甲公司10名管理人员并立即行权。不考虑其  \n他因素，与甲公司有关的交易或事项中，会引起其2×25年所有者权益中资本性项目发生变动  \n的有（ ）。A.控股股东代为缴纳税款 B.取得与收益相关的政府补助C.控股股东对管理人员的股份赠予 D.同一控制下企业合并取得乙公司股权\n\n解析选项B，取得与收益相关的政府补助，应当计入其他收益等，不影响所有者权益中资本性项目的金额。\n\n二、其他综合收益的确认与计量及会计处理5年热点丨3次 考点难度 中\n\n其他综合收益，是指企业根据其他会计准则规定未在当期损益中确认的各项利得和损失。其他综合收益分为以下两类：\n\n（一）以后会计期间不能重分类进损益的其他综合收益项目\n\n1.重新计量设定受益计划净负债或净资产导致的变动。\n\n2.以公允价值计量且其变动计人其他综合收益的金融资产（权益工具投资）公允价值变动及外汇利得或损失。\n\n3.指定为以公允价值计量且其变动计人当期损益的金融负债因企业自身信用风险变动引起的公允价值变动。\n\n4.按照权益法核算的长期股权投资因被投资单位不能重分类进损益的其他综合收益变动导致的权益变动，投资企业按持股比例计算确认的该部分其他综合收益。\n\n（二）以后会计期间满足规定条件时将重分类进损益的其他综合收益项目\n<table><tr><td rowspan=1 colspan=3>1.以公允价值计量且其变动计入其他综合收益的金融资产（债务工具投资）产生的其他综合收益</td></tr><tr><td rowspan=1 colspan=3>2.金融资产重分类时，按金融工具准则规定原计人其他综合收益可转损益的部分</td></tr><tr><td rowspan=2 colspan=1>3.采用权益法核算的长期股权投资</td><td rowspan=1 colspan=1>（1）被投资单位其他综合收益（可转损益部分）变动，投资方按持股比例计算应享有的份额</td><td rowspan=1 colspan=1>借：长期股权投资一其他综合收益贷：其他综合收益（或相反分录）</td></tr><tr><td rowspan=1 colspan=1>（2）处置采用权益法核算的长期股权投资时</td><td rowspan=1 colspan=1>借：其他综合收益（可转损益部分）贷：投资收益（或相反分录）</td></tr><tr><td rowspan=3 colspan=1>4.存货或自用房地产转换为采用公允价值模式计量的投资性房地产</td><td rowspan=1 colspan=1>（1）企业将作为存货的房地产转为采用公允价值模式计量的投资性房地产，转换日其公允价值大于账面价值</td><td rowspan=1 colspan=1>借：投资性房地产一成本（转换日的公允价值）存货跌价准备（如涉及）贷：开发产品等其他综合收益（差额）</td></tr><tr><td rowspan=1 colspan=1>（2）企业将自用房地产（如固定资产）转为采用公允价值模式计量的投资性房地产，转换日其公允价值大于账面价值</td><td rowspan=1 colspan=1>借：投资性房地产一成本（转换日的公允价值）累计折旧固定资产减值准备贷：固定资产其他综合收益（差额）</td></tr><tr><td rowspan=1 colspan=1>（3）处置该项投资性房地产时，因转换计人其他综合收益的金额应转人当期其他业务成本</td><td rowspan=1 colspan=1>借：其他综合收益贷：其他业务成本</td></tr><tr><td rowspan=1 colspan=3>5.现金流量套期工具产生的利得或损失中属于有效套期的部分，直接确认为其他综合收益点拨  无效套期部分计入当期损益</td></tr><tr><td rowspan=1 colspan=3>6.外币财务报表折算差额</td></tr></table>\n\n【真题6·单选题】下列各项企业发生的交易或事项中，应计人“其他综合收益”的是（ ）。（2025年回忆版）A．现金流量套期中套期工具产生的利得或损失属于有效套期的部分B.持有的有限寿命的股权投资基金份额产生的公允价值变动C.对联营企业的投资因被动稀释导致持股比例下降但仍具有重大影响情况下，计算的相关股权稀释影响金额D.设定受益计划净负债产生的利息净额解析 选项B和D计入当期损益；选项C计入资本公积一其他资本公积。\n\n【真题7·多选题】下列各项企业发生的其他综合收益中，以后期间可以重分类进损益的有（）。（2022年）A．境外子公司的外币报表折算差额B.现金流量套期工具产生的利得或损失中的有效套期部分C.按持股比例计算应享有联营企业因重新计量设定受益计划产生的其他综合收益D.以公允价值计量且其变动计入其他综合收益的债务工具投资在持有期间内发生的公允价值变动\n\n解析按持股比例计算应享有联营企业因重新计量设定受益计划产生的其他综合收益未来期间不能重分类进损益，选项C不正确。\n\n【真题8·单选题】下列各项所有者权益相关项目中，以后期间能够转入当期净利润的是( ）。（2021年）A.股本溢价B.现金流量套期工具产生的利得或损失中属于有效套期的部分C.非交易性权益工具投资公允价值变动额D.重新计量设定受益计划变动额\n\n解析选项A，计入资本公积一股本溢价，以后期间不转入净利润；选项B，计入其他综合收益，以后期间该部分现金流量套期储备金额转出时，计入当期损益或相关资产或负债的初始确认金额，属于能够转入当期净利润的情形；选项C，计入其他综合收益，以后期间该金融资产终止确认时结转计入留存收益，不转入净利润；选项D，计入其他综合收益，以后期间设定受益计划终止时，在权益范围内结转，不转入净利润。\n\n## 三、留存收益\n\n考点难度●○○易\n\n点拨\n\n留存收益包括盈余公积和未分配利润。提取盈余公积和盈余公积补亏均不影响留存收益总额。\n\n（一）盈余公积\n\n1.相关规定\n\n盈余公积是指企业按照规定从税后利润中提取的各种积累资金。公司制企业的盈余公积包括法定盈余公积和任意盈余公积。法定盈余公积是指企业按照规定的比例从税后利润中提取的盈余公积。任意盈余公积是指企业按照股东会决议从税后利润中提取的盈余公积。\n\n企业提取的盈余公积可用于弥补亏损、扩大生产经营、转增资本或派送新股等。\n\n## 2.盈余公积的确认和计量\n\n<table><tr><td rowspan=1 colspan=2>项目</td><td rowspan=1 colspan=1>会计处理</td></tr><tr><td rowspan=1 colspan=2>提取盈余公积</td><td rowspan=1 colspan=1>借：利润分配一提取法定盈余公积一提取任意盈余公积贷：盈余公积一法定盈余公积一任意盈余公积</td></tr><tr><td rowspan=3 colspan=1>盈余公积的用途</td><td rowspan=1 colspan=1>①弥补亏损</td><td rowspan=1 colspan=1>借：盈余公积贷：利润分配一盈余公积补亏</td></tr><tr><td rowspan=1 colspan=1>②转增资本</td><td rowspan=1 colspan=1>借：盈余公积贷：实收资本（或股本）</td></tr><tr><td rowspan=1 colspan=1>③用盈余公积派送新股</td><td rowspan=1 colspan=1>借：盈余公积贷：股本</td></tr></table>\n\n（二）未分配利润\n\n1.分配股利或利润的会计处理\n\n（1）经股东会或类似机构决议，宣告分配现金股利或利润：\n\n借：利润分配一应付现金股利或利润\n\n贷：应付股利\n\n（2）经股东会或类似机构决议，实际分配股票股利：\n\n借：利润分配一转作股本的股利\n\n贷：股本\n\n## 点拨 宣告分配股票股利时，不作账务处理。\n\n【例题9·单选题】根据我国公司法的规定，上市公司在弥补亏损和提取法定公积金后所  \n余税后利润，按照股份比例向股东分配利润。上市公司因分配现金利润而确认应付股利的时点  \n是（）。A.实际分配利润时 B.实现利润当年年末C.董事会通过利润分配预案时 D.股东会批准利润分配方案时\n\n应确认为应付股利，选项D正确。\n\n【例题10·多选题】下列各项交易或事项中，将导致企业所有者权益总额变动的有（ ）。A．账面价值与公允价值不同的债权投资重分类为其他债权投资  \nB.其他债权投资发生减值  \nC.其他权益工具投资的公允价值发生变动  \nD.权益法下收到被投资单位发放的现金股利\n\n例（真）题-答案」 9.D\n\n（解析）选项A，账面价值与公允价值不同的债权投资重分类为其他债权投资，差额计入其他综合收益，会影响所有者权益总额；\n\n选项B，其他债权投资发生减值，应借记“信用减值损失”科目，贷记“其他综合收益”科目，不影响所有者权益总额；\n\n选项C，其他权益工具投资公允价值变动计入其他综合收益，会影响所有者权益总额；\n\n选项D，权益法下收到被投资单位发放的现金股利，借记“银行存款”科目，贷记“应收股利”科目，不影响所有者权益总额。\n\n## 2.期末结转的会计处理\n\n利润分配一其他明细科目 利润分配一未分配利润 利润分配一其他明细科目\n\n\n\n## 3.弥补亏损的会计处理\n\n企业以当年实现的利润弥补以前年度亏损时，不需要进行专门的会计处理。"}],"quizGroups":[{"type":"单项选择题","questions":[{"num":1,"text":"下列交易或事项形成的资本公积中，在处置相关资产或行权时应转人当期损益的是（ ）。","options":[{"letter":"A","text":"股份有限公司同一控制下企业合并初始计量时产生的资本公积"},{"letter":"B","text":"以权益结算的股份支付等待期内确认的资本公积"},{"letter":"C","text":"接受投资者投入无形资产时产生的资本公积"},{"letter":"D","text":"长期股权投资采用权益法核算时形成的资本公积"}],"answer":"D","explanation":"选项A，属于资本公积一股本溢价，不能结转计人当期损益；选项B，行权时应转入股本、资本公积一股本溢价，不转入当期损益；选项C，属于资本公积一股本溢价（或资本溢价），不能结转计人当期损益。"},{"num":2,"text":"下列各项交易或事项中，应当直接计人所有者权益的是（ ）。","options":[{"letter":"A","text":"收到税务机关的增值税返还款"},{"letter":"B","text":"企业将债务转为权益工具时债务账面价值与权益工具确认金额之间的差额"},{"letter":"C","text":"指定为以公允价值计量且其变动计人当期损益的金融负债因企业自身信用风险变动引起的公允价值变动"},{"letter":"D","text":"交易性金融资产公允价值变动"}],"answer":"C","explanation":"选项A，应计入其他收益；选项B，计入投资收益；选项C，计入其他综合收益；\n选项D，计入公允价值变动损益。"},{"num":3,"text":"下列交易或事项中，不会引起资产和所有者权益同时发生增减变动的是（ ）。","options":[{"letter":"A","text":"发行可转换公司债券"},{"letter":"B","text":"交易性金融资产期末按照公允价值调整账面价值"},{"letter":"C","text":"为奖励本公司职工而以银行存款回购本公司发行在外的股份"},{"letter":"D","text":"资本公积转增股本"}],"answer":"D","explanation":"选项D，属于所有者权益项目内部结转，不会引起所有者权益与资产的增减变动；\n选项A、B和C，会引起企业的资产和所有者权益同时发生增减变动。"}]},{"type":"多项选择题","questions":[{"num":1,"text":"下列各项甲公司发生的交易或事项中，应调整甲公司资本公积的有（ ）。","options":[{"letter":"A","text":"以资本溢价转增资本"},{"letter":"B","text":"其他债权投资公允价值变动额"},{"letter":"C","text":"授予员工现金股票增值权以换取员工的服务"},{"letter":"D","text":"采用权益法核算的长期股权投资按持股比例享有的联营企业接受其控股股东捐赠的份额"}],"answer":"AD","explanation":"选项B，计入其他综合收益；选项C，应确认成本费用和应付职工薪酬。"},{"num":2,"text":"下列事项在进行账务处理时不通过“资本公积”科目核算的有（ ）。","options":[{"letter":"A","text":"采用权益法核算的长期股权投资，投资企业按持股比例确认的被投资单位其他综合收益变动应享有的份额"},{"letter":"B","text":"因联营企业增资扩股导致投资方持股比例下降但仍具有重大影响，投资方享有被投资单位净资产份额的增加额"},{"letter":"C","text":"企业发行金融负债，发生的手续费、佣金等交易费用"},{"letter":"D","text":"指定为以公允价值计量且其变动计人其他综合收益的非交易性权益工具投资发生的公允价值变动"}],"answer":"ACD","explanation":"选项A和D，通过“其他综合收益”科目核算。选项C，企业（发行方）发行金融负债，发生的手续费、佣金等交易费用，如以摊余成本计量的，应当计人所发行负债的初始计量金额，如分类为交易性金融负债的，应当记入“投资收益”科目的借方。"},{"num":3,"text":"下列各项中，通过“其他权益工具”科目核算的有（ ）。","options":[{"letter":"A","text":"发行可转换公司债券权益成分公允价值"},{"letter":"B","text":"企业控股股东将自身持有的企业2%股权赠予企业20名管理人员并立即行权"},{"letter":"C","text":"发行方发行的金融工具归类为权益工具的部分（普通股除外）"},{"letter":"D","text":"原归类为金融负债的金融工具重分类为权益工具"}],"answer":"ACD","explanation":"选项B，企业控股股东对企业管理人员赠予企业自身股份且立即行权，企业应按立即可行权的权益结算股份支付处理，计入资本公积。"},{"num":4,"text":"企业发生的下列交易或事项中，不会引起当期资本公积（股本溢价）发生变动的有（ ）。","options":[{"letter":"A","text":"注销库存股产生的贷方差额"},{"letter":"B","text":"重新计量设定受益计划导致净资产的变动"},{"letter":"C","text":"发行权益性证券过程中发生的路演、财经公关费和上市酒会费"},{"letter":"D","text":"现金结算的股份支付，等待期内确认的成本费用 （1）同一控制下企业合并长期股权投资入账价值与付出对价账面价值形成的差额 800万元；（2）指定为以公允价值计量且其变动计人当期损益的金融负债因企业自身信用风险变动引起的公允价值变动900万元；（3）因被投资单位重新计量设定受益计划净负债导致的变动，权益法核算确认其他综合收益500万元；（4）现金流量套期工具产生的利得中属于有效套期部分的金额200万元。关于甲公司上述交易或事项产生的净资产变动在以后期间不能转人损益的有（）。"},{"letter":"A","text":"现金流量套期工具产生的利得中属于有效套期的部分"},{"letter":"B","text":"以公允价值计量且其变动计人当期损益的金融负债因企业自身信用风险变动引起的公允价值变动 、权益法核算下，按照持股比例计算应享有被投资单位其他综合收益变动的份额"},{"letter":"D","text":"同一控制下企业合并长期股权投资入账价值与付出对价账面价值的差额"}],"answer":"BCD","explanation":"选项B，通过“其他综合收益”科目核算；选项C，应计人管理费用；选项D，通过“应付职工薪酬”科目核算。"},{"num":6,"text":"下列各项中，属于在以后会计期间满足规定条件时将重分类进损益的其他综合收益有（）。","options":[{"letter":"A","text":"境外子公司的外币报表折算差额"},{"letter":"B","text":"指定为以公允价值计量且其变动计入其他综合收益的非交易性权益工具投资的公允价值变动"},{"letter":"C","text":"分类为以公允价值计量且其变动计入其他综合收益的金融资产信用减值准备"},{"letter":"D","text":"企业将自用房地产转为采用公允价值模式计量的投资性房地产，转换日其公允价值大于账面价值的差额"}],"answer":"ACD","explanation":"选项B，指定为以公允价值计量且其变动计入其他综合收益的非交易性权益工具投资，公允价值变动计人其他综合收益，结转时转入留存收益。\n立即扫码添加“学习规划师”\n助您本章学得更快更好！\n配套课程\n精选题库\n督学服务"}]}]},{"chTitle":"第十七章 收入、费用和利润","header":"# 第十七章 收入、费用和利润\r\n\r\n## 考情速览\r\n\r\n<table><tr><td colspan=\"3\"></td></tr><tr><td>复习难度</td><td>常考题型</td><td>近5年考试平均分值</td></tr><tr><td>★★☆</td><td>客观题+主观题</td><td>6分左右</td></tr><tr><td colspan=\"3\">学习指南 本章考题涉及各种题型，以主观题为主，属于非常重要章节。</td></tr></table>\r\n\r\n## 教材主要变化\r\n\r\n（1）增加“合同履行完毕后调减商品对价的会计处理”相关表述；\r\n\r\n（2）修改“授予知识产权许可”相关表述。\r\n\r\n## 考点框架\r\n\r\n<table><tr><td rowspan=1 colspan=3>收入、费用和利润</td></tr><tr><td rowspan=6 colspan=1>收人</td><td rowspan=1 colspan=1>收人的定义及其分类</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=1 colspan=1>收入的确认和计量</td><td rowspan=1 colspan=1>难</td></tr><tr><td rowspan=1 colspan=1>关于合同资产和合同负债</td><td rowspan=1 colspan=1>●中</td></tr><tr><td rowspan=1 colspan=1>关于合同成本</td><td rowspan=1 colspan=1>●中</td></tr><tr><td rowspan=1 colspan=1>关于特定交易的会计处理</td><td rowspan=1 colspan=1>难</td></tr><tr><td rowspan=1 colspan=1>社会资本方对政府和社会资本合作（PPP）项目合同的会计处理</td><td rowspan=1 colspan=1>●中</td></tr><tr><td rowspan=2 colspan=1>费用</td><td rowspan=1 colspan=1>费用的确认</td><td rowspan=1 colspan=1>●0０易</td></tr><tr><td rowspan=1 colspan=1>期间费用</td><td rowspan=1 colspan=1>●00易</td></tr></table>\r\n\r\n\r\n\r\n<table><tr><td rowspan=1 colspan=3>收入、费用和利润</td></tr><tr><td rowspan=4 colspan=1>利润</td><td rowspan=1 colspan=1>利润的构成</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=1 colspan=1>营业外收支的会计处理</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=1 colspan=1>本年利润的会计处理（略）</td><td rowspan=1 colspan=1></td></tr><tr><td rowspan=1 colspan=1>综合收益总额</td><td rowspan=1 colspan=1>●00易</td></tr></table>\r\n\r\n## 考点剖析\r\n\r\n本章知识点内容繁多，对个别知识点的理解相对容易，但要真正记牢并理清其中的逻辑关系却有一定的难度。结合历年考试情况，本章所有内容均可出题考查，所以在学习本章的过程中，不仅要面面俱到、不留死角，还要理解透彻、能够灵活运用。","sections":[{"title":"第一节收入","content":"## 一、收入的定义及其分类\r\n\r\n考点难度●○○ 易\r\n\r\n收人，是指企业在日常活动中形成的、会导致所有者权益增加的、与所有者投人资本无关的经济利益的总流人。\r\n\r\n工业企业制造并销售产品、咨询公司提供咨询服务、商品流通企业销售商品、软件公司为客户开发软件、建筑企业提供建造服务、安装公司提供安装服务等，均属于企业的日常活动。\r\n\r\n收入准则适用于所有与客户之间的合同，但下列各项除外：长期股权投资、金融工具确认和计量、金融资产转移、套期会计、合并财务报表、合营安排、租赁、保险合同。\r\n\r\n## 提示\r\n\r\n企业以存货换取客户的存货、固定资产、无形资产等，按照《收入》准则进行会计处理；其他非货币性资产交换，按照《非货币性资产交换》准则进行会计处理；企业以存货清偿债务的，按照《债务重组》准则进行会计处理。\r\n\r\n【例题1·多选题】甲公司系生产型企业，2×25年8月份发生的下列交易中，甲公司不适用《企业会计准则第14号—一收人》的规定进行会计处理的有（ ）。A．对外出租机器设备收取的租金 B.进行债权投资收取的利息C．长期股权投资成本法核算确认的股利收人D.用公司生产的产品换入一台设备\r\n\r\n（解析）选项A适用《租赁》准则；选项B适用《金融工具确认和计量》准则；选项C适用《长期股权投资》准则；选项D适用《收入》准则。\r\n\r\n## 二、收入的确认和计量\r\n\r\n考点难度●●难\r\n\r\n企业应当在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收人。取得商品控制权包括以下三个要素：\r\n\r\n一是能力，即客户必须拥有现时权利，能够主导该商品的使用并从中获得几乎全部经济利益。如果客户只能在未来的某一期间主导该商品的使用并从中获益，则表明其尚未取得该商品的控制权。\r\n\r\n二是主导该商品的使用。客户有能力主导该商品的使用，是指客户有权使用该商品，或者能够允许或阻止其他方使用该商品。\r\n\r\n三是能够获得几乎全部的经济利益。商品的经济利益，是指该商品的潜在现金流量，既包括现金流人的增加，也包括现金流出的减少。\r\n\r\n收人准则确认收入的五步法模型：\r\n\r\n\r\n\r\n## 点拨\r\n\r\n第1步、第2步和第5步主要与收入的确认有关；第3步和第4步主要与收入的计量有关。\r\n\r\n【案例】卖手机当月开始送12个月话费：价格4800元。手机单独售价4500元，12个月话费单独售价500元。计算卖手机当月应确认的收人。\r\n\r\n第1步：识别合同，卖手机送话费\r\n\r\n第2步：识别单项履约义务，手机和话费两项履约义务\r\n\r\n第3步：确定交易价格，4800元\r\n\r\n第4步：分摊交易价格，按单独售价比例分摊\r\n\r\n手机应分摊的交易价格 $= 4 5 0 0 \\div ( 4 5 0 0 + 5 0 0 ) \\times 4 8 0 0 = 4 3 2 0 ( \\overrightarrow { \\mathcal { D } } )$\r\n\r\n12个月话费应分摊的交易价格 $= 5 0 0 \\div \\ : \\left( 4 5 0 0 + 5 0 0 \\right) \\times 4 8 0 0 = 4 8 0 ( \\overline { { \\mathcal { D } } } ) \\ : ,$\r\n\r\n第5步：确认收人\r\n\r\n手机按某一时点确认收入，当月确认收人4320元；话费按某一时段确认收人，当月应确认收入 $= 4 8 0 \\div 1 2 = 4 0 ( \\overrightarrow { \\pi } ) _ { \\mathrm { { c } } }$ ，卖手机当月应确认的收入 $= 4 3 2 0 + 4 0 = 4 3 6 0 ( \\overrightarrow { \\pi } )$\r\n\r\n例（真）题-答案」1.ABC\r\n\r\n## （一）识别与客户订立的合同 5年热点丨2次\r\n\r\n本节所称合同，是指双方或多方之间订立有法律约束力的权利义务的协议，包括书面形式、口头形式以及其他可验证的形式（如隐含于商业惯例或企业以往的习惯做法中等）。\r\n\r\n## 1.合同成立的条件\r\n\r\n当企业与客户之间的合同同时满足下列条件时，企业应当在客户取得相关商品控制权时确认收人，如下图所示：\r\n\r\n\r\n\r\n## 点拨\r\n\r\n没有商业实质的非货币性资产交换，无论何时，均不应确认收入。例如，两家石油公司之间相互交换石油，以便及时满足各自不同地点客户的需求，不具有商业实质，不应确认收入。\r\n\r\n对于不能同时满足上图中条件的合同，企业只有在不再负有向客户转让商品的剩余义务，且已向客户收取的对价无须退回时，才能将已收取的对价确认为收入；否则，应当将已收取的对价作为负债进行会计处理。\r\n\r\n## 2.合同的持续评估\r\n\r\n对于在合同开始日即满足上述收入确认条件的合同，企业在后续期间无须对其进行重新评估，除非有迹象表明相关事实和情况发生重大变化。\r\n\r\n对于不满足上述收人确认条件的合同，企业应当在后续期间对其进行持续评估，以判断其能否满足这些条件。企业如果在合同满足相关条件之前已经向客户转移了部分商品，当该合同在后续期间满足相关条件时，企业应当将在此之前已经转移的商品所分摊的交易价格确认为收人。\r\n\r\n通常情况下,合同开始日是指合同开始赋予合同各方具有法律约束力的权利和义务的日期，即合同生效日。\r\n\r\n## 3.合同存续期间的确定\r\n\r\n合同存续期间是合同各方拥有现时可执行的具有法律约束力的权利和义务的期间。实务中，有些合同可能有固定的期间，有些合同则可能没有（如无固定期间且合同各方可随时要求终止或变更的合同、定期自动续约的合同等）。企业应当确定合同存续期间，并在该期间内按照本节规定对合同进行会计处理。\r\n\r\n例如，企业与客户签订固定5年设备供应协议，约定双方均无提前终止权。\r\n\r\n分析因合同条款无终止权且具有商业实质（履行后改变现金流风险），存续期间直接按约定的5年期限确认。\r\n\r\n再如，A公司与客户签订3年期保洁服务合同，约定任何一方均可在每月末无理由终止合同，且无需支付违约金。\r\n\r\n分析虽然合同约定了3年服务期，但因双方均可在履行期间无约束终止合同，该合同被视为逐月订立。此时存续期间按单月计算，无法确认为长期合同。\r\n\r\n## 4.合同合并\r\n\r\n企业与同一客户（或该客户的关联方）同时订立或在相近时间内先后订立的两份或多份合同，在满足下列条件之一时，应当合并为一份合同进行会计处理：\r\n\r\n（1）该两份或多份合同基于同一商业目的而订立并构成一揽子交易；\r\n\r\n（2）该两份或多份合同中的一份合同的对价金额取决于其他合同的定价或履行情况；\r\n\r\n（3）该两份或多份合同中所承诺的商品（或每份合同中所承诺的部分商品）构成收人准则规定的单项履约义务。\r\n\r\n## 5.合同变更\r\n\r\n企业应当区分下列三种情形对合同变更分别进行会计处理：\r\n\r\n（1）合同变更增加了可明确区分的商品及合同价款，且新增合同价款反映了新增商品单独售价的，应当将该合同变更部分作为一份单独的合同进行会计处理。\r\n\r\n（2）合同变更不属于上述（1）规定的情形，且在合同变更日已转让的商品与未转让的商品之间可明确区分的，应当视为原合同终止，同时，将原合同未履约部分与合同变更部分合并为新合同进行会计处理。\r\n\r\n（3）合同变更不属于上述（1）规定的情形，且在合同变更日已转让的商品与未转让的商品之间不可明确区分的，应当将该合同变更部分作为原合同的组成部分进行会计处理，由此产生的对已确认收人的影响，应当在合同变更日调整当期收入。\r\n\r\n判断合同变更情形的步骤如下图所示：\r\n\r\n\r\n\r\n\r\n\r\n## 点拨 合同变更三种情形：\r\n\r\n（1）单独合同；\r\n\r\n（2）原合同终止及新合同订立；\r\n\r\n（3）原合同的组成部分。\r\n\r\n其中：第（2）种情形包括：\r\n\r\n①增加可明确区分的商品（增加价款未反映增加商品单独售价）；\r\n\r\n②未增加可明确区分的商品，但原合同未履约部分价格或履行时间变更等。\r\n\r\n第（3）种情形应按“合同合并”处理。\r\n\r\n【例题2】甲公司承诺以每件200元的价格向乙公司销售120件A产品。A产品在6个月内转移给乙公司。甲公司在某个时点转移每一件产品的控制权。当甲公司向乙公司转移了60件A产品的控制权后，合同进行了修改，要求向乙公司额外交付30件A产品（即总数为150件相同的产品）。这额外的30件A产品并未包括在原合同中。\r\n\r\n情形1：当合同被修改时，针对额外30件A产品增加合同价款5700元，或每件A产品价格为190元（反映修订时的单独售价）。\r\n\r\n分析 合同修改实际上是针对未来产品的一个新的单独合同。\r\n\r\n情形2：在协商购买额外30件A产品的过程中，乙公司发现已收到的60件A产品存在独有的瑕疵，甲公司因这些瑕疵产品向客户进行赔偿，承诺每件A产品优惠30元。合同双方新增每件A产品价格为160元（新增合同价款不反映新增商品单独售价）。\r\n\r\n分析在对额外30件A产品的销售进行处理时，甲公司确定每件A产品160元的价格并不反映这些额外产品的单独售价。将该合同修改作为原合同的终止以及将原合同未履约部分与合同变更部分合并为新合同而进行处理。\r\n\r\n对于已售60件存在瑕疵的A产品优惠1800元（60×30）冲减当期销售收入。\r\n\r\n剩余A产品单价=（200×60+30×160）÷90=186.67（元／件）。\r\n\r\n【例题3·单选题】2×25年2月1日，甲公司与乙公司签订了一项总额为 20000万元的  \r\n固定造价合同，在乙公司自有土地上为乙公司建造一栋办公楼。截至2×25年12月20日，甲  \r\n公司累计已发生成本6500万元，2×25年12月25日，经协商合同双方同意变更合同范围，  \r\n附加装修办公楼的服务内容，合同价格相应增加3400万元，假定上述新增合同价款不能反映  \r\n装修服务的单独售价。不考虑其他因素，下列各项关于上述合同变更会计处理的表述中，正确  \r\n的是（ ）。A．合同变更部分作为单独合同进行会计处理B.合同变更部分作为原合同组成部分进行会计处理C.合同变更部分作为单项履约义务于完成装修时确认收入D．原合同未履约部分与合同变更部分作为新合同进行会计处理\r\n\r\n(解析合同变更不属于第一种情形，且在合同变更日已转让商品与未转让商品之间不可明确区分的，应当将该合同变更部分作为原合同的组成部分，在合同变更日重新计算履约进度，并调整当期收入和相应成本等。\r\n\r\n例（真）题-答案」3.B\r\n\r\n## 6.交易价格的变动属于合同变更还是可变对价的区分\r\n\r\n企业在实务中应当正确区分合同变更和可变对价分别进行会计处理。\r\n\r\n合同变更，是指经合同各方批准对原合同范围或价格作出的变更，是对原合同的后续变更。合同变更主要体现为需要合同签订双方重新谈判及修订。\r\n\r\n可变对价，是指合同中约定的对价金额是可变的，不涉及对原合同的后续变更。可变对价能够合理预期合同双方均可能对合同价格提出调整。\r\n\r\n## 提示\r\n\r\n（1）在合同开始日根据其所获得的相关信息无法合理预期的，由此导致的合同各方达成协议批准对原合同价格作出的变更，不属于可变对价，应作为合同变更进行会计处理。\r\n\r\n（2）合同履行完毕后，企业与客户重新协商调减已转让商品的对价的，企业应首先判断应收账款的信用减值损失是否已充分计提，并基于调减对价的具体原因和安排，判断应收账款的减少应作为合同变更还是债务重组进行会计处理。\r\n\r\n【例题4·单选题】2×25年12月1日，甲公司与客户乙公司签订合同，在一年内以固定单价10万元向乙公司交付120件标准配件，单位成本为7万元。甲公司以往的习惯做法表明，在该商品出现瑕疵时，将根据商品的具体瑕疵情况给予客户价格折让，企业综合考虑相关因素后认为会向客户提供一定的价格折让。合同开始日，甲公司估计将提供12万元价格折让。2×25年12月15日，甲公司向乙公司交付60件配件，假定乙公司已取得60件配件的控制权。2×25年12月17日，乙公司发现配件存在质量瑕疵，需要返工，甲公司返工处理后，乙公司对返工后的配件表示满意，至2×25年12月31日，甲公司尚未收到上述款项。2×25年12月31日，为了维系客户关系，甲公司按以往的习惯做法主动提出对合同中120件配件给予每件0.2万元的价格折让，共计24万元，该折让符合甲公司以往的习惯做法。不考虑其他因素，甲公司2×25年应确认的收入是（）万元。  \r\nA.588 B.582 C.600 D. 594\r\n\r\n解析合同开始日，因甲公司估计将提供12万元价格折让，所以交易价格=120×10-12=1188（万元）。2×25年12月15日应确认销售收入 $\\cdot = 1 1 8 8 \\div 1 2 0 \\times 6 0 = 5 9 4 ( 5 \\bar { \\pi } )$ ，因甲公司给予的价格折让与整个合同相关，应当分摊至合同中的各项履约义务，其中，已交付的60件配件的履约义务已经完成，其控制权已经转移，因此，甲公司在交易价格发生变动的当期，将价格折让增加额12万元（24-12）冲减当期收入6万元（12×60/120）。甲公司已转让商品2×25年应确认收入=594-6=588（万元）。或2×25年应确认收入=$6 0 \\times ( 1 0 - 0 . 2 ) = 5 8 8 ( 5 \\pi )$\r\n\r\n解题攻略 甲公司将给予乙公司一定的价格折让，而后续实际给予的折让与初始预计的折让差异属于相关不确定性消除而发生的可变对价的变化，应作为可变对价的后续变动进行会计处理。\r\n\r\n【例题5·多选题】甲公司与客户乙公司签订合同，在一年内以固定单价100元向乙公司交付60件标准配件，无折扣、折让等金额可变条款及其他可能导致对价金额可变的安排。甲公司向乙公司交付30件配件后，市场新出现一款竞争产品，单价为每件80元。为了维系客户关系，甲公司与乙公司达成协议，将剩余30件配件的价格降为每件70元，已转让的30件配件与未转让的30件配件可明确区分。假定不考虑亏损合同等其他因素，甲公司下列会计处理中正确的有（ ）。\r\n\r\nA．剩余30件配件的价格降为每件70元属于可变对价\r\n\r\nB.合同变更应作为原合同终止及新合同订立进行会计处理\r\n\r\nC.已转让30件，每件按100元确认收人；未转让部分，以后转让时每件按70元确认收人\r\n\r\nD.未转让部分以后转让时每件按85元确认收入\r\n\r\n解析 该价格折让是由市场条件的变化引发，这种变化是甲公司在合同开始日根据其所获得的相关信息无法合理预期的，由此导致的合同各方达成协议批准对原合同价格作出的变更，不属于可变对价，应作为合同变更进行会计处理，选项A错误；该合同变更未增加可明确区分的商品，甲公司已转让的商品（已转让的30件配件）与未转让的商品（未转让的30件配件）之间可明确区分，因此，该合同变更应作为原合同终止及新合同订立进行会计处理，新合同交付配件时，每件按70元确认收入，选项B和C正确，选项D错误。\r\n\r\n## （二）识别合同中的单项履约义务\r\n\r\n合同开始日，企业应当对合同进行评估，识别该合同所包含的各单项履约义务，并确定各单项履约义务是在某一时段内履行，还是在某一时点履行，然后在履行了各单项履约义务时分别确认收入。\r\n\r\n履约义务，是指合同中企业向客户转让可明确区分商品的承诺。履约义务既包括合同中明确的承诺，也包括由于企业已公开宣布的政策、特定声明或以往的习惯做法等导致合同订立时客户合理预期企业将履行的承诺。\r\n\r\n1.企业向客户转让可明确区分商品（或者商品或服务的组合）的承诺\r\n\r\n企业向客户承诺的商品同时满足下列条件的，应当作为可明确区分商品，如下图所示：\r\n\r\n\r\n\r\n（1）商品本身是否可区分，主要考虑商品本身的性质，而非客户使用该商品的方式。因此，企业在进行评估时，不需要考虑任何可能妨碍客户从该企业以外获取易于取得的资源的合同限制。\r\n\r\n例如，主体向客户转让一部机器，而该机器仅能在安装完成后（只有主体能够实施安装）才能使客户获益，则该机器不能够明确区分。\r\n\r\n（2）合同特定背景下判断是否可明确区分，关注“重大整合服务”“重大修改或定制化”以及“高度关联性”的特征。\r\n\r\n下列情形通常表明企业向客户转让该商品的承诺与合同中其他承诺不可明确区分：\r\n\r\n①企业需提供重大的服务以将该商品与合同中承诺的其他商品整合成合同约定的某个或某些组合产出转让给客户。\r\n\r\n②该商品将对合同中承诺的其他商品予以重大修改或定制。\r\n\r\n③该商品与合同中承诺的其他商品具有高度关联性。\r\n\r\n## 提示\r\n\r\n高度关联性是指合同中承诺的各单项商品或服务之间会受到彼此的重大影响，而非仅存在功能上的单方面依赖。\r\n\r\n例如，企业在同一合同中为客户设计、生产某新产品专用模具，并使用该模具为客户生产若干样品，不应仅由于后续生产需要使用模具而认为模具与样品之间存在高度关联性。若企业在后续生产过程中，需要根据客户对样品的使用情况持续修正模具，基于修正后的模具再生产样品，最终将符合客户要求的模具及样品转让给客户，表明设计生产专用模具和生产样品之间互相受到彼此的重大影响，二者在合同层面不能明确区分，应将其识别为一项履约义务。\r\n\r\n企业向客户销售商品时，往往约定企业需要将商品运送至客户指定的地点。商品控制权转移给客户之后发生的运输活动可能表明企业向客户提供了一项运输服务，企业应当考虑该项服务是否构成单项履约义务。\r\n\r\n## 提示\r\n\r\n<table><tr><td rowspan=1 colspan=1>情形</td><td rowspan=1 colspan=2>内容</td></tr><tr><td rowspan=1 colspan=1>①对于商品控制权转移之前发生的运输费用</td><td rowspan=1 colspan=1>通常不构成单项履约义务</td><td rowspan=1 colspan=1>相关成本应当作为合同履约成本（即商品销售合同的履约成本），应结转计入营业成本（通常为主营业务成本）而非销售费用</td></tr><tr><td rowspan=1 colspan=1>②对于商品控制权转移之后发生的运输费用</td><td rowspan=1 colspan=1>通常构成单项履约义务</td><td rowspan=1 colspan=1>企业应将为运输服务发生的成本作为该单项履约义务的合同履约成本（即运输服务合同的履约成本），在确认运输服务收入时，将对应的运输成本结转至营业成本（提供运输服务可能不是企业主营业务活动，而应计入其他业务成本）</td></tr><tr><td rowspan=2 colspan=1>③其他情况下的运输费用</td><td rowspan=1 colspan=2>a.如果企业不是为履行与客户的合同而发生运输费用，一般不属于合同履约成本，而应计入当期损益，例如：企业出于管理需要在集团内部调拨货物发生的运输费用（可直接计入管理费用）；企业出于展览需要将货物运送至展会现场（可直接计入销售费用）</td></tr><tr><td rowspan=1 colspan=2>b.如果运输费用属于使存货达到目前场所和状态的必要支出，形成了预期会给企业带来经济利益的资源时，运输费用应当计入存货成本</td></tr></table>\r\n\r\n【例题6】某承包商企业签订了一份为客户建造医院的合同。该企业负责项目的整体管理，并识别应提供的各种商品或服务，包括工程技术、场地清理、地基购建、采购、建筑架构、管道和管线的铺设、设备安装及装修等。\r\n\r\n分析 属于组合产出，不可明确区分。\r\n\r\n【例题7】甲公司与客户订立一项合同，约定转让软件许可证、实施安装服务并在2年期间内提供未明确规定的软件更新和技术支持（通过在线和电话方式）。安装服务包括为各类用户（例如，市场营销、库存管理和信息技术）更改网页屏幕。作为安装服务的一部分，软件将作重大定制以增添重要的新功能，从而使软件能够与客户使用的其他定制软件应用程序相对接。\r\n\r\n分析定制安装服务与软件许可证之间不可明确区分，应作为单项履约义务。\r\n\r\n【例题8】甲公司同意为客户设计一种实验性的新产品并生产该产品的20个样品。产品规格包含尚未得到证实的功能。甲公司应根据客户意见，不断改进样品，直到客户满意。\r\n\r\n分析设计服务与生产服务高度关联，不可明确区分，应作为单项履约义务。\r\n\r\n2.企业向客户转让一系列实质相同且转让模式相同的、可明确区分商品的承诺基于成本效益原则应当作为单项履约义务，如酒店管理服务、保洁服务等。\r\n\r\n【例题9·多选题】2×24年至2×25年，甲公司发生的有关交易或事项如下：按照乙公  \r\n司经营战略，乙公司拟采购一台大型机械设备。为此，乙公司进行招标，甲公司中标承接了乙  \r\n公司该项目。2×24年10月30日，甲公司与乙公司签订的大型机械设备采购合同约定，甲公  \r\n司为乙公司生产一台大型机械设备并提供安装（假定该设备安装复杂，只能由甲公司提供）,  \r\n合同价格为20000万元，甲公司应于2×25年9月30日前交货。2×24年11月5日，甲公司  \r\n与乙公司又签订的另一份合同约定，甲公司为乙公司建造的大型机械设备在交付乙公司后，需  \r\n对大型机械设备进行重大修改以实现与乙公司现有若干设备的整合，合同价格为5000万元，  \r\n甲公司应于2×25年11月30日前完成对该设备的重大修改。上述两份合同的价格均反映了市  \r\n场价格。2×24年11月10日，甲公司与乙公司签订的一份服务合同约定，甲公司在未来3年  \r\n内为乙公司上述设备进行维护，合同价格为每年1000万元，甲公司为其他公司提供类似服务  \r\n的合同价格与该合同确定的价格相同。设备及安装、修改整合工作按合同约定的时间完成，乙  \r\n公司检验合格并于2×25年12月1日投入生产使用。假定不考虑其他因素，甲公司下列会计  \r\n处理中正确的有（ ）。A．甲公司与乙公司分别签订的采购大型机械设备并安装合同、对大型机械设备的重大修改合同，这两份合同分别构成单项履约义务B．甲公司与乙公司分别签订的采购大型机械设备并安装合同、对大型机械设备的重大修改合同，这两份合同应当合并为一份合同C.甲公司与乙公司签订的维护服务合同构成单项履约义务D．甲公司与乙公司分别签订的采购大型机械设备并安装合同、对大型机械设备的重大修改合同、维护服务合同，这三份合同应当合并为一份合同\r\n\r\n解析甲公司与乙公司分别签订的采购大型机械设备并安装合同、对大型机械设备的重大修改合同，构成单项履约义务，两份合同应予以合并。甲公司与乙公司签订的服务合同包含一项履约义务，即为乙公司提供设备后续维护服务，构成单项履约义务，不应与另两份合同合并，选项B和C正确。\r\n\r\n（解题攻略）因大型机械设备安装复杂，只能由甲公司提供，销售大型机械设备与安装服务不可明确区分；对大型机械设备进行重大修改以实现与乙公司现有若干设备的整合，合同特定背景下不可明确区分。因此销售大型机械设备并安装合同、对大型机械设备的重大修改合同构成单项履约义务。\r\n\r\n## （三）确定交易价格5年热点丨4次\r\n\r\n企业应当按照分摊至各单项履约义务的交易价格计量收人。\r\n\r\n交易价格，是指企业因向客户转让商品而预期有权收取的对价金额。\r\n\r\n## 点拨 合同标价并不一定代表交易价格。\r\n\r\n企业代第三方收取的款项以及企业预期将退还给客户的款项，应当作为负债进行会计处理，不计入交易价格。\r\n\r\n## 交易价格内容如下图所示：\r\n\r\n\r\n\r\n## 1.可变对价\r\n\r\n企业与客户的合同中约定的对价金额可能会因折扣、价格折让、返利、退款、奖励积分、激励措施、业绩奖金、索赔等因素而变化。此外，根据一项或多项或有事项的发生而收取不同对价金额的合同，也属于可变对价的情形。\r\n\r\n点拨 “现金折扣”不应计入财务费用，应当按照可变对价的相关规定进行会计处理。\r\n\r\n## （1）可变对价最佳估计数的确定\r\n\r\n企业应当按照期望值或最可能发生金额确定可变对价的最佳估计数。\r\n\r\n【例题10】甲公司与分包商乙公司于2×25年1月1日签订了电路板生产合同，生产数量为50000个，完工日为2×25年6月30日，合同价格为1000000元。若生产于2×25年6月30日前完工，每提前一天，承诺的对价将增加10000元；若生产于2×25年6月30日未完工，每延迟一天，承诺的对价将减少10000元。甲公司估计延迟2天的概率为5%，延迟1天的概率为10%，按时完工的概率为50%，提前1天的概率为20%，提前2天的概率为15%。\r\n\r\n分析 可变对价最佳估计数=（1000000-20000）×5%+（1000000-10000）×10%+1000000× 50%+（1000000+10000）×20%+（1000000+20000）×15%=1003000（元）。（按照期望值确定最佳估计数）。\r\n\r\n【例题11】甲公司签署了一项合同，根据合同，若甲公司完成了某项业绩目标即可获得200万元的奖金，未完成则没有奖金；甲公司估计完成该项业绩目标可能性为90%，完不成的可能性为10%。\r\n\r\n（分析）可变对价最佳估计数为200万元。（按照最可能发生金额确定最佳估计数）。\r\n\r\n## （2）计入交易价格的可变对价金额的限制\r\n\r\n企业按照期望值或最可能发生金额确定可变对价金额之后，计人交易价格的可变对价金额还应该满足限制条件，即包含可变对价的交易价格，应当不超过在相关不确定性消除时，累计已确认的收人极可能不会发生重大转回的金额。\r\n\r\n## 点拨\r\n\r\n向客户授予知识产权许可并约定按客户实际销售或使用情况收取特许权使用费，应在未来实际销售或使用行为发生且企业履行相关履约义务时才能确定交易价格，因此计入交易价格的可变对价金额的限制不适用该种情况。\r\n\r\n每一资产负债表日，企业应当重新估计应计人交易价格的可变对价金额，包括重新评估将估计的可变对价计人交易价格是否受到限制，以如实反映报告期末存在的情况以及报告期内发生的情况变化。\r\n\r\n## 问答 销售返利如何进行会计处理？\r\n\r\n答：监管规则适用指引—会计类第2号：企业对客户的销售返利形式多样，有现金返利、货物返利等，返利的条款安排也各不相同。企业应当基于返利的形式和合同条款的约定，考虑相关条款安排是否会导致企业未来需要向客户提供可明确区分的商品或服务，在此基础上判断相关返利属于可变对价还是提供给客户的重大权利。一般而言，对基于客户采购情况等给予的现金返利，企业应当按照可变对价原则进行会计处理；对基于客户一定采购数量的实物返利或仅适用于未来采购的价格折扣，企业应当按照附有额外购买选择权的销售进行会计处理，评估该返利是否构成一项重大权利，以确定是否将其作为单项履约义务并分摊交易对价。\r\n\r\n【例题12·单选题】2×25年7月1日，经销商向甲公司采购商品500万元，获得25万  \r\n元返点，经销商可以按25万元抵扣未来向甲公司采购商品的价款或按25万元向甲公司换取现  \r\n金。不考虑其他因素，下列各项关于甲公司在确认收人时对返点会计处理的表述中，正确的是  \r\n（ ）。A．作为额外购买选择权进行会计处理B.作为重大融资成分进行会计处理C.作为非现金对价进行会计处理D.作为可变对价进行会计处理\r\n\r\n解析 可变对价，即企业与客户的合同中约定的对价金额不是固定的，如折扣、价格折让、返利、退款、奖励积分、激励措施、业绩奖金、索赔等。一般而言，对基于客户采购情况等给予的现金返利，企业应当按照可变对价原则进行会计处理；对基于客户一定采购数量的实物返利或仅适用于未来采购的价格折扣，企业应当按照附有额外购买选择权的销售进行会计处理，评估该返利是否构成一项重大权利，以确定是否将其作为单项履约义务并分摊交易对价，选项D正确。\r\n\r\n## 2.合同中存在的重大融资成分\r\n\r\n合同中存在重大融资成分的，企业应当按照假定客户在取得商品控制权时即以现金支付的应付金额（即现销价格）确定交易价格。该交易价格与合同对价之间的差额，应当在合同期间内采用实际利率法摊销。\r\n\r\n【例题13·多选题】对合同中存在重大融资成分的商品销售，下列表述中错误的有（ ）。A.企业应当按照假定客户在取得商品控制权时即以现金支付的应付金额确定交易价格B.企业应当按照合同价格的现值确定交易价格  \r\nC.企业应当按照合同价格确定交易价格  \r\nD.交易价格与合同对价之间的差额，应当在合同期间内采用直线法摊销\r\n\r\n解析合同中存在重大融资成分的，企业应当按照假定客户在取得商品控制权时即以现金支付的应付金额确定交易价格。该交易价格与合同对价之间的差额，应当在合同期间内采用实际利率法摊销，选项B、C和D错误。\r\n\r\n合同开始日，企业预计客户取得商品控制权与客户支付价款间隔不超过一年的，可以不考虑合同中存在的重大融资成分。\r\n\r\n企业向客户转让商品与客户支付相关款项之间虽然存在时间间隔，但两者之间的合同没有包含重大融资成分的情形有：\r\n\r\n（1）客户就商品支付了预付款，且可以自行决定这些商品的转让时间。例如，企业向客户出售其发行的储值卡，客户可随时到该企业持卡购物；再如，企业向客户授予奖励积分，客户可随时到该企业兑换这些积分等。\r\n\r\n（2）客户承诺支付的对价中有相当大的部分是可变的，该对价金额或付款时间取决于某一未来事项是否发生，且该事项实质上不受客户或企业控制。例如，按照实际销售量收取的特许权使用费。\r\n\r\n（3）合同承诺的对价金额与现销价格之间的差额是由于向客户或企业提供融资利益以外的其他原因所导致的，且这一差额与产生该差额的原因是相称的。例如，合同约定的支付条款是为了向企业或客户提供保护，以防止另一方未能依照合同充分履行其部分或全部义务。\r\n\r\n此外，在某些交易中企业向客户转让商品或服务的时间与收款的时间间隔可能较长，而导致该时间间隔的主要原因是国家有关部门需要履行相关的审批程序，且该时间间隔是履行上述程序所需经历的必要时间，其性质并非是提供融资利益。例如，企业从事新能源汽车的生产与销售，作为新能源汽车销售对价组成部分的新能源汽车补贴款的收取时间与该部分补贴能够计人交易价格并确认收入的时间间隔可能超过一年等。这种情况下，可以认为企业取得的新能源汽车补贴款不存在重大融资成分。\r\n\r\n【例题14】2×25年1月，甲公司与乙公司签订了一项施工总承包合同。合同约定的工期为30个月，工程造价为8亿元（不含税价）。甲、乙双方每季度进行一次工程结算，并于完工时进行竣工决算，每次工程结算额（除质保金及相应的增值税外）由乙公司于工程结算后5个工作日内支付，除质保金外的工程尾款于竣工决算后10个工作日内支付，合同金额的3%作为质保金，用以保证项目在竣工后2年内正常运行，在质保期满后5个工作日内支付。\r\n\r\n分析本例中，乙公司保留了3%的质保金直到项目竣工2年后支付，虽然服务完成时间与乙公司付款时间间隔较长，但是，该质保金旨在为乙公司提供工程质量保证，以防甲公司未能完成其合同义务，而并非向乙公司提供融资。因此，甲公司认为该合同中不包含重大融资成分，无须就延期支付质保金的影响调整交易价格。\r\n\r\n合同中存在重大融资成分的，企业在确定该重大融资成分的金额时，应使用将合同对价的名义金额折现为商品现销价格的折现率。该折现率一经确定，不得因后续市场利率或客户信用风险等情况的变化而变更。企业确定的交易价格与合同承诺的对价金额之间的差额，应当在合同期间内采用实际利率法摊销。企业只有在确认了合同资产（或应收款项）和合同负债时，才应当分别确认重大融资成分相应的利息收人和利息支出。\r\n\r\n## 提示\r\n\r\n企业应当在单个合同层面考虑融资成分是否重大，而不应在合同组合层面考虑这些合同中的融资成分的汇总影响对企业整体而言是否重大。\r\n\r\n为简化实务操作，如果在合同开始日，企业预计客户取得商品控制权与客户支付价款间隔不超过一年的，可以不考虑合同中存在的重大融资成分。企业应当对类似情形下的类似合同一致地应用这一简化处理方法。\r\n\r\n合同中存在重大融资成分情形的会计分录（不考虑增值税）如下表所示：\r\n\r\n<table><tr><td rowspan=1 colspan=1>先确认收入后收款</td><td rowspan=1 colspan=1>先收款后确认收入</td></tr><tr><td rowspan=1 colspan=1>①确认收人时借：长期应收款贷：主营业务收入未实现融资收益</td><td rowspan=1 colspan=1>①收款时借：银行存款未确认融资费用贷：合同负债（未来确认收人金额）</td></tr><tr><td rowspan=1 colspan=1>②每期确认利息收入时借：未实现融资收益贷：财务费用</td><td rowspan=1 colspan=1>②每期确认利息费用时借：财务费用贷：未确认融资费用</td></tr><tr><td rowspan=1 colspan=1>③收款时借：银行存款贷：长期应收款</td><td rowspan=1 colspan=1>③确认收人时借：合同负债贷：主营业务收入</td></tr></table>\r\n\r\n【例题15】2×24年1月1日，甲公司与乙公司签订合同，向其销售一批产品。合同约定，该批产品将于2年之后交货。合同中包含两种可供选择的付款方式，即乙公司可以在2年后交付产品时支付449.44万元，或者在合同签订时支付400万元。乙公司选择在合同签订时支付货款。该批产品的控制权在交货时转移。甲公司于2×24年1月1日收到乙公司支付的货款。上述价格均不包含增值税，且假定不考虑相关税费影响。\r\n\r\n分析）本例中，按照上述两种付款方式计算的内含利率为6%。考虑到乙公司付款时间和产品交付时间之间的间隔以及现行市场利率水平，甲公司认为该合同包含重大融资成分，在确定交易价格时，应当对合同承诺的对价金额进行调整，以反映该重大融资成分的影响。假定融资费用不符合借款费用资本化的要求。甲公司的账务处理为（以“元”为单位）：\r\n\r\n（1）2×24年1月1日收到货款：\r\n\r\n借：银行存款\r\n\r\n未确认融资费用 494400\r\n\r\n贷：合同负债 4494400\r\n\r\n（2）2×24年12月31日确认融资成分的影响：\r\n\r\n借：财务费用 240000（4000000×6%）\r\n\r\n贷：未确认融资费用 240000\r\n\r\n（3）2×25年12月31日交付产品：\r\n\r\n借：财务费用 254400（494400-240000）\r\n\r\n贷：未确认融资费用 254400\r\n\r\n借：合同负债 4494400\r\n\r\n贷：主营业务收入 4494400\r\n\r\n## 3.非现金对价\r\n\r\n当企业因转让商品而有权向客户收取的对价是非现金形式时，例如实物资产、无形资产、股权、客户提供的广告服务等。企业通常应当按照非现金对价在合同开始日的公允价值确定交易价格。非现金对价公允价值不能合理估计的，企业应当参照其承诺向客户转让商品的单独售价间接确定交易价格。\r\n\r\n<table><tr><td rowspan=2 colspan=1>非现金对价公允价值变动的会计处理</td><td rowspan=1 colspan=1>公允价值因对价的形式而发生变动</td><td rowspan=1 colspan=1>合同开始日后，非现金对价的公允价值因对价形式而发生变动的（如权益工具投资自身后续公允价值的变动），该变动金额不应计人交易价格点拨  非现金对价为交易性金融资产的，取得交易性金融资产时，按取得日的公允价值入账，但按合同开始日的公允价值确认收入，差额计入公允价值变动损益</td></tr><tr><td rowspan=1 colspan=1>公允价值因对价形式以外的原因而发生变动</td><td rowspan=1 colspan=1>合同开始日后，非现金对价的公允价值因对价形式以外的原因而发生变动的（如企业有权收取非现金对价的公允价值因企业的履约情况而发生变动），应当作为可变对价，按照与计人交易价格的可变对价金额的限制条件相关的规定进行处理</td></tr></table>\r\n\r\n【例题16】甲企业为客户生产一台专用设备。双方约定，如果甲企业能够在30天内交货，则可以额外获得600股客户的股票作为奖励。合同开始日，该股票的价格为每股4元，由于缺乏执行类似合同的经验，甲企业当日估计，该600股股票的公允价值计人交易价格将不满足累计已确认的收人极可能不会发生重大转回的限制条件。合同开始日之后的第27天，甲企业将该设备交付给客户，从而获得了600 股股票，该股票在此时的价格为每股4.5元。假定甲企业将该股票作为以公允价值计量且其变动计人当期损益的金融资产。\r\n\r\n（分析）本例中，合同开始日，该股票的价格为每股4元，由于缺乏执行类似合同的经验，甲企业当日估计，该600股股票的公允价值计入交易价格将不满足累计已确认的收入极可能不会发生重大转回的限制条件，甲企业不应将该600股股票的公允价值2400元计入交易价格。合同开始日之后的第27天，甲企业获得了600股股票，该股票在此时的价格为每股4.5元。甲企业应按股票（非现金对价）在合同开始日的公允价值，即2400元（4×600）确认收入，因对价形式而发生的变动，即300元（4.5×600-4×600）计入公允价值变动损益。\r\n\r\n## 4.应付客户对价\r\n\r\n企业存在应付客户（或向客户购买本企业商品的第三方）对价的，应当将该应付对价冲减交易价格，并在确认相关收人与支付（或承诺支付）客户对价二者孰晚的时点冲减当期收入，但应付客户对价是为了向客户取得其他可明确区分商品的除外。\r\n\r\n企业应付客户对价是为了向客户取得其他可明确区分商品的，应当采用与本企业其他采购相一致的方式确认所购买的商品。企业应付客户对价超过向客户取得可明确区分商品公允价值的，超过金额应当冲减交易价格。向客户取得的可明确区分商品公允价值不能合理估计的，企业应当将应付客户对价全额冲减交易价格。\r\n\r\n点拨 应付客户对价可能确认购买商品，也可能冲减交易价格，还可能二者兼而有之。\r\n\r\n\r\n\r\n【例题17】2×25年1月1日，甲公司与乙公司签订了1年期的A产品销售协议，以每件200元的价格将A产品卖给乙公司；甲公司每月向乙公司出售1000件A产品。根据甲公司与乙公司签订的协议，为促进甲公司与乙公司建立良好的合作关系，甲公司应在协议签订当天向乙公司支付产品品牌服务费3000元，以补偿乙公司专门为放置甲公司的A产品而需对其超市货架作出的改动，甲公司并未取得货架的控制权，亦不能决定A产品在货架上摆放的位置。\r\n\r\n要求：判断甲公司支付的产品品牌服务费应如何进行会计处理，说明理由。\r\n\r\n答案甲公司应将支付的产品品牌服务费冲减对乙公司的相关收入。\r\n\r\n理由：甲公司并未获得对货架的控制权，不能决定A产品在货架上摆放的位置；甲公司向乙公司支付的产品品牌服务费并未换取可明确区分的商品或服务。\r\n\r\n【例题18·单选题】2×25年10月1日，甲公司与乙公司签订合同。按合同规定，甲公  \r\n司向乙公司销售A商品100件，每件售价1万元，同时从乙公司购人B商品10件，每件公允  \r\n价值为0.5万元，购买B商品前甲公司应预付乙公司6万元。2×25年10月15日，相关A、  \r\nB商品的控制权均已转移至对方。不考虑相关税费等因素，甲公司2×25年10月应确认的收  \r\n入是（）万元。A.100 B.99 C. 95 D. 94\r\n\r\n（解析)甲公司应付客户对价6万元超过从客户购买商品的公允价值5万元（10×0.5），超过部分1万元应冲减销售收入，即甲公司2×25年10月应确认的收入=100×1-1=99（万元）。\r\n\r\n## （四）将交易价格分摊至各单项履约义务 5年热点丨2次\r\n\r\n## 1.基本原则\r\n\r\n合同中包含两项或多项履约义务的，企业应当在合同开始日，按照各单项履约义务所承诺商品的单独售价的相对比例，将交易价格分摊至各单项履约义务。企业不得因合同开始日之后单独售价的变动而重新分摊交易价格。\r\n\r\n\r\n\r\n点拨 考试时一般会直接给出各单项履约义务的单独售价。\r\n\r\n## （1）单独售价可以直接观察\r\n\r\n单独售价，是指企业向客户单独销售商品的价格。企业在类似环境下向类似客户单独销售商品的价格，应作为确定该商品单独售价的最佳证据。\r\n\r\n## （2）单独售价无法直接观察\r\n\r\n单独售价无法直接观察的，企业应当综合考虑其能够合理取得的全部相关信息，采用市场调整法、成本加成法、余值法等方法合理估计单独售价。在估计单独售价时，企业应当最大限度地采用可观察的输人值，并对类似的情况采用一致的估计方法。\r\n\r\n企业在商品近期售价波动幅度巨大，或者因未定价且未曾单独销售而使售价无法可靠确定时，可采用余值法估计其单独售价。\r\n\r\n## 2.分摊合同折扣\r\n\r\n合同折扣，是指合同中各单项履约义务所承诺商品的单独售价之和高于合同交易价格的金额。\r\n\r\n对于合同折扣，企业应当在各单项履约义务之间按比例分摊。\r\n\r\n有确凿证据表明合同折扣仅与合同中一项或多项（而非全部）履约义务相关的，企业应当将该合同折扣分摊至相关的一项或多项履约义务。\r\n\r\n点拨 合同折扣分摊原则是分摊至相关部分。\r\n\r\n同时满足下列条件时，企业应当将合同折扣全部分摊至合同中的一项或多项（而非全部）履约义务：\r\n\r\n（1）企业经常将该合同中的各项可明确区分的商品单独销售或者以组合的方式单独销售；\r\n\r\n（2）企业也经常将其中部分可明确区分的商品以组合的方式按折扣价格单独销售；\r\n\r\n（3）上述第（2）项中的折扣与该合同中的折扣基本相同，且针对每一组合中的商品的分析为将该合同的全部折扣归属于某一项或多项履约义务提供了可观察的证据。\r\n\r\n有确凿证据表明合同折扣仅与合同中的一项或多项（而非全部）履约义务相关，且企业采用余值法估计单独售价的，企业应当首先在该一项或多项（而非全部）履约义务之间分摊合同折扣，然后再采用余值法估计单独售价。\r\n\r\n## 3.分摊可变对价\r\n\r\n合同中包含可变对价的，该可变对价可能与整个合同相关，也可能仅与合同中的某一特定组成部分有关，后者包括两种情形：一是可变对价可能与合同中的一项或多项（而非全部）履约义务有关；二是可变对价可能与企业向客户转让的构成单项履约义务的一系列可明确区分商品中的一项或多项（而非全部）商品有关。\r\n\r\n同时满足下列条件的，企业应当将可变对价及可变对价的后续变动额全部分摊至与之相关的某项履约义务，或者构成单项履约义务的一系列可明确区分商品中的某项商品：（1）可变对价的条款专门针对企业为履行该项履约义务或转让该项可明确区分商品所作的努力（或者是履行该项履约义务或转让该项可明确区分商品所导致的特定结果）；（2）企业在考虑了合同中的全部履约义务及支付条款后，将合同对价中的可变金额全部分摊至该项履约义务或该项可明确区分商品符合分摊交易价格的目标。\r\n\r\n对于不满足上述条件的可变对价及可变对价的后续变动额，以及可变对价及其后续变动额中未满足上述条件的剩余部分，企业应当按照分摊交易价格的一般原则，将其分摊至合同中的各单项履约义务。对于已履行的履约义务，其分摊的可变对价后续变动额应当调整变动当期的收入。\r\n\r\n## 点拨\r\n\r\n可变对价分摊至与之相关的一项或多项（而非全部）履约义务，若不可行，则将其分摊至合同中的各单项履约义务。\r\n\r\n## 4.交易价格的后续变动\r\n\r\n交易价格发生后续变动的，企业应当按照在合同开始日所采用的基础将该后续变动金额分摊至合同中的履约义务。企业不得因合同开始日之后单独售价的变动而重新分摊交易价格。对于合同变更导致的交易价格后续变动，应当按照本节有关合同变更的要求进行会计处理。合同变更之后发生可变对价后续变动的，企业应当区分下列三种情形分别进行会计处理：\r\n\r\n（1）合同变更属于本节合同变更第（1）种规定情形的，企业应当判断可变对价后续变动与哪一项合同相关，并按照分摊可变对价的相关规定进行会计处理。\r\n\r\n（2）合同变更属于本节合同变更第（2）种规定情形，且可变对价后续变动与合同变更前已承诺可变对价相关的，企业应当首先将该可变对价后续变动额以原合同开始日确定的单独售价为基础进行分摊，然后再将分摊至合同变更日尚未履行履约义务的该可变对价后续变动额以新合同开始日确定的基础进行二次分摊。\r\n\r\n（3）合同变更之后发生除上述第（1）和（2）种情形以外的可变对价后续变动的，企业应当将该可变对价后续变动额分摊至合同变更日尚未履行（或部分未履行）的履约义务。\r\n\r\n## （五）履行每一单项履约义务时确认收入 5年热点丨4次\r\n\r\n企业应当在履行了合同中的履约义务，即客户取得相关商品控制权时确认收人。企业应当根据实际情况，首先判断履约义务是否满足在某一时段内履行的条件，如不满足，则该履约义务属于在某一时点履行的履约义务。\r\n\r\n## 1.在某一时段内履行的履约义务的收入确认条件\r\n\r\n满足下列条件之一的，属于在某一时段内履行的履约义务；否则，属于在某一时点履行的履约义务：\r\n\r\n<table><tr><td rowspan=1 colspan=1>条件</td><td rowspan=1 colspan=1>举例</td></tr><tr><td rowspan=1 colspan=1>（1）客户在企业履约的同时即取得并消耗企业履约所带来的经济利益</td><td rowspan=1 colspan=1>常规或经常性的服务</td></tr><tr><td rowspan=1 colspan=1>（2）客户能够控制企业履约过程中在建的商品</td><td rowspan=1 colspan=1>在客户场地上建造办公大楼等</td></tr><tr><td rowspan=1 colspan=1>（3）企业履约过程中所产出的商品具有不可替代用途，且该企业在整个合同期间内有权就累计至今已完成的履约部分收取款项</td><td rowspan=1 colspan=1>建造只有客户能够使用的专项资产，或按照客户的指示建造资产</td></tr></table>\r\n\r\n## 点拨\r\n\r\n条件（1)：更换后的企业继续履行剩余履约义务时，实质上无须重新执行更换前的企业至今已完成的工作；\r\n\r\n条件（2）：企业在履约过程中在建的商品包括在产品、在建工程、尚未完成的研发项目、正在进行的服务等；\r\n\r\n条件（3)：不可替代用途+整个合同期间+成本和合理利润。\r\n\r\n具有不可替代用途，是指因合同限制或实际可行性限制，企业不能轻易地将商品用于其他用途。\r\n\r\n有权就累计至今已完成的履约部分收取款项，是指在由于客户或其他方原因终止合同的情况下，企业有权就累计至今已完成的履约部分收取能够补偿其已发生成本和合理利润的款项，并且该权利具有法律约束力。\r\n\r\n【例题19·单选题】甲公司是一家中国境内的房地产开发企业，在中国境内从事房地产住宅项目的开发与销售。甲公司于2×24年1月取得一块土地使用权，并在该块土地上开发A小区商品房，于同年8月取得预售许可证之后开始预售A小区商品房，预计将于2×26年3月竣工后交付给客户。2×25年2月1日，甲公司和某客户签订商品房买卖合同，将A小区的一套商品房预售给购房人张某，付款方式为张某于合同签订日一次性全额支付合同价款。合同的主要条款约定如下：（1）甲公司向张某预售的商品房为：A小区5号楼2单元701室；（2）甲公司不能将该商品房出售给合同约定的张某之外的其他方；（3）该商品房应于2×26年4月30日前交付给张某，该商品房在建期间张某不拥有该商品房的法定所有权，不能将在建商品房用于出售或抵押；（4）在下列情形下张某有权解除合同：①张某所购商品房套内建筑面积误差比绝对值超过3%；②甲公司逾期交房超过30天；③房屋交付后，主体结构质量不合格。除上述情形外，如果张某单方面要求解除合同，应当向甲公司支付合同价款的30%作为违约金。不考虑其他因素，甲公司下列会计处理中正确的是（ ）。\r\n\r\nA.甲公司应于2×25年2月1日收款时一次性确认收人  \r\nB.该商品房具有不可替代用途，应按某一时段确认收人  \r\nC．甲公司应当在张某取得该指定商品房控制权时（通常为交付商品房时）确认收人  \r\nD．甲公司2×25年应按履约进度确认收人\r\n\r\n（解析）甲公司的履约义务为向指定购房人销售建造的商品房，针对该项履约义务：（1）甲公司负责建造商品房，商品房在建期间购房人尚未取得相关商品房的法定所有权，购房人并不能在甲公司建造商品房的同时即取得并消耗甲公司建造商品房所带来的经济利益；（2）甲公司在其自己拥有土地使用权的土地上建造商品房，商品房建造期间购房人尚未取得相关商品房的法定所有权，无法将该在建商品房用于出售或抵押，也无权主导房屋的建设、改变房屋设计或用途，表明购房人不能主导该商品房的使用并从中获得几乎全部的经济利益，因此，购房人不能够控制甲公司履约过程中在建的相关商品房；（3）合同约定甲公司向购房人销售的商品房为指定楼栋门牌号的唯一房屋单位，甲公司建造的商品房具有不可替代用途，但是，如果购房人单方面要求解除合同，仅需向甲公司支付合同价款的30%作为违约金，表明甲公司并不能在整个合同期间内任一时点就累计至今已完成的履约部分收取能够补偿其已发生成本和合理利润的款项。因此，甲公司该商品房预售业务不满足在某一时段内履行的履约义务的条件，属于在某一时点履行的履约义务，甲公司应当在购房人取得该指定商品房控制权时（通常为交付商品房时）确认收入，选项C正确。\r\n\r\n解题攻略）若不属于某一时段内确认收入的三种情形，则应按某一时点确认收入。\r\n\r\n## 问答 企业在客户的场地上为客户建造资产如何确认收入？\r\n\r\n答：如果客户不能控制企业履约过程中在建的资产，则按某一时点确认收入。如在客户的车间为客户建造的智能检测线，若企业违约，客户不能在已完成部分的基础上继续建造，因而在建造完成前，不能为客户带来经济利益，客户并不能控制企业履约过程中在建的资产，所以不符合时段法确认收入的条件。\r\n\r\n如果客户能够控制企业履约过程中在建的资产，则按时段法确认收入。如企业在客户的场地上为客户建造办公大楼等资产。\r\n\r\n## 2.在某一时段内履行的履约义务的收人确认方法\r\n\r\n企业应当考虑商品的性质，采用产出法或投入法确定恰当的履约进度，并且在确定履约进度时，应当扣除那些控制权尚未转移给客户的商品和服务。\r\n\r\n## （1）产出法\r\n\r\n产出法主要是根据已转移给客户的商品对于客户的价值确定履约进度，主要包括按照实际测量的完工进度、评估已实现的结果、已达到的里程碑、时间进度、已完工或交付的产品等确定履约进度的方法。企业在评估是否采用产出法确定履约进度时，应当考虑所选择的产出指标是否能够如实反映向客户转移商品的进度。\r\n\r\n产出法是按照已完成的产出直接计算履约进度，通常能够客观地反映履约进度。\r\n\r\n当产出法所需要的信息可能无法直接通过观察获得，或者为获得这些信息需要花费很高的成本时，可采用投人法。\r\n\r\n## 例（真）题-答案」 19.C\r\n\r\n（2）投人法\r\n\r\n投入法主要是根据企业履行履约义务的投人确定履约进度，通常可采用投人的材料数量、花费的人工工时或机器工时、发生的成本和时间进度等投入指标确定履约进度。\r\n\r\n## 提示\r\n\r\n①履约进度=已发生成本/合同预计总成本×100%\r\n\r\n②合同预计总成本=已发生成本+完成合同将发生成本\r\n\r\n企业在采用成本法确定履约进度时，可能需要对已发生的成本进行适当调整的情形有：\r\n\r\n①已发生的成本并未反映企业履行其履约义务的进度\r\n\r\n如因企业生产效率低下等原因而导致的非正常消耗，包括非正常消耗的直接材料、直接人工及制造费用等，除非企业和客户在订立合同时已经预见会发生这些成本并将其包括在合同价款中。\r\n\r\n②已发生的成本与企业履行其履约义务的进度不成比例\r\n\r\n如果企业已发生的成本与履约进度不成比例，企业在采用成本法时需要进行适当调整。为了确保成本法能够适当反映企业履行其履约义务的进度，对于施工中尚未安装、使用或耗用的商品（本段的商品不包含服务）或材料成本等，当企业在合同开始日就能够预期将满足下列所有条件时，企业在采用成本法确定履约进度时不应包括该商品的成本：\r\n\r\na.该商品不构成单项履约义务；\r\n\r\nb.客户先取得该商品的控制权，之后才接受与之相关的服务；\r\n\r\nc.该商品的成本占预计总成本的比重较大；\r\n\r\nd.企业自第三方采购该商品，且未深入参与其设计和制造，对于包含该商品的履约义务而言，企业是主要责任人。\r\n\r\n【例题20·多选题】2×25年11月，甲公司与乙公司订立一项装修一幢3层建筑物并安装  \r\n新电梯的合同，合同总对价为2000万元。已承诺的装修服务（包括电梯安装，假定电梯毛利  \r\n为0）是一项在一段时间内履行的履约义务。预计总成本为1600万元（包括电梯成本600万  \r\n元）。甲公司在电梯转让给乙公司前获得对电梯的控制。甲公司使用投入法基于已发生的成本  \r\n来计量其履约义务的履约进度。乙公司在2×25年12月电梯运抵该建筑物时获得对电梯的控  \r\n制，电梯直至2×26年6月才安装完成。甲公司未参与电梯的设计与安装。至2×25年12月  \r\n31日，已发生的成本为200万元（不包括电梯）。下列会计处理表述中，正确的有（ ）。A.至2×25年12月31日履约进度为20%B．电梯收人应在安装完毕检验合格后确认C．2×25年确认营业收入880万元D.2×25年确认营业成本800万元\r\n\r\n（解析在计算履约进度时，和履约进度无关的成本（电梯成本）需要扣除，履约进度 $= 2 0 0 \\div \\mathrm { ~ ( ~ 1 6 0 0 - 6 0 0 ~ ) ~ } \\times 1 0 0 \\% = 2 0 \\%$ ，选项A正确；电梯收入应在将控制权转移给客户时确认，选项B错误；2×25年确认营业收 $\\lambda = \\left( \\ 2 0 0 0 { - } 6 0 0 \\right) \\ \\times 2 0 \\% { + } 6 0 0 { = } 8 8 0 \\ ( \\ \\mathcal { F } \\bar { \\pi } \\ )$ 选项C正确；2×25年确认营业成本=200+600=800（万元），选项D正确。\r\n\r\n对于每一项履约义务，企业只能采用一种方法来确定其履约进度，并加以一贯运用。对于类似情况下的类似履约义务，企业应当采用相同的方法确定履约进度。\r\n\r\n资产负债表日，企业应当在按照合同的交易价格总额乘以履约进度扣除以前会计期间累计已确认的收入后的金额，确认为当期收人。\r\n\r\n$$\r\n\\begin{array} { r }  \\pm \\frac { 1 } { 4 5 } \\sharp \\sharp \\sharp \\sharp \\underline { { \\diamond } } \\wedge \\underline { { \\varrho } } \\wedge \\underline { { \\varrho } } \\wedge \\underline { { \\varrho } } ( \\underline { { \\diamond } } , \\underline { { \\varrho } } ) \\wedge \\underline { { \\varrho } } \\wedge \\underline { { \\varrho } } ( \\underline { { \\diamond } } , \\underline { { \\varrho } } ) \\sharp \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline { { \\diamond } } \\underline 0 ex } { 5 ex } } \\widehat { \\rule { 0 ex } { 5 ex } } \\widehat { \\rule { 0 ex } { 5 ex } } \\widehat { \\rule { 0 ex } { 5 ex } } \\widehat { \\rule { 0 ex } { 5 ex } } \\widehat { \\rule { 0 ex } { 5 ex } } \\mathrm { W } _ { \\mathcal { W } } ^ { \\pm } \\overline { { \\mathfrak { W } } } _ { \\mathcal { B } } \\dag \\widehat { \\xi } \\rVert\r\n$$\r\n\r\n$$\r\n\\downarrow \\downarrow 4 4 \\uparrow 6 \\uparrow \\downarrow \\downarrow \\downarrow \\downarrow \\downarrow \\downarrow \\downarrow = \\downarrow \\downarrow 4 4 \\downarrow 6 \\downarrow \\downarrow \\downarrow \\downarrow \\downarrow \\downarrow \\downarrow \\downarrow \\downarrow - \\downarrow \\downarrow 4 \\downarrow 4 \\downarrow \\downarrow \\downarrow \\downarrow \\downarrow 4 \\downarrow\r\n$$\r\n\r\n当履约进度不能合理确定时，企业已经发生的成本预计能够得到补偿的，应当按照已经发生的成本金额确认收人，直到履约进度能够合理确定为止。每一资产负债表日，企业应当对履约进度进行重新估计。当客观环境发生变化时，企业也需要重新评估履约进度是否发生变化，以确保履约进度能够反映履约情况的变化，该变化应当作为会计估计变更进行会计处理。\r\n\r\n## 3.在某一时点履行的履约义务\r\n\r\n若一项履约义务不属于在某一时段内履行的履约义务，则应当属于在某一时点履行的履约义务。在判断客户是否已取得商品控制权时，企业应当考虑下列迹象：\r\n\r\n（1）企业就该商品享有现时收款权利，即客户就该商品负有现时付款义务。\r\n\r\n（2）企业已将该商品的法定所有权转移给客户，即客户已拥有该商品的法定所有权。\r\n\r\n（3）企业已将该商品实物转移给客户，即客户已实物占有该商品。\r\n\r\n客户占有了某项商品实物并不意味着其就一定取得了该商品的控制权。\r\n\r\n①委托代销安排\r\n\r\n委托代销安排，是指委托方和受托方签订代销合同或协议，委托受托方向终端客户销售商品。在这种安排下，企业（委托方）应当评估受托方在企业向其转让商品时是否已获得对该商品的控制权，如果没有，企业不应在此时确认收入，通常应当在受托方售出商品时确认销售商品收人；受托方应当在商品销售后，按合同或协议约定的方法计算确定的手续费确认收入。\r\n\r\n## 点拨\r\n\r\n受托方获得对商品控制权的，企业应按销售商品进行会计处理，这种安排不属于委托代销安排。\r\n\r\n## ②售后代管商品安排\r\n\r\n售后代管商品安排是指根据企业与客户签订的合同，企业已经就销售的商品向客户收款或取得了收款权利，但是直到在未来某一时点将该商品交付给客户之前，企业仍然继续持有该商品实物。\r\n\r\n在售后代管商品安排下，除了应当考虑客户是否取得商品控制权的迹象之外，还应当同时满足下列四项条件，才表明客户取得了该商品的控制权：一是该安排必须具有商业实质，例如，该安排是应客户的要求而订立的；二是属于客户的商品必须能够单独识别，例如，将属于客户的商品单独存放在指定地点；三是该商品可以随时应客户要求交付给客户；四是企业不能自行使用该商品或将该商品提供给其他客户。\r\n\r\n（4）企业已将该商品所有权上的主要风险和报酬转移给客户，即客户已取得该商品所有权上的主要风险和报酬。\r\n\r\n（5）客户已接受该商品。\r\n\r\n（6）其他表明客户已取得商品控制权的迹象。\r\n\r\n需要强调的是，在上述迹象中，并没有哪一个或哪几个迹象是决定性的，企业应当根据合同条款和交易实质进行分析，综合判断其是否以及何时将商品的控制权转移给客户，从而确定收入确认的时点。此外，企业应当从客户的角度进行评估，而不应当仅考虑企业自身的看法。\r\n\r\n【真题21·多选题】2×24年6月15日，甲公司与乙公司签订铝锭销售合同，约定甲公  \r\n司向乙公司销售铝锭500吨，交付日期为2×24年7月10日，销售结算金额按2×24年7月  \r\n31日大宗商品市场中的铝锭价格确定，2×24年7月10日，甲公司将铝锭运输至乙公司并经  \r\n乙公司验收。2×24年7月28日，乙公司因铝锭质量问题与甲公司沟通，甲公司同意按最终  \r\n结算金额的1.5%提供销售折扣，2×24年7月10日和2×24年7月31日，铝锭的大宗商品  \r\n市场交易价格分别为每吨 20500元和每吨21200元。不考虑其他因素，下列各项关于甲公司  \r\n会计处理的表述中，正确的有（ ）。（2025年回忆版）A．2×24年7月31日确认铝锭销售收人B.将1.5%的销售折扣冲减2×24年度收人C.将2×24年7月10日后因大宗商品市场铝锭价格变动对结算金额的影响计人营业收入D.将销售铝锭产生的应收款项分类为以公允价值计量且其变动计人当期损益的金融资产\r\n\r\n解析对于在某一时点履行的履约义务，企业应当在客户取得相关商品控制权时点确认收入，2×24年7月10日，乙公司已取得商品控制权，甲公司应确认收入，选项A错误；后续因商品质量问题进行的价格调整属于可变对价，销售折扣应冲减收入，选项B正确；与定价挂钩的商品或原材料价值相关的变动（如定价挂钩不受双方控制的商品或原材料价格指数，因指数变动导致的价款变化）不属于可变对价，企业应将其视为合同对价中嵌入一项衍生金融工具进行会计处理，通常应按所挂钩商品或原材料在客户取得相关商品控制权日的价格计算确认收入，客户取得相关商品控制权后上述所挂钩商品或原材料价格后续变动对企业可收取款项的影响，应按照金融工具准则有关规定进行处理，确认收入时的应收账款不能通过合同现金流量测试，应分类为以公允价值计量且其变动计入当期损益的金融资产，日后因大宗商品市场铝锭价格变动对结算金额的影响不能计入营业收入，而应计入公允价值变动损益，选项C错误，选项D正确。\r\n\r\n【例题22·多选题】对于在某一时点履行的履约义务，企业应当在客户取得相关商品控制权时确认收人。在判断客户是否取得商品的控制权时，企业应当考虑的迹象有（ ）。A．客户已接受该商品B.客户已拥有该商品的法定所有权C.客户已取得该商品所有权上的主要风险和报酬D.客户就该商品负有现时付款义务\r\n\r\n（解析）在判断客户是否已取得商品控制权时，企业应当考虑下列迹象：①企业就该商品享有现时收款权利，即客户就该商品负有现时付款义务；②企业已将该商品的法定所有权转移给客户，即客户已拥有该商品的法定所有权；③企业已将该商品实物转移给客户，即客户已实物占有该商品；④企业已将该商品所有权上的主要风险和报酬转移给客户，即客户已取得该商品所有权上的主要风险和报酬；⑤客户已接受该商品等。\r\n\r\n## 三、关于合同资产和合同负债\r\n\r\n## （一）合同负债5年热点丨4次\r\n\r\n合同负债，是指企业已收或应收客户对价而应向客户转让商品的义务。\r\n\r\n企业在向客户转让商品之前，如果客户已经支付了合同对价或企业已经取得了无条件收取合同对价的权利，则企业应当在客户实际支付款项与到期应支付款项敦早时点，将该已收或应收的款项列示为合同负债。\r\n\r\n## 点拨\r\n\r\n尚未向客户履行转让商品的义务而已收或应收客户对价中的增值税部分，因不符合合同负债的定义，不应确认为合同负债。已收价款中的增值税部分在纳税义务尚未发生时通过“应交税费一待转销项税额”科目核算。\r\n\r\n## 问答 合同负债、预收账款和金融负债有何主要区别？\r\n\r\n答：合同负债是指企业已收或应收客户对价而应向客户转让商品的义务，由收入准则规范；预收账款核算的是除收入准则规范的预收款项，如预收租金等，预收账款中含有预收的增值税；金融负债是企业承担的不可避免向其他方交付现金或其他金融资产的义务，由金融工具相关准则规范。\r\n\r\n例如，甲公司经营一家电商平台，平台商家自行负责食品的采购、定价、发货以及售后服务，甲公司仅提供平台供商家与消费者进行交易并负责协助商家和消费者结算货款，甲公司按照货款的8%向商家收取佣金，并判断自己在商品买卖交易中是代理人。2×25年，甲公司向平台的消费者销售了10万张不可退的电子购物卡，每张卡的面值为100元，总额为1000万元，假定不考虑相关税费的影响。\r\n\r\n甲公司确认合同负债=1000×8%=80（万元），确认其他应付款=1000-80=920（万元）。\r\n\r\n## （二）合同资产与应收款项\r\n\r\n<table><tr><td rowspan=1 colspan=1>项目</td><td rowspan=1 colspan=1>定义</td><td rowspan=1 colspan=1>面临风险</td></tr><tr><td rowspan=1 colspan=1>应收款项</td><td rowspan=1 colspan=1>是指企业已向客户转让商品而有权收取对价的权利，且该权利仅取决于时间流逝因素</td><td rowspan=1 colspan=1>信用风险</td></tr><tr><td rowspan=1 colspan=1>合同资产</td><td rowspan=1 colspan=1>是指企业已向客户转让商品而有权收取对价的权利，且该权利取决于时间流逝之外的其他因素</td><td rowspan=1 colspan=1>信用风险和履约风险</td></tr></table>\r\n\r\n## 提示\r\n\r\n（1）合同资产减值的计量、列报和披露应当按照金融工具相关准则的要求进行会计处理。合同资产发生减值的，应当记入“资产减值损失”科目。\r\n\r\n（2）虽然企业有可能需要在未来返还全部或部分的合同对价（例如，企业在附有销售退回条款的合同下收取的合同对价），但是企业仍然拥有无条件收取合同对价的权利，未来返还合同对价的义务并不会影响企业收取对价总额的现时权利，因此，企业仍应当确认一项应收款项，同时将预计未来需要返还的部分确认为一项负债。\r\n\r\n（3）合同资产和合同负债应当在资产负债表中单独列示，并按流动性分别列示为“合同资产”或“其他非流动资产”以及“合同负债”或“其他非流动负债”。同一合同下的合同资产和合同负债应当以净额列示，不同合同下的合同资产和合同负债不能相互抵销。\r\n\r\n## 四、关于合同成本\r\n\r\n考点难度●●○中\r\n\r\n## （一）合同履约成本\r\n\r\n企业为履行合同发生的成本，不属于其他企业会计准则规范范围且同时满足下列条件的，应当作为合同履约成本确认为一项资产：\r\n\r\n（1）该成本与一份当前或预期取得的合同直接相关，包括直接人工、直接材料、制造费用（或类似费用）、明确由客户承担的成本以及仅因该合同而发生的其他成本；\r\n\r\n（2）该成本增加了企业未来用于履行（或持续履行）履约义务的资源；\r\n\r\n（3）该成本预期能够收回。\r\n\r\n## 点拨 其他会计准则：如《存货》《固定资产》《无形资产》等。\r\n\r\n①存货成本通过“生产成本”“开发成本”等科目核算；\r\n\r\n②固定资产成本通过“在建工程”科目核算；\r\n\r\n③无形资产成本通过“研发支出”科目核算。\r\n\r\n企业应当在下列支出发生时，将其计人当期损益：\r\n\r\n（1）管理费用，除非这些费用明确由客户承担；\r\n\r\n（2）非正常消耗的直接材料、直接人工和制造费用（或类似费用），这些支出为履行合同发生，但未反映在合同价格中；\r\n\r\n（3）与履约义务中已履行部分相关的支出；\r\n\r\n（4）无法在尚未履行的与已履行的履约义务之间区分的相关支出。\r\n\r\n## 提示\r\n\r\n对于企业在一段时间内履行的履约义务，在采用产出法计量履约进度时，如果企业为履行该履约义务实际发生的成本超过了按照产出法确定的成本。这些成本是与过去已履行的履约情况相关的支出，因此，不会增加企业未来用于履行（包括持续履行）履约义务的资源，不应当作为资产确认。\r\n\r\n## （二）合同取得成本5年热点丨4次\r\n\r\n企业为取得合同发生的增量成本预期能够收回的，应当作为合同取得成本确认为一项资产；但是该资产摊销期限不超过一年的，可以在发生时计人当期损益。\r\n\r\n增量成本，是指企业不取得合同就不会发生的成本。\r\n\r\n## 点拨\r\n\r\n为取得合同发生的销售佣金属于增量成本，企业因现有合同续约或发生合同变更需要支付的额外佣金也属于增量成本。\r\n\r\n企业为取得合同发生的、除预期能够收回的增量成本之外的其他支出（如无论是否取得合同均会发生的差旅费等），应当在发生时计人当期损益，但是明确由客户承担的除外。\r\n\r\n合同取得成本的相关会计处理：\r\n\r\n<table><tr><td rowspan=1 colspan=1>项目</td><td rowspan=1 colspan=1>会计处理</td></tr><tr><td rowspan=1 colspan=1>（1）取得合同时发生的增量成本</td><td rowspan=1 colspan=1>借：合同取得成本贷：其他应付款应付职工薪酬等</td></tr><tr><td rowspan=1 colspan=1>（2）合同取得成本摊销时</td><td rowspan=1 colspan=1>借：销售费用贷：合同取得成本</td></tr></table>\r\n\r\n【真题23·单选题】甲公司为了拓展业务赢得客户订单发生的下列各项支出中，属于为取得合同而发生的增量成本的是（ ）。（2023年）A．根据订立合同金额的5%向代理商支付的代理费B.为参与客户招标而准备投标资料发生的支出C.投标过程中聘请外部律师发生的支出D.根据年度订单数量及个人综合表现考评确定的销售人员年度奖金\r\n\r\n（解析）选项A，订立合同支付的代理费属于为取得合同发生的增量成本；选项B和C，聘请外部律师发生的支出、准备招投标资料发生的支出，无论是否取得合同都会发生，不属于为取得合同发生的增量成本，应计入当期损益；选项D，根据销售人员的订单数量及个人表现给予的年度奖金，不是为取得合同发生的增量成本。\r\n\r\n【例题24：单选题】不考虑其他因素，下列各项企业发生的交易或事项中，应确认为合同履约成本的是（ ）。A．支付给销售人员基于订立合同金额确定的销售佣金10万元B．对已销售的商品计提保证类质保20万元C.通过电商平台自主销售商品并按销售额的0.5%向电商平台支付平台使用费D.为履行与客户定制开发产品的合同而发生的自制专用模具支出25万元\r\n\r\n解析选项A，应确认合同取得成本；选项B，应确认主营业务成本和预计负债；选项C，应确认销售费用；选项D，应确认为合同履约成本。\r\n\r\n【例题25·多选题】甲公司是一家房地产开发企业，甲公司委托乙公司进行房地产销售，  \r\n并约定每签订一份销售合同，甲公司按照合同价款的10%向乙公司支付销售佣金。2×25年8  \r\n月，甲公司签订的销售合同价款总计6000万元，其中2000万元所对应的房屋于2×25年12  \r\n月交付给客户，剩余4000万元所对应的房屋预计将在2×26年12月交付客户。截至2×25  \r\n年12月31日，佣金尚未支付给乙公司。下列各项关于甲公司2×25年度佣金会计处理的表述  \r\n中，正确的有（A．确认应付乙公司的款项600万元B.2×25年12月31日的合同取得成本余额为600万元\r\n\r\n例（真）题-答案丨 23.A 24.D\r\n\r\nC.确认销售费用200万元D.确认营业成本600万元\r\n\r\n解析双方约定每签订一份销售合同，甲公司按照合同价款的10%向乙公司支付销售佣金，因此，应确认应付款项金额=6000×10%=600（万元），选项A正确；合同价款6000万元中，2000万元于2×25年确认收入，因此，应支付乙公司的销售佣金600万元中有200万元（600×2000/6000）应确认为销售费用，400万元（600×4000/6000）体现在2×25年12月31日合同取得成本的余额中，选项C正确，选项B和D不正确。\r\n\r\n【例题26·多选题】下列各项中，不应作为合同履约成本确认为合同资产的有（ ）。A.为取得合同发生但预期能够收回的增量成本B.为组织和管理企业生产经营发生的但非由客户承担的管理费用C.无法在尚未履行的与已履行（或已部分履行）的履约义务之间区分的支出D.为履行合同发生的非正常消耗的直接材料、直接人工和制造费用\r\n\r\n解析选项A，为取得合同发生但预期能够收回的增量成本应作为合同取得成本确认为一项资产；选项B、C和D，应当计入当期损益，不计入合同履约成本。\r\n\r\n（三）与合同履约成本和合同取得成本有关的资产的摊销和减值\r\n\r\n## 1.摊销\r\n\r\n对于确认为资产的合同履约成本和合同取得成本，企业应当采用与该资产相关的商品收入确认相同的基础（即，在履约义务履行的时点或按照履约义务的履约进度）进行摊销，计入当期损益。\r\n\r\n## 2.减值\r\n\r\n合同履约成本和合同取得成本的账面价值高于下列两项的差额的，超出部分应当计提减值准备，并确认为资产减值损失：\r\n\r\n（1）企业因转让与该资产相关的商品预期能够取得的剩余对价；\r\n\r\n（2）为转让该相关商品估计将要发生的成本。\r\n\r\n以前期间减值的因素之后发生变化，使得上述中（1）减（2）的差额高于该资产账面价值的，应当转回原已计提的资产减值准备，并计人当期损益，但转回后的资产账面价值不应超过假定不计提减值准备情况下该资产在转回日的账面价值。\r\n\r\n点拨 减值计提类似存货章节中“需要经过加工的材料存货”期末减值会计处理。\r\n\r\n在确定合同履约成本和合同取得成本的减值损失时，企业应当首先确定其他资产减值损失；然后，按照本节的要求确定合同履约成本和合同取得成本的减值损失。企业按照资产减值准则测试相关资产组的减值情况时，应当将按照上述规定确定上述资产减值后的新账面价值计入相关资产组的账面价值。\r\n\r\n【例题27·单选题】甲公司有一项至2×25年12月31日尚未完工的与合同成本有关的资  \r\n产，其账面价值为5000万元（含已计提的减值准备300万元），因以前期间减值因素发生变化，  \r\n转让与该资产相关的商品预期能够取得的剩余对价为6000万元，为转让该相关商品估计将要  \r\n发生的成本为600万元。甲公司下列会计处理中正确的是（ ）。A.转回减值准备300万元 B.转回减值准备400万元C．计提减值准备600万元 D.不计提减值准备，也不转回减值准备\r\n\r\n解析）甲公司因转让与该资产相关的商品预期能够取得的剩余对价6000-为转让该相关商品估计将要发生的成本600=5400（万元），高于该资产账面价值5000万元，应当转回原已计提的资产减值准备，并计入当期损益，但转回后的资产账面价值不应超过假定不计提减值准备情况下该资产在转回日的账面价值5300万元（5000+300），因此，应转回减值准备300万元。\r\n\r\n建筑施工企业会计核算图示如下：\r\n\r\n\r\n\r\n## 点拨\r\n\r\n建筑施工企业确认收入时本应借记“合同资产”科目，结算合同价款时本应贷记“合同负债”科目，但因同一合同下的“合同资产”和“合同负债”可以抵销，因此用“合同结算”科目代替“合同资产”和“合同负债”科目。\r\n\r\n问答 施工企业发生合同亏损，预计损失如何进行会计处理？\r\n\r\n答：预计损失为或有事项，适用《企业会计准则第13号一或有事项》，存在标的资产时，应对标的资产进行减值测试并按规定确认减值损失，借记“资产减值损失”科目，贷记“合同履约成本减值准备”科目。如果预计亏损超过减值损失或不存在标的资产的，则应将超过部分确认为预计负债，借记“主营业务成本”科目，贷记“预计负债”科目。\r\n\r\n例（真）题-答案」27.A\r\n\r\n## 五、关于特定交易的会计处理\r\n\r\n## （一）附有销售退回条款的销售\r\n\r\n借：应收账款\r\n\r\n贷：主营业务收入（按照因向客户转让商品而预期有权收取的对价金额）\r\n\r\n预计负债一应付退货款（按照预期因销售退回将退还的金额）\r\n\r\n应交税费一应交增值税（销项税额）\r\n\r\n借：主营业务成本（差额）\r\n\r\n应收退货成本「按照预期将退回商品转让时的账面价值，扣除收回该商品预计发生的成本（包括退回商品的价值减损）后的余额]\r\n\r\n贷：库存商品\r\n\r\n## 点拨\r\n\r\n每一资产负债表日，企业应当重新估计未来销售退回情况，如有变化，应当作为会计估计变更进行会计处理。\r\n\r\n## 提示\r\n\r\n（1）客户以一项商品换取类型、质量、状况及价格均相同的另一项商品，不应被视为退货；\r\n\r\n（2）如果合同约定客户可以将质量有瑕疵的商品退回以换取正常的商品，企业应当按照附有质量保证条款的销售进行会计处理。\r\n\r\n【例题28】甲公司向家具店销售10张餐桌，每张餐桌的价格为1000元，成本为750元。根据合同约定，家具店有权在收到餐桌的30天内退货，但是需要向甲公司支付10%的退货费（即每张餐桌的退货费为100元）。根据历史经验，甲公司预计的退货率为10%，且退货过程中，甲公司预计为每张退货的餐桌发生的成本为50元。假定不考虑相关税费影响。\r\n\r\n分析）甲公司在将餐桌的控制权转移给家具店时的账务处理为：\r\n\r\n借：应收账款\r\n\r\n贷：主营业务收入\r\n\r\n贷：库存商品\r\n\r\n7500\r\n\r\n【例题29】乙公司与客户签订合同，向其销售A产品。客户在合同开始日即取得了A产品的控制权，并在90天内有权退货。由于A产品是最新推出的产品，乙公司尚无有关该产品退货率的历史数据，也没有其他可以参考的市场信息。该合同对价为12100元，根据合同约定，客户应于合同开始日后的第二年年末付款。A产品在合同开始日的现销价格为10000元。A产品的成本为8000元。退货期满后，未发生退货。假定不考虑相关税费影响。\r\n\r\n分析 本例中，客户有退货权，因此，该合同的对价是可变的。由于乙公司缺乏有关退货情况的历史数据，考虑将可变对价计入交易价格的限制要求，在合同开始日不能将可变对价计入交易价格，因此，乙公司在A产品控制权转移时确认的收入为0，其应当在退货期满后，根据实际退货情况，按照预期有权收取的对价金额确定交易价格。此外，考虑到A产品控制权转移与客户付款之间的时间间隔以及该合同对价与A产品现销价格之间的差异等因素，乙公司认为该合同存在重大融资成分。乙公司的账务处理如下：\r\n\r\n（1）在合同开始日，乙公司将A产品的控制权转移给客户。\r\n\r\n借：应收退货成本\r\n\r\n8000\r\n\r\n贷：库存商品\r\n\r\n8000\r\n\r\n（2）在90天的退货期内，乙公司尚未确认合同资产和应收款项，因此，无需确认重大融资成分的影响。\r\n\r\n（3）退货期满日（假定应收款项在合同开始日和退货期满日的公允价值无重大差异）。\r\n\r\n借：长期应收款 12100\r\n\r\n贷：主营业务收入 10000\r\n\r\n未实现融资收益 2100\r\n\r\n借：主营业务成本 8000\r\n\r\n贷：应收退货成本 8000\r\n\r\n在后续期间，乙公司应当考虑在剩余合同期限内确定实际利率，将上述长期应收款科目的金额与现销价格之间的差额（2100元）按照实际利率法进行摊销，确认相关的利息收入。此外，乙公司还应当按照金融工具相关会计准则评估上述应收款项是否发生减值，并进行相应的会计处理。\r\n\r\n## （二）附有质量保证条款的销售\r\n\r\n\r\n\r\n对于附有质量保证条款的销售，企业应当评估该质量保证是否在向客户保证所销售商品符合既定标准之外提供了一项单独的服务。企业提供额外服务的（服务类质量保证），应当作为单项履约义务，按照收人准则规定进行会计处理；否则，质量保证责任（保证类质量保证）应当按照《企业会计准则第13号- -或有事项》规定进行会计处理。\r\n\r\n在评估质量保证是否在向客户保证所销售商品符合既定标准之外提供了一项单独的服务时，企业应当考虑该质量保证是否为法定要求、质量保证期限以及企业承诺履行任务的性质等因素。客户能够选择单独购买质量保证的，该质量保证构成单项履约义务。\r\n\r\n【例题30】甲公司是电脑制造商和销售商，与乙公司签订了销售一批电脑的合同，合同约定：电脑销售价款为98万元，同时提供“延长保修”服务，即从法定质保90天到期之后的三年内甲公司将对任何损坏的部件进行保修或更换。该批电脑和“延长保修”服务各自的单独售价分别为90万元和10万元。该批电脑的成本为60万元。基于其自身经验，甲公司估计维修在法定质保的90天保修期内出现损坏的部件将花费1万元。假设不考虑相关税费。\r\n\r\n## 分析 甲公司会计处理如下：\r\n\r\n借：银行存款\r\n\r\n贷：主营业务收入\r\n\r\n$$\r\n8 8 . 2 \\ \\left[ \\ 9 8 \\times 9 0 / \\ \\left( \\ 9 0 + 1 0 \\ \\right) \\right]\r\n$$\r\n\r\n合同负债\r\n\r\n$$\r\n9 . 8 \\ \\left[ \\ 9 8 \\times 1 0 / \\ \\left( \\ 9 0 \\div 1 0 \\ \\right) \\right]\r\n$$\r\n\r\n借：主营业务成本\r\n\r\n贷：库存商品\r\n\r\n借：主营业务成本\r\n\r\n贷：预计负债\r\n\r\n## （三）主要责任人和代理人\r\n\r\n企业应当根据其在向客户转让商品前是否拥有对该商品的控制权，来判断其从事交易时的身份是主要责任人还是代理人。企业在向客户转让商品前能够控制该商品的，该企业为主要责任人，应当按照已收或应收对价总额确认收入；否则，该企业为代理人，应当按照预期有权收取的佣金或手续费的金额确认收人，该金额应当按照已收或应收对价总额扣除应支付给其他相关方的价款后的净额，或者按照既定的佣金金额或比例等确定。企业与客户订立的包含多项可明确区分商品的合同中，企业需要分别判断其在不同履约义务中的身份是主要责任人还是代理人。\r\n\r\n\r\n\r\n（1）判断原则：转让商品前控制该商品的是主要责任人，否则为代理人。\r\n\r\n（2）主要责任人按总额确认收入；代理人按净额确认收入。\r\n\r\n当存在第三方参与企业向客户提供商品时,企业向客户转让特定商品之前能够控制该商品，从而应当作为主要责任人的情形包括：\r\n\r\n（1）企业自第三方取得商品或其他资产控制权后，再转让给客户；\r\n\r\n（2）企业能够主导第三方代表本企业向客户提供服务；\r\n\r\n（3）企业自第三方取得商品控制权后，通过提供重大的服务将该商品与其他商品整合成某组合产出转让给客户。\r\n\r\n如果企业仅仅是在特定商品的法定所有权转移给客户之前，暂时性地获得该特定商品的法定所有权，这并不意味着企业一定控制了该商品。实务中，企业在判断其在向客户转让特定商品之前是否已经拥有对该商品的控制权时，不应仅局限于合同的法律形式，而应当综合考虑所有相关事实和情况进行判断，这些事实和情况包括：\r\n\r\n（1）企业承担向客户转让商品的主要责任。企业在判断其是否承担向客户转让商品的主要责任时，应当从客户的角度进行评估，即客户认为哪一方承担了主要责任，例如客户认为谁对商品的质量或性能负责、谁负责提供售后服务、谁负责解决客户投诉等。\r\n\r\n（2）企业在转让商品之前或之后承担了该商品的存货风险。其中，存货风险主要是指存货可能发生减值、损毁或灭失等形成的损失。例如，如果企业在与客户订立合同之前已经购买或者承诺将自行购买特定商品，这可能表明企业在将该特定商品转让给客户之前，承担了该特定商品的存货风险，企业有能力主导特定商品的使用并从中取得几乎全部的经济利益；又如，在附有销售退回条款的销售中，企业将商品销售给客户之后，客户有权要求向该企业退货，这可能表明企业在转让商品之后仍然承担了该商品的存货风险。\r\n\r\n（3）企业有权自主决定所交易商品的价格。企业有权决定客户为取得特定商品所需支付的价格，可能表明企业有能力主导有关商品的使用并从中获得几乎全部的经济利益。然而，在某些情况下，代理人可能在一定程度上也拥有定价权（例如，在主要责任人规定的某一价格范围内决定价格），以便其在代表主要责任人向客户提供商品时，能够吸引更多的客户，从而赚取更多的收入。\r\n\r\n此时，即使代理人有一定的定价能力，也并不表明在与最终客户的交易中其身份是主要责任人，代理人只是放弃了一部分自己应当赚取的佣金或手续费而已。\r\n\r\n## （4）其他相关事实和情况。\r\n\r\n需要强调的是，企业在判断其是主要责任人还是代理人时，应当以该企业在特定商品转让给客户之前是否能够控制这些商品为原则。上述相关事实和情况不能凌驾于控制权的判断之上，也不构成一项单独或额外的评估，而只是帮助企业在难以评估特定商品转让给客户之前是否能够控制这些商品的情况下进行相关判断。\r\n\r\n此外，这些事实和情况并无权重之分，也不能被孤立地用于支持某一结论。企业应当根据相关商品的性质、合同条款的约定以及其他具体情况，综合进行判断。\r\n\r\n【例题31】甲公司与乙公司签订合同，向其销售一台特种设备，并商定了该设备的具体规格和销售价格，甲公司负责按照约定的规格设计该设备，并按双方商定的销售价格向乙公司开具发票。该特种设备的设计和制造高度相关。为履行该合同，甲公司与其供应商丙公司签订合同，委托丙公司按照其设计方案制造该设备，并安排丙公司直接向乙公司交付设备。丙公司将设备交付给乙公司后，甲公司按与丙公司约定的价格向丙公司支付制造设备的对价；丙公司负责设备质量问题，甲公司负责设备由于设计原因导致的问题。\r\n\r\n分析本例中，甲公司向乙公司提供的特定商品是其设计的特种设备。虽然甲公司将设备的制造工作分包给丙公司进行，但是，甲公司认为该设备的设计和制造高度相关，不能明确区分，应当作为单项履约义务。由于甲公司负责该合同的整体管理，如果在设备制造过程中发现需要对设备规格作出任何调整，甲公司需要负责制定相关的修订方案，通知丙公司进行相关调整，并确保任何调整均符合修订后的规格要求。甲公司主导了丙公司的制造服务，并通过必要的重大整合服务，将其整合作为向乙公司转让的组合产出（特种设备）的一部分，在该特种设备转让给客户前控制了该特种设备。因此，甲公司在该交易中的身份为主要责任人。\r\n\r\n## （四）附有客户额外购买选择权的销售 5年热点丨3次\r\n\r\n对于附有客户额外购买选择权的销售，企业应当评估该选择权是否向客户提供了一项重大权利。企业提供重大权利的，应当作为单项履约义务，按照相关规定将交易价格分摊至该履约义务，在客户未来行使购买选择权取得相关商品控制权时，或者该选择权失效时，确认相应的收人。客户额外购买选择权的单独售价无法直接观察的，企业应当综合考虑客户行使和不行使该选择权所能获得的折扣的差异、客户行使该选择权的可能性等全部相关信息后，予以合理估计。\r\n\r\n## 点拨\r\n\r\n（1）企业向客户提供重大权利的，应当作为单项履约义务，将交易价格分摊至该单项履约义务；\r\n\r\n（2）企业未向客户提供重大权利的，无须分摊交易价格，只有在客户行使选择权购买额外的商品时才需要进行相应的会计处理。\r\n\r\n【例题32】甲公司签订合同，以100元的价格销售产品A，并且在合同中约定，如果客户在未来30天内额外购买任何产品，在限额100元的范围内，可以享受6折优惠。此外，作为其季度促销的一部分，甲公司打算在未来30天内对所有销售实行9折优惠。取得6折优惠的客户不能同时享受9折优惠。所有客户未来30天都是享受9折优惠。假定甲公司估计客户兑现折扣券的可能性为80%，且每位客户将平均购买50元的额外产品。\r\n\r\n分析折扣券的单独售价=50×增量折扣30%×80%=12（元）。\r\n\r\n分摊后的交易价格：\r\n\r\n产品A=100÷112×100=89.29（元）；\r\n\r\n折扣券=12÷112×100=10.71（元）。\r\n\r\n借：银行存款\r\n\r\n贷：主营业务收入\r\n\r\n合同负债 10.71\r\n\r\n## 提示\r\n\r\n（1）客户虽然有额外购买商品选择权，但客户行使该选择权购买商品时的价格反映了这些商品单独售价的，不应被视为企业向该客户提供了一项重大权利。\r\n\r\n（2）为简化实务操作，当客户行使该权利购买的额外商品与原合同下购买的商品类似，且企业将按照原合同条款提供该额外的商品时，例如，企业向客户提供续约选择权，企业可以无须估计该选择权的单独售价，而是直接把其预计将提供的额外商品的数量以及预计将收取的相应对价金额纳入原合同，并进行相应的会计处理。\r\n\r\n【例题33】甲公司与客户签订为期一年的合同，以每件1000元的价格向客户销售A产品，数量不限，客户可以选择在合同到期时以与原合同相同的条款续约一年。这款产品通常每年提价20%，但行使续约选择权的客户可以按原合同价格（低于当年的市场价格）购买A产品。\r\n\r\n分析甲公司认为该续约选择权向客户提供了重大权利，且符合简化处理的条件，因此，甲公司可以无须将原合同的交易价格分摊至该续约选择权，而是直接按照每件1000元的价格确认原合同和续约后的合同下销售的A产品收入。\r\n\r\n企业授予客户的奖励积分向其提供了一项额外购买选择权，且构成重大权利时，应当作为一项单独的履约义务。企业需要将销售商品收取的价款在销售商品和奖励积分之间按照单独售价的相对比例进行分摊。\r\n\r\n## （五）授予知识产权许可 5年热点丨3次\r\n\r\n企业向客户授予知识产权许可的，应当按照相关规定评估该知识产权许可是否构成单项履约义务，构成单项履约义务的，应当进一步确定其是在某一时段内履行还是在某一时点履行。\r\n\r\n## 1.授予客户的知识产权许可不构成单项履约义务\r\n\r\n授予客户的知识产权许可不构成单项履约义务的，企业应当将该知识产权许可和所售商品一起作为单项履约义务进行会计处理。\r\n\r\n## 点拨 不构成单项履约义务的情形包括：\r\n\r\n（1）该知识产权许可构成有形商品的组成部分并且对于该商品的正常使用不可或缺；\r\n\r\n（2）客户只有将该知识产权许可和相关服务一起使用才能够从中获益，例如，客户取得授权许可，但是只有通过企业提供的在线服务才能访问相关内容。\r\n\r\n【例题34】甲生物制药公司将其拥有的某合成药的专利权许可证授予乙公司，授权期限为10 年。同时，甲公司承诺为乙公司生产该种药品。除此之外，甲公司不会从事任何与支持该药品相关的活动。该药品的生产流程特殊性极高，没有其他公司能够生产该药品。\r\n\r\n分析）本例中，甲公司向乙公司授予专利权许可，并为其提供生产服务。由于市场上没有其他公司能够生产该药品，客户将无法从该专利权许可中单独获益，因此，该专利权许可和生产服务不可明确区分，应当将其一起作为单项履约义务进行会计处理。\r\n\r\n相反，如果该药品的生产流程特殊性不高，其他公司也能够生产该药品，则该专利权许可和生产服务可明确区分，应当分别作为单项履约义务进行会计处理。\r\n\r\n## 2.授予客户的知识产权许可构成单项履约义务\r\n\r\n企业向客户授予知识产权许可，同时满足下列条件时，应当作为在某一时段内履行的履约义务确认相关收入；否则，应当作为在某一时点履行的履约义务确认相关收人：\r\n\r\n（1）合同要求或客户能够合理预期企业将从事对该项知识产权有重大影响的活动；\r\n\r\n（2）该活动对客户将产生有利或不利影响；\r\n\r\n（3）该活动不会导致向客户转让某项商品。\r\n\r\n## 点拨\r\n\r\n此处某一时段内确认收入属于“客户在企业履约的同时即取得并消耗企业履约所带来的经济利益”这种情形。\r\n\r\n值得注意的是，在判断某项知识产权许可是属于在某一时段内履行的履约义务还是在某一时点履行的履约义务时，企业不应考虑下列因素：一是该许可在时间、地域或使用方面的限制；二是企业就其拥有的知识产权的有效性以及防止未经授权使用该知识产权许可所提供的保证。但是，如果授权许可合同明确限制了客户有权使用知识产权的时间段，则收人确认不应早于相关时间段的起始时点。\r\n\r\n【例题35】甲音乐唱片公司将其拥有的一首经典民歌的版权授予乙公司，并约定乙公司在两年内有权在国内所有商业渠道（包括电视、广播和网络广告等）使用该经典民歌。因提供该版权许可，甲公司每月收取1000元的固定对价。除该版权之外，甲公司无需提供任何其他的商品。该合同不可撤销。\r\n\r\n分析本例中，甲公司除了授予该版权许可外不存在其他履约义务。甲公司并无任何义务从事改变该版权的后续活动，该版权也具有重大的独立功能（即民歌的录音可直接用于播放），乙公司主要通过该重大独立功能获利，而非甲公司的后续活动。因此，合同未要求甲公司从事对该版权许可有重大影响的活动，乙公司对此也没有形成合理预期，甲公司授予该版权许可属于在某一时点履行的履约义务，应在乙公司能够主导该版权的使用并从中获得几乎全部经济利益时，全额确认收入。此外，由于甲公司履约的时间与客户付款时间（两年内每月支付）之间间隔较长，甲公司需要判断该项合同中是否存在重大的融资成分，并进行相应的会计处理。\r\n\r\n【例题36·多选题】2×25年1月1日，甲公司将一项专利技术授权给乙公司使用3年，  \r\n当日将各项技术资料交付乙公司。合同约定，甲公司向乙公司收取固定授权费用，考虑到乙公  \r\n司资金紧张，双方约定分别于每年末收取60万元。该技术为一项成熟的专利技术，甲公司后  \r\n续不会从事对该技术有重大影响的活动。2×27年1月1日，甲公司与乙公司签订补充协议，  \r\n将上述专利技术许可合同延期2年至2×30年1月1日，延长期间收取固定授权费用，分别于  \r\n每年末收取55万元（反映市场价格），假定不考虑货币时间价值、相关税费及其他因素。甲公  \r\n司下列会计处理中正确的有（ ）。A．甲公司向乙公司授予专利技术许可权属于在某一时点履行的履约义务B.甲公司2×25年度应确认收入180万元C.甲公司2×27年度应确认收入110万元D.甲公司2×28年度应确认收人110万元\r\n\r\n（解析）因为甲公司后续不会从事对该技术有重大影响的活动，所以属于在某一时点履行的履约义务，选项A正确；甲公司2×25年度授予专利技术许可权应确认的收入金额=60×3=180（万元），选项B正确；甲公司对其客户授予一段期限内的知识产权使用许可并一次性收取固定特许权使用费后，在原许可期限到期前，甲公司又以市场公允价格与客户就延长知识产权授予期限达成新的约定，前述情况下，客户最早在延长期限开始时（2×28年1月1日）才主导使用该知识产权许可并获得经济利益，因此，甲公司应将延长授予期限视为一项新授权合同，并按照收入准则有关规定在延长期限开始时点（2×28年1月1日）确认延期收入，而非新约定达成时点（2×27年1月1日），甲公司2×28年度应确认收入=55×2=110（万元），选项C错误，选项D正确。\r\n\r\n企业向客户授予知识产权许可，并约定按客户实际销售或使用情况收取特许权使用费的，应当在下列两项孰晚的时点确认收人：一是客户后续销售或使用行为实际发生；二是企业履行相关履约义务。这是估计可变对价的例外规定，该例外规定只有在下列两种情形下才能使用：\r\n\r\n一是特许权使用费仅与知识产权许可相关；\r\n\r\n二是特许权使用费可能与合同中的知识产权许可和其他商品都相关，但是与知识产权许可相关的部分占有主导地位。\r\n\r\n企业使用该例外规定时，应当对特许权使用费整体采用该规定，而不应当将特许权使用费进行分拆。\r\n\r\n如果与授予知识产权许可相关的对价同时包含固定金额和按客户实际销售或使用情况收取的变动金额两部分，则只有后者能采用该例外规定，而前者应当在相关履约义务履行的时点或期间内确认收入。对于不适用该例外规定的特许权使用费，应当按照估计可变对价的一般原则进行处理。\r\n\r\n【例题37】甲公司与客户订立一项针对两项知识产权许可证（许可证A和B）的合同。合同针对许可证A所规定的价格为固定金额600元，而针对许可证B所规定的对价则是客户销售使用许可证B生产的产品的未来销售额的5%，其可变对价为3000元。\r\n\r\n许可证A和B的单独售价分别为1600元和2000元。\r\n\r\n许可证B在合同开始时转让给客户，而许可证A在三个月后转让。假定许可证A和许可证B均属于某一时点履行的履约义务。（计算结果保留整数）\r\n\r\n（分析）合同开始时，甲公司应将分摊至许可证B的333元（2000÷3600×600）确认为收入。在转让许可证A时，甲公司应将分摊至许可证A的267元 $( 1 6 0 0 \\div 3 6 0 0 \\times 6 0 0 )$ 确认为收入。\r\n\r\n假定在第一个月，由客户的首月销售所产生的特许权使用费为400元。\r\n\r\n甲公司应将分摊至许可证B的222元（2000÷3600×400）确认为收入。甲公司应将分摊至许可证A的178元（ $1 6 0 0 \\div 3 6 0 0 \\times 4 0 0 )$ 确认为一项合同负债。\r\n\r\n理由：客户虽已发生后续销售，但分摊至许可证A的特许权使用费的履约义务尚未得到履行。\r\n\r\n【例题 38·多选题】2×25年1月1日，甲公司将一项专利技术授权给丁公司使用2年，  \r\n当日将各项技术资料交付丁公司。合同约定，甲公司向丁公司收取固定授权费用400万元，考  \r\n虑到丁公司资金紧张，双方约定分别于每年末收取200万元。此外，还约定甲公司根据丁公司  \r\n利用该技术生产的产品年度销售收人的1%收取浮动授权费用。该技术为一项成熟的专利技术，  \r\n甲公司后续不会从事对该技术有重大影响的活动，适用的折现率为5%。2×26年1月25日，  \r\n甲公司得知丁公司2×25年度实现销售收入2000万元。甲公司2×25年度财务报表经批准于  \r\n2×26年2月20日对外报出。已知（P/A，5%，2）=1.8594，假定不考虑相关税费及其他因素。  \r\n甲公司下列会计处理中正确的有（ ）。A．甲公司向丁公司授予专利技术许可权属于在某一时段内履行的履约义务B．甲公司向丁公司授予专利技术许可权属于在某一时点履行的履约义务C.甲公司2×25年度授予专利技术许可权应确认的收人是391.88万元D．甲公司2×25年度授予专利技术许可权应确认的收入是371.88万元\r\n\r\n（解析）因为甲公司后续不会从事对该技术有重大影响的活动，所以属于在某一时点履行的履约义务，选项A错误，选项B正确；甲公司2×25年度授予专利技术许可权应确认的收入金额 $= 2 0 0 \\times 1 . 8 5 9 4 + 2 0 0 0 \\times 1 \\% = 3 9 1 . 8 8 ( \\mathcal { D } \\hat { \\pi } )$ ，选项C正确，选项D错误。\r\n\r\n## （六）售后回购\r\n\r\n对于售后回购交易，企业应当区分下列两种情形分别进行会计处理：\r\n\r\n1.企业因存在与客户的远期安排而负有回购义务或企业享有回购权利的，表明客户在销售时点并未取得相关商品控制权，企业应当作为租赁交易或融资交易进行相应的会计处理。其中，回购价格低于原售价的，应当视为租赁交易，按照租赁相关准则进行会计处理；回购价格不低于原售价的，应当视为融资交易，在收到客户款项时确认金融负债，并将该款项和回购价格的差额在回购期间内确认为利息费用等。企业到期未行使回购权利的，应当在该回购权利到期时终止确认金融负债，同时确认收入。\r\n\r\n判断流程如图所示：\r\n\r\n\r\n\r\n【例题39·单选题】2×25年2月16日，甲公司以500万元的价格向乙公司销售一台设  \r\n备。双方约定1年以后甲公司有义务以600万元的价格从乙公司处回购该设备。对于上述交易，  \r\n不考虑增值税及其他因素，甲公司正确的会计处理方法是（ ）。A.作为融资交易进行会计处理B.作为租赁交易进行会计处理C.作为附有销售退回条款的销售交易进行会计处理D.分别作为销售和购买进行会计处理\r\n\r\n解析甲公司销售商品的同时约定甲公司未来期间回购，且回购价高于原售价，应作为融资交易进行会计处理。\r\n\r\n2.企业负有应客户要求回购商品义务的，应当在合同开始日评估客户是否具有行使该要求权的重大经济动因，客户具有行使该要求权重大经济动因的，企业应当将售后回购作为租赁交易或融资交易，按照上述第1种情形进行会计处理；否则，企业应当将其作为附有销售退回条款的销售交易进行会计处理。\r\n\r\n在判断客户是否具有行权的重大经济动因时，企业应当综合考虑各种相关因素，包括回购价格与预计回购时市场价格之间的比较，以及权利的到期日等。例如，如果回购价格明显高于该资产回购时的市场价值，则表明客户有行权的重大经济动因。\r\n\r\n判断流程如图所示：\r\n\r\n\r\n\r\n例（真）题-答案」39.A\r\n\r\n【真题40·多选题】2×20年1月1日，甲公司与乙公司签订合同，将一批闲置设备出售  \r\n给乙公司，已办理了设备移交手续。该批设备的账面原价为1000万元，已计提折旧700万元，  \r\n出售价格400万元已收存银行，用于补充甲公司流动资金；同时，合同约定，乙公司有权要求  \r\n甲公司于2×22年1月1日以440万元的价格回购该批设备。甲公司预计回购时点该批设备的  \r\n市场价格将远低于440万元。不考虑相关税费及其他因素，下列各项关于甲公司会计处理的表  \r\n述中，正确的有（）。（2022年）A．该交易应作为租赁交易进行会计处理B.收到的出售设备款项400万元应确认为负债C．2×20年1月1日应确认出售设备的资产处置损益D.回购价格与出售价格的差额，应在2×20年1月1日至2×22年1月1日期间分期确认利息费用\r\n\r\n（解析）由于乙公司有重大的经济动因要求甲公司回购该批设备，且回购价440 万元高于原售价400万元，甲公司应将该交易作为融资交易进行会计处理，选项A不正确；由于乙公司有重大的经济动因要求甲公司回购该批设备，该批设备的控制权未转移，甲公司不应就该批设备确认处置损益，选项C不正确。\r\n\r\n## （七）客户未行使的权利\r\n\r\n企业向客户预收销售商品款项的，应当首先将该款项确认为合同负债，待履行了相关履约义务时再转为收入。当企业预收款项无须退回，且客户可能会放弃其全部或部分合同权利时，例如，放弃储值卡的使用等，企业预期将有权获得与客户所放弃的合同权利相关的金额的，应当按照客户行使合同权利的模式按比例将上述金额确认为收入；否则，企业只有在客户要求其履行剩余履约义务的可能性极低时，才能将上述负债的相关余额转为收人。\r\n\r\n企业在确定其是否预期将有权获得与客户所放弃的合同权利相关的金额时，应当考虑将估计的可变对价计人交易价格的限制要求。\r\n\r\n如果有相关法律规定，企业所收取的与客户未行使权利相关的款项须转交给其他方的（例如，法律规定无人认领的财产需上交政府），企业不应将其确认为收人。\r\n\r\n<table><tr><td rowspan=3 colspan=1>客户未行使的权利</td><td rowspan=1 colspan=1>预期将有权获得</td><td rowspan=1 colspan=1>按照客户行使合同权利的模式按比例确认收入</td></tr><tr><td rowspan=1 colspan=1>预期无权获得</td><td rowspan=1 colspan=1>在客户要求其履行剩余履约义务的可能性极低时确认收入</td></tr><tr><td rowspan=1 colspan=1>相关法律规定须转交给其他方</td><td rowspan=1 colspan=1>不应确认收入</td></tr></table>\r\n\r\n【例题41】甲公司经营连锁面包店。2×25年，甲公司向客户销售了5000张储值卡，每张卡的面值为200元，总额为1000000元。客户可在甲公司经营的任何一家门店使用该储值卡进行消费。根据历史经验，甲公司预期客户购买的储值卡中将有大约相当于储值卡面值金额5%（即50000元）的部分不会被消费。截至2×25年12月31日，客户使用该储值卡消费的金额为400000元。甲公司为增值税一般纳税人，适用的增值税税率为13%，在客户使用该储值卡消费时发生增值税纳税义务。（计算结果保留整数）\r\n\r\n分析）本例中，甲公司预期将有权获得与客户未行使的合同权利相关的金额为 50000元，该金额应当按照客户行使合同权利的模式按比例确认为收入。因此，甲公司在2×25年销售的储值卡应当确认的收入金额为372613元[（400000+50000×400000÷950000）÷（1+13%）]，应确认的增值税销项税额=400000÷（1+13%）×13%=46018（元）。\r\n\r\n甲公司的账务处理为：\r\n\r\n（1）销售储值卡：\r\n\r\n借：银行存款 1000000 贷：合同负债 884956[1000000÷（1+13%）] 应交税费一待转销项税额 115044\r\n\r\n（2）根据储值卡的消费金额确认收入，同时将对应的待转销项税额确认为销项税额：  \r\n借：合同负债 372613  \r\n应交税费一待转销项税额 46018  \r\n贷：主营业务收入 372613  \r\n应交税费一应交增值税（销项税额） 46018\r\n\r\n## （八）无须退回的初始费\r\n\r\n\r\n\r\n1.如果该初始费与合同中已承诺的某项商品相关，企业应判断其是否构成单项履约义务：\r\n\r\n（1）该商品构成单项履约义务，在转让该相关商品时按照分摊至该商品的交易价格确认收入；\r\n\r\n（2）该商品不构成单项履约义务，企业应在包含该商品的单项履约义务履行时，按照分摊至该单项履约义务的交易价格确认收入。\r\n\r\n2．如果该无须退回的初始费与合同中承诺的商品不相关，该初始费应当作为未来将转让商品的预收款，在未来转让该商品时确认为收人。\r\n\r\n## 提示\r\n\r\n企业为该初始活动发生的支出应当按照本节合同成本部分的要求确认为一项资产或计入当期损益。\r\n\r\n【例题42·单选题】甲公司经营一家会员制健身俱乐部，甲公司与客户签订了为期2年的  \r\n合同，客户人会之后可以随时在该俱乐部健身。除俱乐部2年的年费2000元之外，甲公司还  \r\n向客户收取了100元的人会费，用于
