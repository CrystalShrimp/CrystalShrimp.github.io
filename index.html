\r\n## 二、保险合同会计处理的总体要求\r\n\r\n考点难度●○○易\r\n\r\n企业应当评估各单项合同的保险风险是否重大，并据此判断该合同是否为保险合同。\r\n\r\n在评估时，企业应当考虑其实质性权利义务，这些权利义务可能源于合同，也可能源于法律法规，但企业应忽略合同中无商业实质的条款。企业应当对保险合同进行分组，将合同组作为计量单元，并在将具有相似风险且统一管理的保险合同归为同一保险合同组合后进行分组确认和计量。\r\n\r\n企业应当在责任期开始日、保单持有人首付款到期日（在保险合同未约定首付款到期日时，则为企业实际收到首付款的日期）、发生亏损时这三个时点中的最早时点确认其签发的合同组。\r\n\r\n除适用简化处理规定的合同组外，保险合同负债的一般计量方法应当包含以下组成要素：一是履约现金流量，包括与履行保险合同直接相关的未来现金流量的估计、货币时间价值及金融风险调整、非金融风险调整；二是合同服务边际，即企业因在未来提供保险合同服务而将于未来确认的未赚利润。除保险合同负债的一般计量方法外，保险合同还有其他特殊的计量方法，如对具有直接参与分红特征的保险合同组采用浮动收费法，对符合一定条件（如责任期不超过1年）的保险合同组简化采用保费分配法等。\r\n\r\n企业在履行保险合同过程中，应当随保险合同履约义务的履行逐期确认收人和费用。企业因当期提供保险合同服务导致未到期责任负债账面价值的减少额，应当确认为保险服务收入；因当期发生赔案及其他相关费用导致已发生赔款负债账面价值的增加额，以及与之相关的履约现金流量的后续变动额，应当确认为保险服务费用。未到期责任负债账面价值中分摊至亏损部分的金额不得计人当期保险服务收人。企业在确认保险服务收人和保险服务费用时，不得包含保险合同中的投资成分。\r\n\r\n## 三、其他类型的合同\r\n\r\n考点难度●0○易\r\n\r\n除保险合同和再保险合同外，其他类型的合同也有可能按照保险合同的规定进行会计处理。\r\n\r\n## （一）财务担保合同\r\n\r\n财务担保合同，是指当特定债务人到期不能按照最初或修改后的债务工具条款偿付债务时，要求发行方向蒙受损失的合同持有人赔付特定金额的合同。财务担保合同的发行方可以作出如下会计政策选择：（1）企业明确表明将此类合同视作保险合同，并且之前已按照保险合同相关会计准则进行会计处理的，可以选择适用保险合同或金融工具的相关规定。该选择应当基于单项合同，选择一经作出，不得撤销。（2）其他情形下，财务担保合同适用金融工具的规定进行会计处理。\r\n\r\n## （二）以固定收费方式提供服务的合同\r\n\r\n符合保险合同定义但主要以固定收费方式提供服务的合同同时符合下列三个条件时，企业可以选择对其签发的此类合同适用《企业会计准则第14号——收人》或保险合同的规定，该选择应当基于单项合同，选择一经作出，不得撤销。这些条件包括：（1）合同定价不反映对单个保单持有人的风险评估；（2）合同通过提供服务而非支付现金补偿保单持有人；（3）合同转移的保险风险主要源于保单持有人对服务的使用而非服务成本的不确定性。当无法同时符合上述三个条件时，该合同应适用保险合同的规定。\r\n\r\n## （三）赔偿仅限于保单持有人支付义务的合同\r\n\r\n符合保险合同定义但对保险事项的赔偿金额仅限于清算保单持有人因该合同而产生的支付义务的合同，企业可以选择适用金融工具或保险合同的规定。该选择应当基于保险合同组合，选择一经作出，不得撤销。\r\n\r\n## （四）具有相机参与分红特征的投资合同\r\n\r\n具有相机参与分红特征的投资合同，是指赋予特定投资者合同权利以收取保证金额和附加金额的金融工具。\r\n\r\n具有相机参与分红特征的投资合同属于金融工具，可以为投资者提供收取附加金额的合同利益，该附加金额是对保证金额的补充。由于这些合同不转移重大保险风险，因此不符合保险合同的定义。但是，由于具有相机参与分红特征的投资合同通常与一些保险合同共享基础项目，且具有相机参与分红特征的投资合同的条款与一些保险合同条款类似，因此，如果签发保险合同的企业同时签发具有相机参与分红特征的投资合同，则该类投资合同应当在合同签发人成为合同一方时初始确认并适用保险合同计量的特殊规定，不得适用金融工具的相关规定。不签发保险合同的企业签发的具有相机参与分红特征的投资合同，应当适用金融工具的相关规定。"}],"quizGroups":[{"type":"多项选择题","questions":[{"num":1,"text":"下列各项中不属于金融负债的有（ ）。","options":[{"letter":"A","text":"企业收到的合同价款中，分摊至奖励积分的部分"},{"letter":"B","text":"预提产品质量保证费用形成的预计负债"},{"letter":"C","text":"以公允价值计量且其变动计入当期损益的金融负债"},{"letter":"D","text":"应交所得税"}],"answer":"ABD","explanation":"选项A，属于收入准则规范的合同负债；选项B，属于或有事项准则规范的预计负债；\n选项D，应交所得税不涉及合同，非合同的负债不属于金融工具中的金融负债。"},{"num":2,"text":"甲公司及其子公司持有多项金融资产，下列关于评估管理金融资产业务模式的表述中，正确的有（ ）。","options":[{"letter":"A","text":"甲公司及其子公司应当根据实际情况确定其管理金融资产的业务模式，对于同一金融资产组合，集团和子公司对其管理该组合的业务模式的判断通常一致"},{"letter":"B","text":"甲公司应以关键管理人员决定的特定业务目标为基础，确定管理金融资产的业务模式"},{"letter":"C","text":"甲公司在某些压力情况下可能会将金融资产出售，因此判断其业务模式并非收取合同现金流量为目标"},{"letter":"D","text":"贴现不符合终止确认条件的应收票据组合，应分类为以摊余成本计量的金融资产"}],"answer":"ABD","explanation":"即使企业在金融资产的信用风险增加时为减少因信用恶化所导致的潜在信用损失而\n借：银行存款 970\n继续涉人资产 50\n坏账准备 60\n贷：应收账款 1000\n继续涉人负债 53\n投资收益 27\n将其出售，或在某些压力情况下可能会将金融资产出售，金融资产的业务模式仍然可能是以收取合同现金流量为目标的业务模式，选项C错误。"},{"num":3,"text":"下列各项中，不符合本金加利息的合同现金流量特征的有（ ）。","options":[{"letter":"A","text":"甲公司持有一项可转换成固定数量的发行人权益工具的债券"},{"letter":"B","text":"随着使用特定收费公路的车辆数目增多，借款合同的利息将增加"},{"letter":"C","text":"乙银行有一项贷款，该贷款的利息支付金额与涉及债务人业绩的一些变量（如债务人的净收益）挂钩或者与权益指数挂钩"},{"letter":"D","text":"利率为“贷款市场报价利率+100基点”的贷款"}],"answer":"ABC","explanation":"选项A，因为其回报与发行人的权益价值挂钩，则该债券不符合本金加利息的合同现金流量特征；选项B，此合同产生了与基本借贷安排无关的合同现金流量风险敞口，因此该金融资产不符合本金加利息的合同现金流量特征；选项C，利息支付金额与涉及债务人业绩的一些变量（如债务人的净收益）挂钩或者与权益指数挂钩，则该贷款不符合本金加利息的合同现金流量特征；选项D，利率为“贷款市场报价利率+100基点”的贷款符合本金加利息的合同现金流量特征。"},{"num":4,"text":"下列各项关于企业金融工具重分类及相关会计处理的表述中，正确的有（ ）。","options":[{"letter":"A","text":"金融负债之间不得进行重分类"},{"letter":"B","text":"企业改变其管理金融资产的业务模式时，应当按照规定对所有受影响的相关金融资产进行重分类"},{"letter":"C","text":"金融资产在企业具有不同业务模式的各部门之间转移，属于业务模式变更"},{"letter":"D","text":"企业对金融资产进行重分类，应当自重分类日起采用未来适用法进行相关会计处理，不得对以前已经确认的利得、损失或利息进行追溯调整"}],"answer":"ABD","explanation":"以下情形不属于业务模式变更：（1）企业持有特定金融资产的意图改变。企业即使在市场状况发生重大变化的情况下改变对特定资产的持有意图，也不属于业务模式变更。（2）金融资产特定市场暂时性消失从而暂时影响金融资产出售。（3）金融资产在企业具有不同业务模式的各部门之间转移。选项C错误。"},{"num":5,"text":"关于金融资产和金融负债的确认和终止确认，下列表述中正确的有（ ）。","options":[{"letter":"A","text":"因买卖商品或劳务的确定承诺而将获得的资产或将承担的负债，收到订单的企业通常在承诺时确认一项资产，发出订单的企业在承诺时确认一项负债"},{"letter":"B","text":"当企业成为金融工具合同的一方，并因此拥有收取现金的权利或承担支付现金的义务时，应将无条件的应收款项或应付款项确认为金融资产或金融负债"},{"letter":"C","text":"企业应在成为属于金融工具的期权合同的一方时，确认一项金融资产或金融负债"},{"letter":"D","text":"企业（借入方）与借出方之间签订协议，以承担新金融负债方式替换原金融负债，且新金融负债与原金融负债的合同条款实质上不同的，企业应当终止确认原金融负债，同时确认一项新金融负债"}],"answer":"BCD","explanation":"因买卖商品或劳务的确定承诺而将获得的资产或将承担的负债，通常直到至少合同一方履约才予以确认。例如，收到订单的企业通常不在承诺时确认一项资产（发出订单的企业也不在承诺时确认一项负债)，而是直到所订购的商品或劳务已装运、交付或提供时才予以确认，选项A错误。"},{"num":6,"text":"对以公允价值计量且其变动计人其他综合收益的权益工具投资，下列表述中正确的有（ ）。","options":[{"letter":"A","text":"符合条件的股利收人应计入当期损益"},{"letter":"B","text":"当该金融资产终止确认时，之前计人其他综合收益的累计利得或损失应当从其他综合收益中转出，计人投资收益"},{"letter":"C","text":"当该金融资产终止确认时，之前计入其他综合收益的累计利得或损失应当从其他综合收益中转出，计人留存收益"},{"letter":"D","text":"当信用风险显著增加时，应确认预期信用损失"}],"answer":"AC","explanation":"符合条件的股利收入应计人当期损益（投资收益），选项A正确；当该金融资产终止确认时，之前计人其他综合收益的累计利得或损失应当从其他综合收益中转出，计入留存收益，选项B错误，选项C正确；以公允价值计量且其变动计入其他综合收益的权益工具投资，不确认预期信用损失，选项D错误。"},{"num":7,"text":"下列各项关于企业资产减值相关会计处理的表述中，正确的有（ ）。","options":[{"letter":"A","text":"企业应当对其他权益工具投资计提减值准备并计入留存收益"},{"letter":"B","text":"企业应当将存货可变现净值低于存货成本的差额计人存货跌价准备"},{"letter":"C","text":"对于以摊余成本计量的金融资产，企业应当将预期信用损失大于该金融资产当前减值准备账面金额的差额确认为信用减值损失"},{"letter":"D","text":"企业估计非流动资产的可收回金额时，应当根据其公允价值减去处置费用后的净额与资产预计未来现金流量的现值两者之间较低者确定"}],"answer":"BC","explanation":"其他权益工具投资不计提减值准备，选项A错误；企业估计非流动资产的可收回金额时，应当根据其公允价值减去处置费用后的净额与资产预计未来现金流量的现值两者之间较高者确定，选项D错误。"},{"num":8,"text":"2×25年3月10日，甲公司向乙公司转让应收账款1000万元，收到转让对价970万元。根据保理合同的约定，甲公司为上述被转让的应收账款向乙公司提供保证担保，担保金额为50万元，被转让的应收账款实际信用损失超过50万元的部分由乙公司承担。转让日，担保合同的公允价值为3万元；甲公司转让前已对该应收账款按6%计提了坏账准备。假定该项应收账款没有活跃市场，且乙公司没有出售被转移资产的实际能力，甲公司保留了对该应收账款的控制。不考虑其他因素，下列各项关于甲公司转让应收账款会计处理的表述中，正确的有（ ）。","options":[{"letter":"A","text":"确认投资收益27万元"},{"letter":"B","text":"确认继续涉入资产50万元"},{"letter":"C","text":"确认继续涉入负债53万元"},{"letter":"D","text":"将收到的970万元确认为其他应付款"}],"answer":"ABC","explanation":"会计分录如下："},{"num":9,"text":"下列项目中，甲公司应对金融负债终止确认的有（ ）。","options":[{"letter":"A","text":"甲公司用银行存款支付前欠账款200万元"},{"letter":"B","text":"甲公司将用于偿付金融负债的资产转人某机构或设立信托，但偿付债务的义务仍存在"},{"letter":"C","text":"与债权人重新议定合同构成实质性修改情形下的甲公司原金融负债"},{"letter":"D","text":"甲公司回购了所发行债务工具"}],"answer":"ACD","explanation":"选项A，金融负债（或其一部分）的现时义务已经解除的，应当终止确认该金融负债；选项B，虽然甲公司已为金融负债设立了“偿债基金”，但金融负债对应的债权人仍然拥有全额追索的权利时，不能认为企业的相关现时义务已解除，从而不能终止确认金融负债；选项C，企业对原金融负债（或其一部分）的合同条款作出实质性修改的，应当终止确认原金融负债，同时按照修改后的条款确认一项新金融负债；选项D，如果一项债务工具的发行人回购了该工具，即使该发行人打算在近期将其再次出售，企业（发行人）应当终止确认该债务工具。"},{"num":10,"text":"关于现金流量套期，下列会计处理表述中，正确的有（ ）。","options":[{"letter":"A","text":"套期工具产生的利得或损失中属于套期有效的部分，作为现金流量套期储备，应当计人其他综合收益"},{"letter":"B","text":"每期计入其他综合收益的现金流量套期储备的金额应与被套期项目公允价值变动额相等"},{"letter":"C","text":"套期工具产生的利得或损失中属于套期无效的部分（即扣除计人其他综合收益后的其他利得或损失），应当计入当期损益"},{"letter":"D","text":"套期工具产生的利得或损失中属于套期无效的部分（即扣除计人其他综合收益后的其他利得或损失），应当计入资本公积"}],"answer":"AC","explanation":"每期计入其他综合收益的现金流量套期储备的金额应当为当期现金流量套期储备的变动额，选项B错误；套期工具产生的利得或损失中属于套期无效的部分（即扣除计人其他综合收益后的其他利得或损失），应当计入当期损益，选项D错误。"},{"num":11,"text":"关于保险合同会计处理的总体要求，下列表述中正确的有（ ）。","options":[{"letter":"A","text":"企业应当对保险合同进行分组，将合同组作为计量单元，并在将具有相似风险且统一管理的保险合同归为同一保险合同组合后进行分组确认和计量"},{"letter":"B","text":"企业应当在责任期开始日、保单持有人首付款到期日（在保险合同未约定首付款到期日时，则为企业实际收到首付款的日期）、发生亏损时这三个时点中的最早时点确认其签发的合同组"},{"letter":"C","text":"企业在履行保险合同过程中，应当随保险合同履约义务的履行逐期确认收人和费用"},{"letter":"D","text":"企业在确认保险服务收人和保险服务费用时，应包含保险合同中的投资成分"}],"answer":"ABC","explanation":"企业在确认保险服务收人和保险服务费用时，不得包含保险合同中的投资成分，选项D错误。"}]},{"type":"计算分析题","questions":[{"num":1,"text":"2×25年，甲公司发生的相关交易或事项如下： （1）1月10日，甲公司与乙公司签订附回售条款的股权投资的合同，甲公司除拥有与普通股股东一致的投票权及分红权等权利之外，还拥有一项回售权。甲公司与乙公司约定，若乙公司未能满足特定目标，甲公司有权要求按投资成本加年化10%收益（假设代表被投资方在市场上的借款利率水平）的对价将该股权回售给乙公司。甲公司持有乙公司股权比例为3%，对乙公司没有重大影响。 （2）2月1日，甲公司购买银行理财产品主要条款如下：①理财产品类型：人民币非保本浮动收益型；②期限：3个月；③参考年化收益率4%，不保证本金及收益；④理财产品业务管理费：实际理财收益超过参考收益时，超过部分由银行作为理财业务管理费收取，实际理财收益低于参考收益时，银行不收取理财业务管理费；③提前赎回约定：甲公司不得提前赎回。甲公司购买该理财产品的意图是获得一定收益。 （3）2月5日，甲公司利用自有资金购买银行理财产品，该理财产品为非保本浮动收益型，期限为6个月，不可转让交易，也不可提前赎回。根据理财产品合约，基础资产为指定的单一固定利率信贷资产，该信贷资产的剩余存续期限和理财产品的存续期限一致，且信贷资产利息收人是该理财产品收人的唯一来源。甲公司购买理财产品的主要目的在于取得理财产品利息收人，一般不会在到期前转让。 （4）5月5日，甲公司从信用状况良好的某客户处收到若干由该客户签发的商业承兑汇票和由工商银行承兑的银行承兑汇票，并于当月将上述票据全部背书转让给供应商，并将其全部予以终止确认。甲公司对应收票据进行管理的目标是将应收票据持有至到期后收取款项，同时兼顾流动性需求转让应收票据。 要求： （1）根据资料（1），判断甲公司持有乙公司3%股权投资在初始确认时应当如何分类，并说明理由。 （2）根据资料（2），判断甲公司购入的银行理财产品在初始确认时应当如何分类，并说明理由。 （3）根据资料（3），判断甲公司购入的银行理财产品在初始确认时应当如何分类，并说明理由。 （4）根据资料（4），判断甲公司应收票据在初始确认时应当如何分类，并说明理由；指出甲公司的会计处理是否存在不当之处。如果存在不当之处，提出恰1 当的处理意见。","options":[],"answer":null,"explanation":null},{"num":2,"text":"甲公司为一家上市公司，相关年度发生与金融工具有关的交易或事项如下： （1）2×24年7月1日，甲公司购入了乙公司同日按面值发行的债券10万张，该债券每张面值为100元，面值总额1000万元，款项已以银行存款支付。根据乙公司债券的募集说明书，该债券的年利率为4%（与实际利率相同），自发行之日起开始计息，债券利息每年支付一次，于每年6月30日支付，期限为5年，本金在债券到期时一次性偿还。甲公司管理乙公司债券的目标是保证日常流动性需求的同时，维持固定的收益率。2×24年12月31日，甲公司所持上述乙公司债券的公允价值为1050万元（不含利息）。2×25年1月1日，甲公司基于流动性需求将所持乙公司债券全部出售，取得价款1052万元。 （2）2×25年7月1日，甲公司从二级市场购人了丙公司发行的5年期可转换债券10万张，以银行存款支付价款1020万元，另支付交易费用2万元。根据丙公司可转换债券的募集说明书，该可转换债券每张面值为100元，票面年利率为1.5%，利息每年支付一次，于可转换债券发行之日起每满1年的当日支付；可转换债券持有人可于可转换债券发行之日满3年后第一个交易日起至到期日止，按照20元／股的转股价格将持有的可转换债券转换为丙公司的普通股。2×25年12月31日，甲公司所持上述丙公司可转换债券的公允价值为1030万元（不含利息）。 （3）2×25年9月1日，甲公司向特定的合格投资者按面值发行优先股500万股，每股面值100元，扣除发行费用150万元后的发行收人净额已存人银行。根据甲公司发行优先股的募集说明书，本次发行优先股的票面股息率为5%；甲公司在有可分配利润的情况下，可以向优先股股东派发股息；在支付约定的优先股当期股息前，甲公司不得向普通股股东分配股利；除非股息支付日期前12个月发生甲公司向普通股股东支付股利等强制付息事件，甲公司有权取消支付优先股当期股息，且不构成违约；优先股股息不累积；优先股股东按照约定的票面股息率分配股息后，不再同普通股股东一起参加剩余利润分配；甲公司有权按照优先股票面金额加上当期已决议支付但尚未支付的优先股股息之和赎回并注销本次发行的优先股；本次发行的优先股不设置投资者回售条款，也不设置强制转换为普通股的条款；甲公司清算时，优先股股东的清偿顺序劣后于普通债务的债权人，但在普通股股东之前。 甲公司根据相应的议事机制，能够自主决定普通股股利的支付。 （1）根据资料（1），判断甲公司所持乙公司债券应予确认的金融资产类别，从业务模式和合同现金流量特征两个方面说明理由，并编制与购入、持有及出售乙公司债券相关的会计分录。 （2）根据资料（2），判断甲公司所持丙公司可转换债券应予确认的金融资产类别，说明理由，并编制与购入、持有丙公司可转换债券相关的会计分录。 （3）根据资料（3），判断甲公司发行的优先股是负债还是权益工具，说明理由，并编制发行优先股的会计分录。 （1）2×24年1月1日，甲公司、甲公司的控股股东与乙公司签订增资协议，乙公司以银行存款 5000万元对甲公司增资，持有甲公司20%的股权，其中500万元计入股本，增资后甲公司股本为2500万元。协议同时约定，若甲公司未来3年内不能实现A股发行上市，则甲公司或者甲公司的控股股东需要回购乙公司持有的甲公司20%的股权，回购价格以回购日甲公司20%股权的公允价值和5000万元出资按照年化8%的利率（单利）、自出资到账日起实际占用时长计算的本息和两者孰高确定。 2×24年12月31日，甲公司100%股权的公允价值为26000万元；2×25年12月31日，甲公司100%股权的公允价值为30000万元。 （2）2×26年1月15日，甲公司、甲公司的控股股东与乙公司签订补充协议，解除了回购条款的约定。当日甲公司100%股权的公允价值仍为30000万元。 （1）甲公司2×25年度财务报告于2×26年3月15日经批准报出。 （2）不考虑相关税费及其他因素。 （1）根据资料（1），判断甲公司2×24年取得乙公司增资款5000万元，在甲公司个别财务报表和甲公司控股股东的合并财务报表中应当分类为权益工具还是金融负债，说明理由；若属于金融负债，判断其后续计量原则，分别计算2×24年12月31日、2×25年12月31日金融负债的账面余额；若属于权益工具，判断其后续计量原则，分别计算2×24年12月31日、2×25年12月31日权益工具的账面余额。 （2）根据资料（2），判断甲公司、甲公司控股股东与乙公司签订补充协议约定的事项，是否属于资产负债表日后调整事项，说明理由。 （3）根据资料（1），编制甲公司2×24年1月1日和2×24年12月31日相关的会计分录。","options":[],"answer":null,"explanation":null}]}]},{"chTitle":"第十四章 租赁","header":"## 第十四章 租赁\r\n\r\n考情速览\r\n\r\n<table><tr><td colspan=\"2\">复习难度 常考题型 ★★★ 客观题+主观题</td><td>近5年考试平均分值</td></tr><tr><td colspan=\"3\">5分左右 本章考题主要涉及客观题和计算分析题，综合题常与收入、所得税等内 学习指南</td></tr></table>\r\n\r\n## 教材主要变化\r\n\r\n无变化。\r\n\r\n## 考点框架\r\n\r\n<table><tr><td colspan=\"3\" rowspan=\"1\">租赁</td></tr><tr><td colspan=\"1\" rowspan=\"3\">租赁概述</td><td colspan=\"1\" rowspan=\"1\">租赁的识别</td><td colspan=\"1\" rowspan=\"1\">中</td></tr><tr><td colspan=\"1\" rowspan=\"1\">租赁的分拆与合并</td><td colspan=\"1\" rowspan=\"1\">●中</td></tr><tr><td colspan=\"1\" rowspan=\"1\">租赁期</td><td colspan=\"1\" rowspan=\"1\">中</td></tr><tr><td colspan=\"1\" rowspan=\"3\">承租人会计处理</td><td colspan=\"1\" rowspan=\"1\">初始计量</td><td colspan=\"1\" rowspan=\"1\">中</td></tr><tr><td colspan=\"1\" rowspan=\"1\">后续计量</td><td colspan=\"1\" rowspan=\"1\">中</td></tr><tr><td colspan=\"1\" rowspan=\"1\">短期租赁和低价值资产租赁</td><td colspan=\"1\" rowspan=\"1\">中</td></tr><tr><td colspan=\"1\" rowspan=\"3\">出租人会计处理</td><td colspan=\"1\" rowspan=\"1\">出租人的租赁分类</td><td colspan=\"1\" rowspan=\"1\">中</td></tr><tr><td colspan=\"1\" rowspan=\"1\">出租人对融资租赁的会计处理</td><td colspan=\"1\" rowspan=\"1\">难</td></tr><tr><td colspan=\"1\" rowspan=\"1\">出租人对经营租赁的会计处理</td><td colspan=\"1\" rowspan=\"1\">中</td></tr><tr><td colspan=\"1\" rowspan=\"3\">特殊租赁业务的会计处理</td><td colspan=\"1\" rowspan=\"1\">转租赁</td><td colspan=\"1\" rowspan=\"1\">难</td></tr><tr><td colspan=\"1\" rowspan=\"1\">生产商或经销商出租人的融资租赁会计处理</td><td colspan=\"1\" rowspan=\"1\">难</td></tr><tr><td colspan=\"1\" rowspan=\"1\">售后租回交易的会计处理</td><td colspan=\"1\" rowspan=\"1\">难</td></tr></table>\r\n\r\n## 考点剖析\r\n\r\n本章主要介绍承租人和出租人的会计处理，有一定的学习难度，学习时需静下心来分析理解各个账务处理的逻辑原理，并多练熟记。","sections":[{"title":"第一节租赁概述","content":"## 、租赁的识别\r\n\r\n考点难度●●〇中\r\n\r\n## （一）租赁的定义\r\n\r\n租赁，是指在一定期间内，出租人将资产的使用权让与承租人以获取对价的合同。如果合同一方让渡了在一定期间内控制一项或多项已识别资产使用的权利以换取对价，则该合同为租赁或者包含租赁。\r\n\r\n企业应当在合同开始日评估合同是否为租赁或者包含租赁。除非合同条款或条件发生变化，否则，企业无需在合同开始日后重新评估合同是否为租赁或者是否包含租赁。\r\n\r\n## 点拨\r\n\r\n包含租赁=租赁+服务\r\n\r\n## 提示\r\n\r\n一项合同要被分类为租赁，必须满足三要素：一是存在一定期间；二是存在已识别资产；三是资产供应方向客户转移对已识别资产使用权的控制。\r\n\r\n“一定期间”不仅可以是合同直接明确的一段时间，也可以表述为已识别资产的使用量（如某项设备的产出量）。\r\n\r\n（2）如果合同规定客户在使用期间仅能在特定里程范围内驾驶汽车，则企业应当仅考虑在允许的里程范围内使用汽车所产生的经济利益，而不包括超出该里程范围使用汽车所产生的经济利益。\r\n\r\n## 2.客户是否有权主导资产的使用\r\n\r\n存在下列情形之一的，可视为客户有权主导对已识别资产在整个使用期间的使用：\r\n\r\n（1）客户有权在整个使用期间主导已识别资产的使用目的和使用方式；\r\n\r\n（2）已识别资产的使用目的和使用方式在使用期间以前已预先确定，并且客户有权在整个使用期间自行或主导他人按照其确定的方式运营该资产，或者客户设计了已识别资产（或资产的特定方面）并在设计时已预先确定了该资产在整个使用期间的使用目的和使用方式。\r\n\r\n## （四）评估流程\r\n\r\n综上，合同开始日，企业评估合同是否为租赁或是否包含租赁可参考下图：\r\n\r\n\r\n\r\n【例题1·多选题】甲公司（客户）与乙公司（货运商）签订了一份使用10个指定型号集装箱的5年期合同。合同指定了具体的集装箱，集装箱归乙公司所有。甲公司有权决定何时何地使用这些集装箱以及用其运输什么货物。不用时，集装箱存放在甲公司处。甲公司可将集装箱用于其他目的（如用于存储），但合同明确规定甲公司不能运输特定类型的货物（如爆炸物）。若某个集装箱需要保养或维修，乙公司应以同类型的集装箱替换。除非甲公司违约，乙公司在合同期内不得收回集装箱。除集装箱外，合同还约定乙公司应按照甲公司的要求提供运\r\n\r\n输集装箱的卡车和司机。卡车存放在乙公司处，乙公司向司机发出指示详细说明甲公司的货物  \r\n运输要求。乙公司可使用任一卡车满足甲公司的需求，卡车既可以用于运输甲公司的货物，也  \r\n可以运输其他客户的货物，即如果其他客户要求运输货物的目的地与甲公司要求的目的地距离  \r\n不远且时间接近，乙公司可以用同一卡车运送甲公司使用的集装箱及其他客户的货物。不考虑  \r\n其他因素，下列说法中正确的有（ ）。A．10个集装箱和卡车均属于已识别资产B.该合同包含卡车的租赁C.该合同包含卡车的服务D.该合同包含集装箱的租赁\r\n\r\n解析合同明确指定了10个集装箱，乙公司一旦交付集装箱给甲公司，仅在集装箱需要保养或维修时方可替换，这10个集装箱是已识别资产，合同既未明确也未隐性指定卡车，乙公司对卡车有实质性替换权，卡车不属于已识别资产，因此，关于卡车的合同条款并不构成一项租赁，而是一项服务，选项A和B错误，选项C正确；甲公司有权主导集装箱的使用并获得在5年使用期内使用集装箱所产生的几乎全部经济利益，因此该合同包含集装箱的租赁，选项D正确。\r\n\r\n## 二、租赁的分拆与合并\r\n\r\n考点难度●●〇 中\r\n\r\n## （一）租赁的分拆\r\n\r\n租赁准则规定，合同中同时包含多项单独租赁的，承租人和出租人应当将合同予以分拆，并分别各项单独租赁进行会计处理。\r\n\r\n同时符合下列条件，使用已识别资产的权利构成合同中的一项单独租赁：\r\n\r\n（1）承租人可从单独使用该资产或将其与易于获得的其他资源一起使用中获利。易于获得的资源是指出租人或其他供应方单独销售或出租的商品或服务，或者承租人已从出租人或其他交易中获得的资源。\r\n\r\n（2）该资产与合同中的其他资产不存在高度依赖或高度关联关系。例如，若承租人租人资产的决定不会对承租人使用合同中的其他资产的权利产生重大影响，则表明该项资产与合同中的其他资产不存在高度依赖或高度关联关系。\r\n\r\n合同中同时包含租赁和非租赁部分的，承租人和出租人应当将租赁和非租赁部分进行分拆，除非企业适用《企业会计准则第21号——租赁》的简化处理。分拆时，各租赁部分应当分别按照《企业会计准则第21号—租赁》进行会计处理，非租赁部分应当按照其他适用的企业会计准则进行会计处理。\r\n\r\n另需注意的是，出租人可能要求承租人承担某些款项，却并未向承租人转移商品或服务。例如，出租人可能将管理费或与租赁相关的其他成本计入应付金额，但并未向承租人转移商品或服务。此类应付金额不构成合同中单独的组成部分，而应视为总对价的一部分分摊至单独识别的合同组成部分。\r\n\r\n\r\n\r\n## 1.承租人的处理\r\n\r\n在分拆合同包含的租赁和非租赁部分时，承租人应当按照各项租赁部分单独价格及非租赁部分的单独价格之和的相对比例分摊合同对价。租赁和非租赁部分的相对单独价格，应当根据出租人或类似资产供应方就该部分或类似部分向企业单独收取的价格确定。如果可观察的单独价格不易于获得，承租人应当最大限度地利用可观察的信息估计单独价格。\r\n\r\n为简化处理，承租人可以按照租赁资产的类别选择是否分拆合同包含的租赁和非租赁部分。承租人选择不分拆的，应当将各租赁部分及与其相关的非租赁部分分别合并为租赁，按照租赁准则进行会计处理。但是，对于按照《企业会计准则第22号—金融工具确认和计量》应分拆的嵌人衍生工具，承租人不应将其与租赁部分合并进行会计处理。\r\n\r\n## 点拨\r\n\r\n①承租人对租赁部分和非租赁部分选择分拆，租赁部分按照《租赁》准则处理，非租赁部分按照其他适用准则处理；\r\n\r\n②承租人选择不分拆，合并为租赁按《租赁》准则处理。\r\n\r\n## 2.出租人的处理\r\n\r\n在分拆租赁部分和非租赁部分时，出租人应根据《企业会计准则第14号一收人》关于交易价格分摊的规定分摊合同对价。\r\n\r\n【例题2·单选题】甲公司从乙公司租人一辆汽车，租赁期2年，租赁费用共计20万元。  \r\n同时乙公司还向甲公司派出一名司机，该司机在租赁期内按照甲公司的安排驾驶该租赁汽车。  \r\n不考虑折现及其他因素，下列各项关于上述租赁交易会计处理的表述中，正确的是（ ）。A.乙公司按租赁准则每月确认租赁收入0.83万元B.甲公司按接受服务进行会计处理C．乙公司分拆租赁部分和非租赁部分，分别按租赁准则和收人准则进行会计处理D.乙公司按收人准则每月确认服务收人0.83万元\r\n\r\n解析 乙公司租出的汽车应按租赁准则处理，派出的司机属于提供服务，应按收入准则处理，乙公司应分拆租赁部分和非租赁部分，选项C正确。\r\n\r\n## （二）租赁的合并\r\n\r\n企业与同一交易方或其关联方在同一时间或相近时间订立的两份或多份包含租赁的合同，在满足下列条件之一时，应当合并为一份合同进行会计处理：\r\n\r\n（1）该两份或多份合同基于总体商业目的而订立并构成一揽子交易，若不作为整体考虑则无法理解其总体商业目的。\r\n\r\n（2）该两份或多份合同中的某份合同的对价金额取决于其他合同的定价或履行情况。\r\n\r\n（3）该两份或多份合同让渡的资产使用权合起来构成一项单独租赁。\r\n\r\n两份或多份合同合并为一份合同进行会计处理的，仍然需要区分该一份合同中的租赁部分和非租赁部分。\r\n\r\n## 三、租赁期5年热点丨3次\r\n\r\n租赁期是指承租人有权使用租赁资产且不可撤销的期间。承租人有续租选择权，即有权选择续租该资产，且合理确定将行使该选择权的，租赁期还应当包含续租选择权涵盖的期间；承租人有终止租赁选择权，即有权选择终止租赁该资产，但合理确定将不会行使该选择权的，租赁期应当包含终止租赁选择权涵盖的期间。\r\n\r\n## 点拨\r\n\r\n租赁期=不可撤销期间+续租选择权所涵盖期间（行使续租选择权）+终止租赁选择权所涵盖期间（不行使终止租赁选择权）\r\n\r\n## （一）租赁期开始日\r\n\r\n租赁期自租赁期开始日起计算。租赁期开始日，是指出租人提供租赁资产使其可供承租人使用的起始日期。租赁协议中对起租日或租金支付时间的约定，并不影响租赁期开始日的判断。\r\n\r\n## 提示\r\n\r\n如果承租人在租赁协议约定的起租日或租金起付日之前，已获得对租赁资产使用权的控制，则表明租赁期已经开始。如房屋租赁，承租人取得房屋钥匙开始装修的日期即为租赁期开始日。\r\n\r\n【真题3·单选题】甲公司于2×22年8月15日与乙公司签订设备租赁合同，甲公司当日  \r\n即从乙公司厂区取走该设备，并自行运输，该设备于2×22年9月1日到达甲公司厂区，经过  \r\n必要的安装和调试后，于2×22年10月1日达到预定可使用状态，乙公司在租赁合同中同意  \r\n给予甲公司一段时间的免租期，从2×22年10月15日起开始计算租金。甲公司租入该设备的  \r\n租赁期开始日是（）。（2023年）A.2×22年8月15日B.2×22年10月15日C.2×22年10月1日D.2×22年9月1日\r\n\r\n解析租赁期开始日，是指出租人提供租赁资产使其可供承租人使用的起始日期。如果承租人在租赁协议约定的起租日或租金起付日之前，已获得对租赁资产使用权的控制，则表明租赁期已经开始。租赁协议中对起租日或租金支付时间的约定，并不影响租赁期开始日的判断。因此本题租赁期开始日为2×22年8月15日，选项A正确。\r\n\r\n## （二）不可撤销期间\r\n\r\n在确定一项租赁的租赁期和评估其不可撤销期间时，企业应根据租赁条款的约定确定可强制执行合同的期间。\r\n\r\n当承租人和出租人双方均有权在未经另一方许可的情况下终止租赁，且所受惩罚不重大时，该租赁不再可强制执行。如果只有承租人有权终止租赁，则在确定租赁期时，企业应将该\r\n\r\n项权利视为承租人可行使的终止租赁选择权予以考虑。如果只有出租人有权终止租赁，则该租赁的不可撤销期间包括终止租赁选择权所涵盖的期间。\r\n\r\n需要注意的是，在作出“所受惩罚不重大”的判断时，企业除考虑终止合同的罚款外，还应当考虑与合同相关的其他经济因素，如弃置或拆卸租赁资产改良的成本等。\r\n\r\n\r\n\r\n点拨 因出租人只有出租资产才能获得收益，所以一般认为出租人不会终止租赁。\r\n\r\n## （三）续租选择权和终止租赁选择权\r\n\r\n在租赁期开始日,企业应当评估承租人是否合理确定将行使续租或购买租赁资产的选择权，或者将不行使终止租赁选择权。在评估时，企业应当考虑对承租人行使续租选择权或不行使终止租赁选择权带来经济利益的所有相关事实和情况，包括自租赁期开始日至选择权行使日之间的事实和情况的预期变化。\r\n\r\n【例题4·单选题】2×24年12月1日，甲公司与乙公司签订租赁协议，甲公司从乙公司  \r\n租入某写字楼的1至2层作为办公用房。租赁协议约定，起租日为2×25年4月1日，到期日  \r\n为2×30年12月31日，从起租日开始计算租金，租金每月30万元；甲公司有2年的续租选择  \r\n权。甲公司于2×25年1月1日进驻该写字楼并开始装修。甲公司不能合理确定将行使续租选  \r\n择权。不考虑其他因素，甲公司对该租赁业务确定的租赁期是（ ）。A.6年 B.7.75年C.8年 D.5.75年\r\n\r\n解析 甲公司于2×25年1月1日进驻该写字楼并开始装修，当日已拥有对写字楼使用权的控制，因此租赁期开始日为2×25年1月1日。由于甲公司不能合理确定将行使续租选择权，所以租赁期不应包含续租选择权涵盖的期间，因此甲公司确定的租赁期为6年（2×25年1月1日至2×30年12月31日）。\r\n\r\n解题攻略）租赁期是指承租人有权使用租赁资产且不可撤销的期间，自租赁期开始日起计算。如果承租人在租赁协议约定的起租日或租金起付日之前，已获得对租赁资产使用权的控制，则表明租赁期已经开始。承租人有续租选择权且合理确定将行使该选择权的，租赁期还应当包含续租选择权涵盖的期间。\r\n\r\n## （四）对租赁期和购买选择权的重新评估\r\n\r\n租赁准则规定，发生承租人可控范围内的重大事件或变化，且影响承租人是否合理确定将行使相应选择权的，承租人应当对其是否合理确定将行使续租选择权、购买选择权或不行使终止租赁选择权进行重新评估，并根据重新评估结果修改租赁期。\r\n\r\n## 提示\r\n\r\n在租赁期开始日，企业应当基于既有相关事实和情况判断可强制执行合同的期间以及是否存在实质续租、终止等选择权以合理确定租赁期，其他相关会计估计应与此一致。例如，与该租赁相关的租赁资产改良支出、初始直接费用等的摊销期限应当与租赁期保持一致。\r\n\r\n【例题5·单选题】甲公司作为承租人于2×23年7月1日从乙公司租人一座仓库，不  \r\n可撤销的租赁期为2×23年7月1日至2×26年6月30日。租赁期满后甲公司可在不超过  \r\n2×29年6月30日的期间内，按原租金价格逐年选择是否续租。租赁期开始日，甲公司预计  \r\n未来市场租金会上升，且根据其在当地经营的计划，估计仓储需求将持续5年。2×25年9月，  \r\n随着市场的变化，当地同类仓库的租金价格已降至原租金的80%，且短期内很难回升。基于上  \r\n述事实，下列有关甲公司租赁期判断的表述中，正确的是（ ）。A．租赁期开始日判断的租赁期为3年B.租赁期开始日判断的租赁期为6年C．租赁期开始日判断的租赁期为5年D.2×25年9月应基于当前市场租金下降的情况重估租赁期\r\n\r\n解析因租赁期开始日估计仓储需求将持续5年，甲公司除了不可撤销的3年还将行使2年的续租选择权，租赁期为5年。2×25年9月因市场变化导致租金下降，不是承租人可控范围内的变化，所以不需要对租赁期进行重新评估。\r\n\r\n解题攻略只有发生承租人可控范围内的重大事件或变化，才能对租赁期进行重新评估。"},{"title":"第二节承租人会计处理","content":"在租赁期开始日，承租人应当对租赁确认使用权资产和租赁负债，应用短期租赁和低价值资产租赁简化处理的除外。\r\n\r\n## 一、初始计量\r\n\r\n考点难度●●〇中\r\n\r\n（一）租赁负债的初始计量 5年热点丨4次\r\n\r\n租赁负债应当按照租赁期开始日尚未支付的租赁付款额的现值进行初始计量。识别应纳入租赁负债的相关付款项目是计量租赁负债的关键。\r\n\r\n1.租赁付款额\r\n\r\n租赁付款额，是指承租人向出租人支付的与在租赁期内使用租赁资产的权利相关的款项。\r\n\r\n\r\n\r\n租赁付款额包括以下五项内容：\r\n\r\n（1）固定付款额及实质固定付款额，存在租赁激励的，扣除租赁激励相关金额。\r\n\r\n实质固定付款额是指在形式上可能包含变量但实质上无法避免的付款额。例如：\r\n\r\n①付款额设定为可变租赁付款额，但该可变条款几乎不可能发生，没有真正的经济实质。例如，付款额仅需在租赁资产经证实能够在租赁期间正常运行时支付，或者仅需在不可能不发生的事件发生时支付。又如，付款额初始设定为与租赁资产使用情况相关的可变付款额，但其潜在可变性将于租赁期开始日之后的某个时点消除，在可变性消除时，该类付款额成为实质固定付款额。\r\n\r\n②承租人有多套付款额方案，但其中仅有一套是可行的。在此情况下，承租人应采用该可行的付款额方案作为租赁付款额。\r\n\r\n③承租人有多套可行的付款额方案，但必须选择其中一套。在此情况下，承租人应采用总折现金额最低的一套作为租赁付款额。\r\n\r\n【例题6】承租人甲公司签订了一份为期5年的卡车租赁合同。合同中关于租赁付款额的条款为：如果该卡车在某月份的行驶里程不超过1万公里，则该月应付的租金为10000元；如果该卡车在某月份的行驶里程超过1万公里但不超过2万公里，则该月应付的租金为16000元；该卡车1个月内的行驶里程最高不能超过2万公里，否则承租人需支付巨额罚款。\r\n\r\n分析本例中，租赁付款额中包含基于使用情况的可变性，且在某些月份里确实可避免支付较高租金，然而，月付款额10000元是不可避免的。因此，月付款额10000元属于实质固定付款额，应被纳入租赁负债的初始计量中。\r\n\r\n【例题7】承租人甲公司租人一台预计使用寿命为5年的机器。不可撤销的租赁期为3年。在第3年末，甲公司必须以20000元购买该机器，或者必须将租赁期延长2年，如延长，则在续租期内每年末支付租金10500元。\r\n\r\n分析 甲公司在租赁期开始时评估认为，不能合理确定在第3年末是将购买该机器，还是将租赁期延长2年。如果甲公司单独考虑购买选择权或续租选择权，那么在租赁期开始时，购买选择权的行权价格与续租期内的应付租金都不会纳入到租赁负债的初始计量中。\r\n\r\n然而，该安排在第3年末包含一项实质固定付款额。这是因为，甲公司必须行使上述两种选择权中的一个，且不论在哪种选择权下，甲公司都必须进行付款。因而在该安排中，实质固定付款额的现值是下述两项金额中的较低者：购买选择权的行权价格（20000元）的现值与续租期内付款额（每年末支付10500元）的现值。\r\n\r\n租赁激励，是指出租人为达成租赁向承租人提供的优惠，包括出租人向承租人支付的与租赁有关的款项、出租人为承租人偿付或承担的成本等。存在租赁激励的，承租人在确定租赁付款额时，应扣除租赁激励相关金额。\r\n\r\n（2）取决于指数或比率的可变租赁付款额。\r\n\r\n可变租赁付款额，是指承租人为取得在租赁期内使用租赁资产的权利，而向出租人支付的因租赁期开始日后的事实或情况发生变化（而非时间推移）而变动的款项。\r\n\r\n可变租赁付款额可能与下列各项指标或情况挂钩：\r\n\r\n①市场比率或指数。例如，随基准利率或消费者价格指数变动调整租赁付款额。\r\n\r\n②承租人源自租赁资产的绩效。例如，零售业不动产租赁可能会要求基于使用该不动产取得的销售收人的一定比例确定租赁付款额；某设备租赁可能基于该设备运营收人的一定比例确定租赁付款额。\r\n\r\n③租赁资产的使用。例如，车辆租赁可能要求承租人在超过特定里程数时支付额外的租赁付款额。\r\n\r\n需要注意的是，可变租赁付款额中，仅取决于指数或比率的可变租赁付款额纳人租赁负债的初始计量中，包括与消费者价格指数挂钩的款项、与基准利率挂钩的款项和为反映市场租金费率变化而变动的款项等。此类可变租赁付款额应当根据租赁期开始日的指数或比率确定。除了取决于指数或比率的可变租赁付款额之外，其他可变租赁付款额均不纳人租赁负债的初始计量中，而应当在实际发生时计人当期损益（按其他准则规定应计人相关资产成本的除外）。\r\n\r\n【例题8·多选题】承租人甲公司2×23年1月1日签订了一项为期10年的不动产租赁合  \r\n同，每年的租赁付款额为40万元，于每年年初支付。合同规定，租赁付款额在租赁期开始日  \r\n后每两年基于过去24个月消费者价格指数的上涨进行上调。2×23年1月1日的消费者价格  \r\n指数为100，预计未来每两年的消费者价格指数分别为130和140。2×25年1年1日的消费  \r\n者价格指数为120。甲公司下列会计处理中正确的有（）。A．甲公司2×23年1月1日应确认的年租赁付款额是40万元B．甲公司2×23年1月1日应确认的年租赁付款额是48万元C.甲公司2×25年1月1日应确认的年租赁付款额是48万元D．甲公司2×25年1月1日应确认的年租赁付款额是40万元\r\n\r\n解析 甲公司在初始计量租赁负债时，应基于租赁期开始日的消费者价格指数确定租赁付款额，无须对后续年度因消费者价格指数而导致的租金变动作出估计，因此，在2×23年1月1日租赁期开始日，甲公司应以每年40万元的租赁付款额为基础计量租赁负债，选项A正确，选项B错误；2×25年1月1日因消费者价格指数变动确认的租赁付款额=40×120/100=48（万元），选项C正确，选项D错误。\r\n\r\n【例题9·多选题】某租赁合同约定，甲公司租赁设备用于生产A产品，租赁期为5年，  \r\n每年的租赁付款额按照设备当年运营收人的70%计算，于每年末支付给出租人乙公司。假定  \r\n不考虑其他因素，甲公司下列会计处理中正确的有（）。A.将预计未来各年运营收人70%的现值计入租赁付款额\r\n\r\nB.后续计量时按租赁付款额现值和实际利率确认利息费用\r\n\r\nC.该租赁合同的租赁负债初始计量金额为0\r\n\r\nD．后续计量时，承租人应按设备运营收人的70%计算可变租赁付款额并计人A产品成本\r\n\r\n解析该租赁合同约定，租赁付款额按照设备当年运营收入的一定比例计算，属于可变租赁付款额，但该可变租赁付款额取决于设备的未来绩效而不是指数或比率，因而不纳入租赁负债的初始计量。在不存在其他租赁付款额的情况下，该租赁合同的租赁负债初始计量金额为0。后续计量时，承租人应按设备运营收入的70%计算可变租赁付款额并计入A产品成本，选项C和D正确。\r\n\r\n解题攻略）可变租赁付款额中，仅取决于指数或比率（消费者价格指数、基准利率、市场租金费率等）的可变租赁付款额纳入租赁负债的初始计量。\r\n\r\n（3）购买选择权的行权价格，前提是承租人合理确定将行使该选择权。\r\n\r\n在租赁期开始日，承租人应评估是否合理确定将行使购买租赁资产的选择权。在评估时，承租人应考虑对其行使或不行使购买选择权产生经济激励的所有相关事实和情况。如果承租人合理确定将行使购买租赁资产的选择权，则租赁付款额中应包含购买选择权的行权价格。\r\n\r\n（4）行使终止租赁选择权需支付的款项，前提是租赁期反映出承租人将行使终止租赁选择权。\r\n\r\n在租赁期开始日，承租人应评估是否合理确定将行使终止租赁的选择权。在评估时，承租人应考虑对其行使或不行使终止租赁选择权产生经济激励的所有相关事实和情况。如果承租人合理确定将行使终止租赁选择权，则租赁付款额中应包含行使终止租赁选择权需支付的款项，并且租赁期不应包含终止租赁选择权涵盖的期间。\r\n\r\n（5）根据承租人提供的担保余值预计应支付的款项。\r\n\r\n担保余值，是指与出租人无关的一方向出租人提供担保，保证在租赁结束时租赁资产的价值至少为某指定的金额。如果承租人提供了对余值的担保，则租赁付款额应包含该担保下预计应支付的款项，它反映了承租人预计将支付的金额，而不是承租人担保余值下的最大散口。\r\n\r\n需要说明的是，承租人向出租人支付的款项中包含增值税的，该增值税不属于租赁付款额的范畴，不应纳入租赁负债和使用权资产的计量。出租人为确保承租人履行合同相关义务收取租赁保证金的，该租赁保证金不属于承租人的租赁付款额，承租人应将其作为单独的资产进行会计处理。\r\n\r\n【例题10】承租人甲公司与出租人乙公司签订了汽车租赁合同，租赁期为5年。合同中就担保余值的规定为：如果标的汽车在租赁期结束时的公允价值低于40000元，则甲公司需向乙公司支付40000元与汽车公允价值之间的差额，因此，甲公司在该担保余值下的最大敞口为40000元。\r\n\r\n分析本例中，在租赁期开始日，若甲公司预计标的汽车在租赁期结束时的公允价值为40000元，即甲公司预计在担保余值下将支付的金额为零。则甲公司在计算租赁负债时，与担保余值相关的付款额为零。\r\n\r\n【例题11·多选题】下列各项关于企业初始计量租赁付款额的表述中，正确的有（  \r\nA.承租人能合理确定将行使购买租赁资产选择权的，租赁付款额的初始计量应包括该购买选择权的行权价格  \r\nB.与实际销售收入挂钩的可变租赁付款额应计人租赁付款额的初始计量中  \r\nC.存在租赁激励的，在初始计量租赁付款额时应扣除租赁激励相关金额  \r\nD.承租人能合理确定将行使终止租赁选择权的，租赁付款额的初始计量应包括行使终止租赁选择权需支付的款项\r\n\r\n解析选项B，与实际销售收入挂钩的可变租赁付款额，不是取决于指数或比率的可变租赁付款额，不纳入租赁负债的初始计量中，应当在实际发生时计入当期损益等。\r\n\r\n## 2.折现率\r\n\r\n租赁负债应当按照租赁期开始日尚未支付的租赁付款额的现值进行初始计量。在计算租赁付款额的现值时，承租人应当采用租赁内含利率作为折现率；无法确定租赁内含利率的，应当采用承租人增量借款利率作为折现率。\r\n\r\n点拨 折现率的选择：租赁内含利率（首选）或承租人增量借款利率。\r\n\r\n租赁内含利率，是指使出租人的租赁收款额的现值与未担保余值的现值之和等于租赁资产公允价值与出租人的初始直接费用之和的利率。\r\n\r\n租赁内含利率图示如下：\r\n\r\n\r\n\r\n其中，未担保余值，是指租赁资产余值中，出租人无法保证能够实现或仅由与出租人有关的一方予以担保的部分。\r\n\r\n初始直接费用，是指为达成租赁所发生的增量成本。增量成本是指若企业不取得该租赁，则不会发生的成本，如佣金、印花税等。无论是否实际取得租赁都会发生的支出，不属于初始直接费用，例如为评估是否签订租赁合同而发生的差旅费、法律费用等，此类费用应当在发生时计人当期损益。\r\n\r\n承租人增量借款利率，是指承租人在类似经济环境下为获得与使用权资产价值接近的资产，在类似期间以类似抵押条件借人资金须支付的利率。\r\n\r\n## （二）使用权资产的初始计量 5年热点丨4次\r\n\r\n使用权资产，是指承租人可在租赁期内使用租赁资产的权利。在租赁期开始日，承租人应当按照成本对使用权资产进行初始计量。\r\n\r\n## 点拨\r\n\r\n使用权资产=租赁负债的初始计量金额+在租赁期开始日或之前支付的租赁付款额（扣除已享受的租赁激励）+初始直接费用+复原成本（现值）\r\n\r\n该成本包括下列四项：\r\n\r\n<table><tr><td rowspan=1 colspan=1>项目</td><td rowspan=1 colspan=1>会计处理</td></tr><tr><td rowspan=1 colspan=1>（1）租赁负债的初始计量金额</td><td rowspan=1 colspan=1>借：使用权资产租赁负债一未确认融资费用贷：租赁负债一租赁付款额</td></tr><tr><td rowspan=1 colspan=1>（2）在租赁期开始日或之前支付的租赁付款额；存在租赁激励的，应扣除已享受的租赁激励相关金额</td><td rowspan=1 colspan=1>借：使用权资产贷：银行存款、预付账款</td></tr><tr><td rowspan=1 colspan=1>（3）承租人发生的初始直接费用</td><td rowspan=1 colspan=1>借：使用权资产贷：银行存款</td></tr><tr><td rowspan=1 colspan=1>（4）承租人为拆卸及移除租赁资产、复原租赁资产所在场地或将租赁资产恢复至租赁条款约定状态预计将发生的成本。前述成本属于为生产存货而发生的，适用《企业会计准则第1号—存货》</td><td rowspan=1 colspan=1>借：使用权资产贷：预计负债（预计将发生的为拆卸及移除租赁资产、复原租赁资产所在场地或将租赁资产恢复至租赁条款约定状态等成本的现值）点拨  因这部分成本发生在租赁期满时，所以应按其现值确认应计入使用权资产的成本</td></tr></table>\r\n\r\n## 提示\r\n\r\n①关于上表中第（4）项成本，承租人有可能在租赁期开始日就承担了上述成本的支付义务，也可能在特定期间内因使用租赁资产而承担了相关义务。承租人应在其有义务承担上述成本时，将这些成本确认为使用权资产成本的一部分。但是，承租人由于在特定期间内将使用权资产用于生产存货而发生的上述成本，应按照《企业会计准则第1号——存货》进行会计处理。承租人应当按照《企业会计准则第13号—或有事项》对上述成本的支付义务进行确认和计量。\r\n\r\n②承租人发生的租赁资产改良支出不属于使用权资产，应当记入“长期待摊费用”科目。\r\n\r\n③在某些情况下，承租人可能在租赁期开始前就发生了与租赁资产相关的经济业务或事项。例如：租赁合同双方经协商在租赁合同中约定，租赁资产需经建造或重新设计后方可供承租人使用；根据合同条款与条件，承租人需支付与资产建造或设计相关的成本。承租人如发生与租赁资产建造或设计相关的成本，应适用其他相关准则（如《企业会计准则第4号—固定资产》）进行会计处理。\r\n\r\n## 点拨\r\n\r\n与租赁资产建造或设计相关的成本不包括承租人为获取租赁资产使用权而支付的款项，此类款项无论在何时支付，均属于租赁付款额。\r\n\r\n【例题12】甲公司是一家大型零售企业，其2×25年度发生的相关交易或事项如下：\r\n\r\n2×25年1月1日，甲公司与乙公司签订商业用房租赁合同，向乙公司租入A大楼一至四层商业用房用于零售经营。根据租赁合同的约定，商业用房的租赁期为10年，自合同签订之日算起，乙公司有权在租赁期开始日5年以后终止租赁，但需向甲公司支付相当于6个月租金的违约金；每年租金为2500万元，于每年年初支付；如果甲公司每年商品销售收人达到或超过100000万元，甲公司还需支付经营分享收人100万元；租赁期到期后，甲公司有权按照每年2500万元续租5年；租赁结束移交商业用房时，甲公司需将商业用房恢复至最初乙公司交付时的状态。同日，甲公司向乙公司支付第一年租金2500万元。为获得该项租赁，甲公司向房地产中介支付佣金40万元。\r\n\r\n甲公司在租赁期开始时经评估后认为，其可以合理确定将行使续租选择权；预计租赁期结束商业用房恢复最初状态将发生成本60万元。甲公司对租人的使用权资产采用年限平均法自租赁期开始日计提折旧，预计净残值为零。\r\n\r\n其他有关资料：\r\n\r\n第一，甲公司无法确定租赁内含利率，其增量借款利率为6%。\r\n\r\n第二，年金现值系数:（P/A，6%，15）=9.7122，（P/A，6%，14）=9.2950，（P/A，6%,10）=7.3601，（P/A，6%，9）=6.8017；复利现值系数:（P/F，6%，15）=0.4173，（P/F，6%,14）=0.4423，（P/F，6%，10）=0.5584，（P/F，6%，9）=0.5919。\r\n\r\n第三，本题不考虑税费及其他因素。\r\n\r\n要求：\r\n\r\n（1）判断甲公司租人A大楼一至四层商业用房的租赁期，并说明理由。\r\n\r\n（2）计算甲公司尚未支付的租赁付款额及租赁负债的初始人账金额。\r\n\r\n（3）计算甲公司使用权资产的成本，并编制相关会计分录。\r\n\r\n## 答案\r\n\r\n## （1）租赁期为15年。\r\n\r\n理由：在租赁期开始日，甲公司（承租人）评估后认为可以合理确定将行使续租选择权，因此，租赁期确定为15年。\r\n\r\n（2）尚未支付的租赁付款额的初始入账金额=14×2500=35000（万元）；\r\n\r\n租赁负债的初始入账金额=2500×（P/A，6%，14）=23237.5（万元）。\r\n\r\n（3）使用权资产的成本=23237.5+2500+40+60×（P/F，6%，15）=25802.54（万元）。相关会计分录：\r\n\r\n## 二、后续计量\r\n\r\n考点难度●●〇 中\r\n\r\n## （一）租赁负债的后续计量5年热点丨4次\r\n\r\n## 1.计量基础\r\n\r\n在租赁期开始日后，承租人应当按以下原则对租赁负债进行后续计量：\r\n\r\n<table><tr><td rowspan=1 colspan=2>项目</td><td rowspan=1 colspan=1>会计处理</td></tr><tr><td rowspan=1 colspan=2>（1）确认租赁负债的利息时，增加租赁负债的账面金额</td><td rowspan=1 colspan=1>借：财务费用/在建工程等（期初租赁负债余额×折现率）贷：租赁负债一未确认融资费用</td></tr><tr><td rowspan=1 colspan=2>（2）支付租赁付款额时，减少租赁负债的账面金额</td><td rowspan=1 colspan=1>借：租赁负债一租赁付款额贷：银行存款</td></tr><tr><td rowspan=2 colspan=1>（3）因重估或租赁变更等原因导致租赁付款额发生变动时，重新计量租赁负债的账面价值</td><td rowspan=1 colspan=1>①当租赁负债增加时</td><td rowspan=1 colspan=1>借：使用权资产（租赁付款额现值的增加额）租赁负债一未确认融资费用（差额）贷：租赁负债一租赁付款额（租赁付款额的增加额）</td></tr><tr><td rowspan=1 colspan=1>②当租赁负债减少时（不包括租赁变更导致租赁范围缩小或租赁期缩短）</td><td rowspan=1 colspan=1>借：租赁负债一租赁付款额（租赁付款额的减少额）贷：使用权资产（租赁付款额现值的减少额）租赁负债一未确认融资费用（差额）若使用权资产的账面价值已调减至零，应当按仍需进一步调减的租赁付款额借记“租赁负债一租赁付款额”科目，按仍需进一步调减的租赁付款额现值贷记“主营业务成本”“制造费用”“销售费用”“管理费用”“研发支出”等科目，按其差额，贷记“租赁负债一未确认融资费用”科目</td></tr></table>\r\n\r\n## 点拨\r\n\r\n租赁负债期末余额=租赁负债期初余额+租赁负债本期产生的利息－本期支付的租赁 付款额±租赁负债调整额\r\n\r\n## 提示\r\n\r\n承租人应当按照固定的周期性利率计算租赁负债在租赁期内各期间的利息费用，并计入当期损益，但按照《企业会计准则第17号—借款费用》等其他准则规定应当计入相关资产成本的，从其规定。\r\n\r\n此处的周期性利率，是指承租人对租赁负债进行初始计量时所采用的折现率，或者因租赁付款额发生变动或因租赁变更而需按照修订后的折现率对租赁负债进行重新计量时，承租人所采用的修订后的折现率。\r\n\r\n## 2.租赁负债的重新计量\r\n\r\n在租赁期开始日后，当发生下列四种情形时，承租人应当按照变动后的租赁付款额的现值重新计量租赁负债，并相应调整使用权资产的账面价值。使用权资产的账面价值已调减至零，但租赁负债仍需进一步调减的，承租人应当将剩余金额计人当期损益。\r\n\r\n（1）实质固定付款额发生变动。\r\n\r\n如果租赁付款额最初是可变的，但在租赁期开始日后的某一时点转为固定，那么，在潜在可变性消除时，该付款额成为实质固定付款额，应纳人租赁负债的计量中。承租人应当按照变动后租赁付款额的现值重新计量租赁负债。在该情形下，承租人采用的折现率不变，即，采用租赁期开始日确定的折现率。\r\n\r\n（2）担保余值预计的应付金额发生变动。\r\n\r\n在租赁期开始日后，承租人应对其在担保余值下预计支付的金额进行估计。该金额发生变动的，承租人应当按照变动后租赁付款额的现值重新计量租赁负债。在该情形下，承租人采用的折现率不变。\r\n\r\n## 点拨 （1）和（2）租赁付款额发生变动，租赁期和折现率不变。\r\n\r\n【例题13】承租人甲公司与出租人乙公司签订了汽车租赁合同，租赁期为5年。合同中就担保余值的规定为：如果标的汽车在租赁期结束时的公允价值低于40000元，则甲公司需向乙公司支付40000元与汽车公允价值之间的差额，因此，甲公司在该担保余值下的最大敞口为40000元。在租赁期开始日，甲公司预计标的汽车在租赁期结束时的公允价值为40000元，即，甲公司预计在担保余值下将支付的金额为零。因此，甲公司在计算租赁负债时，与担保余值相关的付款额为零。\r\n\r\n在租赁期开始日后，承租人甲公司对该汽车在租赁期结束时的公允价值进行监测。假设在第1年年末，甲公司预计该汽车在租赁期结束时的公允价值为30000元。那么，甲公司应将该担保余值下预计应付的金额10000元（40000-30000）纳人租赁付款额，并使用不变的折现率重新计量租赁负债。\r\n\r\n## （3）用于确定租赁付款额的指数或比率发生变动。\r\n\r\n在租赁期开始日后，因浮动利率的变动而导致未来租赁付款额发生变动的，承租人应当按照变动后租赁付款额的现值重新计量租赁负债。在该情形下，承租人应采用反映利率变动的修订后的折现率进行折现。\r\n\r\n在租赁期开始日后，因用于确定租赁付款额的指数或比率（浮动利率除外）的变动而导致未来租赁付款额发生变动的，承租人应当按照变动后租赁付款额的现值重新计量租赁负债。在该情形下，承租人采用的折现率不变。\r\n\r\n## 点拨\r\n\r\n租赁付款额发生变动，租赁期不变，折现率不变。但浮动利率导致的变动，采用修订后的折现率。\r\n\r\n需要注意的是，仅当现金流量发生变动时，即租赁付款额的变动生效时，承租人才应重新计量租赁负债，以反映变动后的租赁付款额。承租人应基于变动后的合同付款额，确定剩余租赁期内的租赁付款额。\r\n\r\n【例题14】承租人甲公司签订了一项为期10年的不动产租赁合同，每年的租赁付款额为50000元，于每年年初支付。合同规定，租赁付款额在租赁期开始日后每两年基于过去24个月消费者价格指数的上涨进行上调。租赁期开始日的消费者价格指数为125。已知：（P/A，5%，7）=5.7864。\r\n\r\n假设在租赁第3年年初的消费者价格指数为135，甲公司在租赁期开始日采用的折现率为5%。在第3年年初，在对因消费者价格指数变化而导致未来租赁付款额的变动进行会计处理以及支付第3年的租赁付款额之前，租赁负债为339320元［即，50000+50000×（P/A，5%，7）]。经消费者价格指数调整后的租赁付款额为54000元（即，50000×135÷125）。\r\n\r\n分析）本例中，因用于确定租赁付款额的消费者价格指数的变动，而导致未来租赁付款额发生变动，甲公司应当于第3年年初重新计量租赁负债，以反映变动后的租赁付款额，即租赁负债应当以每年54000元的租赁付款额（剩余8期）为基础进行重新计量。\r\n\r\n  \r\n租赁负债增加=366466-339320=27146（元）\r\n\r\n在第3年年初，甲公司按以下金额重新计量租赁负债：每年54000元的租赁付款额按不变的折现率（即5%）进行折现，为366466元［即，54000+54000×（P/A，5%，7）]。因此，甲公司的租赁负债将增加27146元，即重新计量后的租赁负债（366466元）与重新计量前的租赁负债（339320元）之间的差额。不考虑其他因素，甲公司相关账务处理如下：\r\n\r\n借：使用权资产\r\n\r\n（4）购买选择权、续租选择权或终止租赁选择权的评估结果或实际行使情况发生变化。\r\n\r\n租赁期开始日后，发生下列情形的，承租人应采用修订后的折现率对变动后的租赁付款额进行折现，以重新计量租赁负债：\r\n\r\n①发生承租人可控范围内的重大事件或变化，且影响承租人是否合理确定将行使续租选择权或终止租赁选择权的，承租人应当对其是否合理确定将行使相应选择权进行重新评估。上述选择权的评估结果发生变化的，承租人应当根据新的评估结果重新确定租赁期和租赁付款额。前述选择权的实际行使情况与原评估结果不一致等导致租赁期变化的，也应当根据新的租赁期重新确定租赁付款额。\r\n\r\n②发生承租人可控范围内的重大事件或变化，且影响承租人是否合理确定将行使购买选择权的，承租人应当对其是否合理确定将行使购买选择权进行重新评估。评估结果发生变化的，承租人应根据新的评估结果重新确定租赁付款额。\r\n\r\n上述两种情形下，承租人在计算变动后租赁付款额的现值时，应当采用剩余租赁期间的租赁内含利率作为折现率；无法确定剩余租赁期间的租赁内含利率的，应当采用重估日的承租人增量借款利率作为折现率。\r\n\r\n## 点拨\r\n\r\na．可控范围内续租选择权或终止租赁选择权发生变化：租赁付款额和租赁期均发生变化，采用修订后的折现率折现；\r\n\r\nb.可控范围内购买选择权发生变化：租赁付款额变化，租赁期不变，采用修订后的折现率折现。\r\n\r\n【例题15·多选题】2×25年1月1日，承租人甲公司与出租人乙公司签订了一份办公  \r\n楼租赁合同，每年的租赁付款额为10万元，于每年年末支付。合同约定的不可撤销租赁期间  \r\n为5年，第5年末甲公司有权选择以每年10万元续租5年，或者以100万元购买该房产。甲  \r\n公司在租赁期开始时评估认为，可以合理确定将行使续租选择权，而不会行使购买选择权。  \r\n2×28年该房产所在地房价显著上涨，甲公司预计租赁期结束时该房产的市价为200万元，甲  \r\n公司在2×28年12月31日重新评估后认为，能够合理确定将行使上述购买选择权，而不会行  \r\n使上述续租选择权。2×29年12月31日甲公司实际行使了购买选择权。不考虑其他因素，甲  \r\n公司下列会计处理的表述中，正确的有（ ）。A．2×25年1月1日确定的租赁期为10年B.2×28年12月31日甲公司不需重新计量租赁负债C．2×29年12月31日应当终止确认使用权资产以及租赁负债，并将两者账面价值的差额调整取得固定资产的成本D.2×29年12月31日应当终止确认使用权资产以及租赁负债，并将两者账面价值的差额计人当期损益\r\n\r\n解析甲公司在租赁期开始时评估认为，可以合理确定将行使续租选择权，而不会行使购买选择权，因此将租赁期确定为10年，选项A正确；该房产所在地区的房价上涨属于市场情况发生的变化，不在甲公司的可控范围内，因此，虽然该事项导致购买选择权及续租选择权的评估结果发生变化，但甲公司不需重新计量租赁负债，选项B正确；企业行使租赁购买选择权导致租赁终止的，应当终止确认使用权资产以及租赁负债，并将两者账面价值的差额调整取得固定资产的成本，选项C正确，选项D错误。\r\n\r\n（二）使用权资产的后续计量 5年热点丨4次\r\n\r\n## 1.计量基础\r\n\r\n在租赁期开始日后，承租人应当采用成本模式对使用权资产进行后续计量，即以成本减累计折旧及累计减值损失计量使用权资产。\r\n\r\n承租人按照租赁准则有关规定重新计量租赁负债的，应当相应调整使用权资产的账面价值。\r\n\r\n2.使用权资产的折旧\r\n\r\n承租人应当参照《企业会计准则第4号——固定资产》有关折旧规定，自租赁期开始日起对使用权资产计提折旧。\r\n\r\n使用权资产通常应自租赁期开始的当月计提折旧，当月计提确有困难的，为便于实务操作，企业也可以选择自租赁期开始的下月计提折旧，但应对同类使用权资产采取相同的折旧政策。计提的折旧金额应根据使用权资产的用途，计人相关资产的成本或者当期损益。\r\n\r\n承租人在确定使用权资产的折旧方法时，应当根据与使用权资产有关的经济利益的预期消耗方式作出决定。通常，承租人按直线法对使用权资产计提折旧，其他折旧方法更能反映使用权资产有关经济利益预期消耗方式的，应采用其他折旧方法。\r\n\r\n承租人在确定使用权资产的折旧年限时，应遵循以下原则：承租人能够合理确定租赁期届满时取得租赁资产所有权的，应当在租赁资产剩余使用寿命内计提折旧；承租人无法合理确定租赁期届满时能够取得租赁资产所有权的，应当在租赁期与租赁资产剩余使用寿命两者孰短的\r\n\r\n期间内计提折旧。如果使用权资产的剩余使用寿命短于前两者，则应在使用权资产的剩余使用寿命内计提折旧。\r\n\r\n## 点拨\r\n\r\n折旧年限的选择：租赁期满取得资产所有权，应当在剩余使用寿命内计提折旧；否则按租赁资产剩余使用寿命、租赁期和使用权资产的剩余使用寿命敦短计提折旧。\r\n\r\n【例题16·单选题】2×25年6月30日，甲公司与乙公司签订租赁合同，从乙公司租  \r\n人一栋办公楼。根据租赁合同的约定，该办公楼不可撤销的租赁期为5年，租赁期开始日为  \r\n2×25年7月1日，月租金为25万元，于每月末支付，首3个月免付租金，在不可撤销的租  \r\n赁期到期后，甲公司拥有3年按市场租金行使的续租选择权。从2×25年7月1日起算，该办  \r\n公楼剩余使用寿命为30年。假定在不可撤销的租赁期结束时甲公司将行使续租选择权。不考  \r\n虑其他因素，甲公司对该办公楼使用权资产计提折旧的年限是（ ）。A.5年 B.8年 C.30年 D.4.75年\r\n\r\n（解析）承租人有续租选择权，且合理确定将行使该选择权的，租赁期还应当包括续租选择权涵盖的期间，因为不可撤销的租赁期结束时甲公司将行使续租选择权，所以甲公司应按8年（5+3）确认租赁期，同时，甲公司无法合理确定租赁期届满时是否能够取得租赁资产的所有权，应当在租赁期与租赁资产剩余使用寿命敦短期间内计提折旧，所以甲公司对该使用权资产按8年计提折旧。\r\n\r\n【例题17·多选题】下列各项中，应计提折旧或摊销的有（ ）。A.有特定产量限制的特许经营权  \r\nB.采用公允价值模式计量的已出租写字楼  \r\nC.处于更新改造过程而停止使用的厂房  \r\nD.承租人的使用权资产\r\n\r\n解析有特定产量限制的特许经营权或专利权，应采用产量法进行摊销，选项A正确；采用公允价值模式计量的投资性房地产不计提折旧和摊销，选项B不正确；更新改造过程中停用的固定资产会转入在建工程，不计提折旧，选项C不正确；承租人应当参照《企业会计准则第4号—固定资产》有关折旧规定，自租赁期开始日起对使用权资产计提折旧，选项D正确。\r\n\r\n## 3.使用权资产的减值\r\n\r\n在租赁期开始日后，承租人应当按照《企业会计准则第8号一资产减值》的规定，确定使用权资产是否发生减值，并对已识别的减值损失进行会计处理。\r\n\r\n（1）使用权资产发生减值。\r\n\r\n借：资产减值损失\r\n\r\n贷：使用权资产减值准备（应减记的金额）\r\n\r\n（2）使用权资产减值准备一经计提，不得转回。\r\n\r\n（3）承租人应当按照扣除减值损失之后的使用权资产的账面价值，计提后续折旧。\r\n\r\n## （三）租赁变更的会计处理\r\n\r\n租赁变更，是指原合同条款之外的租赁范围、租赁对价、租赁期限的变更，包括增加或终止一项或多项租赁资产的使用权，延长或缩短合同规定的租赁期等。租赁变更生效日是指双方就租赁变更达成一致的日期。\r\n\r\n\r\n\r\n\r\n\r\n## 点拨\r\n\r\n（1）租赁范围变更扩大了范围，相应调增使用权资产；\r\n\r\n（2）租赁范围变更缩小了范围，减少使用权资产以反映因租赁范围缩小而应终止的租赁部分，并确认与终止租赁相关的利得或损失。\r\n\r\n值得注意的是，租赁变更导致租赁期缩短至1年以内的，承租人应当调减使用权资产的账面价值，部分终止租赁的相关利得或损失记人“资产处置损益”科目。企业不得改按短期租赁进行简化处理或追溯调整。\r\n\r\n【例题18】承租人甲公司与出租人乙公司就2000平方米的办公场所签订了一项为期10年的租赁合同。在第6年年初，甲公司和乙公司同意对原租赁合同进行变更，以扩租同一办公楼内3000平方米的办公场所。扩租的场所于第6年第二季度末可供甲公司使用。增加的租赁对价与新增3000平方米办公场所的当前市价（根据甲公司获取的扩租折扣进行调整后的金额）相当。扩租折扣反映了乙公司节约的成本，即，若将相同场所租赁给新租户，乙公司将会发生的额外成本（如营销成本）。\r\n\r\n（分析）甲公司应当将该变更作为一项单独的租赁，与原来的10年期租赁分别进行会计处理。原因在于，该租赁变更通过增加3000平方米办公场所的使用权而扩大了租赁范围，并且增加的租赁对价与新增使用权的单独价格按该合同情况调整后的金额相当。据此，在新租赁的租赁期开始日（即第6年第二季度末），甲公司确认与新增3000平方米办公场所租赁相关的使用权资产和租赁负债。甲公司对原有2000平方米办公场所租赁的会计处理不会因为该租赁变更而进行任何调整。\r\n\r\n【例题19】承租人甲公司与出租人乙公司就5000平方米的办公场所签订了10年期的租赁合同。年租赁付款额为100000元，在每年年末支付。甲公司无法确定租赁内含利率。在租赁期开始日，甲公司的增量借款利率为6%，相应的租赁负债和使用权资产的初始确认金额均为736010元，即736010=100000×（P/A，6%，10）。在第6年年初，甲公司和乙公司同意对原租赁合同进行变更，即自第6年年初起，将原租赁场所缩减至2500平方米，每年的租赁付款额（自第6至10年）调整为60000元。甲公司在第6年年初的增量借款利率为5%，已知(P/A，6%，10）=7.3601;（P/A，6%，5）=4.2124;(P/A，5%，5）=4.3295。\r\n\r\n分析在租赁变更生效日（即第6年年初），甲公司基于以下情况对租赁负债进行重新计量：①剩余租赁期为5年；②年付款额为60000元；③采用修订后的折现率5%进行折现。据此，计算得出租赁变更后的租赁负债为259770元，即 259770=60000×（P/A，5%，5）。\r\n\r\n甲公司应基于原使用权资产部分终止的比例（即缩减的2500平方米占原使用权资产的50%)，来确定使用权资产账面价值的调减金额。在租赁变更之前，原使用权资产的账面价值为368005元（736010×5/10），50%的账面价值为184002.5元（原值368005元，使用权资产累计折旧184002.5元）；原租赁负债的账面价值为421240元[100000×（P/A，6%，5）]，50%的账面价值为210620元。因此，在租赁变更生效日（第6年年初）,甲公司终止确认50%的原使用权资产和原租赁负债，并将租赁负债减少额与使用权资产减少额之间的差额 26617.5元（210620-184002.5）作为利得计入当期损益。\r\n\r\n其中，租赁负债的减少额（210620元）包括：租赁付款额的减少额250000元（100000×50%×5），以及未确认融资费用的减少额39380元（250000-210620）。甲公司终止确认50%的原使用权资产和原租赁负债的账务处理为：\r\n\r\n借：租赁负债一租赁付款额 250000\r\n\r\n使用权资产累计折旧 184002.5\r\n\r\n贷：租赁负债一未确认融资费用 39380\r\n\r\n使用权资产 368005\r\n\r\n资产处置损益 26617.5\r\n\r\n此外，甲公司将剩余租赁负债（210620元）与变更后重新计量的租赁负债（259770元）之间的差额49150元，相应调整使用权资产的账面价值。其中，租赁负债的增加额（49150元）包括两部分：租赁付款额的增加额50000元［（60000-100000×50%）×5]，以及未确认融资费用的增加额850元（50000-49150）。甲公司调整使用权资产价值的账务处理为：\r\n\r\n借：使用权资产 49150\r\n\r\n租赁负债一未确认融资费用 850\r\n\r\n贷：租赁负债一租赁付款额 50000\r\n\r\n【例题20·多选题】2×25年，甲公司发生的有关交易或事项如下：（1）11月5日，从乙  \r\n公司租人一层商铺并开始装修，12月31日，商铺尚未达到预定可使用状态；（2）与丙公司签  \r\n订租赁变更协议，将原租赁到期日为2×26年3月31日的租人办公用房延期至2×26年9月  \r\n30日，月租金不变；（3）12月15日，与丁公司签订租赁变更协议，将原租赁到期日为2×27  \r\n年1月31日的设备租赁的租期缩短至2×26年6月30日。不考虑其他因素，甲公司2×25年  \r\n度会计处理的表述中，正确的有（ ）。A.将租人商铺的装修费计人使用权资产成本B.将办公用房的租赁期变更作为一项单独的租赁处理C．装修期间，对租人商铺确认的使用权资产计提折旧D.租赁变更导致租赁期缩短至1年以内的，企业不得改按短期租赁进行简化处理\r\n\r\n解析租入商铺的装修费应计入长期待摊费用，选项A错误；办公用房租赁变更未扩大租赁范围，不能作为一项单独的租赁处理，选项B错误；使用权资产应于取得当月开始计提折旧，装修期间应计提折旧，选项C正确；租赁变更导致租赁期缩短至1年以内的，承租人应当调减使用权资产的账面价值，部分终止租赁的相关利得或损失记入“资产处置损益”科目。企业不得改按短期租赁进行简化处理或追溯调整，选项D正确。\r\n\r\n解题攻略租赁变更通过增加一项或多项租赁资产的使用权而扩大了租赁范围且增加的对价与租赁范围扩大部分的单独价格按该合同情况调整后的金额相当，才可作为一项单独的租赁处理。\r\n\r\n## 问答 对租赁负债重新计量时，折现率如何选择？\r\n\r\n答：如下表所示。\r\n\r\n<table><tr><td rowspan=1 colspan=2>情形</td><td rowspan=1 colspan=1>折现率的选择</td></tr><tr><td rowspan=1 colspan=2>实质固定付款额发生变动</td><td rowspan=3 colspan=1>折现率不变，即采用租赁期开始日确定的折现率</td></tr><tr><td rowspan=1 colspan=2>担保余值预计的应付金额发生变动</td></tr><tr><td rowspan=2 colspan=1>用于确定租赁付款额的指数或比率发生变动</td><td rowspan=1 colspan=1>在租赁期开始日后，因用于确定租赁付款额的指数或比率（浮动利率除外）的变动而导致未来租赁付款额发生变动</td></tr><tr><td rowspan=1 colspan=1>在租赁期开始日后，因浮动利率的变动而导致未来租赁付款额发生变动</td><td rowspan=2 colspan=1>修订后的折现率</td></tr><tr><td rowspan=1 colspan=2>可控范围内的重大事件或变化导致购买选择权、续租选择权或终止租赁选择权的评估结果或实际行使情况发生变化</td></tr><tr><td rowspan=1 colspan=2>租赁变更不作为一项单独租赁处理</td><td rowspan=1 colspan=1>变更后的折现率</td></tr></table>\r\n\r\n## 三、短期租赁和低价值资产租赁\r\n\r\n考点难度●●○中\r\n\r\n对于短期租赁和低价值资产租赁，承租人可以选择不确认使用权资产和租赁负债。作出该选择的，承租人应当将短期租赁和低价值资产租赁的租赁付款额，在租赁期内各个期间按照直线法或其他系统合理的方法计人相关资产成本或当期损益。\r\n\r\n## （一）短期租赁\r\n\r\n短期租赁，是指在租赁期开始日，租赁期不超过12个月（1年）的租赁。当承租人与出租人签订租赁期为1年的租赁合同时，不能简单认为该租赁的租赁期为1年，而应当基于所有相关事实和情况判断可强制执行合同的期间以及是否存在实质续租、终止等选择权以合理确定租赁期。包含购买选择权的租赁，即使租赁期不超过12个月，也不属于短期租赁。\r\n\r\n对于短期租赁，承租人可以按照租赁资产的类别作出采用简化会计处理的选择。如果承租人对某类租赁资产作出了简化会计处理的选择，则该类资产下所有的短期租赁都应采用简化会计处理。某类租赁资产是指企业运营中具有类似性质和用途的一组租赁资产。\r\n\r\n按照简化会计处理的短期租赁发生租赁变更或者其他原因导致租赁期发生变化的，承租人应当将其视为一项新租赁，重新按照上述原则判断该项新租赁是否可以选择简化会计处理。\r\n\r\n【例题21·多选题】甲公司2×25年发生如下租赁业务：（1）甲公司从乙公司租入一栋办  \r\n公大楼，租赁期3年（2×25年1月1日至2×27年12月31日），2×25年6月30日，甲公  \r\n司和乙公司达成协议，修改租赁合同，将租赁期缩短至2×25年12月31日；（2）甲公司和丙  \r\n公司于2×25年1月1日就一台机器设备签订为期5年的租赁合同，2×27年1月1日签订一  \r\n项新协议，约定自2×29年12月31日开始对同一设备再租赁5年；（3）甲公司于2×25年1  \r\n月1日与丁公司签订一项租赁合同，初始租赁期为1年，如有一方撤销租赁将支付重大罚金，  \r\n1年期满后，如经双方同意租赁期可再延长2年，如有一方不同意将不再续期，没有罚金且预  \r\n计对交易双方带来的经济损失不重大；（4）甲公司于2×25年1月1日与戊公司签订一项租赁  \r\n期不超过12个月且包含购买选择权的租赁。不考虑其他因素，甲公司下列会计处理中错误的  \r\n有（）。A.与乙公司签订的租赁变更合同应按短期租赁处理B.与丙公司签订的租赁变更合同应作为一项单独租赁处理C.与丁公司签订的租赁合同的租赁期为1年D.与戊公司签订的租赁合同应按短期租赁处理\r\n\r\n(解析租赁变更导致租赁期缩短至1年以内的，承租人应当相应调减使用权资产的账面价值，并将部分终止或完全终止租赁的相关利得或损失计入当期损益，企业不得改按短期租赁进行简化处理或追溯调整，选项A错误；由于与丙公司签订的新协议没有增加一项或多项租赁资产的使用权，因此不能作为一项单独租赁处理，选项B错误；与丁公司签订的租赁合同，租赁期开始日的第1年有强制的权利和义务，是不可撤销期间；对于此后2年的延长期，因为承租人和出租人均可单方面选择不续约而无须支付任何罚金且预计对交易双方带来的经济损失不重大，该租赁不再可强制执行，即后续2年延长期非不可撤销期间；因此，该租赁合同在初始确认时应将租赁期确定为1年，选项C正确；包含购买选择权的租赁即使租赁期不超过12个月，也不属于短期租赁，选项D错误。\r\n\r\n## （二）低价值资产租赁\r\n\r\n低价值资产租赁，是指单项租赁资产为全新资产时价值较低的租赁。\r\n\r\n## 点拨\r\n\r\n符合低价值资产租赁的，也并不代表承租人若采取购入方式取得该资产时该资产不符合固定资产确认条件。\r\n\r\n承租人在判断是否是低价值资产租赁时，应基于租赁资产全新状态下的绝对价值进行评估，不受承租人规模、性质等影响，也不应考虑资产已被使用的年限以及该资产对于承租人或相关租赁交易的重要性。同时，低价值资产租赁还应当符合下列规定：承租人可从单独使用该资产或将其与承租人易于获得的其他资源一起使用中获利，且该资产与合同中的其他资产不存在高度依赖或高度关联关系。\r\n\r\n如果承租人已经或者预期要将该租赁资产进行转租赁，则不能将原租赁按照低价值资产租赁进行简化会计处理。\r\n\r\n【例题22·多选题】承租人甲公司与出租人乙公司签订了一份租赁合同，约定的租赁资产  \r\n包括：（1）IT设备，包括供员工个人使用的笔记本电脑、台式电脑、平板电脑、桌面打印机和  \r\n手机等；（2）服务器，其中包括增加服务器容量的单独组件，这些组件根据承租人需要陆续添  \r\n加到大型服务器以增加服务器存储容量；（3）办公家具，如桌椅和办公隔断等；（4）饮水机。  \r\n通常，办公笔记本电脑全新时的单独价格不超过人民币10000元，台式电脑、平板电脑、桌面  \r\n打印机和手机全新时的单独价格不超过人民币5000元，普通办公家具的单独价格不超过人民  \r\n币10000元，饮水机的单独价格不超过人民币1000元，服务器单个组件的单独价格不超过人  \r\n民币10000元。通常情况下，符合低价值资产租赁的资产全新状态下的绝对价值应低于人民币  \r\n40000元。不考虑其他因素，甲公司应按低价值资产租赁进行会计处理的有（ ）。A．IT设备 B.办公家具C.饮水机 D．服务器中的组件\r\n\r\n解析各种IT设备、办公家具、饮水机都能够单独使承租人获益，且与其他租赁资产没有高度依赖或高度关联关系，甲公司应将IT设备、办公家具、饮水机作为低价值资产租赁，选择按照简化方法进行会计处理。对于服务器中的组件，尽管单个组件的单独价格较低，但由于每个组件都与服务器中的其他部分高度相关，甲公司若不租赁服务器就不会租赁这些组件，不构成单独的租赁部分，因此不能作为低价值资产租赁进行会计处理。"},{"title":"第三节 出租人会计处理","content":"## 一、出租人的租赁分类5年热点丨2次\r\n\r\n考点难度●●○中\r\n\r\n## （一）融资租赁和经营租赁\r\n\r\n出租人应当在租赁开始日将租赁分为融资租赁和经营租赁。\r\n\r\n租赁开始日，是指租赁合同签署日与租赁各方就主要租赁条款作出承诺日中的较早者。租赁开始日可能早于租赁期开始日，也可能与租赁期开始日重合。\r\n\r\n一项租赁属于融资租赁还是经营租赁取决于交易的实质，而不是合同的形式。如果一项租赁实质上转移了与租赁资产所有权有关的几乎全部风险和报酬，出租人应当将该项租赁分类为融资租赁。出租人应当将除融资租赁以外的其他租赁分类为经营租赁。\r\n\r\n租赁开始日后，除非发生租赁变更，出租人无须对租赁的分类进行重新评估。租赁资产预计使用寿命、预计余值等会计估计变更，承租人按照原合同条款行使续租选择权或终止租赁选择权导致租赁期变化或发生承租人违约等情况变化的，出租人无需对相关租赁的分类进行重新评估。\r\n\r\n## （二）融资租赁的分类标准\r\n\r\n  \r\n一项租赁存在下列一种或多种情形的，通常分类为融资租赁：\r\n\r\n（1）在租赁期届满时，租赁资产的所有权转移给承租人。\r\n\r\n（2）承租人有购买租赁资产的选择权，所订立的购买价款预计将远低于行使选择权时租赁资产的公允价值，因而在租赁开始日就可以合理确定承租人将行使该选择权。\r\n\r\n（3）资产的所有权虽然不转移，但租赁期占租赁资产使用寿命的大部分。实务中，这里的“大部分”一般指租赁期占租赁开始日租赁资产使用寿命的75%以上（含75%）。\r\n\r\n（4）在租赁开始日，租赁收款额的现值几乎相当于租赁资产的公允价值。实务中，这里的“几乎相当于”，通常指90%以上。\r\n\r\n（5）租赁资产性质特殊，如果不作较大改造，只有承租人才能使用。\r\n\r\n## 二、出租人对融资租赁的会计处理\r\n\r\n考点难度●●难\r\n\r\n## （一）初始计量\r\n\r\n在租赁期开始日，出租人应当对融资租赁确认应收融资租赁款，并终止确认融资租赁资产。出租人对应收融资租赁款进行初始计量时，应当以租赁投资净额作为应收融资租赁款的人账价值。\r\n\r\n租赁投资净额为未担保余值和租赁期开始日尚未收到的租赁收款额按照租赁内含利率折现的现值之和。租赁内含利率，是指使出租人的租赁收款额的现值与未担保余值的现值之和等于租赁资产公允价值与出租人的初始直接费用之和的利率。因此，出租人发生的初始直接费用包括在租赁投资净额中，也包括在应收融资租赁款的初始人账价值中。\r\n\r\n租赁收款额图示如下：\r\n\r\n\r\n\r\n\r\n\r\n## 点拨\r\n\r\n第（1）～（4）项与租赁付款额相同；第（5）项不同，租赁付款额的说法是：根据承租人提供的担保余值预计应支付的款项。\r\n\r\n## 提示\r\n\r\n出租人向承租人收取的款项中包含增值税的，该增值税不属于租赁收款额的范畴，不应纳入应收融资租赁款的计量。出租人为确保承租人履行合同相关义务收取租赁保证金的，该租赁保证金不属于出租人的租赁收款额，出租人应当将其作为单独的负债进行会计处理，不应冲减应收融资租赁款。\r\n\r\n会计分录：\r\n\r\n## 1.租赁期开始日\r\n\r\n借：应收融资租赁款一租赁收款额（尚未收到的租赁收款额）一未担保余值（预计租赁期结束时的未担保余值）\r\n\r\n银行存款（已经收取的租赁款）\r\n\r\n贷：融资租赁资产（融资租赁方式租出资产的账面价值）\r\n\r\n资产处置损益（租出资产的公允价值与账面价值的差额，也可能在借方）\r\n\r\n银行存款（发生的初始直接费用）\r\n\r\n应收融资租赁款一未实现融资收益（差额）\r\n\r\n\r\n\r\n## 点拨 融资租赁资产、资产处置损益合在一起反映的是租出资产的公允价值。\r\n\r\n2.租赁保证金（以收到租赁保证金为租赁合同生效条件）的会计处理\r\n\r\n（1）出租人收到承租人交来的租赁保证金\r\n\r\n借：银行存款\r\n\r\n贷：其他应付款一租赁保证金\r\n\r\n\r\n\r\n## 提示\r\n\r\n融资租赁双方在签订某些租赁合同时，会就租赁保证金进行约定，即在租赁期开始日，承租人需向出租人支付租赁保证金，当承租人未能及时支付租金或出现其他违约情况时，出租人将抵扣租赁保证金；如果未发生违约，保证金用于抵扣末期租金，或期满之日予以退还。根据租赁合同条款，上述租赁保证金属于合同履约保证金，出租人不应冲减应收融资租赁款，而应当单独作为负债核算。\r\n\r\n（2）承租人到期不交租金，以保证金抵租金时\r\n\r\n借：其他应付款一租赁保证金\r\n\r\n贷：应收融资租赁款\r\n\r\n（3）承租人违约，按租赁合同或协议规定没收保证金时\r\n\r\n借：其他应付款一租赁保证金\r\n\r\n贷：营业外收人等\r\n\r\n## （二）融资租赁的后续计量\r\n\r\n出租人应当按照固定的周期性利率计算并确认租赁期内各个期间的利息收人。\r\n\r\n纳人出租人租赁投资净额的可变租赁付款额只包含取决于指数或比率的可变租赁付款额。在初始计量时，应当采用租赁期开始日的指数或比率进行初始计量。出租人应定期复核计算租赁投资总额时所使用的未担保余值。若预计未担保余值降低，出租人应修改租赁期内的收益分配，并立即确认预计的减少额。\r\n\r\n## 点拨\r\n\r\n出租人取得的未纳入租赁投资净额计量的可变租赁付款额，如与资产的未来绩效或使用情况挂钩的可变租赁付款额，应当在实际发生时计入当期损益。\r\n\r\n会计分录：\r\n\r\n（1）出租人应当按照固定的周期性利率计算并确认租赁期内各个期间的利息收人\r\n\r\n借：应收融资租赁款一未实现融资收益\r\n\r\n贷：租赁收人等\r\n\r\n（2）出租人收到租赁收款额\r\n\r\n借：银行存款\r\n\r\n贷：应收融资租赁款一租赁收款额\r\n\r\n## （三）融资租赁变更的会计处理\r\n\r\n融资租赁发生变更且同时符合下列条件的，出租人应当将该变更作为一项单独租赁进行会计处理：\r\n\r\n（1）该变更通过增加一项或多项租赁资产的使用权而扩大了租赁范围；\r\n\r\n（2）增加的对价与租赁范围扩大部分的单独价格按该合同情况调整后的金额相当。\r\n\r\n【例题23】承租人就某套机器设备与出租人签订了一项为期5年的租赁合同，构成融资租赁。在第2年年初，承租人和出租人同意对原租赁进行修改，再增加1套机器设备用于租赁，租赁期也为5年。扩租的设备从第2年第二季度末时可供承租人使用。租赁总对价的增加额与新增的该套机器设备的当前出租市价扣减相关折扣相当。其中，折扣反映了出租人节约的成本，即若将同样设备租赁给新租户出租人会发生的成本，如营销成本等。\r\n\r\n分析此情况下，该变更通过增加一项或多项租赁资产的使用权而扩大了租赁范围，增加的对价与租赁范围扩大部分的单独价格按该合同情况调整后的金额相当，应将该变更作为一项新的租赁。\r\n\r\n如果融资租赁的变更未作为一项单独租赁进行会计处理，且满足假如变更在租赁开始日生效，该租赁会被分类为经营租赁条件的，出租人应当自租赁变更生效日开始将其作为一项新租赁进行会计处理，并以租赁变更生效日前的租赁投资净额作为租赁资产的账面价值。\r\n\r\n如果融资租赁的变更未作为一项单独租赁进行会计处理，且满足假如变更在租赁开始日生效，该租赁会被分类为融资租赁条件的，出租人应当按照《企业会计准则第22号一金融工具确认和计量》第四十二条关于修改或重新议定合同的规定进行会计处理。即，修改或重新议定租赁合同，未导致应收融资租赁款终止确认，但导致未来现金流量发生变化的，应当重新计算该应收融资租赁款的账面余额，并将相关利得或损失计人当期损益。\r\n\r\n在融资租赁期间，如果承租人欠付租金，但租赁合同未发生变更的，出租人应继续按照原租赁合同进行相关会计处理，并按照《企业会计准则第22号—金融工具确认和计量》有关减值的规定对应收融资租赁款计提减值准备。\r\n\r\n## 三、出租人对经营租赁的会计处理\r\n\r\n考点难度○中\r\n\r\n<table><tr><td colspan=\"1\" rowspan=\"1\">项目</td><td colspan=\"1\" rowspan=\"1\">会计处理</td></tr><tr><td colspan=\"1\" rowspan=\"1\">租金的处理</td><td colspan=\"1\" rowspan=\"1\">在租赁期内各个期间，出租人应采用直线法或者其他系统合理的方法将经营租赁的租赁收款额确认为租金收人。如果其他系统合理的方法能够更好地反映因使用租赁资产所产生经济利益的消耗模式的，则出租人应采用该方法</td></tr><tr><td colspan=\"1\" rowspan=\"1\">出租人对经营租赁提供激励措施</td><td colspan=\"1\" rowspan=\"1\">出租人提供免租期的，出租人应将租金总额在不扣除免租期的整个租赁期内，按直线法或其他合理的方法进行分配，免租期内应当确认租金收入。出租人承担了承租人某些费用的，出租人应将该费用自租金收人总额中扣除，按扣除后的租金收入余额在租赁期内进行分配</td></tr><tr><td colspan=\"1\" rowspan=\"1\">初始直接费用</td><td colspan=\"1\" rowspan=\"1\">出租人发生的与经营租赁有关的初始直接费用应当资本化至租赁资产的成本，在租赁期内按照与租金收人相同的确认基础分期计人当期损益点拨  出租人将发生的与经营租赁有关的初始直接费用根据租赁资产不同，分别记入“固定资产”“投资性房地产”等会计科目，租赁期内按照与租赁收入相同的确认基础分期计入当期损益</td></tr><tr><td colspan=\"1\" rowspan=\"1\">折旧和减值</td><td colspan=\"1\" rowspan=\"1\">对于经营租赁资产中的固定资产，出租人应当采用类似资产的折旧政策计提折旧，折旧费计人其他业务成本等；对于其他经营租赁资产，应当根据该资产适用的企业会计准则，采用系统合理的方法进行摊销。出租人应当按照《企业会计准则第8号一资产减值》的规定，确定经营租赁资产是否发生减值，并对已识别的减值损失进行会计处理</td></tr><tr><td colspan=\"1\" rowspan=\"1\">可变租赁付款额</td><td colspan=\"1\" rowspan=\"1\">出租人取得的与经营租赁有关的可变租赁付款额，如果是与指数或比率挂钩的，应在租赁期开始日计人租赁收款额；除此之外的，应当在实际发生时计人当期损益</td></tr><tr><td>经营租赁的变更</td><td>经营租赁发生变更的，出租人应自变更生效日开始，将其作为一项新的租赁 进行会计处理，与变更前租赁有关的预收或应收租赁收款额视为新租赁的收 款额</td></tr></table>\r\n\r\n【例题24·单选题】2×25年1月1日，甲公司与乙公司签订租赁合同，将其一栋物业租  \r\n赁给乙公司作为商场使用。根据合同约定，物业的租金为每月50万元，于每季度末支付，租  \r\n赁期为5年，自合同签订日开始算起，租赁期首3个月为免租期，乙公司免予支付租金，如果  \r\n乙公司每年的营业收入超过10亿元，乙公司应向甲公司支付经营分享收人100万元。乙公司  \r\n2×25年度实现营业收入12亿元。甲公司认定上述租赁为经营租赁。不考虑增值税及其他因素，  \r\n上述交易对甲公司2×25年度营业利润的影响金额是（ ）万元。A. 570 B.600C. 700 D. 670\r\n\r\n解析甲公司收到与经营租赁有关但取决于指数或比率之外的可变租赁付款额，应在实际发生时计入当期损益，影响营业利润。上述交易对甲公司2×25年度营业利润的影响金额 $\\mathrm { ~ i ~ = ~ } \\left[ \\begin{array} { l }  5 0 \\times \\textbf { ( } 1 2 - 3 \\mathbf { ~ ) } + 5 0 \\times 1 2 \\times 4 \\right] / 5 + 1 0 0 = 6 7 0 \\textbf { ( } \\mathcal { F } \\mathcal { \\hat { T } } \\textbf { ) } , \\end{array}$\r\n\r\n解题攻略 免租金期间应确认租金收入。"},{"title":"第四节 特殊租赁业务的会计处理","content":"恭喜您解锁新章节！使用微信或“会计云课堂”App 扫码，过关更高效！\r\n\r\n\r\n\r\n## 一、转租赁\r\n\r\n考点难度●●难\r\n\r\n转租情况下，原租赁合同和转租赁合同通常都是单独协商的，交易对手也是不同的企业，转租出租人对原租赁合同和转租赁合同分别根据承租人和出租人的会计处理要求，进行会计处理。\r\n\r\n在对转租赁进行分类时，转租出租人应基于原租赁中产生的使用权资产，而不是租赁资产（如作为租赁对象的不动产或设备）进行分类。原租赁资产不归转租出租人所有，原租赁资产也未计入其资产负债表。因此，转租出租人应基于其控制的资产（即使用权资产）进行会计处理。\r\n\r\n原租赁为短期租赁，且转租出租人作为承租人已采用简化会计处理的，应将转租赁分类为经营租赁。\r\n\r\n例（真）题-答案」 24.D\r\n\r\n## 1.转租赁分类为融资租赁\r\n\r\n转租出租人的会计处理如下图所示：\r\n\r\n\r\n\r\n## 2.转租赁分类为经营租赁\r\n\r\n签订转租赁时，转租出租人在其资产负债表中继续保留与原租赁相关的租赁负债和使用权资产。在转租赁期间：\r\n\r\n（1）确认使用权资产的折旧费用和租赁负债的利息；\r\n\r\n（2）确认转租赁的租赁收人。\r\n\r\n## 二、生产商或经销商出租人的融资租赁会计处理\r\n\r\n考点难度●●难\r\n\r\n生产商或经销商通常为客户提供购买或租赁其产品或商品的选择。如果生产商或经销商出租其产品或商品构成融资租赁，则该交易产生的损益应相当于按照考虑适用的交易量或商业折扣后的正常售价直接销售租赁资产所产生的损益。\r\n\r\n构成融资租赁的，生产商或经销商出租人在租赁期开始日应当按照租赁资产公允价值与租赁收款额按市场利率折现的现值两者孰低确认收人，并按照租赁资产账面价值扣除未担保余值的现值后的余额结转销售成本，收人和销售成本的差额作为销售损益。\r\n\r\n由于取得融资租赁所发生的成本主要与生产商或经销商赚取的销售利得相关，生产商或经销商出租人应当在租赁期开始日将其计人损益。即，与其他融资租赁出租人不同，生产商或经销商出租人取得融资租赁所发生的成本不属于初始直接费用，不计人租赁投资净额。\r\n\r\n借：应收融资租赁款一租赁收款额\r\n\r\n贷：主营业务收人（租赁资产公允价值与租赁收款额按市场利率折现的现值两者敦低确 认收人） 应收融资租赁款一未实现融资收益\r\n\r\n借：主营业务成本（租赁资产账面价值扣除未担保余值的现值后的余额结转销售成本） 应收融资租赁款一未担保余值 贷：库存商品 应收融资租赁款一未实现融资收益\r\n\r\n借：销售费用（取得融资租赁所发生的成本）\r\n\r\n贷：银行存款\r\n\r\n【真题25·多选题】下列各项关于企业作为生产商出租人的融资租赁会计处理表述中正确的有（ ）。（2025年回忆版）A．按租赁资产公允价值与租赁收款额以市场利率折现的现值两者之间较高者确认营业收人B.将担保余值折现后的现值计人租赁投资净额C.按租赁资产账面价值扣除未担保余值后的余额计人营业成本D.将取得融资租赁合同所发生的直接相关成本计人当期销售费用\r\n\r\n解析在租赁期开始日，生产商或经销商出租人应当按照租赁资产公允价值与租赁收款额按市场利率折现的现值两者孰低确认收入，并按照租赁资产账面价值扣除未担保余值的现值后的余额结转销售成本，选项A和C均不正确。\r\n\r\n【例题26·多选题】甲生产商将其生产的产品以融资租赁的方式出租给乙公司，在租赁期  \r\n开始日，租赁资产公允价值为100万元，租赁收款额按市场利率折现的现值为98万元，租赁  \r\n资产账面价值为80万元，未担保余值的现值为2万元，为取得融资租赁发生的成本为1万元。  \r\n甲生产商下列会计处理中正确的有（ ）。A.在租赁期开始日应确认收人100万元B.在租赁期开始日应结转销售成本78万元C.为取得融资租赁发生的成本1万元计人当期损益D.该项租赁在租赁期开始日影响营业利润的金额为20万元\r\n\r\n（解析在租赁期开始日，该出租人应当按照租赁资产公允价值（100万元）与租赁收款额按市场利率折现的现值（98万元）两者孰低确认收入，即应确认收入98万元，选项A错误；按照租赁资产账面价值（80万元）扣除未担保余值的现值（2万元）后的余额结转销售成本，即结转销售成本78万元，选项B正确；生产商或经销商出租人为取得融资租赁发生的成本，应当在租赁期开始日计入当期损益，选项C正确；该项租赁在租赁期开始日影响营业利润的金额=98-78-1=19（万元），选项D错误。\r\n\r\n解题攻略) 生产商或经销商出租人为取得融资租赁发生的成本，不属于初始直接费用，不计入租赁投资净额，主要与生产商或经销商赚取的销售利得相关，应计入当期损益（销售费用）。\r\n\r\n## 三、售后租回交易的会计处理\r\n\r\n考点难度●难\r\n\r\n若企业（卖方兼承租人）将资产转让给其他企业（买方兼出租人），并从买方兼出租人租回该项资产，则卖方兼承租人和买方兼出租人均应按照售后租回交易的规定进行会计处理。企业应当按照《企业会计准则第14号—收入》的规定，评估确定售后租回交易中的资产转让是否属于销售，并区别进行会计处理。\r\n\r\n在资产的法定所有权转移给出租人并将资产租赁给承租人之前，承租人可能会先获得资产的法定所有权。但是，是否拥有资产的法定所有权本身并非会计处理的决定性因素。如果承租人在资产转移给出租人之前已经取得对资产的控制，则该交易属于售后租回交易。然而，如果承租人未能在资产转移给出租人之前取得对资产的控制，那么即便承租人在资产转移给出租人之前先获得资产的法定所有权，该交易也不属于售后租回交易。\r\n\r\n## （一）售后租回交易中的资产转让属于销售\r\n\r\n<table><tr><td>卖方兼承租人</td><td>买方兼出租人</td></tr><tr><td>应当按原资产账面价值中与租回获得的使用权有关的部分，计量售后租回所 形成的使用权资产，并仅就转让至买方兼出租人的权利确认相关利得或损失 点拨 销售市场价格中包含使用权、所有权和处置权等，使用权资产 的公允价值仅包含租赁期间的使用权。所以销售市场价格一定大于使用 权资产公允价值。售后租回所形成的使用权资产=原资产账面价值× （使用权资产公允价值÷销售市场价格） 提示 对于售后租回交易中的资产转让属于销售的交易，如果销售对价的公允价值与资</td><td>根据其他适用的企 业会计准则对资产 购买进行会计处 理，并根据租赁准 则对资产出租进行 会计处理</td></tr><tr><td colspan=\"2\">产的公允价值不同，或者出租人未按市场价格收取租金，企业应当进行以下调整： （1）销售对价低于市场价格的款项作为预付租金进行会计处理 （2）销售对价高于市场价格的款项作为买方兼出租人向卖方兼承租人提供的额外融资进行会 计处理 （3）承租人按照公允价值调整相关销售利得或损失，出租人按市场价格调整租金收入 在进行上述调整时，企业应当按以下二者中较易确定者进行 ①销售对价的公允价值与资产的公允价值的差异 ②合同付款额的现值与按市场租金计算的付款额的现值的差异</td></tr></table>\r\n\r\n## 问答 企业会计准则解释第17号：如何对售后租回交易进行会计处理？\r\n\r\n答：售后租回交易中的资产转让属于销售的，在租赁期开始日后，承租人应当按照《企业会计准则第21号—租赁》第二十条的规定对售后租回所形成的使用权资产进行后续计量，并按照《企业会计准则第21号—租赁》第二十三条至第二十九条的规定对售后租回所形成的租赁负债进行后续计量。\r\n\r\n会计准则解释17号：卖方兼承租人在对售后租回所形成的租赁负债按照《企业会计准则第21号—租赁》的规定进行后续计量时，确定租赁付款额或变更后租赁付款额的方式不得导致其确认与租回所获得的使用权有关的利得或损失，即使该租赁付款额或变更后租赁付款额包含不取决于指数或比率的可变租赁付款额。但租赁变更导致租赁范围缩小或租赁期缩短的，承租人仍应按规定将部分终止或完全终止租赁的相关利得或损失计入当期损益。\r\n\r\n例如，甲公司（卖方兼承租人）以1000万元的价格（设备在出售日的公允价值）向乙公司（买方兼出租人）出售一台设备。交易时该设备的账面价值为800万元。同时，甲公司签订租赁合同，从乙公司租回设备，租金为每年使用该设备产生收入的5%，甲公司预计该可变租赁付款额的现值为600万元。\r\n\r\n按一般租赁进行处理，对于并非取决于指数或比率的可变租赁付款额不纳入租赁负债，那么，该交易确认的租赁负债为零，确认的使用权资产也为零，该售后租回交易产生利得=1000-800=200（万元）。\r\n\r\n但企业应按企业会计准则解释17号要求进行特殊处理，租赁负债为600万元，使用权资产=800×（600/1000）=480（万元），处置收益=（1-600/1000）×（1000-800）=80（万元）。\r\n\r\n## 提示\r\n\r\n对于包含非取决于指数或比率的可变租赁付款额的售后租回交易，确定租赁负债和使用权资产有两种方法：\r\n\r\n（1）在租赁期开始日能够合理估计售后租回交易租赁期内各期预期租赁付款额，先计算租赁负债入账金额，然后确定使用权资产入账金额；\r\n\r\n（2）在租赁期开始日不能合理估计售后租回交易租赁期内各期预期租赁付款额，但能采用其他合理方法确定租回所保留的权利占比，先计算使用权资产入账金额，然后确定租赁负债入账金额。\r\n\r\n【例题27】甲公司与租赁有关资料如下：\r\n\r\n（1）2×23年1月1日，甲公司（卖方兼承租人，非金融企业）以7000万元的价格向乙公司（买方兼出租人，非金融企业）转让一栋建筑物，转让前该建筑物的账面原值为8000万元，累计折旧为2000万元，未计提减值准备。同日，甲公司与乙公司签订合同，取得该建筑物5年的使用权（全部剩余使用年限为20年），作为其总部管理人员的办公场所，年租金包括300万元固定租赁付款额和按当年销售总额的5%计算的可变租赁付款额，均于每年年末支付。\r\n\r\n（2）根据交易的条款和条件，甲公司转让该建筑物符合《企业会计准则第14号——收人》关于销售成立的条件。该建筑物转让当日的公允价值为7000万元。甲公司无法确定租赁内含利率，在租赁期开始日，甲公司的增量借款年利率为4%。\r\n\r\n（3）经预测甲公司5年内的销售总额分别为：\r\n\r\n<table><tr><td rowspan=1 colspan=1>年度</td><td rowspan=1 colspan=1>2×23年</td><td rowspan=1 colspan=1>2×24年</td><td rowspan=1 colspan=1>2×25年</td><td rowspan=1 colspan=1>2×26年</td><td rowspan=1 colspan=1>2×27年</td></tr><tr><td rowspan=1 colspan=1>销售额（万元）</td><td rowspan=1 colspan=1>2400</td><td rowspan=1 colspan=1>2500</td><td rowspan=1 colspan=1>2600</td><td rowspan=1 colspan=1>2700</td><td rowspan=1 colspan=1>2800</td></tr></table>\r\n\r\n（4）2×25年1月1日，经协商，双方同意将剩余3年的可变年租金变更为甲公司销售总额的4%，年固定租金不变，剩余3年预计的销售总额不变，当日甲公司的增量借款年利率为5%。\r\n\r\n（5）甲公司2×23年12月31日、2×24年12月31日和2×25年12月31日实际支付租赁付款额分别为430万元、436万元和416万元。\r\n\r\n其他资料:（1）已知：（P/F，4%，1）=0.9615，（P/F，4%，2）=0.9246，（P/F，4%，3）=0.8890,（P/F，4%，4）=0.8548,（P/F，4%，5）=0.8219,（P/F，5%，1）=0.9524,（P/F，5%,2）=0.9070，（P/F，5%，3）=0.8638。（2）甲公司自租赁期开始的当日对使用权资产采用直线法计提折旧。（3）本题不考虑相关税费和其他因素。\r\n\r\n要求：\r\n\r\n（1）计算2×23年1月1日租赁付款额的现值、售后租回所形成的使用权资产的初始计量金额、与转让至乙公司的权利相关的利得、未确认融资费用，并编制租赁期开始日的会计分录。\r\n\r\n（2）编制2×23年12月31日计提使用权资产折旧、确认租赁负债的利息和实际支付租金相关的会计分录。\r\n\r\n（3）编制2×24年12月31日计提使用权资产折旧、确认租赁负债的利息和实际支付租金相关的会计分录。\r\n\r\n（4）编制2×25年1月1日租赁变更的会计分录。\r\n\r\n（5）编制2×25年12月31日计提使用权资产折旧、确认租赁负债的利息和实际支付租金相关的会计分录。\r\n\r\n答案\r\n\r\n（1）①计算租赁付款额的现值。\r\n\r\n租赁付款总额=（300+2400×5%）+（300+2500×5%）+（300+2600×5%）+（300+2700 × 5%）+ （300+2800 ×5%）=420+425+430+435+440=2150（万元）。\r\n\r\n租赁付款额的现值=420×（P/F,4%，1）+425×（P/F，4%，2）+430×（P/F,4%,3）+435×（P/F，4%，4）+440×（P/F，4%，5）=1912.53（万元）。\r\n\r\n②确定售后租回所形成的使用权资产的初始计量金额。\r\n\r\n租回所保留的权利占比=租赁付款额的现值÷转让当日该建筑物的公允价值=1912.53 ÷ 7000 ×100%=27.3219% 。\r\n\r\n转让当日该建筑物的账面价值=8000-2000=6000（万元）。\r\n\r\n使用权资产=转让当日该建筑物的账面价值×租回所保留的权利占比=6000×27.3219%=1639.31（万元）。\r\n\r\n③计算与转让至乙公司的权利相关的利得。\r\n\r\n与转让至乙公司的权利相关的利得=转让该建筑物的全部利得－与该建筑物使用权相关的利得=（7000-6000）-（7000-6000）×27.3219%=726.78（万元）。\r\n\r\n④计算未确认融资费用。\r\n\r\n未确认融资费用=5年租赁付款总额-5年租赁付款额的现值=2150-1912.53=237.47（万元）。\r\n\r\n⑤会计分录：\r\n\r\n<table><tr><td>借：固定资产清理</td><td>6000</td></tr><tr><td>累计折旧</td><td>2000</td></tr><tr><td>贷：固定资产</td><td>8000</td></tr><tr><td>借：银行存款</td><td>7000</td></tr><tr><td>使用权资产</td><td>1639.31</td></tr><tr><td>租赁负债一未确认融资费用</td><td>237.47</td></tr><tr><td>贷：固定资产清理 租赁负债一租赁付款额</td><td>6000</td></tr><tr><td></td><td>2150</td></tr><tr><td>资产处置损益</td><td>726.78</td></tr></table>\r\n\r\n（2）2×23年12月31日\r\n\r\n①使用权资产本期折旧额=1639.31÷5=327.86（万元）。\r\n\r\n借：管理费用 327.86\r\n\r\n贷：使用权资产累计折旧 327.86\r\n\r\n②租赁负债的利息=1912.53×4%=76.50（万元）。\r\n\r\n借：财务费用 76.50\r\n\r\n贷：租赁负债一未确认融资费用 76.50\r\n\r\n③确认本期实际支付的租金，并按租赁期开始日已纳入租赁负债初始计量的当期租赁付款额减少租赁负债的账面金额，两者的差额计入当期损益。\r\n\r\n2×23年12月31日，甲公司实际支付租金430万元，与已纳入租赁负债初始计量的当期租赁付款额（即租赁期开始日估计的当期预期租赁付款额）420万元的差额为10万元，计入当期损益。\r\n\r\n借：租赁负债一租赁付款额 420\r\n\r\n管理费用 10\r\n\r\n贷：银行存款 430\r\n\r\n（3）2×24年12月31日\r\n\r\n①使用权资产本期折旧额=1639.31÷5=327.86（万元）。\r\n\r\n借：管理费用 327.86\r\n\r\n贷：使用权资产累计折旧 327.86\r\n\r\n②租赁负债的利息=（1912.53+76.50-420）×4%=62.76（万元）。\r\n\r\n借：财务费用 62.76\r\n\r\n贷：租赁负债一未确认融资费用 62.76\r\n\r\n③本期实际支付的租金。\r\n\r\n2×24年12月31日，甲公司实际支付租金436万元，与已纳入租赁负债初始计量的当期租赁付款额（即租赁期开始日估计的当期预期租赁付款额）425万元的差额为11万元，计入当期损益。\r\n\r\n借：租赁负债一租赁付款额 425  \r\n管理费用 11  \r\n贷：银行存款 436\r\n\r\n（4）2×25年1月1日变更后剩余租赁付款总额=（300+2600×4%）+（300+2700×4%）+（300+2800×4%）=404+408+412=1224（万元），变更前剩余租赁付款总额=430+435+440=1305（万元），变更日租赁付款总额减少=1305-1224=81（万元）。\r\n\r\n2×25年1月1日变更后租赁付款额的现值=404×（P/F，5%，1）+408×（P/F，5%，  \r\n2）+412×（P/F，5%，3）=1110.71（万元），变更前租赁付款额的现值=1912.53+76.50-  \r\n420+62.76-425=1206.79（万元）,变更日租赁负债减少=1206.79-1110.71=96.08（万元）。变更日未确认融资费用增加=96.08-81=15.08（万元）。\r\n\r\n变更日减少使用权资产账面价值96.08万元，变更后使用权资产账面价值=1639.31-327.86×2-96.08=887.51（万元）。\r\n\r\n借：租赁负债一租赁付款额 81\r\n\r\n$$\r\n- \\neq \\infty , \\neq \\infty , \\neq \\frac { \\sqrt { 5 } } { 1 2 } , \\neq \\frac { \\sqrt { 5 } } { 1 2 } , \\neq \\frac { \\sqrt { 5 } } { 1 2 }\r\n$$\r\n\r\n贷：使用权资产 96.08\r\n\r\n（5）2×25年12月31日\r\n\r\n①使用权资产本期折旧额=887.51÷3=295.84（万元）。\r\n\r\n借：管理费用\r\n\r\n贷：使用权资产累计折旧\r\n\r\n②租赁负债的利息=1110.71×5%=55.54（万元）。\r\n\r\n借：财务费用\r\n\r\n贷：租赁负债一未确认融资费用\r\n\r\n③本期实际支付的租金。\r\n\r\n2×25年12月31日，甲公司实际支付租金416万元，与变更日估计的当年预计支付租金404万元的差额为12万元，计入当期损益。借：租赁负债一租赁付款额 404管理费用 12贷：银行存款 416\r\n\r\n【例题28·多选题】2×25年1月1日甲公司以5000万元出售一栋账面价值为4000万元、  \r\n剩余使用寿命为20年的建筑物，同时约定租回5年，出售建筑物符合收人准则规定的销售成  \r\n立的条件，租金按甲公司年销售收入的20%于每年年末支付，假设每年估计的销售收人相同。  \r\n该建筑物转让当日的公允价值为5000万元。甲公司无法确定租赁内含利率，在租赁期开始日，  \r\n甲公司的增量借款年利率为4%。企业按一定方法确定的该交易中租回所保留的权利占比为  \r\n25%。已知：（P/A，4%，5）=4.4518。假设不考虑相关税费和其他因素，甲公司下列会计处理  \r\n中正确的有（）。A．2×25年1月1日使用权资产入账金额为1000万元B.2×25年1月1日租赁负债的金额为1250万元C.每期期末租赁付款额为280.79万元D．2×25年1月1日未确认融资费用为153.95万元\r\n\r\n解析)2×25年1月1日使用权资产入账金额 $= 4 0 0 0 \\times 2 5 \\% = 1 0 0 0 ( \\pi )$ ，选项A正确；租赁负债 $= 5 0 0 0 \\times 2 5 \\% = 1 2 5 0$ （万元），选项B正确；每期期末租赁付款额 $= 1 2 5 0 \\div$ $\\left( \\mathrm { P } / \\mathrm { A } , \\ 4 \\% , \\ 5 \\right) = 2 8 0 . 7 9 \\ \\left( \\mathrm { \\mathcal { F } } \\hat { \\pi } \\right)$ ，选项C正确；2×25年1月1日未确认融资费用 ${ \\bf - 2 8 0 . 7 9 \\times }$ $5 - 1 2 5 0 = 1 5 3 . 9 5 ( \\pi )$ ，选项D正确。\r\n\r\n（二）售后租回交易中的资产转让不属于销售\r\n\r\n<table><tr><td>卖方兼承租人</td><td>买方兼出租人</td></tr><tr><td>不终止确认所转让的资产，而应当将收到的对 价作为金融负债，并按照《企业会计准则第 22 号 金融工具确认和计量》进行会计处理</td><td>不确认被转让资产，而应当将支付的对价作为 金融资产，并按照《企业会计准则第22号 金融工具确认和计量》进行会计处理</td></tr></table>"}],"quizGroups":[{"type":"单项选择题","questions":[{"num":1,"text":"甲公司于2×25年1月1日租入一栋办公楼，租赁期为3年，甲公司按年销售额的5%支付租金，租金于次年1月1日支付。合同规定，租金每年最低为200万元，最高为300万元。甲公司2×25年销售额的最佳估计数为5000万元。假定甲公司增量借款年利率为6%，已知（P/A，6%，3）=2.6730。不考虑其他因素，甲公司租赁期开始日应确认的租赁负债是（）万元。","options":[{"letter":"A","text":"534.6"},{"letter":"B","text":"0"},{"letter":"C","text":"600"},{"letter":"D","text":"801.9"}],"answer":"A","explanation":"实质固定付款额是指在形式上可能包含变量但实质上无法避免的付款额。承租人有多套可行的付款额方案，但必须选择其中一套。在此情况下，承租人应采用总折现金额最\n低的一套作为租赁付款额，即租赁付款额=200×3=600（万元），应确认租赁负债=200×2.6730=534.6（万元）。"},{"num":2,"text":"承租人甲公司于2×25年1月1日与出租人乙公司签订了汽车租赁合同，每年年末支付租金10万元，租赁期为4年，甲公司确定租赁内含利率为5%。合同中就担保余值的规定为：如果标的汽车在租赁期结束时的公允价值低于8万元，则甲公司需向乙公司支付8万元与汽车公允价值之间的差额，在租赁期开始日，甲公司预计标的汽车在租赁期结束时的公允价值为6万元。已知（P/A，5%，4）=3.5460，（P/F，5%，4）=0.8227。2×25年1月1日，甲公司应确认的租赁负债是（ ）万元。","options":[{"letter":"A","text":"42.04"},{"letter":"B","text":"40.40"},{"letter":"C","text":"35.46"},{"letter":"D","text":"37.11"}],"answer":"D","explanation":"使用权资产应当按照成本进行初始计量。该成本包括：（1）租赁负债的初始计量金额；（2）在租赁期开始日或之前支付的租赁付款额，存在租赁激励的，扣除已享受的租赁激励相关金额；（3）承租人发生的初始直接费用；（4）承租人为拆卸及移除租赁资产、复原租赁资产所在场地或将租赁资产恢复至租赁条款约定状态预计将发生的成本的现值。承租人为使租赁资产达到企业计划用途所发生的运输、安装费用，与达成租赁无关，不属于承租人的初始直接费用，不应计入使用权资产成本。该项使用权资产的初始成本=40+200+3-1=242（万元）。"},{"num":3,"text":"某项资产租赁，甲公司租赁期开始日之前支付的租赁付款额为40万元，租赁期开始日尚未支付的租赁付款额的现值为200万元，甲公司为使租赁资产达到企业计划用途所发生的运输、安装费用5万元，甲公司为将租赁资产恢复至租赁条款约定状态预计将发生成本的现值为3万元，已享受的租赁激励为1万元。甲公司该项使用权资产的初始成本是（）万元。","options":[{"letter":"A","text":"245"},{"letter":"B","text":"240"},{"letter":"C","text":"242"},{"letter":"D","text":"247"}],"answer":null,"explanation":null},{"num":4,"text":"甲公司与出租人就1000平方米的办公场所签订了一项为期10年的租赁合同。在第6年年初，甲公司和出租人同意对原租赁剩余的5年租赁合同进行修改，以扩租同一建筑物内800平方米的办公场所。扩租的场所于第6年第二季度末时可供甲公司使用。租赁总对价的增加额与新增800平方米办公场所的当前市价根据甲公司所获折扣进行调整后的金额相当，该折扣反映了出租人节约的成本，即将相同场所租赁给新租户则出租人会发生的额外成本（如营销成本）。下列会计处理表述中，正确的是（ ）。","options":[{"letter":"A","text":"甲公司对原来的1000平方米办公场所租赁的会计处理应进行调整"},{"letter":"B","text":"甲公司将该修改作为一项单独的租赁"},{"letter":"C","text":"甲公司应将原1000平方米和新增800平方米的租赁合并为一项租赁"},{"letter":"D","text":"甲公司应对租赁总对价增加额进行追溯调整"}],"answer":"B","explanation":"修改授予了甲公司使用租赁资产的新增权利，租赁对价的增加额与新增使用权的单独价格按合同情况进行调整后的金额相当，因此甲公司应将该修改作为一项单独的租赁，与原来的1000平方米租赁分别进行会计处理，选项B正确。"},{"num":5,"text":"2×25年7月1日，甲公司与乙公司签订了一项写字楼租赁合同，甲公司将该写字楼以经营租赁方式出租给乙公司。合同约定，租赁期为2×25年7月1日至2×26年6月30日，租赁期前2个月免收租金，后10个月每月收取租金20万元，此外，甲公司承担了本应由乙公司负担的电子灯牌制作安装费8万元。甲公司按直线法确认租金收人。不考虑其他因素，甲公司2×25年度应确认的租金收人是（）万元。","options":[{"letter":"A","text":"200"},{"letter":"B","text":"96"},{"letter":"C","text":"64"},{"letter":"D","text":"120"}],"answer":"B","explanation":"出租人提供免租期的，出租人应将租金总额在不扣除免租期的整个租赁期内，按直线法或其他合理的方法进行分配，免租期内应当确认租金收入。出租人承担了承租人某些费用的，出租人应将该费用自租金收人总额中扣除，按扣除后的租金收人余额在租赁期内进行分配。甲公司2×25年度应确认的租金收人=（20×10-8）/12×6=96（万元）。"},{"num":6,"text":"2×25年1月1日，甲公司与乙公司签订租赁合同，将其一栋物业租赁给乙公司作为商场使用。根据合同约定，物业的租金为每月100万元，于每季末支付，租赁期为5年，自合同签订日开始算起，租赁期首3个月为免租期，乙公司免予支付租金，如果乙公司每年的营业收入超过10亿元，乙公司应向甲公司支付经营分享收人200万元。乙公司2×25年度实现营业收入11亿元。甲公司认定上述租赁为经营租赁，甲公司发生的初始直接费用为10万元。不考虑增值税及其他因素，上述交易对甲公司2×25年度营业利润的影响金额是）万元。","options":[{"letter":"A","text":"1340"},{"letter":"B","text":"1330"},{"letter":"C","text":"1138"},{"letter":"D","text":"1338"}],"answer":"D","explanation":"甲公司收到的经营分享收入应当在实际发生时计入当期损益，影响营业利润，免租金期间应确认租金收人。甲公司发生的初始直接费用在租赁期内按照与租金收人相同的确认基础分期计入当期损益。上述交易对甲公司2×25年度营业利润的影响金额=［100×(12-3）+100×12×4]/5-10/5+200=1338（万元）。"},{"num":7,"text":"转租赁中转租出租人将转租赁分类为融资租赁的，下列表述中错误的是（ ）。","options":[{"letter":"A","text":"终止确认与原租赁相关的使用权资产，并确认转租赁投资净额"},{"letter":"B","text":"将使用权资产与转租赁投资净额之间的差额确认为损益"},{"letter":"C","text":"在资产负债表中保留原租赁的租赁负债，该负债代表应付原租赁出租人的租赁付款额现值"},{"letter":"D","text":"在转租期间，要确认转租赁的融资收益，但不需确认利息费用"}],"answer":"D","explanation":"在转租期间，转租出租人既要确认转租赁的融资收益，也要确认原租赁的利息费用。"}]},{"type":"多项选择题","questions":[{"num":1,"text":"关于租赁期，下列各项表述中正确的有（ ）。","options":[{"letter":"A","text":"某项房屋出租，出租人于2×25年1月1日将房屋钥匙交付承租人，承租人在收到钥匙后，就可以自主安排房屋装修，并安排搬迁。合同约定有3个月的免租期，起租日为2×25年4月1日，承租人自起租日开始支付租金。租赁期开始日为2×25年1月1日"},{"letter":"B","text":"承租人签订了一份设备租赁合同，包括5年不可撤销期限和2年固定价格续租选择权，续租选择权期间的合同条款和条件与市价接近，没有终止罚款或其他因素表明承租人合理确定将行使续租选择权，此项租赁在租赁期开始日确定租赁期为7年"},{"letter":"C","text":"承租人签订了一份建筑租赁合同，包括6年不可撤销期限和3年按照市价行使的续租选择权。在搬入该建筑之前，承租人花费了大量资金对租赁建筑进行了改良，预计在6年不可撤销期限结束时租赁资产改良仍将具有重大价值，且该价值仅可通过继续使用租赁资产实现，因此在租赁期开始日，确定租赁期为9年"},{"letter":"D","text":"承租人与出租人签订了一份租赁合同，约定自租赁期开始日3年内不可撤销，如果撤销，双方将支付重大罚金，3年期满后，经双方同意可再延长1年，如有一方不同意，将不再续期，且没有罚款。承租人对于租赁资产并不具有重大依赖。此项租赁不可撤销期间为3年"}],"answer":"ACD","explanation":"选项A，由于承租人自2×25年1月1日起就已拥有对房屋使用权的控制，因此租赁期开始日为2×25年1月1日，即租赁期包含出租人给予承租人的免租期；选项B，因没有终止罚款或其他因素表明承租人合理确定将行使续租选择权，续租期不应包括在内，因此租赁期为5年；选项C，承租人合理确定将行使续租选择权，因为如果在6年不可撤销期限结束时放弃租赁改良资产，将蒙受重大经济损失。因此，在租赁期开始日，承租人确定租赁期为9年；选项D，自租赁期开始日起3年内有强制的权利和义务，是不可撤销期间。而此后1年的延长期并非不可撤销期间，因为承租人和出租人均可单方面选择不续约而无须支付任何罚款，因此不可撤销期间为3年。"},{"num":2,"text":"下列各项中，构成租赁付款额的有（ ）。","options":[{"letter":"A","text":"固定付款额及实质固定付款额，存在租赁激励的，扣除租赁激励相关金额"},{"letter":"B","text":"取决于指数或比率的可变租赁付款额"},{"letter":"C","text":"行使终止租赁选择权需支付的款项，前提是租赁期反映出承租人将行使终止租赁选择权"},{"letter":"D","text":"承租人担保余值下的最大口"}],"answer":"ABC","explanation":"根据承租人提供的担保余值预计应支付的款项计人租赁付款额，选项D错误。"},{"num":3,"text":"下列各项承租人与出租人签订的租赁合同中，承租人不能选择简化会计处理模式，需要确认使用权资产和租赁负债的有（ ）。","options":[{"letter":"A","text":"甲租赁合同为办公家具租赁合同，办公家具全新时为低价值资产，承租人计划将该办公家具连同自有房屋一起转租给第三方"},{"letter":"B","text":"乙租赁合同为设备租赁合同，合同中约定的不可撤销租赁期为6个月，且承租人拥有在租赁期结束时购买该租赁设备的选择权，购买价格明显低于预计行使选择权时该设备的公允价值"},{"letter":"C","text":"丙租赁合同为服务器及其组件租赁合同，合同中包括8项全新低价值的单独组件，承租人计划将单独组件分别添加到服务器中以增加存储容量"},{"letter":"D","text":"丁租赁合同为车辆租赁合同，合同中约定的不可撤销租赁期为9个月且承租人拥有5个月的续租选择权，承租人在租赁期开始日可合理确定将行使该续租选择权"}],"answer":"ABCD","explanation":"选项A，承租人计划将该办公家具连同自有房屋一起转租给第三方，包含了预期的转租赁，所以不能将原租赁按照低价值资产租赁选择简化会计处理模式；选项B，该租赁包含购买选择权，不属于短期租赁，不能选择简化会计处理模式；选项C，服务器组件尽管单个组件的价值较低，但由于组件添加至服务器中可以增加存储容量，使得承租人从服务器中获利，组件与服务器高度关联，因此不能作为低价值资产租赁选择简化会计处理模式；选项D，不可撤销租赁期为9个月，承租人在租赁期开始日可合理确定将行使5个月的续租选择权，在此情况下，承租人确定租赁期为14个月，不属于短期租赁，承租人不能选择简化会计处理模式。"},{"num":4,"text":"甲公司2×25年发生的下列各项支出或费用中，应直接计人当期损益的有（ ）。","options":[{"letter":"A","text":"出租人以经营租赁方式出租资产发生的初始直接费用"},{"letter":"B","text":"采购人库后的原材料在发出前发生仓储费20万元（非为达到下一生产阶段必需支出）"},{"letter":"C","text":"长期租人生产线支付与签订租赁合同相关的律师费6万元"},{"letter":"D","text":"向咨询机构支付市场调研费30万元"}],"answer":"BD","explanation":"选项A，应当资本化至租赁资产的成本；选项C，长期租入生产线支付与签订租赁合同相关的律师费应计人使用权资产成本。"},{"num":5,"text":"2×25年1月1日，甲公司签订了一项为期10年的不动产租赁合同，每年的租赁付款额为500万元，于每年年初支付。合同规定，租赁付款额每两年基于过去24个月消费者价格指数的上涨上调一次。租赁期开始日的消费者价格指数为125。不考虑初始直接费用。租赁内含利率无法直接确定，甲公司的增量借款年利率为5%，该利率反映的是甲公司以类似抵押条件借人期限为10年、与使用权资产等值的相同币种的借款而必须支付的固定利率。在租赁期开始日，甲公司支付第一年的租赁付款额，并以剩余9年每年付款额500万元按年利率5%折现的现值3553.9万元计量租赁负债。甲公司预计在整个租赁期内平均地消耗该使用权资产的未来经济利益，因此按直线法对使用权资产计提折旧。租赁第三年年初的消费者价格指数为135。不考虑其他因素，甲公司下列会计处理表述中，正确的有(）。","options":[{"letter":"A","text":"租赁期开始日使用权资产人账金额为4053.9万元"},{"letter":"B","text":"2×25年甲公司确认的利息费用为177.70万元"},{"letter":"C","text":"甲公司第二年年末使用权资产的账面价值为3243.12万元"},{"letter":"D","text":"经消费者价格指数调整后的第三年租赁付款额为540万元"}],"answer":"ABCD","explanation":"租赁期开始日使用权资产入账金额=500+3553.9=4053.9（万元），选项A正确；2×25年甲公司确认的利息费用 $= 3 5 5 3 . 9 \\times 5 \\% = 1 7 7 . 7 0 ( \\overline { { \\mathcal { H } } } \\overline { { \\mathcal { D } } } )$ ，选项B正确；甲公司第二年年末使用权资产的账面价值 $= 4 0 5 3 . 9 - 4 0 5 3 . 9 \\div 1 0 \\times 2 = 3 2 4 3 . 1 2$ （万元），选项C正确；经消费者价格指数调整后的第三年租赁付款额 $= 5 0 0 \\times 1 3 5 \\div 1 2 5 = 5 4 0$ （万元），选项D正确。"},{"num":6,"text":"2×25年1月1日，甲公司与乙公司签订商业用房租赁合同，从乙公司租人A大楼一层商业用房用于零售经营。根据租赁合同的约定，商业用房的租赁期为10年，自合同签订之日算起，乙公司有权在租赁期开始日5年以后终止租赁，但需向甲公司支付相当于6个月租金的违约金；每年租金为1000万元，于每年年初支付。租赁期满后，甲公司有权按照每年1000万元续租5年；租赁期结束移交商业用房时，甲公司需将商业用房恢复至最初乙公司交付时的状态。同日，甲公司向乙公司支付第一年租金1000万元。为获得该项租赁，甲公司向房地产中介支付佣金20万元。甲公司在租赁期开始日经评估后认为，其可以合理确定将行使续租选择权；预计租赁期结束商业用房恢复最初状态将发生成本50万元。甲公司对租人的使用权资产采用直线法自租赁期开始日起计提折旧，预计净残值为零。甲公司无法确定租赁内含利率，其增量借款年利率为6%。已知年金现值系数：（P/A，6%，15）=9.7122，（P/A，6%，14）=9.2950，（P/A，6%，10）=7.3601，（P/A，6%，9）=6.8017；复利现值系数:（P/F，6%，15）=0.4173，（P/F，6%，14）=0.4423，（P/F，6%，10）=0.5584，（P/F，6%，9）=0.5919。假定不考虑税费及其他因素，甲公司下列会计处理中正确的有（ ）。","options":[{"letter":"A","text":"租赁期为15年"},{"letter":"B","text":"租赁负债的初始人账金额为9295万元"},{"letter":"C","text":"使用权资产的初始人账成本为10335.87万元"},{"letter":"D","text":"2×25年度租赁负债的利息费用为600万元"}],"answer":"ABC","explanation":"在租赁期开始日，甲公司（承租人）评估后认为可以合理确定将行使续租选择权，因此，租赁期确定为15年，选项A正确；租赁负债的初始入账金额 $= 1 0 0 0 \\times \\mathrm { ~ ( ~ P / A ~ , ~ ~ } 6 \\%$ $1 4 { \\it \\Delta \\phi } = 1 0 0 0 \\times 9 . 2 9 5 0 = 9 2 9 5$ （万元），选项B正确；使用权资产的成本 $= 1 0 0 0 + 9 2 9 5 + 2 0 + 5 0 \\times$ （P/F，6%，15）=10335.87（万元），选项C正确；甲公司 $2 \\times 2 5$ 年度租赁负债的利息费用=$9 2 9 5 \\times 6 \\% = 5 5 7 . 7 ( \\overline { { \\mathcal { H } } } \\overline { { \\mathcal { T } } } )$ ，选项D错误。"},{"num":7,"text":"关于短期租赁和低价值资产租赁，下列项目中正确的有（ ）。","options":[{"letter":"A","text":"包含购买选择权的期限为10个月的租赁属于短期租赁"},{"letter":"B","text":"低价值资产租赁的判定受承租人规模、性质的影响"},{"letter":"C","text":"对于短期租赁和低价值资产租赁，承租人可以选择不确认使用权资产和租赁负债"},{"letter":"D","text":"承租人可以将短期租赁和低价值资产租赁的租赁付款额，在租赁期内各个期间按照直线法或其他系统合理的方法计人相关资产成本或当期损益"}],"answer":"CD","explanation":"包含购买选择权的租赁不属于短期租赁，选项A错误；低价值资产租赁的判定仅与资产全新状态下的绝对价值有关，不受承租人规模、性质或其他情况影响，选项B错误。"},{"num":8,"text":"关于出租人对经营租赁的会计处理，下列表述中正确的有（ ）。","options":[{"letter":"A","text":"在租赁期内各个期间，出租人应当采用直线法或其他系统合理的方法，将经营租赁的租赁收款额确认为租金收人"},{"letter":"B","text":"出租人提供免租期的，出租人应将租金总额在不扣除免租期的整个租赁期内，按直线法或其他合理的方法进行分配，免租期内应当确认租金收人"},{"letter":"C","text":"对于经营租赁资产中的固定资产，出租人应当采用类似资产的折旧政策计提折旧"},{"letter":"D","text":"出租人取得的与经营租赁有关的可变租赁付款额，应当在实际发生时计人当期损益"}],"answer":"ABC","explanation":"出租人取得的与经营租赁有关的可变租赁付款额，如果是与指数或比率挂钩的，应在租赁期开始日计人租赁收款额，除此之外的，应当在实际发生时计人当期损益，选项D错误。"},{"num":9,"text":"关于售后租回交易的会计处理，下列项目中正确的有（ ）。","options":[{"letter":"A","text":"售后租回交易中的资产转让属于销售的，承租人应当按原资产账面价值与售价的差额确认相关利得或损失"},{"letter":"B","text":"如果销售对价的公允价值与资产的公允价值不同，或者出租人未按市场价格收取租金，则企业应当将销售对价低于市场价格的款项作为预付租金进行会计处理，将高于市场价格的款项作为出租人向承租人提供的额外融资进行会计处理；同时，承租人按照公允价值调整相关销售利得或损失，出租人按市场价格调整租金收人"},{"letter":"C","text":"售后租回交易中的资产转让不属于销售的，承租人应当继续确认被转让资产，同时确认一项与转让收人等额的金融负债，并按照《企业会计准则第22号—一金融工具确认和计量》对该金融负债进行会计处理"},{"letter":"D","text":"售后租回交易中的资产转让不属于销售的，出租人应确认被转让资产"}],"answer":"BC","explanation":"售后租回交易中的资产转让属于销售的，承租人应当按原资产账面价值中与租回获得的使用权有关的部分，计量售后租回所形成的使用权资产，并仅就转让至出租人的权利确认相关利得或损失，选项A错误；售后租回交易中的资产转让不属于销售的，出租人不应确认被转让资产，但应当将支付的对价作为金融资产，并按照《企业会计准则第22号—金融工具确认和计量》对该金融资产进行会计处理，选项D错误。"}]},{"type":"计算分析题","questions":[{"num":1,"text":"2×25年至2×28年，甲公司发生的有关交易或事项如下： （1）2×25年1月1日，甲公司与乙公司签订设备租赁协议，甲公司从乙公司租入一台大型生产设备，该设备尚可使用10年，租赁期为2×25年1月1日至2×27年12月31日，年租金以50万元和按照0.1万元／件乘以甲公司使用该设备生产产品的产量计算的租金两者孰高确定，于每年年末收取。甲公司预计租赁期内每年使用该大型设备的产出量分别为500件、520件和530件。设备租赁到期时甲公司可选择按照当时的市场价格续租，或选择以200万元的价格购买该设备。甲公司租人该设备用于生产，且当年生产的产品于当年全部实现对外销售。甲公司管理层能够合理确定租赁到期时将行使购买选择权。2×25年1月1日，甲公司支付初始直接费用为3.43万元，乙公司出租设备的租赁内含利率为6%。2×25年12月31日，该大型设备的可收回金额为260万元。2×25年度甲公司使用该大型设备生产产品的产量为510件。2×28年1月1日，甲公司行使了购买选择权，以200万元的价格购买该设备。 （2）2×28年12月31日，由于资金需求，甲公司出售并租回该设备，出售价款180万元已收存银行，租赁期为5年，租赁期内每年年末支付租金40万元，租赁期结束后设备归甲公司所有。该交易中设备的转让不满足收入确认条件。 （1）已知:（P/A，6%，3）=2.6730，（P/F，6%，3）=0.8396； （2）甲公司自租赁期开始的当月对使用权资产采用年限平均法计提折旧； （3）不考虑租赁资产净残值、相关税费及其他因素。 要求： （1）根据资料（1），①说明甲公司租赁负债应如何计量；②计算租赁负债的初始入账金额、使用权资产入账价值，并编制相关会计分录。 （2）根据资料（1），计算甲公司2×25年度使用权资产应计提的折旧金额、2×25年12月31日应计提的使用权资产减值准备，编制相关会计分录。 （3）根据资料（1），计算甲公司2×25年12月31日租赁负债的账面价值，编制计提利息、支付租金的会计分录。 （4）根据资料（2），说明甲公司设备售后租回的会计处理方法；编制甲公司2×28年12月31日与售后租回相关的会计分录。 1 （1）2×24年2月1日，甲公司从乙公司租入办公室，根据租赁合同的约定，租赁期自2×24年2月1日至2×27年1月31日，第1年租金为20万元，之后每年2月1日调整当年租金，调整公式：当年租金=上年租金×（1+上年居民消费价格指数同比增幅）,若上年居民消费价格指数同比下降，则公式中的同比增幅为零，当年2月1日至次年1月31日的租金于次年1月31日支付。租赁期开始日甲公司增量借款年利率为6%。 （2）2×25年1月31日，甲公司通过银行转账向乙公司支付了第1年租金20万元，2×25年2月1日，当年租金按2×24年同比增幅为3%的居民消费价格指数进行了调整，当日甲公司增量借款年利率为6.5%。 （3）2×26年1月31日甲公司与乙公司经协商终止了租赁合同，当日甲公司用银行存款向乙公司支付第2年租金。 （1)（P/A，6%，3）=2.6730，（P/A，6%，2）=1.8334，（P/A，6.5%，2）=1.8206; （2）甲公司自租赁期开始的当月对使用权资产采用直线法按年计提折旧，租赁负债相关的利息费用按年计算； （3）不考虑相关税费及其他因素。 要求： （1）根据资料（1），计算甲公司办公室租赁合同的租赁付款额和初始确认的使用权资产金额，并编制2×24年2月1日的相关会计分录。 （2）根据资料（1）和（2），说明2×25年2月1日重新计量租赁负债应当采用的折现率；计算重新计量的租赁负债金额，并编制重新计量租赁负债的相关会计分录。 （3）根据上述资料，计算甲公司2×26年1月31日因终止租赁合同应当确认的损益金额，并编制2×26年1月31日的相关会计分录。","options":[],"answer":null,"explanation":null},{"num":3,"text":"2×21年至2×25年，甲公司发生的有关交易或事项如下： （1）2×21年1月1日，甲公司与出租人乙公司签订了一份办公楼租赁合同。当日，甲公司取得办公楼钥匙，可以自主安排对办公楼进行装修使用，甲公司将该办公楼作为其总部办公楼使用；为获得该项租赁，甲公司通过银行转账向促成此租赁交易的房地产中介支付佣金8万元，甲公司无法确定租赁内含利率，甲公司的增量借款年利率为5%。根据租赁合同的约定，每年的租金为150万元,于每年年末支付,不可撤销租赁期为5年，并且合同约定在第5年年末，甲公司有权选择以每年150万元的租金续租5年，也有权选择以5000万元购买该办公楼。 租赁期开始日，甲公司计划不行使购买选择权。甲公司对该办公楼进行重大装修改良，预计装修改良的使用寿命为10年。 2×21年12月31日，甲公司通过银行转账向乙公司支付租金150万元。 （2）2×24年12月31日，甲公司通过银行转账向乙公司支付租金150万元。当日，受甲公司可控范围内的重大事件的影响，甲公司经过重新评估后认为其合理确定将行使上述购买选择权；甲公司无法确定租赁内含利率，甲公司的增量借款年利率为6%，甲公司预计该办公楼的剩余使用寿命为20年。 （3）2×25年12月31日，甲公司行使了购买选择权，通过银行转账向乙公司支付了5000万元并办理了该办公楼的法定所有权过户手续。 其他资料： （1）甲公司自租赁期开始的当月对使用权资产采用年限平均法计提折旧并直接计人当期损益，租赁负债相关的利息费用按年计算。 （2)（P/A，5%，10）=7.7217，（P/A，5%，6）=5.0757，（P/A，5%，5）=4.3295。 （3）上述各项合同均通过合同各方管理层批准，满足合同成立的条件。 （4）不考虑相关税费及其他因素。 要求： （1）根据资料（1），判断该租赁的租赁期，并说明理由；计算甲公司于租赁期开始日应确认的使用权资产和租赁负债的金额，并编制甲公司2×21年度与租赁相关的会计分录。 （2）根据资料（1）和（2），计算甲公司于2×24年12月31日购买选择权的评估结果发生变化且支付当年租金后的租赁负债金额及2×24年末重新计量后的使用权资产账面价值，编制调整租赁负债和使用权资产的会计分录。 （3）根据资料（1）至（3），计算甲公司2×25年度对使用权资产应计提的折旧金额，编制2×25年度与租赁相关的会计分录。 /","options":[],"answer":null,"explanation":null},{"num":4,"text":"甲公司是一家设备生产商，2×25年发生的有关交易或事项如下： （1）2×25年1月1日与乙公司（生产型企业）签订一份租赁合同，将其生产的A设备出租给乙公司，租赁期为3年，每年年末支付年租金50万元。此外，乙公司还应根据每年使用该设备所生产产品的销售收人的1%向甲公司支付可变租金。为达成租赁，甲公司发生中介佣金等相关成本4万元。该设备于2×25年1月1日交付给乙公司，当日其公允价值为140万元，账面价值为100万元，预计使用寿命为3年。甲公司预计该设备在租赁期结束时的余值为5万元，没有公司对该设备余值提供担保。租赁合同中约定的年利率为5%，市场年利率为6%。 2×25年度，乙公司使用A设备生产的产品销售收人为600万元，以银行存款向甲公司支付可变租金。2×25年12月31日，甲公司对应收乙公司的款项按整个存续期计量的损失准备金额为10万元。 （2）2×25年1月1日，甲公司将自用的一栋办公楼出售给丙公司，同时与丙公司签订租赁协议，约定甲公司继续使用该办公楼，租赁期为2年。当日，双方办理了产权过户登记手续；办公楼账面原值10000万元，已计提折旧1000万元，未计提减值准备，预计剩余使用寿命为45年，公允价值和销售价格均为11600万元，销售价款已收存银行。甲公司于每年年末通过银行转账向丙公司支付当年租金400 万元，第1年租金400万元已于2×25年12月31日支付。租赁内含年利率为5%。 2×26年1月1日，甲公司与丙公司协商退租。丙公司同意甲公司退租，甲公司不再支付剩余租金。 ①现值系数如下： （P/A，5%，3）=2.7232;（P/F，5%，3）=0.8638； （P/A，6%，3）=2.6730;（P/F，6%，3）=0.8396; （P/A，5%，2）=1.8594。 ②甲公司对使用权资产采用直线法计提折旧，自租赁期开始的当月计提折旧，租赁负债相关的利息费用按年计算。 ③不考虑相关税费及其他因素。 要求： （1）根据资料（1），①判断甲公司的租赁类型，并说明理由；②说明2×25年1月1日如何确认收入、结转销售成本，编制2×25年1月1日甲公司出租其所生产的设备的会计分录；③编制2×25年12月31日甲公司与该租赁相关的会计分录。 （2）根据资料（2）,①判断甲公司是否应确认资产处置损益，说明理由；若应确认，计算资产处置损益的金额；②编制甲公司2×25年1月1日与出售办公楼相关的会计分录；③编制甲公司与退租相关的会计分录。","options":[],"answer":null,"explanation":null}]}]},{"chTitle":"第十五章 持有待售的非流动资产、处置组和终止经营","header":"# 第十五章 持有待售的非流动资产、处置组和终止经营\n\n考情速览\n\n<table><tr><td colspan=\"3\"></td></tr><tr><td>复习难度</td><td>常考题型</td><td>近5年考试平均分值 2分左右</td></tr><tr><td colspan=\"3\">客观题+主观题</td></tr></table>\n\n## 教材主要变化\n\n（1）修改“拟结束使用而非出售的非流动资产或处置组”相关表述；\n\n（2）修改“划分为持有待售类别时的计量”相关表述；\n\n（3）增加“持有待分配给所有者的非流动资产或处置组发生的分配费用”相关表述；\n\n（4）修改“终止确认持有待售的非流动资产或处置组”相关表述；\n\n（5）修改部分例题。\n\n## 考点框架\n\n<table><tr><td rowspan=1 colspan=3>持有待售的非流动资产、处置组和终止经营</td></tr><tr><td rowspan=3 colspan=1>持有待售的非流动资产和处置组</td><td rowspan=1 colspan=1>持有待售类别的分类</td><td rowspan=1 colspan=1>中</td></tr><tr><td rowspan=1 colspan=1>持有待售类别的计量</td><td rowspan=1 colspan=1>中</td></tr><tr><td rowspan=1 colspan=1>持有待售类别的列报</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=3 colspan=1>终止经营</td><td rowspan=1 colspan=1>终止经营的定义</td><td rowspan=1 colspan=1>●0０易</td></tr><tr><td rowspan=1 colspan=1>终止经营的列报</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=1 colspan=1>特殊事项的列报</td><td rowspan=1 colspan=1>●00易</td></tr></table>\n\n## 考点剖析\n\n本章内容简洁但也存在易错易混点，如划分为持有待售类别前和划分时及划分后的计量，再如对联营企业或合营企业的权益性投资全部或部分划分为持有待售资产的计量与对于未划分为持有待售类别的剩余权益性投资的计量，以及终止经营的判断和列报等，需要您仔细辨别，理解记忆。","sections":[{"title":"第一节持有待售的非流动资产和处置组","content":"## 一、持有待售类别的分类\n\n考点难度●○中\n\n## （一）持有待售类别分类的基本要求\n\n## 1.分类原则\n\n企业主要通过出售而非持续使用一项非流动资产或处置组收回其账面价值的，应当将其划分为持有待售类别。\n\n处置组，是指在一项交易中作为整体通过出售或其他方式一并处置的一组资产，以及在该交易中转让的与这些资产直接相关的负债。处置组所属的资产组或资产组组合按照《企业会计准则第8号—资产减值》分摊了企业合并中取得的商誉的，该处置组应当包含分摊至处置组的商誉。处置组中可能包含企业的任何资产和负债。\n\n（1）非流动资产或处置组划分为持有待售类别，应当同时满足下列条件：\n\n\n\n①在当前状况下即可立即出售。\n\n根据类似交易中出售此类资产或处置组的惯例，在当前状况下即可立即出售。\n\n为满足该条件，企业应当具有在当前状态下出售该非流动资产或处置组的意图和能力。\n\n## 提示\n\n“出售”包括具有商业实质的非货币性资产交换；如果企业以非流动资产或处置组抵债进行债务重组，也可能符合划分为持有待售类别的条件。\n\n②出售极可能发生，即企业已经就一项出售计划作出决议且获得确定的购买承诺，预计出售将在一年内完成。\n\na.企业出售非流动资产或处置组的决议一般需要由企业相应级别的管理层作出，如果有关规定要求企业相关权力机构或者监管部门批准后方可出售，应当已经获得批准。\n\nb.企业已经获得确定的购买承诺，确定的购买承诺是企业与其他方签订的具有法律约束力的购买协议，该协议包含交易价格、时间和足够严厉的违约惩罚等重要条款，使协议出现重大调整或者撤销的可能性极小。\n\nc.预计自划分为持有待售类别起一年内，出售交易能够完成。\n\n（2）非流动资产或处置组划分为持有待分配给所有者类别，应当同时满足下列条件：\n\n①在当前状况下即可立即分配;\n\n②分配很可能发生，即企业已经开展与分配相关的工作，分配出现重大调整或撤销的可能性极小，预计分配将在一年内完成。有关规定要求企业相关权力机构或者监管部门批准后方可分配的，应当已经获得批准。\n\n【例题1·单选题】因技术进步、市场需求变化等原因，甲公司生产的某类卷烟的销量锐减，  \n经甲公司管理层决议，2×25年11月10日暂停生产该类卷烟。生产该类卷烟的生产线也暂停  \n使用，拟对外出售。不考虑其他因素，2×25年度甲公司对该生产线会计处理正确的是（ ）。A.将该生产线划分为持有待售类别B.暂停使用该生产线时停止计提折旧C.对该生产线进行减值测试，如发生减值应计提减值准备D.该生产线在资产负债表中年末数按公允价值列报\n\n解析非流动资产或处置组划分为持有待售类别，应当同时满足两个条件：（1）在当前状况下即可立即出售。（2）出售极可能发生。甲公司只是暂停使用，拟对外出售（尚未获得确定的购买承诺），没有同时满足上述条件，选项A错误。暂停使用该生产线仍应计提折旧，选项B错误。该生产线在资产负债表中年末数应当按照其账面价值列报，选项D错误。\n\n（解题攻略因生产的某类卷烟的销量锐减，导致未来现金流量减少，所以应考虑对该生产线计提减值准备。\n\n## 2．延长一年期限的例外条款\n\n因企业无法控制的下列原因之一，导致非关联方之间的交易未能在一年内完成，且有充分证据表明企业仍然承诺出售非流动资产或处置组的，企业可以继续将非流动资产或处置组划分为持有待售类别。\n\n点拨 关联方交易通常不具有商业实质，故不允许放松一年期限条件。\n\n例（真）题-答案」 1.C\n\n## （1）意外设定条件\n\n买方或其他方意外设定导致出售延期的条件，企业针对这些条件已经及时采取行动，且预计能够自设定导致出售延期的条件起一年内顺利化解延期因素。\n\n## （2）发生罕见情况\n\n因发生罕见情况，导致持有待售的非流动资产或处置组未能在一年内完成出售，企业在最初一年内已经针对这些新情况采取必要措施且重新满足了持有待售类别的划分条件。\n\n## 3.不再继续符合划分条件的处理\n\n持有待售的非流动资产或处置组不再满足持有待售类别划分条件的，企业不应当继续将其划分为持有待售类别。\n\n## （二）某些特定持有待售类别分类的具体应用 5年热点丨3次\n\n## 1.企业专为转售而取得的非流动资产或处置组\n\n在取得日满足“预计出售将在一年内完成”的规定条件，且短期（通常为3个月）内很可能满足持有待售类别的其他划分条件（如签订具有法律约束力的购买协议等其他条件）的，企业应当在取得日将其划分为持有待售类别。\n\n## 2.持有待售的长期股权投资\n\n企业因出售对子公司的投资等原因导致其丧失对子公司控制权的，无论出售后企业是否保留部分权益性投资，应当在拟出售对子公司投资满足持有待售类别划分条件时，在母公司个别财务报表中将对子公司投资整体划分为持有待售类别，在合并财务报表中将子公司所有资产和负债划分为持有待售类别。\n\n企业出售对子公司投资但并不丧失对其控制权，企业不应当将拟出售的部分对子公司投资或对子公司投资整体划分为持有待售类别。\n\n对联营企业或合营企业的权益性投资全部或部分分类为持有待售资产的，应当停止权益法核算；对于未划分为持有待售类别的剩余权益性投资，应当在划分为持有待售的那部分权益性投资出售前继续采用权益法进行会计处理。原权益法核算的相关其他综合收益等应当在持有待售资产终止确认时，按照有关处置长期股权投资的规定进行会计处理。\n\n## 问答\n\n拟出售对子公司投资（丧失控制权）满足持有待售类别划分条件时，为什么要在母公司个别财务报表中将其整体划分为持有待售类别？而对联营企业或合营企业投资不是整体？\n\n答：在持有待售的长期股权投资出售前，母公司仍然要编制合并财务报表，并将子公司整体纳入合并财务报表中。因拟出售子公司，所以应将子公司整体划分为持有待售类别，在合并财务报表中要将子公司所有资产在“持有待售资产”项目列示，所有负债在“持有待售负债”项目列示。长期股权投资反映的是子公司净资产，合并财务报表中反映的是子公司全部持有待售资产和持有待售负债，因此母公司个别财务报表中的长期股权投资也应整体划分为持有待售类别。\n\n对联营企业或合营企业投资，不编制合并财务报表，无须考虑长期股权投资整体的会，计处理，应将划分为持有待售部分和剩余部分分开考虑，划分为持有待售部分停止采用权益法核算，剩余部分（此时对被投资单位还是具有重大影响或共同控制）仍采用权益法核算，待后续实际出售部分投资后，不再具有重大影响或共同控制时，将剩余投资按《企业会计准则第22号—金融工具确认和计量》进行会计处理。\n\n## 3．拟结束使用而非出售的非流动资产或处置组\n\n企业不应当将拟结束使用而非出售的非流动资产或处置组划分为持有待售类别。原因是企业对该非流动资产或处置组的使用实质上几乎贯穿了其整个经济使用寿命期，其账面价值并非主要通过出售收回，而是主要通过持续使用收回。例如，因已经使用至经济寿命期结束而将某机器设备报废，并收回少量残值；因技术进步而将某子公司关停或转产。对于暂时停止使用的非流动资产，企业不应当认为其拟结束使用，也不应当将其划分为持有待售类别。\n\n对于拟结束使用而非出售的处置组，在停止使用前不应当划分为持有待售类别，也不应当作为终止经营列报；在停止使用后，不应当划分为持有待售类别，如果该处置组满足终止经营中有关单独区分的组成部分的条件，应当作为终止经营列报。对于拟结束使用而非出售的非流动资产，无论在停止使用之前或之后，均不应当划分为持有待售类别，也不应当作为终止经营列报。\n\n【真题2·多选题】甲公司持有乙公司80%的股权，能够控制乙公司。2×20年10月10日，甲公司与丙公司签订的有关出售乙公司50%股权的协议约定，双方应于2×21年3月31日办理完成股权过户登记手续。合同签订日，丙公司预付了购买价款的20%。甲公司出售上述50%股权后，将丧失对乙公司的控制权，但会继续长期持有乙公司剩余30%的股权，并能够对乙公司施加重大影响。上述出售安排满足持有待售的条件，下列各项关于甲公司2×20年度财务报表列报的表述中，正确的有（）。（2022年）\n\nA．个别资产负债表中将所持乙公司80%的股权在持有待售资产项目列示  \nB.个别资产负债表中将拟出售乙公司50%股权对应的长期股权投资在持有待售资产项目列示  \nC.合并资产负债表中将乙公司的资产总额在持有待售资产项目列示，负债总额在持有待售负债项目列示  \nD.合并资产负债表中将乙公司的资产总额与负债总额相抵后的净额在持有待售资产或持有待售负债项目列示\n\n(解析由于出售股权后丧失对子公司的控制权，甲公司应在个别财务报表中将所持乙公司的全部股权（即80%）划分为持有待售资产，选项A正确，选项B不正确；在合并财务报表中将乙公司所有的资产划分为持有待售资产，将乙公司所有的负债划分为持有待售负债，持有待售资产和持有待售负债不得相互抵销，选项C正确，选项D不正确。\n\n【真题3·单选题】2×20年9月10日，甲公司董事会会议决议：（1）拟出售其子公司（乙公司）60%的股权，剩余20%股权仍对乙公司具有重大影响；（2）因甲公司经营战略发生变化，甲公司拟出售其原作为主要经营业务的资产组（包括固定资产和无形资产）。2×20年10月10日，甲公司与丙公司、丁公司分别签订的转让资产协议约定，甲公司应于2×21年5月1日前办理完成转让乙公司60%股权过户登记手续，以及出售主要经营业务的资产组所涉及资产的所有权转让手续。不考虑其他因素，下列各项关于上述交易或事项在甲公司2×20年度财务报表列报的表述中，正确的是（）。（2021年）\n\nA.在个别资产负债表中应将拟出售乙公司60%股权在“持有待售资产”项目列示，剩余20%股权在“长期股权投资”项目列示\n\nB.拟转让业务所涉及的资产组的公允价值高于账面价值的差额在合并利润表的“公允价值变动收益”项目列示  \nC.拟转让业务所涉及的所有资产在个别资产负债表中应按资产性质在“固定资产”和“无形资产”项目分别列示  \nD.乙公司的资产总额和负债总额在合并资产负债表中分别在“持有待售资产”和“持有待售负债”项目列示\n\n(解析）在个别资产负债表中应将乙公司80%股权在“持有待售资产”项目列示，选项A错误；划分为持有待售类别时，若划分为持有待售的资产组公允价值减去出售费用后的净额高于账面价值，企业不需要对账面价值进行调整，无须确认“公允价值变动收益”项目，选项B错误；拟转让业务所涉及的所有资产在个别资产负债表中应在“持有待售资产”项目列报，选项C错误。\n\n（解题攻略）因出售对子公司投资而丧失控制权，无论出售后原母公司是否保留部分权益性投资，应当在拟出售对子公司投资满足持有待售类别划分条件时，在母公司个别财务报表中将对子公司投资整体划分为持有待售类别，在合并财务报表中将原子公司所有资产和负债分别在“持有待售资产”项目及“持有待售负债”项目列报。\n\n【例题4·多选题】甲公司持有乙公司80%股权，能够对乙公司实施控制。2×25年12  \n月20日，甲公司与无关联关系的丙公司签订股权转让协议，拟将所持乙公司60%股权转让给  \n丙公司，转让后甲公司将丧失对乙公司的控制，但能够对乙公司施加重大影响。截至2×25 年  \n12月31日，上述股权转让尚未成功，甲公司预计将在3个月内完成转让。假定甲公司所持乙  \n公司股权投资在2×25年12月31日满足划分为持有待售类别的条件，不考虑其他因素，下列  \n各项关于甲公司会计处理的表述中，错误的有（ ）。A．自满足划分为持有待售类别的条件起不再将乙公司纳人2×25年度合并财务报表的合并范围B.在2×25年12月31日个别财务报表中将所持乙公司80% 股权投资在“一年内到期的非流动资产”项目列示C.在2×25年12月31日个别财务报表中将所持乙公司60%股权投资在“持有待售资产”项目列示，将所持有乙公司20%股权投资在“长期股权投资”项目列示D.在2×25年12月31日合并财务报表中将所持乙公司60%股权投资在“持有待售资产”项目列示，将所持有乙公司20%股权投资在“长期股权投资”项目列示\n\n(解析甲公司在未转让60%股权投资前还是要将拟处置的子公司纳入合并范围编制合并财务报表的，选项A错误；在2×25年12月31日个别财务报表中将所持乙公司80%股权投资在“持有待售资产”项目列示，选项B错误；出售对子公司的投资满足持有待售类别的划分条件，无论企业是否保留非控制的权益性投资，应当在拟出售的对子公司投资满足持有待售类别划分条件时，在母公司个别财务报表中将对子公司投资整体划分为持有待售类别，而不是仅将拟处置的投资划分为持有待售类别；在合并财务报表中将子公司所有资产和负债划分为持有待售类别，而不是仅将拟处置的投资对应的资产和负债划分为持有待售类别，选项C和D错误。\n\n例（真）题-答案」3.D4.ABCD\n\n【例题5】2×25年，甲公司发生的相关交易或事项如下：\n\n2×25年12月31日，经董事会批准，甲公司与丙公司签订出售其所持丁公司20%股权的协议。协议约定，出售价格为3500万元，甲公司应于2×26年4月末前办理完成丁公司股权的产权转移手续。甲公司预计能够按照协议约定完成丁公司股权的出售，预计出售该股权发生的税费为400万元。\n\n甲公司持有丁公司30%股权并对其具有重大影响。截至2×25年12月31日，甲公司对丁公司股权投资的账面价值为3600万元，其中投资成本为2400万元，损益调整为900万元，其他综合收益为300万元。\n\n本题不考虑税费及其他因素。\n\n要求：判断甲公司对拟出售的丁公司股权应当如何分类及计量，编制相关会计分录；说明甲公司保留所持丁公司10%股权投资在完成出售20%股权前的会计处理原则。\n\n答案甲公司对拟出售的丁公司股权部分应当分类为持有待售资产。\n\n甲公司对拟出售的丁公司股权部分应当按照公允价值减出售费用后的净额3100万元（3500-400），与其账面价值2400万元（3600×20%÷30%）孰低计量。\n\n会计处理如下：\n\n借：持有待售资产一长期股权投资\n\n贷：长期股权投资一投资成本\n\n对于未划分为持有待售资产的剩余10%权益性投资，应当在划分为持有待售的那部分权益性投资出售前继续采用权益法进行会计处理。\n\n## 二、持有待售类别的计量\n\n考点难度●●〇 中\n\n<table><tr><td colspan=\"1\" rowspan=\"1\">持有待售的非流动资产和处置组</td><td colspan=\"1\" rowspan=\"1\">适用的企业会计准则</td></tr><tr><td colspan=\"1\" rowspan=\"1\">采用公允价值模式进行后续计量的投资性房地产</td><td colspan=\"1\" rowspan=\"1\">《企业会计准则第3号    投资性房地产》</td></tr><tr><td colspan=\"1\" rowspan=\"1\">采用公允价值减去出售费用后的净额计量的生物资产</td><td colspan=\"1\" rowspan=\"1\">《企业会计准则第5号-    生物资产》</td></tr><tr><td colspan=\"1\" rowspan=\"1\">职工薪酬形成的资产</td><td colspan=\"1\" rowspan=\"1\">《企业会计准则第9号    -职工薪酬》</td></tr><tr><td colspan=\"1\" rowspan=\"1\">递延所得税资产</td><td colspan=\"1\" rowspan=\"1\">《企业会计准则第18号     所得税》</td></tr><tr><td colspan=\"1\" rowspan=\"1\">由金融工具相关会计准则规范的金融资产</td><td colspan=\"1\" rowspan=\"1\">金融工具相关会计准则</td></tr><tr><td colspan=\"1\" rowspan=\"1\">由保险合同相关会计准则规范的保险合同所产生的权利</td><td colspan=\"1\" rowspan=\"1\">保险合同相关会计准则</td></tr><tr><td>除上述各项外的其他持有待售的非流动资产</td><td>《企业会计准则第42号—持有待售的非流 动资产、处置组和终止经营》 如：固定资产、在建工程、无形资产、开发支 出、采用成本模式进行后续计量的投资性房地 产、使用权资产、长期股权投资、商誉等</td></tr><tr><td>处置组中的流动资产、负债</td><td>适用相关会计准则</td></tr></table>\n\n持有待售的非流动资产或处置组的计量图示如下：\n\n\n\n## 点拨\n\n①划分为持有待售前，按固定资产等相关准则计量；\n\n②划分为持有待售时和划分为持有待售后，按本准则处理。\n\n## （一）划分为持有待售类别前的计量\n\n企业将非流动资产或处置组首次划分为持有待售类别前，应当按照相关会计准则规定计量非流动资产或处置组中各项资产和负债的账面价值。\n\n## （二）划分为持有待售类别时的计量5年热点丨2次\n\n## 1.将原非流动资产或处置组划分为持有待售\n\n企业初始计量持有待售的非流动资产或处置组时，其账面价值高于公允价值减去出售费用后的净额的，应当将账面价值减记至公允价值减去出售费用后的净额，减记的金额确认为资产\n\n减值损失，计入当期损益，同时计提持有待售资产减值准备，但不应当重复确认不适用本章计量规定的资产和负债按照相关准则规定已经确认的损失。\n\n## 点拨\n\n处置组划分为持有待售类别时，处置组中的所有资产在“持有待售资产”项目列报，所有负债在“持有待售负债”项目列报。\n\n出售费用是企业发生的可以直接归属于出售资产或处置组的增量费用，出售费用直接由出售引起，并且是企业进行出售所必需的，如果企业不出售资产或处置组，该费用将不会产生。\n\n出售费用包括为出售发生的特定法律服务、评估咨询等中介费用，也包括相关的消费税、城市维护建设税、土地增值税和印花税等，但不包括财务费用和所得税费用。\n\n有些情况下，公允价值减去出售费用后的净额可能为负值，持有待售的非流动资产或处置组中资产的账面价值应当以减记至零为限。是否需要确认相关预计负债，应当按照《企业会计准则第13号——或有事项》的规定进行会计处理。\n\n<table><tr><td rowspan=1 colspan=2>情形</td><td rowspan=1 colspan=1>账务处理</td></tr><tr><td rowspan=1 colspan=2>将各类资产的账面价值转人持有待售资产（以固定资产为例）</td><td rowspan=1 colspan=1>借：持有待售资产累计折旧固定资产减值准备贷：固定资产</td></tr><tr><td rowspan=1 colspan=2>将负债的账面价值转人持有待售负债（以应付账款为例）</td><td rowspan=1 colspan=1>借：应付账款贷：持有待售负债</td></tr><tr><td rowspan=2 colspan=1>比较账面价值与公允价值减去出售费用后的净额</td><td rowspan=1 colspan=1>如果其账面价值小于其公允价值减去出售费用后的净额</td><td rowspan=1 colspan=1>企业不需要对账面价值进行调整</td></tr><tr><td rowspan=1 colspan=1>如果其账面价值大于其公允价值减去出售费用后的净额</td><td rowspan=1 colspan=1>借：资产减值损失贷：持有待售资产减值准备</td></tr></table>\n\n2.对于取得日划分为持有待售类别的非流动资产或处置组\n\n对于取得日划分为持有待售类别的非流动资产或处置组，企业应当在初始计量时比较假定其不划分为持有待售类别情况下的初始计量金额和公允价值减去出售费用后的净额，以两者孰低计量。\n\n【例题6】P公司取得S公司100%股权，S公司是专为转售而取得的子公司，其不划分为持有待售类别情况下的初始计量金额为2000万元（支付现金取得），当日公允价值减去出售费用后的净额为1900万元，按照二者孰低计量。P公司账务处理如下：\n\n借：持有待售资产一长期股权投资\n\n资产减值损失 100\n\n贷：银行存款 2000\n\n## 3.企业合并中新取得的非流动资产或处置组划分为持有待售类别\n\n非同一控制下的企业合并中新取得的非流动资产或处置组划分为持有待售类别的，应当按照公允价值减去出售费用后的净额进行初始计量。\n\n## 点拨\n\n非同一控制下企业合并，不划分为持有待售类别情况下的初始计量金额即为取得时的公允价值，其公允价值减去出售费用后的净额一定小于不划分为持有待售类别情况下的初始计量金额，因此应当按照公允价值减去出售费用后的净额进行初始计量。\n\n同一控制下的企业合并中非流动资产或处置组划分为持有待售类别的，应当按照合并日在被合并方的账面价值与公允价值减去出售费用后的净额孰低进行初始计量。除企业合并中取得的非流动资产或处置组外，由以公允价值减去出售费用后的净额作为非流动资产或处置组初始计量金额而产生的差额，应当计入当期损益。\n\n## 4.持有待分配给所有者类别的计量要求\n\n持有待分配给所有者的非流动资产或处置组发生的分配费用，是可以直接归属于分配资产或处置组的增量费用，但不包括财务费用和所得税费用。除此之外，持有待分配给所有者类别的计量要求与持有待售类别相类似。\n\n## （三）划分为持有待售类别后的计量\n\n## 1.持有待售的非流动资产的后续计量\n\n资产负债表日重新计量持有待售的非流动资产时，其账面价值高于公允价值减去出售费用后的净额的，应当将账面价值减记至公允价值减去出售费用后的净额，减记的金额确认为资产减值损失，计人当期损益，同时计提持有待售资产减值准备。\n\n后续资产负债表日持有待售的非流动资产公允价值减去出售费用后的净额增加的，以前减记的金额应当予以恢复，并在划分为持有待售类别后确认的资产减值损失金额内转回，转回金额计人当期损益。\n\n## 点拨\n\n（1）划分为持有待售类别前确认的资产减值损失不得转回；\n\n（2）持有待售的非流动资产不应计提折旧或摊销。\n\n【例题7·多选题】2×24年12月31日，甲公司以4800万元取得一栋写字楼并立即投  \n入使用，预计使用年限为10年，预计净残值为零，采用年限平均法计提折旧。2×25年6月  \n30日，甲公司与乙公司签订协议，约定3个月内以4600万元的价格将该写字楼出售给乙公司，  \n当日该写字楼符合划分为持有待售类别的条件。2×25年10月1日，因乙公司受自然灾害影  \n响出现财务困难，双方协商解除该协议。甲公司继续积极寻求购买方，2×25年12月31日，  \n甲公司与丙公司签订协议,约定3个月内以4500万元的价格将该写字楼出售。不考虑其他因素，  \n下列各项关于甲公司会计处理的表述中，错误的有（ ）。A．2×25年度，该写字楼计提折旧480万元B.2×25年6月30日，持有待售资产初始人账金额为4560万元C．2×25年12月31日，计提持有待售资产减值准备60万元D.2×25年6月30日，确认固定资产处置损益40万元\n\n解析）2×25年度该写字楼计提的折旧 $= 4 8 0 0 / 1 0 \\times 6 / 1 2 { = } 2 4 0 \\ ( \\ \\mathcal { F } \\mathcal { \\bar { \\pi } } )$ ，选项A不正确；2×25年6月30日，划分为持有待售类别前固定资产账面价值 $= 4 8 0 0 { - } 4 8 0 0 / 1 0 \\times 6 / 1 2 =$ 4560（万元），公允价值减去出售费用后的净额为4600万元，因此持有待售资产初始入账金额为4560万元，选项B正确；2×25年12月31日，计提持有待售资产减值准备=4560-4500=60（万元），选项C正确；固定资产划分为持有待售类别不应确认资产处置损益，选项D不正确。\n\n解题攻略)①本题属于延长一年期限的例外条款，企业在最初一年内已经针对这些新情况采取必要措施且重新满足了持有待售类别的划分条件，应继续将该写字楼划分为持有待售类别；②固定资产划分为持有待售类别后不计提折旧。\n\n## 2.持有待售的处置组的后续计量\n\n企业在资产负债表日重新计量持有待售的处置组时，应当首先按照相关会计准则规定计量处置组中的流动资产、适用其他准则计量规定的非流动资产和负债的账面价值。在进行上述计量后，企业应当比较持有待售的处置组整体账面价值与公允价值减去出售费用后的净额，如果账面价值高于其公允价值减去出售费用后的净额，应当将账面价值减记至公允价值减去出售费用后的净额，减记的金额确认为资产减值损失，计人当期损益，同时计提持有待售资产减值准备，但不应当重复确认不适用本章计量规定的资产和负债按照相关准则规定已经确认的损失。\n\n对于持有待售的处置组确认的资产减值损失金额，应当先抵减处置组中商誉的账面价值，再 根据处置组中适用本准则计量规定的各项非流动资产账面价值所占比重，按比例抵减其账面价值。\n\n后续资产负债表日持有待售的处置组公允价值减去出售费用后的净额增加的，以前减记的金额应当予以恢复，并在划分为持有待售类别后适用本准则计量规定的非流动资产确认的资产减值损失金额内转回，转回金额计入当期损益。\n\n## 点拨\n\n（1）已抵减的商誉账面价值，以及适用本准则计量规定的非流动资产在划分为持有待售类别前确认的资产减值损失不得转回；\n\n（2）持有待售的处置组中的非流动资产不应计提折旧或摊销，持有待售的处置组中负债和不适用本章计量规定的金融资产、以公允价值模式进行后续计量的投资性房地产等的利息或租金收入、支出以及其他费用应当继续予以确认。\n\n## （四）不再继续划分为持有待售类别的计量\n\n非流动资产或处置组因不再满足持有待售类别的划分条件而不再继续划分为持有待售类别或非流动资产从持有待售的处置组中移除时，应当按照以下两者孰低计量：（1）划分为持有待售类别前的账面价值，按照假定不划分为持有待售类别情况下本应确认的折旧、摊销或减值等进行调整后的金额；（2）可收回金额。\n\n处理后的结果为原划分为持有待售的非流动资产或处置组重新分类后的账面价值，与其从未划分为持有待售类别情况下的账面价值相一致。\n\n企业将非流动资产或处置组由持有待售类别重分类为持有待分配给所有者类别，或者由持有待分配给所有者类别重分类为持有待售类别，原处置计划没有发生本质改变，不应当按照上述不再继续划分为持有待售类别的计量要求处理，而应当按照重分类后所属类别的计量要求处理。分类为持有待售类别或持有待分配给所有者类别的日期不因重分类而发生改变，在适用延长一年期的例外条款时，应当以该最初分类日期为准。\n\n## 例（真）题-答案」7.AD\n\n## （五）终止确认\n\n企业终止确认持有待售的非流动资产或处置组时，应当将尚未确认的利得或损失计人当期损益。\n\n按照《企业会计准则第19号一—外币折算》的规定，企业在处置持有待售的境外经营时，应当将与该境外经营相关的外币财务报表折算差额，自其他综合收益转人处置当期损益，部分处置境外经营的，应当按处置的比例计算处置部分的外币财务报表折算差额，转人处置当期损益。\n\n## 点拨 终止确认时：\n\n（1）仅处置金融资产，通过“投资收益”科目核算；\n\n（2）处置固定资产等或处置组，通过“资产处置损益”科目核算。\n\n## 三、持有待售类别的列报 5年热点丨3次\n\n考点难度●○○易\n\n持有待售资产和负债不应当相互抵销。“持有待售资产”和“持有待售负债”应当分别作为流动资产和流动负债列示。\n\n【例题8·多选题】甲公司持有乙公司100%的股权，甲公司董事会批准拟出售乙公司  \n70% 的股权，出售部分股权后，甲公司将丧失对乙公司的控制权。乙公司由甲公司以前年度新  \n设成立，从事商场经营和出租业务。2×25年12月31日，甲公司拟出售的对乙公司的部分投  \n资符合持有待售类别的划分条件；当日，甲公司合并财务报表中，乙公司的资产和负债所构成  \n的处置组的账面价值为8000万元（其中包括流动资产2000万元、固定资产6500万元和应交  \n税费500万元），该处置组整体的公允价值减去出售费用后的净额为7600万元。不考虑其他因  \n素，下列各项关于甲公司2×25年度会计处理的表述中，错误的有（ ）。A．在个别财务报表中将乙公司70%的股权划分为持有待售类别B.在合并财务报表中不再将乙公司纳入合并范围C.在合并财务报表中将乙公司资产和负债的70%划分为持有待售类别D.在合并财务报表中对该处置组确认的资产减值损失不分摊至处置组中的流动资产\n\n解析 无论企业是否保留剩余的非控制的权益性投资，都应当在拟出售的对子公司投资满足持有待售类别划分条件时，在母公司个别财务报表中将对子公司投资整体（100%）划分为持有待售类别，而不是仅将拟处置的投资（70%）划分为持有待售类别，选项A错误；无论对子公司的投资是否划分为持有待售类别，企业始终应当按照《合并财务报表》准则的规定将子公司纳入合并范围，选项B错误；在合并财务报表中将子公司所有资产和负债划分为持有待售类别，而不是仅将拟处置的投资对应的资产和负债划分为持有待售类别，选项C错误；在合并财务报表中对该处置组确认的资产减值损失，应分摊至适用持有待售准则规定的非流动资产，不分摊至处置组中的流动资产，选项D正确。"},{"title":"第二节终止经营","content":"## 一、终止经营的定义\n\n考点难度●○○易\n\n终止经营，是指企业满足下
