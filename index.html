<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPA 会计 · 狂击版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f5f7;--sb:#1d1d1f;--sbt:#ccc;--card:#fff;--tx:#1d1d1f;--tx2:#6e6e73;--ac:#007aff;--ok:#34c759;--no:#ff3b30;--bd:#e5e5ea}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);display:flex;height:100vh;overflow:hidden}

.side{width:270px;background:var(--sb);color:var(--sbt);flex-shrink:0;display:flex;flex-direction:column;overflow:hidden}
.side-h{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.side-h h1{font-size:17px;color:#fff;font-weight:600}
.side-h p{font-size:11px;color:#86868b;margin-top:3px}
.side-n{flex:1;overflow-y:auto;padding:6px 0}
.side-n::-webkit-scrollbar{width:3px}
.side-n::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}

.ch{cursor:pointer}
.ch-h{padding:9px 18px;font-size:12.5px;display:flex;align-items:center;gap:6px;transition:.15s}
.ch-h:hover{background:rgba(255,255,255,.05)}
.ch-h.on{color:#fff;background:rgba(255,255,255,.07)}
.ch-h .a{font-size:9px;transition:.2s}
.ch-h.open .a{transform:rotate(90deg)}

.sl{display:none}
.sl.show{display:block}
.si{padding:7px 18px 7px 34px;font-size:11.5px;cursor:pointer;transition:.15s}
.si:hover{background:rgba(255,255,255,.05);color:#eee}
.si.on{color:var(--ac);background:rgba(0,122,255,.12)}
.si.test{color:#ff9f0a}
.si.test.on{color:#ff9f0a;background:rgba(255,159,10,.15)}

.main{flex:1;overflow-y:auto;padding:28px 36px}
.main::-webkit-scrollbar{width:5px}
.main::-webkit-scrollbar-thumb{background:#c7c7cc;border-radius:3px}

.hd{margin-bottom:22px}
.hd h2{font-size:22px;font-weight:700}
.hd p{color:var(--tx2);font-size:13px;margin-top:3px}

.card{background:var(--card);border-radius:10px;padding:18px 22px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card .badge{display:inline-block;background:var(--ac);color:#fff;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:600;margin-bottom:6px}
.card .body{font-size:13.5px;line-height:1.85}

/* Section content */
.sec-body{max-width:860px}
.sec-body h3.sec-h3{font-size:17px;font-weight:700;margin:28px 0 14px;padding-bottom:6px;border-bottom:2px solid #e0e0e0;color:#1d1d1f}
.sec-body h4.sec-h4{font-size:15px;font-weight:600;margin:22px 0 10px;color:#333}
.sec-body h5{font-size:14px;font-weight:600;margin:18px 0 8px;color:#444}
.sec-body p{font-size:14px;line-height:2;margin:6px 0;color:#333}
.sec-body p.indent{padding-left:1.5em;text-indent:-1.5em}

/* tables */
.tbl-wrap{overflow-x:auto;margin:14px 0}
.tbl-wrap table{border-collapse:collapse;width:100%;font-size:12.5px;line-height:1.6;background:var(--card);border-radius:8px;overflow:hidden}
.tbl-wrap th,.tbl-wrap td{border:1px solid #dfe3e8;padding:8px 12px;vertical-align:top}
.tbl-wrap th{background:#f7f8fa;font-weight:600}
.tbl-wrap td:first-child{white-space:nowrap;font-weight:500;color:#444}

/* tips & notes */
.sec-body .tip{background:#f0f7ff;border-left:3px solid var(--ac);padding:10px 14px;margin:10px 0;border-radius:0 6px 6px 0;font-size:13px;line-height:1.8;color:#333}
.sec-body .tip.note{background:#fffbeb;border-left-color:#f59e0b}
.sec-body .difficulty{font-size:12px;color:var(--tx2);margin:4px 0}

/* example cards */
.sec-body .ex-card{background:var(--card);border-radius:10px;padding:16px 20px;margin:16px 0;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.sec-body .ex-card .badge{display:inline-block;background:#6366f1;color:#fff;padding:2px 8px;border-radius:4px;font-size:10.5px;font-weight:600;margin-bottom:8px}
.sec-body .ex-body{font-size:13.5px;line-height:1.9;margin:6px 0}
.sec-body .ex-ans{background:#f0fdf4;border-radius:6px;padding:10px 14px;margin-top:10px;font-size:13px;line-height:1.8;color:#166534}
.sec-body .ans-line{font-size:12px;color:var(--tx2);margin:4px 0;font-style:italic}

/* accounting entries */
.sec-body .entry{font-family:"Cascadia Code","Fira Code","PingFang SC",monospace;font-size:13px;line-height:1.9;padding:2px 0 2px 1em;color:#334155}

/* Q&A */
.sec-body .qa-block{background:#fefce8;border-left:3px solid #eab308;padding:10px 14px;margin:10px 0;border-radius:0 6px 6px 0;font-size:13.5px;line-height:1.8}

/* numbered items （1）（2）etc */
.sec-body .num-item{display:flex;align-items:flex-start;gap:8px;margin:6px 0;font-size:14px;line-height:2;color:#333}
.sec-body .num-item .num-dot{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;background:#e8f0fe;color:var(--ac);border-radius:50%;font-size:12px;font-weight:700;flex-shrink:0;margin-top:6px}

/* options list inside examples */
.sec-body .opt-list{margin:10px 0;padding-left:4px}
.sec-body .opt-item{display:flex;align-items:flex-start;gap:8px;padding:6px 10px;margin:3px 0;border-radius:6px;font-size:13px;line-height:1.7;background:#f8f9fa}
.sec-body .opt-item:hover{background:#eef3ff}
.sec-body .opt-item .opt-letter{font-weight:700;color:var(--ac);min-width:20px;flex-shrink:0}

.qg{margin-bottom:28px}
.qg-h{font-size:15px;font-weight:600;margin-bottom:14px;padding-bottom:6px;border-bottom:2px solid var(--ac);display:inline-block}

.qc{background:var(--card);border-radius:10px;padding:18px 22px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:.2s;border-left:4px solid transparent}
.qc.ok{border-left-color:var(--ok)}
.qc.no{border-left-color:var(--no)}
.qc .qn{font-size:11px;color:var(--tx2);margin-bottom:6px}
.qc .qt{font-size:13.5px;line-height:1.8;margin-bottom:10px}

.opts{display:flex;flex-direction:column;gap:7px}
.ob{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border:1px solid var(--bd);border-radius:7px;cursor:pointer;font-size:12.5px;line-height:1.55;text-align:left;background:#fff;transition:.15s}
.ob:hover{background:#f0f5ff;border-color:var(--ac)}
.ob.sel{background:#e8f0fe;border-color:var(--ac)}
.ob.ok{background:#e8fbe8;border-color:var(--ok)}
.ob.no{background:#fee8e8;border-color:var(--no)}
.ob .ol{font-weight:700;min-width:18px;color:var(--ac)}
.ob.ok .ol{color:var(--ok)}
.ob.no .ol{color:var(--no)}

.qans{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)}
.qans.show{display:block;animation:fi .25s}
.qans .al{font-weight:600;color:var(--ok);font-size:12.5px}
.qans .at{font-size:12.5px;line-height:1.8;margin-top:4px}

.sab{margin-top:8px;padding:5px 14px;background:var(--ac);color:#fff;border:none;border-radius:5px;font-size:12px;cursor:pointer}
.sab:hover{background:#0066d6}
.oans{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)}
.oans.show{display:block;animation:fi .25s}

.exp{background:var(--card);border-radius:10px;padding:20px 22px;margin-top:20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.exp h3{font-size:15px;margin-bottom:10px}
.exp .ec{font-size:13.5px;line-height:1.9}

table{border-collapse:collapse;width:100%;margin:10px 0;font-size:12.5px}
th,td{border:1px solid var(--bd);padding:6px 10px;text-align:left}
th{background:#f5f5f7;font-weight:600}

@keyframes fi{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:768px){.side{width:200px}.main{padding:16px}}
</style>
</head>

  <div class="side-n" id="nav"></div>
</div>
<div class="main" id="mc">

</div>
<script>
const D=[{"chTitle":"第十三章 金融工具与保险合同","header":"# 第十三章 金融工具与保险合同\r\n\r\n考情速览\r\n\r\n\r\n\r\n## 教材主要变化\r\n\r\n（1）将本章原章名“金融工具”修改为“金融工具与保险合同”；\r\n\r\n（2）增加“以现金或其他金融工具净额结算，或者以交换金融工具结算的非金融项目合同的会计处理”相关表述；\r\n\r\n（3）将第四节“金融工具的计量”修改为“金融工具的确认和计量”，并增加“金融资产和金融负债的确认和终止确认”相关表述；\r\n\r\n（4）增加“为金融工具组合提供信用增级对单项金融工具预期信用损失计量的影响”相关表述；\r\n\r\n（5）在“金融工具的减值”部分增加二道例题;\r\n\r\n（6）增加“第八节保险合同概述”相关内容。\r\n\r\n## 考点框架\r\n\r\n<table><tr><td colspan=\"3\" rowspan=\"1\">金融工具与保险合同</td></tr><tr><td colspan=\"1\" rowspan=\"2\">金融工具概述</td><td colspan=\"1\" rowspan=\"1\">金融资产</td><td colspan=\"1\" rowspan=\"1\">●中</td></tr><tr><td colspan=\"1\" rowspan=\"1\">衍生工具</td><td colspan=\"1\" rowspan=\"1\">●中</td></tr><tr><td colspan=\"1\" rowspan=\"3\">金融资产和金融负债的分类和重分类</td><td colspan=\"1\" rowspan=\"1\">金融资产的分类</td><td colspan=\"1\" rowspan=\"1\">难</td></tr><tr><td colspan=\"1\" rowspan=\"1\">金融负债的分类</td><td colspan=\"1\" rowspan=\"1\">中</td></tr><tr><td colspan=\"1\" rowspan=\"1\">嵌人式衍生工具</td><td colspan=\"1\" rowspan=\"1\">难</td></tr><tr><td colspan=\"1\" rowspan=\"3\">金融负债和权益工具的区分</td><td colspan=\"1\" rowspan=\"1\">金融负债和权益工具的区分</td><td colspan=\"1\" rowspan=\"1\">难</td></tr><tr><td colspan=\"1\" rowspan=\"1\">复合金融工具</td><td colspan=\"1\" rowspan=\"1\">难</td></tr><tr><td colspan=\"1\" rowspan=\"1\">永续债等类似金融工具的会计处理</td><td colspan=\"1\" rowspan=\"1\">难</td></tr><tr><td colspan=\"1\" rowspan=\"6\">金融工具的确认和计量</td><td colspan=\"1\" rowspan=\"1\">金融资产和金融负债的确认和终止确认</td><td colspan=\"1\" rowspan=\"1\">中</td></tr><tr><td colspan=\"1\" rowspan=\"1\">金融资产和金融负债的初始计量</td><td colspan=\"1\" rowspan=\"1\">●中</td></tr><tr><td colspan=\"1\" rowspan=\"1\">金融资产的后续计量</td><td colspan=\"1\" rowspan=\"1\">难</td></tr><tr><td colspan=\"1\" rowspan=\"1\">金融负债的后续计量</td><td colspan=\"1\" rowspan=\"1\">难</td></tr><tr><td colspan=\"1\" rowspan=\"1\">金融工具的减值</td><td colspan=\"1\" rowspan=\"1\">难</td></tr><tr><td colspan=\"1\" rowspan=\"1\">金融工具的重分类</td><td colspan=\"1\" rowspan=\"1\">难</td></tr><tr><td colspan=\"1\" rowspan=\"3\">金融资产转移</td><td colspan=\"1\" rowspan=\"1\">金融资产终止确认的一般原则</td><td colspan=\"1\" rowspan=\"1\">●中</td></tr><tr><td colspan=\"1\" rowspan=\"1\">金融资产终止确认的判断流程</td><td colspan=\"1\" rowspan=\"1\">难</td></tr><tr><td colspan=\"1\" rowspan=\"1\">金融资产转移的会计处理</td><td colspan=\"1\" rowspan=\"1\">难</td></tr><tr><td colspan=\"1\" rowspan=\"5\">套期会计</td><td colspan=\"1\" rowspan=\"1\">套期会计概述</td><td colspan=\"1\" rowspan=\"1\">●中</td></tr><tr><td colspan=\"1\" rowspan=\"1\">套期工具和被套期项目</td><td colspan=\"1\" rowspan=\"1\">●中</td></tr><tr><td colspan=\"1\" rowspan=\"1\">套期关系评估（略）</td><td colspan=\"1\" rowspan=\"1\">1</td></tr><tr><td colspan=\"1\" rowspan=\"1\">确认和计量</td><td colspan=\"1\" rowspan=\"1\">中</td></tr><tr><td colspan=\"1\" rowspan=\"1\">信用风险口的公允价值选择权</td><td colspan=\"1\" rowspan=\"1\">●00易</td></tr><tr><td colspan=\"2\" rowspan=\"1\">金融工具的披露</td><td colspan=\"1\" rowspan=\"1\">●中</td></tr><tr><td colspan=\"1\" rowspan=\"3\">保险合同概述</td><td colspan=\"1\" rowspan=\"1\">保险合同基本概念</td><td colspan=\"1\" rowspan=\"1\">●00易</td></tr><tr><td colspan=\"1\" rowspan=\"1\">保险合同会计处理的总体要求</td><td colspan=\"1\" rowspan=\"1\">●00易</td></tr><tr><td colspan=\"1\" rowspan=\"1\">其他类型的合同</td><td colspan=\"1\" rowspan=\"1\">●00易</td></tr></table>\r\n\r\n## 考点剖析\r\n\r\n本章是重点章节之一，金融资产的分类及其账务处理、金融负债和权益工具的区分、金融工具减值等都是本章要着重学习的内容，这些知识点让人望而生畏，但实际着手去学的时候就会发现“事有必至，理有固然”。","sections":[{"title":"第一节 金融工具概述","content":"恭喜您解锁新章节！使用微信或“会计云课堂”App 扫码，过关更高效！\r\n\r\n\r\n\r\n金融工具，是指形成一方的金融资产并形成其他方的金融负债或权益工具的合同。\r\n\r\n金融工具分为基础金融工具和衍生工具，如发行在外的普通股属于基础金融工具，因为股票的存在衍生的股票期权、认股权证等则属于衍生工具。\r\n\r\n## 点拨\r\n\r\n（1）金融工具包括金融资产、金融负债和权益工具；\r\n\r\n（2）非合同权利或义务不是金融工具，如应交所得税不是金融负债。\r\n\r\n<table><tr><td>项目</td><td>发行方</td><td>购买方</td></tr><tr><td>发行股票</td><td>借：银行存款 贷：股本 资本公积一股本溢价</td><td>借：交易性金融资产等 贷：银行存款</td></tr><tr><td>发行债券</td><td>借：银行存款 贷：应付债券</td><td>借：债权投资等 贷：银行存款</td></tr></table>\r\n\r\n## 一、金融资产\r\n\r\n考点难度●●〇中\r\n\r\n金融资产，是指企业持有的现金、其他方的权益工具以及符合下列条件之一的资产：\r\n\r\n1.从其他方收取现金或其他金融资产的合同权利。\r\n\r\n## 点拨\r\n\r\n预付账款，未来得到的是商品或服务，不是收取现金或其他金融资产的权利，不属于金融资产。\r\n\r\n2．在潜在有利条件下，与其他方交换金融资产或金融负债的合同权利。例如，甲公司持有一项在6个月后以每股10元的价格购买乙上市公司股票的看涨期权。6个月后标的股票的市价超过10元，则甲公司将行使期权。\r\n\r\n3．将来须用或可用企业自身权益工具进行结算的非衍生工具合同，且企业根据该合同将收到可变数量的自身权益工具。\r\n\r\n例如，甲企业为上市公司，2×25年2月1日，为回购其普通股股份，与乙企业签订合同，并向其支付100万元现金。根据合同，乙企业将于2×25年6月30日向甲企业交付与100 万元等值的甲企业普通股。甲企业可获取普通股的具体数量以2×25年6月30日甲企业的股价确定。\r\n\r\n甲企业应当确认一项金融资产。\r\n\r\n4.将来须用或可用企业自身权益工具进行结算的衍生工具合同，但以固定数量的自身权益工具交换固定金额的现金或其他金融资产的衍生工具合同除外。\r\n\r\n例如，甲企业于2×25年2月1日向乙企业支付5000元购人以自身普通股为标的的看涨期权。根据该期权合同，甲企业有权以每股100元的价格从乙企业购人甲企业普通股1000股，行权日为2×26年6月30日。在行权日，期权将以甲企业普通股净额结算。假设行权日甲企业普通股的每股市价为125元，则期权的公允价值为25000元［1000×（125-100）]，则甲企业会收到200股（25000/125）自身普通股对看涨期权进行净额结算。\r\n\r\n甲企业应当将该看涨期权确认为一项衍生金融资产。\r\n\r\n提示 本章不涉及金融资产中的长期股权投资和货币资金的会计处理。\r\n\r\n【例题1·单选题】下列关于金融资产的说法中，错误的是（ ）。  \r\nA.金融资产包含从其他单位收取现金或其他金融资产的合同权利  \r\nB.将来须用或可用企业自身权益工具进行结算的衍生工具合同，以固定数量的自身权益工具交换固定金额的现金或其他金融资产的衍生工具合同，属于金融资产  \r\nC.将来须用或可用企业自身权益工具进行结算的非衍生工具合同，且企业根据该合同将收到可变数量的自身权益工具，属于金融资产  \r\nD.金融资产包含持有的其他方的权益工具\r\n\r\n解析 选项B，属于权益工具。\r\n\r\n## 二、衍生工具\r\n\r\n考点难度●●○ 中\r\n\r\n衍生工具，是指属于金融工具准则范围并同时具备下列特征的金融工具或其他合同：\r\n\r\n1.其价值随特定利率、金融工具价格、商品价格、汇率、价格指数、费率指数、信用等级、信用指数或其他变量的变动而变动，变量为非金融变量的，该变量不应与合同的任何一方存在特定关系。\r\n\r\n2.不要求初始净投资，或者与对市场因素变化预期有类似反应的其他合同相比，要求较少的初始净投资。\r\n\r\n例（真）题-答案」1.B\r\n\r\n\r\n\r\n3．在未来某一日期结算。\r\n\r\n点拨 常见的衍生工具包括远期合同、期货合同、互换合同和期权合同等。\r\n\r\n对于能够以现金或其他金融工具净额结算，或者通过交换金融工具结算的买人或卖出非金融项目的合同，除了企业按照预定的购买、销售或使用要求签订并持有旨在收取或交付非金融项目的合同适用其他相关会计准则外，企业应当将该合同视同金融工具。\r\n\r\n企业在期货交易场所通过频繁签订买卖标准仓单的合同以赚取差价、不提取标准仓单对应的商品实物的，应当将其签订的买卖标准仓单的合同（而非标准仓单本身）视同金融工具，并按照金融工具的规定进行会计处理。\r\n\r\n对于能够以现金或其他金融工具净额结算，或者通过交换金融工具结算的买人或卖出非金融项目的合同，即使企业按照预定的购买、销售或使用要求签订并持有旨在收取或交付非金融项目的合同的，企业也可以在合同开始时将该合同指定为以公允价值计量且其变动计人当期损益的金融资产或金融负债。"},{"title":"第二节 金融资产和金融负债的分类和重分类","content":"企业应当根据其管理金融资产的业务模式和金融资产的合同现金流量特征，将金融资产划分为以下三类：\r\n\r\n（1）以摊余成本计量的金融资产；\r\n\r\n（2）以公允价值计量且其变动计人其他综合收益的金融资产；\r\n\r\n（3）以公允价值计量且其变动计入当期损益的金融资产。\r\n\r\n企业应当结合自身业务的特点和风险管理要求，对金融负债进行合理分类。企业对所有金融负债均不得进行重分类。\r\n\r\n## 一、金融资产的分类5年热点|4次\r\n\r\n考点难度●难\r\n\r\n## （一）关于企业管理金融资产的业务模式\r\n\r\n## 1.业务模式评估\r\n\r\n企业管理金融资产的业务模式，是指企业如何管理其金融资产以产生现金流量。业务模式决定企业所管理金融资产现金流量的来源是收取合同现金流量、出售金融资产还是两者兼有。\r\n\r\n提示 企业确定其管理金融资产的业务模式时，应当注意以下方面：\r\n\r\n（1）企业应当在金融资产组合的层次上确定管理金融资产的业务模式，而不必按照单个金融资产逐项确定业务模式。\r\n\r\n（2）一个企业可能会采用多个业务模式管理其金融资产。\r\n\r\n（3）企业应当以企业关键管理人员决定的对金融资产进行管理的特定业务目标为基础，确定管理金融资产的业务模式。其中，“关键管理人员”是指有权力并负责计划、指挥和控制企业活动的人员。\r\n\r\n## 点拨\r\n\r\n集团及各子公司应当根据各自的实际情况确定其管理金融资产的业务模式。对于同一金融资产组合，集团和子公司对其管理该组合的业务模式的判断通常一致。\r\n\r\n（4）企业的业务模式并非企业自愿指定，通常可以从企业为实现其目标而开展的特定活动中得以反映。\r\n\r\n（5）企业不得以按照合理预期不会发生的情形为基础确定管理金融资产的业务模式。\r\n\r\n此外，如果金融资产实际现金流量的实现方式不同于评估业务模式时的预期（如企业出售的金融资产数量超出或少于在对资产作出分类时的预期），只要企业在评估业务模式时已经考虑了当时所有可获得的相关信息，这一差异不构成企业财务报表的前期差错，也不改变企业在该业务模式下持有的剩余金融资产的分类。但是，企业在评估新的金融资产的业务模式时，应当考虑这些信息。\r\n\r\n## 2.以收取合同现金流量为目标的业务模式\r\n\r\n在以收取合同现金流量为目标的业务模式下，企业管理金融资产旨在通过在金融资产存续期内收取合同付款来实现现金流量，而不是通过持有并出售金融资产产生整体回报。\r\n\r\n企业在评估金融资产是否属于该业务模式时，应当考虑此前出售此类资产的原因、时间、频率和出售的价值，以及对未来出售的预期。\r\n\r\n如果企业能够解释出售的原因并且证明出售并不反映业务模式的改变，出售频率或者出售价值在特定时期内增加不一定与以收取合同现金流量为目标的业务模式相矛盾。\r\n\r\n提示 以下情形金融资产的业务模式仍然可能是以收取合同现金流量为目标：\r\n\r\n（1）金融资产的信用风险增加时为减少因信用恶化所导致的潜在信用损失而将其出售；\r\n\r\n（2）出售只是偶然发生（即使价值重大），或者单独及汇总出售的价值非常小（即使频繁发生）；\r\n\r\n（3）临近到期出售且出售所得接近待收取的剩余合同现金流量。\r\n\r\n## 3.以收取合同现金流量和出售金融资产为目标的业务模式\r\n\r\n在同时以收取合同现金流量和出售金融资产为目标的业务模式下，企业的关键管理人员认为收取合同现金流量和出售金融资产对于实现其管理目标而言都是不可或缺的。例如，企业的目标是管理日常流动性需求同时维持特定的收益率，或将金融资产的存续期与相关负债的存续期进行匹配。\r\n\r\n（1）满足流动性需求的债券；\r\n\r\n（2）因日常管理资金的需要贴现时满足终止确认条件的应收票据；\r\n\r\n（3）出售债券投资用于在建工程等。\r\n\r\n以上属于“既收取合同现金流量又出售”的业务模式。\r\n\r\n## 提示\r\n\r\n（1）如果一项金融资产对外“出售”但并未终止确认，意味着企业仍将通过收取该金融资产存续期内合同现金流量的方式实现经济利益，该种业务模式不满足“通过持有并出售金融资产产生整体回报”的情形。因此，金融资产管理业务模式中的“出售”，应当是满足会计终止确认条件下的金融资产出售行为。\r\n\r\n（2）根据信用风险及延期付款风险的大小，将应收票据分为两类：\r\n\r\n①信用等级较高的银行承兑汇票，其信用风险和延期付款风险很小，并且票据相关的利率风险已转移给银行，因此可以判断已背书或已贴现票据所有权上的主要风险和报酬已经转移，可以终止确认；\r\n\r\n②信用等级不高的银行承兑汇票或者由企业承兑的商业承兑汇票，此类票据的主要风险为信用风险和延期付款风险，背书和贴现不影响追索权，票据相关的信用风险和延期付款风险仍没有转移，不应终止确认。\r\n\r\n## 4.其他业务模式\r\n\r\n如果企业管理金融资产的业务模式，不是以收取合同现金流量为目标，也不是以收取合同现金流量和出售金融资产为目标，则该企业管理金融资产的业务模式是其他业务模式。\r\n\r\n【真题2·单选题】下列各项关于企业管理金融资产业务模式的表述中,正确的是（ ）。（2025年回忆版）\r\n\r\nA.企业应当以关键管理人员决定对金融资产进行管理的特定业务目标为基础，确定管理金融资产的业务模式\r\n\r\nB.企业预期在压力情形下会偶然出售某项金融资产，则管理该金融资产的业务模式为以出售金融资产为目标\r\n\r\nC.企业应按照单个金融资产逐项确定管理金融资产的业务模式，不应在金融资产组合层次上确定管理金融资产的业务模式\r\n\r\nD.企业预期其持有的金融资产市场价格会发生变动，则管理该金融资产的业务模式并非以收取合同现金流量为目标\r\n\r\n解析）企业持有金融资产的目的是交易性的或者基于金融资产的公允价值作出决策并对其进行管理，企业管理金融资产的目标是通过出售金融资产以实现现金流量，企业预期在压力情形下偶然出售金融资产，并不能判定其业务模式为以出售金融资产为目标，选项B错误；企业应当在金融资产组合的层次上确定管理金融资产的业务模式，而不必按照单个金融资产逐项确定业务模式，选项C错误；企业评估管理金融资产的业务模式是否为以收取合同现金流量为目标时，应考虑该类资产此前的出售原因、时间、频率、出售的价值和对未来出售预期等，并不能因为市场价格会发生变动就判定其业务模式并非以收取合同现金流量为目标，选项D错误。\r\n\r\n## （二）关于金融资产的合同现金流量特征\r\n\r\n金融资产的合同现金流量特征，是指金融工具合同约定的、反映相关金融资产经济特征的现金流量属性，企业分类为以摊余成本计量的金融资产和以公允价值计量且其变动计人其他综合收益的金融资产，其合同现金流量特征应当与基本借贷安排相一致。即相关金融资产在特定日期产生的合同现金流量仅为对本金和以未偿付本金金额为基础的利息的支付（本金加利息的合同现金流量特征）。\r\n\r\n本金是指金融资产在初始确认时的公允价值，本金金额可能因提前还款等原因在金融资产的存续期内发生变动；利息包括对货币时间价值、与特定时期未偿付本金金额相关的信用风险、以及其他基本借贷风险（如流动性风险）、成本（如管理费用）和利润的对价。\r\n\r\n需要说明的是，企业应当使用金融资产的计价货币来评估金融资产的合同现金流量特征。此外，如果一项金融资产具有完全追索权并有抵押品作为担保，该事实并不影响企业对其合同现金流量特征的评估。\r\n\r\n将“贷款基准利率”调整为“贷款市场报价利率”本身不会导致相关金融资产不符合本金加利息的合同现金流量特征。\r\n\r\n利率为“贷款市场报价利率+100基点”的贷款符合本金加利息的合同现金流量特征。\r\n\r\n利率为“贷款市场报价利率向上浮动10%”的贷款不符合本金加利息的合同现金流量特征。\r\n\r\n## 点拨\r\n\r\n上浮10%包含杠杆因素，即随着基准利率的上升，实际利率的上升幅度将大于基准利率的上升幅度，不符合基本借贷安排。\r\n\r\n\r\n\r\n提示 关于金融资产合同现金流量特征的评估（解释公告第19号）。\r\n\r\n（1）关于利息的构成要素。\r\n\r\n企业在评估金融资产的合同现金流量是否与基本借贷安排一致时，可能需考虑利息的不同构成要素。利息的评估应当聚焦于企业基于什么获得了补偿，而非获得补偿的金额，尽管后者可能表明企业获得了对除基本借贷风险和成本以外的其他要素的补偿。如果合同现金流量与非基本借贷风险或成本的变量（如权益工具的价值或商品的价格）挂钩，或者合同现金流量代表债务人收入或利润的一部分，则该合同现金流量与基本借贷安排不一致。\r\n\r\n## 点拨\r\n\r\n解释公告第19号规定，在评估利息的构成要素时，应当聚焦于利息“补偿的性质”而非“补偿的金额”。例如，某贷款合同约定，贷款利率与基于市场交易的碳价格指数挂钩。因碳价格指数不属于基本借贷风险和成本的变量，故不符合仅为对本金和以未偿付本金金额为基础的利息的支付。\r\n\r\n（2）关于或有特征引起的合同现金流量变动。\r\n\r\n或有特征引起的合同现金流量在合同现金流量变动（不管现金流量变动可能性的大小）前后均与基本借贷安排一致的，企业仍需评估或有事项的性质。如果或有事项的性质与基本借贷风险和成本的变动直接相关，且合同现金流量的变动方向与基本借贷风险和成本的变动方向相同，则相关金融资产产生的合同现金流量仅为对本金和以未偿付本金金额为基础的利息的支付。\r\n\r\n如果或有事项的性质与基本借贷风险和成本的变动不直接相关（如利率随企业达到合同约定的碳减排量而下调约定基点的贷款），则仅当在所有可能的合同情景下，其合同现金流量与具有相同合同条款、但不包含该或有特征的金融工具所产生的合同现金流量不存在显著差异时，相关金融资产产生的合同现金流量仅为对本金和以未偿付本金金额为基础的利息的支付。\r\n\r\n## 点拨\r\n\r\n实务中还有另外一类情形，贷款利率条款中包含了或有特征条款，例如，某贷款合同约定利率为3%，若债务人当年达到其碳减排量目标，则贷款利率将下调至2.9%，这种情况下“碳减排量目标达成与否”属于或有事项，并非“碳价格指数”变量，属于仅为对本金和以未偿付本金金额为基础的利息的支付，能够通过合同现金流量测试。\r\n\r\n【例题3】工具A是一项具有固定到期日的债券，本金及未偿付本金金额之利息的支付与发行该工具所用货币的通货膨胀指数挂钩。与通货膨胀指数挂钩未利用杠杆，并且对本金进行保护。\r\n\r\n分析）合同现金流量仅为本金及未偿付本金金额之利息的支付。本金及未偿付本金金额之利息的支付通过与非杠杆的通货膨胀指数挂钩，而将货币时间的价值重设为当前水平。换言之，该工具的利率反映的是“真实的”利率。因此，利息金额是未偿付本金金额的货币时间价值的对价。\r\n\r\n然而，如果利息支付额与涉及债务人业绩的另一变量（如，债务人的净收益）挂钩，则合同现金流量就不是本金及未偿付本金金额之利息的支付。\r\n\r\n【例题4·多选题】甲公司发生的下列业务中，符合本金加利息的合同现金流量特征的有（ ）。\r\n\r\nA.与M银行签订借款合同，合同规定，随着使用特定收费公路的车辆数目增多，借款合同的利息将增加\r\n\r\nB.持有一项可转换成固定数量的发行人权益工具的债券\r\n\r\nC.持有一项具有固定到期日的美元债券，债券本金和利息的支付与美国的通胀指数挂钩\r\n\r\nD.购人N公司发行的一项永续债，合同约定，按市场利率支付利息，发行人可自主决定在2年后任一时点回购该工具，并向持有人支付面值和累计应付利息以及合理的额外补偿\r\n\r\n解析选项A，此合同产生了与基本借贷安排无关的合同现金流量风险敞口，因此该金融资产不符合本金加利息的合同现金流量特征。选项B，该债券不符合本金加利息的合同现金流量特征，因为其回报与发行人的权益价值挂钩。选项C，该债券投资未利用杠杆，而且对合同的本金进行保护；利息的支付与非杠杆的通胀指数挂钩，实质上将货币时间价值重设为当前水平，债券的利率反映的是考虑通胀影响的真实利率；因此，利息金额是以未偿付本金金额为基础的货币时间价值的对价，符合本金加利息的合同现金流量特征。选项D，提前偿付金额实质上反映了合同面值和已计提但尚未支付的合同利息，其中可能包括因提前终止合同而支付的合理补偿，符合本金加利息的合同现金流量特征。\r\n\r\n【例题5·多选题】关于金融资产合同现金流量特征的评估，下列表述中正确的有（ ）。A．某贷款合同约定，贷款利率与基于市场交易的碳价格指数挂钩，符合仅为对本金和以未偿付本金金额为基础的利息的支付\r\n\r\nB．或有特征引起的合同现金流量在变动前后均与基本借贷安排一致的，如果或有事项的性质与基本借贷风险和成本的变动直接相关，且合同现金流量的变动方向与基本借贷风险和成本的变动方向相同，则相关金融资产产生的合同现金流量仅为对本金和以未偿付本金金额为基础的利息的支付\r\n\r\nC.某贷款合同约定利率为4%，若债务人当年达到其碳减排量目标，则贷款利率将下调至3.95%，其合同现金流量与具有相同合同条款、但不包含该或有特征的金融工具所产生的合同现金流量不存在显著差异，相关金融资产产生的合同现金流量仅为对本金和以未偿付本金金额为基础的利息的支付\r\n\r\nD.利率随企业达到合同约定的碳减排量而下调约定基点的贷款，其或有事项的性质与基本借贷风险和成本的变动不直接相关\r\n\r\n解析 某贷款合同约定，贷款利率与基于市场交易的碳价格指数挂钩。因碳价格指 数不属于基本借贷风险和成本的变量，故不符合仅为对本金和以未偿付本金金额为基础的 利息的支付，选项A错误。\r\n\r\n## （三）金融资产的具体分类\r\n\r\n<table><tr><td colspan=\"1\" rowspan=\"1\">具体分类</td><td colspan=\"1\" rowspan=\"1\">条件</td><td colspan=\"1\" rowspan=\"1\">科目设置</td><td colspan=\"1\" rowspan=\"1\">示例</td></tr><tr><td colspan=\"1\" rowspan=\"1\">1.以摊余成本计量的金融资产</td><td colspan=\"1\" rowspan=\"1\">同时符合：①企业管理该金融资产的业务模式是以收取合同现金流量为目标②该金融资产的合同条款规定，在特定日期产生的现金流量，仅为对本金和以未偿付本金金额为基础的利息的支付</td><td colspan=\"1\" rowspan=\"1\">银行存款贷款应收账款债权投资等</td><td colspan=\"1\" rowspan=\"1\">①银行向企业客户发放的固定利率贷款，在没有其他特殊安排的情况下，贷款通常符合本金加利息的合同现金流量特征。如果银行管理该贷款的业务模式是以收取合同现金流量为目标，则该贷款可以分类为以摊余成本计量的金融资产②普通债券的合同现金流量是到期收回本金及按约定利率在合同期间按时收取固定或浮动利息的权利。在没有其他特殊安排的情况下，普通债券通常符合本金加利息的合同现金流量特征。如果企业管理该债券的业务模式是以收取合同现金流量为目标，则该债券可以分类为以摊余成本计量的金融资产③企业正常商业往来形成的具有一定信用期限的应收账款，如果企业拟根据应收账款的合同现金流量收取现金，且不打算提前处置应收账款，则该应收账款可以分类为以摊余成本计量的金融资产</td></tr><tr><td colspan=\"1\" rowspan=\"1\">2.以公允价值计量且其变动计人其他综合收益的金融资产</td><td colspan=\"1\" rowspan=\"1\">同时符合：①企业管理该金融资产的业务模式是以收取合同现金流量和出售该金融资产为目标②该金融资产的合同条款规定，在特定日期产生的现金流量，仅为对本金和以未偿付本金金额为基础的利息的支付</td><td colspan=\"1\" rowspan=\"1\">其他债权投资等</td><td colspan=\"1\" rowspan=\"1\">甲企业在销售中通常会给予客户一定期间的信用期。为了盘活存量资产，提高资金使用效率，甲企业与银行签订应收账款无追索权保理总协议，银行向甲企业一次性授信10亿元人民币，甲企业可以在需要时随时向银行出售应收账款。历史上甲企业频繁向银行出售应收账款，且出售金额重大，上述出售满足终止确认的规定本例中，应收账款的业务模式符合“以收取合同现金流量和出售该金融资产为目标”，且该应收账款符合本金加利息的合同现金流量特征，因此应当分类为以公允价值计量且其变动计人其他综合收益的金融资产</td></tr><tr><td colspan=\"1\" rowspan=\"1\">3.以公允价值计量且其变动计人当期损益的金融资产</td><td colspan=\"1\" rowspan=\"1\">上述1和2分类之外的金融资产</td><td colspan=\"1\" rowspan=\"1\">交易性金融资产点拨  企业持有的指定为以公允价值计量且其变动计入当期损益的金融资产也在本科目核算</td><td colspan=\"1\" rowspan=\"1\">企业常见的下列投资产品通常分类为以公允价值计量且其变动计入当期损益的金融资产：股票（不考虑非交易性权益工具投资特殊指定情形）、基金、可转换债券、结构性存款</td></tr></table>\r\n\r\n在初始确认时，如果能够消除或显著减少会计错配，企业可以将金融资产指定为以公允价值计量且其变动计入当期损益的金融资产。该指定一经作出，不得撤销。\r\n\r\n## 问答 企业对购入的银行理财产品应分类为哪一类金融资产？\r\n\r\n答：首先分析理财产品底层基础资产产生的现金流量，如果基础资产的合同现金流量特征与基本借贷安排相一致（如基础资产只有贷款），则按照管理金融资产的业务模式可能分类为以摊余成本计量的金融资产（收取合同现金流量为目标）、以公允价值计量且其变动计入其他综合收益的金融资产（收取合同现金流量＋出售为目标）和以公允价值计量且其变动计入当期损益的金融资产（非上述目标)；如果基础资产不能通过合同现金流量测试（如基础资产涉及基金投资、股权投资等），则分类为以公允价值计量且其变动计入当期损益的金融资产。\r\n\r\n【真题6·单选题】下列各项金融资产中，不能以摊余成本计量的是（）。（2021年）A.现金 B．与黄金价格挂钩的结构性存款C.保本固定收益的银行理财产品 D.随时可以支取的银行定期存款\r\n\r\n（解析）与黄金价格挂钩的结构性存款，一般情况下不符合金融资产合同现金流量特征，不能以摊余成本计量，应分类为以公允价值计量且其变动计入当期损益的金融资产，选项B正确。\r\n\r\n解题攻略金融资产同时符合下列条件的，应当分类为以摊余成本计量的金融资产：①企业管理该金融资产的业务模式是以收取合同现金流量为目标；②该金融资产的合同条款规定，在特定日期产生的现金流量，仅为对本金和以未偿付本金金额为基础的利息的支付。\r\n\r\n## 问答 “应收票据”和“应收账款”如何在资产负债表中列示？\r\n\r\n答：如下表所示。\r\n<table><tr><td rowspan=1 colspan=1>报表项目</td><td rowspan=1 colspan=1>反映内容</td></tr><tr><td rowspan=1 colspan=1>应收票据</td><td rowspan=1 colspan=1>“应收票据”项目，反映资产负债表日以摊余成本计量的、企业因销售商品、提供服务等收到的商业汇票，包括银行承兑汇票和商业承兑汇票</td></tr><tr><td rowspan=1 colspan=1>应收账款</td><td rowspan=1 colspan=1>“应收账款”项目，反映资产负债表日以摊余成本计量的、企业因销售商品、提供服务等经营活动应收取的款项</td></tr><tr><td rowspan=1 colspan=1>应收款项融资</td><td rowspan=1 colspan=1>“应收款项融资”项目，反映资产负债表日以公允价值计量且其变动计入其他综合收益的应收票据和应收账款等</td></tr><tr><td rowspan=1 colspan=1>交易性金融资产</td><td rowspan=1 colspan=1>“交易性金融资产”项目，反映资产负债表日以公允价值计量且其变动计入当期损益的应收票据和应收账款等</td></tr></table>\r\n\r\n## （四）金融资产分类的特殊规定\r\n\r\n## 1.非交易性权益工具投资\r\n\r\n权益工具投资一般不符合本金加利息的合同现金流量特征，因此应当分类为以公允价值计量且其变动计人当期损益的金融资产。然而在初始确认时，企业可以将非交易性权益工具投资指定为以公允价值计量且其变动计人其他综合收益的金融资产，并按照规定确认股利收人。该指定一经作出，不得撤销。企业投资其他上市公司股票或者非上市公司股权的，都可能属于这种情形。\r\n\r\n## （1）关于“非交易性”和“权益工具投资”的界定。\r\n\r\n金融资产或金融负债满足下列条件之一的，表明企业持有该金融资产或承担该金融负债的目的是交易性的：\r\n\r\n①取得相关金融资产的目的主要是为了近期出售，承担相关金融负债的目的主要是为了近期回购。\r\n\r\n②相关金融资产或金融负债在初始确认时属于集中管理的可辨认金融工具组合的一部分，且有客观证据表明近期实际存在短期获利模式。在这种情况下，即使组合中有某个组成项目持有的期限稍长也不受影响。\r\n\r\n③相关金融资产或金融负债属于衍生工具（符合财务担保合同定义的衍生工具以及被指定为有效套期工具的衍生工具除外）。例如，未作为套期工具的利率互换或外汇期权。\r\n\r\n只有不符合上述条件的非交易性权益工具投资才可以被指定为以公允价值计量且其变动计人其他综合收益的金融资产。\r\n\r\n此处权益工具投资中的“权益工具”，是指对于工具发行方来说，满足本章中权益工具定义的工具。\r\n\r\n## 例（真）题-答案」6.B\r\n\r\n\r\n\r\n（2）对于符合金融负债定义但被分类为权益工具的可回售工具（如可随时赎回的开放式基金份额）和发行方仅在清算时才有义务向另一方按比例交付其净资产的金融工具（如属于有限寿命工具的封闭式基金、理财产品的份额或信托计划等寿命固定的结构化主体的份额）等特殊金融工具，因其从发行方的角度而言并不符合本章第三节权益工具的定义，只是在特定会计主体中列报为权益工具，因此从投资方的角度而言，其持有的此类特殊金融工具投资不符合指定为以公允价值计量且其变动计人其他综合收益的金融资产的条件。\r\n\r\n（3）企业在非同一控制下的企业合并中确认的或有对价构成金融资产的，该金融资产应当分类为以公允价值计量且其变动计人当期损益的金融资产，不得指定为以公允价值计量且其变动计人其他综合收益的金融资产。\r\n\r\n## 点拨\r\n\r\n非同一控制下企业合并的或有对价构成金融资产的，通过“交易性金融资产”核算。\r\n\r\n## 2.基本会计处理原则\r\n\r\n初始确认时，企业可基于单项非交易性权益工具投资，将其指定为以公允价值计量且其变动计人其他综合收益的金融资产，其公允价值的后续变动计入其他综合收益，不需计提减值准备。除了获得的股利收人（明确代表投资成本部分收回的股利收人除外）计人当期损益外，其他相关的利得和损失（包括汇兑损益）均应当计人其他综合收益，且后续不得转人损益。\r\n\r\n当金融资产终止确认时，之前计人其他综合收益的累计利得或损失应当从其他综合收益中转出，计人留存收益。\r\n\r\n【例题7·单选题】2×24年12月31日，甲公司以发行新股作为对价，购买乙公司所持  \r\n丙公司60%股份。乙公司在股权转让协议中承诺，在本次交易完成后的3年内（2×25年至  \r\n2×27年）丙公司每年净利润不低于5000万元，若丙公司实际利润低于承诺利润，乙公司将  \r\n按照两者之间的差额及甲公司作为对价发行时的股票价格计算应返还给甲公司的股份数量，并  \r\n在承诺期满后一次性予以返还。2×25年，丙公司实际利润低于承诺利润，经双方确认，乙公  \r\n司应返还甲公司相应的股份数量。不考虑其他因素，下列各项关于甲公司应收取乙公司返还的  \r\n股份在2×25年12月31日合并资产负债表中列示的项目名称是（ ）。A.其他债权投资 B.交易性金融资产C.其他权益工具投资 D.债权投资\r\n\r\n（解析因该预期利润未实现的情况是在购买日后新发生的，不属于对购买日已存在状况提供进一步证据，应于资产负债表日将该或有对价公允价值的变动计入当期损益。乙公司对有关利润差额的补偿将以甲公司不固定的股份数量支付，该或有对价属于金融工具，应当按照金融工具的原则进行处理，甲公司应确认其公允价值并通过交易性金融资产核算。\r\n\r\n（解题攻）或有对价符合权益工具和金融负债定义的，购买方应当将支付或有对价的义务确认为一项权益或负债；符合资产定义并满足资产确认条件的，购买方应当将符合合并协议约定条件的、可收回的部分已支付合并对价的权利确认为一项资产。\r\n\r\n【例题8·多选题】2×25年，甲公司发生的有关交易或事项如下：（1）以300万元购买结  \r\n构性存款，该结构性存款与黄金价格挂钩，预计收益率为5%；（2）买人大豆期货合约，拟在  \r\n到期前进行平仓；（3）以700万元购买乙上市公司发行的可转换公司债券；（4）以600万元认  \r\n购丙合伙企业10%的份额，担任有限合伙人，合伙协议约定合伙期限5年。不考虑其他因素，  \r\n下列各项关于甲公司持有的金融资产会计处理的表述中，正确的有（ ）。A．将持有的期货合约分类为以公允价值计量且其变动计人当期损益的金融资产B.将持有的可转换公司债券分类为以公允价值计量且其变动计人当期损益的金融资产C．将持有的丙合伙企业份额指定为以公允价值计量且其变动计人其他综合收益的金融资产D.将持有的结构性存款分类为以摊余成本计量的金融资产\r\n\r\n解析 买入大豆期货合约，属于衍生工具，应划分为以公允价值计量且其变动计入当期损益的金融资产，选项A正确；\r\n\r\n购买乙上市公司发行的可转换公司债券，不符合本金加利息的合同现金流量特征，应划分为以公允价值计量且其变动计入当期损益的金融资产，选项B正确；\r\n\r\n认购丙合伙企业10%的份额，属于符合金融负债定义但是被分类为权益工具的特殊金融工具，本身并不符合权益工具的定义，因此从投资方的角度也就不符合指定为以公允价值计量且其变动计入其他综合收益的金融资产的条件，选项C错误；\r\n\r\n结构性存款与黄金价格挂钩，通常情况下不符合本金加利息的合同现金流量特征，应划分为以公允价值计量且其变动计入当期损益的金融资产，选项D错误。\r\n\r\n【例题9·多选题】下列项目中，不能指定为以公允价值计量且其变动计人其他综合收益的金融资产的有（ ）。A.购入某非上市公司1%股权投资B.某开放式基金，基金持有人可将基金份额回售给基金C.企业以赚取差价为目的从二级市场购人的股票D.相关金融资产在初始确认时属于集中管理的可辨认金融工具组合的一部分，且有客观证据表明近期实际存在短期获利模式\r\n\r\n解析选项B，该基金发行的基金份额并不符合权益工具的定义，投资人持有的该基金份额，不能指定为以公允价值计量且其变动计入其他综合收益的金融资产；选项C和D，持有金融资产的目的是交易性的，不能指定为以公允价值计量且其变动计入其他综合收益的金融资产。\r\n\r\n## 二、金融负债的分类\r\n\r\n考点难度●●〇中\r\n\r\n（一）除下列各项外，企业应当将金融负债分类为以摊余成本计量的金融负债\r\n\r\n1.以公允价值计量且其变动计入当期损益的金融负债，包括交易性金融负债（含属于金融负债的衍生工具）和指定为以公允价值计量且其变动计人当期损益的金融负债。\r\n\r\n例（真）题-答案丨8.AB9.BCD\r\n\r\n2.不符合终止确认条件的金融资产转移或继续涉人被转移金融资产所形成的金融负债。对此类金融负债，企业应当按照本章第五节相关规定进行计量。\r\n\r\n3.不属于上述情形1和2的财务担保合同，以及不属于上述情形1的以低于市场利率贷款的贷款承诺。\r\n\r\nZ 提示\r\n\r\n在非同一控制下的企业合并中，企业作为购买方确认的或有对价形成金融负债的，该金融负债应当按照以公允价值计量且其变动计入当期损益的金融负债进行会计处理，通过“交易性金融负债”核算。\r\n\r\n## (二）公允价值选择权（略)\r\n\r\n## 三、嵌入式衍生工具\r\n\r\n考点难度●难\r\n\r\n## （一）嵌入式衍生工具的概念\r\n\r\n衍生工具通常是独立存在的，但也可能嵌入非衍生金融工具或其他合同（主合同）中，这种衍生工具称为嵌入衍生工具。嵌入衍生工具与主合同构成混合合同（如企业持有的可转换公司债券）。\r\n\r\n1．主合同通常包括租赁合同、保险合同、服务合同、特许权合同、债务工具合同、合营合同等。\r\n\r\n2.在混合合同中，嵌人衍生工具通常以具体合同条款体现。例如，甲公司签订了按一般物价指数调整租金的3年期租赁合同。\r\n\r\n3.衍生工具如果附属于一项金融工具但根据合同规定可以独立于该金融工具进行转让,或者具有与该金融工具不同的交易对手方，则该衍生工具不是嵌人衍生工具，应当作为一项单独存在的衍生工具处理。例如，某贷款合同可能附有一项相关的利率互换。如该互换能够单独转让，那么该互换是一项独立存在的衍生工具，而不是嵌人衍生工具。\r\n\r\n## （二）嵌入式衍生工具与主合同的关系\r\n\r\n嵌人衍生工具的核算有两种模式，从混合合同中分拆或不分拆。\r\n\r\n<table><tr><td rowspan=1 colspan=1>混合合同包含的主合同属于金融工具准则规范的资产</td><td rowspan=1 colspan=1>应当将该混合合同作为一个整体适用关于金融资产分类的相关规定，不分拆，如购入的可转换公司债券等</td></tr><tr><td rowspan=2 colspan=1>混合合同包含的主合同并非金融工具准则规范的资产</td><td rowspan=1 colspan=1>经济特征和风险与主合同的经济特征和风险紧密相关，不分拆，如租赁合同中租赁付款额取决于消费者价格指数等</td></tr><tr><td rowspan=1 colspan=1>经济特征和风险与主合同的经济特征和风险不紧密相关，结合其他条件决定是否分拆，如发行的可转换公司债券等</td></tr></table>\r\n\r\n一般情况下，如果嵌人衍生工具与主合同的风险敞口不同或者嵌入衍生工具可能对混合合同的现金流量产生重大改变，则嵌人衍生工具的经济特征和风险与主合同的经济特征和风险很可能不紧密相关。例如，主债务工具中嵌人看跌期权，使得持有人有权要求发行人以一定金额的现金或其他资产回购这项工具，其中现金或其他资产的金额随着某一权益工具或商品价格或指数的变动而变动，该看跌期权不与主债务工具紧密相关。\r\n\r\n---\r\n\r\n一项混合合同中的多项嵌入衍生工具通常应视同为一项工具处理。但是，归类为权益的嵌入衍生工具应与归类为资产或负债的嵌人衍生工具分开核算。此外，如果某混合合同嵌人了多项衍生工具而这些衍生工具又与不同的风险敞口相关，且这些嵌人衍生工具易于分离并相互独立，则这些嵌人衍生工具应分别进行核算。\r\n\r\n## （三）嵌入式衍生工具的会计处理\r\n\r\n## 1.嵌人衍生工具的分拆\r\n\r\n混合合同包含的主合同不属于金融工具确认和计量准则规范的资产，且同时符合下列条件的，企业应当从混合合同中分拆嵌入衍生工具，将其作为单独存在的衍生工具处理：\r\n\r\n（1）嵌人衍生工具的经济特征和风险与主合同的经济特征和风险不紧密相关。\r\n\r\n（2）与嵌人衍生工具具有相同条款的单独工具符合衍生工具的定义。\r\n\r\n（3）该混合合同不是以公允价值计量且其变动计入当期损益进行会计处理。\r\n\r\n嵌入衍生工具从混合合同中分拆的，企业应当按照适用的会计准则规定，对混合合同的主合同进行会计处理。对于单独存在的衍生工具，通常应采用公允价值进行初始计量和后续计量。\r\n\r\n2.将混合合同指定为以公允价值计量且其变动计入当期损益的金融工具\r\n\r\n当企业成为混合合同的一方，而主合同不属于金融工具确认和计量准则规范的资产且包含一项或多项嵌人衍生工具时，则企业应识别所有此类嵌人衍生工具、评估其是否需要与主合同分拆、并且对于需与主合同分拆的嵌人衍生工具，应以公允价值进行初始确认和后续计量。与整项金融工具均以公允价值计量且其变动计人当期损益相比，上述要求可能更为复杂或导致可靠性更差。为此，企业可以将整项混合合同指定为以公允价值计量且其变动计人当期损益的金融工具。但下列情况除外：\r\n\r\n（1）嵌人衍生工具不会对混合合同的现金流量产生重大改变。\r\n\r\n（2）在初次确定类似的混合合同是否需要分拆时，几乎不需分析就能明确其包含的嵌人衍生工具不应分拆。如嵌人贷款的提前还款权，允许持有人以接近摊余成本的金额提前偿还贷款，该提前还款权不需要分拆。\r\n\r\n此外，企业无法根据嵌入衍生工具的条款和条件对嵌人衍生工具的公允价值进行可靠计量的，该嵌人衍生工具的公允价值应当根据混合合同公允价值和主合同公允价值之间的差额确定。使用了上述方法后，该嵌人衍生工具在取得日或后续资产负债表日的公允价值仍然无法单独计量的，企业应当将该混合合同整体指定为以公允价值计量且其变动计入当期损益的金融工具。\r\n\r\n【真题10·单选题】下列各项关于企业持有金融资产会计处理的表述中，正确的是（ ）。（2024年回忆版）A.分拆持有的可转换债券中的转股权并对其按公允价值进行后续计量B.持有的浮动收益货币基金按摊余成本计量C.持有的每年将利率重设为1.3倍贷款市场报价利率的长期债券按公允价值计量D.持有的可回售开放式基金份额分类为其他权益工具投资\r\n\r\n（解析）购入可转换债券属于混合合同，转股权属于嵌入衍生工具，混合合同包含的主合同属于《企业会计准则第 22号—金融工具确认和计量》规范的资产的，企业不应从该混合合同中分拆嵌入衍生工具，而应当将该混合合同作为一个整体适用关于金融资产分类的相关规定，选项A错误；持有的浮动收益货币基金，投资者从该类投资中所取得的现金流量既包括投资期间基础资产产生的合同现金流量，也包括处置基础资产的现金流量，一般情况下不符合本金加利息的合同现金流量特征，不能分类为以摊余成本计量的金融资产，选项B错误；持有的每年将利率重设为1.3倍贷款市场报价利率的长期债券，由于包含杠杆因素，则不符合本金加利息的合同现金流量特征，只能分类为以公允价值计量且其变动计入当期损益的金融资产，选项C正确；发行方发行的可回售开放式基金份额不符合权益工具的定义，因此从投资方的角度也就不符合指定为以公允价值计量且其变动计入其他综合收益的金融资产的条件，选项D错误。\r\n\r\n解题攻略利率为“贷款市场报价利率+100基点”的贷款符合本金加利息的合同现金流量特征。利率重设为1.3倍贷款市场报价利率的贷款，由于包含杠杆因素，不符合本金加利息的合同现金流量特征。\r\n\r\n## 四、金融工具的重分类\r\n\r\n（移人本章第四节金融工具的确认和计量讲解）"},{"title":"第三节 金融负债和权益工具的区分","content":"## 一、金融负债和权益工具的区分\r\n\r\n考点难度●●难\r\n\r\n## （一）金融负债和权益工具区分的总体要求\r\n\r\n## 1.金融负债和权益工具的定义\r\n\r\n<table><tr><td colspan=\"2\">结算方式</td><td>金融负债</td><td>权益工具</td></tr><tr><td>交付现金 或其他 金融资产</td><td>是否交付 现金或其他</td><td>换金融资产或金融负债的合同义务。例如， 甲公司向乙公司签出一项在6个月后以每</td><td>融资产给其他方，或在潜 在不利条件下与其他方交</td></tr></table>\r\n\r\n例（真）题-答案」 10.C\r\n\r\n<table><tr><td rowspan=1 colspan=2>结算方式</td><td rowspan=1 colspan=1>金融负债</td><td rowspan=1 colspan=1>权益工具</td></tr><tr><td rowspan=2 colspan=1>自身权益工具</td><td rowspan=1 colspan=1>非衍生工具合同</td><td rowspan=1 colspan=1>根据合同将交付可变数量的自身权益工具。例如，企业取得一项金融资产，并承诺两个月后向卖方交付本企业发行的普通股，交付的普通股数量根据交付时的股价确定，则该项承诺是一项金融负债</td><td rowspan=1 colspan=1>根据合同将交付固定数量的自身权益工具</td></tr><tr><td rowspan=1 colspan=1>衍生工具合同</td><td rowspan=1 colspan=1>股数不固定或交换的现金（或其他金融资产）金额不固定</td><td rowspan=1 colspan=1>股数和交换的现金（或其他金融资产）金额均固定</td></tr></table>\r\n\r\n## 点拨\r\n\r\n（1）合同负债不是金融负债，因其导致流出的未来经济利益是商品或服务，不是交付现金或其他金融资产的合同义务。\r\n\r\n（2）金融负债：\r\n\r\n①交付现金或其他金融资产；\r\n\r\n②以自身权益工具结算的非衍生工具合同，股数不固定；\r\n\r\n③以自身权益工具结算的衍生工具合同，股数或交换的现金（或其他金融资产）金额不固定。\r\n\r\n（3）权益工具：\r\n\r\n①不包括交付现金或其他金融资产；\r\n\r\n②以自身权益工具结算的非衍生工具合同，股数固定；\r\n\r\n③以自身权益工具结算的衍生工具合同，股数和交换的现金（或其他金融资产）金额均固定。\r\n\r\n【例题11·单选题】甲公司为制造业企业，下列交易或事项形成的现时义务，属于金融负债的是（）。A.为已销售产品计提质量保证金5000万元B.按年度奖金计划计提的应付职工薪酬30万元C.预收乙公司商品采购款800万元D.向证券公司借入丙上市公司100万股股票对外出售\r\n\r\n解析选项A属于预计负债，选项B属于应付职工薪酬，选项C属于合同负债，均不属于金融负债。\r\n\r\n2.区分金融负债和权益工具需考虑的因素\r\n\r\n（1）合同所反映的经济实质\r\n\r\n应当以相关合同条款及其所反映的经济实质而非仅以法律形式为依据（实质重于形式会计信息质量要求）。\r\n\r\n（2）工具的特征\r\n\r\n企业应当全面细致地分析此类金融工具各组成部分的合同条款，以确定其显示的是金融负债还是权益工具的特征，并进行整体评估，以判定整个工具应划分为金融负债或权益工具，还是既包括金融负债成分又包括权益工具成分的复合金融工具。\r\n\r\n## （二）金融负债和权益工具区分的基本原则5年热点丨2次\r\n\r\n\r\n\r\n1.是否存在无条件地避免交付现金或其他金融资产的合同义务\r\n\r\n（1）如果企业不能无条件地避免以交付现金或其他金融资产来履行一项合同义务，则该合同义务符合金融负债的定义。\r\n\r\n①不能无条件避免赎回，即金融工具发行方不能无条件地避免赎回此金融工具。\r\n\r\n如果一项合同（除准则规定分类为权益工具的特殊金融工具外）使发行方承担了以现金或其他金融资产回购自身权益工具的义务，即使发行方的回购义务取决于合同对手方是否行使回售权，发行方应当在初始确认时将该义务确认为一项金融负债，其金额等于回购所需支付金额的现值。如果发行方最终无须以现金或其他金融资产回购自身权益工具，应当在合同对手方回售权到期时将该项金融负债按照账面价值重分类为权益工具。\r\n\r\n②强制付息，即金融工具发行方被要求强制支付利息。\r\n\r\n（2）如果企业能够无条件地避免交付现金或其他金融资产，则分类为权益工具。\r\n\r\n①能够根据相应的议事机制自主决定是否支付股息（即无支付股息的义务），同时所发行的金融工具没有到期日且合同对手方没有回售权，或虽有固定期限但发行方有权无限期递延（即无支付本金的义务），则此类交付现金或其他金融资产的结算条款不构成金融负债。\r\n\r\n②如果发放股利由发行方根据相应的议事机制自主决定，则股利是累积股利还是非累积股利本身均不会影响该金融工具被分类为权益工具。\r\n\r\n## 提示\r\n\r\n股利制动机制：不宣告支付优先股股利，则不能宣告支付普通股股利；股利推动机制：宣告支付普通股股利，则必须宣告支付优先股股利；发行方根据相应的议事机制能够自主决定普通股股利的支付，则“股利制动机制”及“股利推动机制”本身均不会导致相关金融工具被分类为一项金融负债。\r\n\r\n（3）判断一项金融工具是划分为权益工具还是金融负债，不受下列因素的影响：①以前实施分配的情况；②未来实施分配的意向；③相关金融工具如果没有发放股利对发行方普通股的价格可能产生的负面影响；④发行方的未分配利润等可供分配权益的金额；③发行方对一段期间内的损益的预期；⑥发行方是否有能力影响其当期损益。\r\n\r\n## 2.是否通过交付固定数量的自身权益工具结算\r\n\r\n如果一项金融工具须用或可用企业自身权益工具进行结算，需要考虑用于结算该工具的企业自身权益工具，是作为现金或其他金融资产的替代品，还是为了使该工具持有方享有发行方\r\n\r\n扣除所有负债后的资产中的剩余权益。如果是前者，该工具是发行方的金融负债；如果是后者，该工具是发行方的权益工具。\r\n\r\n## 点拨\r\n\r\n所有者权益体现的是剩余权益，若划分为权益工具，在发行金融工具时可确定每股净资产金额。\r\n\r\n（1）以自身权益工具结算的非衍生工具\r\n\r\n股数固定：权益工具。\r\n\r\n股数不固定：金融负债。\r\n\r\n（2）以自身权益工具结算的衍生工具\r\n\r\n固定换固定：权益工具。\r\n\r\n其他：金融负债。\r\n\r\n【真题12·单选题】2×20年7月1日，甲公司发行了100万份优先股，每份面值100元,  \r\n年股息率为6%。该优先股无期限，无赎回机制，但将在10年后强制转换为普通股，该优先股  \r\n是否发放股息需经甲公司董事会和股东会批准，如果优先股股东不派息，则普通股股东也不能  \r\n分配股利。甲公司在判断该优先股应划分为权益工具还是金融负债时，下列各项因素中应考虑  \r\n的是（）。（2022年）A.拟定的未来派息计划B.以往类似工具的股利分配情况C.将优先股转换为普通股的价格、数量条款D.不发放股利对发行方普通股价格可能产生的负面影响\r\n\r\n解析该优先股应划分为权益工具还是金融负债应当关注“是否通过交付固定数量的自身权益工具结算”，也就是将优先股转为普通股的价格、数量条款，选项C正确。\r\n\r\n解题攻略）金融负债与权益工具的区分依据是金融工具的合同条款，选项A、B和D不是合同条款，在判断金融工具分类时均不考虑。\r\n\r\n（三）以外币计价的配股权、期权或认股权证\r\n\r\n通常情况下不符合“固定换固定”原则（折算的记账本位币金额不固定），应分类为金融负债，但是，准则对以外币计价的配股权、期权或认股权证提供了一个例外情况：企业对全部现有同类别非衍生自身权益工具的持有方同比例发行配股权、期权或认股权证，使之有权按比例以固定金额的任何货币交换固定数量的该企业自身权益工具的，该类配股权、期权或认股权证应当分类为权益工具。这是一个范围很窄的例外情况，不能以类推方式适用于其他工具（如以外币计价的可转换债券和并非按比例发行的配股权、期权或认股权证）。\r\n\r\n## （四）或有结算条款 5年热点丨3次\r\n\r\n对于附有或有结算条款的金融工具，发行方不能无条件地避免交付现金、其他金融资产或以其他导致该工具成为金融负债的方式进行结算的，应当分类为金融负债。\r\n\r\n有例外，如只有在发行方清算时，才需以现金、其他金融资产或以其他导致该工具成为金融负债的方式进行结算等，应当分类为权益工具。\r\n\r\n## （五）结算选择权\r\n\r\n对于存在结算选择权的衍生工具（例如，合同规定发行方或持有方能选择以现金净额或以发行股份交换现金等方式进行结算的衍生工具），发行方应当将其确认为金融负债或金融资产，如果可供选择的结算方式均表明该衍生工具应当确认为权益工具，则应当确认为权益工具。\r\n\r\n例如，为防止附有转股权的金融工具的持有方行使转股权而导致发行方的普通股股东的股权被稀释，发行方会在衍生工具合同中加人一项现金结算选择权：发行方有权以等值于所应交付的股票数量乘以股票市价的现金金额支付给工具持有方，而不再发行新股。\r\n\r\n发行方应当将这样的转股权确认为衍生金融负债或衍生金融资产。\r\n\r\n## （六）合并财务报表中金融负债和权益工具的区分 5年热点丨2次\r\n\r\n在合并财务报表中对金融工具（或其组成部分）进行分类时，企业应考虑集团成员和金融工具的持有方之间达成的所有条款和条件，以确定集团作为一个整体是否由于该工具而承担了交付现金或其他金融资产的义务，或者承担了以其他导致该工具分类为金融负债的方式进行结算的义务。例如，某集团一子公司发行一项权益工具，同时其母公司或集团其他成员与该工具的持有方达成了其他附加协议，母公司或集团其他成员可能对相关的支付金额（如股利）作出担保；或者集团另一成员可能承诺在该子公司不能支付预期款项时购买这些股份。在这种情形下，尽管集团子公司（发行方）在没有考虑这些附加协议的情况下，在其个别财务报表中将这项工具分类为权益工具，但是在合并财务报表中，集团与该工具的持有方之间的附加协议的影响意味着集团作为一个整体无法避免经济利益的转移，导致其分类为金融负债。\r\n\r\n【真题·13·多选题】甲公司为乙公司的母公司；甲公司向乙公司现有少数股东签出看跌  \r\n期权，如果未来6个月后乙公司股票价格下跌，乙公司少数股东有权要求甲公司以固定价格购  \r\n买乙公司少数股东所持有乙公司股份。不考虑其他因素，下列会计表述中正确的有（ ）。  \r\n（2025年回忆版）A．甲公司合并财务报表中将看跌期权确认为权益B.乙公司无须进行会计处理C.甲公司个别财务报表中将看跌期权确认为衍生金融负债D.甲公司合并财务报表中将少数股东行权时甲公司需支付金额的现值确认为一项金融负债\r\n\r\n解析该交易发生在甲公司和乙公司少数股东之间，乙公司无须进行会计处理，选项B正确；在甲公司个别财务报表中，由于该看跌期权的价值随着乙公司股票价格的变动而变动，并将于未来约定日期进行结算，因此该看跌期权符合衍生工具的定义而确认为一项衍生金融负债，选项C正确；在集团合并财务报表层面，由于看跌期权使集团整体承担了不能无条件避免支付现金的合同义务，应确认为一项金融负债，其金额等于回购所需支付金额的现值，选项A错误，选项D正确。\r\n\r\n## （七）特殊金融工具的区分\r\n\r\n特殊金融工具包括可回售工具和发行方仅在清算时才有义务向另一方按比例交付其净资产的金融工具。\r\n\r\n## 1.可回售工具\r\n\r\n可回售工具是指根据合同约定，持有方有权将该工具回售给发行方以获取现金或其他金融资产的权利，或者在未来某一不确定事项发生或者持有方死亡或退休时，自动回售给发行方的金融工具。\r\n\r\n符合金融负债定义，但同时具有下列特征的可回售工具，应当分类为权益工具：\r\n\r\n（1）赋予持有方在企业清算时按比例份额获得该企业净资产的权利；\r\n\r\n（2）该工具所属的类别次于其他所有工具类别；\r\n\r\n（3）该类别的所有工具具有相同的特征；\r\n\r\n（4）除了发行方应当以现金或其他金融资产回购或赎回该工具的合同义务外，该工具不满足金融负债定义中的任何其他特征；\r\n\r\n（5）该工具在存续期内的预计现金流量总额，应当实质上基于该工具存续期内企业的损益、已确认净资产的变动、已确认和未确认净资产的公允价值变动（不包括该工具的任何影响）。\r\n\r\n2.发行方仅在清算时才有义务向另一方按比例交付其净资产的金融工具\r\n\r\n## 点拨\r\n\r\n清算确定将会发生且不受发行方的控制（如发行方本身是有限寿命主体），或者发生与否取决于该工具的持有方。\r\n\r\n符合金融负债定义，但同时具有下列特征的发行方仅在清算时才有义务向另一方按比例交付其净资产的金融工具，应当分类为权益工具（例如封闭式基金、理财产品的份额、信托计划等寿命固定的结构化主体的份额，实务中也称为有限寿命工具）：\r\n\r\n（1）赋予持有方在企业清算时按比例份额获得该企业净资产的权利；\r\n\r\n（2）该工具所属的类别次于其他所有工具类别；\r\n\r\n（3）在次于其他所有类别的工具类别中，发行方对该类别中所有工具都应当在清算时承担按比例份额交付其净资产的同等合同义务。\r\n\r\n## 3.特殊金融工具分类为权益工具的其他条件\r\n\r\n分类为权益工具的可回售工具，或发行方仅在清算时才有义务向另一方按比例交付其净资产的金融工具，除应当具有上述1和2所述特征外，其发行方应当没有同时具备下列特征的其他金融工具或合同：\r\n\r\n（1）现金流量总额实质上基于企业的损益、已确认净资产的变动、已确认和未确认净资产的公允价值变动（不包括该工具或合同的任何影响）；\r\n\r\n（2）实质上限制或固定了该工具持有方所获得的剩余回报。\r\n\r\n## 4.特殊金融工具在母公司合并财务报表中的处理\r\n\r\n由于将某些可回售工具以及仅在清算时才有义务向另一方按比例交付其净资产的金融工具列报为权益工具而不是金融负债是金融工具列报准则规定原则的一个例外，即不允许将该例外扩大到发行方母公司合并财务报表中少数股东权益的分类。因此，子公司在个别财务报表中作为权益工具列报的特殊金融工具，在其母公司合并财务报表中对应的少数股东权益部分，应当分类为金融负债。\r\n\r\n## 5.特殊金融工具持有方的会计处理\r\n\r\n特殊金融工具对于发行方而言不满足权益工具的定义，投资方不能将其指定为以公允价值计量且其变动计人其他综合收益的金融资产。\r\n\r\n## 问答\r\n\r\n监管规则适用指引—会计类第1号：附回售条款的股权投资如何进行会计处理？\r\n\r\n答：对于附回售条款的股权投资，投资方除拥有与普通股股东一致的投票权及分红权等权利之外，还拥有一项回售权，例如投资方与被投资方约定，若被投资方未能满足特定目标，投资方有权要求按投资成本加年化10%收益（假设代表被投资方在市场上的借款利率水平）的‘价将该股权回售给被投资方。该回售条款导致被投资方存在无法避免向投资方交付现金的合同义务。基于投资方对被投资方的持股比例和影响程度不同，区分为以下两种情形：\r\n\r\n情形1：投资方持有被投资方股权比例为3%，对被投资方没有重大影响。\r\n\r\n情形2：投资方持有被投资方股权比例为30%，对被投资方有重大影响。\r\n\r\n现就上述两种情形下被投资方和投资方的会计处理意见如下：\r\n\r\n情形1:\r\n\r\n从被投资方角度看，由于被投资方存在无法避免的向投资方交付现金的合同义务，应分类为金融负债进行会计处理。\r\n\r\n从投资方角度看，投资方对被投资方没有重大影响，该项投资应适用金融工具准则。因该项投资不满足权益工具定义，合同现金流量特征不满足仅为对本金和以未偿付本金金额为基础的利息的支付，应分类为以公允价值计量且其变动计入当期损益的金融资产。\r\n\r\n情形2：\r\n\r\n被投资方的会计处理同情形1。\r\n\r\n从投资方角度看，长期股权投资准则所规范的投资为权益性投资，因该准则中并没有对权益性投资进行定义，企业需要遵照实质重于形式的原则，结合相关事实和情况进行分析和判断。投资方应考虑该特殊股权投资附带的回售权以及回售权需满足的特定目标是否表明其风险和报酬特征明显不同于普通股。如果投资方实质上承担的风险和报酬与普通股股东明显不同，该项投资应当整体作为金融工具核算，相关会计处理同情形1。如果投资方承担的风险和报酬与普通股股东实质相同，因对被投资方具有重大影响，应分类为长期股权投资，回售权应视为一项嵌入衍生工具，并进行分拆处理。对投资方而言，持有上述附回售条款的股权投资期间所获得的股利，应按该股权投资的分类，适用具体会计准则规定进行处理。\r\n\r\n【真题14·单选题】2×24年3月15日，甲公司与乙公司签订增资协议，约定乙公司向甲公司增资8000万元，增资后乙公司持有甲公司6%的普通股股权，若甲公司在2×28年12月31日前无法实现特定净利润目标，乙公司有权要求甲公司回购乙公司持有的股权，回购价格为增资款与按年化收益率10%计算的收益之和；若在2×28年12月31日前甲公司实现特定净利润目标，乙公司的回购权自动失效。2×24年3月15日，甲公司收到增资款，并办理完成股权变更登记手续。不考虑其他因素，下列各项关于甲公司会计处理的表述中，正确的是（）。（2025年回忆版）\r\n\r\nA.将实现特定净利润目标的概率和增资款相乘得出的金额分类为权益，并将增资款剩余部分计入金融负债\r\n\r\nB.将增资款和回购权整体指定为以公允价值计量且其变动计人当期损益的金融负债\r\n\r\n\r\n\r\nC.按回购所需支付金额的现值确认金融负债D.将回购权的公允价值从增资款中分拆，并确认为一项单独的衍生金融工具\r\n\r\n解析若甲公司在2×28年12月31日前无法实现特定净利润目标，乙公司有权要求甲公司回购乙公司持有的股权，回购价格为增资款与按年化收益率10%计算的收益之和，说明该协议附有或有结算条款，且不属于“几乎不具有可能性”的情形，甲公司不能无条件地避免以现金回购自身权益工具的合同义务，应将该义务按回购所需支付金额的现值确认为金融负债，选项C正确。\r\n\r\n【例题15·单选题】2×25年1月1日，甲公司与财务投资者签订增资协议，约定以每股  \r\n10元的价格向财务投资者增发4000万股股份（每股面值1元），若甲公司在3年内无法实现  \r\n首次公开发行股票并上市，甲公司应当以投资金额和按年利率8%计算的利息向财务投资者回  \r\n购全部本次增发的股份。当日，甲公司收到财务投资者支付的全部增资款项。不考虑其他因素，  \r\n下列各项关于甲公司会计处理的表述中，正确的是（ ）。A．增加资本公积40000万元B．增加股本4000万元和长期应付款36000万元C．增加长期应付款40000万元D.增加股本40000万元\r\n\r\n（解析）甲公司签订的增资协议中约定，若甲公司在3年内无法实现首次公开发行股票并上市，甲公司应当以投资金额和按年利率8%计算的利息向财务投资者回购全部本次增发的股份，即财务投资者有权将该工具回售给甲公司，所以甲公司签订的增资协议中包含一项回售权。该回售条款导致甲公司存在无法避免向投资者交付现金的合同义务，所以甲公司应当将收到的增资款全部作为金融负债处理，计入长期应付款，选项C正确。\r\n\r\n解题攻略此题甲公司应当以投资金额和按年利率8%计算的利息向财务投资者回购全部本次增发的股份，其负债不是按公允价值计量，应通过“长期应付款”科目核算；若回购价格以回购日股份的公允价值和出资额按照年化8%的利率计算的本息和两者敦高确定，其负债应按公允价值计量，通过“交易性金融负债”科目核算。\r\n\r\n## （八）金融负债和权益工具之间的重分类\r\n\r\n由于发行的金融工具原合同条款约定的条件或事项随着时间的推移或经济环境的改变而发生变化，可能会导致已发行金融工具（含特殊金融工具）的重分类。\r\n\r\n<table><tr><td rowspan=1 colspan=1>重分类</td><td rowspan=1 colspan=1>会计处理</td></tr><tr><td rowspan=1 colspan=1>权益工具重分类为金融负债</td><td rowspan=1 colspan=1>金融负债按公允价值计量，权益工具账面价值与金融负债公允价值的差额确认为权益</td></tr><tr><td rowspan=1 colspan=1>金融负债重分类为权益工具</td><td rowspan=1 colspan=1>权益工具按重分类日金融负债的账面价值计量，无差额</td></tr></table>\r\n\r\n点拨\r\n\r\n（1）权益工具转金融负债：账面转公允，差额计权益；\r\n\r\n（2）金融负债转权益工具：账面转账面，转换无差额。\r\n\r\n【例题16·多选题】下列各项中，应当计人发生当期损益的有（ ）。  \r\nA．以现金结算的股份支付形成的负债在结算前资产负债表日公允价值变动  \r\nB.将分类为权益工具的金融工具重分类为金融负债时公允价值与账面价值的差额  \r\nC.以摊余成本计量的金融资产重分类为以公允价值计量且其变动计人当期损益的金融资产时公允价值与原账面价值的差额  \r\nD.自用房地产转换为采用公允价值模式计量的投资性房地产时公允价值小于原账面价值的差额\r\n\r\n解析选项A，以现金结算的股份支付形成的负债在结算前资产负债表日公允价值变动计入公允价值变动损益；选项B，将分类为权益工具的金融工具重分类为金融负债时，公允价值与账面价值的差额计入资本公积等，不影响损益；选项C，以摊余成本计量的金融资产重分类为以公允价值计量且其变动计入当期损益的金融资产时，公允价值与原账面价值的差额计入公允价值变动损益；选项D，自用房地产转换为采用公允价值模式计量的投资性房地产时公允价值小于原账面价值的差额计入公允价值变动损益。\r\n\r\n## （九）收益和库存股\r\n\r\n1.发行方对利息、股利、利得或损失的处理\r\n\r\n（1）属于金融负债：计入当期损益；\r\n\r\n（2）属于权益工具：作为权益的变动处理。\r\n\r\n2.库存股\r\n\r\n回购自身权益工具（库存股）支付的对价和交易费用，应当减少所有者权益，不得确认为金融资产。\r\n\r\n3.对每股收益计算的影响\r\n\r\n参见第二十八章。\r\n\r\n## 二、复合金融工具 5年热点丨3次\r\n\r\n考点难度●●难\r\n\r\n企业发行的某些非衍生金融工具（如可转换公司债券等）既含有负债成分，又含有权益成分。对此，企业应当在初始确认时将负债和权益成分进行分拆，分别进行处理。\r\n\r\n在进行分拆时，应当先确定负债成分的公允价值并以此作为其初始确认金额，再按照该金融工具整体的发行价格扣除负债成分初始确认金额后的金额确定权益成分的初始确认金额。\r\n\r\n可转换公司债券的账务处理：\r\n\r\n<table><tr><td>业务事项</td><td>会计处理</td></tr><tr><td>发行可转换公司债券</td><td>借：银行存款 应付债券一利息调整（或贷方） 贷：应付债券一面值 其他权益工具（权益成分的公允价值）</td></tr></table>\r\n\r\n例（真）题-答案」16.ACD\r\n\r\n<table><tr><td rowspan=1 colspan=1>业务事项</td><td rowspan=1 colspan=1>会计处理</td></tr><tr><td rowspan=1 colspan=1>转换股份前</td><td rowspan=1 colspan=1>可转换公司债券的负债成分，在转换为股份前，其会计处理与一般公司债券相同，即按照摊余成本和实际利率确认利息费用，按面值和票面利率确认票面利息，差额作为利息调整进行摊销</td></tr><tr><td rowspan=1 colspan=1>转换股份时</td><td rowspan=1 colspan=1>借：应付债券一面值、利息调整、应计利息（账面余额）其他权益工具贷：股本（股票面值×转换的股数）资本公积一股本溢价（差额）</td></tr></table>\r\n\r\n## 点拨\r\n\r\n（1）发行可转换公司债券时，“应付债券”科目反映的是负债成分的公允价值，发行收款大于负债成分公允价值部分属于权益成分公允价值，通过“其他权益工具”科目核算；\r\n\r\n（2）发行费用按负债成分和权益成分的公允价值比例分摊。\r\n\r\n## 提示\r\n\r\n（1）企业可能修订可转换工具的条款以促成持有方提前转换。在条款修订日，对于持有方根据修订后的条款进行转换所能获得的对价的公允价值与根据原有条款进行转换所能获得的对价的公允价值之间的差额，企业（发行方）应将其确认为一项损失。\r\n\r\n（2）企业发行认股权和债权分离交易的可转换公司债券，所发行的认股权符合有关权益工具定义的，应当确认为一项权益工具（其他权益工具），并以发行价格减去不附认股权且其他条件相同的公司债券公允价值后的净额进行计量。认股权持有方到期没有行权的，应当在到期时将原计入其他权益工具的部分转入资本公积（股本溢价）。\r\n\r\n【例题17·单选题】2×25年3月1日，甲公司发行可转换债券募集资金1000万元，每张  \r\n可转换债券的面值为100元，票面年利率为2%（低于不附带转股权的类似债券的市场年利率）,  \r\n期限为5年，债券持有人有权在第2年要求甲公司按本金和尚未支付利息的合计金额进行赎回，  \r\n或有权在第3年末以每股10元的价格按债券面值将所持有的可转换债券转换为甲公司的普通股  \r\n股票。不考虑其他因素，下列各项关于甲公司可转换债券会计处理的表述中，正确的是（ ）。A.将可转换债券的转股权作为权益工具核算B.每年按可转换债券发行金额1000万元和票面年利率2%计算并确认利息费用C.将可转换债券整体指定为以公允价值计量且其变动计人其他综合收益的金融负债D.将可转换债券的赎回权单独拆分并作为衍生金融工具核算\r\n\r\n解析企业发行的可转换公司债券，应当在初始确认时将其包含的负债成分和权益成分进行分拆，将负债成分确认为应付债券，将权益成分确认为其他权益工具，选项A正确，选项C和D错误；每年按可转换债券负债成分的期初摊余成本和实际年利率计算并确认利息费用，选项B错误。\r\n\r\n（解题攻略）可转换公司债券转换成普通股，转换金额和转换的股数都是固定的，所以转股权属于权益工具。\r\n\r\n例（真）题-答案」 17.A\r\n\r\n## 三、永续债等类似金融工具的会计处理 5年热点丨2次\r\n\r\n## （一）永续债等类似金融工具发行方会计分类应当考虑的因素\r\n\r\n永续债等类似金融工具（以下简称“永续债”）发行方在确定永续债的会计分类是权益工具还是金融负债（以下简称“会计分类”）时，应当根据金融工具列报准则的规定并同时考虑下列因素：到期日、清偿顺序、利率跳升和间接义务。\r\n\r\n## 1.关于到期日\r\n\r\n永续债发行方在确定永续债会计分类时，应当以合同到期日等条款内含的经济实质为基础，谨慎判断是否能无条件地避免交付现金或其他金融资产的合同义务。\r\n\r\n当永续债合同其他条款未导致发行方承担交付现金或其他金融资产的合同义务时，发行方应当区分下列情况处理：\r\n\r\n<table><tr><td rowspan=1 colspan=2>合同的相关规定</td><td rowspan=1 colspan=1>会计分类</td></tr><tr><td rowspan=1 colspan=2>永续债合同明确规定无固定到期日且持有方在任何情况下均无权要求发行方赎回该永续债或清算的，通常表明发行方没有交付现金或其他金融资产的合同义务</td><td rowspan=1 colspan=1>权益工具</td></tr><tr><td rowspan=2 colspan=1>永续债合同未规定固定到期日且同时规定了未来赎回时间（即“初始期限”）</td><td rowspan=1 colspan=1>当该初始期限仅约定为发行方清算日时，通常表明发行方没有交付现金或其他金融资产的合同义务。但清算确定将会发生且不受发行方控制，或者清算发生与否取决于该永续债持有方的，发行方仍具有交付现金或其他金融资产的合同义务</td><td rowspan=2 colspan=1>金融负债</td></tr><tr><td rowspan=1 colspan=1>当该初始期限不是发行方清算日且发行方能自主决定是否赎回永续债时，发行方应当谨慎分析自身是否能无条件地自主决定不行使赎回权。如不能，通常表明发行方有交付现金或其他金融资产的合同义务</td></tr></table>\r\n\r\n## 2.关于清偿顺序\r\n\r\n永续债发行方在确定永续债会计分类时，应当考虑合同中关于清偿顺序的条款。当永续债合同其他条款未导致发行方承担交付现金或其他金融资产的合同义务时，发行方应当区分下列情况处理：\r\n\r\n<table><tr><td rowspan=1 colspan=1>合同的相关规定</td><td rowspan=1 colspan=1>会计分类</td></tr><tr><td rowspan=1 colspan=1>合同规定发行方清算时永续债劣后于发行方发行的普通债券和其他债务，通常表明发行方没有交付现金或其他金融资产的合同义务</td><td rowspan=1 colspan=1>权益工具</td></tr><tr><td rowspan=1 colspan=1>合同规定发行方清算时永续债与发行方发行的普通债券和其他债务处于相同清偿顺序的，应当审慎考虑此清偿顺序是否会导致持有方对发行方承担交付现金或其他金融资产合同义务的预期，并据此确定其会计分类</td><td rowspan=1 colspan=1>金融负债或权益工具</td></tr></table>\r\n\r\n## 3.关于利率跳升和间接义务\r\n\r\n永续债发行方在确定永续债会计分类时，应当考虑“间接义务”。永续债合同规定没有固定到期日、同时规定了未来赎回时间、发行方有权自主决定未来是否赎回且如果发行方决定不赎回则永续债票息率上浮（即“利率跳升”或“票息递增”）的，发行方应当结合所处实际环境考虑该利率跳升条款是否构成交付现金或其他金融资产的合同义务。\r\n\r\n<table><tr><td rowspan=1 colspan=1>合同的相关规定</td><td rowspan=1 colspan=1>间接义务</td></tr><tr><td rowspan=1 colspan=1>（1）如果跳升次数有限、有最高票息限制（即“封顶”）且封顶利率未超过同期同行业同类型工具平均的利率水平（2）跳升总幅度较小且封顶利率未超过同期同行业同类型工具平均的利率水平</td><td rowspan=1 colspan=1>可能不构成间接义务</td></tr><tr><td rowspan=1 colspan=1>如果永续债合同条款虽然规定了票息封顶，但该封顶票息水平超过同期同行业同类型工具平均的利率水平</td><td rowspan=1 colspan=1>通常构成间接义务</td></tr></table>\r\n\r\n## （二）永续债持有方会计分类的要求\r\n\r\n除符合第六章长期股权投资规定适用范围外，永续债持有方应当按下列规定对永续债进行会计处理：\r\n\r\n<table><tr><td>属于权益工具投资</td><td>不属于权益工具投资 （持有方应当谨慎考虑永续债中包含的选择权）</td></tr><tr><td>（1）分类为以公允价值计量且其变动计人当期 损益的金融资产 （2）对非交易性权益工具投资初始指定为以公 允价值计量且其变动计人其他综合收益的金融 资产（在符合条件时）</td><td>分类为： （1）以摊余成本计量的金融资产 （2）以公允价值计量且其变动计入其他综合收 益的金融资产 （3）以公允价值计量且其变动计人当期损益的 金融资产</td></tr></table>"},{"title":"第四节 金融工具的确认和计量","content":"## 、金融资产和金融负债的确认和终止确认\r\n\r\n考点难度●●○中\r\n\r\n## （一）金融资产和金融负债的确认\r\n\r\n企业成为金融工具合同的一方时，应当确认一项金融资产或金融负债。\r\n\r\n企业确认金融资产或金融负债的常见情形如下：\r\n\r\n（1）当企业成为金融工具合同的一方，并因此拥有收取现金的权利或承担支付现金的义务时，应将无条件的应收款项或应付款项确认为金融资产或金融负债。\r\n\r\n（2）因买卖商品或劳务的确定承诺而将获得的资产或将承担的负债，通常直到至少合同一方履约才予以确认。例如，收到订单的企业通常不在承诺时确认一项资产（发出订单的企业也不在承诺时确认一项负债)，而是直到所订购的商品或劳务已装运、交付或提供时才予以确认。\r\n\r\n（3）企业应在成为属于金融工具的远期合同的一方时（承诺日而不是结算日），确认一项金融资产或金融负债。当企业成为远期合同的一方时，权利和义务的公允价值通常相等，因此，该远期合同的公允价值净额为零。如果权利和义务的公允价值净额不为零，则该合同应被确认为一项金融资产或金融负债。\r\n\r\n（4）企业应在成为属于金融工具的期权合同的一方时，确认一项金融资产或金融负债。\r\n\r\n当企业尚未成为合同一方时，即使企业已有计划在未来交易，不管其发生的可能性有多大，企业均不应确认相关金融资产或金融负债。\r\n\r\n## （二）金融负债的终止确认\r\n\r\n金融负债终止确认，是指企业将之前确认的金融负债从其资产负债表中予以转出。\r\n\r\n金融负债（或其一部分）的现时义务已经解除的，企业应当终止确认该金融负债（或该部分金融负债）。企业（借人方）与借出方之间签订协议，以承担新金融负债方式替换原金融负债，且新金融负债与原金融负债的合同条款实质上不同的，企业应当终止确认原金融负债，同时确认一项新金融负债。企业对原金融负债（或其一部分）的合同条款作出实质性修改的，应当终止确认原金融负债，同时按照修改后的条款确认一项新金融负债。其中，“实质上不同”或“实质性修改”是指按照新的或修改后的合同条款，金融负债未来现金流量（包括支付和收取的任何费用）现值与原金融负债的剩余期间现金流量现值之间的差异至少相差10%，有关现值的计算均采用原金融负债的实际利率。\r\n\r\n上述金融负债满足终止确认条件的日期被称为结算日。\r\n\r\n## 提示 关于采用电子支付系统结算的金融负债的终止确认（解释公告第19号）。\r\n\r\n企业采用电子支付系统以现金结算一项金融负债（或其一部分）的，仅当企业已启动付款指令并同时满足下列条件时，可选择在结算日之前将其终止确认：\r\n\r\n（1）企业没有实际能力撤回、停止或取消付款指令；\r\n\r\n（2）企业没有实际能力支取因付款指令而将用于结算的现金；\r\n\r\n（3）与电子支付系统相关的结算风险不重大。例如，电子支付系统是按照标准管理流程完成付款指令，且从满足前述两项条件至向交易对手交付现金之间的时间间隔很短。如果付款指令的执行取决于企业在结算日能否交付现金，则与电子支付系统相关的结算风险不可视为不重大。\r\n\r\n【例题18·单选题】甲公司2×26年1月3日从乙公司采购货物应付购货款100万元，甲  \r\n公司通过电子支付系统向乙公司支付100万元，用于结算应付账款（系2×26年1月3日从乙  \r\n公司采购货物产生）。（1）2×26年1月10日，甲公司在其银行电子支付系统启动向乙公司银  \r\n行的付款指令，甲公司没有能力取消付款指令，没有实际能力支取用于结算的现金，与电子支  \r\n付系统相关的结算风险不重大；（2）2×26年1月11日，资金离开甲公司银行账户，乙公司收  \r\n到甲公司的付款通知；（3）2×26年1月12日，双方银行完成资金划转（结算日）。不考虑其  \r\n他因素，甲公司可以终止确认应付账款的最早时间是（ ）。A.2×26年1月3日 B.2×26年1月10日C.2×26年1月11日 D.2×26年1月12日\r\n\r\n（解析）根据解释公告第19号规定，2×26年1月10日甲公司已启动付款指令并同时满足可选择在结算日之前终止确认相关金融负债的三项条件，可以终止确认应付账款，选项B正确。\r\n\r\n金融资产终止确认见本章第五节。\r\n\r\n## 二、金融资产和金融负债的初始计量 5年热点丨4次\r\n\r\n考点难度●●○ 中\r\n\r\n<table><tr><td rowspan=1 colspan=1>分类</td><td rowspan=1 colspan=1>初始成本</td><td rowspan=1 colspan=1>公允价值与交易价格差额的会计处理</td></tr><tr><td rowspan=1 colspan=1>以公允价值计量且其变动计入当期损益的金融资产或金融负债</td><td rowspan=1 colspan=1>公允价值</td><td rowspan=2 colspan=1>（1）活跃市场报价或可观察输入值确定公允价值：计人当期利得或损失（2）其他方式确定公允价值：应予递延，后续摊销计人利得或损失</td></tr><tr><td rowspan=1 colspan=1>其他类别的金融资产或金融负债</td><td rowspan=1 colspan=1>公允价值+交易费用（资产）-交易费用（负债）</td></tr></table>\r\n\r\n交易费用，是指可直接归属于购买、发行或处置金融工具的增量费用。增量费用是指企业没有发生购买、发行或处置相关金融工具的情形就不会发生的费用，包括支付给代理机构、券商、咨询公司、证券交易所、政府有关部门等的佣金、手续费、相关税费以及其他必要支出，不包括债券溢价、折价、融资费用、内部管理成本和持有成本等与交易不直接相关的费用。\r\n\r\n## 提示\r\n\r\n（1）企业初始确认金融资产和金融负债，应当按照公允价值计量。对于以公允价值计量且其变动计入当期损益的金融资产和金融负债，相关交易费用应当直接计入当期损益；对于其他类别的金融资产和金融负债，相关交易费用应当计入初始确认金额。但是企业初始确认的应收账款未包含《企业会计准则第14号—收入》所定义的重大融资成分或根据《企业会计准则第14号—收入》规定不考虑不超过一年的合同中的融资成分的，应当按照该准则定义的交易价格进行初始计量。\r\n\r\n（2）企业取得金融资产所支付的价款中包含的已宣告但尚未发放的现金股利或已过付息期但尚未收到的利息，应当确认为应收项目处理。\r\n\r\n【例题19·多选题】下列各项关于企业发生的与金融工具相关交易费用会计处理的表述中，正确的有（ ）。A．发行可转换债券发生的相关交易费用分摊计人权益和负债B.发行股票发生的相关交易费用计入权益C．购人债券并按摊余成本进行后续计量的，发生的相关交易费用计人当期损益D.购入股票并将其指定为以公允价值计量且其变动计人其他综合收益的金融资产，发生的相关交易费用计人金融资产的初始确认金额\r\n\r\n解析购入债券并按摊余成本进行后续计量的，发生的相关交易费用应当计入债券的初始确认金额，选项C错误。\r\n\r\n## （一）金融资产后续计量原则\r\n\r\n点拨 金融资产的后续计量与金融资产的分类密切相关。\r\n\r\n企业应当对不同类别的金融资产，分别以摊余成本、以公允价值计量且其变动计人其他综合收益或以公允价值计量且其变动计入当期损益进行后续计量。\r\n\r\n需要注意的是，企业在对金融资产进行后续计量时，如果一项金融工具以前被确认为一项金融资产并以公允价值计量，而现在它的公允价值低于零，企业应将其确认为一项负债。但对于主合同为金融资产的混合合同，即使整体公允价值可能低于零，企业应当始终将混合合同整体作为一项金融资产进行分类和计量。\r\n\r\n## （二）以摊余成本计量的金融资产的会计处理\r\n\r\n## 1.实际利率\r\n\r\n实际利率法，是指计算金融资产或金融负债的摊余成本以及将利息收人或利息费用分摊计人各会计期间的方法。\r\n\r\n实际利率，是指将金融资产或金融负债在预计存续期的估计未来现金流量，折现为该金融资产账面余额（不考虑减值）或该金融负债摊余成本所使用的利率。\r\n\r\n经信用调整的实际利率，是指将购人或源生的已发生信用减值的金融资产在预计存续期的估计未来现金流量，折现为该金融资产当前摊余成本的利率。\r\n\r\n## 2.摊余成本\r\n\r\n金融资产或金融负债的摊余成本，应当以该金融资产或金融负债的初始确认金额经下列调整确定：\r\n\r\n（1）扣除已偿还的本金。\r\n\r\n（2）加上或减去采用实际利率法将该初始确认金额与到期日金额之间的差额进行摊销形成的累计摊销额。\r\n\r\n（3）扣除计提的累计信用减值准备（仅适用于金融资产）。\r\n\r\n## 点拨 账面余额以初始确认金额经（1）和（2）调整确定；摊余成本=账面余额-（3）。\r\n\r\n企业与交易对手方修改或重新议定合同，未导致金融资产终止确认，但导致合同现金流量发生变化的，或者企业修正了对合同现金流量的估计的，应当重新计算该金融资产的账面余额，并将相关利得或损失计入当期损益。\r\n\r\n重新计算的该金融资产的账面余额，应当根据将重新议定或修改的合同现金流量按金融资产的原实际利率（或者购买或源生的已发生信用减值的金融资产应按经信用调整的实际利率）折现的现值确定。对于修改或重新议定合同所产生的所有成本或费用，企业应当调整修改后的金融资产账面价值并在修改后金融资产的剩余期限内摊销。\r\n\r\n## 3.会计处理（以债权投资为例）\r\n\r\n核算科目：债权投资\r\n\r\n<table><tr><td rowspan=1 colspan=1>项目</td><td rowspan=1 colspan=1>会计处理</td></tr><tr><td rowspan=1 colspan=1>（1）债权投资的初始计量</td><td rowspan=1 colspan=1>借：债权投资一成本（面值）一利息调整（差额，或贷方）应收利息（已过付息期但尚未收到的利息）贷：银行存款等</td></tr><tr><td rowspan=1 colspan=1>（2）债权投资的后续计量</td><td rowspan=1 colspan=1>借：债权投资一应计利息（债券按票面利率计算的利息）贷：投资收益（债权投资期初账面余额或期初摊余成本乘以实际利率或经信用调整的实际利率计算确定的利息收人）债权投资一利息调整（差额，利息调整摊销额，或借方）借：信用减值损失贷：债权投资减值准备或相反分录</td></tr><tr><td rowspan=1 colspan=1>（3）出售债权投资</td><td rowspan=1 colspan=1>借：银行存款等债权投资减值准备贷：债权投资一成本／利息调整（或借方）/应计利息投资收益（差额，或借方）</td></tr></table>\r\n\r\n## 点拨 利息收入的计算\r\n\r\n<table><tr><td rowspan=1 colspan=2>情形</td><td rowspan=1 colspan=1>利息收入的计算</td></tr><tr><td rowspan=1 colspan=2>未发生信用减值</td><td rowspan=1 colspan=1>期初账面余额×实际利率</td></tr><tr><td rowspan=1 colspan=2>购入或源生的已发生信用减值</td><td rowspan=1 colspan=1>期初摊余成本×经信用调整的实际利率</td></tr><tr><td rowspan=2 colspan=1>购入或源生的未发生信用减值</td><td rowspan=1 colspan=1>后续期间已发生信用减值</td><td rowspan=1 colspan=1>期初摊余成本×实际利率</td></tr><tr><td rowspan=1 colspan=1>信用风险有所改善而不存在信用减值</td><td rowspan=1 colspan=1>期初账面余额×实际利率</td></tr></table>\r\n\r\n【例题20·单选题】2×25年1月1日，甲公司支付1947万元购入乙公司当日发行的期  \r\n限为3年、每年年末付息、到期偿还面值的公司债券。该债券的面值为2000万元，票面年利  \r\n率为5%，实际年利率为6%。甲公司将该债券分类为以摊余成本计量的金融资产。不考虑其  \r\n他因素，2×25年12月31日，该债券投资的账面价值是（）万元。A. 1930.18 B. 1963.82 C. 1947 D. 2063.82\r\n\r\n（解析）2×25年12月31日，该债券投资的账面价值 $= 1 9 4 7 \\times ( 1 + 6 \\% ) - 2 0 0 0 \\times 5 \\% =$ 1963.82（万元）。\r\n\r\n\r\n\r\n## （三）以公允价值进行后续计量的金融资产的会计处理5年热点丨4次\r\n\r\n1.对于以公允价值进行后续计量的金融资产，其公允价值变动形成的利得或损失，除与套期会计有关外，应当按照下列规定处理：\r\n\r\n（1）以公允价值计量且其变动计人当期损益的金融资产的利得或损失，应当计人当期损益。\r\n\r\n（2）分类为以公允价值计量且其变动计人其他综合收益的金融资产（采用“其他债权投资”科目核算）所产生的利得或损失，除减值损失或利得和汇兑损益之外，均应当计人其他综合收益，直至该金融资产终止确认或被重分类。但是采用实际利率法计算的该金融资产的利息应当计入当期损益。该类金融资产计人各期损益的金额应当与视同其一直按摊余成本计量而计人各期损益的金额相等。\r\n\r\n## 点拨 该类金融资产计提减值：\r\n\r\n借：信用减值损失\r\n\r\n贷：其他综合收益\r\n\r\n从整个分录看，计提减值既影响损益，也影响其他综合收益。教材中的表述，仅考虑计提减值对信用减值损失的影响。\r\n\r\n该金融资产终止确认时，之前计人其他综合收益的累计利得或损失应当从其他综合收益中转出，计人当期损益。\r\n\r\n（3）指定为以公允价值计量且其变动计人其他综合收益的非交易性权益工具投资，除了获得的股利（属于投资成本收回部分除外）计人当期损益外，其他相关的利得和损失（包括汇兑损益）均应当计人其他综合收益，且后续不得转入当期损益。当其终止确认时，之前计人其他综合收益的累计利得或损失应当从其他综合收益中转出，计人留存收益。\r\n\r\n2.企业只有在同时符合下列条件时，才能确认股利收入并计入当期损益：\r\n\r\n（1）企业收取股利的权利已经确立；\r\n\r\n（2）与股利相关的经济利益很可能流人企业；\r\n\r\n（3）股利的金额能够可靠计量。\r\n\r\n3.以公允价值计量且其变动计人当期损益的金融资产的会计处理。\r\n\r\n## 核算科目：交易性金融资产\r\n\r\n<table><tr><td>项目</td><td>会计处理</td></tr><tr><td>（1）企业取得交易 性金融资产</td><td>借：交易性金融资产一成本（公允价值） 投资收益（发生的交易费用） 应收股利（已宣告但尚未发放的现金股利） 应收利息（已过付息期但尚未收到的利息） 贷：银行存款等 点拨 交易性金融资产的交易费用不计入初始成本，而是计入投资</td></tr></table>\r\n\r\n\r\n\r\n<table><tr><td rowspan=1 colspan=1>项目</td><td rowspan=1 colspan=1>会计处理</td></tr><tr><td rowspan=1 colspan=1>（2）持有期间的股利或利息</td><td rowspan=1 colspan=1>借：应收股利（被投资单位宣告发放的现金股利×持股比例）交易性金融资产一应计利息（资产负债表日按票面利率计算的利息）贷：投资收益点拨  交易性金融资产不采用实际利率法确认利息收入</td></tr><tr><td rowspan=1 colspan=1>（3）资产负债表日公允价值变动</td><td rowspan=1 colspan=1>①公允价值上升借：交易性金融资产一公允价值变动贷：公允价值变动损益②公允价值下降借：公允价值变动损益贷：交易性金融资产一公允价值变动</td></tr><tr><td rowspan=1 colspan=1>（4）出售交易性金融资产</td><td rowspan=1 colspan=1>借：银行存款（出售净价，即价款扣除手续费）贷：交易性金融资产一成本一应计利息一公允价值变动（或借方）投资收益（差额，或借方）</td></tr></table>\r\n\r\n## 问答\r\n\r\n出售交易性金融资产时，是否将交易性金融资产持有期间形成的公允价值变动损益转入投资收益？\r\n\r\n答：此问题有不同观点。如果在同一个年度取得并出售，应该将持有期间形成的公允价值变动损益转入投资收益。如2×24年6月1日取得的交易性金融资产，其成本为100万元，2×24年6月30日其公允价值为110万元，应确认公允价值变动损益10万元，2×24年7月10日将其对外出售，售价为120万元，在2×24年度利润表中应确认投资收益20万元（120-100），但出售交易性金融资产时售价与账面价值差额计入投资收益只有10万元，因此应将6月30日形成的公允价值变动损益10万元转入投资收益。\r\n\r\n如果不是在同一个年度取得并出售，不应该将持有期间形成的公允价值变动损益转入投资收益。如2×24年12月1日取得的交易性金融资产，其成本为100万元，2×24年12月31日其公允价值为110万元，应确认公允价值变动损益10万元，年度终了，应将其转入本年利润，公允价值变动损益无余额。2×25年1月10日将其对外出售，售价为120万元，出售交易性金融资产时售价与账面价值差额计入投资收益10万元，如果将公允价值变动损益转入投资收益，虽然2×25年利润表中反映的投资收益为20万元，但会出现不正常的“公允价值变动收益”-10万元。因此，有人认为不应将公允价值变动损益转入投资收益。\r\n\r\n目前，按教材做法，出售交易性金融资产时，不将交易性金融资产持有期间形成的公允价值变动损益转入投资收益。\r\n\r\n## 提示\r\n\r\n采用公允价值模式进行后续计量的投资性房地产对外出售时，是否将持有期间的“公允价值变动损益”转入“其他业务成本”也存在争议。争议问题以教材为准，即出售时将“公允价值变动损益”转入“其他业务成本”。\r\n\r\n4.以公允价值计量且其变动计人其他综合收益的金融资产（债务工具）的会计处理。\r\n\r\n核算科目：其他债权投资\r\n\r\n<table><tr><td rowspan=1 colspan=1>项目</td><td rowspan=1 colspan=1>会计处理</td></tr><tr><td rowspan=1 colspan=1>（1）企业取得金融资产</td><td rowspan=1 colspan=1>借：其他债权投资一成本（面值）一利息调整（差额，或贷方）应收利息（已过付息期但尚未收到的利息）贷：银行存款等</td></tr><tr><td rowspan=1 colspan=1>（2）资产负债表日计算利息</td><td rowspan=1 colspan=1>借：其他债权投资一应计利息（债券按票面利率计算的利息）贷：投资收益「其他债权投资的期初账面余额（不含公允价值变动）或摊余成本乘以实际利率或经信用调整的实际利率计算确定的利息收入]其他债权投资一利息调整（差额，或借方）点拨  利息收入的计算原则与“债权投资”相同</td></tr><tr><td rowspan=1 colspan=1>（3）资产负债表日公允价值变动</td><td rowspan=1 colspan=1>①公允价值上升借：其他债权投资一公允价值变动贷：其他综合收益②公允价值下降借：其他综合收益贷：其他债权投资一公允价值变动点拨A.期末“公允价值累计变动”=期末公允价值－期末账面余额（不含公允价值变动）B．本期“公允价值变动”=A-期初“公允价值累计变动”</td></tr><tr><td rowspan=1 colspan=1>（4）确认或转回信用减值</td><td rowspan=1 colspan=1>借：信用减值损失贷：其他综合收益或相反分录</td></tr><tr><td rowspan=1 colspan=1>（5）出售其他债权投资</td><td rowspan=1 colspan=1>借：银行存款等贷：其他债权投资（账面价值）投资收益（差额，或借方）同时：借：其他综合收益贷：投资收益或相反分录</td></tr></table>\r\n\r\n【例题21·计算分析题】2×24年1月1日，甲公司购入乙公司于当日发行且可上市交易的债券100万张，支付价款1026万元，另支付手续费1.23万元。该债券期限为3年，每张面值为10元，票面年利率为6%，于每年12月31日支付当年利息，到期一次偿还本金，实际年利率为5%。甲公司管理乙公司债券的目标是保证日常流动性需求的同时，维持固定的收益率，该金融资产的合同条款规定，在特定日期产生的现金流量，仅为对本金和以未偿付本金金额为基础的利息的支付。\r\n\r\n2×24年12月31日，甲公司收到2×24年度利息60万元。甲公司确认预期信用损失准备5万元，该债券投资公允价值为1010万元（不含利息）。当日市场年利率为4.5%。\r\n\r\n<table><tr><td>借：其他债权投资一成本</td><td>1000</td></tr><tr><td>一利息调整</td><td>27.23</td></tr><tr><td></td><td></td></tr><tr><td>贷：银行存款</td><td>1027.23</td></tr></table>\r\n\r\n2×25年12月31日，甲公司收到2×25年度利息60万元，甲公司按整个存续期确认预期信用损失准备余额3万元，该债券投资公允价值为1008万元（不含利息）。当日市场年利率为4.8%。\r\n\r\n不考虑中期财务报告、所得税及其他因素影响。\r\n\r\n要求：\r\n\r\n（1）判断甲公司取得乙公司债券应划分的金融资产类别，说明理由，并编制甲公司取得乙公司债券时的会计分录。\r\n\r\n（2）计算甲公司2×24年度因持有乙公司债券应确认的利息收人、公允价值变动及预期信用损失，并编制相关会计分录。\r\n\r\n（3）计算甲公司2×25年度因持有乙公司债券应确认的利息收人、公允价值变动及预期信用损失，并编制相关会计分录。\r\n\r\n答案\r\n\r\n（1）甲公司应将取得的乙公司债券划分为以公允价值计量且其变动计入其他综合收益的金融资产。\r\n\r\n理由：甲公司管理乙公司债券的目标是保证日常流动性需求的同时维持固定的收益率，且该金融资产的合同条款规定，在特定日期产生的现金流量，仅为对本金和以未偿付本金金额为基础的利息的支付。\r\n\r\n（2）2×24年应确认利息收入=1027.23×5%=51.36（万元）。\r\n\r\n2×24年12月31日该债券投资的账面余额（不含公允价值变动）=1027.23+51.36-60=1018.59（万元），公允价值为1010万元，应确认公允价值变动=1010-1018.59=-8.59（万元）。\r\n\r\n2×24年12月31日应确认的预期信用损失为5万元。\r\n\r\n会计分录：\r\n\r\n借：其他债权投资一应计利息 60  \r\n贷：投资收益 51.36  \r\n其他债权投资一利息调整 8.64  \r\n借：银行存款 60  \r\n贷：其他债权投资一应计利息 60  \r\n借：其他综合收益 8.59  \r\n贷：其他债权投资一公允价值变动 8.59  \r\n借：信用减值损失 5  \r\n贷：其他综合收益 5\r\n\r\n（3）2×25年应确认利息收入=1018.59×5%=50.93（万元）。\r\n\r\n2×25年12月31日该债券投资的账面余额（不含公允价值变动）=1018.59+50.93-60=1009.52（万元），公允价值为1008万元，累计应确认公允价值变动=1008-1009.52=-1.52（万元），本期应确认公允价值变动=-1.52-（-8.59）=7.07（万元）。\r\n\r\n2×25年12月31日预期信用损失准备余额为3万元，2×25年应转回预期信用损失=5-3=2（万元）。\r\n\r\n会计分录：\r\n\r\n借：其他债权投资一应计利息 60  \r\n贷：投资收益 50.93  \r\n其他债权投资一利息调整 9.07  \r\n借：银行存款 60  \r\n贷：其他债权投资一应计利息 60  \r\n借：其他债权投资一公允价值变动 7.07  \r\n贷：其他综合收益 7.07  \r\n借：其他综合收益 2  \r\n贷：信用减值损失 2\r\n\r\n5.指定为以公允价值计量且其变动计人其他综合收益的金融资产（权益工具）的会计处理。核算科目：其他权益工具投资\r\n\r\n<table><tr><td rowspan=1 colspan=1>项目</td><td rowspan=1 colspan=1>会计处理</td></tr><tr><td rowspan=1 colspan=1>（1）企业取得金融资产</td><td rowspan=1 colspan=1>借：其他权益工具投资一成本（公允价值与交易费用之和）应收股利（已宣告但尚未发放的现金股利）贷：银行存款等</td></tr><tr><td rowspan=1 colspan=1>（2）资产负债表日公允价值变动</td><td rowspan=1 colspan=1>①公允价值上升借：其他权益工具投资一公允价值变动贷：其他综合收益②公允价值下降借：其他综合收益贷：其他权益工具投资一公允价值变动</td></tr><tr><td rowspan=1 colspan=1>（3）持有期间被投资单位宣告发放现金股利</td><td rowspan=1 colspan=1>借：应收股利贷：投资收益点拨   只有权益法核算的长期股权投资的现金股利冲减投资账面价值（“长期股权投资一损益调整”科目），其他股权投资（成本法核算的长期股权投资和其他权益工具投资等）均确认投资收益</td></tr><tr><td rowspan=1 colspan=1>（4）出售其他权益工具投资</td><td rowspan=1 colspan=1>借：银行存款等贷：其他权益工具投资（账面价值）盈余公积（差额，或借方）利润分配一未分配利润（差额，或借方）同时：借：其他综合收益贷：盈余公积利润分配一未分配利润或相反分录</td></tr></table>\r\n\r\n\r\n\r\n## 提示\r\n\r\n（1）“其他债权投资”持有期间形成的“其他综合收益”终止确认时转入投资收益；\r\n\r\n（2）“其他权益工具投资”持有期间形成的“其他综合收益”终止确认时转入留存收益。\r\n\r\n【例题22·多选题】2×25年度，甲公司发生的有关交易或事项如下：（1）以资本公积1000万元转增股本。（2）出售持有的其他权益工具投资，出售价格为2000万元，该投资的成本为1400万元，已确认的公允价值变动为400万元。（3）按面值发行10000万元债券，支付佣金300万元，该债券按摊余成本进行后续计量。不考虑相关税费及其他因素，下列各项关于甲公司2×25年度会计处理的表述中，正确的有（ ）。\r\n\r\nA.其他权益工具投资持有期间已确认的公允价值变动金额于该资产出售时增加所有者权益\r\n\r\nB.发行债券支付的佣金计人应付债券的初始计量金额\r\n\r\nC.出售其他权益工具投资的出售价格与其账面价值的差额计人当期投资收益\r\n\r\nD.资本公积转增股本不影响所有者权益总额\r\n\r\n（解析)其他权益工具投资持有期间的公允价值变动金额计入其他综合收益，其他权益工具投资出售时应将其他综合收益结转计入留存收益，属于所有者权益内部结转，不影响所有者权益总额，选项A错误；出售其他权益工具投资的出售价格与其账面价值之间的差额应计入留存收益，选项C错误。\r\n\r\n\r\n\r\n## 四、金融负债的后续计量\r\n\r\n考点难度●●难\r\n\r\n## （一）金融负债后续计量原则\r\n\r\n企业应当按照以下原则对金融负债进行后续计量：\r\n\r\n1.以公允价值计量且其变动计人当期损益的金融负债，应当按照公允价值进行后续计量。\r\n\r\n2.金融资产转移不符合终止确认条件或继续涉人被转移金融资产所形成的金融负债。对此类金融负债，企业应当按照《企业会计准则第23号- -金融资产转移》相关规定进行计量。\r\n\r\n3.不属于指定为以公允价值计量且其变动计人当期损益的金融负债的财务担保合同或没有指定为以公允价值计量且其变动计人当期损益并将以低于市场利率贷款的贷款承诺，企业作为此类金融负债发行方的，应当在初始确认后按照损失准备金额以及初始确认金额扣除累计摊销额后的余额敦高进行计量。\r\n\r\n4．上述金融负债以外的金融负债，应当按摊余成本进行后续计量。\r\n\r\n\r\n\r\n点拨 以摊余成本后续计量的金融负债是兜底的。\r\n\r\n## （二）金融负债后续计量的会计处理\r\n\r\n1.对于以公允价值进行后续计量的金融负债，其公允价值变动形成利得或损失，除与套期会计有关外，应当计人当期损益。\r\n\r\n例（真）题-答案」22.BD\r\n\r\n<table><tr><td rowspan=1 colspan=1>项目</td><td rowspan=1 colspan=1>会计处理</td></tr><tr><td rowspan=1 colspan=1>（1）发行时</td><td rowspan=1 colspan=1>借：银行存款贷：交易性金融负债一本金</td></tr><tr><td rowspan=1 colspan=1>（2）确认公允价值变动（除自身信用风险变动引起的公允价值变动外）</td><td rowspan=1 colspan=1>①公允价值上升借：公允价值变动损益贷：交易性金融负债一公允价值变动②公允价值下降借：交易性金融负债一公允价值变动贷：公允价值变动损益链接  投资性房地产公允价值变动、交易性金融资产公允价值变动均通过“公允价值变动损益”科目核算</td></tr><tr><td rowspan=1 colspan=1>（3）确认利息费用</td><td rowspan=1 colspan=1>借：财务费用贷：交易性金融负债一应计利息</td></tr><tr><td rowspan=1 colspan=1>（4）到期时</td><td rowspan=1 colspan=1>借：交易性金融负债一本金、应计利息、公允价值变动（或贷方）贷：银行存款投资收益（或借方）</td></tr></table>\r\n\r\n“交易性金融负债一公允价值变动”科目也可以汇总反映包含利息的短期融资券的公允价值变动。\r\n\r\n2.以摊余成本计量且不属于任何套期关系的一部分的金融负债所产生的利得或损失，应当在终止确认时计人当期损益或在按照实际利率法摊销时计入相关期间损益。\r\n\r\n企业与交易对手方修改或重新议定合同，未导致金融负债终止确认，但导致合同现金流量发生变化的，应当重新计算该金融负债的账面价值，并将相关利得或损失计入当期损益。\r\n\r\n重新计算的该金融负债的账面价值，应当根据将重新议定或修改的合同现金流量按金融负债的原实际利率等折现的现值确定。对于修改或重新议定合同所产生的所有成本或费用，企业应当调整修改后的金融负债账面价值，并在修改后金融负债的剩余期限内进行摊销。\r\n\r\n## （三）指定为以公允价值计量的金融负债自身信用风险变动的会计处理\r\n\r\n根据准则规定将金融负债指定为以公允价值计量且其变动计人当期损益的金融负债的，该金融负债所产生的利得或损失应当按照下列规定进行处理：\r\n\r\n（1）由企业自身信用风险变动引起的该金融负债公允价值的变动金额，应当计人其他综合收益；（2）该金融负债的其他公允价值变动计人当期损益。该金融负债终止确认时，之前计人其他综合收益的累计利得或损失应当从其他综合收益中转出，计人留存收益。\r\n\r\n## 问答\r\n\r\n为什么“指定为以公允价值计量且其变动计入当期损益的金融负债因企业自身信用风险变动引起的公允价值变动”计入“其他综合收益”且以后会计期间不能重分类进损益？\r\n\r\n答：发行债券公司的信用越好，债券的公允价值越高。如果发行债券公司将其计入损益，借记“公允价值变动损益”科目，贷记“交易性金融负债”科目，会出现信用好但利润表出现损失的不合理现象，所以将其计入“其他综合收益”。若以后会计期间将“其他\r\n\r\n综合收益”重分类进损益也会出现上述不合理现象，因此“指定为以公允价值计量且其变动计入当期损益的金融负债因企业自身信用风险变动引起的公允价值变动”计入“其他综合收益”且以后会计期间不能重分类进损益。\r\n\r\n## 五、金融工具的减值\r\n\r\n考点难度●●难\r\n\r\n## （一）金融工具减值概述\r\n\r\n本章对金融工具减值的规定称为预期信用损失法。该方法与过去规定的、根据实际已发生减值损失确认损失准备的方法有着根本性不同。在预期信用损失法下，减值准备的计提不以减值的实际发生为前提，而是以未来可能的违约事件造成的损失的期望值来计量当前（资产负债表日）应当确认的减值准备。\r\n\r\n企业应当以预期信用损失为基础，对下列项目进行减值会计处理并确认损失准备：\r\n\r\n（1）分类为以摊余成本计量的金融资产和以公允价值计量且其变动计人其他综合收益的金融资产。\r\n\r\n（2）租赁应收款。\r\n\r\n（3）合同资产。合同资产是指《企业会计准则第14号一收人》定义的合同资产。\r\n\r\n（4）部分贷款承诺和财务担保合同。\r\n\r\n## 点拨\r\n\r\n以公允价值计量且其变动计入当期损益的金融资产和以公允价值计量且其变动计入其他综合收益的金融资产（权益工具）不计提减值准备。\r\n\r\n损失准备，是指针对按照以摊余成本计量的金融资产、租赁应收款和合同资产的预期信用损失计提的准备，按照以公允价值计量且其变动计人其他综合收益的金融资产的累计减值金额以及针对贷款承诺和财务担保合同的预期信用损失计提的准备。\r\n\r\n信用损失，是指企业按照原实际利率折现的、根据合同应收的所有合同现金流量与预期收取的所有现金流量之间的差额，即全部现金短缺的现值。其中，对于企业购买或源生的已发生信用减值的金融资产，应按照该金融资产经信用调整的实际利率折现。由于预期信用损失考虑付款的金额和时间分布，因此即使企业预计可以全额收款但收款时间晚于合同规定的到期期限，也会产生信用损失。\r\n\r\n预期信用损失，是指以发生违约的风险为权重的金融工具信用损失的加权平均值。\r\n\r\n在估计现金流量时，企业应当考虑金融工具在整个预计存续期的所有合同条款（如提前还款、展期、看涨期权或其他类似期权等）。企业所考虑的现金流量应当包括出售所持担保品获得的现金流量，以及属于合同条款组成部分的其他信用增级所产生的现金流量。其中，属于合同条款组成部分的其他信用增级包括未与金融工具载明于同一合同、但实质上与金融工具的合同构成一个整体的其他信用增级条款。例如，企业应当考虑属于合同条款组成部分的财务担保合同等信用增级所产生的现金流量，但该信用增级相关现金流量已单独确认的，在计量预期信用损失时估计的现金流量中则不可重复考虑。对于为金融工具组合提供的信用增级（如共享赔付上限或免赔额的信用保险等），由于其保障对象为组合整体而非单项金融工具，在无法获得可靠证据表明相关信用增级条款与单项金融工具存在对应关系的情况下，其不构成该组合中单项金融工具的合同条款组成部分，企业在计量相关单项金融工具的预期信用损失时，不应考虑该信用增级所产生的现金流量。\r\n\r\n【例题23·单选题】按照企业会计准则的规定，确定企业金融资产预期信用损失的方法是（ ）。A.金融资产的预计未来现金流量与其账面价值之间的差额B.应收取金融资产的合同现金流量与预期收取的现金流量之间差额的现值C.金融资产的公允价值减去处置费用后的净额与其账面价值之间的差额的现值D.金融资产的公允价值与其账面价值之间的差额\r\n\r\n（解析信用损失，是指企业按照原实际利率折现的、根据合同应收的所有合同现金流量与预期收取的所有现金流量之间的差额，即全部现金短缺的现值。\r\n\r\n（二）金融工具减值的三阶段\r\n\r\n除购买或源生时已发生信用减值的金融资产以及应收款项、合同资产和租赁应收款外，企业应当在每个资产负债表日评估相关金融工具的信用风险自初始确认后是否显著增加，并按照信用风险自初始确认后已显著增加或未显著增加的情形分别计量其损失准备、确认预期信用损失及其变动。\r\n\r\n具体而言，对于购买或源生时未发生信用减值的金融工具（始终按照整个存续期内预期信用损失的变动确认损失准备的除外），企业可以将其发生信用减值的过程分为三个阶段，对于不同阶段的金融工具的减值有不同的会计处理方法：\r\n\r\n（1）第一阶段：信用风险自初始确认后未显著增加\r\n\r\n对于处于该阶段的金融工具，企业应当按照未来12个月的预期信用损失计量损失准备，并按其账面余额（即未扣除减值准备）和实际利率计算利息收人（若该工具为金融资产下同）。\r\n\r\n## 点拨\r\n\r\n12个月内预期信用损失，是指因资产负债表日后12个月内（若金融工具的预计存续期少于12个月则为更短的存续期间）可能发生的违约事件而导致的金融工具在整个存续期内现金流缺口的加权平均现值，而非发生在12个月内的现金流缺口的加权平均现值。\r\n\r\n（2）第二阶段：信用风险自初始确认后已显著增加但尚未发生信用减值\r\n\r\n对于处于该阶段的金融工具，企业应当按照该工具整个存续期的预期信用损失计量损失准备，并按其账面余额和实际利率计算利息收人。\r\n\r\n（3）第三阶段：初始确认后发生信用减值\r\n\r\n对于处于该阶段的金融工具，企业应当按照该工具整个存续期的预期信用损失计量损失准备，但对利息收人的计算不同于处于前两阶段的金融资产。对于已发生信用减值的金融资产，企业应当按其摊余成本（账面余额减已计提减值准备）和实际利率计算利息收入。\r\n\r\n对于购买或源生时已发生信用减值的金融资产，企业应当仅将初始确认后整个存续期内预期信用损失的变动确认为损失准备，并按其摊余成本和经信用调整的实际利率计算利息收入。\r\n\r\n## （三）特殊情形\r\n\r\n出于简化会计处理、兼顾现行实务的考虑，在以下两类情形下，企业无须就金融工具初始确认时的信用风险与资产负债表日的信用风险进行比较分析。\r\n\r\n\r\n\r\n## 点拨 简化处理体现在无须判断属于哪个阶段。\r\n\r\n## 1.较低信用风险的金融工具\r\n\r\n如果企业确定金融工具的违约风险较低，借款人在短期内履行其支付合同现金流量义务的能力很强，并且即使较长时期内经济形势和经营环境存在不利变化，也不一定会降低借款人履行其支付合同现金流量义务的能力，那么该金融工具可被视为具有较低的信用风险。\r\n\r\n对于在资产负债表日具有较低信用风险的金融工具，企业可以不用与其初始确认时的信用风险进行比较，而直接作出该工具的信用风险自初始确认后未显著增加的假定（企业对这种简化处理有选择权）。\r\n\r\n## 2．应收款项、租赁应收款和合同资产\r\n\r\n企业对于本书第十七章所规定的、不含重大融资成分（包括根据该章不考虑不超过一年的合同中融资成分的情况）的应收款项和合同资产，应当始终按照整个存续期内预期信用损失的金额计量其损失准备（企业对这种简化处理没有选择权）。\r\n\r\n除此之外，相关企业会计准则还允许企业作出会计政策选择，对包含重大融资成分的应收款项、合同资产和租赁应收款（可分别对应收款项、合同资产、应收租赁款作出不同的会计政策选择)，始终按照相当于整个存续期内预期信用损失的金额计量其损失准备。\r\n\r\n## 点拨\r\n\r\n（1）不含重大融资成分的必须简化处理，包含重大融资成分的可以简化处理，也可以按一般方法处理；\r\n\r\n（2）除了上述收入和租赁准则规定的应收款和合同资产外，其他金融资产不应当采用简化处理方法。\r\n\r\n## 提示\r\n\r\n对其他应收款、向其他企业提供的委托贷款、财务担保或向集团内关联企业提供的资金借贷等进行减值会计处理时，应按三阶段的一般方法处理，对不同阶段的预期信用损失采用相应的会计处理方法，不得采用按照整个存续期内预期信用损失的金额计量损失准备的简化处理方法。\r\n\r\n【例题24·多选题】不考虑其他因素，下列各项关于金融资产减值会计处理的表述中，正确的有（ ）。A.按照收人准则确认的包含重大融资成分的合同资产可以选择始终按照整个存续期内的预期信用损失的金额计量其损失准备B.企业支付的保证金形成的其他应收款可以选择始终按照整个存续期内的预期信用损失的金额计量其损失准备C.租赁准则规范的租赁应收款可以选择始终按照整个存续期内的预期信用损失的金额计量其损失准备\r\n\r\nD.按照收人准则确认的不含重大融资成分的应收票据应当始终按照整个存续期内的预期 信用损失的金额计量其损失准备\r\n\r\n解析）对其他应收款，应当将其发生信用减值的过程分为三个阶段，对不同阶段的预期信用损失采用相应的会计处理方法，不得采用按照整个存续期内预期信用损失的金额计量损失准备的简化处理方法，选项B错误。\r\n\r\n解题攻略其他应收款不属于采用简化处理的应收款项、租赁应收款和合同资产，不能简化处理。\r\n\r\n## （四）预期信用损失的计量\r\n\r\n企业计量金融工具预期信用损失的方法应当反映下列各项要素：\r\n\r\n（1）通过评价一系列可能的结果而确定的无偏概率加权平均金额。\r\n\r\n（2）货币时间价值。\r\n\r\n（3）在资产负债表日无须付出不必要的额外成本或努力即可获得的有关过去事项、当前状况以及未来经济状况预测的合理且有依据的信息。\r\n\r\n在不违反金融工具预期信用损失计量方法应反映的上述各项要素的前提下，企业可在计量预期信用损失时运用简便方法。例如，对于应收账款的预期信用损失，企业可参照历史信用损失经验，编制应收账款逾期天数与固定准备率对照表，以此为基础计算预期信用损失。如果企业的历史经验表明不同细分客户群体发生损失的情况存在显著差异，那么企业应当对客户群体进行恰当的分组，在分组基础上运用上述简便方法。企业可用于对资产进行分组的标准可能包括：地理区域、产品类型、客户评级、担保物以及客户类型（如批发和零售客户）。\r\n\r\n## （五）金融工具减值的账务处理\r\n\r\n## 1.减值准备的计提和转回\r\n\r\n（1）计提\r\n\r\n借：信用减值损失\r\n\r\n贷：贷款损失准备\r\n\r\n债权投资减值准备\r\n\r\n坏账准备\r\n\r\n应收融资租赁款减值准备\r\n\r\n其他综合收益一信用减值准备\r\n\r\n预计负债（用于贷款承诺及财务担保合同）\r\n\r\n## 问答 “其他债权投资”计提减值准备时，为什么贷记“其他综合收益”科目？\r\n\r\n答：在预期信用损失模型下，对“其他债权投资”要确认预期信用损失，借记“信用减值损失”科目，“其他债权投资”期末按公允价值计量，计提减值时不能影响“其他债权投资”的账面价值，因“其他债权投资”公允价值变动记入“其他综合收益”科目，所以计提减值时应贷记“其他综合收益”科目，即借记“信用减值损失”科目，贷记“其他综合收益一信用减值准备”科目。\r\n\r\n借：资产减值损失\r\n\r\n贷：合同资产减值准备\r\n\r\n\r\n\r\n## 点拨\r\n\r\n合同资产除信用风险之外，还可能承担其他风险，如履约风险等，计提减值时记入“资产减值损失”科目，核销差额也通过“资产减值损失”核算。\r\n\r\n（2）转回\r\n\r\n转回时作相反的分录。\r\n\r\n## 2.已发生信用损失金融资产的核销和收回\r\n\r\n企业实际发生信用损失，认定相关金融资产无法收回，经批准予以核销的，应当根据批准的核销金额，借记“贷款损失准备”“坏账准备”等科目，贷记相应的资产科目，如“贷款”“应收账款”等。若核销金额大于已计提的损失准备，还应按其差额借记“信用减值损失”科目。\r\n\r\n企业已核销的金融资产以后又收回的，应按实际收到的金额，借记“贷款”“应收账款”等科目，贷记“贷款损失准备”“坏账准备”等科目；借记“银行存款”等科目，贷记“贷款”“应收账款”等科目；借记“贷款损失准备”“坏账准备”等科目，贷记“信用减值损失”科目。在实务中也可采用简化处理，即借记相应的资产科目，贷记“信用减值损失”科目。\r\n\r\n## 六、金融工具的重分类\r\n\r\n考点难度●难\r\n\r\n（从第二节金融资产和金融负债的分类和重分类移人）\r\n\r\n## （一）金融工具重分类的原则\r\n\r\n企业改变其管理金融资产的业务模式时，应当按照准则规定对所有受影响的相关金融资产进行重分类。企业对所有金融负债均不得进行重分类。\r\n\r\n\r\n\r\n点拨\r\n\r\n（1）金融资产可以重分类，并采用未来适用法处理；\r\n\r\n（2）金融负债之间不得重分类；\r\n\r\n（3）金融负债和权益工具之间的重分类，不属于金融负债的重分类。\r\n\r\n企业对金融资产进行重分类，应当自重分类日起采用未来适用法进行相关会计处理，不得对以前已经确认的利得、损失（包括减值损失或利得）或利息进行追溯调整。重分类日，是指导致企业对金融资产进行重分类的业务模式发生变更后的首个报告期间的第一天。\r\n\r\n例如，甲上市公司决定于2×25年3月20日改变某金融资产的业务模式，按照我国上市公司的相关规定其按季度披露财务报告，则重分类日为2×25年4月1日（即下一个季度会计期间的期初）；乙上市公司决定于2×25年10月10日改变某金融资产的业务模式，则重分类日为2×26年1月1日。\r\n\r\n企业管理金融资产业务模式的变更是一种极其少见的情形。该变更源自外部或内部的变化,对企业的经营非常重要，必须由企业的高级管理层进行决策，并能够向外部各方证实。因此,只有当企业开始或终止某项对其经营影响重大的活动时（例如当企业收购、处置或终止某一业务线时），其管理金融资产的业务模式才会发生变更。\r\n\r\n例如，某银行决定终止其零售抵押贷款业务，该业务线不再接受新业务，并且该银行正在积极寻求出售其抵押贷款组合，则该银行管理其零售抵押贷款的业务模式发生了变更。\r\n\r\n需要注意的是，企业业务模式的变更必须在重分类日之前生效。\r\n\r\n例如，某银行决定于2×25年10月15日终止其零售抵押贷款业务，并在2×26年1月1日对所有受影响的金融资产进行重分类。在2×25年10月15日之后，其不应开展新的零售抵押贷款业务，或另外从事与之前零售抵押贷款业务模式相同的活动。\r\n\r\n以下情形不属于业务模式变更：\r\n\r\n（1）企业持有特定金融资产的意图改变。企业即使在市场状况发生重大变化的情况下改变对特定资产的持有意图，也不属于业务模式变更。\r\n\r\n（2）金融资产特定市场暂时性消失从而暂时影响金融资产出售。\r\n\r\n（3）金融资产在企业具有不同业务模式的各部门之间转移。\r\n\r\n需要注意的是，如果企业管理金融资产的业务模式没有发生变更，而金融资产的条款发生变更但未导致终止确认的,不允许重分类。如果金融资产条款发生变更导致金融资产终止确认的，不涉及重分类问题，企业应当终止确认原金融资产，同时按照变更后的条款确认一项新金融资产。\r\n\r\n【例题25·多选题】2×25年，甲公司及其子公司发生的相关交易或事项如下：（1）因  \r\n乙公司的信用等级下降，甲公司将持有并分类为以摊余成本计量的乙公司债券全部出售，同  \r\n时将该类别的债权投资全部重分类为以公允价值计量且其变动计人其他综合收益的金融资产;  \r\n（2）因考虑公允价值变动对净利润的影响，甲公司将持有丙公司8%的股权投资从以公允价值  \r\n计量且其变动计人当期损益的金融资产，重分类为以公允价值计量且其变动计人其他综合收益  \r\n的金融资产；（3）甲公司的子公司（风险投资机构）新取得丁公司36%股权并对其具有重大影  \r\n响，对其投资采用公允价值计量；（4）甲公司对戊公司增资，所持戊公司股权比例由30%增  \r\n加至60%，并能够对戊公司实施控制，甲公司将对戊公司的股权投资核算方法由权益法改为成  \r\n本法。下列各项关于甲公司及其子公司上述交易或事项会计处理的表述中，正确的有（ ）。A．风险投资机构对所持丁公司股权投资以公允价值计量B.甲公司对戊公司股权投资核算方法由权益法改为成本法C.甲公司出售所持乙公司债券后对该类别的债权投资予以重分类D．甲公司对所持丙公司股权投资予以重分类\r\n\r\n解析风险投资机构购买股权主要目的为获取收益，其购买的股权应划分为以公允价值计量且其变动计入当期损益的金融资产，选项A正确；甲公司对戊公司增资，所持戊公司股权比例由30%增加至60%，并能够对戊公司实施控制，应由权益法核算转换为成本法核算，选项B正确；企业改变其管理金融资产的业务模式时，应当按照规定对所有受影响的相关金融资产进行重分类，甲公司在相关债券信用等级下降可能发生减值时出售金融资产，并不意味着其改变管理金融资产的业务模式，不应对其进行重分类，选项C不正确；企业对相关金融资产进行重分类时，应考虑其业务模式是否改变，而不是出于对净利润的影响，选项D不正确。\r\n\r\n\r\n\r\n（二）金融资产重分类的计量5年热点丨2次\r\n\r\n\r\n\r\n点拨 只有通过合同现金流量测试的金融资产才能进行重分类。\r\n\r\n1.以摊余成本计量的金融资产的重分类\r\n\r\n（1）企业将一项以摊余成本计量的金融资产重分类为以公允价值计量且其变动计人当期损益的金融资产\r\n\r\n应当按照该资产在重分类日的公允价值进行计量。原账面价值与公允价值之间的差额计人当期损益。\r\n\r\n（2）企业将一项以摊余成本计量的金融资产重分类为以公允价值计量且其变动计人其他综合收益的金融资产\r\n\r\n应当按照该金融资产在重分类日的公允价值进行计量，原账面价值与公允价值之间的差额计入其他综合收益。该金融资产重分类不影响其实际利率和预期信用损失的计量。\r\n\r\n## 提示\r\n\r\n①“债权投资”和“其他债权投资”每期按实际利率法确认的利息收入、预期信用损失是相等的，重分类时无须调整影响损益的金额。\r\n\r\n②重分类时“其他债权投资”按公允价值计量，冲销“债权投资”账面余额，差额记·入“其他综合收益一其他债权投资公允价值变动”科目。\r\n\r\n③“债权投资”计提减值准备的会计分录：\r\n\r\n借：信用减值损失\r\n\r\n贷：债权投资减值准备\r\n\r\n“其他债权投资”计提减值准备的会计分录：\r\n\r\n借：信用减值损失\r\n\r\n贷：其他综合收益一信用减值准备\r\n\r\n因此，重分类时与减值有关的会计分录：\r\n\r\n借：债权投资减值准备\r\n\r\n贷：其他综合收益一信用减值准备\r\n\r\n债权投资重分类为其他债权投资的会计处理：\r\n\r\na.“债权投资一成本”与“其他债权投资一成本”相互转换；\r\n\r\nb.“债权投资—利息调整”与“其他债权投资—利息调整”相互转换；\r\n\r\nc.“债权投资一应计利息”与“其他债权投资一应计利息”相互转换；\r\n\r\nd.“债权投资减值准备”与“其他综合收益一信用减值准备”相互转换；\r\n\r\ne．调整“其他债权投资一公允价值变动”和“其他综合收益一其他债权投资公允价值变动”。\r\n\r\n【例题26·单选题】2×25年11月30日，经董事会批准，甲上市公司改变了管理债券投  \r\n资组合的业务模式，将原分类为以摊余成本计量的债券投资，变更为以公允价值计量且其变动  \r\n计人其他综合收益的金融资产，该变更符合重分类的要求。不考虑其他因素，下列各项关于甲  \r\n上市公司对上述金融资产分类变更会计处理的表述中，正确的是（ ）。A．重分类日重新计量预期信用损失并对该债券投资的账面价值进行调整B.重分类日该债券投资的公允价值与其账面价值的差额计人当期损益\r\n\r\nC.以2×26年1月1日作为重分类日\r\n\r\nD.重分类日重新计算该债券的实际利率并以此为基础确认以后期间的利息收人\r\n\r\n（解析）企业将一项以摊余成本计量的金融资产重分类为以公允价值计量且其变动计入其他综合收益的金融资产的，应当按照该金融资产在重分类日的公允价值进行计量，原账面价值与公允价值之间的差额计入其他综合收益，选项B错误；重分类日，是指导致企业对金融资产进行重分类的业务模式发生变更后的首个报告期间的第一天，选项C正确；该金融资产重分类不影响其实际利率和预期信用损失的计量，选项A和D错误。\r\n\r\n2.以公允价值计量且其变动计人其他综合收益的金融资产的重分类\r\n\r\n（1）企业将一项以公允价值计量且其变动计人其他综合收益的金融资产重分类为以摊余成本计量的金融资产\r\n\r\n应当将之前计人其他综合收益的累计利得或损失转出，调整该金融资产在重分类日的公允价值，并以调整后的金额作为新的账面价值，即视同该金融资产一直以摊余成本计量。该金融资产重分类不影响其实际利率和预期信用损失的计量。\r\n\r\n（2）企业将一项以公允价值计量且其变动计人其他综合收益的金融资产重分类为以公允价值计量且其变动计人当期损益的金融资产\r\n\r\n应当继续以公允价值计量该金融资产。同时，企业应当将之前计人其他综合收益的累计利得或损失从其他综合收益转人当期损益。\r\n\r\n【例题27·多选题】下列各项关于企业金融工具重分类的表述中，正确的有（ ）。  \r\nA.企业对金融资产进行重分类的，应当采用未来适用法处理  \r\nB.企业改变管理金融负债的业务模式时，应当对金融负债进行重分类  \r\nC.以公允价值计量且其变动计人其他综合收益的债务工具投资重分类为以摊余成本计量的金融资产，原因公允价值变动计人其他综合收益的金额转人当期损益  \r\nD.以摊余成本计量的金融资产重分类为以公允价值计量且其变动计入其他综合收益的金融资产，原账面价值与重分类日公允价值之间的差额计人其他综合收益\r\n\r\n解析金融负债不得重分类，选项B错误；以公允价值计量且其变动计入其他综合收益的债务工具投资重分类为以摊余成本计量的金融资产，应当将之前因公允价值变动计入其他综合收益的累计利得或损失转出，调整该金融资产在重分类日的公允价值，选项C错误。\r\n\r\n3.以公允价值计量且其变动计人当期损益的金融资产的重分类\r\n\r\n（1）企业将一项以公允价值计量且其变动计人当期损益的金融资产重分类为以摊余成本计量的金融资产\r\n\r\n应当以其在重分类日的公允价值作为新的账面余额。\r\n\r\n（2）企业将一项以公允价值计量且其变动计人当期损益的金融资产重分类为以公允价值计量且其变动计人其他综合收益的金融资产\r\n\r\n应当继续以公允价值计量该金融资产。"},{"title":"第五节金融资产转移","content":"## 一、金融资产终止确认的一般原则\r\n\r\n考点难度●●〇中\r\n\r\n金融资产终止确认，是指企业将之前确认的金融资产从其资产负债表中予以转出。金融资产满足下列条件之一的，应当终止确认：（1）收取该金融资产现金流量的合同权利终止。（2）该金融资产已转移，且该转移满足本节关于终止确认的规定。\r\n\r\n在第一个条件下，企业收取金融资产现金流量的合同权利终止，如因合同到期而使合同权利终止，金融资产不能再为企业带来经济利益，应当终止确认该金融资产。在第二个条件下，企业收取一项金融资产现金流量的合同权利并未终止，但若企业转移了该项金融资产，同时该转移满足本节关于终止确认的规定，在这种安排下，企业也应当终止确认被转移的金融资产。\r\n\r\n下列情形也会导致金融资产的终止确认：\r\n\r\n（1）合同的实质性修改。企业与交易对手方修改或者重新议定合同并且构成实质性修改的，将导致企业终止确认原金融资产，同时按照修改后的条款确认一项新金融资产。\r\n\r\n（2）核销金融资产。当企业合理预期不再能够全部或部分收回金融资产合同现金流量时，应当直接减记该金融资产的账面余额。这种减记构成相关金融资产的终止确认。\r\n\r\n## 二、金融资产终止确认的判断流程\r\n\r\n考点难度●●难\r\n\r\n本节关于终止确认的相关规定，适用于所有金融资产的终止确认。企业在判断金融资产是否应当终止确认以及在多大程度上终止确认时，应当遵循以下步骤：\r\n\r\n点拨 金融资产终止确认情形：\r\n\r\n（1）收取现金流量的合同权利终止；\r\n\r\n（2）转移几乎所有风险和报酬；\r\n\r\n（3）没有保留控制。\r\n\r\n（一）确定适用金融资产终止确认规定的报告主体层面\r\n\r\n企业（转出方）对金融资产转入方具有控制权的，除在该企业个别财务报表基础上应用本节规定外，在编制合并财务报表时，还应当按照第二十七章合并财务报表的规定合并所有纳人合并范围的子公司（含结构化主体），并在合并财务报表层面应用本节规定。\r\n\r\n## （二）确定金融资产是部分还是整体适用终止确认原则\r\n\r\n本节中的金融资产既可能指一项金融资产或其部分，也可能指一组类似金融资产或其部分。一组类似金融资产通常指金融资产的合同现金流量在金额和时间分布上相似并且具有相似的风险特征，如合同条款类似、到期期限接近的一组住房抵押贷款等。\r\n\r\n当且仅当金融资产（或一组金融资产，下同）的一部分满足下列三个条件之一时，终止确认的相关规定适用于该金融资产部分，否则，适用于该金融资产整体：\r\n\r\n（1）该金融资产部分仅包括金融资产所产生的特定可辨认现金流量。\r\n\r\n（2）该金融资产部分仅包括与该金融资产所产生的全部现金流量完全成比例的现金流量部分。\r\n\r\n（3）该金融资产部分仅包括与该金融资产所产生的特定可辨认现金流量完全成比例的现金流量部分。\r\n\r\n## （三）确定收取金融资产现金流量的合同权利是否终止\r\n\r\n企业在确定适用金融资产终止确认规定的报告主体层面（合并财务报表层面或个别财务报表层面）以及对象（金融资产整体或部分）后，即可开始判断是否对金融资产进行终止确认。\r\n\r\n收取金融资产现金流量的合同权利已经终止的，企业应当终止确认该金融资产。如一项应收账款的债务人在约定期限内支付了全部款项，或者在期权合同到期时期权持有人未行使期权权利，导致收取金融资产现金流量的合同权利终止，企业应终止确认金融资产。\r\n\r\n若收取金融资产的现金流量的合同权利没有终止，企业应当判断是否转移了金融资产，并根据以下有关金融资产转移的相关判断标准确定是否应当终止确认被转移金融资产。\r\n\r\n## （四）判断企业是否已转移金融资产\r\n\r\n企业在判断是否已转移金融资产时，应分以下两种情形作进一步的判断：\r\n\r\n1.企业将收取金融资产现金流量的合同权利转移给其他方\r\n\r\n如实务中常见的票据背书转让、商业票据贴现等。\r\n\r\n2.企业保留了收取金融资产现金流量的合同权利，但承担了将收取的该现金流量支付给一个或多个最终收款方的合同义务\r\n\r\n这种金融资产转移的情形通常被称为“过手安排”。\r\n\r\n## 点拨 过手安排：不垫付、不挪用和不延误。\r\n\r\n当且仅当同时符合以下三个条件时，转出方才能按照金融资产转移的情形进行后续分析及处理，否则，被转移金融资产应予以继续确认：\r\n\r\n（1）企业（转出方）只有从该金融资产收到对等的现金流量时，才有义务将其支付给最终收款方。\r\n\r\n（2）转让合同规定禁止企业（转出方）出售或抵押该金融资产，但企业可以将其作为向最终收款方支付现金流量义务的保证。\r\n\r\n（3）企业（转出方）有义务将代表最终收款方收取的所有现金流量及时划转给最终收款方，且无重大延误。\r\n\r\n## （五）分析所转移金融资产的风险和报酬转移情况\r\n\r\n企业转让收取现金流量的合同权利或者通过符合条件的过手安排方式转移金融资产的，应根据规定进一步对被转移金融资产进行风险和报酬转移分析，以判断是否应终止确认被转移金融资产。\r\n\r\n1.企业转移了金融资产所有权上几乎所有风险和报酬的，应当终止确认该金融资产，并将转移中产生或保留的权利和义务单独确认为资产或负债。\r\n\r\n金融资产所有权上几乎所有风险和报酬转移情形：\r\n\r\n（1）企业无条件出售金融资产；\r\n\r\n（2）企业出售金融资产，同时约定按回购日该金融资产的公允价值回购；\r\n\r\n（3）企业出售金融资产，同时与转入方签订看跌或看涨期权合约，且该看跌或看涨期权为深度价外期权（即到期日之前不大可能变为价内期权）。\r\n\r\n2.企业保留了金融资产所有权上几乎所有风险和报酬的，应当继续确认该金融资产。\r\n\r\n以下情形通常表明企业保留了金融资产所有权上几乎所有的风险和报酬：\r\n\r\n（1）企业出售金融资产并与转人方签订回购协议，协议规定企业将按照固定回购价格或是按照原售价加上合理的资金成本向转入方回购原被转移金融资产，或者与售出的金融资产相同或实质上相同的金融资产；\r\n\r\n（2）企业融出证券或进行证券出借；\r\n\r\n（3）企业出售金融资产并附有将市场风险口转回给企业的总回报互换;\r\n\r\n（4）企业出售短期应收款项或信贷资产，并且全额补偿转人方可能因被转移金融资产发生的信用损失；\r\n\r\n（5）企业出售金融资产，同时向转入方签订看跌或看涨期权合约，且该看跌期权或看涨期权为一项价内期权;\r\n\r\n（6）采用附追索权方式出售金融资产。\r\n\r\n3.企业既没有转移也没有保留金融资产所有权上几乎所有的风险和报酬的，应当判断其是否保留了对金融资产的控制，根据是否保留了控制分别进行处理。\r\n\r\n## （六）分析企业是否保留了控制\r\n\r\n若企业既没有转移也没有保留金融资产所有权上几乎所有的风险和报酬，应当判断企业是否保留了对该金融资产的控制。如果没有保留对该金融资产的控制的，应当终止确认该金融资产。\r\n\r\n企业在判断是否保留了对被转移金融资产的控制时，应当重点关注转人方出售被转移金融资产的实际能力。如果转人方有实际能力单方面决定将转人的金融资产整体出售给与其不相关的第三方，且没有额外条件对此项出售加以限制，则表明企业作为转出方未保留对被转移金融资产的控制；在除此之外的其他情况下，则应视为企业保留了对金融资产的控制。\r\n\r\n企业既没有转移也没有保留金融资产所有权上几乎所有的风险和报酬，且未放弃对该金融资产控制的，应当按照其继续涉人被转移金融资产的程度确认有关金融资产，并相应确认有关负债。\r\n\r\n金融资产是否终止确认的判断流程如下图所示：\r\n\r\n\r\n\r\n【例题28·多选题】关于金融资产转移，下列表述中正确的有（ ）。\r\n\r\nA.企业已将金融资产所有权上几乎所有的风险和报酬转移给转人方的，应当终止确认该金融资产\r\n\r\nB.企业将金融资产出售，同时与买人方签订协议在约定期限结束时按固定价格回购，则不应终止确认该金融资产\r\n\r\nC.企业将金融资产出售，同时与买人方签订很可能行权的看跌期权合约，则不应终止确认该金融资产\r\n\r\nD.企业保留了金融资产所有权上几乎所有的风险和报酬，应当按照继续涉人规定计量该项金融资产\r\n\r\n解析企业保留了金融资产所有权上几乎所有的风险和报酬，应继续确认该金融资产，并将收到的对价确认为金融负债，选项D错误。\r\n\r\n## 三、金融资产转移的会计处理\r\n\r\n考点难度●●●难\r\n\r\n## （一）满足终止确认条件的金融资产转移的会计处理\r\n\r\n对于满足终止确认条件的金融资产转移，企业应当按照被转移的金融资产是金融资产的整体还是金融资产的一部分，分别按照以下方式进行会计处理：\r\n\r\n## 1.金融资产整体转移的会计处理\r\n\r\n金融资产整体转移满足终止确认条件的，应当将下列两项金额的差额计人当期损益：\r\n\r\n（1）被转移金融资产在终止确认日的账面价值；\r\n\r\n（2）因转移金融资产而收到的对价，与原直接计人其他综合收益的公允价值变动累计额「涉及转移的金融资产为分类为以公允价值计量且其变动计人其他综合收益的金融资产（其他债权投资）的情形」之和。\r\n\r\n## 2.金融资产部分转移的会计处理\r\n\r\n企业转移了金融资产的一部分，且该被转移部分满足终止确认条件的，应当将转移前金融资产整体的账面价值，在终止确认部分和继续确认部分（在此种情形下，所保留的部分资产应当视同继续确认金融资产的一部分）之间，按照转移日各自的相对公允价值进行分摊，并将下列两项金额的差额计人当期损益：\r\n\r\n（1）终止确认部分在终止确认日的账面价值；\r\n\r\n（2）终止确认部分收到的对价（包括获得的所有新资产减去承担的所有新负债），与原计人其他综合收益的公允价值变动累计额中对应终止确认部分的金额（涉及部分转移的金融资产为分类为以公允价值计量且其变动计人其他综合收益的金融资产的情形）之和。\r\n\r\n## （二）继续确认被转移金融资产的会计处理\r\n\r\n企业保留了被转移金融资产所有权上几乎所有的风险和报酬的，表明企业所转移的金融资产不满足终止确认的条件，不应当将其从企业的资产负债表中转出。此时，企业应当继续确认所转移的金融资产整体，因资产转移而收到的对价，应当在收到时确认为一项金融负债。\r\n\r\n需要注意的是，该金融负债与被转移金融资产应当分别确认和计量，不得相互抵销。在后续会计期间，企业应当继续确认该金融资产产生的收入或利得以及该金融负债产生的费用或损失。\r\n\r\n## （三）继续涉入被转移金融资产的会计处理\r\n\r\n企业既没有转移也没有保留金融资产所有权上几乎所有的风险和报酬，且保留了对该金融资产控制的，应当按照其继续涉人被转移金融资产的程度继续确认该被转移金融资产，并相应确认相关负债。企业所确认的被转移的金融资产和相关负债，应当反映企业所保留的权利和承担的义务。\r\n\r\n企业应当对因继续涉入被转移金融资产形成的有关资产确认相关收益，对继续涉人形成的有关负债确认相关费用。按继续涉人程度继续确认的被转移金融资产应根据所转移金融资产的原性质及其分类，继续列报于资产负债表中的贷款、应收款项等。\r\n\r\n企业通过对被转移金融资产提供担保方式继续涉人的，应当在转移日按照金融资产的账面价值和担保金额两者之中的较低者，按继续涉人的程度继续确认被转移资产，同时按照担保金额和担保合同的公允价值之和确认相关负债。\r\n\r\n【例题29·单选题】2×25年3月20日，甲公司将所持账面价值为7800万元的5年期国债以8000万元的价格出售给乙公司。按照出售协议的约定，甲公司出售该国债后，与该国债相关的损失或收益均归乙公司承担或享有。该国债出售前，甲公司将其分类为以公允价值计量且其变动计人其他综合收益的金融资产。不考虑其他因素，下列各项关于甲公司出售国债会计处理的表述中，正确的是（ ）。\r\n\r\nA．将出售国债取得的价款确认为负债  \r\nB.出售国债取得的价款与其账面价值的差额计人所有者权益  \r\nC．国债持有期间因公允价值变动计入其他综合收益的金额转为留存收益  \r\nD.终止确认所持国债的账面价值\r\n\r\n（解析）甲公司持有的国债出售前，甲公司将其分类为以公允价值计量且其变动计入其他综合收益的金融资产，该资产出售时应将取得价款净额记入“银行存款”科目，同时结转资产账面价值，二者之间的差额计入投资收益，持有期间因公允价值变动计入其他综合收益的金额转入投资收益。\r\n\r\n【例题 30·多选题】2×25年1月1日，甲公司和乙银行签订保理协议，将一项以摊余成  \r\n本计量的应收账款1000万元转让给乙银行，转让价格为920万元，同时承诺对不超过该应收  \r\n账款余额30%的信用损失提供担保。出售之后，甲公司已将该应收账款的利率风险等转移给  \r\n了乙银行，不再保留对该应收账款的管理服务权。假定为该应收账款提供担保的公允价值为  \r\n20万元。截至2×25年1月1日，甲公司对该应收账款已计提坏账准备40万元。假定该项应  \r\n收账款没有活跃市场，且乙银行没有出售被转移资产的实际能力，甲公司保留了对该应收账款  \r\n的控制。不考虑其他因素，甲公司2×25年1月1日转让该应收账款的会计处理中正确的有  \r\n（ ）。A．甲公司应当按照继续涉人该应收账款的程度确认有关资产和负债B.甲公司应当按照1000万元确认继续涉入形成的资产C．甲公司确认继续涉人形成的负债金额为320万元D.转移日甲公司应冲减“应收账款”科目金额1000万元\r\n\r\n（解析）由于甲公司对所转移应收账款提供了部分违约担保，因此既没有转移也没有保留该应收账款所有权上几乎所有的风险和报酬，而且因为该应收账款没有活跃的市场，乙银行不具备出售该笔应收账款的“实际能力”，导致甲公司也未放弃对该应收账款的控制，甲公司应当按照继续涉入该应收账款的程度确认有关资产和负债，选项A正确；由于转移日该应收账款的账面价值=1000-40=960（万元），提供的财务担保金额=1000×30%=300（万元），甲公司应按照资产账面价值和财务担保金额敦低的原则确认继续涉入形成的资产300万元，选项B错误；由于财务担保合同的公允价值为20万元，所以甲公司确认继续涉入形成的负债金额=300+20=320（万元），选项C正确；转移日甲公司应转销“应收账款”科目1000万元，选项D正确。\r\n\r\n解题攻略）企业在判断是否保留了对被转移金融资产的控制时，应当重点关注转入方出售被转移金融资产的实际能力，而不是企业合并中控制的概念。"},{"title":"第六节 套期会计","content":"## 一、套期会计概述\r\n\r\n考点难度●〇中\r\n\r\n## （一）套期概述\r\n\r\n套期，是指企业为管理外汇风险、价格风险、利率风险、信用风险等特定风险引起的风险敞口，指定金融工具为套期工具，以使套期工具的公允价值或现金流量变动，预期抵销被套期项目全部或部分公允价值或现金流量变动的风险管理活动。\r\n\r\n## （二）套期的分类\r\n\r\n在套期会计中，套期分为公允价值套期、现金流量套期和境外经营净投资套期。\r\n\r\n## 1.公允价值套期\r\n\r\n是指对已确认资产或负债、尚未确认的确定承诺，或上述项目组成部分的公允价值变动风险敞口进行的套期。\r\n\r\n以下是公允价值套期的例子：\r\n\r\n（1）某企业签订一项以固定利率换浮动利率的利率互换合约，对其承担的固定利率负债的利率风险引起的公允价值变动风险敞口进行套期。\r\n\r\n## 点拨\r\n\r\n固定换浮动利率互换合约，按浮动利率折现确定的现值（公允价值）不同，属于公允价值套期。\r\n\r\n（2）某石油公司签订一项3个月后以固定价格购买原油的合同（尚未确认的确定承诺），为规避原油价格风险，该公司签订一项商品（原油）期货合约，对该确定承诺的价格风险引起的公允价值变动风险敞口进行套期。\r\n\r\n（3）.某企业购买一项看跌期权合同，对持有的指定为以公允价值计量且其变动计入其他综合收益的非交易性权益工具投资的证券价格风险引起的公允价值变动风险敞口进行套期。该套期影响其他综合收益。\r\n\r\n## 2.现金流量套期\r\n\r\n是指对现金流量变动风险敞口进行的套期。该现金流量变动源于与已确认资产或负债、极可能发生的预期交易，或与上述项目组成部分有关的特定风险，且将影响企业的损益。\r\n\r\n以下是现金流量套期的例子：\r\n\r\n（1）某企业签订一项以浮动利率换固定利率的利率互换合约，对其承担的浮动利率债务的利率风险引起的现金流量变动风险敞口进行套期。\r\n\r\n## 点拨\r\n\r\n未来现金流量不确定属于现金流量套期，即未来少收现金或多付现金。浮动利率（未来现金流量不确定）换固定利率的利率互换属于现金流量套期。\r\n\r\n（2）某橡胶制品公司签订一项未来买人橡胶的远期合同，对3个月后预期极可能发生的与购买橡胶相关的价格风险引起的现金流量变动风险敞口进行套期。\r\n\r\n（3）某企业签订一项购人外币的外汇远期合同，对以固定外币价格买人原材料的极可能发生的预期交易的外汇风险引起的现金流量变动风险敞口进行套期。\r\n\r\n【例题31·多选题】下列各项中，能够作为公允价值套期的被套期项目有（ ）。A.已确认的负债  \r\nB.尚未确认的确定承诺  \r\nC.已确认资产的组成部分  \r\nD.极可能发生的预期交易\r\n\r\n解析公允价值套期，是指对已确认资产或负债、尚未确认的确定承诺，或上述项目组成部分的公允价值变动风险敞口进行套期，选项A、B和C正确。\r\n\r\n## 3.境外经营净投资套期\r\n\r\n是指对境外经营净投资外汇风险敞口进行的套期。境外经营净投资套期中的被套期风险是指境外经营的记账本位币与母公司的记账本位币之间的折算差额。\r\n\r\n此外，企业对确定承诺的外汇风险进行套期的，可以将其作为现金流量套期或公允价值套期处理。\r\n\r\n## （三）套期会计方法\r\n\r\n对于满足一定条件的套期，企业可运用套期会计方法进行处理。套期会计方法，是指企业将套期工具和被套期项目产生的利得或损失在相同会计期间计人当期损益（或其他综合收益）以反映风险管理活动影响的方法。\r\n\r\n## 二、套期工具和被套期项目\r\n\r\n考点难度●○中\r\n\r\n## （一）套期工具\r\n\r\n## 1.符合条件的套期工具\r\n\r\n套期工具，是指企业为进行套期而指定的、其公允价值或现金流量变动预期可抵销被套期项目的公允价值或现金流量变动的金融工具。\r\n\r\n\r\n\r\n## 点拨 企业自身权益工具不属于企业的金融资产或金融负债，不能作为套期工具。\r\n\r\n企业可以作为套期工具的金融工具包括：\r\n\r\n（1）以公允价值计量且其变动计人当期损益的衍生工具，但签出期权除外。\r\n\r\n## 点拨\r\n\r\n签出期权的潜在损失可能远超过被套期项目的潜在利得，从而不能有效地对冲被套期项目的风险，因此企业的签出期权（除非该签出期权指定用于抵销购入期权）不能作为套期工具。\r\n\r\n企业只有在对购入期权（包括嵌入在混合合同中的购入期权）进行套期时，签出期权才可以作为套期工具。嵌入在混合合同中但未分拆的衍生工具不能作为单独的套期工具。\r\n\r\n（2）以公允价值计量且其变动计入当期损益的非衍生金融资产或非衍生金融负债，但指定为以公允价值计量且其变动计人当期损益、且其自身信用风险变动引起的公允价值变动计入其他综合收益的金融负债除外。\r\n\r\n对于指定为以公允价值计量且其变动计人当期损益、且其自身信用风险变动引起的公允价值变动计人其他综合收益的金融负债，由于没有将整体公允价值变动计人损益，不能被指定为套期工具。\r\n\r\n（3）对于外汇风险套期，企业可以将非衍生金融资产（选择以公允价值计量且其变动计入其他综合收益的非交易性权益工具投资除外）或非衍生金融负债的外汇风险成分指定为套期工具。\r\n\r\n## 2.对套期工具的指定\r\n\r\n3.使用单一套期工具对多种风险进行套期\r\n\r\n## （二）被套期项目\r\n\r\n## 1.符合条件的被套期项目\r\n\r\n被套期项目，是指使企业面临公允价值或现金流量变动风险，且被指定为被套期对象的、能够可靠计量的项目。企业可以将下列单个项目、项目组合或其组成部分指定为被套期项目：\r\n\r\n（1）已确认资产或负债。\r\n\r\n（2）尚未确认的确定承诺。其中，确定承诺，是指在未来某特定日期或期间，以约定价格交换特定数量资源、具有法律约束力的协议；尚未确认，是指尚未在资产负债表中确认。\r\n\r\n（3）极可能发生的预期交易。预期交易，是指尚未承诺但预期会发生的交易。\r\n\r\n（4）境外经营净投资。\r\n\r\n境外经营净投资可以被指定为被套期项目。境外经营净投资，是指企业在境外经营净资产中的权益份额。企业既无计划也无可能在可预见的未来会计期间结算的长期外币货币性应收项目（含贷款），应当视同实质构成境外经营净投资的组成部分。因销售商品或提供劳务等形成的期限较短的应收账款不构成境外经营净投资。\r\n\r\n2.项目组成部分作为被套期项目的规定和要求\r\n\r\n3.汇总风险口作为被套期项目的规定和要求\r\n\r\n4.被套期项目的组合\r\n\r\n【例题32·多选题】下列各项中，能够作为甲公司套期交易中被套期项目的有（ ）。  \r\nA．甲公司在境外子公司净资产中的权益份额  \r\nB．甲公司一笔期限为10年，年利率为6%，按年付息的长期借款产生的前5年应支付的利息\r\n\r\nC．甲公司签订的一份法律上具有约束力的采购协议，约定6个月后以固定的价格采购固定数量的原油\r\n\r\nD.甲公司出口销售收到的 200万美元外币存款\r\n\r\n（解析）选项A，境外经营净投资可以被指定为被套期项目，境外经营净投资，是指企业在境外经营净资产中的权益份额；\r\n\r\n选项B，一项或多项选定的合同现金流量可以被指定为被套期项目；\r\n\r\n选项C，属于尚未确认的确定承诺，可以作为被套期项目；\r\n\r\n选项D，属于已确认的资产，可以作为被套期项目。\r\n\r\n## 三、套期关系评估 （略)\r\n\r\n## 四、确认和计量\r\n\r\n考点难度●○中\r\n\r\n## （一）公允价值套期\r\n\r\n点拨 公允价值套期两条腿走路，同时确认套期工具和被套期项目公允价值变动。\r\n\r\n公允价值套期满足运用套期会计方法条件的，应当按照下列规定处理：\r\n\r\n## 1.套期工具\r\n\r\n套期工具产生的利得或损失应当计人当期损益（套期损益）。如果套期工具是对指定为以公允价值计量且其变动计人其他综合收益的非交易性权益工具投资（或其组成部分）进行套期的，套期工具产生的利得或损失应当计入其他综合收益。\r\n\r\n## 2.被套期项目\r\n\r\n## （1）已确认资产或负债\r\n\r\n因被套期风险口形成的利得或损失应当计人当期损益（套期损益)，同时调整未以公允价值计量的已确认被套期项目的账面价值。\r\n\r\n被套期项目为分类为以公允价值计量且其变动计人其他综合收益的金融资产（或其组成部分）的，其因被套期风险敞口形成的利得或损失应当计人当期损益，其账面价值已经按公允价值计量，不需要调整;\r\n\r\n被套期项目为企业指定为以公允价值计量且其变动计人其他综合收益的非交易性权益工具投资（或其组成部分）的，其因被套期风险敞口形成的利得或损失应当计人其他综合收益，其账面价值已经按公允价值计量，不需要调整。\r\n\r\n## （2）尚未确认的确定承诺\r\n\r\n被套期项目为尚未确认的确定承诺（或其组成部分）的，其在套期关系指定后因被套期风险引起的公允价值累计变动额应当确认为一项资产或负债，相关的利得或损失应当计入各相关期间损益。当履行确定承诺而取得资产或承担负债时，应当调整该资产或负债的初始确认金额，以包括已确认的被套期项目的公允价值累计变动额。\r\n\r\n【真题33·多选题】被套期项目为尚未确认的确定承诺时，不考虑其他因素，下列各项关于企业套期会计处理的表述中，正确的有（ ）。（2025年回忆版）A．将确定承诺因套期风险引起的当期发生的公允价值变动收益计入其他综合收益B.将确定承诺因套期风险引起的公允价值累计减少额确认为一项负债C.履行确定承诺而取得资产时，按确定承诺因套期风险引起的公允价值累计变动额调整相应资产的初始确认金额D.将相关套期工具产生的利得或损失中属于有效套期的部分计人其他综合收益\r\n\r\n（解析被套期项目为尚未确认的确定承诺的，其在套期关系指定后因被套期风险引起的公允价值累计变动额应当确认为一项资产或负债，相关的利得或损失应当计入各相关期间损益，选项A错误，选项B正确；当履行确定承诺而取得资产或承担负债时，应当调整该资产或负债的初始确认金额，以包括已确认的被套期项目的公允价值累计变动额，选项C正确；公允价值套期，套期工具产生的利得或损失应当计入当期损益，如果套期工具是对指定为以公允价值计量且其变动计入其他综合收益的非交易性权益工具投资（或其组成部分）进行套期的，套期工具产生的利得或损失应当计入其他综合收益，选项D错误。\r\n\r\n（二）现金流量套期\r\n\r\n点拨 现金流量套期单条腿走路，只确认套期工具公允价值变动。\r\n\r\n1.现金流量套期满足运用套期会计方法条件的，应当按照下列规定处理：\r\n\r\n（1）套期工具产生的利得或损失中属于套期有效的部分，作为现金流量套期储备，应当计人其他综合收益。现金流量套期储备的金额，应当按照下列两项的绝对额中较低者确定：\r\n\r\n①套期工具自套期开始的累计利得或损失；\r\n\r\n②被套期项目自套期开始的预计未来现金流量现值的累计变动额。\r\n\r\n每期计人其他综合收益的现金流量套期储备的金额应当为当期现金流量套期储备的变动额。\r\n\r\n（2）套期工具产生的利得或损失中属于套期无效的部分（即扣除计人其他综合收益后的其他利得或损失），应当计人当期损益。\r\n\r\n点拨 现金流量套期中有效套期计入其他综合收益，无效套期计入当期损益。\r\n\r\n【例题34·单选题】关于现金流量套期，下列会计处理表述中，错误的是（ ）。\r\n\r\nA.套期工具产生的利得或损失中属于有效套期的部分，作为现金流量套期储备，应当计人其他综合收益  \r\nB.每期计人其他综合收益的现金流量套期储备的金额应当为当期现金流量套期储备的变动额  \r\nC.套期工具产生的利得或损失中属于无效套期的部分（即扣除计人其他综合收益后的其他利得或损失），应当计人当期损益  \r\nD.套期工具和被套期项目的期末公允价值变动均计入当期损益\r\n\r\n例（真）题-答案」 33.BC\r\n\r\n（解析对于现金流量套期，套期工具产生的利得或损失中属于无效套期的部分（即扣除计入其他综合收益后的其他利得或损失），应当计入当期损益，现金流量套期不确认被套期项目公允价值变动。\r\n\r\n2.现金流量套期储备的金额，应当按照下列规定处理：\r\n\r\n（1）被套期项目为预期交易，且该预期交易使企业随后确认一项非金融资产或非金融负债的,或者非金融资产或非金融负债的预期交易形成一项适用于公允价值套期会计的确定承诺时，企业应当将原在其他综合收益中确认的现金流量套期储备金额转出，计人该资产或负债的初始确认金额。\r\n\r\n（2）其他现金流量套期，企业应当在被套期的预期现金流量影响损益的相同期间，将原在其他综合收益中确认的现金流量套期储备金额转出，计人当期损益。\r\n\r\n（3）如果在其他综合收益中确认的现金流量套期储备金额是一项损失，且该损失全部或部分预计在未来会计期间不能弥补的，企业应当在预计不能弥补时，将预计不能弥补的部分从其他综合收益中转出，计入当期损益。\r\n\r\n3．当企业对现金流量套期终止运用套期会计时，在其他综合收益中确认的累计现金流量套期储备金额，应当按照下列规定进行处理：\r\n\r\n（1）被套期的未来现金流量预期仍然会发生的，累计现金流量套期储备的金额应当予以保留，并按照前述现金流量套期储备的后续处理规定进行会计处理。\r\n\r\n（2）被套期的未来现金流量预期不再发生的，累计现金流量套期储备的金额应当从其他综合收益中转出，计人当期损益。被套期的未来现金流量预期不再极可能发生但可能预期仍然会发生，在预期仍然会发生的情况下，累计现金流量套期储备的金额应当予以保留，并按照前述现金流量套期储备的后续处理规定进行会计处理。\r\n\r\n## （三）境外经营净投资套期\r\n\r\n对境外经营净投资的套期，包括对作为净投资的一部分进行会计处理的货币性项目的套期，应当按照类似于现金流量套期会计的规定处理：\r\n\r\n（1）套期工具形成的利得或损失中属于套期有效的部分，应当计入其他综合收益。\r\n\r\n全部或部分处置境外经营时，上述计人其他综合收益的套期工具利得或损失应当相应转出，计人当期损益。\r\n\r\n（2）套期工具形成的利得或损失中属于无效套期的部分，应当计人当期损益。\r\n\r\n## 五、信用风险敞口的公允价值选择权\r\n\r\n考点难度●○○易\r\n\r\n允许企业在一定程度上反映其信用风险管理活动，可以选择以公允价值计量且其变动计入当期损益的方式计量被套期风险口的方法替代套期会计。"},{"title":"第七节 金融工具的披露","content":"考点难度\r\n\r\n\r\n\r\n\r\n\r\n【真题35·多选题】为使财务报表使用者了解金融工具信用风险对未来现金流量的影响，企业应当披露的信息有（ ）。（2023年）A.金融资产所面临的信用风险的集中度B.金融负债的到期期限分析C.金融资产预期信用损失金额的变动及其原因D.外币金融资产的汇率变化影响\r\n\r\n解析为使财务报表使用者了解信用风险对未来现金流量的金额、时间和不确定性的影响，企业应当披露与信用风险有关的下列信息：①企业信用风险管理实务的相关信息及其与预期信用损失的确认和计量的关系，包括计量金融工具预期信用损失的方法、假设和信息；②有助于财务报表使用者评价在财务报表中确认的预期信用损失金额的定量和定性信息，包括预期信用损失金额的变动及其原因（选项C）；③企业的信用风险敞口，包括重大信用风险集中度（选项A）；④其他有助于财务报表使用者了解信用风险对未来现金流量金额、时间和不确定性的影响的信息。选项B,为流动性风险应披露的信息。选项D，为市场风险应披露的信息。"},{"title":"第八节 保险合同概述","content":"## 一、保险合同基本概念\r\n\r\n考点难度●○○ 易\r\n\r\n保险合同，是指企业（合同签发人）与保单持有人约定，在特定保险事项对保单持有人产生不利影响时给予其赔偿，并因此承担源于保单持有人重大保险风险的合同。再保险合同，是指再保险分人人（再保险合同签发人）与再保险分出人约定，对再保险分出人由对应的保险合同所引起的赔付等进行补偿的保险合同。\r\n\r\n例（真）题-答案」 35.AC\r\n\r\n合同签发人通常是保险机构，非保险机构在一些情形下同样可能成为保险合同签发人。\r\n\r\n保单持有人，包括投保人、被保险人或者受益人。\r\n\r\n保险赔偿可能是现金赔付或非现金赔付。\r\n\r\n保险事项，是指保险合同所承保的、产生保险风险的不确定未来事项。\r\n\r\n保险风险，是指从保单持有人转移至合同签发人的除金融风险之外的风险。\r\n\r\n（1）保险风险源于不确定未来事项对合同持有人产生的不利影响，并将由持有人转移至签发人。\r\n\r\n（2）仅使合同签发人承担金融风险而不承担重大保险风险的合同不是保险合同。\r\n
