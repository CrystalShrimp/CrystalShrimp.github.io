<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>税务餐馆：从开店到转让</title>
<style>
:root{
  --bg:#f5efe6;--paper:#fffaf2;--ink:#2e2924;--muted:#746b62;
  --accent:#b33b2e;--accent2:#1f6f5f;--gold:#d79b2e;--blue:#3a6ea5;
  --ok:#2b7b4b;--warn:#b27018;--danger:#a33a37;--line:#d9cbb9;
  --shadow:0 14px 40px rgba(64,46,29,.14);
}
*{box-sizing:border-box}
body{margin:0;background:
 radial-gradient(circle at 15% 10%,rgba(215,155,46,.14),transparent 28%),
 radial-gradient(circle at 85% 20%,rgba(31,111,95,.12),transparent 28%),
 var(--bg);font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
button{font:inherit}
#app{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(255,250,242,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;gap:12px;align-items:center}.brand-mark{width:42px;height:42px;border-radius:13px;background:var(--accent);display:grid;place-items:center;color:white;font-size:24px;box-shadow:0 8px 20px rgba(179,59,46,.25)}
.brand h1{font-size:18px;margin:0}.brand small{color:var(--muted)}
.resources{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.res{padding:8px 11px;border-radius:999px;background:white;border:1px solid var(--line);font-size:13px}.res b{margin-left:4px}
.main{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:16px;padding:16px;max-width:1600px;width:100%;margin:0 auto}
.panel{background:rgba(255,250,242,.92);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.sidebar{padding:16px;align-self:start;position:sticky;top:88px}.sidebar h3,.rightbar h3{margin:0 0 12px;font-size:14px;color:var(--muted);letter-spacing:.08em}
.chapter{padding:12px;border-radius:15px;border:1px solid transparent;margin-bottom:8px;cursor:pointer;transition:.2s;background:transparent}.chapter:hover{background:#fff}.chapter.active{background:#fff;border-color:var(--line)}.chapter.locked{opacity:.45;cursor:not-allowed}.chapter-title{font-weight:800;font-size:14px}.chapter-sub{font-size:12px;color:var(--muted);margin-top:3px}
.center{min-width:0}.scene{padding:22px;min-height:calc(100vh - 110px);position:relative;overflow:hidden}.scene-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.scene-kicker{color:var(--accent);font-weight:800;font-size:13px;letter-spacing:.08em}.scene h2{margin:5px 0 6px;font-size:28px}.scene p{margin:0;color:var(--muted);line-height:1.7}.objective{min-width:210px;padding:12px 14px;border-radius:15px;background:#fff;border:1px solid var(--line);font-size:13px}.objective b{display:block;margin-bottom:3px}
.map{position:relative;border-radius:22px;min-height:360px;background:linear-gradient(180deg,#dce8d6 0 45%,#d8c3a8 45% 100%);overflow:hidden;border:1px solid #c9b89f}
.map:before{content:"";position:absolute;inset:48% -10% auto;height:40px;background:#9a8a78;transform:rotate(-2deg);box-shadow:0 0 0 8px #b8aa98}.map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.16) 1px,transparent 1px);background-size:32px 32px}
.place{position:absolute;width:145px;height:100px;border-radius:18px;background:#fffaf2;border:2px solid #7b6b58;box-shadow:0 9px 0 #a58d70,0 16px 24px rgba(45,34,22,.18);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;cursor:pointer;transition:.18s}.place:hover{transform:translateY(-4px)}.place.locked{filter:grayscale(1);opacity:.55;cursor:not-allowed}.place.done{border-color:var(--ok)}.place-icon{font-size:32px}.place strong{font-size:14px}.place small{color:var(--muted)}
.p1{left:5%;top:12%}.p2{left:34%;top:8%}.p3{right:7%;top:14%}.p4{left:19%;bottom:10%}.p5{right:17%;bottom:8%}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;position:relative;transition:.18s}.card.selectable{cursor:pointer}.card.selectable:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(64,46,29,.11)}.card.selected{outline:3px solid rgba(179,59,46,.22);border-color:var(--accent)}.card h4{margin:0 0 7px}.card p{font-size:13px}.tag{display:inline-block;font-size:11px;padding:4px 7px;border-radius:999px;background:#f1e7d8;color:#6f5e49;margin-top:9px}.tag.green{background:#dfeee8;color:#245f50}.tag.red{background:#f3dfdc;color:#8a322b}.tag.blue{background:#dfe8f2;color:#315d8b}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:13px;padding:11px 16px;background:var(--accent);color:white;font-weight:800;cursor:pointer;box-shadow:0 7px 16px rgba(179,59,46,.22)}.btn:hover{filter:brightness(.96)}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.green{background:var(--accent2);box-shadow:0 7px 16px rgba(31,111,95,.2)}.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.rightbar{padding:16px;align-self:start;position:sticky;top:88px;max-height:calc(100vh - 104px);overflow:auto}.flow{display:grid;gap:8px}.flow-node{display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:start;padding:9px;border-radius:13px;background:#fff;border:1px solid var(--line)}.flow-node.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(215,155,46,.16)}.flow-node.done{border-color:#8bb39b}.flow-node .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#efe5d6;font-size:12px;font-weight:900}.flow-node.done .dot{background:#dcece3;color:var(--ok)}.flow-node.active .dot{background:#f7e3b7;color:#8c5f0b}.flow-node b{font-size:13px}.flow-node small{display:block;color:var(--muted);line-height:1.45;margin-top:2px}.arrow{text-align:center;color:#a9957d;font-weight:900;height:10px;line-height:8px}
.log{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}.log-item{font-size:12px;line-height:1.55;padding:8px 0;border-bottom:1px solid #eee3d5}.log-item time{color:var(--accent);font-weight:800;margin-right:6px}
.modal-wrap{position:fixed;inset:0;background:rgba(32,26,20,.45);display:none;place-items:center;padding:18px;z-index:50}.modal-wrap.show{display:grid}.modal{width:min(860px,96vw);max-height:90vh;overflow:auto;background:var(--paper);border-radius:24px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.25);padding:22px}.modal-head{display:flex;justify-content:space-between;gap:16px}.modal h2{margin:0 0 8px}.close{border:0;background:#eee3d5;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px}.notice{padding:12px 14px;border-left:4px solid var(--gold);background:#fff7e6;border-radius:10px;margin:14px 0;font-size:13px;line-height:1.65}.notice.good{border-color:var(--ok);background:#edf7f1}.notice.bad{border-color:var(--danger);background:#faeeee}
.contract{display:grid;grid-template-columns:1fr 1fr;gap:16px}.paper{background:white;border:1px solid var(--line);padding:18px;border-radius:16px;min-height:260px}.paper h4{margin-top:0}.line{display:flex;justify-content:space-between;border-bottom:1px dashed #ddd;padding:8px 0;font-size:13px}.money{font-variant-numeric:tabular-nums;font-weight:900}
.building{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.cutaway{background:linear-gradient(#dce9f2 0 28%,#cbb999 28%);border-radius:20px;min-height:370px;padding:24px 18px 18px;position:relative;overflow:hidden}.house{height:290px;background:#f8f2e7;border:5px solid #6f5c48;border-radius:8px 8px 4px 4px;display:grid;grid-template-rows:1fr 1fr;position:relative}.floor{border-bottom:4px solid #6f5c48;display:flex;align-items:center;justify-content:center;gap:12px;position:relative}.floor:last-child{border-bottom:0}.fixture{font-size:31px;filter:drop-shadow(0 5px 3px rgba(0,0,0,.12))}.asset-list{display:grid;gap:9px}.asset{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px;background:white;border:1px solid var(--line);border-radius:14px;cursor:pointer}.asset.on{border-color:var(--accent2);background:#f0f8f5}.asset .ico{font-size:25px}.asset b{font-size:13px}.asset small{display:block;color:var(--muted)}
.timeline{display:flex;gap:8px;overflow:auto;padding:10px 2px 14px}.month{min-width:86px;padding:12px 8px;border-radius:14px;background:white;border:1px solid var(--line);text-align:center;font-size:12px}.month.current{border-color:var(--accent);box-shadow:0 0 0 3px rgba(179,59,46,.12)}.month.done{background:#ecf5f0}.month b{display:block;font-size:15px}.month small{color:var(--muted)}
.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mode{padding:16px;background:white;border:1px solid var(--line);border-radius:17px;cursor:pointer}.mode:hover{border-color:var(--accent)}.mode h4{margin:0 0 7px}.mode .route{font-size:12px;color:var(--muted);padding-top:8px;margin-top:8px;border-top:1px dashed var(--line)}
.warehouse{display:grid;grid-template-columns:1fr 1fr;gap:14px}.bin{background:white;border:2px dashed #cdbba5;border-radius:18px;padding:14px;min-height:180px}.bin h4{margin:0 0 8px}.voucher{padding:10px;border-radius:12px;border:1px solid var(--line);background:#fffaf2;margin:7px 0;cursor:pointer;font-size:12px}.voucher.good{border-color:#88b39a;background:#eef7f2}.voucher.bad{border-color:#d29a94;background:#fbefed}.meter{height:16px;border-radius:999px;background:#eadfce;overflow:hidden}.meter>span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));width:0;transition:.4s}.tax-board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.tax-cell{padding:12px 8px;border-radius:13px;background:white;border:1px solid var(--line);text-align:center}.tax-cell b{display:block;font-size:18px}.tax-cell small{color:var(--muted)}
.ending{padding:26px;text-align:center}.ending .stamp{font-size:68px}.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.score{background:white;border:1px solid var(--line);border-radius:16px;padding:15px}.score b{font-size:24px;display:block}.score small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#2f2923;color:white;border-radius:12px;padding:11px 16px;opacity:0;pointer-events:none;transition:.25s;z-index:80;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.help-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.help-card{padding:14px;background:white;border:1px solid var(--line);border-radius:15px}.help-card h4{margin:0 0 7px}.help-card p{font-size:12px}
@media(max-width:1100px){.main{grid-template-columns:210px 1fr}.rightbar{display:none}.resources{display:none}}
@media(max-width:760px){.main{display:block;padding:10px}.sidebar{position:static;display:flex;overflow:auto;gap:6px;margin-bottom:10px}.sidebar h3{display:none}.chapter{min-width:160px;margin:0}.scene{padding:15px}.scene-head{display:block}.objective{margin-top:12px}.cards,.mode-grid,.contract,.building,.warehouse,.help-grid{grid-template-columns:1fr}.map{min-height:500px}.place{width:130px}.p1{left:4%;top:7%}.p2{right:5%;left:auto;top:8%}.p3{left:10%;top:38%;right:auto}.p4{right:7%;left:auto;bottom:14%}.p5{left:7%;right:auto;bottom:8%}.score-grid,.tax-board{grid-template-columns:repeat(2,1fr)}.topbar{padding:0 12px}.brand small{display:none}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">税</div><div><h1>税务餐馆：从开店到转让</h1><small>经营模拟 · 小税种实操原型</small></div></div>
    <div class="resources">
      <div class="res">月份 <b id="rMonth">2026年3月</b></div>
      <div class="res">现金 <b id="rCash">¥600万</b></div>
      <div class="res">合规 <b id="rCompliance">80</b></div>
      <div class="res">声誉 <b id="rRep">50</b></div>
    </div>
  </header>
  <div class="main">
    <aside class="panel sidebar">
      <h3>经营章节</h3>
      <div id="chapterList"></div>
      <button class="btn secondary" style="width:100%;margin-top:10px" onclick="openHelp()">玩法与税务手册</button>
    </aside>
    <main class="panel center"><section class="scene" id="scene"></section></main>
    <aside class="panel rightbar">
      <h3>当前项目流程</h3><div class="flow" id="flow"></div>
      <div class="log"><h3>经营日志</h3><div id="log"></div></div>
    </aside>
  </div>
</div>
<div class="modal-wrap" id="modal"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<script>
const fmt=n=>'¥'+(n/10000).toFixed(n%10000?1:0)+'万';
const state={
 chapter:0, unlocked:1, month:2, cash:6000000, compliance:80, rep:50,
 route:null, deedPaid:false, registered:false, renovationDone:false,
 assets:new Set(), operation:null, operationStart:null, taxPaid:0,
 devStarted:false, vouchers:new Set(), prepayDone:false, cleared:false, tailDone:false,
 logs:[{m:'3月',t:'你接手了家族餐饮公司，董事会要求一年内完成旗舰店开业与项目退出。'}]
};
const months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const chapters=[
 {t:'城市经营台',s:'选择下一步行动'},
 {t:'产权交易中心',s:'取得店铺与契税'},
 {t:'装修工地',s:'形成房产原值'},
 {t:'旗舰餐馆',s:'持有方式与房产税'},
 {t:'餐饮街项目',s:'预征、清算与尾盘'},
 {t:'经营复盘',s:'还原完整税务链'}
];
const flowSets={
0:[['选项目','在城市地图选择经营动作'],['形成权属','决定谁取得或持有房产'],['投入经营','装修、开业或出租'],['退出项目','转让、清算或尾盘']],
1:[['选择取得方式','买卖、融资租赁或普通租赁'],['识别权属转移','确认承受方与经济利益'],['申报契税','登记前完成缴纳'],['产权登记','取得权属后进入持有阶段']],
2:[['形成建筑','购买价、土地与改扩建'],['安装设施','不可移动设施并入原值'],['剔除动产','桌椅、小型设备不入房产原值'],['确定起算月','权属或使用状态变化后切换']],
3:[['识别经营实质','自营、出租、联营或融资租赁'],['选择计税池','从价或从租'],['按月份运行','状态变化分段计税'],['申报缴纳','按所在地与规定期限办理']],
4:[['取得预售许可/收入','项目进入预征流程'],['按期预征','预收款换算计税依据'],['达到清算条件','项目售完、85%等节点'],['90日内清算','收入减合法扣除'],['尾盘销售','按单位面积扣除额继续申报']],
5:[['取得','契税及取得成本'],['持有','房产税状态与月份'],['转让','土地增值税清算'],['复盘','把经营动作还原为税务流程']]
};
function updateUI(){
 document.getElementById('rMonth').textContent='2026年'+months[state.month];
 document.getElementById('rCash').textContent=fmt(state.cash);
 document.getElementById('rCompliance').textContent=state.compliance;
 document.getElementById('rRep').textContent=state.rep;
 renderChapters(); renderFlow(); renderLog();
}
function renderChapters(){
 document.getElementById('chapterList').innerHTML=chapters.map((c,i)=>`<div class="chapter ${i===state.chapter?'active':''} ${i>state.unlocked?'locked':''}" onclick="goChapter(${i})"><div class="chapter-title">${i+1}. ${c.t}</div><div class="chapter-sub">${c.s}</div></div>`).join('');
}
function renderFlow(){
 let progress=0;
 if(state.chapter===1) progress=[0, state.route?1:0, state.deedPaid?2:0, state.registered?4:0].reduce(Math.max,0);
 if(state.chapter===2) progress=state.renovationDone?4:state.assets.size?2:0;
 if(state.chapter===3) progress=state.operation?3:0;
 if(state.chapter===4) progress=state.tailDone?5:state.cleared?4:state.prepayDone?2:state.devStarted?1:0;
 if(state.chapter===5) progress=4;
 const list=flowSets[state.chapter]||flowSets[0];
 document.getElementById('flow').innerHTML=list.map((n,i)=>`${i?'<div class="arrow">↓</div>':''}<div class="flow-node ${i<progress?'done':i===progress?'active':''}"><div class="dot">${i<progress?'✓':i+1}</div><div><b>${n[0]}</b><small>${n[1]}</small></div></div>`).join('');
}
function renderLog(){document.getElementById('log').innerHTML=state.logs.slice().reverse().slice(0,8).map(x=>`<div class="log-item"><time>${x.m}</time>${x.t}</div>`).join('')}
function log(t){state.logs.push({m:months[state.month],t});renderLog()}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function goChapter(i){if(i>state.unlocked){toast('该章节尚未解锁');return}state.chapter=i;renderScene();updateUI()}
function unlock(i){state.unlocked=Math.max(state.unlocked,i)}
function nextMonth(n=1){state.month=Math.min(11,state.month+n)}
function renderScene(){
 const el=document.getElementById('scene');
 if(state.chapter===0) return renderMap(el);
 if(state.chapter===1) return renderProperty(el);
 if(state.chapter===2) return renderRenovation(el);
 if(state.chapter===3) return renderOperation(el);
 if(state.chapter===4) return renderDevelopment(el);
 return renderEnding(el);
}
function renderMap(el){
 el.innerHTML=`<div class="scene-head"><div><div class="scene-kicker">城市经营台</div><h2>把税务判断变成经营行动</h2><p>点击城市中的项目地点。已经完成的地点会保留经营结果，并影响后续现金流和税务状态。</p></div><div class="objective"><b>当前目标</b>${state.registered?'继续装修并投入经营':'先取得一家旗舰店'}</div></div>
 <div class="map"><div class="map-grid"></div>
 <div class="place p1 ${state.registered?'done':''}" onclick="goChapter(1)"><div class="place-icon">🏛️</div><strong>产权交易中心</strong><small>契税与登记</small></div>
 <div class="place p2 ${state.registered?'':'locked'} ${state.renovationDone?'done':''}" onclick="${state.registered?'goChapter(2)':'toast(\'先完成产权取得\')'}"><div class="place-icon">🏗️</div><strong>装修工地</strong><small>房产原值</small></div>
 <div class="place p3 ${state.renovationDone?'':'locked'} ${state.operation?'done':''}" onclick="${state.renovationDone?'goChapter(3)':'toast(\'先完成装修\')'}"><div class="place-icon">🍜</div><strong>旗舰餐馆</strong><small>房产税经营状态</small></div>
 <div class="place p4 ${state.operation?'':'locked'} ${state.tailDone?'done':''}" onclick="${state.operation?'goChapter(4)':'toast(\'先让旗舰店投入经营\')'}"><div class="place-icon">🏙️</div><strong>餐饮街项目</strong><small>土地增值税</small></div>
 <div class="place p5 ${state.tailDone?'':'locked'}" onclick="${state.tailDone?'goChapter(5)':'toast(\'完成餐饮街清算后解锁\')'}"><div class="place-icon">📚</div><strong>经营复盘室</strong><small>税务流程回放</small></div>
 </div>`;
}
function renderProperty(el){
 const selected=state.route;
 el.innerHTML=`<div class="scene-head"><div><div class="scene-kicker">第一章 · 产权交易中心</div><h2>旗舰店要怎样取得？</h2><p>这不是找“正确答案”。不同取得方式会改变现金、控制权、房产税纳税主体和后续退出空间。</p></div><div class="objective"><b>董事会目标</b>取得可长期经营的旗舰店，并保留未来出售可能。</div></div>
 <div class="cards">
 ${routeCard('buy','购买存量商铺','支付420万元不含税成交价，立即取得完整产权。','承受方缴契税 · 登记后持有','🏠')}
 ${routeCard('finance','融资租赁','首付较低，长期使用；承租人按余值缴房产税。','无即时产权 · 现金压力小','🏦')}
 ${routeCard('rent','普通租赁','不取得产权，租期5年；房产税通常由产权人承担。','灵活 · 无法出售物业','🗝️')}
 </div>
 <div class="actions"><button class="btn" ${selected?'':'disabled'} onclick="openContract()">进入合同谈判</button><button class="btn secondary" onclick="goChapter(0)">返回城市</button></div>`;
}

 el.innerHTML=`<div class="scene-head"><div><div class="scene-kicker">项目清算室</div><h2>把凭证放进合法扣除仓库</h2><p>项目已售90%，达到可要求清算条件。点击凭证送入扣除池；错误归集会降低合规度并造成税额失真。</p></div><div class="objective"><b>清算期限</b>收到通知后90日内<br><b>已售比例</b>90%</div></div>
 <div class="warehouse"><div class="bin"><h4>待审核凭证</h4>${Object.entries(vouchers).filter(([k])=>!state.vouchers.has(k)).map(([k,v])=>`<div class="voucher" onclick="toggleVoucher('${k}')"><b>${v.n}</b><br>${fmt(v.v)} · ${v.why}</div>`).join('')||'<p>所有凭证已处理</p>'}</div><div class="bin"><h4>本次扣除仓库</h4>${selected.map(k=>`<div class="voucher ${vouchers[k].ok?'good':'bad'}" onclick="toggleVoucher('${k}')"><b>${vouchers[k].n}</b><br>${fmt(vouchers[k].v)} · ${vouchers[k].why}</div>`).join('')||'<p>点击左侧凭证归集</p>'}</div></div>
 <div class="notice ${bad?'bad':'good'}">已归集合法凭证 ${fmt(good)}；错误凭证 ${bad} 项。房开企业新开发房地产还可按（土地成本＋开发成本）加计20%，系统将在封账时自动加入。</div>
 <div class="actions"><button class="btn" ${selected.length<4?'disabled':''} onclick="finalizeClearing()">封账并计算四级超率累进税额</button><button class="btn secondary" onclick="resetVouchers()">清空重做</button></div>`;
}
function toggleVoucher(k){state.vouchers.has(k)?state.vouchers.delete(k):state.vouchers.add(k);renderScene()}
function resetVouchers(){state.vouchers.clear();renderScene()}
function finalizeClearing(){
 const chosen=[...state.vouchers];const bad=chosen.filter(k=>!vouchers[k].ok);const required=['land','build','interest','taxes'];const missing=required.filter(k=>!state.vouchers.has(k));
 if(missing.length){toast('合法扣除资料不完整，不能封账');state.compliance-=4;return}
 if(bad.length){state.compliance-=bad.length*6;toast('含有不允许扣除项目，税务审核已剔除');}
 const income=108000000; // 已售90%对应收入
 const land=24000000,build=36000000,expense=1800000+(land+build)*0.05,tax=2100000,extra=(land+build)*0.2;
 const deduct=land+build+expense+tax+extra;
 const gain=income-deduct;const rate=gain/deduct;
 let taxRate=.3,quick=0;if(rate>.5&&rate<=1){taxRate=.4;quick=.05}else if(rate>1&&rate<=2){taxRate=.5;quick=.15}else if(rate>2){taxRate=.6;quick=.35}
 const finalTax=gain*taxRate-deduct*quick;const payable=Math.max(0,finalTax-450000);
 state.cash-=payable;state.taxPaid+=payable;state.cleared=true;state.compliance+=8;state.rep+=8;
 state.clearResult={income,deduct,gain,rate,finalTax,payable};
 log(`餐饮街完成清算：最终税额 ${fmt(finalTax)}，抵减预缴¥45万后补缴 ${fmt(payable)}。`);renderScene();updateUI();
}
function tailScene(el){const r=state.clearResult;el.innerHTML=`<div class="scene-head"><div><div class="scene-kicker">尾盘销售</div><h2>清算不是项目的最后一个按钮</h2><p>清算后剩余1,000㎡商铺出售。尾盘按清算审核形成的单位建筑面积扣除额继续计算，并按季申报。</p></div><div class="objective"><b>尾盘面积</b>1,000㎡<br><b>申报频率</b>按季</div></div>
 <div class="tax-board"><div class="tax-cell"><b>${fmt(r.deduct)}</b><small>清算审核扣除额</small></div><div class="tax-cell"><b>9,000㎡</b><small>清算时已售面积</small></div><div class="tax-cell"><b>${fmt(r.deduct/9000)}</b><small>单位面积扣除额</small></div><div class="tax-cell"><b>${fmt(r.deduct/9000*1000)}</b><small>尾盘基础扣除</small></div></div>
 <div class="notice">尾盘扣除额还应加上尾盘实际转让税金。这里不重复做复杂计算，重点训练“沿用清算形成的单位面积扣除额继续申报”。</div><div class="actions"><button class="btn" onclick="finishTail()">完成本季度尾盘申报</button></div>`}
function finishTail(){state.tailDone=true;state.compliance=Math.min(100,state.compliance+7);state.rep+=5;log('完成清算后尾盘销售申报，项目正式封账。');unlock(5);renderScene();updateUI()}
function renderEnding(el){
 const score=Math.round((Math.max(0,Math.min(100,state.compliance))+Math.max(0,Math.min(100,state.rep))+Math.max(0,Math.min(100,state.cash/60000))+85)/4);
 el.innerHTML=`<div class="ending"><div class="stamp">🍜📜</div><div class="scene-kicker">经营复盘</div><h2>你完成了一条真正的税务经营链</h2><p>税种没有以孤立题目出现，而是跟随权属、使用状态、合同实质、月份和项目清算逐步发生。</p>
 <div class="score-grid"><div class="score"><b>${score}</b><small>综合经营评分</small></div><div class="score"><b>${state.compliance}</b><small>合规度</small></div><div class="score"><b>${state.rep}</b><small>经营声誉</small></div><div class="score"><b>${fmt(state.taxPaid)}</b><small>累计缴税</small></div></div>
 <div class="flow" style="max-width:720px;margin:0 auto;text-align:left">
 ${summaryNode('1','取得店铺',state.route==='buy'?'发生权属转移 → 承受方在登记前缴契税':'未发生即时权属转移 → 契税不进入')}
 <div class="arrow">↓</div>${summaryNode('2','装修形成原值','不可移动设施与改扩建并入房产原值；可移动设备留在经营设备池')}
 <div class="arrow">↓</div>${summaryNode('3','持有期间',`${['lease','fixed'].includes(state.operation)?'固定收益/出租 → 从租':'自营或共担风险 → 从价'}，并按月份运行`)}
 <div class="arrow">↓</div>${summaryNode('4','开发与转让','预征不是最终税额 → 达到条件后清算 → 抵减预缴 → 尾盘按季申报')}
 </div>
 <div class="actions" style="justify-content:center"><button class="btn" onclick="restart()">重新经营，尝试另一条路线</button><button class="btn secondary" onclick="openHelp()">打开税务手册</button></div></div>`;
}
function summaryNode(n,t,s){return `<div class="flow-node done"><div class="dot">${n}</div><div><b>${t}</b><small>${s}</small></div></div>`}
function restart(){location.reload()}
function modal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openHelp(){modal(`<div class="modal-head"><div><div class="scene-kicker">税务手册</div><h2>本原型覆盖范围</h2></div><button class="close" onclick="closeModal()">×</button></div>
 <div class="help-grid">
 <div class="help-card"><h4>① 房产是否入池</h4><p>先看是否属于有屋面和围护结构的房屋，再看所在地与权属/使用状态。露天设施、围墙、室外停车场等不当然属于房产。</p></div>
 <div class="help-card"><h4>② 房产税从价或从租</h4><p>自营、融资租赁、共担风险联营通常走从价；出租、固定收益且不担风险的“联营”走从租；免租期仍可能按余值从价。</p></div>
 <div class="help-card"><h4>③ 原值与月份</h4><p>土地价款、不可移动设施、改扩建价值进入原值；状态变化按月份分段，讲义多数新增情形从次月起算。</p></div>
 <div class="help-card"><h4>④ 契税流程</h4><p>判断是否发生权属转移，找新增权属承受方，归集全部经济利益；一般在合同/凭证当日发生义务，登记前申报缴纳。</p></div>
 <div class="help-card"><h4>⑤ 土地增值税扣除池</h4><p>扣除项目要同时满足法定类别、合法凭证、归属于项目并与已售房地产配比。未售、自用、出租部分对应成本不能放入本次扣除池。</p></div>
 <div class="help-card"><h4>⑥ 预征—清算—尾盘</h4><p>预征率不是正式税率；达到清算条件后在规定期限办理清算并抵减预缴，清算后尾盘继续按单位面积扣除额申报。</p></div>
 </div><div class="notice">本游戏按你上传讲义的口径制作。省级税率、减除比例、申报期限等需要题目给定的地方，均在游戏场景中直接给定，不额外考察税法基本知识。</div>`)}
window.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
renderScene();updateUI();
</script>
</body>
</html>
