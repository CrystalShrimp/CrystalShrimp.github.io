补偿俱乐部为客户进行注册登记、准备会籍资料以及制作  \r\n会员卡等初始活动所花费的成本。甲公司收取的入会费和年费均无须返还。2×25年1月1日  \r\n甲公司与200名客户签订了为期2年的合同，一次收取价款40万元，注册登记等款项2万元。  \r\n下列关于甲公司2×25年的会计处理表述正确的是（ ）。A．将一次收取价款40万元确认为2×25年的收人B.将一次收取的注册登记等款项2万元确认为2×25年的收人C.将一次收取价款40万元和注册登记等款项2万元在2×25年至2×26年2年内分摊确认为收入D.将一次收取价款40万元在2×25年至2×26年2年内分摊确认为收人，将一次收取的注册登记等款项2万元确认为2×25年的收人\r\n\r\n（解析甲公司承诺的服务是向客户提供健身服务，而甲公司为会员入会所进行的初始活动并未向客户提供其所承诺的服务，只是一些内部行政管理性质的工作。因此，甲公司虽然为补偿这些初始活动向客户收取了2万元入会费，但是该入会费实质上是客户为健身服务所支付对价的一部分，故应当作为健身服务的预收款，与收取的年费一起在2年内分摊确认为收入。\r\n\r\n(解题攻略）企业收取了无须退回的初始费，该初始费与未来将转让的已承诺商品相关，应当在未来转让该商品时确认为收入。\r\n\r\n## 六、社会资本方对政府和社会资本合作（PPP）项目合同的会计处理 考点难度 ●中\r\n\r\n（一）PPP项目合同的特征和条件（略)\r\n\r\n(二）相关会计处理 (以无形资产模式为例)\r\n\r\n1.建造期间\r\n\r\n<table><tr><td rowspan=1 colspan=1>项目</td><td rowspan=1 colspan=1>会计处理</td></tr><tr><td rowspan=1 colspan=1>（1）确认建造服务收入和成本</td><td rowspan=1 colspan=1>借：合同履约成本贷：原材料、应付职工薪酬等借：合同资产贷：主营业务收入借：主营业务成本贷：合同履约成本</td></tr><tr><td rowspan=1 colspan=1>（2）确认资本化的借款费用</td><td rowspan=1 colspan=1>借：PPP借款支出贷：长期借款一应计利息等</td></tr></table>\r\n\r\n例（真）题-答案」 42.C\r\n\r\n<table><tr><td>项目</td><td>会计处理</td></tr><tr><td>（3）在PPP项目资产达到预定可使用状态时</td><td>借：无形资产 贷：合同资产 PPP借款支出</td></tr></table>\r\n\r\n## 2.运营期间\r\n\r\n<table><tr><td rowspan=1 colspan=1>项目</td><td rowspan=1 colspan=1>会计处理</td></tr><tr><td rowspan=1 colspan=1>（1）确认运营服务收人和成本</td><td rowspan=1 colspan=1>借：银行存款贷：主营业务收人借：合同履约成本贷：原材料、应付职工薪酬等借：主营业务成本贷：合同履约成本</td></tr><tr><td rowspan=1 colspan=1>（2）对无形资产进行摊销</td><td rowspan=1 colspan=1>借：主营业务成本贷：累计摊销</td></tr></table>"},{"title":"第二节费用","content":"## 一、费用的确认\r\n\r\n考点难度●○○易\r\n\r\n费用是指企业在日常活动中发生的、会导致所有者权益减少的、与向所有者分配利润无关的经济利益的总流出。\r\n\r\n## 二、期间费用\r\n\r\n考点难度●〇○易\r\n\r\n期间费用包括管理费用、销售费用和财务费用。\r\n\r\n（一）管理费用\r\n\r\n管理费用是指企业为组织和管理企业生产经营所发生的管理费用，包括企业在筹建期间内发生的开办费、董事会和行政管理部门在企业的经营管理中发生的或者应由企业统一负担的公司经费（包括行政管理部门职工工资及福利费、物料消耗、低值易耗品摊销、办公费和差旅费\r\n\r\n等）、工会经费、董事会费（包括董事会成员津贴、会议费和差旅费等）、聘请中介机构费、咨询费（含顾问费）、诉讼费、业务招待费、技术转让费、行政管理部门等发生的固定资产日常修理费用以及应缴纳的残疾人就业保障金等。\r\n\r\n## （二）销售费用\r\n\r\n销售费用是指企业在销售商品和材料、提供劳务的过程中发生的各种费用，包括企业在销售商品过程中发生的保险费、包装费、展览费和广告费、商品维修费、装卸费等，以及为销售本企业商品而专设的销售机构（含销售网点、售后服务网点等）的职工薪酬、业务费、折旧费、固定资产日常修理费用等费用。\r\n\r\n## （三）研发费用\r\n\r\n研发费用是指企业进行研究与开发过程中发生的费用化支出，以及计人管理费用的自行开发无形资产的摊销金额。其包括“管理费用”科目下“研究费用”明细科目的当期发生额，以及“管理费用”科目下“无形资产摊销”明细科目中属于开发费用资本化金额在当期的摊销额。\r\n\r\n## （四）财务费用\r\n\r\n财务费用是指企业为筹集生产经营所需资金等而发生的应予费用化的筹资费用，包括利息支出（减利息收入）、汇兑损益等。"},{"title":"第三节利润","content":"## 一、利润的构成\r\n\r\n考点难度●〇○ 易\r\n\r\n利润是指企业在一定会计期间的经营成果。利润包括收人减去费用后的净额、直接计人当期利润的利得和损失等。\r\n\r\n直接计人当期利润的利得和损失，是指应当计人当期损益、会导致所有者权益发生增减变动的、与所有者投人资本或者向所有者分配利润无关的利得或者损失。\r\n\r\n## （一）营业利润\r\n\r\n营业利润=营业收入－营业成本－税金及附加－销售费用－管理费用（不含研发费用）-研发费用－财务费用+其他收益+投资收益（－投资损失）+净敞口套期收益（－净口套期损失）+公允价值变动收益（－公允价值变动损失）－信用减值损失－资产减值损失（不含信用减值）+资产处置收益（－资产处置损失）\r\n\r\n【例题43·单选题】甲公司2×25年发生以下交易或事项：（1）销售商品确认收入24000  \r\n万元，结转成本19000万元；（2）采用公允价值进行后续计量的投资性房地产取得出租收人  \r\n2800万元，2×25年公允价值变动收益1000万元；（3）报废固定资产损失600万元；（4）因  \r\n持有以公允价值计量且其变动计人其他综合收益的金融资产确认公允价值变动收益800 万元；  \r\n（5）确认商誉减值损失2000万元。不考虑其他因素，甲公司2×25年度营业利润是（）  \r\n万元。A. 5200 B.8200 C. 6200 D.6800\r\n\r\n解析营业利润=事项（1）[商品销售收入24000-结转销售成本19000]+事项（2）[租金收入2800+公允价值变动收益1000]－事项（5）资产减值损失2000=6800（万元）。\r\n\r\n## （二）利润总额\r\n\r\n利润总额=营业利润+营业外收人-营业外支出\r\n\r\n其中：\r\n\r\n营业外收入是指企业发生的与其日常活动无直接关系的各项利得。\r\n\r\n营业外支出是指企业发生的与其日常活动无直接关系的各项损失。\r\n\r\n## （三）净利润\r\n\r\n净利润=利润总额－所得税费用\r\n\r\n其中，所得税费用是指企业确认的应从当期利润总额中扣除的所得税费用。\r\n\r\n## 二、营业外收支的会计处理\r\n\r\n考点难度●〇○易\r\n\r\n## （一）营业外收入\r\n\r\n营业外收人是指企业发生的营业利润以外的收益。主要包括非流动资产毁损报废利得、与企业日常活动无关的政府补助（总额法）、盘盈利得、捐赠利得等。\r\n\r\n【真题44·多选题】甲公司为一家建筑设计公司，2×24年度发生的下列各项交易或事项中，应计人营业外收人的有（）。（2025年回忆版）A.报废固定资产取得收益20万元B．甲公司的母公司豁免了甲公司以前期间的欠款30万元C．甲公司的客户未按时提供必要资料导致甲公司为该客户设计服务工期延误，根据合同收取违约金10万元D.因遭受火灾取得政府救助200万元（总额法）\r\n\r\n（解析选项B，属于权益性交易，应计入资本公积；选项C，属于合同中的索赔条款，是交易价格中的可变对价，应计入营业收入。\r\n\r\n【例题45·单选题】2×25年，甲公司发生的相关交易或事项如下：（1）以存货清偿债务，  \r\n实现债务重组利得20万元；（2）固定资产盘盈100万元；（3）固定资产报废利得1万元。不  \r\n考虑其他因素，甲公司2×25年度应计人营业外收入的金额是（）万元。A.11 B.101 C. 131 D.1\r\n\r\n（解析事项（1）计入其他收益；事项（2）计入以前年度损益调整，最终转入留存收益；事项（3）计入营业外收入。所以，甲公司2×25年度应计入营业外收入的金额为1万元，选项D正确。\r\n\r\n（二）营业外支出5年热点丨2次\r\n\r\n营业外支出是指企业发生的营业利润以外的支出，主要包括非流动资产毁损报废损失、公益性捐赠支出、非常损失、固定资产盘亏损失、企业未按规定缴纳残疾人就业保障金缴纳的滞纳金等。\r\n\r\n## 三、本年利润的会计处理（略）\r\n\r\n## 四、综合收益总额\r\n\r\n考点难度●○○易\r\n\r\n净利润加上其他综合收益的税后净额为综合收益总额。"}],"quizGroups":[{"type":"单项选择题","questions":[{"num":1,"text":"2×25年10月1日，甲公司与客户签订不可撤销的合同，两年内在客户需要时为其提供保洁服务。合同价款包括两部分：一是每月10万元的固定对价；二是最高金额为80万元的奖金。甲公司预计可以计人交易价格的可变对价金额为60万元。甲公司按照时间进度确定履约进度。假定不考虑增值税等相关税费，甲公司2×25年应确认的收入是（）万元。","options":[{"letter":"A","text":"30"},{"letter":"B","text":"37.5"},{"letter":"C","text":"40"},{"letter":"D","text":"90 例（真）题-答案」 45.D"}],"answer":"B","explanation":"甲公司为客户提供两年的保洁服务构成单项履约义务，估计的交易价格为300万元$( 1 0 \\times 2 4 { + } 6 0 )$ ，甲公司将该金额按照合同期24个月平均确认为收人，即每月确认的收入=300÷24=12.5（万元），2×25年确认的收入金额=12.5×3=37.5（万元）。"},{"num":2,"text":"2×25年10月1日，甲公司开始向客户出售A款啤酒,售价为每瓶5元。为了推广该款啤酒，甲公司2×25年10月1日至2×26年1月31日推出了以下促销活动：客户买满1万瓶A款啤酒，则购买的所有A款啤酒在原价基础上打9折，折扣将以银行转账方式退回。2×25年10月20日，乙客户通过银行转账支付4万元，向甲公司购买了8000瓶A款啤酒。甲公司根据历史数据估计乙客户有95%的可能性在促销活动期间买满1万瓶A款啤酒。甲公司按照最可能发生金额估计销售啤酒的对价金额，且该金额已考虑了计人交易价格的可变对价金额的限制。不考虑相关税费及其他因素，甲公司2×25年10月销售8000瓶A款啤酒应确认的收入是（ ）万元。","options":[{"letter":"A","text":"4"},{"letter":"B","text":"3.8"},{"letter":"C","text":"3.42"},{"letter":"D","text":"3.6"}],"answer":"D","explanation":"甲公司2×25年10月销售8000瓶A款啤酒应确认的收人=4×90%=3.6（万元）。"},{"num":3,"text":"甲公司是一家软件开发公司，与乙公司签订软件授权许可合同，将其自行研发的成熟的标准化软件产品授权给乙公司永久使用，并提供为期一年的保证类质量保证，质保期自软件激活之日起算。2×25年1月1日，甲公司按合同约定的价格向乙公司交付软件产品，包括：（1）软件授权书；（2）软件及安装调试介质（光盘）。当日，乙公司清点交付的软件产品，签署了验收签收单。根据合同约定，乙公司应于一个月的正常信用期内支付货款，除非软件产品本身存在质量问题，否则乙公司无权要求退货。甲公司判断乙公司具有可靠的偿付能力。乙公司取得软件产品后可随时自行安装软件，安装完成后，在系统中输人软件授权书中的授权许可信息即可在线获取甲公司系统中自动生成的激活码，录人激活码激活软件之后乙公司可永久使用该软件。2×25年1月18日，乙公司支付软件采购价款。乙公司自2×25年1月1日获取该软件后，由于相关配套硬件设施及其他系统尚未安装完成，因此乙公司并未激活该软件，直至2×25年3月5日，相关配套硬件设施及其他系统已安装完成，乙公司激活并正式开始使用该软件。假设该合同中仅包含软件授权许可一项履约义务，并属于在某一时点履行的履约义务。不考虑其他因素，甲公司该软件授权许可合同确认收入的时点是（ ）。","options":[{"letter":"A","text":"2×25年1月1日"},{"letter":"B","text":"2×25年1月18日"},{"letter":"C","text":"2×25年3月5日"},{"letter":"D","text":"2×25年12月31日"}],"answer":"A","explanation":"【解析〗2×25年1月1日，软件授权许可的相关文档已移交给乙公司，乙公司有权随时自行安装，可凭软件授权书中的授权许可信息获取甲公司系统中自动生成的激活码以激活软件并开始使用，因此激活码的生成及软件的激活并无实质性障碍，乙公司已经可以主导该软件产品的使用并从中获得几乎全部的经济利益，同时也负有向甲公司支付货款的义务。因此2×25年1月1日，乙公司已经取得了该软件产品的控制权，乙公司此时尚未生成激活码不影响乙公司取得该软件产品的控制权。甲公司应当于2×25年1月1日确认软件授权许可收人。"},{"num":4,"text":"甲公司是一家房地产开发企业，甲公司委托乙公司进行房地产销售，并约定每签订一份销售合同，甲公司按照合同价款的5%向乙公司支付销售佣金。2×25年8月，甲公司签订的销售合同价款总计8000万元，其中2000万元所对应的房屋于2×25年12月交付给客户，剩余6000万元所对应的房屋预计将在2×26年12月交付给客户。2×25年12月31日，甲公司“合同取得成本”科目余额是（ ）万元。","options":[{"letter":"A","text":"400"},{"letter":"B","text":"0"},{"letter":"C","text":"100"},{"letter":"D","text":"300"}],"answer":"D","explanation":"甲公司2×25年12月31日“合同取得成本”科目余额=6000×5%=300（万元）。"},{"num":5,"text":"关于附有客户额外购买选择权的销售，下列表述中错误的是（ ）。","options":[{"letter":"A","text":"企业提供重大权利的，应当作为单项履约义务"},{"letter":"B","text":"客户行使该选择权购买商品时的价格反映了这些商品单独售价的，不应被视为企业向该客户提供了一项重大权利"},{"letter":"C","text":"如果选择权向客户提供了重大权利，企业应当在未来转让这些商品或服务时或选择权失效时确认收入"},{"letter":"D","text":"只要客户有额外购买商品选择权，就应将其作为单项履约义务"}],"answer":"D","explanation":"对于附有客户额外购买选择权的销售，企业应当评估该选择权是否向客户提供了一项重大权利。企业提供重大权利的，应当作为单项履约义务，选项D错误。"},{"num":6,"text":"甲公司为连环漫画的创作者，2×25年1月1日，向客户授予许可证使其可在4年内使用甲公司3份连环漫画中的角色和名称。每份连环漫画都有主角，但是会定期出现新创造的角色，且角色的形象在随时演变。该客户是大型游轮的运营商，其能够依据合理的方法以不同形式（例如节目或演出）使用漫画的角色。合同要求客户使用最新的角色形象。甲公司因授予许可证一次性收取300万元。假定不考虑其他因素，甲公司下列会计处理的表述中，正确的是（ ）。","options":[{"letter":"A","text":"在收到款项时确认300万元收入"},{"letter":"B","text":"在授予许可证4年后确认300万元收人"},{"letter":"C","text":"每年确认75万元收入"},{"letter":"D","text":"2×25年授予许可证不确认收人"}],"answer":"C","explanation":"授予该许可证满足在一段期间内确认收入的条件：（1）合同要求或客户能够合理预期企业将从事对该项知识产权有重大影响的活动；（2）该活动对客户将产生有利或不利影响；（3）该活动不会导致向客户转让某项商品。因此每年应确认收人75万元（300/4），选项C正确。"},{"num":7,"text":"2×25年10月15日乙公司以甲公司名义开设一家连锁店，甲公司于30日内向乙公司一次性收取特许权等费用50万元（其中40万元为当年11月份提供柜台等设施收费，设施提供后由乙公司所有；10万元为次年1月提供市场培训等后续服务收费，收费与单独售价均相同）,2×25年11月1日，甲公司收到上述款项后向乙公司提供了柜台等设施，成本为35万元，预计2×26年1月提供相关后续服务的成本为8万元。不考虑其他因素，甲公司2×25年度因该交易应确认的收入是（ ）万元。","options":[{"letter":"A","text":"8"},{"letter":"B","text":"40"},{"letter":"C","text":"10"},{"letter":"D","text":"50"}],"answer":"B","explanation":"甲公司2×25年度因该交易应确认的收入为40万元，收取的次年1月提供市场培训等后续服务费应当确认为合同负债，选项B正确。"},{"num":8,"text":"甲公司将其拥有的某合成药的专利权许可授予乙公司，授权期限为10年。同时，甲公司承诺为乙公司生产该种药品。除此之外，甲公司不会从事任何与支持该药品相关的活动。该药品的生产流程特殊性极高，没有其他公司能够生产该药品。下列各项表述中正确的是）。","options":[{"letter":"A","text":"该专利权许可和生产服务可明确区分，应当分别作为单项履约义务进行会计处理"},{"letter":"B","text":"该专利权许可和生产服务不可明确区分，应当将其一起作为单项履约义务进行会计处理"},{"letter":"C","text":"甲公司将授予乙公司专利权许可的交易价格与账面价值差额计人资产处置损益"},{"letter":"D","text":"甲公司应将交易价格在专利权许可和生产服务之间进行分配"}],"answer":"B","explanation":"甲公司向乙公司授予专利权许可，并为其提供生产服务。由于市场上没有其他公司能够生产该药品，客户将无法从该专利权许可中单独获益，因此，该专利权许可和生产服务不可明确区分，应当将其一起作为单项履约义务进行会计处理，选项A和D错误，选项B正确。相反，如果该药品的生产流程特殊性不高，其他公司也能够生产该药品，则该专利权许可和生产服务可明确区分，应当分别作为单项履约义务进行会计处理。甲公司仅将其拥有的专利权许可授予乙公司，期限为10年，并没有出售，因此，无须将专利权许可交易价格与账面价值差额计入资产处置损益，选项C错误。"},{"num":9,"text":"甲公司为非金融企业，发生的下列各项费用中，应在利润表“管理费用”项目列报的是（ ）。","options":[{"letter":"A","text":"售后服务网点员工的薪酬"},{"letter":"B","text":"外币兑换产生的汇兑损失"},{"letter":"C","text":"行政部门耗用的低值易耗品摊销"},{"letter":"D","text":"研发部门参与项目研究发生的不满足资本化条件的直接人工费用"}],"answer":"C","explanation":"选项A在“销售费用”项目列报；选项B在“财务费用”项目列报；选项C在“管理费用”项目列报；选项D在“研发费用”项目列报。"},{"num":10,"text":"企业发生的下列交易或事项中，不会引起当年度营业利润发生变动的是（ ）。","options":[{"letter":"A","text":"出售持有待售处置组产生的收益"},{"letter":"B","text":"报废固定资产净损失"},{"letter":"C","text":"持有的以公允价值计量且其变动计人当期损益的金融资产公允价值上升"},{"letter":"D","text":"处置某项联营企业投资产生投资损失"}],"answer":"B","explanation":"选项A，出售处置组产生的收益计入资产处置损益；选项C，以公允价值计量且其变动计人当期损益的金融资产公允价值变动计入公允价值变动损益；选项D，处置联营企业产生的投资损失计人投资收益，上述三项均影响营业利润；选项B，报废固定资产净损失计入营业外支出，不影响营业利润。"}]},{"type":"多项选择题","questions":[{"num":1,"text":"关于收入的确认和计量，下列表述中正确的有（ ）。","options":[{"letter":"A","text":"合同履行完毕后，企业与客户重新协商调减已转让商品的对价的，企业应首先判断应收账款的信用减值损失是否已充分计提，并基于调减对价的具体原因和安排，判断应收账款的减少应作为合同变更还是债务重组进行会计处理"},{"letter":"B","text":"交易价格即为合同价格"},{"letter":"C","text":"企业代第三方收取的款项，应当作为负债进行会计处理"},{"letter":"D","text":"企业预期将退还给客户的款项，应当作为负债进行会计处理"}],"answer":null,"explanation":null},{"num":2,"text":"2×24年1月20日，甲建筑公司（以下简称“甲公司”）和客户签订了一项总金额为3000万元的固定造价合同，在客户自有土地上建造一幢办公楼，预计合同总成本为2100万元；截至2×24年末，甲公司累计已发生成本1260万元；2×25年初，合同双方同意更改该办公楼屋顶的设计，合同价格和预计总成本因此而分别增加700万元和420万元。假定该建造服务属于在某一时段内履行的履约义务，并根据累计发生的合同成本占合同预计总成本的比例确定履约进度。不考虑其他因素，下列关于甲公司会计处理表述中正确的有（ ）。","options":[{"letter":"A","text":"2×24年年末，甲公司应确认收人1800万元"},{"letter":"B","text":"2×25年年初，甲公司应当将合同变更部分作为原合同的组成部分进行会计处理"},{"letter":"C","text":"2×25年年初，甲公司在合同变更日应调整期初留存收益50万元"},{"letter":"D","text":"2×25年年初，甲公司在合同变更日应额外确认收入50万元"}],"answer":"ABD","explanation":"选项A，截至2×24年末，甲公司累计已发生成本1260万元，履约进度为60%$( ~ 1 2 6 0 \\div 2 1 0 0 \\times 1 0 0 \\% )$ ，甲公司在2×24年应确认收人1800万元 $\\left( 3 0 0 0 \\times 6 0 \\% \\right)$ ；选项B,由于合同变更后拟提供的剩余服务与在合同变更日或之前已提供的服务不可明确区分（即该合同仍为单项履约义务），因此，甲公司应当将合同变更部分作为原合同的组成部分进行会计处理；选项C和D，合同变更后的交易价格为3700万元（3000+700），甲公司重新估计的履约进度为 $5 0 \\% ~ [ ~ 1 2 6 0 \\div ~ ( ~ 2 1 0 0 + 4 2 0 ~ ) ~ \\times 1 0 0 \\%$ 1，甲公司在合同变更日应额外确认收人50万元（50%×3700-1800），不能调整期初留存收益。"},{"num":3,"text":"2×25年1月1日，甲公司与客户乙公司签订合同，在一年内以固定单价200元向乙公司交付80件标准配件。甲公司以往的习惯做法表明，在该商品出现瑕疵时，将根据商品的具体瑕疵情况给予客户价格折让，甲公司综合考虑相关因素后认为会向客户提供一定的价格折让。合同开始日，甲公司估计将提供400元价格折让。2×25年1月30日，甲公司向乙公司交付40件配件，假定乙公司已取得40件配件的控制权。2×25年1月31日，乙公司发现配件存在质量瑕疵需要返工，甲公司返工处理后，乙公司对返工后的配件表示满意。2×25年1月31日，为了维系客户关系，甲公司按以往的习惯做法主动提出对合同中80件配件给予每件6元的价格折让，共计480元，该折让符合甲公司以往的习惯做法。不考虑其他因素，下列表述中正确的有（ ）。","options":[{"letter":"A","text":"2×25年1月31日，甲公司按以往的习惯给予乙公司的价格折让属于合同变更"},{"letter":"B","text":"甲公司对存在质量瑕疵的产品返工应按《企业会计准则第13号一—或有事项》规定进行会计处理"},{"letter":"C","text":"甲公司2×25年1月30日应确认收人7800元"},{"letter":"D","text":"甲公司2×25年1月31日价格折让增加额应冲减当期销售收人40元"}],"answer":"BCD","explanation":"在合同开始日，根据甲公司以往的习惯，可以预期如果商品不符合合同约定的质量标准，甲公司将给予乙公司一定的价格折让，而后续实际给予的折让与初始预计的折让差异属于相关不确定性消除而发生的可变对价的变化，而非合同变更导致的，因此应作为合同可变对价的后续变动进行会计处理，选项A错误；甲公司对存在质量瑕疵配件提供的返工服务是为了保证销售的配件符合既定标准，属于保证类质量保证，不构成单项履约义务，甲公司应根据《企业会计准则第13号—一或有事项》的规定对相关的质保义务进行会计处理，选项B正确；甲公司2×25年1月30日应确认收入 $= 2 0 0 \\times 4 0 - 4 0 0 \\times 4 0 / 8 0 { \\mathrm { = } } 7 8 0 0$ （元），选项C正确；由于甲公司给予的价格折让与整个合同相关，应当分摊至合同中的各项履约义务，其中，已交付的40件配件的履约义务已经完成，其控制权已经转移，因此，甲公司在交易价格发生变动的当期，将价格折让增加额80元（480-400）分摊至已交付40件配件的部分，冲减当期收人40元（80×40/80），选项D正确。"},{"num":4,"text":"甲公司下列各项从客户收取的款项中，属于合同负债的有（ ）。","options":[{"letter":"A","text":"与业主签订不可撤销的工程建造合同，根据合同约定预收业主的款项"},{"letter":"B","text":"作为平台公司，代销平台商户的购物储值卡收到的款项中，属于甲公司应取得的代理费部分的金额"},{"letter":"C","text":"作为出租方，从承租人预收的租金"},{"letter":"D","text":"出租包装物收取的押金"}],"answer":"AB","explanation":"选项C，通过“预收账款”科目核算；选项D，通过“其他应付款”科目核算。"},{"num":5,"text":"甲供电公司与乙客户签订2年的供电合同，合同约定：甲公司自2×25年1月1日起每月向乙客户供电，并在月末收取电费。在合同签订时，甲公司向乙客户收取了一次性人网费1200元，并预期能够取得2年的全部电费收人。乙客户第9个月未支付电费，但是甲公司经过评估认为仍很可能取得对价。根据当地相关法律规定，甲公司不能立即停止供电，需要先履行催缴程序。乙客户经催告后，仍不缴费，则甲公司可自首次欠费后的第3个月（该年12月份）起停止供电。10月份，乙客户仍未缴费，经评估甲公司认为很可能不会收回对价。下列关于甲公司收入确认的表述中正确的有（ ）。","options":[{"letter":"A","text":"9月份应继续确认供电收人，但需要考虑对应收账款计提坏账准备"},{"letter":"B","text":"10月份仍应继续确认供电收人，并对应收账款计提坏账准备"},{"letter":"C","text":"10月份，将尚未摊销的人网费一次确认为收人"},{"letter":"D","text":"12月份，将尚未摊销的入网费一次确认为收入"}],"answer":"AD","explanation":"10月份，已不再满足合同成立的条件，不再继续确认供电收入，选项B错误；10月份，合同已经不再满足成立的条件，甲公司收取的一次性入网费无须退还，但是甲公司仍负有向客户转让商品（或提供服务）的剩余履约义务（需要持续供电到12月份），因此，不应将剩余人网费一次性确认为收人，而应继续作为负债，选项C错误。"},{"num":6,"text":"2×24年12月22日，甲公司与乙公司签订合同，将其一款产品化数据交换平台管理软件授权给乙公司使用，授权期限为3年。当日，甲公司将该软件及期限为10天的临时密钥通过电子邮件发送给乙公司，乙公司通过临时密钥可以在10天试用期内免费体验和试用该软件的全部功能。试用期结束前，乙公司有权单方面无条件终止合同，且无须向甲公司作出补偿。试用期结束，乙公司未终止合同，合同正式生效。合同约定，乙公司应在合同生效（即2×25年1月1日）后的6个月内每月末支付5万元，合同总价款为30万元。为促进回款，甲公司于合同生效日仅向乙公司提供了期限为6个月的临时密钥，临时密钥可正常使用软件的全部功能。乙公司支付全部价款后，甲公司将提供可使用至3年授权期满的正式密钥。合同约定，甲公司还需向乙公司免费提供10天的软件使用培训和1年期的软件免费升级。甲公司销售的该软件无须后续培训及升级服务也能正常使用。甲公司下列会计处理表述中，正确的有（ ）。","options":[{"letter":"A","text":"合同开始日为2×24年12月22日"},{"letter":"B","text":"软件许可、培训服务和软件升级服务构成一项单项履约义务"},{"letter":"C","text":"该软件许可应作为在某一时点履行的履约义务"},{"letter":"D","text":"甲公司应在2×25年1月1日确认软件许可相关收入"}],"answer":"CD","explanation":"乙公司2×24年12月22日取得软件和10天的临时密钥，可正常使用软件全部功能。但试用期结束前乙公司有权单方面无条件终止合同，且无须向甲公司作出补偿，因此，试用期结束前不存在收人准则定义的合同。试用期结束，乙公司未选择终止合同，合同正式生效，合同约定的权利义务对甲公司和乙公司具有法律约束力，合同成立，选项A错误。甲公司合同中的承诺包括软件许可、提供培训及软件升级服务。由于该软件无须后续培训及升级也能正常使用，甲公司在不提供其他服务的情况下可以单独履行其授予乙公司软件许可的承诺，培训及升级服务也并未对软件作出重大修改，彼此之间无高度关联性，甲公司也未将这些服务整合成一项组合产出。因此，软件许可、培训服务、软件升级服务之间是可明确区分的，应分别作为单项履约义务，选项B错误。该软件许可有独立功能，无须后续培训及升级服务也能正常使用，乙公司从该软件许可中获得的利益不会受到甲公司从事的相关活动的重大影响。因此，该软件许可不满足在某一时段内履行履约义务的条件，应作为在某一时点履行的履约义务，选项C正确。2×25年1月1日乙公司在获得了6个月的临时密钥后，可正常使用软件全部功能并开始从中获益。虽然在乙公司支付全部价款前，甲公司仅提供临时密钥，但该安排仅是甲公司促进乙公司付款的一种手段，并不影响乙公司从软件使用中获益。因此，甲公司应在2×25年1月1日确认软件许可相关收入，选项D正确。"},{"num":7,"text":"2×25年1月1日，甲公司将一部电影授权乙公司播放3年，约定每年收取固定金额的版权费20万元，并根据乙公司电影票房收入的15%收取额外的版权费。当日，甲公司将该电影拷贝等相关资料交付乙公司，甲公司不再从事对该电影产生重大影响的活动。不考虑货币时间价值及其他因素，下列各项关于甲公司会计处理的表述中，正确的有（）。","options":[{"letter":"A","text":"甲公司应当按照租赁准则有关出租人的规定进行会计处理"},{"letter":"B","text":"该电影授权业务应当作为在某一时点履行的履约义务确认收入"},{"letter":"C","text":"按照乙公司电影票房收人的15%计算的版权费应在甲公司履行相关履约义务时确认收人"},{"letter":"D","text":"2×25年1月1日确认收人60万元"}],"answer":"BD","explanation":"甲公司将一部电影授权乙公司播放3年，应当按照收入准则授予知识产权许可的有关规定进行会计处理，选项A错误；因甲公司不再从事对该电影产生重大影响的活动，所以该电影授权业务应当作为在某一时点履行的履约义务确认收人，2×25年1月1日确认收入=20×3=60（万元），选项B和D正确；企业向客户授予知识产权许可，并约定按客户实际销售或使用情况收取特许权使用费的，应当在下列两项敦晚的时点确认收人：一是客户后续销售或使用行为实际发生；二是企业履行相关履约义务，选项C错误。"},{"num":8,"text":"甲公司为房地产开发企业，2×25年开发完成一栋办公楼，其中土地使用权成本为5亿元,其他建造成本为8亿元。甲公司将办公楼面积的 50%对外经营出租，余下 50% 面积拟对外销售。根据与乙公司签订的租赁合同约定，该办公楼的租赁期为5年，甲公司同时向乙公司提供物业管理服务，每年收取服务费5万元（与市场上相同物业管理服务收费相同）。该办公楼的预计使用寿命为40年。该办公楼对外出售部分尚未实现销售，不考虑其他因素，下列各项关于甲公司会计处理的表述中，正确的有（ ）。","options":[{"letter":"A","text":"提供物业管理服务作为单项履约义务确认收人"},{"letter":"B","text":"其他建造成本8亿元分类为固定资产"},{"letter":"C","text":"土地使用权5亿元分类为无形资产"},{"letter":"D","text":"对外出租办公楼收取的租金在租赁期内按直线法确认收人"}],"answer":"AD","explanation":"开发成本中对外出租的部分分类为投资性房地产，对外出售的部分分类为存货，选项B和C错误。"},{"num":9,"text":"下列交易或事项中，企业应计入营业外收人的有（ ）。","options":[{"letter":"A","text":"无法查明原因的现金盘盈"},{"letter":"B","text":"固定资产报废利得"},{"letter":"C","text":"总额法下，与企业日常活动无关的政府补助"},{"letter":"D","text":"接受控股股东直接捐赠利得"}],"answer":"ABC","explanation":"选项D，接受控股股东直接捐赠利得应计人所有者权益（资本公积）。"}]},{"type":"计算分析题","questions":[{"num":1,"text":"甲建筑公司（以下简称“甲公司”）于2×23年12月20日与乙客户签订了一项总金额为2200万元的3年期建造房屋的合同，并规定甲公司应自第三方采购一项特殊设备，设备款为100万元，并将该设备整合到该建筑项目中，甲公司预计于开工后6个月内将该设备的控制权转移给客户。合同中另外还规定了若提前两个月完工，甲公司可获得80万元的奖励款。合同总价格及预计总成本中包含的钢材是由乙客户指定的供应商提供，钢材的规格、型号和价格由乙客户与供应商协商确定，根据甲公司提出的工程进度安排，乙客户向供应商下达指令将钢材运至施工现场，由甲公司清点签收且垫付货款，并根据工程需要使用如有多余的钢材由乙客户自行处理。根据预计使用数量测算，钢材的总价格为600万元。房屋工程于2×24年1月2日开工，预计2×26年12月30日完工，最初预计的工程总成本为1700万元，其中，钢材成本600万元、特殊设备款为100万元。2×24年7月1日，甲公司将采购的设备运达施工现场并经过乙客户验收，乙客户已取得对设备的控制权。2×25年第一季度，合同各方同意由于更改建筑平面图而修改合同，合同金额增加230万元（含钢材成本30万元），预计工程总成本增加150万元（含钢材成本30万元）。2×25年12月31日，甲公司根据以往经验和剩余工作量（主要是室内工程），认为该项工程极有可能会提前两个月完成并且不会发生累计已确认收入的重大转回。甲公司于2×26年10月28日提前两个月完工，工程质量优良，客户同意支付奖励款80万元。甲公司采用成本法确定履约进度，该业务的其他资料如下表所示： <table><tr><td>要求： （1）判断甲公司与乙客户签订的建造服务合同中，与钢材相关的价款是否应包含</td></tr><tr><td>在甲公司确认的收入金额中，说明理由。 （2）说明甲公司应如何计算2×24年履约进度，并说明理由。计算2×24年度确</td></tr><tr><td>认的合同收入、合同费用和合同毛利。 （3）说明甲公司应如何对2×25年第一季度合同变更进行会计处理。计算2×25</td></tr><tr><td>年度确认的合同收入、合同费用和合同毛利。 （4）计算2×26年确认的合同收入、合同费用和合同毛利。</td></tr></table> 单位：万元 <table><tr><td rowspan=1 colspan=1>项目</td><td rowspan=1 colspan=1>2×24年</td><td rowspan=1 colspan=1>2×25年</td><td rowspan=1 colspan=1>2×26年</td></tr><tr><td rowspan=1 colspan=1>累计实际发生的成本</td><td rowspan=1 colspan=1>800（包括设备100、钢材300）</td><td rowspan=1 colspan=1>1560（包括设备100、钢材640）</td><td rowspan=1 colspan=1>1870（包括设备100、钢材640）</td></tr><tr><td rowspan=1 colspan=1>预计完成合同尚需发生的成本</td><td rowspan=1 colspan=1>900（包括钢材300）</td><td rowspan=1 colspan=1>300</td><td rowspan=1 colspan=1>0</td></tr></table>","options":[],"answer":null,"explanation":null},{"num":2,"text":"甲公司2×25年度财务报表经批准于2×26年2月20日对外报出。甲公司2×25年至2×26年发生的有关交易或事项如下： （1）2×25年10月5日，甲公司与乙公司签订定制健身器材的合同。合同约定，甲公司应当设计、生产符合乙公司旗下健身连锁店质量标准、外观设计、带有乙公司健身连锁店商标的专用健身器材一批，甲公司应于2×26年2月10日前交付至乙公司指定地点。在设计、生产期间，乙公司有权随时了解、检查甲公司是否按要求进行设计和生产。合同价款总额300万元将在健身器材验收后7天内支付。合同同时约定，在健身器材的设计、生产期间，如果因甲公司的技术原因导致合同终止，甲公司需要向乙公司支付赔偿金60万元；如果因乙公司原因导致合同终止，乙公司应当就甲公司已完工的部分支付相对应的合同价款以补偿甲公司发生的成本和合理利润。在执行合同的过程中，甲公司根据设计初稿进行生产，根据生产中发现的问题修改设计，直至生产出符合乙公司要求的专用健身器材。截至2×25年12月31日，甲公司为上述合同发生了设计、生产成本共计140万元,预计生产完成该批健身器材还需支出60万元。2×26年2月5日，甲公司将生产完毕的健身器材运送至乙公司指定的门店并通过验收，款项尚未收到，甲公司按实际发生成本占预计总成本的比例确定履约进度。 （2）2×25年1月1日，甲公司将一项专利技术授权给丁公司使用2年，当日将各项技术资料交付丁公司。合同约定，甲公司向丁公司收取固定授权费用800万元，考虑到丁公司资金紧张，双方约定分别于每年末收取400万元。此外，还约定甲公司根据丁公司利用该技术生产的产品年度销售收人的2%收取可变授权费用。该技术为一项成熟的专利技术，甲公司后续不会从事对该技术有重大影响的活动。该事项适用的折现率为5%。 2×26年1月25日，甲公司得知丁公司2×25年度实现销售收人2000万元。 （3）2×26年1月1日，甲公司与戊公司签订了1年期的B产品销售协议，以每件150元的价格将B产品卖断给戊公司；甲公司每月向戊公司出售1000件B产品。根据甲公司与戊公司签订的协议，为促进甲公司与戊公司建立良好的合作关系，甲公司应在协议签订当天向戊公司支付品牌服务费0.3万元，以补偿戊公司专门为放置甲公司的B产品而需对其超市货架作出的改动，甲公司并未取得货架的控制权，亦不能决定B产品在货架上摆放的位置。 其他资料： （1）（P/A，5%，2）=1.8594。 （2）本题不考虑相关税费及其他因素。 要求： （1）根据资料（1），判断甲公司与乙公司的销售合同中设计和生产健身器材是否分别构成单项履约义务，说明理由；判断各项履约义务应在一段时间内确认收入还是在某一时点确认收入，说明理由；编制甲公司2×25年和2×26年与收入确认相关的会计分录。 （2）根据资料（2），判断甲公司向丁公司授予专利技术许可属于在某一时段内履行的履约义务还是在某一时点履行的履约义务，并说明理由；计算甲公司2×25年度授予专利技术许可应确认的收入金额。 （3）根据资料（3），说明甲公司支付的品牌服务费应如何进行会计处理，并说明理由。 1","options":[],"answer":null,"explanation":null}]}]},{"chTitle":"第十八章 政府补助","header":"## 第十八章 政府补助\n\n考情速览\n\n<table><tr><td colspan=\"3\"></td></tr><tr><td rowspan=\"3\">复习难度 ★☆</td><td rowspan=\"3\">常考题型</td><td>近5年考试平均分值</td></tr><tr><td></td></tr><tr><td>4分左右</td></tr><tr><td colspan=\"3\">学习指南 本章考题主要以客观题为主，也曾出现过计算分析题，属于比较重要章节。</td></tr></table>\n\n## 教材主要变化\n\n修改\"政府补助的定义\"相关表述。\n\n## 考点框架\n\n<table><tr><td rowspan=1 colspan=3>政府补助</td></tr><tr><td rowspan=3 colspan=1>政府补助概述</td><td rowspan=1 colspan=1>政府补助的定义</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=1 colspan=1>政府补助的特征</td><td rowspan=1 colspan=1>●中</td></tr><tr><td rowspan=1 colspan=1>政府补助的分类</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=5 colspan=1>政府补助的会计处理</td><td rowspan=1 colspan=1>会计处理方法</td><td rowspan=1 colspan=1>●中</td></tr><tr><td rowspan=1 colspan=1>与资产相关的政府补助</td><td rowspan=1 colspan=1>中</td></tr><tr><td rowspan=1 colspan=1>与收益相关的政府补助</td><td rowspan=1 colspan=1> 中</td></tr><tr><td rowspan=1 colspan=1>政府补助的退回</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=1 colspan=1>特定业务的会计处理</td><td rowspan=1 colspan=1>难</td></tr><tr><td rowspan=2 colspan=1>政府补助的列报</td><td rowspan=1 colspan=1>政府补助在财务报表上的列示</td><td rowspan=1 colspan=1>●00易</td></tr><tr><td rowspan=1 colspan=1>政府补助的附注披露</td><td rowspan=1 colspan=1>●0０易</td></tr></table>\n\n## 考点剖析\n\n本章的关键词是\"总额法\"\"净额法\"\"与资产相关的政府补助\"以及\"与收益相关的政府补助\"，知识点独立性强，与其他章节联系不大，需要您在充分理解知识点和例题讲解的基础上多看多练，熟能生巧。","sections":[{"title":"第一节政府补助概述","content":"## 一、政府补助的定义\n\n考点难度●〇○易\n\n政府补助是指企业从政府无偿取得货币性资产或非货币性资产。\n\n其主要形式包括政府对企业的无偿拨款、先征后返（退）、即征即退等方式的税收返还、直接向企业拨付财政贴息，以及无偿给予非货币性资产等。\n\n## 提示\n\n（1）直接减征、免征、增加计税抵扣额、抵免部分税额等不涉及资产直接转移的经济资源，不适用政府补助准则。增值税出口退税实际上是政府退回企业事先垫付的进项税，不属于政府补助。\n\n与所得税减免相关的，适用《企业会计准则第18号—所得税》。\n\n一些地方政府为了招商引资或鼓励创业投资，将产业园区内的房产以低于公允价值的价格出租给企业。理论上这也属于政府对企业的无偿经济支持，但没有纳入《企业会计准则第16号—政府补助》的范围。\n\n（2）部分减免税款需要按照政府补助准则进行会计处理。\n\n如一般纳税人的加工型企业根据税法规定招用自主就业退役士兵，按定额扣减增值税。\n\n借：应交税费一应交增值税（减免税款）\n\n贷：其他收益\n\n（3）即征即退的增值税，先按规定缴纳增值税，然后根据退回的增值税税额，借记\"银行存款\"等科目，贷记\"其他收益\"科目。另外，按规定直接减免应交的增值税税额的，也计入其他收益。\n\n（4）企业超比例安排残疾人就业或者为安排残疾人就业做出显著成绩，按规定收到的奖励，记入\"其他收益\"科目。\n\n## 二、政府补助的特征5年热点丨5次\n\n考点难度●●〇 中\n\n1.政府补助是来源于政府的经济资源。\n\n## 点拨\n\n来源于政府的资源，视情况按《政府补助》准则、《收入》准则或权益性交易进行会计处理。\n\n2.政府补助是无偿的。\n\n## 点拨 附有条件的政府补助符合无偿性的特征。\n\n政府如以企业所有者身份向企业投人资本，享有相应的所有者权益，政府与企业之间是投资者与被投资者的关系，属于互惠交易，不适用政府补助准则。\n\n企业从政府取得的经济资源，如果与企业销售商品或提供服务等活动密切相关，且来源于政府的经济资源是企业商品或服务的对价或对价的组成部分，应当按照《企业会计准则第14号——收入》的规定进行会计处理，不适用政府补助准则。\n\n\n\n【真题1·单选题】下列各项中属于政府补贴的是（ ）。（2025年回忆版）\nA.出口货物取得的增值税出口退税\nB.代扣代缴员工个人所得税收到的手续费返还\nC．即征即退的增值税\nD.政府以所有者身份投人的资本\n\n解析）政府补助是指企业从政府无偿取得货币性资产或非货币性资产。选项A，出口退税是政府退回企业事先垫付的进项税，不属于政府补助；选项B，代扣代缴员工个人所得税收到的手续费返还，不属于无偿取得货币性资产，不属于政府补助；选项D，政府以所有者身份投入的资本，表明政府与企业之间是投资者与被投资者的关系，属于互惠交易，不适用政府补助准则。\n\n【真题2·多选题】不考虑其他因素，下列各项企业发生的交易或事项中，属于政府补助的有（ ）。（2025年回忆版）A.因代扣代缴个人所得税所收到的手续费返还B．因将土地使用权交给地方政府收储而按市场价格收到的补偿款C．因达到特定利润规模而收到地方政府返还的企业所得税D.因防治大气污染排放达标收到的政府奖励款\n\n解析选项A，计入其他收益，但不具有无偿性，不属于政府补助；选项B，属于互惠交易，不属于政府补助。\n\n【真题3·多选题】下列各项企业发生的交易或事项中,属于政府补助的有（ ）。（2024年回忆版）A．因按国家规定以低于市场价格的售价销售可再生能源电力而收到的政府价格补贴B.因租用产业园区而收到政府提供的租金补贴C.因达到政策要求的研发资金投人规模而收到政府的奖励资金D.因政府土地收储规划而搬迁厂房收到的土地补偿资金\n\n解析选项A，企业从政府取得的经济资源，与企业销售商品或提供服务等活动密切相关，且来源.于政府的经济资源是企业商品或服务的对价或者是对价的组成部分，应按收入准则处理，不适用政府补助准则；选项D，因政府土地收储规划而搬迁厂房收到的土地补偿资金并非是无偿的，不属于政府补助。\n\n【真题4·单选题】甲公司2×23年度从财政取得的下列各项资金中，属于政府补助的是（ ）。（2023年）A．将其位于城区的厂区搬迁至郊外，原厂址用地移交给政府收储，政府为此支付甲公司土地补偿金B.出口货物在免征增值税的同时取得政府退回的出口货物前道环节发生的增值税进项税额C.收到政府拨付的资金，政府要求甲公司将这笔资金用于技术改造，成果归甲公司所有D.中标国家高效照明产品的招标项目，以中标协议供货价格减去财政补贴资金后的价格销售给终端用户，并按规定从财政取得相应的补贴资金\n\n（解析)选项A，甲公司搬迁至郊外，原厂址移交给政府收储，政府支付土地补偿金，双方的交易是互惠性交易，不属于政府补助；选项B，出口退税是政府退回企业事先垫付的进项税，不属于政府补助；选项D，政府补贴的资金，与甲公司的经营活动密切相关，且来源于政府的经济资源是商品的对价的组成部分，不属于政府补助，适用收入准则。\n\n（解题攻略） 政府补助是来源于政府的资源且是无偿的。\n\n【真题5·单选题】企业发生的下列各项交易或事项应作为政府补助进行会计处理的是（ ）。（2022年）A．取得即征即退的增值税款B.免交当期应交企业所得税的20%C.政府为享有企业所有者权益份额，以所有者身份向企业投入资金D.企业将其拥有的土地使用权交还给政府而按公允价值取得的补偿款\n\n（解析）免交20%的企业所得税并未发生资产的直接转移，不应作为政府补助进行会计处理，选项B不正确；政府为享有企业所有者权益份额，以所有者身份向企业投入资金，属于互惠交易，不具有无偿性，不应作为政府补助进行会计处理，选项C不正确；企业将其拥有的土地使用权交还给政府而按公允价值取得的补偿款，属于互惠交易，不具有无偿性，不应作为政府补助进行会计处理，选项D不正确。\n\n【例题6·多选题】甲公司生产、销售符合国家规定标准的环保设备及拆解废弃电器电\n子产品。2×25年度，甲公司发生的有关交易或事项如下：（1）3月1日，境内销售100套环\n保设备，每套按国家定价的销售价格为150万元，销售成本为180万元。国家规定，企业境\n内销售符合国家标准的环保设备，除销售价格低于成本的差额由国家财政给予补贴外，另给\n予每套环保设备10万元的补偿。3月10日，收到政府对所销售环保设备销售价格的补贴款\n3000万元，以及1000万元的补偿款。甲公司销往境外的环保设备的销售毛利率为6%左右。\n（2）12月1日，收到增值税出口退税款350万元。（3）12月10日，收到符合国家政策规定\n条件的回收处理企业拆解废弃电器电子产品获得的政府补贴款项100万元。甲公司对政府补助\n采用总额法进行会计处理。不考虑其他因素，下列各项关于甲公司2×25年度会计处理的表述\n中，正确的有（ ）。A.收到拆解废弃电器电子产品获得的政府补贴款项100万元确认为政府补助计入其他收益B.收到政府3000万元补贴款确认为销售环保设备的收入C．收到政府1000万元补偿款确认为销售环保设备的收入D.收到出口退税款350万元确认为政府补助计入其他收益\n\n（解析甲公司拆解废弃电器电子产品获得的政府补贴款项，实质上为甲公司向政府提供废弃电器电子产品拆解服务而收取的对价，不具有无偿性，不属于政府补助，在满足收入确认条件时将其确认为收入，选项A错误；甲公司销往境外的环保设备的销售毛利率为6%左右，境内销售因国家定价使售价低于成本，因此自政府处取得的3000万元补贴款及1000万元补偿款均属于企业销售商品对价的组成部分，选项B和C正确；收到的出口退税款实际上是政府退回甲公司事先垫付的进项税，所以不属于政府补助，选项D错误。\n\n## （一）与资产相关的政府补助\n\n与资产相关的政府补助，是指企业取得的、用于购建或以其他方式形成长期资产的政府补助。\n\n## 点拨\n\n只有形成长期资产的政府补助才属于与资产相关的政府补助，与存货相关的政府补助属于与收益相关的政府补助。\n\n## （二）与收益相关的政府补助\n\n与收益相关的政府补助，是指除与资产相关的政府补助之外的政府补助。\n\n通常在满足政府补助所附条件时计入当期损益或冲减相关成本费用。\n\n【例题7·单选题】甲公司租赁某物业，租赁期为5年，每3个月支付一次租金。为支持\n甲公司经营发展，当地政府为甲公司提供租金扶持补贴，甲公司在每3个月支付租金后向政府\n提交租金支付凭证等申请文件，政府审核通过后发放3个月的租金扶持补贴。关于甲公司收到\n的上述租金扶持补贴，下列会计处理中正确的是（）。A．应当作为与资产相关的政府补助 B.应当作为与收益相关的政府补助C.应按《收人》准则进行会计处理 D.应按《租赁》准则进行会计处理\n\n（解析）通常情况下，与资产相关的政府补助文件会要求企业将补助资金用于取得固定资产或无形资产等长期资产。本题中的甲公司收到的政府补助在性质上为政府对企业所付物业租金的补贴，弥补的是企业相关期间的租赁成本费用，不符合与资产相关的政府补助的定义，因此属于与收益相关的政府补助，选项B正确。"},{"title":"第二节 政府补助的会计处理","content":"## 一、会计处理方法\n\n考点难度●●○\n\n## （一）政府补助的确认\n\n政府补助同时满足下列条件的，才能予以确认：\n\n（1）企业能够满足政府补助所附条件；\n\n例（真）题-答案」7.B\n\n## （2）企业能够收到政府补助。\n\n判断企业能够收到政府补助，应关注\"确凿证据\"，例如，关注政府补助的发放主体是否具备相应的权力和资质，申请政府补助的流程是否合法合规，同类型政府补助过往实际发放情况，补助文件中索引的政策依据是否适用，是否已经履行完毕补助文件中的要求，实际收取资金前是否需要政府部门的实质性审核，补助文件是否有明确的支付时间，政府是否具备履行支付义务的能力等因素。\n\n## （二）政府补助的计量\n\n<table><tr><td rowspan=1 colspan=1>类别</td><td rowspan=1 colspan=2>计量原则</td></tr><tr><td rowspan=2 colspan=1>政府补助为货币性资产</td><td rowspan=1 colspan=1>企业已经实际收到补助资金</td><td rowspan=1 colspan=1>应当按照实际收到的金额计量</td></tr><tr><td rowspan=1 colspan=1>资产负债表日企业尚未收到补助资金，但企业在符合了相关政策规定后获得了收款权，且与之相关的经济利益很可能流入企业</td><td rowspan=1 colspan=1>企业应当在这项补助成为应收款时按照应收的金额计量</td></tr><tr><td rowspan=1 colspan=1>政府补助为非货币性资产</td><td rowspan=1 colspan=2>应当按照公允价值计量；公允价值不能可靠取得的，按照名义金额（1元）计量</td></tr></table>\n\n## （三）政府补助的会计处理方法\n\n政府补助有两种会计处理方法：总额法和净额法。\n\n\n\n1．总额法，在确认政府补助时将政府补助全额确认为收益，而不是作为相关资产账面价值或者费用的扣减。\n\n2.净额法，将政府补助作为相关资产账面价值或所补偿费用的扣减。\n\n## 提示\n\n（1）企业应当根据经济业务的实质，判断某一类政府补助业务应当采用总额法还是净额法，通常情况下，对同类或类似政府补助业务只能选用一种方法（并非企业只能采用一种方法核算所有政府补助)，同时，企业对该业务应当一贯地运用该方法，不得随意变更。\n\n## 点拨\n\n同一企业不同时期发生的相同或者相似的交易或者事项，应当采用一致的会计政策，不得随意变更。\n\n（2）与企业日常活动相关的政府补助，应当按照经济业务实质，计入其他收益或冲减相关成本费用。\n\n## 点拨\n\n通常情况下，若政府补助补偿的成本费用是营业利润之中的项目，或该补助与日常销售等经营行为密切相关，则认为该政府补助与日常活动相关。\n\n（3）与企业日常活动无关的政府补助，计入营业外收入或冲减相关损失。\n\n## 二、与资产相关的政府补助\n\n考点难度●●○中\n\n## （一）总额法5年热点丨4次\n\n取得时：\n\n借：银行存款（或××资产）\n\n贷：递延收益\n\n摊销时：\n\n借：递延收益\n\n贷：其他收益（或营业外收人）\n\n## 提示\n\n（1）如果企业先收到资金再购建，则应在开始对相关资产计提折旧或摊销时开始将递延收益分期计入损益。\n\n（2）如果企业先购建再收到资金，则应在相关资产剩余使用寿命内按合理、系统的方法将递延收益分期计入损益。\n\n（3）采用总额法的，如果对应的长期资产在持有期间发生减值损失，递延收益的摊销仍保持不变，不受减值因素的影响。\n\n（4）相关资产在使用寿命结束时或结束前被处置（出售、报废、转让、发生毁损等）,尚未分摊的相关递延收益余额应当一次性转入资产处置当期的损益，不再予以递延。\n\n（5）对相关资产划分为持有待售类别的，先将尚未分摊的递延收益余额冲减相关资产的账面价值，再按照《企业会计准则第42号—持有待售的非流动资产、处置组和终止经营》的要求进行会计处理。\n\n【真题8·单选题】2×16年6月20日，甲公司购置的大型科研设备达到预定可使用状态，\n实际发生成本900万元，其中300万元以自有资金支付，另外600万元获得政府高新技术研\n发基金资助。取得该科研设备时，甲公司按其实际成本人账，并将获得的政府补助按总额法进\n行核算。该设备采用年限平均法计提折旧，预计使用10年，预计净残值为零。2×21年12月\n31日，甲公司出售该设备，取得价款500万元。不考虑相关税费及其他因素，甲公司2×21\n年度处置该设备对当期损益的影响金额是（）。（2022年）A.95万元 B.200万元 C.270万元 D.365万元\n\n解析 甲公司2×21年度处置该设备对当期损益的影响金额=出售价款500-固定资产账面价值（900-900÷10×5.5）+结转递延收益（600-600÷10×5.5）=365（万元）。\n\n【真题9·单选题】2×20年，甲公司发生的有关交易或事项如下：（1）2月1日，甲公司\n所在地政府与其签订的合同约定，甲公司为当地政府开发一套交通管理系统，合同价格500万\n元。该交通管理系统已于2×20年12月20日经当地政府验收并投入使用，合同价款已收存甲\n公司银行；（2）经税务部门认定，免征甲公司2×20年度企业所得税150万元；（3）甲公司开\n发的高新技术设备于2×20年9月30日达到预定可使用状态并投人使用，该设备预计使用10\n年，预计净残值为零，采用年限平均法计提折旧，为鼓励甲公司开发高新技术设备，当地政\n府于2×20年7月1日给予甲公司补助100万元；（4）收到税务部门退回的增值税额80万元。\n甲公司对政府补助采用总额法进行会计处理。不考虑相关税费及其他因素，下列各项关于甲公\n司2×20年度对上述交易或事项会计处理的表述中，正确的是（ ）。（2021年）A.退回的增值税额作为政府补助确认为其他收益B.为当地政府开发的交通管理系统取得的价款作为政府补助确认为其他收益C．当地政府给予的开发高新技术设备补助款作为政府补助于2×20年确认5万元的其他收益D.免征企业所得税作为政府补助确认为其他收益\n\n解析选项B，甲公司为当地政府开发交通管理系统取得的价款与公司销售商品活动密切相关，应当按照收入准则处理，确认为收入；选项C，甲公司收到开发高新技术设备补助款属于与资产相关的政府补助，2×20年该项政府补助款应确认其他收益=100/10×3/12=2.5（万元）；选项D，免征企业所得税不属于政府补助。\n\n【例题10·多选题】2×25年4月1日，甲公司收到当地政府无偿提供的一块土地使用权\n（非划拨土地使用权），并完成了相关手续。该土地使用权的公允价值为10000万元，预计使用\n寿命为50年，采用直线法摊销，预计净残值为零。甲公司为在该土地上建造办公楼而支付土\n地整理费用500万元。甲公司采用总额法对该政府补助进行会计处理。不考虑其他因素，下列\n各项关于甲公司2×25年度会计处理的表述中，正确的有（ ）。A.收到土地使用权时确认递延收益10000万元B.为整理土地支付的500万元确认为管理费用C.确认其他收益200万元D.计提土地使用权摊销金额150万元（解析甲公司取得土地使用权时确认无形资产和递延收益10000万元，选项A正\n确；支付的土地整理费用计入在建工程，选项B不正确；2×25年度应确认的其他收益=\n10000/50×9/12=150（万元），选项C不正确；2×25年度应计提土地使用权摊销金额=\n10000/50×9/12=150（万元），选项D正确。相关的会计分录如下：借：无形资产 10000贷：递延收益 10000借：在建工程 500贷：银行存款 500借：递延收益 150贷：其他收益 150\n\n例（真）题-答案」9.A\n\n借：在建工程/管理费用\n\n150\n\n贷：累计摊销\n\n150\n\n（解题攻略政府补助为非货币性资产的，应当按照公允价值计量；公允价值不能可靠取得的，按照名义金额（1元）计量。\n\n【例题11·多选题】2×25年，甲公司发生的有关交易或事项如下：（1）按发电量及定额\n补助标准计算的光伏发电业务应收政府可再生能源发电补助款1000万元。（2）甲公司作为牵\n头人联合乙公司共同申请科技部一项课题研究，课题研发成果归甲公司和乙公司共享，2×25\n年5月1日，甲公司收到课题经费总计800万元，政府拨款文件中明确其中600万元补助甲公\n司，200万元补助乙公司。（3）甲公司收到即征即退增值税款项400万元。（4）2×25年8月\n1日，一台设备发生毁损，与该设备相关的政府补助确认的递延收益余额为10万元（无须退\n回）。甲公司对政府补助采用总额法进行会计处理。不考虑相关税费及其他因素，下列各项关\n于甲公司2×25年度会计处理的表述中，正确的有（ ）。A.应收可再生能源发电补助确认为收入B.收到即征即退增值税款项作为政府补助确认为其他收益C.收到的课题经费800万元作为政府补助确认为其他收益D.与毁损设备相关的递延收益余额10万元确认为其他收益\n\n解析甲公司联合乙公司共同进行的课题研究收到的政府补助经费，因为政府补助文件中明确其中600万元用于补助甲公司，200万元用于补助乙公司，所以甲公司应将收到的600万元政府补助确认为递延收益或其他收益，选项C错误；设备损毁时，与设备相关的政府补助确认的递延收益余额在总额法下应确认为营业外收入，选项D错误。\n\n（二）净额法\n\n将政府补助冲减相关资产账面价值。\n\n按照补助资金的金额冲减相关资产账面价值，如果企业先取得与资产相关的政府补助，再确认所购建的长期资产的，净额法下应当将取得的政府补助先确认为递延收益，在相关资产达到预定可使用状态或预定用途时将递延收益冲减相关资产的账面价值，按照扣减了政府补助后的账面价值和相关资产的剩余使用寿命计提折旧或进行摊销。\n\n实务中存在政府无偿给予企业长期非货币性资产的情况，如无偿给予的土地使用权和天然起源的天然林等。企业取得的政府补助为非货币性资产的，应当按照公允价值计量，公允价值不能可靠取得的，按照名义金额（1元）计量。企业在收到非货币性资产时，应当按公允价值借记有关资产科目，贷记\"递延收益\"科目，在相关资产使用寿命内按合理、系统的方法分期计入损益，借记\"递延收益\"科目，贷记\"其他收益\"等科目。对以名义金额（1元）计量的政府补助，在取得时计入当期损益。\n\n## 三、与收益相关的政府补助5年热点丨2次\n\n通常在满足政府补助所附条件时计入当期损益或冲减相关成本费用。\n\n<table><tr><td rowspan=1 colspan=2>类型</td><td rowspan=1 colspan=1>总额法</td><td rowspan=1 colspan=1>净额法</td></tr><tr><td rowspan=2 colspan=1>补偿以后期间的成本费用或损失</td><td rowspan=1 colspan=1>收到补助资金时</td><td rowspan=1 colspan=1>借：银行存款等贷：递延收益</td><td rowspan=1 colspan=1>借：银行存款等贷：递延收益</td></tr><tr><td rowspan=1 colspan=1>成本费用或损失发生时</td><td rowspan=1 colspan=1>借：递延收益贷：其他收益（与日常活动相关）营业外收入（与日常活动无关）</td><td rowspan=1 colspan=1>借：递延收益贷：生产成本、管理费用、营业外支出等</td></tr><tr><td rowspan=1 colspan=2>补偿已发生的成本费用或损失</td><td rowspan=1 colspan=1>借：银行存款等贷：其他收益（与日常活动相关）营业外收入（与日常活动无关）</td><td rowspan=1 colspan=1>借：银行存款等贷：生产成本、管理费用、营业外支出等</td></tr></table>\n\n## 点拨\n\n（1）总额法计入其他收益或营业外收入；\n\n（2）净额法冲减管理费用、营业外支出等。\n\n【例题12·单选题】甲公司为从事集成电器设计和生产的高新技术企业，适用增值税即\n征即退政策。2×25年3月31日，甲公司收到政府即征即退的增值税额300万元。2×25年\n4月12日，甲公司收到当地财政部门为支持其购买实验设备拨付的款项120万元，2×25年9\n月26日，甲公司购买不需要安装的实验设备一台并投入使用，实际成本为240万元，资金来\n源为财政拨款及其借款，该设备采用年限平均法计提折旧，预计使用10年，预计净残值为零，\n甲公司采用总额法核算政府补助。不考虑其他因素，甲公司2×25年度因政府补助应确认的收\n益是（）万元。A.303 B.300 C. 420 D.309\n\n解析 甲公司2×25年度因政府补助应确认的收益=300+120/10×3/12=303（万元）。\n\n解题攻略与资产相关的政府补助采用总额法核算的，如果企业先收到资金再购建相关资产，则应在开始对相关资产计提折旧或摊销时开始将递延收益分期计入损益。\n\n## 四、政府补助的退回\n\n考点难度●○○易\n\n应当分别下列情况进行会计处理：（1）初始确认时冲减相关资产账面价值的，调整资产账面价值；（2）存在相关递延收益的，冲减相关递延收益账面余额，超出部分计人当期损益；（3）属于其他情况的，直接计入当期损益。\n\n对于属于前期差错的政府补助退回，应当按照前期差错更正进行追溯调整。\n\n【例题13·单选题】2×23年12月31日，甲公司购入一台不需安装的环保设备，实际成\n本为960万元，预计使用8年，采用年限平均法计提折旧，预计净残值为零。甲公司于2×24\n年1月向政府有关部门提交了购置环保设备的补助申请，该补助要求甲公司后续生产过程中排\n放的工业废水符合相关环保法规的要求。2×24年6月30日，甲公司收到了政府有关部门拨\n付的补贴款480万元且预计能够符合补助所附条件。2×25年1月1日，甲公司因管理不善导\n致不再符合补助所附条件，政府有关部门要求甲公司退回补助款；当日，甲公司退回了补助款\n480万元。甲公司对该政府补助采用总额法核算，不考虑相关税费及其他因素，甲公司因退回\n补助款而对2×25年度损益的影响金额是（ ）万元。A. 448 B.450 C.30 D.32\n\n解析至2×25年1月1日，尚未摊销的递延收益 $= 4 8 0 - 4 8 0 \\div 7 . 5 \\times 6 / 1 2 = 4 4 8 ( \\textcircled { \\scriptsize { \\cdot } } \\textcircled { \\scriptsize { \\cdot } } )$ ，退回补助款先冲减递延收益，差额部分计入当期损益，甲公司因退回补助款而对2×25年度损益的影响金额=480-448=32（万元），选项D正确。\n\n【例题14·多选题】下列各项关于已确认的政府补助需要退回的会计处理的表述中，正确的有（ ）。A.初始确认时冲减资产账面价值的，调整资产账面价值B.初始确认时计入其他收益或营业外收入的，直接计人当期损益C.初始确认时冲减相关成本费用或营业外支出的，直接计入当期损益D.初始确认时确认为递延收益的，冲减相关递延收益账面余额，超出部分计入当期损益\n\n解析政府补助需要退回的，应当在需要退回的当期分情况按照以下规定进行会计处理：（1）初始确认时冲减相关资产账面价值的，调整资产账面价值；（2）存在相关递延收益的，冲减相关递延收益账面余额，超出部分计入当期损益；（3）属于其他情况的，直接计入当期损益。\n\n## 五、特定业务的会计处理\n\n考点难度●●难\n\n## （一）综合性项目政府补助\n\n综合性项目政府补助同时包含与资产相关的政府补助和与收益相关的政府补助，企业应当采取合理的方法将其进行分解并分别进行会计处理；确实难以区分的，企业应当将其整体归类为与收益相关的政府补助进行处理。\n\n## （二）政策性优惠贷款贴息\n\n1.财政将贴息资金拨付给贷款银行\n\n企业可以选择下列方法之一进行会计处理：\n\n（1）以实际收到的金额作为借款的人账价值，按照借款本金和该政策性优惠利率计算借款费用。通常情况下，实际收到的金额即为借款本金。\n\n（2）以借款的公允价值作为借款的人账价值并按照实际利率法计算借款费用，实际收到的金额与借款公允价值之间的差额确认为递延收益。递延收益在借款存续期内采用实际利率法摊销，冲减相关借款费用。\n\n企业选择了上述两种方法之一后，应当一致地运用，不得随意变更。\n\n2.财政将贴息资金直接拨付给受益企业\n\n财政将贴息资金直接拨付给受益企业，企业先按照同类贷款市场利率向银行支付利息，财政部门定期与企业结算贴息。在这种方式下，由于企业先按照同类贷款市场利率向银行支付利息，所以实际收到的借款金额通常就是借款的公允价值，企业应当将对应的贴息冲减相关借款费用。\n\n点拨 财政将贴息资金直接拨付给受益企业，会计处理采用的是净额法。\n\n【例题15·多选题】下列各项关于企业取得的政府补助会计处理的表述中，错误的有( ）。A.财政直接拨付给受益企业的贴息资金采用总额法进行会计处理B.同时使用总额法和净额法对不同类别的政府补助进行会计处理C．同时包含与资产相关部分和与收益相关部分的政府补助难以区分时，全部作为与资产相关的政府补助进行会计处理D.总额法下在相关资产处置时尚未分摊的与资产相关的政府补助继续按期摊销计人各期损益\n\n（解析）财政将贴息资金直接拨付给受益企业，在这种方式下，由于企业先按照同类贷款市场利率向银行支付利息，所以实际收到的借款金额通常就是借款的公允价值，企业应当将对应的贴息冲减相关借款费用，因此属于采用净额法进行会计处理，选项A错误；\n\n企业应当根据经济业务的实质，判断某一类政府补助业务应当采用总额法还是净额法，通常情况下，对同类或类似政府补助业务只能选用一种方法，不同类别的政府补助可以分别采用总额法和净额法进行会计处理，选项B正确；\n\n综合性项目政府补助同时包含与资产相关的政府补助和与收益相关的政府补助，企业应当采取合理的方法将其进行分解并分别进行会计处理，确实难以区分的，企业应当将其整体归类为与收益相关的政府补助进行会计处理，选项C错误；\n\n相关资产在使用寿命结束时或结束前被处置（出售、转让、报废等），尚未分摊的递延收益余额应当一次性转入资产处置当期的损益，不再予以递延，选项D错误。"},{"title":"第三节 政府补助的列报","content":"## 一、政府补助在财务报表上的列示\n\n考点难度●〇○易\n\n计人递延收益的政府补助在资产负债表作为非流动负债，在\"递延收益\"项目中单独列示。\n\n企业应当在利润表中的\"营业利润\"项目之上单独列报\"其他收益\"项目，计人其他收益的政府补助在该项目中反映，冲减相关成本费用的政府补助，在相关成本费用项目中反映，与企业日常经营活动无关的政府补助，在利润表的营业外收支项目中列报。\n\n## 二、政府补助的附注披露\n\n考点难度●○○易\n\n企业应当在附注中单独披露与政府补助有关的下列信息：①政府补助的种类、金额和列报项目；②计人当期损益的政府补助金额；③本期退回的政府补助金额及原因。"}],"quizGroups":[{"type":"单项选择题","questions":[{"num":1,"text":"甲公司为新能源汽车生产商，2×25年度发生的有关交易或事项如下：（1）收到失业保险稳岗返还款300万元；（2）为研发新能源汽车发生研发费用500万元，税法允许税前抵扣1000万元；（3）按规定直接定额减免企业所得税200万元；（4）因以低于成本的价格销售新能源汽车从政府取得补贴1亿元。不考虑其他因素，甲公司应作为政府补助进行会计处理的是（","options":[{"letter":"B","text":"收到政府给予的销售新能源汽车补贴1亿元"},{"letter":"C","text":"直接定额减免企业所得税200万元"},{"letter":"D","text":"研发新能源汽车发生的研发费用可予税前抵扣1000万元"}],"answer":"A","explanation":"选项B，收到政府给予的销售新能源汽车补贴1亿元应按照收人准则进行处理；选项C，直接定额减免企业所得税200万元，不涉及资产直接转移的经济资源，不属于政府补助；选项D，研发新能源汽车发生的研发费用可予税前抵扣1000万元属于增加计税抵扣额，不属于政府补助。"},{"num":2,"text":"甲公司为增值税一般纳税人，采用总额法对政府补助进行会计处理。2×25年发生的有关交易或事项如下：（1）收到税务部门先征后返的房产税120万元；（2）甲公司当年为政府开发的信息系统经政府验收并投入使用，取得政府支付款项600万元；（3）2×25年5月20日，收到政府拨付的高新技术设备购置补贴款1200万元，该高新技术设备于2×25年6月30日达到预定可使用状态并投人使用，预计使用10年，预计净残值为零，采用年限平均法计提折旧；（4）收到税务部门留抵退税款420万元。不考虑其他因素，甲公司2×25年度应计入其他收益的政府补助金额是（）万元。","options":[{"letter":"A","text":"720"},{"letter":"B","text":"180"},{"letter":"C","text":"600"},{"letter":"D","text":"780"}],"answer":"B","explanation":"取得政府支付的信息系统开发款项600万元应按收入准则确认收人，不属于政府补助。收到税务部门留抵退税款420万元，是企业支付增值税进项税额的退回，不属于政府补助，甲公司2×25年度应计入其他收益的政府补助金额 $= 1 2 0 + 1 2 0 0 \\div 1 0 \\times 6 / 1 2 = 1 8 0$ （万元），选项B正确。"},{"num":3,"text":"2×25年12月，甲公司与其所在地工业园管委会签订协议，实施异地搬迁扩建。甲公司将在该工业园建设新的厂房。协议约定：（1）甲公司将以250元／平方米的单价取得20万平方米土地使用权，土地出让金总金额5000万元；（2）甲公司交纳全部土地出让金后5个工作日内，管委会以\"进园企业科技创新扶持资金\"的形式向甲公司支付5000万元扶持资金。在与管委会进行进园谈判时，甲公司提出了科技创新扶持资金的申请，但对方表示当地经济落后、政府财政资金少等困难，商定引人成功时再提供。因此，考虑到在甲公司交纳土地出让金之后，对方就有财政收人，故约定第一笔科技创新扶持资金应当在对方收到土地出让金之后拨付。对于甲公司收到的5000万元扶持资金，下列会计处理中正确的是（）。","options":[{"letter":"A","text":"应冲减土地使用权成本"},{"letter":"B","text":"应作为与资产相关的政府补助"},{"letter":"C","text":"应作为与收益相关的政府补助"},{"letter":"D","text":"应确认为当期营业收入"}],"answer":"C","explanation":"该资金并不是针对土地出让金进行的补偿，而是为鼓励甲公司进园后进行科技创新，应作为与收益相关的政府补助处理，为补偿以后期间发生的支出，应在取得时计人递延收益，选项C正确。"},{"num":4,"text":"2×25年4月5日，政府拨付A企业1200万元财政拨款（同日到账），要求用于购买1台某科研项目所需大型科研设备，该项目至2×25年年末仍处于研究阶段。2×25年6月10日，A企业购入大型设备（假设不需安装）并于当月投入使用，实际成本为1260万元，其中60万元以自有资金支付，预计使用寿命为10年，预计净残值为0，采用年限平均法计提折旧。假定不考虑其他因素，A企业采用总额法核算政府补助。上述业务影响A企业2×25年度利润总额的金额是（）万元。","options":[{"letter":"A","text":"-3"},{"letter":"B","text":"27"},{"letter":"C","text":"-63"},{"letter":"D","text":"60"}],"answer":"A","explanation":"2×25年该设备计提折旧计人管理费用的金额=1260/10/12×6=63（万元），递延收益摊销计人其他收益的金额 $= 1 2 0 0 / 1 0 / 1 2 \\times 6 { = } 6 0$ （万元），上述业务影响A企业2×25年度利润总额的金额=60-63=-3（万元）。"},{"num":5,"text":"甲公司为从事集成电器设计和生产的高新技术企业。适用增值税即征即退政策。2×25年3月10日，甲公司收到政府即征即退的增值税税额200万元。2×25年3月15日，甲公司收到当地财政部门为支持其购买实验设备拨付的款项120万元，2×25年6月28日，甲公司购买不需要安装的实验设备一台并投人使用，实际成本为360万元，资金来源为财政拨款及其自有资金，该设备采用年限平均法计提折旧，预计使用10年，预计净残值为零，甲公司采用净额法核算政府补助。不考虑其他因素，甲公司2×25年度因政府补助应确认的收益是（）万元。","options":[{"letter":"A","text":"206"},{"letter":"B","text":"218"},{"letter":"C","text":"200"},{"letter":"D","text":"209"}],"answer":"C","explanation":"净额法下，与资产相关的政府补助冲减资产的账面价值，不确认收益。甲公司$2 \\times 2 5$ 年度因政府补助应确认的收益为即征即退的增值税税额200万元，选项C正确。"},{"num":6,"text":"关于企业取得针对综合性项目的政府补助，下列说法中正确的是（ ）。","options":[{"letter":"A","text":"需将其分解为与资产相关的部分和与收益相关的部分，分别进行处理"},{"letter":"B","text":"无须分解而将其全部作为与收益相关的政府补助处理"},{"letter":"C","text":"无须分解而将其全部作为与资产相关的政府补助处理"},{"letter":"D","text":"难以区分为与资产相关部分和与收益相关部分的，将政府补助整体归类为与资产相关的政府补助进行会计处理"}],"answer":"A","explanation":"企业取得针对综合性项目的政府补助，需将其分解为与资产相关部分和与收益相关部分，分别进行处理，选项A正确，选项B和C错误；难以区分为与资产相关部分和与收益相关部分的，应当将政府补助整体归类为与收益相关的政府补助进行会计处理，选项D错误。"},{"num":7,"text":"已确认的政府补助需要退回的，下列会计处理中正确的是（ ）。","options":[{"letter":"A","text":"存在相关递延收益的，冲减相关递延收益账面余额，超出部分计人资本公积"},{"letter":"B","text":"存在相关递延收益的，冲减相关递延收益账面余额，超出部分计人当期损益"},{"letter":"C","text":"不存在相关递延收益的，直接冲减期初留存收益"},{"letter":"D","text":"总额法下调整相关资产账面价值"}],"answer":"B","explanation":"已确认的政府补助需要退回的，应当分别下列情况处理：①初始确认时冲减相关资产账面价值的，应当调整资产账面价值；②存在尚未摊销的递延收益的，冲减相关递延收益账面余额，超出部分计入当期损益；③属于其他情况的，直接计入当期损益。"}]},{"type":"多项选择题","questions":[{"num":1,"text":"关于政府补助的会计处理，下列表述中正确的有（ ）。","options":[{"letter":"A","text":"通常情况下，企业对同类或类似政府补助业务只能选用一种方法"},{"letter":"B","text":"企业应当以自身的性质判断政府补助应当采用总额法还是净额法"},{"letter":"C","text":"总额法下，企业先收到补助资金，再购建长期资产，则应当在开始对相关资产计提折旧或摊销时将递延收益分期计入损益"},{"letter":"D","text":"总额法下，企业先开始购建长期资产，再收到补助资金，则应当在相关资产的剩余使用寿命内按照合理、系统的方法将递延收益分期计人损益"}],"answer":"ACD","explanation":"企业应当根据经济业务的实质，判断某一类政府补助业务应当采用总额法还是净额法，选项B错误。"},{"num":2,"text":"甲公司2×25年自财政部门取得以下款项：（1）2月20日，收到以前年度已完成重点科研项目的经费补贴120万元；（2）6月20日，取得国家对公司进行扶改项目的支持资金1500万元，用于购置需要安装的固定资产，相关资产于当年12月28日达到预定可使用状态，预计使用年限为20年，采用年限平均法计提折旧，预计净残值为0；（3）10月2日，收到战略性新兴产业研究补贴2000万元，该项目至2×25年12月31日已发生研究支出800万元，预计项目结项前仍将发生研究支出1200万元。假定甲公司采用总额法核算政府补助。不考虑其他因素，下列关于甲公司2×25年对政府补助会计处理的表述中，正确的有(）。","options":[{"letter":"A","text":"当期应计入损益的政府补助是920万元"},{"letter":"B","text":"当期取得与收益相关的政府补助是2120万元"},{"letter":"C","text":"当期取得与资产相关的政府补助是1500万元"},{"letter":"D","text":"当期应计人资本公积的政府补助是2000万元"}],"answer":"ABC","explanation":"当期应计入损益的政府补助=120+2000×800/（800+1200）=920（万元），选项A正确；当期取得与收益相关的政府补助=120+2000=2120（万元），选项B正确；当期取得与资产相关的政府补助为1500万元，选项C正确；政府补助不计人资本公积，选项D错误。"},{"num":3,"text":"2×25年度，甲公司作为政府推广使用的W产品的中标企业，以800万元的中标价格将一批生产成本为700万元的W产品出售给客户，该批W产品的市场价格为950万元。销售当日，该批W产品控制权已转移给客户，满足收人确认条件。当年，甲公司收到销售该批W产品的财政补贴150万元并存人银行。不考虑其他因素，上述经济业务对甲公司2×25年度利润表项目影响的表述中，正确的有（ ）。","options":[{"letter":"A","text":"增加营业利润250万元"},{"letter":"B","text":"增加营业收人800万元"},{"letter":"C","text":"增加营业外收入150万元"},{"letter":"D","text":"增加营业成本700万元"}],"answer":"AD","explanation":"甲公司收到的财政补贴与销售W产品密切相关，且来源于政府的经济资源是甲公司销售产品对价的组成部分，甲公司应当按照收人准则的规定对收到的财政补贴进行处理，所以甲公司2×25年度应确认营业收人950万元（800+150），结转营业成本700万元，增加营业利润250万元（950-700），选项A和D正确。"},{"num":4,"text":"甲公司对政府补助采用总额法进行会计处理，甲公司2×25年5月收到下列各项政府补助款中，应在收到时确认为当期损益的有（ ）。","options":[{"letter":"A","text":"上月用电补助款21万元"},{"letter":"B","text":"新型实验设备购置补助款50万元"},{"letter":"C","text":"失业保险稳岗返还款31万元"},{"letter":"D","text":"企业超比例安排残疾人就业或者为安排残疾人就业做出显著成绩，按规定收到的奖励80万元"}],"answer":"ACD","explanation":"选项B，企业对政府补助采用总额法进行会计处理，在收到与资产相关的政府补助时，应将收到的政府补助确认为递延收益，然后在资产的剩余使用寿命内按照合理、系统的方法分期计人损益。"}]},{"type":"计算分析题","questions":[]}]},{"chTitle":"第十九章 所得税","header":"## 第十九章 所得税\n\n考情速览\n\n<table><tr><td colspan=\"3\"></td></tr><tr><td>复习难度 ★☆★</td><td>常考题型 客观题+主观题</td><td>近5年考试平均分值 4分左右</td></tr><tr><td>学习指南</td><td>本章考题主要以主观题为主，经常与固定资产、无形资产、投资性房地产、 股份支付、金融资产、租赁和收入等章节结合出题，属于重要章节。</td><td></td></tr></table>\n\n## 教材主要变化\n\n在“与直接计人所有者权益的交易或事项相关的所得税”部分增加一道例题。\n\n## 考点框架\n\n<table><tr><td colspan=\"3\" rowspan=\"1\">所得税</td></tr><tr><td colspan=\"1\" rowspan=\"3\">所得税会计的基本原理</td><td colspan=\"1\" rowspan=\"1\">资产负债表债务法</td><td colspan=\"1\" rowspan=\"1\">●中</td></tr><tr><td colspan=\"1\" rowspan=\"1\">适用范围</td><td colspan=\"1\" rowspan=\"1\">●00易</td></tr><tr><td colspan=\"1\" rowspan=\"1\">所得税会计的一般程序</td><td colspan=\"1\" rowspan=\"1\">●00易</td></tr><tr><td colspan=\"1\" rowspan=\"3\">资产、负债的计税基础</td><td colspan=\"1\" rowspan=\"1\">资产的计税基础</td><td colspan=\"1\" rowspan=\"1\">中</td></tr><tr><td colspan=\"1\" rowspan=\"1\">负债的计税基础</td><td colspan=\"1\" rowspan=\"1\">难</td></tr><tr><td colspan=\"1\" rowspan=\"1\">特殊交易或事项中产生资产、负债计税基础的确定</td><td colspan=\"1\" rowspan=\"1\">难</td></tr><tr><td colspan=\"1\" rowspan=\"3\">暂时性差异</td><td colspan=\"1\" rowspan=\"1\">应纳税暂时性差异</td><td colspan=\"1\" rowspan=\"1\">●0o易</td></tr><tr><td colspan=\"1\" rowspan=\"1\">可抵扣暂时性差异</td><td colspan=\"1\" rowspan=\"1\">●0o易</td></tr><tr><td colspan=\"1\" rowspan=\"1\">特殊项目产生的暂时性差异</td><td colspan=\"1\" rowspan=\"1\">●中</td></tr><tr><td colspan=\"1\" rowspan=\"4\">递延所得税资产及负债的确认和计量</td><td colspan=\"1\" rowspan=\"1\">递延所得税负债的确认和计量</td><td colspan=\"1\" rowspan=\"1\">●中</td></tr><tr><td colspan=\"1\" rowspan=\"1\">递延所得税资产的确认和计量</td><td colspan=\"1\" rowspan=\"1\">●中</td></tr><tr><td colspan=\"1\" rowspan=\"1\">特殊交易或事项中涉及递延所得税的确认和计量</td><td colspan=\"1\" rowspan=\"1\">难</td></tr><tr><td colspan=\"1\" rowspan=\"1\">适用税率变化对已确认递延所得税资产和递延所得税负债的影响</td><td colspan=\"1\" rowspan=\"1\">●中</td></tr><tr><td colspan=\"1\" rowspan=\"3\">所得税费用的确认和计量</td><td colspan=\"1\" rowspan=\"1\">当期所得税</td><td colspan=\"1\" rowspan=\"1\">●中</td></tr><tr><td colspan=\"1\" rowspan=\"1\">递延所得税</td><td colspan=\"1\" rowspan=\"1\">难</td></tr><tr><td colspan=\"1\" rowspan=\"1\">所得税费用</td><td colspan=\"1\" rowspan=\"1\">●中</td></tr><tr><td colspan=\"1\" rowspan=\"2\">所得税的列报</td><td colspan=\"1\" rowspan=\"1\">列报的基本原则</td><td colspan=\"1\" rowspan=\"1\">●00易</td></tr><tr><td colspan=\"1\" rowspan=\"1\">所得税费用（收益）与会计利润关系的说明</td><td colspan=\"1\" rowspan=\"1\">难</td></tr></table>\n\n## 考点剖析\n\n本章内容是既可“独来独往”，又可“结伴而行”的高频考点，是“可塑性”较强的章节。学习本章时，需要您站在会计的角度计算账面价值的同时还要站在税法的角度计算计税基础，您可以先熟记常见业务的税会处理差异，再进一步领会税会处理的原理，即在现在所学的基础上，灵活地掌握本章内容。\n\n## 预备知识：应交所得税的计算\n\n应交所得税=应纳税所得额×所得税税率\n\n应纳税所得额=税前会计利润+纳税调整增加额-纳税调整减少额\n\n点拨 掌握由税前会计利润计算应纳税所得额是学好本章的关键。\n\n## （一）纳税调整增加额\n\n1.按会计准则规定核算时不作为收益计人财务报表，但在计算应纳税所得额时作为收益需要交纳所得税。\n\n甲公司2×25年税前会计利润为720万元，2×25年12月12日向A公司销售一批商品，开出的增值税专用发票上注明的销售价格为200万元，增值税税额为26万元，款项尚未收到；该批商品成本为120万元。甲公司在销售时已知A公司资金周转发生困难，但为了减少存货\n\n积压，同时也为了维持与A公司长期建立的商业关系，甲公司仍将商品发往A公司且办妥托收手续。\n\n甲公司适用的所得税税率为25%，不考虑其他纳税调整事项。\n\n$$\nJ _ { \\perp } ^ { \\perp } \\vec { \\chi } _ { \\perp } \\vec { J } \\vec { \\uparrow } \\vec { \\frac { \\ . } { \\ . } } \\vec { \\wp } _ { \\perp } ^ { \\ . } = \\left[ \\begin{array} { l } { 7 2 0 + \\left( \\ 2 0 0 - 1 2 0 \\right) } \\end{array} \\right] \\ \\times 2 5 \\% = 2 0 0 \\ ( \\ \\mathcal { F } \\vec { \\mathcal { \\pi } } \\ ) _ { \\circ }\n$$\n\n2.按会计准则规定核算时确认为费用或损失计人财务报表，但在计算应纳税所得额时不允许扣减。\n\n乙公司2×25年税前会计利润为780万元，2×25年12月31日计提存货跌价准备20万元。乙公司适用的所得税税率为25%，不考虑其他纳税调整事项。\n\n应交所得税=（780+20）×25%=200（万元）。\n\n## （二）纳税调整减少额\n\n1．按会计准则规定核算时作为收益计人财务报表，但在计算应纳税所得额时不确认为收益。\n\n丙公司2×25年税前会计利润为820万元，2×25年取得国债利息收人20万元。丙公司适用的所得税税率为25%，不考虑其他纳税调整事项。\n\n$$\n\\underline { { { \\sf M } } } \\vec { \\mathcal { L } } \\vec { \\mathcal { L } } \\vec { J } \\vec { \\mathsf { f } } \\vec { \\mathsf { f } } \\vec { \\mathsf { f } } \\vec { \\mathsf { G } } \\vec { \\mathcal { H } } \\mathsf { \\Sigma } = \\left( \\begin{array} { l } { 8 2 0 - 2 0 } \\end{array} \\right) \\mathrm { \\Omega } \\times 2 5 \\% = 2 0 0 \\mathrm { \\Omega } ( \\mathrm { \\overrightarrow { \\mathcal { H } } } \\overrightarrow { \\mathrm { \\mathcal { I } } } \\mathrm { \\Sigma } ) \\mathrm { \\Omega } _ { \\circ }\n$$\n\n2.按会计准则规定核算时不确认为费用或损失，但在计算应纳税所得额时允许扣减。\n\n丁公司2×25年税前会计利润为830万元，2×25年发生研究阶段支出30万元计人管理费用。税法规定，企业开展研发活动中实际发生的研发费用，未形成无形资产计人当期损益的，在按规定据实扣除的基础上，再按照实际发生额的100%在税前加计扣除。丁公司适用的所得税税率为25%，不考虑其他纳税调整事项。\n\n$$\n1 \\overrightarrow { \\Delta t } \\overrightarrow { \\Delta t } \\overrightarrow { b } \\overrightarrow { \\uparrow } \\overrightarrow { \\uparrow } \\overrightarrow { \\ddagger } \\overrightarrow { \\nrightarrow } / \\textnormal { = ( } 8 3 0 - 3 0 \\times 1 0 0 \\% ) \\times 2 5 \\% = 2 0 0 ( \\overrightarrow { \\mathcal { H } } \\overrightarrow { \\mathcal { K } } ) \\circ\n$$","sections":[{"title":"第一节 所得税会计的基本原理","content":"所得税会计采用资产负债表债务法核算所得税，资产负债表债务法是从资产负债表出发，通过比较资产负债表上列示的资产、负债按照会计准则规定确定的账面价值与按照税法规定确定的计税基础，对于两者之间的差异区分应纳税暂时性差异与可抵扣暂时性差异，确认相关的递延所得税负债与递延所得税资产，并在此基础上确定每一会计期间利润表中的所得税费用。\n\n## 一、资产负债表债务法\n\n考点难度●○ 中\n\n所得税准则规范的是资产负债表中递延所得税资产和递延所得税负债的确认和计量。减少.\n\n未来期间应交所得税的暂时性差异形成递延所得税资产，即未来期间由税前会计利润计算应纳税所得额时会纳税调整减少的暂时性差异应确认递延所得税资产；增加未来期间应交所得税的暂时性差异形成递延所得税负债，即未来期间由税前会计利润计算应纳税所得额时会纳税调整增加的暂时性差异应确认递延所得税负债。\n\n## 点拨\n\n未来期间由税前会计利润计算应纳税所得额时，调增、调减的原理与当年调增、调减的原理相同。如固定资产计提折旧（折旧计入当期损益)：\n\n（1）当年会计折旧100万元，税法折旧80万元，当年应纳税调增20万元；\n\n（2）若未来期间会计折旧100万元，税法折旧80万元，未来期间应纳税调增20万元。\n\n## 举例\n\n（1）某企业适用的所得税税率为25%，2×25年12月1日取得一批存货，成本为100万元。2×25年12月31日，计提存货跌价准备20万元。税法规定，企业计提的资产减值损失在发生实质性损失时允许税前扣除。2×26年该企业将上述存货全部对外销售，2×26年由税前会计利润计算应纳税所得额时应纳税调整减少20万元，由此2×26年会少交所得税=20×25%=5（万元）。\n\n站在2×25年12月31日考虑，由于此项存货的存在，以后会少交所得税5万元，应确认递延所得税资产5万元。\n\n即2×25年12月31日，存货的账面价值=100-20=80（万元），存货的计税基础为100万元。\n\n由于存货账面价值和计税基础不一致，产生可抵扣暂时性差异，从而确认递延所得税资产。\n\n（2）某企业适用的所得税税率为25%，2×25年12月31日预提产品质量保证费用100万元，2×26年实际发生产品质量保证费用100万元。税法规定，企业计提的产品质量保证费在实际发生时允许税前扣除。2×26年由税前会计利润计算应纳税所得额时应纳税调减100万元，2×26年少交所得税=100×25%=25（万元）。\n\n站在2×25年12月31日考虑，以后会少交所得税25万元，应确认递延所得税资产25万元。\n\n即2×25年12月31日，预计负债的账面价值为100万元，预计负债的计税基础为0。\n\n由于预计负债账面价值和计税基础不一致，产生可抵扣暂时性差异，从而确认递延所得税资产。\n\n## 二、适用范围\n\n考点难度●〇○易\n\n本章所称所得税，包括企业以应纳税所得额为基础的各种境内和境外税额。本章不涉及政府补助的确认和计量，但因政府补助产生的暂时性差异的所得税影响，应当按照本章进行确认和计量。\n\n## 三、所得税会计的一般程序"},{"title":"第二节资产、负债的计税基础","content":"恭喜您解锁新章节！使用微信或“会计云课堂”App 扫码，过关更高效！\n\n所得税会计核算的关键在于确定资产、负债的计税基础。企业在取得资产、负债时，应当确定其计税基础。资产、负债计税基础的确定，与税收法规的规定密切相关。\n\n## 一、资产的计税基础\n\n考点难度●●○中\n\n资产的计税基础，是指企业收回资产账面价值的过程中，计算应纳税所得额时按照税法规定可以自应税经济利益中抵扣的金额。\n\n资产的计税基础=未来可税前列支的金额\n\n某一资产负债表日资产的计税基础=成本－以前期间已税前列支的金额\n\n## 点拨\n\n（1）《企业会计准则》规范资产、负债的账面价值，《企业所得税法》规范资产、负债的计税基础；\n\n（2）资产的账面价值是按会计准则规定资产负债表日以后作为费用列支的金额，资产的计税基础是按税法规定资产负债表日以后作为费用列支的金额。\n\n（一）固定资产\n\n账面价值=实际成本－会计累计折旧－固定资产减值准备\n\n计税基础=实际成本－税法累计折旧\n\n（二）无形资产\n\n1.对于内部研究开发形成的无形资产，企业会计准则规定有关研究开发支出区分为两个阶段，研究阶段的支出应当费用化计人当期损益，而开发阶段符合资本化条件的支出应当资本化作为无形资产的成本，不符合资本化条件的支出应当费用化计人当期损益；按税法规定，企业开展研发活动中实际发生的研发费用，未形成无形资产计人当期损益的，在按规定据实扣除的基础上，再按照实际发生额的 100% 在税前加计扣除；形成无形资产的，按照无形资产成本的200%在税前摊销。\n\n另外，会计准则中规定有例外条款，即若该无形资产的确认不是产生于企业合并交易、同时在确认时既不影响会计利润也不影响应纳税所得额，则不确认该暂时性差异的所得税影响。该种情况下，无形资产在初始确认时，对于会计与税收规定之间存在的暂时性差异不予确认，持有过程中，在初始未予确认暂时性差异的所得税影响范围内的摊销额等的差异不予确认。\n\n【例题1·多选题】甲公司2×25年1月开始的研发项目于2×25年7月1日达到预定用途，共发生研究开发支出500万元，其中研究阶段支出100万元，开发阶段不符合资本化条件的支出160万元，开发阶段符合资本化条件的支出240万元，假定该无形资产会计与税法规定均按直线法摊销，预计使用年限为5年，无残值，摊销金额计人管理费用。甲公司2×25年和2×26年税前会计利润分别为884万元和948万元，适用的企业所得税税率均为25%。按税法规定甲公司开展研发活动中实际发生的研发费用，未形成无形资产计人当期损益的，在按规定据实扣除的基础上，再按照实际发生额的100%在税前加计扣除；形成无形资产的，按照无形资产成本的200%在税前摊销。假定不考虑其他因素，甲公司下列会计处理中正确的有（ ）。\n\nA.甲公司2×25年研发项目及形成的无形资产计入当期费用的金额为284万元\n\nB.甲公司2×25年应交所得税为150万元\n\nC．甲公司2×25年12月31日无形资产的计税基础为432万元\n\nD.甲公司2×26年应交所得税为225万元\n\n解析）甲公司2×25年无形资产摊销金额=240÷5×6/12=24（万元），甲公司2×25年研发项目（费用化支出）及形成的无形资产（摊销）计入当期费用的金额=100+160+24=284（万元），选项A正确；\n\n甲公司2×25年应交所得税=（884-284×100%）×25%=150（万元），选项B正确；\n\n2×25年12月31日无形资产的账面价值=240-24=216（万元），计税基础=216×200%=432（万元），选项C正确；\n\n甲公司2×26年无形资产摊销金额=240÷5=48（万元），2×26年应交所得税=$( 9 4 8 - 4 8 \\times 1 0 0 \\% ) \\times 2 5 \\% = 2 2 5 ( \\overline { { \\mathcal { H } } } \\bar { \\mathcal { T } } )$ ，选项D正确。\n\n2.无形资产在后续计量时，会计与税法的差异主要产生于对无形资产是否需要摊销，无形资产摊销方法、摊销年限、预计净残值的不同以及无形资产减值准备的计提。\n\n（1）使用寿命有限的无形资产\n\n账面价值=实际成本-会计累计摊销－无形资产减值准备\n\n$$\n1 + 7 ) 1 \\div \\frac { 1 } { 2 } = \\frac { 1 } { 3 } ( 1 \\div \\frac { 1 } { 2 } ) \\times \\frac { 1 } { 2 } = \\frac { 1 } { 3 } ( 1 \\div \\frac { 1 } { 2 } ) = \\frac { 1 } { 2 } + \\frac { 1 } { 3 } ( 1 \\div \\frac { 1 } { 2 } )\n$$\n\n（2）使用寿命不确定的无形资产\n\n$$\n1 1 k = 1 3 k g \\times 1 5 k g = 3 k g \\times 3 0 \\times 2 = 3 0 0 0 0 0 k g = 3 0 0 0 0 0 0\n$$\n\n$$\ni + i \\overrightarrow { b } \\overrightarrow { c } = i \\overrightarrow { a } \\overrightarrow { b } \\overrightarrow { b } \\overrightarrow { b } \\overrightarrow { c } \\overrightarrow { b } - i \\overrightarrow { b } \\overrightarrow { a } \\cdot \\overrightarrow { b } \\overrightarrow { b } + i \\overrightarrow { a } \\cdot \\overrightarrow { b } \\overrightarrow { b } \\overrightarrow { b } \\overrightarrow { c } \\overrightarrow { b }\n$$\n\n## （三）以公允价值计量的金融资产\n\n1.以公允价值计量且其变动计入当期损益的金融资产\n\n账面价值：期末按公允价值计量，公允价值变动计人当期损益（公允价值变动损益）\n\n计税基础：取得时的成本\n\n2.以公允价值计量且其变动计入其他综合收益的金融资产（股权投资）\n\n账面价值：期末按公允价值计量，公允价值变动计人其他综合收益\n\n计税基础：取得时的成本\n\n## 点拨\n\n股权投资（交易性金融资产、其他权益工具投资和长期股权投资）的计税基础为取得时的成本。\n\n## （四）其他资产\n\n因企业会计准则规定与税法规定不同，企业持有的其他资产，可能造成其账面价值与计税基础之间存在差异。\n\n1.采用公允价值模式进行后续计量的投资性房地产\n\n账面价值：期末按公允价值计量\n\n计税基础：以历史成本为基础确定（与固定资产或无形资产类似）\n\n2.其他各种计提了资产减值准备的资产\n\n有关资产计提了减值准备后，其账面价值会随之下降，但税法规定资产在发生实质性损失之前，预计的减值损失不允许税前扣除，进而导致资产计提减值后，账面价值与计税基础形成差异。\n\n## 二、负债的计税基础\n\n考点难度●•●难\n\n负债的计税基础，是指负债的账面价值减去未来期间计算应纳税所得额时按照税法规定可予税前扣除的金额。\n\n对于预收收人，所产生负债的计税基础是其账面价值减去未来期间非应税收人的金额。\n\n负债的确认与偿还一般不会影响企业的损益，也不会影响其应纳税所得额，未来期间计算应纳税所得额时按照税法规定可予抵扣的金额为0，计税基础即为账面价值。例如，企业的短期借款、应付账款等。但是某些情况下，负债的确认可能会影响企业的损益，进而影响不同期\n\n间的应纳税所得额，使得其计税基础与账面价值之间产生差额，如按照会计规定确认的某些预计负债。\n\n$$\n\\begin{array} { r }  \\frac { \\partial \\widehat { u } } { \\partial \\mathfrak { t } } \\langle \\frac { \\partial \\widehat { u } } { \\partial \\mathfrak { t } } \\widehat { u } \\widehat { \\mathfrak { t } } \\rangle + \\widehat { \\mathfrak { p } } _ { U } ^ { \\sharp } \\frac { \\partial \\mathfrak { t } } { \\partial \\mathfrak { t } } \\frac { \\partial \\mathfrak { t } } { \\partial \\mathfrak { t } } \\widehat { u } | _ { 1 } ^ { \\mathrm { H } } = \\| \\mathfrak { k } \\overline { { \\mathrm { H } } } \\langle \\widehat { \\mathfrak { H } } \\rangle \\cdot \\widehat { \\mathfrak { t } } \\frac { \\partial \\mathfrak { t } } { \\partial \\mathfrak { t } } - \\overline { { \\mathfrak { k } } } \\ast \\frac { \\partial \\mathfrak { k } } { \\partial \\mathfrak { t } } \\| \\widehat { \\mathfrak { q } } \\| + \\widehat { \\mathfrak { p } } _ { U } ^ { \\sharp } \\frac { \\partial \\mathfrak { t } } { \\partial \\mathfrak { t } } \\widehat { \\mathfrak { k } } \\langle \\overline { { \\mathfrak { k } } } \\rangle \\pm \\widehat { \\mathfrak { p } } _ { U } ^ { \\sharp } \\frac { \\partial \\mathfrak { t } } { \\partial \\mathfrak { t } } \\overline { { \\mathfrak { p } } } \\overline { { \\mathfrak { t } } } \\overline { { \\mathfrak { p } } } \\overline { { \\mathfrak { t } } } \\overline { { \\mathfrak { q } } } + \\widehat { \\mathfrak { p } } _ { U } ^ { \\sharp } \\overline { { \\mathfrak { p } } } \\overline { { \\mathfrak { t } } } \\overline { { \\mathfrak { p } } } \\overline { { \\mathfrak { t } } } \\overline { { \\mathfrak { q } } } \\overline { { \\mathfrak { p } } } \\overline { { \\mathfrak { t } } } \\overline { { \\mathfrak { q } } } \\overline { { \\mathfrak { p } } } \\overline { { \\mathfrak { t } } } \\overline { { \\mathfrak { k } } } \\langle \\overline { { \\mathfrak { k } } } \\rangle \\frac { \\partial \\mathfrak { t } } { \\partial \\widehat { \\mathfrak { k } } \\mathfrak { t } } \\overline { { \\mathfrak { p } } } \\overline { { \\mathfrak { t } } } \\overline { { \\mathfrak { k } } } \\overline { { \\mathfrak { q } } } \\overline { { \\mathfrak { p } } } \\overline { { \\mathfrak { t } } } \\overline { { \\mathfrak { p } } } \\overline   \\mathfrak { t } \\end{array}\n$$\n\n## 提示\n\n（1）如果一项负债的确认和终止确认均不影响损益，那么该负债的账面价值与计税基础相等，如短期借款、应付账款等。\n\n（2）如果一项负债在会计确认时产生费用，而税法规定不能计入当期应纳税所得额，但终止确认时税法允许计入应纳税所得额，即负债确认时纳税调增，终止确认时纳税调减，从负债产生到终止，纳税调整金额合计为0。所以从税法角度没有负债，即负债的计税基础为0，如预提产品质量保证费用等。\n\n（3）如果一项负债在会计确认时产生费用，而税法规定不能计入当期应纳税所得额，终止确认时税法也不允许计入应纳税所得额，即负债确认时纳税调增，但终止确认时不能纳税调减，从负债产生到终止，总体需要纳税调增，所以从税法角度有负债，即负债的计税基础与账面价值相等，如各项税收滞纳金确认的其他应付款等。\n\n## （一）企业因销售商品提供售后服务等原因确认的预计负债\n\n按照《企业会计准则第13号- 一或有事项》的规定，企业应在预计提供保证类售后服务将发生的支出满足有关确认条件时，在销售当期确认为费用，同时确认预计负债。如果税法规定，与销售商品有关的支出可于实际发生时税前扣除，由于该类事项产生的预计负债在期末的计税基础为账面价值与未来期间可税前扣除的金额之间的差额，因此其计税基础为0。\n\n因其他事项确认的预计负债，应按照税法规定的计税原则确定其计税基础。某些情况下，因有些事项确认的预计负债，如果税法规定无论是否实际发生均不允许税前扣除，即未来期间按照税法规定可予抵扣的金额为0，则其账面价值与计税基础相等。\n\n## （二）合同负债\n\n1.合同负债计人当期应纳税所得额（如房地产开发企业），计税基础为0。\n\n2.合同负债未计人当期应纳税所得额，计税基础与账面价值相等。\n\n【例题2】甲公司2×25年12月31日因销售商品收到客户预付的款项500万元（不含增值税）。\n\n## （1）若预收的款项计人当期应纳税所得额\n\n2×25年12月31日合同负债的账面价值为500万元；因按税法规定预收的款项已计人当期应纳税所得额，所以在以后年度减少合同负债确认收人时，由税前会计利润计算应纳税所得额时应将其扣除。\n\n2×25年12月31日合同负债的计税基础=账面价值500-可从未来经济利益中扣除的金额500=0。\n\n## （2）若预收的款项不计人当期应纳税所得额\n\n2×25年12月31日合同负债的账面价值为500万元；2×25年12月31日合同负债的计税基础=账面价值500-可从未来经济利益中扣除的金额0=500（万元）。\n\n\n\n\n\n## （三）应付职工薪酬\n\n会计准则规定，企业为获得职工提供的服务给予的各种形式的报酬以及其他相关支出均应作为企业的成本费用，在未支付之前确认为负债。税法中对于合理的职工薪酬基本允许税前扣除，但税法中如果规定了税前扣除标准的，按照会计准则规定计人成本费用的金额超过税法规定的税前扣除标准部分，应进行纳税调整。因超过部分在发生当期不允许税前扣除，在以后期间也不允许税前扣除，即该部分差额对未来期间计税不产生影响，所产生应付职工薪酬的账面价值等于计税基础。\n\n## 点拨\n\n以现金结算的股份支付形成的应付职工薪酬，在未来期间实际支付时可予税前扣除，其计税基础为0。\n\n## （四）其他负债\n\n如企业应交的罚款和滞纳金等，在尚未支付之前按照会计准则规定确认为损失，同时作为负债反映。税法规定，行政性的罚款和滞纳金不得税前扣除，其计税基础为账面价值减去未来期间计税时可予税前扣除的金额0之间的差额，即计税基础等于账面价值。\n\n【例题3·单选题】下列各项负债中，其计税基础为零的是（ ）。A．赊购商品形成的应付账款  \nB.从银行取得的短期借款  \nC.因确认保修费用形成的预计负债  \nD.因各项税收滞纳金和罚款确认的其他应付款\n\n（解析）选项A和选项B不影响损益，计税基础与账面价值相等；选项C，税法允许在以后实际发生时税前列支，即其计税基础=账面价值－未来期间可以税前扣除的金额（计提的金额未来可全额扣除）=0；选项D，税法不允许在以后实际发生时税前列支，即其计税基础=账面价值－未来期间可以税前扣除的金额0=账面价值。\n\n## 三、特殊交易或事项中产生资产、负债计税基础的确定\n\n考点难度●难\n\n除企业在正常生产经营活动过程中取得的资产和负债以外，对于某些特殊交易中产生的资产、负债，其计税基础的确定应遵从税法规定，如企业合并过程中取得资产、负债计税基础的确定。\n\n由于会计准则与税收法规对企业合并的划分标准不同、处理原则不同，某些情况下，会造成企业合并中取得的有关资产、负债的人账价值与其计税基础存在差异。\n\n提示 2013年上市公司年报会计监管报告关于“企业合并中递延所得税的确认”。\n\n企业合并中，购买方按照会计准则规定的原则确认和计量合并中取得的被购买方的资产、负债，在购买方财务报表中的价值可能与其计税基础之间存在差异，从而带来递延所得税的确认问题。\n\n常见的情形：\n\n（1）以控股合并方式完成的非同一控制下企业合并中，购买方取得的被购买方可辨认资产在购买方的合并财务报表中按照购买日的公允价值确认和计量，但这些资产的计税基础未发生变化。由于通常情况下资产的账面价值（公允价值）大于其计税基础，上述差异大多为应纳税暂时性差异，应按照会计准则的规定确认递延所得税负债。\n\n## 点拨\n\n控股合并方式下，被购买方（被合并方）的法人资格没有消失，在合并财务报表层面不会改变被购买方（被合并方）资产、负债的计税基础。\n\n（2）以吸收合并方式进行的同一控制下企业合并，在合并不满足税法规定的免税条件时，合并方取得的被合并方资产的计税基础应调整为资产的公允价值，与会计上按照同一控制下企业合并原则确认的账面价值之间存在差异。由于通常情况下资产的账面价值小于按照公允价值确定的新的计税基础，上述差异为可抵扣暂时性差异，应按照会计准则的规定确认递延所得税资产。\n\n上述与企业合并相关，因合并中取得可辨认资产、负债的账面价值与计税基础不同产生的暂时性差异的所得税影响，在控股合并的情况下，应于合并财务报表中确认。购买方或合并方的个别财务报表中产生的会计与税收的差异可能源于相关长期股权投资的入账价值与计税基础之间，一般在长期股权投资初始确认时，应当确认相关的递延所得税影响。"},{"title":"第三节 暂时性差异","content":"暂时性差异，是指资产或负债的账面价值与其计税基础不同产生的差额。根据暂时性差异对未来期间应纳税所得额影响的不同，分为应纳税暂时性差异和可抵扣暂时性差异。\n\n## 一、应纳税暂时性差异\n\n考点难度●○○ 易\n\n应纳税暂时性差异，是指在确定未来收回资产或清偿负债期间的应纳税所得额时，将导致产生应税金额的暂时性差异。\n\n应纳税暂时性差异通常产生于以下情况：\n\n（1）资产的账面价值大于其计税基础。\n\n（2）负债的账面价值小于其计税基础。\n\n## 点拨\n\n资产账面价值大于计税基础，未来期间由税前会计利润计算应纳税所得额时会纳税调增，因此属于应纳税暂时性差异。\n\n【例题4】甲公司于2×25年12月1日发行短期融资券收到款项1000万元，将其指定为以公允价值计量且其变动计人当期损益的金融负债。2×25年12月31日短期融资券的公允价值为980万元。2×26年1月31日按980万元赎回该短期融资券。\n\n2×25年12月1日\n\n借：银行存款 1000\n\n贷：交易性金融负债 1000\n\n2×25年12月31日\n\n借：交易性金融负债 20\n\n贷：公允价值变动损益 20\n\n2×26年1月31日\n\n借：交易性金融负债 980\n\n贷：银行存款 980\n\n2×26年应纳税调增20万元。站在2×25年12月31日看，负债账面价值980万元，负债计税基础1000万元，负债账面价值小于计税基础，因未来需要纳税调增，属于应纳税暂时性差异。\n\n【例题5·单选题】甲公司为增值税一般纳税人，2×25年3月31日甲公司购人一台不需  \n安装的设备，购买价款为200万元（不含税），增值税税额为26万元，购人后投入行政管理部  \n门使用。预计使用年限为5年，预计净残值为0，会计采用年限平均法计提折旧。税法规定采  \n用双倍余额递减法计提折旧，折旧年限及预计净残值与会计规定相同，则2×25年12月31日  \n该设备产生的应纳税暂时性差异余额为（）万元。A. 35.1 B. 170 C. 30 D. 140\n\n（解析）2×25年12月31日该设备的账面价值=200-200÷5×9/12=170（万元），计税基础=200-200×2/5×9/12=140（万元），2×25年12月31日该设备产生的应纳税暂时性差异余额=170-140=30（万元）。\n\n## 二、可抵扣暂时性差异\n\n考点难度●〇○易\n\n可抵扣暂时性差异，是指在确定未来收回资产或清偿负债期间的应纳税所得额时，将导致产生可抵扣金额的暂时性差异。\n\n可抵扣暂时性差异通常产生于以下情况：\n\n（1）资产的账面价值小于其计税基础。\n\n（2）负债的账面价值大于其计税基础。\n\n## 点拨\n\n资产账面价值小于计税基础，未来期间由税前会计利润计算应纳税所得额时会纳税调减，因此属于可抵扣暂时性差异。\n\n## 例（真）题-答案」 5.C\n\n【例题6·多选题】下列各项企业形成的资产或承担的负债中，会形成暂时性差异的有（ ）。\n\nA．因销售商品提供保证类售后服务确认的预计负债，与保证类售后服务相关的支出于实际发生时税前扣除\n\nB.以现金结算的股份支付形成的应付职工薪酬，于未来实际支付时税前扣除\n\nC.企业违反税收法规应交的税收滞纳金，实际支付滞纳金时不允许税前扣除\n\nD.符合资本化条件且允许加计扣除的研发支出\n\n解析选项C，企业违反税收法规应交的税收滞纳金不得税前扣除，形成的其他应付款的账面价值与计税基础相等，不产生暂时性差异。\n\n## 三、特殊项目产生的暂时性差异\n\n考点难度●●○ 中\n\n## （一）未作为资产、负债确认的项目产生的暂时性差异\n\n某些交易或事项发生以后，因为不符合资产、负债的确认条件而未体现为资产负债表中的资产或负债，但按照税法规定能够确定其计税基础的，其账面价值与计税基础之间的差额也构成暂时性差异。如企业发生的符合条件的广告费和业务宣传费支出，除另有规定外，不超过当期销售收人15% 的部分准予扣除；超过部分准予在以后纳税年度结转扣除。该类费用在发生时按照会计准则规定计人当期损益，不形成资产负债表中的资产，但按照税法规定可以确定其计税基础的，两者之间的差额也形成暂时性差异（可抵扣暂时性差异）。\n\n## 点拨\n\n广告费和业务宣传费计入销售费用，没有形成资产账面价值，但准予以后年度结转扣除的部分可减少未来期间的应纳税所得额，因此产生可抵扣暂时性差异。\n\n## （二）可抵扣亏损及税款抵减产生的暂时性差异\n\n按照税法规定可以结转以后年度的未弥补亏损及税款抵减，虽不是因资产、负债的账面价值与计税基础不同产生的，但与可抵扣暂时性差异具有同样的作用，均能减少未来期间的应纳税所得额和应交所得税，会计处理上视同可抵扣暂时性差异，在符合确认条件的情况下，应确认与其相关的递延所得税资产。\n\n【例题7】甲公司于2×25年因政策性原因发生经营亏损2000万元，按照税法规定，该亏损可用于抵减以后5个年度的应纳税所得额。甲公司2×25年所得税税率为25%，从2×26年开始税率变为15%。\n\n分析该经营亏损不是资产、负债的账面价值与其计税基础不同产生的，但从性质上可以减少未来期间企业的应纳税所得额和应交所得税，属于可抵扣暂时性差异。\n\n假设：\n\n（1）预计未来5年有足够的应纳税所得额弥补该亏损。\n\n2×25年12月31日，应确认递延所得税资产=2000×15%=300（万元）。\n\n（2）预计未来5年税前会计利润合计为600万元。\n\n2×25年12月31日，应确认递延所得税资产=600×15%=90（万元）。\n\n（3）预计未来5年无利润。\n\n不确认递延所得税资产。"},{"title":"第四节递延所得税资产及负债的确认和计量","content":"一、递延所得税负债的确认和计量 5年热点|4次\n\n考点难度●〇中\n\n## （一）递延所得税负债的确认\n\n## 1.遵循原则\n\n确认应纳税暂时性差异产生的递延所得税负债时，交易或事项发生时影响会计利润或应纳税所得额的，相关的所得税影响应作为利润表中所得税费用的组成部分；与直接计人所有者权益的交易或事项相关的，其所得税影响应计人所有者权益；与企业合并中取得资产、负债相关的，递延所得税影响应调整购买日应确认的商誉或是计入合并当期损益的金额。\n\n\n\n点拨\n\n（1）产生的暂时性差异影响损益，对应所得税费用；\n\n（2）产生的暂时性差异直接影响所有者权益，对应所有者权益；\n\n（3）企业合并产生的暂时性差异，调整购买日商誉或负商誉。\n\n【例题8】甲企业与乙企业签订一项租赁协议，将其自用的一栋写字楼出租给乙企业使用，租赁期开始日为2×25年3月31日。2×25年3月31日，该写字楼的账面余额为50000万元，已累计计提折旧10000万元，未计提减值准备，公允价值为46000万元，甲企业对该项投资性房地产采用公允价值模式进行后续计量。假定转换前该写字楼的计税基础与账面价值相等，税法规定，该写字楼预计尚可使用年限为20年，采用年限平均法计提折旧，预计净残值为0。2×25年12月31日，该写字楼的公允价值为48000万元，甲企业适用的所得税税率为25%。\n\n要求：编制甲企业2×25年与所得税有关的会计分录。\n\n答案2×25年12月31日，投资性房地产的账面价值为48000万元，计税基础=（50000-10000）-（50000-10000）/20×9/12=38500（万元），产生应纳税暂时性差异=48000-38500=9500（万元），应确认递延所得税负债=9500×25%=2375（万元）。其中，转换日投资性房地产公允价值为46000万元，计税基础=转换前账面价值=50000-10000=40000（万元），转换日公允价值大于转换前账面价值的差额6000万元确认为其他综合收益，转换后账面价值46000万元与计税基础40000万元之间形成的应纳税暂时性差异确认的递延所得税负债对应其他综合收益的金额=6000×25%=1500（万元）；2×25年转换日后产生的影响损益的应纳税暂时性差异=（48000-46000）+（50000-10000）/20×9/12=3500（万元），递延所得税负债对应所得税费用的金额=3500×25%=875（万元），或递延所得税负债对应所得税费用的金额=2375-1500=875（万元）。\n\n会计分录如下：\n\n借：所得税费用 875  \n其他综合收益 1500  \n贷：递延所得税负债 2375\n\n【真题9·多选题】甲公司对出租的投资性房地产采用公允价值模式进行后续计量，适  \n用的企业所得税税率为25%。2×19年12月20日，甲公司以2亿元购人一栋写字楼，并于  \n2×19年12月31日以年租金1000万元的合同价格出租给乙公司，甲公司于2×20年1月1  \n日起开始收取租金。2×19年12月31日、2×20年12月31日，该写字楼的公允价值分别为  \n2.20亿元、2.22亿元。企业所得税法规定，企业取得的该写字楼按50年、以年限平均法计提  \n的折旧（不考虑净残值）可在计算应纳税所得额时扣除。除上述交易或事项外，甲公司没有其  \n他纳税调整事项，不考虑除企业所得税以外的其他相关税费及其他因素，下列各项关于甲公司  \n对上述交易或事项会计处理的表述中，正确的有（）。（2021年）A.2×19年实现利润总额3000万元B．2×20年度实现利润总额1200万元C．2×20年末递延所得税负债的账面余额为650万元D．2×19年末应确认其他综合收益2000万元\n\n（解析甲公司2×19年度实现利润总额=22000-20000=2000（万元），选项A错误；2×20年度实现利润总额=1000+（22200-22000）=1200（万元），选项B正确；2×20年末，甲公司该项投资性房地产账面价值为22200万元，计税基础=20000-20000/50=19600（万元），账面价值大于计税基础，形成的应纳税暂时性差异余额=22200-19600=2600（万元），2×20年末递延所得税负债的账面余额=2600×25%=650（万元），选项C正确；甲公司2×19年12月20日以2亿元购入一栋写字楼，并于2×19年12月31日出租给乙公司，该写字楼属于投资性房地产，2×19年末公允价值大于账面价值的差额，不确认其他综合收益，选项D错误。\n\n## 2.不确认递延所得税负债的特殊情况\n\n有些情况下，虽然资产、负债的账面价值与其计税基础不同，产生了应纳税暂时性差异，但出于各方面考虑，所得税准则中规定不确认相应的递延所得税负债。\n\n（1）商誉的初始确认。\n\n非同一控制下吸收合并，商誉=合并成本－购买日被购买方可辨认净资产公允价值的份额。在免税合并情况下，被购买方的可辨认资产和负债的计税基础维持原被购买方的账面价值，而账面价值应反映购买日的公允价值，由此产生的暂时性差异应确认递延所得税资产或递延所得税负债，其对应科目为商誉。在免税合并情况下，商誉的计税基础为0，账面价值和计税基础之间产生应纳税暂时性差异，但不确认递延所得税负债，因企业合并成本固定，若确认递延所得税负债，则减少考虑递延所得税后被购买方可辨认净资产公允价值，增加商誉，由此进人不断循环状态。\n\n需要说明的是，非同一控制下吸收合并形成的商誉，在应税合并情况下，按照所得税法规定商誉在初始确认时计税基础等于账面价值，不产生暂时性差异；该商誉在后续计量过程中因计提减值准备，使得商誉的账面价值小于计税基础，会产生可抵扣暂时性差异，应确认相关的所得税影响。\n\n\n\n## 点拨\n\n①非同一控制下免税的吸收合并，若被购买方资产（不包括商誉）、负债的账面价值与计税基础不同，确认递延所得税资产或负债时影响商誉；\n\n②非同一控制下免税的吸收合并中形成的“商誉”本身账面价值大于计税基础产生的暂时性差异不确认递延所得税负债。\n\n（2）除企业合并以外的其他交易或事项中，如果该项交易或事项发生时既不影响会计利润，也不影响应纳税所得额，则所产生的资产、负债的初始确认金额与其计税基础不同，形成应纳税暂时性差异的，交易或事项发生时不确认相应的递延所得税负债。\n\n该类交易或事项在我国企业实务中并不多见，一般情况下有关资产、负债的初始确认金额均会被税法所认可，两者之间不会产生差异。\n\n（3）与子公司、联营企业、合营企业投资等相关的应纳税暂时性差异，一般应确认相应的递延所得税负债，但同时满足以下两个条件的除外：一是投资企业能够控制暂时性差异转回的时间；二是该暂时性差异在可预见的未来很可能不会转回。满足上述条件时，投资企业可以运用自身的影响力决定暂时性差异的转回，如果不希望其转回，则在可预见的未来期间该项暂时性差异不会转回，对未来期间计税不产生影响，从而无须确认相应的递延所得税负债。\n\n（4）对于采用权益法核算的长期股权投资，其账面价值与计税基础产生的有关暂时性差异是否应确认相关的所得税影响，应当考虑该项投资的持有意图：\n\n①在准备长期持有的情况下，对于采用权益法核算的长期股权投资账面价值与计税基础之间的差异，投资企业一般不确认相关的所得税影响。\n\n理由：因初始投资成本的调整产生的暂时性差异预计未来期间不会转回，对未来期间没有所得税影响；因确认投资损益产生的暂时性差异，在未来期间逐期分回现金股利或利润时免税，也不存在对未来期间的所得税影响；因确认应享有被投资单位其他综合收益或其他权益变动而产生的暂时性差异，在长期持有的情况下预计未来期间也不会转回。\n\n②在持有意图由长期持有转变为拟近期出售的情况下，因长期股权投资的账面价值与计税基础不同产生的有关暂时性差异，均应确认相关的所得税影响。\n\n理由：按照税法规定，企业在转让或者处置投资资产时，投资资产的成本（不是投资资产的账面价值）准予扣除。\n\n\n\n## 点拨 采用权益法核算的长期股权投资：\n\na．拟长期持有的长期股权投资不确认递延所得税；\n\nb．由长期持有转为拟近期出售的长期股权投资确认递延所得税。\n\n【例题10·多选题】甲公司持有乙公司30%股权，按权益法核算对乙公司的股权投资，  \n原计划长期持有。2×25年12月31日，甲公司管理层决定近期以3000万元的价格出售所持  \n有的乙公司股权，当日，甲公司对乙公司长期股权投资账面价值为2200万元，其中，投资成  \n本为600万元，损益调整为1200万元，其他权益变动为400万元。根据企业所得税税法规定，  \n计算股权转让所得时，转让股权收人仅应扣除为取得该股权所发生的成本。甲公司适用的企业  \n所得税税率为25%。不考虑其他因素，下列各项关于甲公司2×25年12月31日所得税会计  \n处理的表述中，正确的有（ ）。A.确认递延所得税负债400万元 B.冲减长期股权投资300万元C．确认所得税费用400万元 D.冲减资本公积100万元\n\n解析 甲公司改变长期股权投资的持有意图拟对外出售，长期股权投资的账面价值与计税基础不同产生的暂时性差异，应确认相关的所得税影响。甲公司2×25年12月31日所得税会计处理如下：借：所得税费用等 300贷：递延所得税负债 300（1200×25%）借：资本公积 100贷：递延所得税负债 100（400×25%）选项A和D正确。\n\n【例题11·单选题】乙公司为丙公司和丁公司共同投资设立。2×25年1月1日，乙公司  \n增资扩股，甲公司出资450万元取得乙公司30%股权并能够对其施加重大影响。甲公司投资  \n日，乙公司可辨认净资产的公允价值和账面价值均为1600万元。2×25年，乙公司实现净利  \n润900万元，其他综合收益增加120万元。甲公司拟长期持有对乙公司的投资。甲公司适用的  \n所得税税率为25%。不考虑其他因素，下列各项关于甲公司2×25年对乙公司投资相关会计  \n处理的表述中，正确的是（ ）。A.按照实际出资金额确定对乙公司投资的人账价值B.将按持股比例计算应享有乙公司其他综合收益变动的份额确认为投资收益C.投资时将实际出资金额与享有乙公司可辨认净资产份额之间的差额确认为其他综合收益D.对乙公司投资年末账面价值与计税基础不同产生的应纳税暂时性差异，不应确认递延所得税负债\n\n解析）长期股权投资的初始投资成本为付出对价450万元，初始投资成本小于乙公司可辨认净资产公允价值份额480万元（1600×30%）的差额，调整初始投资成本记入“长期股权投资一投资成本”科目，同时计入营业外收入，即甲公司该项长期股权投资初始投资成本为450万元，入账价值为480万元，选项A和C不正确；按持股比例计算其应享有乙公司其他综合收益的份额，应当确认为其他综合收益，选项B不正确；因该长期股权投资拟长期持有，故不确认递延所得税，选项D正确。\n\n## （二）递延所得税负债的计量\n\n递延所得税负债应以相关应纳税暂时性差异转回期间适用的所得税税率计量。在我国，除享受税收优惠政策的情况以外，企业适用的所得税税率在不同年度之间一般不会发生变化，企业在确认递延所得税负债时，可以现行适用税率为基础计算确定。无论应纳税暂时性差异何时转回，递延所得税负债的确认不要求折现。\n\n\n\n拨 递延所得税负债的计量采用转回时税率，确认不要求折现。\n\n二、递延所得税资产的确认和计量 5年热点丨2次\n\n考点难度●●○中\n\n## （一）递延所得税资产的确认\n\n## 1.确认的一般原则\n\n资产、负债的账面价值与其计税基础不同产生可抵扣暂时性差异的，在估计未来期间能够取得足够的应纳税所得额用以利用该可抵扣暂时性差异时，应当以很可能取得用来抵扣可抵扣暂时性差异的应纳税所得额为限，确认相关的递延所得税资产。\n\n【真题12·多选题】2×19年11月20日，甲公司以5100万元购人一台大型机械设备，  \n经安装调试后，于2×19年12月31日投入使用。该设备的设计年限为25年，甲公司预计使  \n用20年，预计净残值100万元，按双倍余额递减法计提折旧。企业所得税法允许该设备按20  \n年、预计净残值100万元、以年限平均法计提的折旧可在计算应纳税所得额时扣除。甲公司  \n2×20年实现利润总额3000万元，适用的企业所得税税率为25%，甲公司预计未来期间能够  \n产生足够的应纳税所得额用以抵减可抵扣暂时性差异。甲公司用该设备生产的产品全部对外  \n出售。除本题所给资料外，无其他纳税调整事项，不考虑除企业所得税以外的其他相关税费  \n及其他因素，下列各项关于甲公司2×20年度对上述设备相关会计处理的表述中，正确的有  \n（ ）。（2021年）A．2×20年末该设备的账面价值为4850万元B.确认当期所得税815万元C.设备的账面价值小于其计税基础的差异260万元应确认递延所得税资产65万元D.计提折旧510万元\n\n解析2×20年甲公司该设备计提折旧额=5100×2/20=510（万元），2×20年末该设备账面价值=5100-510=4590（万元），选项A错误，选项D正确；2×20年末该设备计税基础=5100-（5100-100）/20=4850（万元），账面价值小于计税基础，形成可抵扣暂时性差异=4850-4590=260（万元），确认递延所得税资 $y ^ { 2 } = 2 6 0 \\times 2 5 \\% = 6 5 ( \\pi )$ ，2×20年该设备按税法规定计提折旧=（5100-100）/20=250（万元），应纳税调增金额=510-250=260（万元），甲公司确认当期应交所得税=（3000+260）×25%=815（万元），选项B和C正确。\n\n（1）对与子公司、联营企业、合营企业投资相关的可抵扣暂时性差异，同时满足下列条件的，应当确认相关的递延所得税资产：一是暂时性差异在可预见的未来很可能转回；二是未来很可能获得用来抵扣可抵扣暂时性差异的应纳税所得额。\n\n（2）按照税法规定可以结转以后年度的未弥补亏损和税款抵减，应视同可抵扣暂时性差异处理。在预计可利用未弥补亏损或税款抵减的未来期间内能够取得足够的应纳税所得额时，除准则中规定不予确认的情况外，应当以很可能取得的应纳税所得额为限，确认相应的递延所得税资产，同时减少确认当期的所得税费用。\n\n## 提示\n\n与可抵扣亏损和税款抵减相关的递延所得税资产，其确认条件与可抵扣暂时性差异产生的递延所得税资产相同。\n\n（3）企业合并中，按照会计准则规定确认的合并中取得各项可辨认资产、负债的入账价值与其计税基础之间形成可抵扣暂时性差异的，应确认相应的递延所得税资产，并调整合并中应予确认的商誉等。\n\n（4）与直接计人所有者权益的交易或事项相关的可抵扣暂时性差异，相应的递延所得税资产应计入所有者权益。\n\n## 点拨\n\n若产生的可抵扣暂时性差异影响其他综合收益，则递延所得税资产对应科目为其他综合收益。如因其他权益工具投资期末公允价值下降而确认的递延所得税资产。\n\n【例题13】甲公司2×24年12月1日以银行存款取得一项以公允价值计量且其变动计人其他综合收益的金融资产（股权投资），取得成本为220万元，2×24年12月31日，该项金融资产的公允价值为200万元。2×25年2月10日，甲公司将该金融资产全部出售，售价为190万元。假定未来期间甲公司能够取得足够的应纳税所得额用以抵扣该可抵扣暂时性差异，甲公司适用的所得税税率为25%，按净利润的10%提取盈余公积，不考虑其他相关因素的影响。\n\n要求：编制甲公司与上述业务相关的会计分录。\n\n（答案）甲公司会计处理如下：\n\n2×24年12月1日\n\n借：其他权益工具投资\n\n220\n\n贷：银行存款\n\n220\n\n2×24年12月31日\n\n借：其他综合收益\n\n20\n\n贷：其他权益工具投资\n\n20\n\n2×24年12月31日该项金融资产的账面价值为200万元，计税基础为220万元，产生可抵扣暂时性差异20万元，应确认递延所得税资产为5万元（20×25%）。\n\n借：递延所得税资产\n\n贷：其他综合收益\n\n2×25年2月10日  \n借：银行存款 190  \n盈余公积 1  \n利润分配—未分配利润 9  \n贷：其他权益工具投资 200  \n借：盈余公积 2  \n利润分配一未分配利润 18  \n贷：其他综合收益 20  \n借：其他综合收益 5  \n贷：递延所得税资产 5\n\n【例题14·单选题】下列各项关于企业所得税会计处理的表述中，正确的是（ ）。  \nA.存货转为以公允价值模式进行后续计量的投资性房地产时，公允价值大于账面价值（计税基础）产生的暂时性差异的所得税影响应计人当期损益  \nB.其他权益工具投资的公允价值变动产生的暂时性差异的所得税影响应计人当期损益  \nC.发行可转换公司债券，负债初始确认时产生的暂时性差异的所得税影响应计入当期损益  \nD.企业合并中取得可辨认资产的账面价值与计税基础之间的暂时性差异的所得税影响应调整商誉等\n\n解析）选项A和B计入其他综合收益；选项C计入所有者权益。\n\n2.不确认递延所得税资产的特殊情况\n\n某些情况下，如果企业发生的某项交易或事项不属于企业合并，并且交易发生时既不影响会计利润也不影响应纳税所得额，且该项交易中产生的资产、负债的初始确认金额与其计税基础不同，产生可抵扣暂时性差异的，所得税准则中规定在交易或事项发生时不确认相应的递延所得税资产。其原因在于该项交易不是企业合并，递延所得税资产不能对应商誉；因该项交易或事项发生时既不影响会计利润，也不影响应纳税所得额，所以递延所得税资产不能对应“所得税费用”科目，从而不会影响留存收益，交易发生时产生暂时性差异的业务也不会涉及股本（或实收资本）、资本公积和其他综合收益，因此递延所得税资产不能对应所有者权益。若确认递延所得税资产，为使会计等式平衡，则只能增加负债的价值或减少其他资产的价值，这种会计处理违背历史成本计量属性，因此不确认递延所得税资产。\n\n【例题15·单选题】甲公司2×24年1月开始研发一项新技术，2×25年1月进入开发阶  \n段，2×25年12月31日完成开发并申请了专利。该项目2×24年发生研究费用600万元，截  \n至2×25年年末累计发生研发费用1600万元，其中符合资本化条件的金额为1000万元，按  \n照税法规定，研发支出可按实际支出的200%税前抵扣。不考虑其他因素，下列各项关于甲公  \n司上述研发项目会计处理的表述中，正确的是（ ）。A.将研发项目发生的研究费用确认为长期待摊费用B.实际发生的研发费用与其可予税前抵扣金额的差额确认递延所得税资产\n\n例（真）题-答案」14.D\n\nC．自符合资本化条件起至达到预定用途时所发生的符合资本化条件的研发费用计入无形资产\n\nD.研发项目在达到预定用途后，将所发生全部研究和开发费用可予以税前抵扣金额的所得税影响额确认为递延所得税费用\n\n（解析）企业自行研究开发项目，应当区分研究阶段与开发阶段分别进行核算。研究阶段的支出应计入当期损益，开发阶段的支出满足资本化条件时计入无形资产的成本，选项C正确。\n\n（解题攻略）自行研发形成的无形资产，因符合税法加计扣除条件引起的账面价值小于计税基础，不确认递延所得税资产。\n\n## （二）递延所得税资产的计量\n\n## 1.适用税率的确定\n\n确认递延所得税资产时，应估计相关可抵扣暂时性差异的转回时间，采用转回期间适用的所得税税率为基础计算确定。无论相关的可抵扣暂时性差异何时转回，递延所得税资产均不予折现。\n\n## 2.递延所得税资产的减值\n\n资产负债表日，企业应当对递延所得税资产的账面价值进行复核。如果未来期间很可能无法取得足够的应纳税所得额用以利用可抵扣暂时性差异带来的利益，应当减记递延所得税资产的账面价值。递延所得税资产的账面价值减记以后，以后期间根据新的环境和情况判断能够产生足够的应纳税所得额用以利用可抵扣暂时性差异，使得递延所得税资产包含的经济利益能够实现的，应相应恢复递延所得税资产的账面价值。\n\n## 三、特殊交易或事项中涉及递延所得税的确认和计量5年热点丨4次考点难度··难\n\n## （一）与直接计入所有者权益的交易或事项相关的所得税\n\n与当期及以前期间直接计人所有者权益的交易或事项相关的当期所得税及递延所得税应当计人所有者权益。直接计人所有者权益的交易或事项主要有：会计政策变更采用追溯调整法或对前期差错更正采用追溯重述法调整期初留存收益、以公允价值计量且其变动计入其他综合收益的金融资产其公允价值变动计人所有者权益（其他综合收益）、同时包含负债及权益成分的金融工具在初始确认时计人所有者权益等。\n\n\n\n提示 递延所得税资产、递延所得税负债对应科目的不同情形：\n\n（1）若产生暂时性差异影响利润总额，则对应科目为所得税费用；\n\n（2）若产生暂时性差异影响其他综合收益，则对应科目为其他综合收益；\n\n（3）若产生暂时性差异是由于非同一控制下吸收合并（免税合并）形成的，则对应科目为商誉（商誉自身产生的暂时性差异，不确认递延所得税）；\n\n（4）若产生暂时性差异是由于会计政策变更、前期重要差错更正形成的，则对应科目为留存收益（盈余公积、利润分配一未分配利润）。\n\n## 问答 发行可转换债券是否应确认发行可转换债券相关递延所得税负债？\n\n答：监管规则适用指引—会计类第5号，公司在发行并初始确认可转换债券时，若该可转换债券作为复合金融工具、其金融负债成分的计税基础等于债券票面金额并产生应纳税暂时性差异的，该应纳税暂时性差异实际来自于可转换债券中的权益工具成分，不满足递延所得税负债豁免确认条件，因此公司应就该应纳税暂时性差异确认递延所得税负债并将其影响计入所有者权益。后续计量时，随着可转换债券金融负债成分相关折价的摊销，相关递延所得税负债的变动金额计入当期损益。\n\n## （二）与企业合并相关的递延所得税\n\n在企业合并中，购买方取得的可抵扣暂时性差异，按照税法规定可以用于抵减以后年度应纳税所得额，但在购买日不符合递延所得税资产确认条件而不予以确认。\n\n购买日后12个月内，如取得新的或进一步信息表明购买日的相关情况已经存在，预期被购买方在购买日可抵扣暂时性差异带来的经济利益能够实现的，应当确认相关的递延所得税资产，同时减少商誉，商誉不足冲减的，差额部分确认为当期损益。\n\n## 点拨\n\n此处指的是购买日不符合递延所得税资产确认条件的可抵扣暂时性差异，在购买日后符合条件确认递延所得税资产的会计处理。对购买日符合递延所得税资产确认条件的可抵扣暂时性差异，应确认递延所得税资产，同时减少商誉。\n\n除上述情况以外（购买日后12个月内如取得的信息不能表明购买日的相关情况已经存在，或购买日后超过12个月），确认与企业合并相关的递延所得税资产，应当计人当期损益。\n\n【真题16·单选题】2×20年5月1日，甲公司从独立第三方收购了乙公司60%的股权  \n并取得控制权，确认商誉800万元。购买日，乙公司存在历史期间尚可在税前抵扣的未弥补亏  \n损500万元，因不符合确认条件而未确认递延所得税资产。2×21年2月1日，在甲公司的支  \n持下，乙公司开展了新的业务，乙公司基于调整后的新业务预计未来期间能够产生足够的应纳  \n税所得额用以抵减可抵扣暂时性差异，因此，乙公司于2×21年2月末确认了递延所得税资产，  \n同时冲减所得税费用。甲公司在2×21年度合并乙公司财务报表时，下列各项有关所得税的抵  \n销或调整的表述中，正确的是（）。（2022 年）A.无须抵销或调整B.调整所得税费用和商誉C.调整所得税费用和资本公积D.调整所得税费用和年初未分配利润\n\n解析）乙公司由于在购买日不满足递延所得税资产的确认条件未确认递延所得税，以后期间预期能产生足够的应纳税所得额用以抵扣可抵扣暂时性差异，应当确认递延所得税资产，但该事项是由于乙公司开展了新业务而并非是购买日已经存在的情况，不能冲减商誉，应当计入当期损益，即冲减所得税费用。由于乙公司已经在其个别财务报表中作出了相关会计处理，甲公司在编制合并财务报表时无须额外抵销或调整，选项A正确。\n\n## （三）与股份支付相关的当期及递延所得税\n\n与股份支付相关的支出在按照会计准则规定确认为成本费用时，其相关的所得税影响应区别于税法的规定进行处理：如果税法规定与股份支付相关的支出不允许税前扣除，则不形成暂时性差异；如果税法规定与股份支付相关的支出允许税前扣除，在按照会计准则规定确认成本费用的期间内，企业应当根据会计期末取得的信息估计可税前扣除的金额计算确定其计税基础及由此产生的暂时性差异，符合确认条件的情况下，应当确认相关递延所得税。\n\n根据相关税法规定，对于附有业绩条件或服务条件的股权激励计划，企业按照会计准则的相关规定确认的成本费用在等待期内不得税前抵扣，待股权激励计划可行权时方可抵扣，可抵扣的金额为实际行权时的股票公允价值与激励对象支付的行权金额之间的差额，因此，企业未来可以在税前抵扣的金额与等待期内确认的成本费用金额很可能存在差异。\n\n企业应根据期末的股票价格估计未来可以税前抵扣的金额，以未来期间很可能取得的应纳\\*税所得额为限确认递延所得税资产。此外，如果预计未来期间可抵扣的金额超过等待期内确认的成本费用，超出部分形成的递延所得税资产应直接计人所有者权益（资本公积一其他资本公积)，而不是计人当期损益。\n\n【例题17】甲公司为上市公司，采用授予职工限制性股票的形式实施股权激励计划。具体情况如下：\n\n（1）2×24年1月1日，甲公司以非公开发行方式向50名管理人员每人授予10万股自身股票（每股面值为1元），授予价格为每股8元。当日，50名管理人员全部出资认购，总认购款项为4000万元，甲公司办理了相关增资手续。甲公司以授予日股票的市场价格减去限制性股票授予价格后的金额确定股权激励在授予日的公允价值为每股10元。\n\n（2）激励计划规定，这些管理人员从2×24年1月1日起在甲公司连续服务满4年的，所授予股票将于2×28年1月1日全部解锁；期间离职的，甲公司将按照原授予价格每股8元回购。\n\n（3）2×24年，甲公司有1名管理人员于2×24年12月1日离开，2×24年12月31日，甲公司预计限售期内还有3名管理人员离开。同日，甲公司股票的市场价格为每股20元。\n\n（4）2×25年，甲公司有2名管理人员于2×25年12月15日离开。2×25年12月31日，甲公司预计限售期内还有2名管理人员离开。同日，甲公司股票的市场价格为每股17元。\n\n（5）根据企业所得税法规定，对于附有服务期限条件的股权激励计划，等待期内确认的成本费用不得税前扣除，待行权后根据实际行权时的股票公允价值与激励对象实际行权支付的价格之间的差额允许税前扣除。甲公司以期末股票的市场价格估计未来因股份支付可在税前扣除的金额。甲公司满足确认递延所得税资产的条件，适用的企业所得税税率为25%。\n\n假定除企业所得税外，本题不考虑其他相关税费及其他因素。\n\n要求：编制甲公司2×24年度、2×25年度与股份支付相关递延所得税的会计分录。\n\n1150（万元）,当期因股份支付应确认的可抵扣暂时性差异=（50-1-3）×10×（20-8）×1/4=1380（万元），因股份支付应确认的递延所得税资产=1380×25%=345（万元），应确认所得税费用=1150×25%=287.5（万元），超过所得税费用部分计入资本公积的金额=345-287.5=57.5（万元）。\n\n---\n\n相关会计分录：\n\n借：递延所得税资产 345\n\n贷：所得税费用 287.5\n\n资本公积—其他资本公积 57.5\n\n至2×25年12月31日累计确认管理费用的金额=（50-1-2-2）×10×10×2/4=2250（万元），甲公司当期因股份支付应确认的可抵扣暂时性差异余额=（50-1-2-2）×10×（17-8）×2/4=2025（万元），因股份支付应确认的递延所得税资产余额=2025×25%=506.25（万元），本期应确认递延所得税资产=506.25-345=161.25（万元），因累计确认的管理费用2250万元大于可抵扣暂时性差异余额2025万元，所以应将2×24年确认的资本公积57.5万元冲回，本期应确认所得税费用=2025×25%-287.5=218.75（万元）。\n\n相关会计分录：\n\n借：递延所得税资产 161.25\n\n资本公积一其他资本公积 57.5\n\n贷：所得税费用 218.75\n\n【例题18·多选题】在未来期间能够产生足够的应纳税所得额用以抵减可抵扣暂时性差  \n异并不考虑其他因素的情况下，下列各项交易或事项涉及所得税会计处理的表述中正确的有  \n（ ）。A.内部研发形成的无形资产，初始人账金额与计税基础之间的差异应确认递延所得税并计人当期损益B.股份支付产生的暂时性差异，如果预计未来期间可抵扣的金额超过等待期内确认的成本费用，超出部分形成的递延所得税应计人所有者权益C.以公允价值计量且其变动计人其他综合收益的非交易性权益工具投资的公允价值变动产生的暂时性差异应确认递延所得税并计人其他综合收益D.企业发行可转换公司债券，负债的初始人账金额与计税基础之间的差异应确认递延所得税并计人当期损益\n\n解析内部研发形成的无形资产，不是产生于企业合并交易、同时在确认时既不影响会计利润也不影响应纳税所得额，则不确认该暂时性差异的所得税影响，选项A错误；企业发行可转换公司债券，负债的初始入账金额与计税基础之间的差异应确认递延所得税并计入所有者权益，选项D错误。\n\n## （四）与单项交易相关的递延所得税\n\n对于不是企业合并且交易发生时既不影响会计利润也不影响应纳税所得额（或可抵扣亏损）、并因单项交易初始确认的资产和负债导致产生等额应纳税暂时性差异和可抵扣暂时性差异的交易，如承租人在租赁期开始日初始确认租赁负债并计人使用权资产的租赁交易，以及固定资产因存在弃置义务而确认预计负债并计人固定资产成本的交易等，应当根据所得税准则的有关规定，在交易发生时分别确认相应的递延所得税负债和递延所得税资产。\n\n31.65\n\n【例题19】乙公司经国家批准2×25年1月1日建造完成核反应堆并交付使用，建造成本为2500000万元，预计使用寿命40年。根据法律规定，该核反应堆将会对生态环境产生一定的影响，企业应在该项设施使用期满后将其拆除，并对造成的污染进行整治，预计发生弃置费用250000万元。假定适用的折现率为10%。核反应堆属于特殊行业的特定固定资产，确定其成本时应考虑弃置费用。假定该固定资产会计和税法规定的折旧年限均为40年，采用年限平均法计提折旧，预计净残值为零，乙公司适用的企业所得税税率为25%。\n\n已知：（P/F，10%，40）=0.0221。不考虑其他因素。\n\n要求：编制2×25年与上述交易或事项相关的会计分录。\n\n答案\n\n（1）2×25年1月1日，弃置费用的现值=250000×（P/F,10%,40）=250000×0.0221=5525（万元）。\n\n固定资产的成本=2500000+5525=2505525（万元）。\n\n借：固定资产\n\n2505525\n\n贷：在建工程\n\n2500000\n\n预计负债\n\n（2）2×25年1月1日，固定资产的账面价值为2505525万元，因税法对预计弃置费用形成的资产不予确认，因此，固定资产的计税基础为2500000万元，预计负债的账面价值为5525万元，计税基础为0。因资产和负债的账面价值与各自的计税基础不一致，产生等额的递延所得税负债和递延所得税资产，且初始确认时不影响所得税费用和当期利润。\n\n乙公司固定资产应确认递延所得税负债=5525×25%=1381.25（万元），预计负债应确认递延所得税资产=5525×25%=1381.25（万元）。\n\n借：递延所得税资产\n\n1381.25\n\n贷：递延所得税负债\n\n1381.25\n\n（3）2×25年12月31日应确认的利息费用=5525×10%=552.5（万元）。\n\n借：财务费用\n\n552.5\n\n贷：预计负债\n\n因预计负债计提利息，可抵扣暂时性差异增加552.5万元，递延所得税资产增加=552.5×25%=138.13（万元）。\n\n借：递延所得税资产\n\n138.13\n\n贷：所得税费用\n\n$$\n\\frac { 5 } { 2 0 } + \\frac { 3 } { 4 } \\times \\frac { 3 } { 1 4 } \\times \\frac { 4 5 } { 4 } + \\frac { 3 } { 3 5 } \\times \\frac { 1 2 } { 1 4 } \\times \\frac { 1 } { 1 4 } = 2 5 0 5 5 2 5 \\div 4 0 \\times 1 1 / 1 2 = 5 7 4 1 8 . 2 8 ( \\mathcal { F } \\bar { \\pi } ) 。\\tag{138.13}\n$$\n\n借：制造费用等\n\n57418.28\n\n贷：累计折旧\n\n$$\n4 5 6 \\div 5 \\times 3 6 \\div 6 \\times 4 5 + 3 5 1 \\div 3 5 = 2 5 0 0 0 0 0 \\div 4 0 \\times 1 1 / 1 2 = 5 7 2 9 1 . 6 7 ( \\mathcal { F } \\hat { \\pi } ) 。\\tag{57418.28}\n$$\n\n因计提折旧导致应纳税暂时性差异减少=57418.28-57291.67=126.61（万元），递延所得税负债转回=126.61×25%=31.65（万元）。\n\n借：递延所得税负债\n\n31.65\n\n贷：所得税费用\n\n【真题20·单选题】2×23年，甲公司发生的有关交易或事项如下：（1）出于短期获利的  \n目的从公开市场买人股票，该股票当年产生公允价值变动收益200万元；（2）部分生产设备发  \n生减值，计提固定资产减值准备1000万元；（3）租人某办公楼，同时确认使用权资产和租赁  \n负债800万元。甲公司适用的企业所得税税率为25%，甲公司预计2×23年以及未来期间均  \n有足够的应纳税所得额用于抵减可抵扣暂时性差异，不考虑其他因素，下列各项关于甲公司  \n2×23年度所得税会计处理的表述中，正确的是（）。（2023年）A．确认递延所得税负债250万元B.因股票的公允价值变动确认递延所得税负债的同时调整其他综合收益50万元C．由于使用权资产和租赁负债金额相等，不确认递延所得税资产和递延所得税负债D.确认递延所得税资产300万元\n\n（解析）出于短期获利目的购入的股票，应作为以公允价值计量且其变动计入当期损益的金融资产核算，故其公允价值变动确认的递延所得税负债50万元（200×25%）对应所得税费用，选项B不正确；因租入办公楼，确认使用权资产和租赁负债，应分别确认递延所得税负债和递延所得税资产200万元（800×25%），选项C不正确；固定资产计提减值准备，应确认递延所得税资产250万元（1000×25%），2×23年度应确认递延所得税资产金额=200+250=450（万元），应确认递延所得税负债金额=50+200=250（万元），选项A正确，选项D不正确。\n\n（解题攻略）对于不是企业合并且交易发生时既不影响会计利润也不影响应纳税所得额（或可抵扣亏损）、并因单项交易产生的资产和负债导致产生等额应纳税暂时性差异和可抵扣暂时性差异的交易，如承租人在租赁期开始日初始确认租赁负债和使用权资产的租赁交易等，应当根据所得税准则的有关规定，在交易发生时分别确认相应的递延所得税资产和递延所得税负债。\n\n## （五）发行方分类为权益工具的金融工具相关股利的所得税影响\n\n对于企业（指发行方，下同）按照《企业会计准则第37号—金融工具列报》等规定分类为权益工具的金融工具（如分类为权益工具的永续债等），相关股利支出按照税收政策相关规定在企业所得税税前扣除的，企业应当在确认应付股利时，确认与股利相关的所得税影响。该股利的所得税影响通常与过去产生可供分配利润的交易或事项更为直接相关，企业应当按照与过去产生可供分配利润的交易或事项时所采用的会计处理相一致的方式，将股利的所得税影响计人当期损益或所有者权益项目。对于所分配的利润来源于以前产生损益的交易或事项，该股利的所得税影响应当计人当期损益（以应归属于该金融工具的金额为限）；对于所分配的利润来源于以前确认在所有者权益中的交易或事项，该股利的所得税影响应当计入所有者权益项目。\n\n【真题21·多选题】2×24年4月1日，甲公司按面值发行永续债募集资金50000万元，票面年利率为3.8%，支付发行费用1000万元。该永续债符合权益工具的定义。2×25年3月31日，甲公司根据上年实现的净利润拟进行股利分配，并用上年实现的净利润向永续债持有人先行支付了利息。根据企业所得税法规定，该永续债的利息可以在当期税前扣除。不考虑除\n\n企业所得税以外的相关税费及其他因素，下列各项关于甲公司永续债会计处理的表述中，正确  \n的有（ ）。（2024年回忆版）A.将发行的永续债确认为其他权益工具B.将支付永续债利息的所得税影响计人当期损益C.将支付的发行费用冲减所有者权益D.将分派的永续债利息按利润分配处理\n\n（解析）甲公司发行的永续债符合权益工具的定义，应计入其他权益工具，选项A正确；根据企业所得税法规定，该永续债的利息可以在当期税前扣除，且甲公司根据上年实现的净利润（以前产生损益的交易或事项）进行股利分配，因此将支付永续债利息的所得税影响计入当期损益，选项B正确；支付的发行费用应冲减所有者权益，选项C正确；永续债符合权益工具的定义，相关利息作为利润分配处理，选项D正确。\n\n## 四、适用税率变化对已确认递延所得税资产和递延所得税负债的影响\n\n考点难度●●○中\n\n因税收法规的变化，导致企业在某一会计期间适用的所得税税率发生变化的，企业应对已确认的递延所得税资产和递延所得税负债按照新的税率重新计量。\n\n【例题22·多选题】甲公司2×24年及以前适用的所得税税率为25%，2×25年6月因满  \n足特定条件，从2×25年7月1日起适用的企业所得税税率为20%。2×23年12月20日，甲  \n公司购人一台机器设备，该设备原价为100万元，预计使用年限为5年，预计净残值为零，会  \n计采用双倍余额递减法计提折旧，税法规定采用年限平均法计提折旧，假定税法规定的折旧年  \n限及净残值与会计相同。不考虑其他因素，甲公司下列会计处理表述中正确的有（A．2×24年12月31日递延所得税资产余额为5万元B.2×25年因税率变动对已确认的递延所得税资产的调整数为-1万元C. $2 \\times 2 5$ 年应确认的递延所得税资产发生额为0.8万元D. $2 \\times 2 5$ 年12月31日递延所得税资产余额为4.8万元\n\n解析 2×24年12月31日固定资产账面价值 $= 1 0 0 - 1 0 0 \\times 2 / 5 = 6 0 ( \\pi )$ ，计税基础=100-100/5=80（万元），应确认递延所得税资产余额 $= ( 8 0 - 6 0 ) \\times 2 5 \\% = 5 ( \\pi )$ ，选项A正确；\n\n2×25年因税率变动对已确认的递延所得税资产的调整数 $= ( 8 0 - 6 0 ) \\times 2 0 \\% - 5 = - 1 ( \\overline { { \\mathcal { D } } }$ 元），选项B正确；\n\n2×25年会计计提折旧 $= 6 0 \\times 2 / 5 { = } 2 4 ( \\pi \\pi )$ ，税法计提折旧 $\\mathbf { = } 1 0 0 / 5 \\mathbf { = } 2 0 \\ ( \\ \\mathcal { F } \\mathcal { \\hat { \\pi } } )$ ，$2 \\times 2 5$ 年应确认的递延所得税资产发生容 $\\beta = \\left( \\ 2 4 { - } 2 0 \\right) \\ \\times 2 0 \\% - 1 { = } { - } 0 . 2 \\ ( \\ \\mathcal { F } \\bar { \\mathcal { F } } )$ ，选项C错误；\n\n2×25年12月31日固定资产账面价值 $= 6 0 - 2 4 = 3 6 ( \\pi \\pi )$ ，计税基础 $= 1 0 0 - 1 0 0 / 5 \\times$   \n2=60（万元），应确认递延所得税资产余 $\\overrightarrow { \\ast \\overrightarrow { \\vert } } = \\left( \\begin{array} { c c } { { 6 0 - 3 6 } } \\end{array} \\right) \\times 2 0 \\% = 4 . 8 \\ ( \\mathrm { ~ \\mathcal { F } \\bar { \\pi } ~ } )$ ，选项D正确。\n\n解题攻略）也可采用期末、期初余额的差额确定递延所得税资产发生额，即 $2 \\times 2 5$ 年应确认的递延所得税资产发生额=4.8-5=-0.2（万元）。"},{"title":"第五节 所得税费用的确认和计量","content":"在采用资产负债表债务法核算所得税的情况下，利润表中的所得税费用由两部分组成：当期所得税和递延所得税。\n\n## 一、当期所得税\n\n考点难度●●○中\n\n当期所得税，是指企业按照税法规定计算确定的针对当期发生的交易和事项，应交纳给税务部门的所得税金额，即当期应交所得税。\n\n企业在确定当期应交所得税时，对于当期发生的交易或事项，会计处理与税法处理不同的，应在会计利润的基础上，按照适用税收法规的规定进行调整，计算出当期应纳税所得额，按照应纳税所得额与适用所得税税率计算确定当期应交所得税。\n\n应交所得税=应纳税所得额×所得税税率\n\n应纳税所得额=税前会计利润+纳税调整增加额\\_纳税调整减少额\n\n## 二、递延所得税\n\n考点难度难\n\n递延所得税，是指按照所得税准则规定当期应予确认的递延所得税资产和递延所得税负债，即递延所得税资产及递延所得税负债当期发生额的综合结果，但不包括直接计入所有者权益的交易或事项的所得税影响。\n\n递延所得税费用=当期递延所得税负债的增加额+当期递延所得税资产的减少额－当期 递延所得税负债的减少额-当期递延所得税资产的增加额\n\n## 点拨\n\n递延所得税资产和递延所得税负债发生额对应所得税费用的，属于递延所得税费用（或收益）。\n\n如果某项交易或事项按照企业会计准则规定应计人所有者权益，由该交易或事项产生的递延所得税资产或递延所得税负债及其变化亦应计人所有者权益，不构成利润表中的递延所得税费用（或收益）。\n\n## 三、所得税费用\n\n考点难度●●○中\n\n计算确定了当期所得税及递延所得税以后，利润表中应予确认的所得税费用为两者之和，即：\n\n所得税费用=当期所得税+递延所得税费用\n\n【例题23·单选题】甲公司适用的企业所得税税率为25%。2×25年6月15日，甲公司  \n以8000万元的价格购入一套管理用设备，并于当月投人使用，预计使用10年，预计净残值为  \n零，采用年限平均法计提折旧。所得税法规定允许该设备以取得成本采用年限平均法、使用年  \n限5年、预计净残值为零计提的折旧额在计算应纳税所得额时扣除。2×25年度，甲公司实现  \n利润总额为1600万元。甲公司不存在其他纳税调整事项，不考虑除企业所得税以外的其他相  \n关税费及其他因素，甲公司2×25年度应在利润表所得税费用项目列报的金额是（ ）。A.200万元 B.300万元 C.400万元 D.0\n\n解析 2×25年年末，管理用设备账面价值=8000-8000/10×6/12=7600（万元），计税基础=8000-8000/5×6/12=7200（万元），资产账面价值大于计税基础400万元（7600-7200），形成应纳税暂时性差异400万元，应确认递延所得税负债100万元（400×25%）；应纳税所得额=1600-400=1200（万元），当期应交所得税=1200×25%=300（万元）；所得税费用=当期所得税+递延所得税费用 $= 3 0 0 + 1 0 0 = 4 0 0 ( \\pi )$ ，选项C正确。\n\n或：所得税费用=1600×25%=400（万元）。\n\n解题攻略 影响损益的暂时性差异，在计算应交所得税时应当进行纳税调整，同时确认递延所得税，两者对所得税费用的影响为一增一减，最终不影响所得税费用的总额。因此，在不考虑暂时性差异的应纳税所得额为正数且税率不变的情况下，计算所得税费用时，可以采用简化做法，即所得税费用=不考虑暂时性差异的应纳税所得额×适用的所得税税率。"},{"title":"第六节 所得税的列报","content":"## 一、列报的基本原则\n\n考点难度●〇○易\n\n企业对所得税的核算结果，除利润表中列示的所得税费用以外，在资产负债表中形成的应交税费（应交所得税）以及递延所得税资产和递延所得税负债应当遵循准则规定列报。其中，\n\n## 例（真）题-答案丨 24.A\n\n递延所得税资产和递延所得税负债一般应当分别作为非流动资产和非流动负债在资产负债表中列示，所得税费用应当在利润表中单独列示，同时还应在附注中披露与所得税有关的信息。\n\n一般情况下，在个别财务报表中，当期所得税资产与当期所得税负债、递延所得税资产及递延所得税负债可以以抵销后的净额列示。在合并财务报表中，纳人合并范围的企业中，一方的当期所得税资产或递延所得税资产与另一方的当期所得税负债或递延所得税负债一般不能予以抵销，除非所涉及的企业具有以净额结算的法定权利并且意图以净额结算。\n\n## 二、所得税费用（收益）与会计利润关系的说明5年热点丨3次\n\n考点难度●●难\n\n会计准则要求企业应当就所得税费用（或收益）与会计利润的关系在附注中进行说明，该说明目的是在利润表中已列示所得税费用的基础上，以当期会计利润为起点，考虑税会差异，计算所得税费用的过程。自会计利润到所得税费用之间的调整有两个方面：（1）未包括在利润总额的计算中，但包含在当期或递延所得税计算中的项目；（2）未包括在当期或递延所得税计算中，但包含在利润总额中的项目。\n\n点拨 同时影响应交所得税和递延所得税费用（或收益）的暂时性差异的项目无需调整。\n\n调整项目一般包括：\n\n①与税率相关的调整；\n\n②税法规定的非应税收人，不得税前扣除的成本费用和损失，或者可加计扣除的费用（如直接计人当期损益的研发费用按税法规定可加计扣除的金额）等永久性差异；\n\n③本期未确认递延所得税资产的可抵扣暂时性差异或可抵扣亏损的影响、使用前期未确认递延所得税资产的可抵扣亏损影响；\n\n④对以前期间所得税进行汇算清缴的结果与以前期间确认金额不同调整报告期间所得税费用等。\n\n【真题24·单选题】企业编制所得税费用与会计利润关系的附注时，下列不属于调整项目的是（ ）。（2025年回忆版）A.本期产生已确认递延所得税资产的可抵扣暂时性差异的影响B.利用前期未确认递延所得税资产的可抵扣亏损影响C.不可抵扣的费用影响D.子公司适用不同税率的影响\n\n解析 自会计利润到所得税费用之间的调整，具体调整项目一般包括：（1）与税率相关的调整（选项D);（2）税法规定的非应税收入、不得税前扣除的成本费用和损失（选项C），或者可加计扣除的费用等永久性差异；（3）本期未确认递延所得税资产的可抵扣暂时性差异或可抵扣亏损的影响、使用前期未确认递延所得税资产的可抵扣亏损影响（选项B);（4）对以前期间所得税进行汇算清缴的结果与以前期间确认金额不同调整报告期间所得税费用等。\n\n【真题25·多选题】企业编制所得税费用与会计利润关系的附注时，下列各项属于调整项目的有（ ）。（2025年回忆版）A.本期产生并已确认递延所得税资产的可抵扣暂时性差异的影响B.研发费用加计扣除的影响C.非应税收入的影响D.子公司适用不同税率的影响\n\n（解析）自会计利润到所得税费用之间的调整，具体调整项目一般包括：\n\n（1）与税率相关的调整（选项D正确）；\n\n（2）税法规定的非应税收入、不得税前扣除的成本费用和损失，或者可加计扣除的费用（如直接计入当期损益的研发费用按税法规定可加计扣除的金额）等永久性差异（选项B和C正确）；\n\n（3）本期未确认递延所得税资产的可抵扣暂时性差异或可抵扣亏损的影响、使用前期未确认递延所得税资产的可抵扣亏损影响（选项A错误）；\n\n（4）对以前期间所得税进行汇算清缴的结果与以前期间确认金额不同调整报告期间所得税费用等。\n\n【真题26·多选题】企业在披露所得税费用与会计利润关系的说明时，下列各项表述中属于调整项目的有（ ）。（2024年回忆版）A.本期确认上期未确认递延所得税资产的可抵扣亏损B.本期因预计未来不可利用可抵扣暂时性差异而转回上期确认的递延所得税资产C.本期发生的研发费用加计扣除D.本期计提并已确认递延所得税资产的固定资产减值损失\n\n解析）自会计利润到所得税费用之间的调整包括两个方面：一是未包括在利润总额的计算中，但包含在当期（选项C）或递延所得税（选项A和B）计算中的项目；二是未包括在当期或递延所得税计算中，但包含在利润总额中的项目。选项D，是包括在利润总额的计算中，同时也包含在递延所得税计算中的项目，计算应交所得税增加所得税费用，确认递延所得税资产减少所得税费用，最终不影响所得税费用总额，因此不属于调整项目。\n\n【真题27·多选题】企业在财务报表附注中披露自会计利润到所得税费用的调整过程，下列各项中，属于应调整的项目有（）。（2022年）A．税法规定的非应税收入B.子公司适用不同税率的影响C.税法规定的不可抵扣的成本、费用或损失D.使用前期未确认递延所得税资产的可抵扣亏损的影响\n\n（解题攻）调整项目一般包括：①与税率相关的调整；②税法规定的非应税收入、不得税前扣除的成本费用和损失、或者可加计扣除的费用（如直接计入当期损益的研发费用按税法规定可加计扣除的金额）等永久性差异；③本期未确认递延所得税资产的可抵扣暂时性差异或可抵扣亏损的影响、使用前期未确认递延所得税资产的可抵扣亏损影响；④对以前期间所得税进行汇算清缴的结果与以前期间确认金额不同调整报告期间所得税费用等。"}],"quizGroups":[{"type":"单项选择题","questions":[{"num":1,"text":"2×25年1月1日，甲公司递延所得税资产和递延所得税负债的账面余额为零。当日，甲公司以6000万元取得某项商标权，甲公司管理层判断无法合理估计该商标权的预计使用年限，从而将其作为使用寿命不确定的无形资产。2×25年12月31日，甲公司对该商标权进行减值测试的结果显示发生减值400万元。企业所得税法规定，企业取得商标权发生的成本6000万元按10年期限采用直线法摊销，摊销金额允许在当期税前扣除。甲公司适用的企业所得税税率为25%。不考虑其他因素，甲公司2×25年12月31日资产负债表中列报的递延所得税负债金额是（ ）万元。","options":[{"letter":"A","text":"50"},{"letter":"B","text":"100"},{"letter":"C","text":"150"},{"letter":"D","text":"250"}],"answer":"A","explanation":"2×25年12月31日，商标权的账面价值=6000-400=5600（万元），计税基础=6000-6000÷10×1=5400（万元），产生应纳税暂时性差异=5600-5400=200（万元），应确认递延所得税负债=200×25%=50（万元），选项A正确。"},{"num":2,"text":"甲公司适用的企业所得税税率为25%，预计未来期间能够产生足够的应纳税所得额用以抵减可抵扣暂时性差异。不考虑其他因素，甲公司2×25年度发生的下列各项交易或事项中，会对当期递延所得税产生影响的是（ ）。","options":[{"letter":"A","text":"采用权益法核算、拟长期持有的对联营企业投资因被投资单位其他综合收益变动确认其他综合收益200万元"},{"letter":"B","text":"为研发新项目发生研究阶段支出300万元，根据企业所得税法规定当期可以税前扣除的研究费用金额为600万元"},{"letter":"C","text":"收到销售商品合同预付款900万元，根据企业所得税法规定该款项应当计入当期应纳税所得额"},{"letter":"D","text":"自行研发无形资产初始确认金额为800万元，根据企业所得税法规定以后可以税前扣除的金额为1600万元"}],"answer":"C","explanation":"选项A，因拟长期持有权益法核算的长期股权投资形成的税会差异，不确认递延所\n得税；选项B，不产生暂时性差异，不确认递延所得税；选项C，合同负债账面价值为900万元，计税基础为0，应确认递延所得税资产 $= 9 0 0 \\times 2 5 \\% = 2 2 5$ （万元）；选项D，虽然产生可抵扣暂时性差异，但不确认递延所得税。"},{"num":3,"text":"甲公司于2×25年2月20日外购一栋写字楼并于当日对外出租，取得时成本为24000万元,采用公允价值模式进行后续计量。2×25年12月31日，该写字楼公允价值跌至22400万元。税法规定，该类写字楼采用年限平均法计提折旧，折旧年限为20年，预计净残值为0。甲公司适用的所得税税率为15%，预计未来期间不会发生改变。不考虑其他因素，2×25年12月31日甲公司因该项投资性房地产应确认的递延所得税资产是（）万元。","options":[{"letter":"A","text":"1600"},{"letter":"B","text":"-90"},{"letter":"C","text":"400"},{"letter":"D","text":"90"}],"answer":"D","explanation":"2×25年12月31日投资性房地产计税基础 $= 2 4 0 0 0 - 2 4 0 0 0 \\div 2 0 \\times 1 0 / 1 2 { = } 2 3 0 0 0$ （万元），账面价值为22400万元，资产账面价值小于计税基础，产生可抵扣暂时性差异，应确认递延所得税资 $\\vec { p } ^ { z } = \\left( \\ 2 3 0 0 0 - 2 2 4 0 0 \\right) \\ \\times 1 5 \\% = 9 0 \\ ( \\ \\mathcal { F } \\overrightarrow { \\pi } )$"},{"num":4,"text":"2×25年12月31日，甲公司因交易性金融资产和其他权益工具投资的公允价值变动，分别确认了100万元的递延所得税资产和160万元的递延所得税负债。甲公司当期应交所得税的金额为1200万元。假定不考虑其他因素，甲公司2×25年度利润表“所得税费用”项目应列示的金额是（）万元。","options":[{"letter":"A","text":"1300"},{"letter":"B","text":"1200"},{"letter":"C","text":"1260"},{"letter":"D","text":"1100"}],"answer":"D","explanation":"甲公司2×25年度利润表“所得税费用”项目应列示的金额=1200-100=1100（万元）。会计分录如下：\n借：所得税费用\n$$\n\\yen 3,456,7\n$$\n$$\n\\textcircled { 5 } : \\textcircled { 1 } \\textcircled { 3 } \\textcircled { < } \\textcircled { 6 } \\textcircled { 5 } \\textcircled { < } \\textcircled { < } \\textcircled { < } \\textcircled { < } \\textcircled { 5 } \\textcircled { 7 } \\textcircled { 1 } \\textcircled { < } \\textcircled { 7 }\n$$\n借：其他综合收益\n贷：递延所得税负债\n其他权益工具投资的公允价值变动确认的递延所得税负债或递延所得税资产对应的科目是其他综合收益，而不是所得税费用。"},{"num":5,"text":"甲公司2×23年度的会计利润为-800万元，按照税法规定允许用以后5年税前利润弥补亏损。甲公司预计2×24年至2×26年不考虑弥补亏损的每年应纳税所得额分别为200万元、300万元和360万元，假设适用的所得税税率始终为25%，且每年均按预期实现目标利润，无其他暂时性差异。甲公司2×26年有关递延所得税发生额的处理正确的是（）。","options":[{"letter":"A","text":"递延所得税资产借方发生额为75万元"},{"letter":"B","text":"递延所得税资产贷方发生额为75万元"},{"letter":"C","text":"递延所得税资产发生额为0"},{"letter":"D","text":"递延所得税资产贷方发生额为90万元"}],"answer":"B","explanation":"2×23年应确认递延所得税资产的金额=800×25%=200（万元）；2×24年转回递延所得税资产的金额 ${ \\bf - } 2 0 0 \\times 2 5 \\% = 5 0$ （万元）；2×25年转回递延所得税资产的金额=300×25%=75（万元），2×26年只需弥补亏损300万元（800-200-300），应转回递延所得税资产的金额 $= 3 0 0 \\times 2 5 \\% = 7 5$ （万元）。"},{"num":6,"text":"2×25年，甲公司实现利润总额210万元，包括：2×25年收到的国债利息收人10万元，因违反环保法规被环保部门处以罚款20万元。甲公司2×25年年初递延所得税负债余额为20万元，年末余额为25万元，上述递延所得税负债均产生于固定资产账面价值与计税基础的差异。甲公司适用的所得税税率为25%。不考虑其他因素，甲公司2×25年的所得税费用是（ ）万元。","options":[{"letter":"A","text":"52.5"},{"letter":"B","text":"55"},{"letter":"C","text":"57.5"},{"letter":"D","text":"60"}],"answer":"B","explanation":"本期因固定资产账面价值和计税基础不一致确认递延所得税负债5万元（25-20），即产生应纳税暂时性差异 $= 5 / 2 5 \\% = 2 0 ( \\overline { { \\mathcal { A } } } \\overline { { \\mathcal { D } } } )$ ，所以本期计算应交所得税时纳税调减20万元，即甲公司2×25年应
